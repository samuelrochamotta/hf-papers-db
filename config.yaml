# Configuracao do hf-papers-db.

paths:
  banco: "data/hfpapers.db"
  marts: "marts"
  prompts: "prompts"
  logs: "logs"
  relatorios: "relatorios"

hf:
  base_url: "https://huggingface.co"
  req_por_segundo: 5
  timeout_s: 30
  tentativas: 4
  backoff_inicial_s: 1

llm:
  base_url: "https://openrouter.ai/api/v1"
  referer: "https://github.com/samuelrochamotta/hf-papers-db"
  titulo_app: "hf-papers-db"
  timeout_s: 180
  prazo_total_s: 90
  concorrencia: 1
  esforco_raciocinio: &esforco "medium"
  estagio_a:
    modelo: "z-ai/glm-5.3-flash"
    temperatura: 0.0
    esforco_raciocinio: *esforco
    max_tokens: 2400
  estagio_b:
    modelo: "z-ai/glm-5.3-flash"
    temperatura: 0.2
    esforco_raciocinio: *esforco
    max_tokens: 8000
  provider:
    require_parameters: true
    preferidos: ["Together"]
  retry:
    tentativas: 3
    backoff_inicial_s: 2

refresh:
  janela_quente_dias: 30    # todo dia
  janela_morna_dias: 90     # semanal (segunda-feira)
  enriquecimento_semanal: true

guardrails:
  taxa_fora_min: 0.20
  taxa_fora_faixa_normal: [0.25, 0.47]
  aprovados_faixa_normal: [13, 40]
  aprovados_volume_alto: 45
  coletados_min_dia_util: 15
  prerequisito_nenhum_max: 0.15
  prerequisito_min_aprovados: 10

perfis:
  - perfil: produto
    rotulo: Produto
    prerequisitos: [nenhum, implementar]
  - perfil: pesquisa_treino
    rotulo: Treino/pesquisa
    prerequisitos: [acesso_interno, treino, sem_acao]

export:
  csv: false
  faixas_upvotes: [1, 10, 50, 100]
