# Configuracao do hf-papers-db.
# IDs de modelo do OpenRouter NAO sao chutados: rode
#   python -m hfpapers modelos listar
# e cole aqui os ids escolhidos (secao 4.2 do PROMPT).

paths:
  banco: "data/hfpapers.db"
  marts: "marts"
  prompts: "prompts"
  logs: "logs"
  relatorios: "relatorios"        # artefatos de leitura: painel.html

hf:
  base_url: "https://huggingface.co"
  req_por_segundo: 5
  timeout_s: 30
  tentativas: 4
  backoff_inicial_s: 1

llm:
  base_url: "https://openrouter.ai/api/v1"
  referer: "https://github.com/samuelrochamotta/hf-papers-db"
  titulo_app: "hf-papers-db"
  timeout_s: 180            # teto por chamada; sem isso uma conexão pendurada trava a rodada
  # chamadas simultâneas no estágio 3. Padrão 1 (sequencial, o caminho de
  # sempre): a rodada diária são ~30 papers e não ganha nada com paralelismo,
  # e rajada é o que dispara o 429/404 da issue #1. Quem precisa é a
  # reclassificação total: `reclassificar --tudo --concorrencia 4`. Teto: 8.
  concorrencia: 1
  # O GLM 5.3 flash raciocina de forma obrigatoria - `reasoning.enabled: false`
  # volta HTTP 400 -, e com o prompt da grade facetada (14 mil caracteres, 47
  # sub-areas definidas) ele gastava 2.343 tokens de rascunho para produzir 540
  # caracteres de JSON. Medido em 2026-09-08 com 140 papers e 420 chamadas:
  # `effort` derruba a saida para 220 tokens e a latencia de 174 s para 12 s,
  # sem mexer na classificacao - `low` e `medium` concordam entre si em 87% do
  # par area>sub-area, mais do que `low` concorda consigo mesmo (82%).
  esforco_raciocinio: &esforco "medium"
  estagio_a:
    modelo: "z-ai/glm-5.3-flash"
    temperatura: 0.0
    esforco_raciocinio: *esforco
    # Teto, nao gasto: chamada que produz 200 tokens continua custando 200.
    # Voltou de 6000 para 2400 junto com o `esforco_raciocinio`: em 420 chamadas
    # medidas a maior saida foi de 532 tokens, entao 2400 da 4,5x de folga.
    max_tokens: 2400
  estagio_b:
    modelo: "z-ai/glm-5.3-flash"
    temperatura: 0.2
    esforco_raciocinio: *esforco
    # Fica em 8000 ate ser medido: os 33% de truncamento vistos em 2026-09-08
    # sao de antes do `esforco_raciocinio`, e provavelmente somem com ele.
    max_tokens: 8000
  provider:
    require_parameters: true  # só roteia para provedores com saída estruturada
  retry:
    tentativas: 3
    backoff_inicial_s: 2

refresh:
  janela_quente_dias: 30    # todo dia
  janela_morna_dias: 90     # semanal (segunda-feira)
  # acima de 90 dias: congelado, sem refresh
  enriquecimento_semanal: true   # numTotal* da janela quente, via papers/{id}

guardrails:
  taxa_fora_min: 0.50
  taxa_fora_faixa_normal: [0.60, 0.80]
  aprovados_faixa_normal: [4, 9]
  aprovados_volume_alto: 12
  coletados_min_dia_util: 15

export:
  csv: false
  faixas_upvotes: [1, 10, 50, 100]   # bordas dos buckets: 0 | 1-9 | 10-49 | 50-99 | 100+
