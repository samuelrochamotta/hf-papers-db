# Configuracao do hf-papers-db.
# IDs de modelo do OpenRouter NAO sao chutados: rode
#   python -m hfpapers modelos listar
# e cole aqui os ids escolhidos (secao 4.2 do PROMPT).

paths:
  banco: "data/hfpapers.db"
  marts: "marts"
  prompts: "prompts"
  logs: "logs"
  relatorios: "relatorios"        # artefatos de leitura: painel.html, validacao_backfill.md
  estado: "data/estado"           # cache que alimenta a proxima etapa - nao apague

hf:
  base_url: "https://huggingface.co"
  req_por_segundo: 5
  timeout_s: 30
  tentativas: 4
  backoff_inicial_s: 1

llm:
  base_url: "https://openrouter.ai/api/v1"
  referer: "https://github.com/samuelrochamotta/hf-papers-db"
  titulo_app: "hf-papers-db"
  timeout_s: 180            # teto por chamada; sem isso uma conexão pendurada trava a rodada
  estagio_a:
    # trocado em 2026-09-02 via `hfpapers modelos listar --contem gemini`:
    # z-ai/glm-5.3-flash travava em timeout/truncamento; qwen/qwen3.8-flash
    # bateu rate-limit (429, pool compartilhado Alibaba) em 5 de 6 papers
    # (ver logs/run_manual_2026-09-02_135243.log). US$ 0,750 / 3,750 por
    # Mtok, contexto 1M, saída estruturada suportada.
    modelo: "google/gemini-3.7-flash"
    temperatura: 0.0
    max_tokens: 1200
  estagio_b:
    # saída estruturada suportada.
    # Não aceita `temperature`: o cliente omite o parâmetro para os modelos que
    # não o anunciam, senão `require_parameters` zera os provedores (404).
    modelo: "google/gemini-3.7-flash"
    temperatura: 0.2
    # 3000 (valor do PROMPT) corta o JSON no meio: modelos anteriores gastavam
    # orçamento de saída com raciocínio antes de responder. Mantido alto até
    # confirmar o comportamento deste modelo.
    max_tokens: 8000
  provider:
    require_parameters: true  # só roteia para provedores com saída estruturada
  retry:
    tentativas: 3
    backoff_inicial_s: 2

refresh:
  janela_quente_dias: 30    # todo dia
  janela_morna_dias: 90     # semanal (segunda-feira)
  # acima de 90 dias: congelado, sem refresh
  enriquecimento_semanal: true   # numTotal* da janela quente, via papers/{id}

taxonomia:
  max_areas: 10
  max_topicos: 24
  min_papers_novo_rotulo: 2
  max_topicos_por_paper: 5

guardrails:
  taxa_fora_min: 0.50
  taxa_fora_faixa_normal: [0.60, 0.80]
  aprovados_faixa_normal: [4, 9]
  aprovados_volume_alto: 12
  coletados_min_dia_util: 15

export:
  csv: false
  faixas_upvotes: [1, 10, 50, 100]   # bordas dos buckets: 0 | 1-9 | 10-49 | 50-99 | 100+
