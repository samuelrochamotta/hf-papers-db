[project]
name = "hf-papers-db"
version = "0.1.0"
description = "Camada de preparacao de dados dos HF Daily Papers para o painel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff==0.16.6",
    "types-PyYAML",
]

[project.scripts]
hfpapers = "hfpapers.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfpapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ entra no path por causa de gerar_painel.py: o painel nao e um
# modulo do pacote, mas a regra de ranqueamento do hall e logica de verdade
# e precisa de teste.
pythonpath = ["src", "scripts"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]  # `l` como nome de variavel e estilo, nao bug

[tool.ruff.lint.per-file-ignores]
# Scripts de medicao do painel v2, escritos densos de proposito.
"painel-v2/**" = ["E701", "E702", "E731"]

[tool.mypy]
files = ["src", "scripts"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
