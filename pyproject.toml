[project]
name = "hf-papers-db"
version = "0.1.0"
description = "Camada de preparacao de dados dos HF Daily Papers para o painel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff==0.16.6",
    "types-PyYAML==6.0.12.20261113",
]

[project.scripts]
hfpapers = "hfpapers.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfpapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: teste lento; o Stop hook (.claude/hooks/verificar_ao_parar.sh) pula com -m \"not slow\""]
# scripts/ e paineis/v1|v2 entram no path pelos testes dos scripts e dos
# geradores dos paineis: nao sao modulos do pacote, mas a regra de
# ranqueamento do hall e o export do v2 sao logica de verdade e precisam de teste.
pythonpath = ["src", "scripts", "paineis/v1", "paineis/v2"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
# Scripts de medicao do painel v2 sao densos de proposito (ver per-file-ignores).
exclude = ["paineis/v2/medir/**", "paineis/v2/scripts/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E741"]  # `l` como nome de variavel e estilo, nao bug

[tool.ruff.lint.flake8-bugbear]
# Padrao do typer: os defaults declaram a opcao da linha de comando.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Scripts de medicao do painel v2, escritos densos de proposito.
"paineis/v2/medir/**" = ["E701", "E702", "E731"]
"paineis/v2/scripts/**" = ["E701", "E702", "E731"]

[tool.mypy]
files = ["src", "scripts", "paineis/v1/gerar_painel.py", "paineis/v2/gerar_painel_v2.py"]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
