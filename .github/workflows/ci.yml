name: CI

# O push diario do painel (relatorios/) nao mexe em codigo; por isso fica fora
# do gatilho.
on:
  push:
    branches: [main]
    paths-ignore:
      - relatorios/**
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
