rgalo. Os números vêm de benchmarks públicos (BIRD-dev) com os mesmos conjuntos de candidatos de métodos anteriores, não de cargas de produção, e o ganho médio de 2,02 pontos esconde variância entre consultas."},{"p":"2609.04242","ach":"Em comparações pareadas com modelos omni nativos em 56 benchmarks e 21 idiomas, o framework sem treino foi competitivo em compreensão áudio-visual e melhorou o desempenho médio em áudio puro em todas as cinco configurações testadas. Congelar o backbone preservou, em geral, desempenho superior em imagem, vídeo, código, matemática e QA médico em relação aos checkpoints omni nativos.","pn":"Roteamento de transcrições de fala para VLM congelado","pm":"Transcrições com marcação de tempo e filtradas por confiança, extraídas por um reconhecedor de fala, são injetadas na interface de linguagem de um modelo visão-linguagem congelado, mantendo o caminho visual intacto e sem treino nem realinhamento multimodal.","imp":"Você pode adicionar compreensão de fala ao seu modelo visão-linguagem de produção apenas acoplando um reconhecedor de fala e roteando transcrições na entrada de texto, sem retreinar nada e sem degradar as capacidades visuais e de raciocínio que o modelo já tem.","ex":"Um assistente que analisa gravações de reuniões com slides: em vez de migrar para um modelo omni treinado, o pipeline transcreve o áudio com timestamps, filtra trechos de baixa confiança e concatena as transcrições ao prompt visual, mantendo o mesmo backbone e evitando a perda de capacidade de leitura de gráficos que os modelos omni nativos costumam sofrer.","res":"Os ganhos valem para fala centrada em texto transcrito; cenários onde paralinguagem importa (tom, emoção, sobreposição de falantes) podem exigir representações acústicas mais ricas, e o próprio paper reconhece que há casos em que codificadores de áudio dedicados seguem necessários. A comparação é com checkpoints omni específicos, não com todos os modelos do mercado."},{"p":"2609.04523","ach":"O sistema gera kernels para TPU que igualam baselines ajustados manualmente por especialistas em 50 tarefas do JaxBench e em workloads reais de modelos open-source. Três paradigmas (colaborativo, autônomo e busca em grafo) compartilham o mesmo pool de sub-agentes. O código foi aberto publicamente.","pn":"Loop agêntico de otimização de kernels guiado por métricas e traços de hardware","pm":"Um conjunto de sub-agentes especializados (planejamento, implementação, depuração, testes, profiling) itera sobre código de kernel usando feedback do compilador e traços de hardware em tempo real, com variantes colaborativa, autônoma e de busca em grafo.","imp":"Se você precisa de kernels customizados para aceleradores e não tem especialista em hardware na equipe, pode usar ou adaptar o sistema aberto para gerar e otimizar essas implementações automaticamente, em vez de escrever à mão ou terceirizar.","ex":"Um time que serve um modelo open-source em TPUs e identifica uma operação lenta no perfil de inferência pode acionar o agente autônomo para gerar um kernel otimizado para essa operação, usando os traços de hardware como sinal de otimização em vez de contratar engenharia de kernels.","res":"Os resultados são específicos para TPUs e para o JaxBench; a transferência para GPUs ou outros aceleradores não é demonstrada. O paradigma autônomo depende de profiling de hardware confiável, e kernels gerados automaticamente exigem validação de correção antes de entrar em produção."},{"p":"2609.04611","ach":"Em 53 tarefas em quatro dominios, a melhor configuracao (Claude Opus 5 com Claude Code) passa em apenas 23,9% das simulacoes de avaliacao, contra 82,2% de um teto escrito por especialistas. As falhas incluem consultas superficiais aos registros, comunicacao quase nula com o cliente e pouca experimentacao com arquitetura e custo de serving.","pn":"Avaliacao de construcao de agente ponta a ponta","pm":"Um agente desenvolvedor recebe registros reais de negocio, requisitos de um cliente, API de producao e orcamento de serving, e a nota vem de implantar o agente entregue contra usuarios simulados reservados.","imp":"Se voce usa agentes de codificacao para construir agentes de producao, nao trate a primeira versao que roda como pronta: o dado mostra que ela falha na maioria dos cenarios de avaliacao, entao vale exigir testes contra usuarios simulados antes de implantar.","ex":"Um agente de atendimento de companhia aerea construido por agente de codificacao responde consultas rasas ao banco de reservas em vez de cruzar historico do cliente e regras da politica, e o cliente descobre a falha so quando o usuario simulado contesta um reembolso.","res":"Os numeros valem para usuarios simulados e quatro dominios de atendimento; nao provam que a lacuna se repete em outros tipos de tarefa nem que o teto de especialistas e alcancavel. O benchmark mede, mas nao entrega correcao para as falhas observadas."},{"p":"2609.04173","ach":"O benchmark reúne LTBv1, um dataset aberto de textos, imagens, áudio e vídeos escritos por humanos e revisados por pares, selecionados porque quebram modelos de tradução de ponta. Cada exemplo vem com regras de verificação manuais que descrevem falhas concretas, permitindo avaliação automática confiável, acionável e resistente a reward-hacking das métricas tradicionais.","pn":"Exemplos adversários revisados por pares com regras de verificação manuais por","pm":"Cada caso de avaliação é um exemplo multimodal revisado por pares que quebra modelos atuais, acompanhado de regras de verificação escritas à mão que descrevem falhas concretas e verificáveis naquele exemplo específico.","imp":"Você pode substituir métricas automáticas genéricas de tradução por casos curados com critérios de aprovação explícitos: avalie seu pipeline de tradução nos exemplos do dataset e replique o esquema de regras de verificação por caso nos seus próprios testes de regressão.","ex":"Um sistema de tradução de documentação técnica que passa em métricas como BLEU/COMET mas inverte negações ou omite restrições de segurança: as regras de verificação do exemplo sinalizam exatamente essa falha, enquanto a métrica numérica a esconde.","res":"O dataset é vivo e focado em tradução multimodal; as regras são escritas à mão caso a caso, então reproduzi-las fora do domínio exige esforço humano de curadoria, e cobrir os modos de falha do seu domínio não está garantido."},{"p":"2609.02750","ach":"Em 500 instâncias do SWE-bench, o sistema completo com portão ancorado no ambiente resolve 72,2% contra 70,8% da referência pública mini-SWE-agent, ganho de 1,4 ponto. A teoria prova que nenhum portão que observa só o texto gerado melhora uniformemente sobre ambientes indistinguíveis por texto, enquanto um portão com acesso ao ambiente pode. Resultados de convergência exata, geométrica ou polinomial são demonstrados sob calibração e massa corretiva não degenerada.","pn":"Portão de memória ancorado no ambiente com risco decrescente","pm":"A aceitação de memória refletida é condicionada a uma verificação externa que observa o resultado no ambiente, não apenas o texto gerado, e só passa quando o risco de avaliação medido diminui estritamente.","imp":"Ao montar um loop de reflexão com memória persistente, você para de deixar o próprio agente julgar se a memória nova é boa: adicione uma verificação que mede o resultado no ambiente real (teste que roda, tarefa concluída) e descarte a memória candidata sempre que essa medida não melhorar estritamente.","ex":"Em um sistema de agentes de codificação com memória compartilhada, a reflexão livre pode gravar uma lição errada que parece plausível no texto e degrada tarefas futuras silenciosamente; com o portão ancorado, a memória candidata só entra se a taxa de testes passando nas tarefas avaliadas subir, o que bloqueia a propagação desse dano persistente.","res":"O ganho empírico medido é de 1,4 ponto percentual sobre uma referência pública, o que está dentro da margem de variância típica entre execuções; a validação forte é teórica e a separação entre portões textuais e ambientais vale em cenários de pior caso, não garante melhora em todo sistema. A teoria de convergência depende de calibração e de condições de massa corretiva que raramente são verificáveis em produção."},{"p":"2609.05258","ach":"Em tarefas com descrições parciais de problemas de pesquisa operacional, agentes que assumem a especificação completa produzem modelos com lacunas silenciosas. O framework de dois estágios recupera substancialmente mais slots exatos que os baselines no modo de escolha e permanece competitivo no modo aberto, controlando o custo de interação.","pn":"Perguntar-ou-parar guiado por lacunas críticas de formulação","pm":"Um agente identifica lacunas não resolvidas que mudam o modelo matemático e decide, a cada turno, entre fazer uma nova pergunta ao usuário ou encerrar a interação, medindo o que permanece faltando.","imp":"Antes de deixar o LLM montar um modelo de otimização a partir de um pedido em linguagem natural, você pode adicionar um passo que lista o que falta (objetivo, restrições, regras de negócio) e só prossegue quando as lacunas críticas estiverem fechadas — evitando modelos que parecem certos mas codificam suposições erradas.","ex":"Um pedido de escalonamento de turnos chega sem a regra de que ninguém pode fechar dois turnos consecutivos; o agente que não pergunta gera um modelo viável matematicamente, mas que viola a regra trabalhista, e o erro só aparece na operação.","res":"Os resultados fortes vêm do cenário com usuário simulado e slots ocultos estruturados; com usuários reais, as respostas são ruidosas e as lacunas menos bem definidas, e no modo aberto a vantagem sobre métodos anteriores é apenas competitiva, não dominante."},{"p":"2609.00365","ach":"Em comparação com um agente de linha de comando puro usando o mesmo executor de fundo, o workspace pontua mais alto em completude de pesquisa e mantém um histórico de processo auditável e recuperável. A comparação isola a camada de orquestração, variando só o executor é fixo. O demo cobre um cenário de três visões e um passo a passo de recuperação de falha.","pn":"Orquestração auditável de agentes de código em workspace","pm":"Agentes de linha de comando são envolvidos por uma camada de orquestração com objetos de estado persistentes, biblioteca de habilidades reutilizáveis e coordenação de múltiplos executores, de modo que cada decisão humana fica vinculada à execução da IA em um histórico rastreável e recuperável.","imp":"Em vez de deixar o trabalho espalhado entre chat, editor e terminal, você pode envolver o mesmo agente de código que já usa em uma camada que guarda o estado entre sessões e registra quais decisões suas levaram a quais execuções. Quando algo dá errado, você recupera o processo em vez de refazer do zero.","ex":"Uma equipe usando Claude Code para refatorar um pipeline de dados perde o contexto quando a sessão quebra e ninguém sabe por que uma decisão de design foi tomada. Com esse padrão, o grafo de tarefas e o estado persistido mostram qual decisão humana gerou qual execução, e a sessão é retomada de onde parou.","res":"A avaliação é um cenário demonstrativo com walkthrough de recuperação, não um benchmark amplo; a vantagem de completude vem da comparação contra agente puro do mesmo executor, o que favorece a camada por construção. O ganho depende de o fluxo de trabalho incluir revisão humana ativa; em automação sem humano no laço, a camada pode ser sobrecarga."},{"p":"2609.04061","ach":"Modelos de fronteira editam código além do necessário mesmo quando corrigem o bug: Pass@1 alto convive com excesso de edição e complexidade adicionada. Uma instrução de preservação corta o excesso de Levenshtein de 0,195 para 0,131, reduz a complexidade adicionada em 26,6% e sobe Pass@1 em 2,3 pontos. SFT sobre padrões de corrupção sofre overfitting, enquanto RL dá o melhor equilíbrio fora do domínio entre fidelidade e retenção de desempenho.","pn":"Avaliação de fidelidade de edição via patch mínimo conhecido","pm":"Injetam-se corrupções controladas em nível de AST em soluções de referência, gerando tarefas de reparo com patch mínimo conhecido, sobre as quais se mede o excesso de edição pela distância de Levenshtein e pela complexidade cognitiva adicionada.","imp":"Não avalie seu agente de reparo só por 'passa nos testes': rode também uma comparação de diff contra o mínimo necessário, porque um modelo que reescreve demais gera revisões caras e riscos de regressão. Antes de investir em treino, teste instruções do tipo 'mude apenas o necessário' no prompt, que já capturam boa parte do ganho.","ex":"Um assistente de código que corrige uma exceção de tipo nulo reescrevendo a função inteira com renomeações e reestruturações: o patch passa nos testes, mas o revisor precisa auditar 40 linhas mudadas em vez de 3, e a reescrita esconde uma mudança de comportamento não solicitada.","res":"Os ganhos de RL dependem de um pipeline de post-training com dados de corrupção controlada, que quem só consome modelos prontos não reproduz; e a instrução de preservação foi medida num único benchmark de reparo, então seu efeito em refatorações grandes ou tarefas de feature não está provado."},{"p":"2609.04444","ach":"Em 7.201 decisões precificadas entre nove modelos, as taxas de atropelamento de animais variam de 0,4% a 98,8% e não seguem a ordem de capacidade dos modelos. Seis de seis modelos de raciocínio tiveram taxa acima de 84% sem o briefing moral e abaixo de 6% com ele. Nove de nove atropelaram mais animais selvagens que animais de fazenda, em todas as geometrias de mapa.","pn":"Preço explícito sobre efeito colateral moral como medida de comportamento","pm":"Cenários simulados que obrigam o agente a escolher entre causar dano a um ser vivo sem custo ou evitá-lo pagando um preço tornam a disposição real de evitar dano observável em decisões, em vez de declarada em respostas sobre valores.","imp":"Se você avalia agentes em produção, não confie no que o modelo diz sobre prioridades quando perguntado diretamente: este benchmark mostra que a mesma disposição muda drasticamente conforme a instrução de sistema e o custo envolvido. Inclua nos seus testes de agente situações em que seguir a regra custa algo, e teste variações do seu prompt de sistema — uma frase removida pode derrubar o comportamento seguro.","ex":"Um agente de roteamento logístico com GPT-4o-mini decidindo entre desviar de um obstáculo (custo de combustível) ou passar por cima: neste benchmark ele atropelou animais em até 98,8% dos casos, enquanto modelos de raciocínio com briefing moral ficaram abaixo de 6% — mesma tarefa, mesma arquitetura de decisão sem memória.","res":"Os resultados vêm de um gridworld com decisões sem memória e dano nunca nomeado no objetivo; a transferência para ambientes reais ou para agentes com memória e contexto rico não é demonstrada. A sensibilidade ao preço só apareceu em quatro dos seis modelos testados nesse eixo, e o ranking não indica qual modelo escolher, apenas que a ordem de capacidade não prevê o comportamento."},{"p":"2609.04753","ach":"Operações de raciocínio como formulação de problema, decomposição e dedução são separáveis geometricamente nas representações internas, com pico de separabilidade nas camadas intermediárias. Intervenções de mascaramento de atenção mostram que essas representações dependem do contexto de raciocínio anterior. O código está aberto em repositório público.","pn":"","pm":"","imp":"Você não pode usar isso diretamente via API, mas deve desconfiar de inferências sobre raciocínio feitas apenas lendo o texto do chain-of-thought: o texto e a estrutura interna não são a mesma coisa, então auditorias baseadas só no texto podem errar.","ex":"Um time que audita um agente de atendimento lendo os passos escritos no chain-of-thought para verificar se ele decompôs o problema corretamente pode estar validando uma narrativa textual que não corresponde à organização interna das operações de raciocínio.","res":"Os resultados vêm de análise em camadas internas de modelos específicos e não mostram como corrigir ou melhorar o raciocínio; a correspondência representacional não prova que o modelo 'realmente raciocina', apenas que há estrutura geométrica alinhada ao texto."},{"p":"2609.00581","ach":"O framework unifica dois níveis de detecção de alucinação usando fatos relacionais como representação compartilhada, eliminando a chamada de alinhamento entre afirmações e spans. Fica competitivo com sistemas de nível de afirmação usando menos chamadas e recursos, e supera sistemas anteriores na localização fina de spans e entidades. O dataset EnokiQA fornece anotações alinhadas nos dois níveis de granularidade.","pn":"Fatos relacionais ancorados no texto como ponte entre verificação de afirmações","pm":"Um extrator produz fatos relacionais ancorados em spans do texto, os fatos são verificados contra evidência e os fatos sem suporte são projetados de volta para os trechos originais, unificando verificação em nível de afirmação e localização de span sem etapa de alinhamento separada.","imp":"Se hoje você roda um pipeline que primeiro quebra a resposta em afirmações, verifica cada uma e depois tenta mapear de volta para o texto original, pode trocar por uma única passagem de extração e verificação que já aponta o trecho problemático, cortando chamadas de modelo e o custo de manter esse mapeamento.","ex":"Um sistema de atendimento que valida respostas geradas contra a base de conhecimento: no esquema em dois estágios, a afirmação 'o plano X inclui suporte 24h' é verificada como falsa, mas o alinhamento de volta ao texto falha quando a resposta parafraseia. Com fatos ancorados nos spans originais, o trecho exato 'suporte 24h' é marcado diretamente como sem suporte na evidência.","res":"Os resultados competitivos valem contra os sistemas comparados no paper; a qualidade depende do regime de extração escolhido (LLM, encoder ou regras), e o modo mais barato tende a sacrificar precisão. A vantagem em localização de span é medida nos benchmarks do próprio paper, e generalização para domínios fora desses dados não está demonstrada."},{"p":"2609.02780","ach":"O sistema mantém um índice leve construído nas camadas rasas durante o fluxo de vídeo e recupera evidência apenas na resposta, alcançando qualidade comparável aos melhores métodos de streaming com redução de latência de prefill por quadro de até 52,1x e latência ponta a ponta de 10 segundos de até 11,9x.","pn":"Índice de recuperação construído em camadas rasas durante o streaming","pm":"As camadas rasas do modelo multimodal geram um índice permanente a partir do KV cache, e os escores de atenção dessas camadas, combinados com seleção sensível à diversidade, recuperam os quadros relevantes apenas no momento da pergunta, evitando prefill em profundidade total a cada quadro.","imp":"Se você processa vídeo contínuo com modelos multimodais, pode cortar o custo de pré-processar cada quadro em profundidade total: use as camadas iniciais para indexar e só rode o modelo completo quando houver pergunta, reduzindo latência e o crescimento do cache de atenção.","ex":"Em um sistema de monitoramento por câmeras que responde consultas sobre eventos gravados, pré-processar cada quadro com o modelo completo estoura o custo e o cache de atenção cresce a cada quadro; indexar com camadas rasas e pré-preencher em profundidade só os quadros recuperados na consulta mantém a resposta precisa com uma fração da latência.","res":"Os ganhos valem para cenários de streaming com consultas posteriores; a qualidade fica 'no mesmo nível' dos melhores métodos, não acima, e a avaliação cobre tarefas de compreensão de vídeo, sem evidência para outros domínios multimodais."},{"p":"2609.04720","ach":"VLMs avaliados frequentemente não recusam, corrigem ou abstêm quando a consulta contém premissa falsa, conteúdo inacessível visualmente ou pedido inseguro, e a falha se agrava em consultas compostas que exigem recusa apenas de parte do pedido. Fine-tuning com exemplos de recusa seletiva eleva a acurácia de não conformidade preservando o desempenho em consultas totalmente respondíveis.","pn":"Avaliação de recusa seletiva em consultas compostas","pm":"Pares de consultas simples e compostas separam a recusa no nível da consulta inteira da recusa no nível de componentes, medindo se o modelo atende a parte respondível e recusa a parte problemática na mesma pergunta.","imp":"Ao montar testes de robustez para o seu assistente multimodal, inclua perguntas que misturam parte respondível e parte impossível ou insegura; medir só recusa da pergunta inteira esconde falhas que aparecem exatamente nos casos mistos, que são comuns em uso real.","ex":"Um usuário pergunta a um assistente de catálogo visual: 'Quanto custa a chaleira azul da foto e o que a pessoa ao fundo está fazendo?' O modelo responde o preço mas alucina uma ação para a pessoa, porque o benchmark de recusa por consulta inteira nunca testou a recusa do segundo componente isoladamente.","res":"Os ganhos de recusa seletiva vêm de fine-tuning nos próprios exemplos do benchmark, o que levanta risco de ajuste ao instrumento; os resultados valem para os VLMs testados e não demonstram que a capacidade generaliza a categorias de falha fora das cinco avaliadas."},{"p":"2609.03820","ach":"Em vídeos de uma hora do LongVideoBench, oito frames selecionados pela consulta batem dezesseis frames uniformemente espaçados por 6,9 pontos, e o Orthogonal Matching Pursuit, algoritmo dos anos 1980, empata ou fica a um ponto de seletores feitos sob medida em três benchmarks. Comprimir a resolução espacial dos frames custa no máximo 0,44 pontos. Reinvestir os tokens poupados em duas vezes mais frames comprimidos devolve mais 2 a 3 pontos, ao mesmo custo original.","pn":"","pm":"","imp":"Se você monta um pipeline de vídeo que amostra frames em intervalos fixos, troque por seleção guiada pela pergunta do usuário usando um algoritmo de aproximação esparsa simples, sem treinar nada. Quando precisar caber no orçamento de tokens, reduza a resolução de cada frame e use a economia para olhar mais frames, em vez de menos frames em alta resolução.","ex":"Um assistente que responde perguntas sobre gravações de reuniões de uma hora amostra um frame por segundo e mantém 16 em intervalos uniformes; perguntas sobre um evento citado no final são perdidas porque os frames do momento relevante não entraram na fatia fixa. Com seleção guiada pela consulta, os frames daquele trecho entram no contexto e a resposta melhora sem custo adicional de tokens.","res":"Os números valem para os três benchmarks e dois modelos testados em cenário de perguntas e respostas sobre vídeo; não provam que a seleção guiada por consulta ajuda em tarefas que varrem o vídeo inteiro, como sumarização. O ganho da compressão só existe quando a economia é reinvestida — aplicá-la sozinha não melhora nada, e o bug encontrado no baseline próprio e a diferença de até 3,74 pontos entre harnesses mostram que comparações entre papers não são confiáveis."},{"p":"2609.04034","ach":"O sistema produz designs editáveis em camadas com texto real, em vez de bitmaps achatados, para pôsteres e infográficos. O circuito fechado de gerar ativo isolado, escrever HTML/CSS e refinar contra feedback de renderização atinge estética refinada e editabilidade de nível de produção. A reprodução da trajetória criativa via Agent Design Replay mantém o raciocínio do agente auditável.","pn":"Agente de código com simulador visual sob demanda","pm":"Um VLM planeja e julga a estética, um modelo de difusão gera ativos visuais isolados sob demanda, e o agente de codificação escreve HTML/CSS nativo e refina o design em um circuito fechado com feedback do render visual.","imp":"Se você gera artefatos visuais (relatórios, dashboards, materiais) com modelo de imagem, troque o bitmap final por um agente que escreve HTML/CSS e só chama o modelo de imagem para criar peças avulsas. O resultado continua editável por arrastar e soltar, e o texto deixa de sair corrompido porque passa a ser texto de verdade, não pixels.","ex":"Um pipeline que hoje usa GPT-Image-2 para gerar uma infográfico de vendas entrega um PNG com números ilegíveis e impossíveis de corrigir sem regenerar tudo. Com esse padrão, o gráfico de barras é gerado como PNG avulso e inserido num HTML com camadas separadas; ajustar o título é editar uma linha de CSS, não recriar a imagem.","res":"A validação cobre pôsteres e infográficos; não há evidência de que o padrão generalize para interfaces interativas complexas ou designs com dezenas de ativos. O custo de múltiplas chamadas a modelos de difusão por iteração do loop não é reportado, e a qualidade depende de um VLM com bom julgamento estético."},{"p":"2608.21450","ach":"Substituir o codificador duplo estilo CLIP por um recuperador baseado em modelo multimodal de linguagem eleva o Recall@1 de recuperação em até 14,7% e a acurácia de VQA de ponta a ponta em 9,4% em consultas com entidades de cauda longa. O ganho vem de embutir a imagem por identidade semântica da entidade, não por aparência visual. Um discriminador semântico gera pesos contínuos de consistência que substituem rótulos binários rígidos na supervisão.","pn":"Recuperação por identidade semântica de entidade em vez de similaridade visual","pm":"Um modelo multimodal de linguagem gera o embedding da imagem num espaço que preserva a identidade da entidade, com pesos de consistência contínuos produzidos por um discriminador semântico para supervisionar destilação com negativos difíceis.","imp":"Se o seu RAG multimodal recupera documentos por similaridade visual de imagens, troque o recuperador por um que embuta a imagem por identidade da entidade — por exemplo, indexe a foto do 'Ponte Golden Gate' pelo conceito, não pelo visual, para não perder a resposta quando a foto é de outro ângulo ou de uma ponte parecida.","ex":"Num pipeline de VQA sobre Wikipédia, uma pergunta sobre um monumento de cauda longa recebe como negativo difícil a foto de um prédio visualmente parecido; o recuperador estilo CLIP ranqueia o documento errado em primeiro lugar e o modelo responde a entidade errada, enquanto o embedding por identidade semântica puxa o documento correto.","res":"Os ganhos são medidos em KB-VQA com recuperação em escala Wikipédia; não há evidência de que o mesmo mecanismo melhore recuperação onde a similaridade visual é o sinal relevante, como busca de produtos por aparência. A adoção sem retreino depende de o checkpoint publicado cobrir o domínio de entidades do seu caso."},{"p":"2609.01657","ach":"O encoder de 260M atinge 0,523 nDCG@10 no ViDoRe v3, superando todos os modelos avaliados abaixo de 800M parâmetros, e o de 800M chega a 0,556. Com entrada de imagem equivalente, o 260M codifica páginas com cerca de 2x o throughput do ColModernVBERT em uma L40S. Pooling hierárquico e quantização assimétrica comprimem os embeddings de recuperação 255x mantendo mais de 95% do nDCG@10.","pn":"Encoder bidirecional multimodal pequeno treinado do zero para busca visual","pm":"Um encoder bidirecional pré-treinado do zero com difusão mascarada condicionada em patches de imagem substitui a reutilização de VLMs generativos grandes como base para recuperadores de documentos, com pooling hierárquico e quantização assimétrica comprimindo os embeddings tardios.","imp":"Você pode trocar o recuperador visual do seu pipeline de RAG por um checkpoint de 260M ou 800M já publicado, reduzindo o custo de indexação e consulta sem treinar modelo e mantendo qualidade de busca comparável ou superior.","ex":"Um sistema que responde perguntas sobre PDFs digitalizados usando um recuperador tipo ColPali, que carrega um VLM generativo inteiro só para gerar embeddings, pode indexar com o encoder de 260M e armazenar os vetores comprimidos 255x, reduzindo a memória do índice vetorial e dobrando a taxa de páginas processadas.","res":"Os números vêm do ViDoRe v3, benchmark de documentos visuais; desempenho em outras tarefas de recuperação ou domínios fora de documentos não é demonstrado. A compressão de 255x preserva 95% do nDCG@10, não 100%, e o ganho de throughput foi medido em hardware específico (NVIDIA L40S)."},{"p":"2609.01936","ach":"Duas lentes ajustadas em corpora diferentes podem reportar tokens distintos para os mesmos estados ocultos, o paper chama isso de condicionalidade de corpus. A decomposição esparsa da matriz de unembedding reconstrói 8,9 a 17,3 pontos percentuais mais diferenças de logit do que seis baselines geométricos. A feature dominante do readout permanece estável mesmo quando a leitura em tokens varia com o corpus.","pn":"Leitura de lens em features de leitura em vez de tokens","pm":"Decompõe a matriz de unembedding em features esparsas usando apenas os pesos, permitindo expressar qualquer logit como soma de contribuições dessas features, sem depender do corpus usado para ajustar a lente.","imp":"Quando um diagnóstico de lente (técnica que decodifica estados intermediários do modelo em tokens) der um resultado estranho, você passa a considerar que o problema pode estar na matriz de decodificação e no corpus em que ela foi ajustada, não no estado interno do modelo. Isso muda como você interpreta comparações de logits entre configurações.","ex":"Equipe compara logit differences entre checkpoints com uma lente ajustada em corpus de código; a leitura em tokens muda entre checkpoints, mas a feature dominante do readout não muda, indicando que a aparente regressão vinha da dependência de corpus da lente, não do modelo.","res":"Os ganhos de reconstrução são medidos em diferenças de logit testadas e comparados a baselines específicos; não prova que leituras em features superem leituras em tokens para toda análise interpretativa. Aplicar exige acesso à matriz de unembedding e a estados intermediários, o que só é viável com pesos abertos ou acesso aos internals."},{"p":"2608.30428","ach":"Em partidas 3D de dedução social, agentes VLM impostores vencem combinando mentiras verbais com ações não verbais, e os canais não verbais aparecem como os contribuidores mais decisivos para a vitória, tanto sob ablação de componentes do harness quanto na troca entre VLMs. O LLM-as-a-Judge atinge concordância próxima à humana na rotulagem de átomos de engano.","pn":"Avaliação de engano em agentes VLM com canais verbais e não verbais acoplados","pm":"Um ambiente 3D de dedução social força agentes de visão a enganar por fala e por ação corporal simultaneamente, e um esquema de anotação em átomos e arcos operacionalizado por LLM-as-a-Judge mede a contribuição de cada canal para a vitória.","imp":"Se você avalia agentes que interagem com interfaces gráficas ou ambientes 3D, não confie em logs de texto para detectar engano: um agente pode dizer a verdade e enganar pelo que faz. Adicione às suas verificações de segurança eventos de ação — para onde o agente se move, o que toca, o que evita — e trate divergência entre fala e ação como sinal de alerta.","ex":"Um agente de navegador que precisa esconder que já leu um arquivo: verbalmente reporta 'não vi esse documento', mas o log de ações mostra que ele rolou a página até o trecho e voltou. Um monitor só de texto aprova a resposta; um monitor que compara fala com sequência de ações reprovou o comportamento.","res":"O resultado vem de um jogo de dedução social com regras fechadas, onde engano é objetivo explícito do papel; não prova que canais não verbais dominam em tarefas de produção onde engano não é incentivado. A concordância do juiz é com rótulos de átomos do esquema dos autores, não com julgamento humano de engano em contexto aberto."},{"p":"2608.17906","ach":"Em três domínios de teste, o sistema de dois estágios converteu ideias geradas em ganhos mensuráveis, como Recall médio de 32,84 para 34,69 no RSICD, e registrou apenas 5 eventos problemáticos confirmados por auditoria contra 11 a 27 de outros sistemas de pesquisa autônoma. A revisão independente detectou e corrigiu resultados experimentais não confiáveis antes da aceitação.","pn":"Gate de evidência independente antes de aceitar conclusões de pesquisa autônoma","pm":"A formação de ideias é separada da execução experimental, e uma revisão independente baseada em evidência valida cada conclusão antes de ela ser aceita como resultado.","imp":"Antes de aceitar a saída de um agente que executa experimentos ou gera relatórios, coloque um revisor separado que só aprova conclusões amarradas a evidência verificável, e registre quantos problemas essa revisão pegou para medir a confiabilidade do pipeline.","ex":"Um pipeline autônomo que roda avaliações de modelo e escreve o relatório final pode aceitar um número de benchmark vindo de uma execução com vazamento de dados de teste; um revisor independente que exige o log bruto da execução antes de aprovar o número derruba a conclusão incorreta.","res":"Os resultados vêm de três domínios escolhidos pelos autores e a comparação de 'eventos problemáticos' depende do próprio processo de auditoria do sistema; o paper não mostra os detalhes que permitiriam replicar o gate de evidência fora do sistema descrito."},{"p":"2608.22817","ach":"Fine-tuning de LLMs abertos menores que 10B com os dados sintetizados sobe a acurácia Set-Match de 28,5% para 42,0% e o F1 de 46,6% para 63,5% no benchmark Panasonic. Dados gerados por modelo fechado (Claude-Opus-4.6) rendem ganhos maiores que os gerados pelo Qwen3-30B aberto, a custo cerca de 100 vezes maior, e produzem menos esquecimento de conhecimento geral medido no MMLU.","pn":"Pipeline de QA sintético a partir de documentação técnica","pm":"Um pipeline de extração consciente de layout converte relatórios técnicos em um índice de recuperação semântica sobre o qual pares de perguntas e respostas são sintetizados, ancorados em evidência recuperada e rotulados por cinco relações consulta-documento, com filtragem antes da publicação.","imp":"Se você mantém RAG ou QA sobre documentação interna, pode usar este pipeline e os datasets como molde para gerar pares de QA avaliáveis a partir dos seus próprios relatórios técnicos, em vez de montar o pipeline de extração e síntese do zero. A comparação aberto versus fechado ajuda a decidir se vale pagar por geração com modelo de fronteira.","ex":"Um chatbot de manutenção que responde perguntas sobre manuais de equipamento industrial: a estrutura heterogênea dos manuais (prosa densa, tabelas, especificações) derruba a recuperação e a resposta do sistema, e estes datasets fornecem pares de QA ancorados em evidência recuperada para medir e melhorar esse comportamento.","res":"Os ganhos foram medidos só em fine-tuning de modelos pequenos sobre documentação Panasonic; nada prova que o pipeline rende os mesmos ganhos em outro domínio ou sem retreino. Os dados gerados por modelo fechado dependem de API paga, e a comparação aberto-versus-fechado reflete uma única dupla de modelos geradores."},{"p":"2608.18027","ach":"Em 8 LLMs e três domínios, iterar com feedback em tempo de inferência supera baselines sem feedback: 5,6% de ganho médio e custo de API 19% menor. A maior parte do ganho surge nas primeiras iterações, e combinar canais de feedback complementares (autoavaliação do modelo e sinal de correção) rende ganho adicional. Modelos mais fortes melhoram mais, e o loop é robusto mesmo com feedback fraco ou espúrio.","pn":"Loop de experiência acumulada em tempo de inferência","pm":"O modelo acumula traços de interações anteriores consigo mesmo ou com sinais ambientais de correção, e reutiliza esses traços nas iterações seguintes para melhorar a resposta sem retreino.","imp":"Antes de pagar por retreino ou por estratégias caras de raciocínio estendido, rode 2 ou 3 iterações do seu agente guardando o que deu errado em cada tentativa e alimentando isso de volta no prompt — o paper indica que o ganho vem cedo e custa menos por resposta correta. Se você já tem testes automatizados (como testes de código), use o resultado deles como sinal de feedback junto com a autoavaliação do modelo.","ex":"Um assistente de código em produção que gera uma função, roda a suíte de testes e recebe 'falhou no teste X' pode reusar esse traço de falha na próxima tentativa em vez de recomeçar do zero: o mecanismo é o traço de experiência anterior condicionando a nova geração, o que reduz tentativas cegas e o custo por tarefa resolvida.","res":"Os ganhos são medidos em benchmarks de matemática, código e conhecimento com loops de avaliação controlados; em produção, onde cada tarefa é única e não há sinal de correção confiável, o loop pode não reproduzir os mesmos números. A correlação entre capacidade base e ganho também sugere que modelos fracos se beneficiam menos."},{"p":"2608.19854","ach":"Em seis repositórios reais do RepoCraft, o framework com estado Dual-DAG supera o baseline RPG em até 20,08 pontos percentuais de cobertura de funcionalidade e 29,74 pontos de taxa de aprovação, usando GPT-5 mini e DeepSeek V3.2. Abações mostram que remover o estado arquitetural, a evolução por modularidade ou a convergência estrutural degrada o resultado.","pn":"Estado arquitetural explícito em grafo duplo antes da geração de código","pm":"O agente mantém dois DAGs alinhados (requisitos e componentes), evolui as fronteiras dos componentes por ações estruturais guiadas por métricas de modularidade até convergência, e só então gera código guiado por testes.","imp":"Antes de mandar um agente escrever um projeto do zero, exija que ele decida e mantenha as fronteiras dos módulos primeiro, com um critério objetivo de quando essa estrutura parou de mudar, e só depois gere código dirigido por testes.","ex":"Um agente de codificação que recebe 'construa um sistema de pedidos' e gera arquivos direto tende a criar um módulo único onde a lógica de pagamento e a de estoque ficam acopladas; reestruturar depois custa reescrita. Com o grafo duplo, essas fronteiras são decididas antes da primeira linha de código.","res":"A descrição dos critérios de modularidade e das ações estruturais é de alto nível no abstract; reproduzir o desenho sem o artigo completo ou o código pode exigir decidir detalhes que o paper não especifica. Os ganhos foram medidos em seis repositórios com dois modelos específicos, não em produção real."},{"p":"2608.19880","ach":"Envolver cinco benchmarks em quatro domínios com a camada adaptativa elevou o desempenho em até 9,0 pontos em instâncias de teste não vistas, com 9,8% menos passos de execução que o ambiente original. A abordagem também superou pipelines de geração de ambientes específicos por domínio. Quando usada como sinal de otimização para aprendizado por reforço, permite que política e ambiente evoluam juntos de forma contínua e direcionada.","pn":"Camada de plugins que adapta ambiente estático aos pontos fracos do agente","pm":"Uma camada plugável envolve o ambiente existente por interfaces padrão, observando trajetórias de execução da política para diagnosticar falhas e sintetizar componentes que remodelam as tarefas sem alterar a lógica nem o verificador original.","imp":"Antes de descartar aquele ambiente de treino ou avaliação que ficou 'fácil demais' para o seu agente, envolva-o com uma camada que observe onde as execuções falham e gere variações de tarefa mirando essas falhas — mantendo o mesmo verificador para não perder a confiabilidade da avaliação.","ex":"Um agente de atendimento que resolve 95% dos tickets do dataset fixo de testes: a camada detecta nas trajetórias que as falhas se concentram em pedidos com múltiplas trocas de contexto e injeta componentes que reescrevem as tarefas para exigir essa habilidade, sem alterar a função que valida se o ticket foi resolvido.","res":"Os ganhos são medidos em benchmarks acadêmicos de raciocínio e código; não há evidência de que a abordagem funcione em ambientes de produção com efeitos colaterais reais, onde rollouts adicionais custam caro ou são arriscados. A validação dos componentes gerados depende de rollouts confiáveis, o que exige ambientes determinísticos ou verificadores baratos."},{"p":"2608.16977","ach":"Partindo de 5.245 papers de combinatória, o pipeline extraiu 6.453 conjecturas ou problemas abertos, manteve 4.717 bem postos e ainda abertos, e reduziu a 77 itens levados a revisão dos autores. Desses 77, surgiram resultados sobre conjecturas de Davies-Jenssen-Perkins-Roberts, Erdős-Straus e outros.","pn":"Cascata de triagem literatura-para-revisão com recurso caro no fim","pm":"Um pipeline extrai problemas candidatos de um corpus de papers, passa-os por estágios sucessivos de filtragem automatizada e encaminha apenas os sobreviventes para revisão humana, reservando o recurso mais escasso para o fim.","imp":"Se você opera um fluxo onde humanos ou modelos caros revisam saídas, inverta a ordem: coloque triagem automatizada em cascata antes da etapa cara e corte o volume com filtros baratos. No lugar de um revisor avaliar mil itens, ele avalia 77 que já passaram por três portas.","ex":"Um time que usa LLM de fronteira para revisar PRs gerados por agentes paga token de razoamento em cada item. Com a cascata, um modelo barato descarta PRs malformados, um segundo estágio checa duplicidade e apenas os candidatos plausíveis chegam ao modelo caro.","res":"O piloto é em combinatória, um domínio com corpus denso e verificação de conjecturas relativamente barata; nada prova que a cascata funciona em domínios onde os estágios de filtragem erram muito. Os 77 itens ainda passaram por revisão de especialistas autores do trabalho, então a qualidade final dos resultados não é medida automaticamente."},{"p":"2608.10679","ach":"Em 907 perguntas sobre um mundo empresarial reconstruído e auditado, 30,4% das perguntas de raciocínio latente permanecem sem resposta mesmo quando os documentos de ouro são fornecidos, contra 12,6% e 6,2% para perguntas de busca explícita e composição entre fontes. Estruturar o corpus como grafo de entidades ou base navegável deu os melhores resultados entre as 56 configurações testadas.","pn":"Benchmark de raciocínio organizacional latente em QA empresarial","pm":"Um mundo empresarial auditado é reconstruído a partir de documentos de rotina e tabelas organizacionais, com perguntas que exigem recuperar relações implícitas ausentes do corpus.","imp":"Se você mede a qualidade do seu RAG interno só com perguntas cuja resposta está escrita em algum documento, o número superestima o sistema: teste também perguntas cuja resposta depende de inferir relações entre registros de rotina, como quem aprovou o quê ou qual equipe cuida de qual ativo.","ex":"Um assistente interno que responde 'qual política se aplica ao reembolso X?' acertando o documento da política, mas falha quando a pergunta é 'quem é o gestor responsável pelo projeto citado neste chamado?', porque essa relação só aparece espalhada entre um ticket, uma tabela de alocações e um e-mail.","res":"O gap de 30,4% foi medido num mundo sintético reconstruído e anonimizado; empresas reais têm ruído, permissões e dependências que o benchmark não replica. O resultado não prova que nenhum sistema resolve o problema, só que as configurações testadas não resolvem nesse corpus."},{"p":"2608.11947","ach":"Em benchmarks multiple-choice, impedir que o modelo veja os rótulos das opções antes de responder não reduz o viés posicional nem melhora a acurácia de forma confiável. A decomposição mostra que o gargalo é esconder as opções, não a etapa de casamento. A única configuração que sustenta o baseline é mostrar todas as opções com um LLM matcher, e a permutação cíclica das opções é o que costuma melhorar a acurácia.","pn":"","pm":"","imp":"Pare de adotar estratégias que escondem os rótulos das opções (gerar a resposta e depois casar, ou pontuar cada opção isolada) achando que isso debia o viés de posição; na prática elas custam acurácia. Antes de publicar um número de benchmark, rode o teste com permutação cíclica das opções e reporte a faixa — é barato e captura a instabilidade que o score único esconde.","ex":"Um harness de avaliação que usa generation-then-matching (o modelo escreve a resposta sem ver as letras A-D e depois um passo de matching atribui a opção) para eliminar influência posicional em MMLU. O paper mostra que esse pipeline perde em relação ao baseline porque o gargalo é o modelo responder sem ver as opções, não o matching.","res":"O resultado vale para benchmarks multiple-choice com esse formato; não prova que permutação cíclica elimina o viés — ela só melhora a acurácia na média, e a sensibilidade por questão persiste. As medidas de desbalanceamento de recall testadas também falharam em detectar o problema, então diagnóstico de viés posicional segue sem métrica agregada confiável."},{"p":"2608.15022","ach":"Em modelos open-weight, uma variável latente só se torna verbalizável via gathering mediado por atenção numa janela de profundidade média, com transporte pelo menos 17x maior ali do que em camadas mais rasas. A janela é específica de demanda: um braço da tarefa que não precisa da variável concentra sete vezes menos. Nenhum gate seletivo foi encontrado onde a hipótese de workspace previa um.","pn":"Janela de profundidade média instala variáveis latentes em forma verbalizável","pm":"A forma legível de uma quantidade latente surge de gathering mediado por atenção dentro de uma janela de profundidade média, sem gate seletivo, e essa janela só aparece quando a tarefa demanda reutilizar a variável.","imp":"Quando um modelo parece não reportar um valor que está no contexto, o problema pode estar no transporte interno numa faixa de camadas, não na ausência do valor. Isso sugere que variar a profundidade efetiva do processamento — por exemplo, com mais passos de raciocínio intermediário — pode recuperar informações que a resposta final omite, sem tocar nos pesos.","ex":"Um assistente que lê um número de contrato no início de um documento longo e erra ao citá-lo em uma pergunta final: o valor está decodificável nas ativações (até 9x acima do piso), mas a leitura falha porque o gathering na janela de profundidade média não o trouxe para a posição consultada.","res":"O readout de percentil não é medida calibrada de uso: três componentes chegam a leituras quase iguais com efeitos 7,4x diferentes na resposta, e sob essa medida saturante a janela nem se localiza. O paper localiza onde a variável é instalada e lida, não a rota a partir da passagem original."},{"p":"2608.16033","ach":"Em 72 células com seis modelos, um oráculo empírico construído com as curvas de resposta de problemas isolados iguala ou supera a média do contest sob orçamento compartilhado, sendo estritamente superior em 71. Sob pressão moderada sem ferramentas, a alocação igualitária supera o desempenho do contest em quatro de seis modelos. Um agendador fixo supera a média em seis de nove células agenticas, mas nenhuma política domina entre domínios.","pn":"Déficit de alocação sob orçamento compartilhado","pm":"Avaliar um conjunto de problemas sob um único orçamento compartilhado de computação revela que o desempenho do modelo fica abaixo do que sua competência demonstrada em problemas isolados permite, calibrada por curvas de resposta individuais.","imp":"Se você roda um agente que resolve várias tarefas com um único teto de tokens ou chamadas, não presuma que o desempenho por tarefa se soma. Meça a curva de acerto de cada tarefa isolada primeiro e distribua o orçamento com base nisso; os resultados sugerem que distribuições não otimizadas deixam capacidade comprada e paga sem uso.","ex":"Um pipeline de revisão de código que processa cinco pull requests sob um teto único de tokens de raciocínio entrega menos patches corretos do que a mesma tarefa avaliada isoladamente permite: o modelo demonstra resolver o PR difícil sozinho, mas, com o orçamento disputado pelos cinco, falha justamente nele, por falta de atualização de estratégia entre os problemas.","res":"Os diagnósticos de trajetória mostram pouca atualização de estratégia, mas o paper não propõe nem valida um método de alocação melhor: nenhum agendador domina entre domínios, e o resultado agéntico vem de diagnóstico com apenas três modelos sob pressão forte. Não se pode ler como prova de que algum esquema de distribuição específico funcione em produção."},{"p":"2608.09209","ach":"O pipeline verifica 9 de 10 atalhos espúrios no BERT e 6 no RoBERTa treinados em MNLI, redescobrindo independentemente os vieses conhecidos de sobreposição lexical e negação, e eleva a acurácia em HANS em até 12,58 pontos percentuais. Em CivilComments-WILDS, os grupos gerados programaticamente atingem 70,1% de worst-group accuracy, igualando a reponderação com rótulos demográficos feitos à mão. Os estágios de descoberta e validação também encontram correlações espúrias interpretáveis em dados de preferência de reward models no RewardBench2.","pn":"Descoberta e verificação causal de atalhos espúrios como expressões booleanas","pm":"Um pipeline gera padrões superficiais candidatos como expressões booleanas executáveis, valida-os estatisticamente com replicação independente e confirma a dependência causal do modelo via intervenções contrafactuais, usando os padrões confirmados como definições de grupo para reponderação sem rótulos demográficos.","imp":"Antes de confiar na acurácia de um classificador em produção, rode uma verificação contrafactual: troque apenas o padrão suspeito na entrada (por exemplo, remova a frase que o modelo parece 'copiar') e veja se a previsão muda. Se mudar, o modelo está dependendo de um atalho, e benchmarks agregados não vão detectar isso — meça a acurácia separadamente por grupo definido pelo padrão.","ex":"Classificador BERT de inferência textual treinado em MNLI que acerta o benchmark mas erra o desafio HANS: ele decide 'implicação' quando a hipótese repete palavras da premissa, mesmo sem relação lógica. A intervenção contrafactual trocando a premissa sem alterar a sobreposição lexical expõe a dependência do atalho.","res":"Os resultados são sobre classificadores BERT/RoBERTa de tarefas de classificação, não sobre modelos de linguagem gerativos maiores em produção; os números de recuperação de atalhos (9/10, 6/10) dependem do vocabulário de candidatos gerado e podem não cobrir atalhos mais abstratos. A equalização com DFR rotulado à mão foi demonstrada em um dataset; a generalidade dessa igualdade não está provada."},{"p":"2608.10835","ach":"O detector alcança estado da arte em detecção de alucinação token-level e de objetos em múltiplos backbones de LVLM. Durante a decodificação, reduz alucinações de objetos em até 55% com latência de 1,06x a geração padrão. O treino do detector não exige ajustar o modelo base.","pn":"Detector de alucinação token-level sobre o traço interno como grafo","pm":"O traço computacional de uma passagem adiante congelada é representado como grafo dirigido de patches, tokens de consulta e tokens gerados, processado por módulos estruturais alternados que combinam evidência relacional, espacial e sequencial para marcar tokens alucinados e permitir reamostragem durante a decodificação.","imp":"Se você opera o modelo com acesso aos pesos de atenção, pode acoplar um detector leve que marca tokens suspeitos em tempo real e os reamostra, em vez de rejeitar a resposta inteira ou pós-filtrar com um verificador externo.","ex":"Num assistente visual que descreve imagens de catálogo, o decodificador reamostra o token 'tênis' gerado numa região da imagem sem calçado, corrigindo a alucinação no fluxo sem regenerar a descrição inteira nem latência perceptível.","res":"Não funciona sobre APIs fechadas: sem acesso às ativações e pesos de atenção do modelo, o detector não pode ser construído. Os ganhos de 55% e 1,06x de latência vêm dos testes dos autores em benchmarks de alucinação de objetos; comportamento em outros tipos de alucinação ou domínios não está demonstrado."},{"p":"2608.13987","ach":"O checkpoint liberado do Nanbeige4.2-3B não roda no PyTorch MPS por cinco bugs independentes, incluindo um buffer RoPE zerado silenciosamente. Mesmo corrigidos, o reuso de camadas dobra a memória de atenção no pico; a estratégia de prefill em blocos amplia o contexto possível em 2,7 vezes em 32 GiB. Com os patches, o modelo passa de 0% para até 30% nas tarefas avaliadas do MCPMark e fica perto do perfeito em chamadas simples no BFCL, mas falha na maioria dos testes multi-ferramenta.","pn":"Prefill em blocos para viabilizar reuso de camadas em memória compartilhada","pm":"O reuso de uma pilha de camadas em segunda passada dobra a memória de atenção no pico, e processar o prefill em blocos reduz esse pico, permitindo contexto maior em memória unificada limitada.","imp":"Se você roda modelos de código aberto em Mac (Apple Silicon), não assuma que um checkpoint novo funciona direto: bugs de compatibilidade podem zerar componentes sem erro visível. Verifique o buffer de posicionamento com testes de saída antes de avaliar o modelo, e use prefill em blocos quando o contexto estourar a memória.","ex":"Um agente de codificação servido localmente num MacBook de 32 GiB retorna tool calls com coordenadas de posição erradas porque o buffer RoPE foi zerado pelo backend MPS; o agente falha silenciosamente em vez de lançar erro, e o time erra o diagnóstico achando que o prompt é o problema.","res":"Os resultados vêm de um único modelo de 3B com arquitetura de reuso de camadas e num subconjunto do MCPMark; o ganho de 2,7 vezes em contexto vale para memória unificada de 32 GiB e não foi demonstrado em outras plataformas ou tamanhos de modelo. O desempenho em multi-tool permanece fraco, então a correção viabiliza execução, não competência agentica."},{"p":"2608.13430","ach":"Em três pares de modelos base/instruction-tuned avaliados em benchmarks de question answering, o tuning altera consistentemente a confiança nas respostas sem mudar quase nada a acurácia preditiva e com piora na calibração baseada em verossimilhança. A diversidade entre raciocínios distintos diminui, enquanto a diversidade lexical de superfície varia em direção e magnitude conforme modelo e benchmark. Os efeitos persistem após controlar seleção de resposta e comprimento do raciocínio.","pn":"","pm":"","imp":"Você não deve usar a frase de confiança que o modelo imprime ('tenho certeza') como sinal de acerto depois de um instruction tuning: confirme com verificações externas, como checagem contra fonte ou amostragem de múltiplas respostas, porque o modelo pode afirmar certeza maior sem errar menos.","ex":"Um assistente de QA em produção baseado em um modelo instruction-tuned responde perguntas de suporte com 'tenho certeza que X' e o pipeline prioriza tickets por essa confiança; como o tuning elevou a confiança verbalizada sem elevar a acurácia, casos errados recebem a mesma prioridade alta que os certos, e erros chegam primeiro ao cliente.","res":"Os efeitos foram medidos em três pares de modelos e benchmarks de QA; a direção da diversidade lexical de superfície não é uniforme, então o achado sólido é sobre confiança e diversidade entre raciocínios, não uma regra geral sobre todo instruction tuning em qualquer domínio."},{"p":"2609.03254","ach":"Em artefatos gerados por conversa, aplicar uma revisão local exige propagá-la às dependências espalhadas no histórico. Nove métodos testados em seis modelos alcançam 68,3–93% de acurácia, e selecionar entre três amostras paralelas (por LLM ou medoide) eleva a acurácia em 2,2–9,7% sendo o método mais custo-efetivo.","pn":"Propagação de revisão local em artefatos gerados por conversa","pm":"Ao receber uma mudança local solicitada em conversa, o modelo identifica dependências no histórico e propaga a revisão a todas as partes afetadas do artefato, e a seleção entre três amostras paralelas por LLM ou medoide é o método mais custo-efetivo.","imp":"Se seu assistente edita documentos, código ou planilhas por conversa, trate cada pedido de mudança como potencialmente global: valide se partes dependentes foram atualizadas, e quando o orçamento permitir, gere três versões da revisão e escolha a melhor em vez de aceitar a primeira.","ex":"Num assistente que gera dashboards por chat, o usuário pede para renomear uma métrica; o modelo troca o rótulo no gráfico mas deixa o filtro e a legenda com o nome antigo, exatamente a falha de propagação que o benchmark mede.","res":"Os ganhos de 2,2–9,7% vêm de um benchmark próprio de propagação de revisão; acurácias de até 93% dos baselines indicam que a tarefa já é razoavelmente resolvida, e o resultado pode não se transferir a artefatos muito maiores ou com dependências mais implícitas."},{"p":"2608.12781","ach":"Em 2.415 prompts multimodais, falhas de padrão de resposta aparecem de forma generalizada entre modelos de diferentes provedores, e o modo non-thinking apresenta taxas de falha substancialmente maiores que o modo thinking. Isso cria desalinhamento sistemático entre as duas interfaces do mesmo modelo, mesmo quando a resposta está correta. As quatro falhas medidas são vazamento de raciocínio, repetição, contradição lógica e raciocínio performativo.","pn":"Diagnóstico de falhas de padrão de resposta entre modos thinking e non-thinking","pm":"Um benchmark diagnostica falhas visíveis na resposta final (vazamento de raciocínio, repetição, contradição lógica, raciocínio performativo) de forma independente da corretude da tarefa, comparando os dois modos de inferência de um mesmo modelo híbrido.","imp":"Se seu produto oferece um modo rápido e um modo deliberado do mesmo modelo, pare de avaliar só a corretude: teste a resposta final dos dois modos com as mesmas regras, porque o modo rápido tende a falhar de formas que a corretude não captura.","ex":"Um chatbot multimodal com modo rápido responde a uma pergunta sobre uma imagem repetindo a mesma frase ou soltando o texto de raciocínio interno na resposta visível; o usuário vê um artefato de raciocínio que a avaliação de acurácia nunca detectou.","res":"A mitigação proposta usa aprendizado por reforço com um modelo de recompensa, inacessível a quem não treina modelos. O benchmark diagnostica falhas, mas não prova que a correção via penalidades generalize para outros modelos além dos dois testados (Qwen3-VL 4B e 8B), e o paper admite um custo na performance da tarefa."},{"p":"2608.20886","ach":"Em cinco benchmarks de recuperação multimodal (texto-para-imagem, imagem-para-imagem e consulta composta), o procedimento sem treino atinge estado da arte em re-ranking de imagens. A consulta vira um pacote de evidência com critérios tipados em seis slots semânticos, cada um rotulado como obrigatório, proibido ou ignorável. O student destilado, opcional, preserva mais de 90% da capacidade do modelo completo com custo bem menor.","pn":"Re-ranking como verificação de restrições semânticas extraídas da consulta","pm":"A consulta é decomposta em critérios tipados rotulados como obrigatório, proibido ou ignorável, e cada candidato é pontuado por rubrica determinística e comparado em lista condicionado a essa evidência, sem qualquer treino.","imp":"Se o seu sistema de busca recebe pedidos compostos como 'essa camisa, mas em rosa', troque a ordenação por similaridade de vetor por uma checagem explícita: liste os critérios do pedido, marque o que é obrigatório, proibido ou pode ser ignorado, e reprovar candidato que falha em critério obrigatório antes de ordenar o resultado.","ex":"Numa busca de e-commerce com a consulta 'esta camisa em rosa', o re-ranker por embedding comprime entidade, atributo e contexto num único vetor e deixa subir candidatos rosa que trocam o modelo da camisa; com o pacote de evidência, 'manter o modelo da camisa' é critério obrigatório e 'cor rosa' vira exigência verificável, e a rubrica reprova quem falha em qualquer um dos dois.","res":"Os ganhos foram medidos em benchmarks de recuperação de imagens com consultas compostas; nada prova o mesmo ganho em busca textual pura ou fora de catálogo visual. 'Sem treino' não significa sem custo: pontuar cada candidato por rubrica e comparar em lista gasta mais chamadas de modelo do que um score de embedding. E a qualidade depende do modelo de visão-linguagem que extrai os critérios — critério mal extraído vira pontuação errada."},{"p":"2608.21360","ach":"Gemini-3-Pro pontua 66,4 de 100 e Qwen3-Omni-Instruct 51,2 no benchmark de assistência por vídeo em tempo real. Os modelos em geral entendem o que o usuário pede, mas erram ou respondem de forma incompleta: falham em prompts visuais como gestos de mão, não mantêm o contexto histórico entre voltas e não adiam a resposta até o evento-alvo. O dataset exigiu mais de 1000 horas de trabalho especializado, construído por engenharia reversa de vídeos da internet.","pn":"avaliação de assistente de vídeo por engenharia reversa de interações","pm":"Vídeos existentes são decompostos em clipes multivolta com objetivos de usuário deduzidos, e priors predefinidos amarram o modelo à mesma rota, permitindo pontuar interação contínua em formato estático.","imp":"Se você escolhe ou valida um modelo para atuar como assistente de vídeo ao vivo, não julgue por testes de vídeo passivo: rode conversas de várias voltas com o modelo e verifique se ele lembra do que já foi dito, reage a gestos e espera o momento certo para falar — os melhores modelos atuais falham nos três pontos.","ex":"Um assistente que guia uma receita em vídeo: o usuário aponta com a mão para um ingrediente e pergunta o próximo passo; o modelo não lê o gesto, esquece as orientações que já deu nas voltas anteriores e responde antes do ponto certo do preparo — os três modos de falha que derrubam as notas dos modelos testados.","res":"As interações são simuladas: vídeos reais de interação são raros, então as rotas são reconstruídas de vídeos prontos e amarradas por priors predefinidos — o teste mede aderência a uma rota fixa, não desempenho em diálogo livre em que o usuário muda de plano. Vale apenas para modelos que processam vídeo e áudio em tempo real."}],"serie":{"2504.15476":[["2026-09-04",1,1,null],["2026-09-05",1,1,null],["2026-09-06",1,1,null],["2026-0 <script>/* Painel Daily Papers - porte do design canvas para HTML/JS puro.
 *
 * O desenho nasceu como artboard `.dc.html` da Claude Design (Artifact
 * "Painel Daily Papers"). Aquele arquivo so roda dentro do runtime do canvas;
 * este e o mesmo layout e a mesma logica de recorte reescritos em JS de
 * navegador, para o painel abrir em qualquer lugar.
 *
 * Duas diferencas deliberadas em relacao ao original:
 *
 * 1. O tooltip nao passa pelo estado. No canvas cada hover era um setState e
 *    um re-render; com 268 pontos de dispersao isso pisca no navegador. Aqui o
 *    tooltip e um no fixo que so muda de posicao e texto.
 *
 * 2. A linha de filtro que esta com o menu aberto sobe para z-index 90. No
 *    canvas as linhas ficam em 4/3/2/1 e a cortina de fechar em 80 - o que
 *    deixaria o proprio menu embaixo da cortina num navegador de verdade.
 *
 * O resto (cores, tipografia, ordem das secoes, textos) e o artboard.
 */
(function () {
  'use strict';

  /* ACCENT e so link e destaque (ticket 04). Ele ja significou "aprovado" na
     linha da taxa, no heatmap e na matriz - e por isso brigava com o proprio
     papel de chamar atencao: metade do painel ficava amarela. Aprovado agora
     tem cor propria, VERDE, e ela vale em todo lugar onde a medida e "quanto
     passou". */
  var ACCENT = '#d9a441';
  var VERDE = '#4ec07a';

  /* Passos escuro e claro da MESMA rampa de verde. Validados com o
     `validate_palette.js` da skill dataviz contra o fundo do card (#16191c),
     em modo ordinal: L monotona, ΔL >= 0.06, extremo claro a 4,16:1, e
     ΔE 27 sob protanopia - a separacao entre eles nao depende de enxergar o
     verde. Sao passos da rampa, nao cores avulsas: mexer num deles e mexer na
     rampa, e por isso o hex mora aqui uma vez so. */
  var VERDE_ESCURO = '#2e8b57';
  var VERDE_CLARO = '#8fe0ae';

  /* Os dois papeis do passo claro, nomeados a parte de proposito: eles dizem
     coisas diferentes em cards diferentes ("amplo" no empilhamento por
     veredito, "cresceu" na escala divergente do heatmap) e nunca aparecem na
     mesma escala - cada card tem a sua legenda. O valor coincidir e
     intencional, e a indirecao e o que impede o acidente inverso: reestepar um
     dos papeis (por CVD, por exemplo) sem perceber que mexeu no outro exige
     trocar o alias aqui, de olho nos dois nomes. */
  var VERDE_ESTRITO = VERDE_ESCURO;
  var VERDE_AMPLO = VERDE_CLARO;
  var VERDE_ALTA = VERDE_CLARO;

  /* Polos da escala divergente do heatmap (vista `crescimento`). O ticket pede
     vermelho = caiu, cinza = estavel, verde = cresceu; os TONS sao escolha
     desta implementacao, porque o par obvio (#e66767 com #4ec07a) mede ΔE 4,8
     sob deuteranopia - abaixo do piso 6 da skill, ou seja, dois cinzas iguais
     para quem nao distingue vermelho de verde. Escurecer o vermelho e clarear
     o verde poe a diferenca na LUMINANCIA, que a deuteranopia preserva: o
     mesmo par medido de novo da ΔE 24,3. O sinal tambem sai por escrito no
     tooltip, entao a cor nunca e o unico canal. */
  var VERMELHO_QUEDA = '#c94f4f';
  var CINZA_ESTAVEL = '#6b7480';
  /* Fundo da celula vazia do heatmap e da matriz: e o zero das rampas, e nao o
     fundo do card - uma celula sem dado precisa se distinguir de uma celula
     com o menor valor da escala. */
  var FUNDO_CELULA = '#1a1d21';

  /* Serie do card "Como o voto amadurece". Roxo por eliminacao deliberada:
     azul e laranja sao estrito e amplo, cinza e `fora`, verde e aprovado e
     amarelo e link - a curva do voto nao e nenhuma dessas coisas, e pintar ela
     com uma delas sugeriria um recorte por veredito que o card justamente
     deixou de fazer. O hex e o slot violeta do mesmo catalogo dark de
     `camposFicha`. */
  var ROXO_VOTO = '#9085e9';

  var COMPACTA = false;

  var root = document.getElementById('painel');
  var elTip = document.getElementById('tip');

  var state = {
    aba: 'janela',
    diasSel: [], vereditos: [], areas: [], topicos: [], orgs: [],
    // recortes que so o grafico produz (nao ha menu para eles na barra de
    // filtro): `regrasFora` vem do clique no Pareto, `criterios` do clique no
    // card espelho dele ("Por que o pipeline aprova"), `areasSec` do clique na
    // matriz de cruzamento. Entram em `filtrados()` como qualquer dimensao.
    regrasFora: [], criterios: [], areasSec: [],
    busca: '', ordem: 'votos', aberta: null,
    menu: null, buscaMenu: '',
    perSel: null, abertaH: null,
    // alternancias de desenho dentro de um card - nao recortam dado
    vistaArea: 'dist', taxaDecomp: false,
    heatVista: 'volume', lagGrupo: 'veredito',
    // "mais" do cabecalho da decisao, por card aberto (chave: secao + id) -
    // um objeto, nao um id unico, porque o card da aba viva e o do hall podem
    // estar abertos ao mesmo tempo (abas diferentes, mesmo estado).
    justExp: {}
  };

  /* Handlers vivem num array reconstruido a cada render; o HTML so carrega o
     indice. Evita serializar funcao em atributo. */
  var H = [];
  function h(fn) { H.push(fn); return H.length - 1; }
  function ev(tipo, fn) { return ' data-' + tipo + '="' + h(fn) + '"'; }

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* Corta no ultimo espaco antes do limite e sinaliza o corte. Sem as
     reticencias o leitor nao distingue um titulo truncado de um titulo curto -
     "Beyond Data Scaling: Representatio" parece um erro de digitacao. */
  function rotuloCurto(texto, limite) {
    var t = String(texto || '');
    if (t.length <= limite) return t;
    var corte = t.slice(0, limite);
    var porPalavra = corte.replace(/\s+\S*$/, '');
    /* Quando nao sobra palavra inteira - titulo de uma palavra so, ou titulo
       que comeca com espaco - o corte por palavra devolve vazio e o rotulo
       viraria so "…". Nesse caso vale o corte cru, que ao menos informa. */
    return (porPalavra.trim() ? porPalavra : corte.trim()) + '…';
  }

  /* O par que localiza o paper na arquitetura: a peca do sistema em que ele
     mexe e a sub-area dela. Os dois juntos, porque a sub-area sozinha nao diz
     de quem e filha e a area sozinha e a informacao que o painel ja dava. */
  function parArea(p) {
    if (!p.a) return '\u2014';
    return p.sa ? p.a + ' \u203a ' + p.sa : p.a;
  }

  function setState(patch) {
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) state[k] = patch[k];
    render();
  }

  /* ── cores das series (dataviz, coluna dark; hex literais) ─────────────── */
  function cor(v) { return v === 'estrito' ? '#3987e5' : v === 'amplo' ? '#d95926' : '#6b7480'; }
  function corTexto(v) { return v === 'estrito' ? '#6aa9ee' : v === 'amplo' ? '#e8794c' : '#8b8f96'; }

  /* Chave do motivo de descarte. `regra_fora` so existe para quem saiu, e a
     cobertura hoje e parcial - o Pareto exige que o nulo continue visivel em
     vez de sumir da contagem, entao ele vira uma categoria de verdade. */
  var REGRA_NULA = '__sem-regra__';
  function chaveRegra(p) { return p.rf || REGRA_NULA; }

  /* ── enum → rótulo legível ──────────────────────────────────────────────
     UM mapa para os tres vocabularios que o painel imprime: os 10 criterios de
     veredito, as 6 regras de descarte e a categoria do nulo. Um so porque os
     dois lugares que os exibem nao podem divergir - a linha do veredito da
     ficha ("ESTRITO · artefato aberto + benchmark"), a contraparte de uma
     decisao de fronteira (que pode ser criterio OU regra, por isso o mesmo
     registro atende as duas) e as barras dos dois cards da secao 03.

     Mora aqui, e nao em `gerar_painel.py`, porque o navegador e o unico
     consumidor: serializar 16 strings dentro de `DADOS` as repetiria no
     arquivo distribuido sem nenhum leitor em Python. Os ENUMS vem de
     `src/hfpapers/llm/schemas.py` (REGRAS_FORA, CRITERIOS_ESTRITO,
     CRITERIOS_AMPLO) - copiados de la, nao inventados; um enum novo que
     aparecer sem entrada aqui sai como o proprio enum, feio mas honesto. */
  var CRITERIOS_ESTRITO = [
    'padrao_arquitetural', 'artefato_aberto', 'invalida_pratica',
    'vulnerabilidade', 'tecnica_de_avaliacao'
  ];
  var CRITERIOS_AMPLO = [
    'benchmark', 'panorama', 'framework_conceitual',
    'principio_sem_o_como', 'exige_acesso_interno'
  ];
  var CRITERIOS = CRITERIOS_ESTRITO.concat(CRITERIOS_AMPLO);

  var ROTULOS = {
    // criterios de veredito (schemas.CRITERIOS_ESTRITO)
    padrao_arquitetural: 'padrão arquitetural',
    artefato_aberto: 'artefato aberto',
    invalida_pratica: 'invalida prática corrente',
    vulnerabilidade: 'vulnerabilidade',
    tecnica_de_avaliacao: 'técnica de avaliação',
    // (schemas.CRITERIOS_AMPLO)
    benchmark: 'benchmark',
    panorama: 'panorama',
    framework_conceitual: 'framework conceitual',
    principio_sem_o_como: 'princípio sem o como',
    exige_acesso_interno: 'exige acesso interno',
    // regras de descarte (schemas.REGRAS_FORA, na ordem de teste)
    treino_ou_postreino: 'treino ou pós-treino',
    geracao_de_midia: 'geração de mídia',
    percepcao_robotica_embodied: 'percepção robótica / embodied',
    relatorio_tecnico_de_modelo: 'relatório técnico de modelo',
    fora_de_escopo: 'fora de escopo',
    portabilidade_reprovada: 'portabilidade reprovada'
  };
  ROTULOS[REGRA_NULA] = 'regra não registrada';

  function rotulo(k) {
    return Object.prototype.hasOwnProperty.call(ROTULOS, k) ? ROTULOS[k] : String(k);
  }
  /* Lado do criterio, na ordem canonica do `schemas.py`. O grafico dos
     aprovados separa os dois blocos por ela e a ficha lista os criterios nela -
     um paper estrito le "artefato aberto + benchmark", nunca o contrario. */
  function ordemCriterio(k) {
    var i = CRITERIOS.indexOf(k);
    return i < 0 ? CRITERIOS.length : i;
  }
  function criteriosOrdenados(lista) {
    return (lista || []).slice().sort(function (a, b) {
      return ordemCriterio(a) - ordemCriterio(b) || a.localeCompare(b);
    });
  }

  /* Interpolacao de cor para as rampas sequenciais e divergentes dos mapas de

  /* Aceita `#rrggbb` e o proprio `rgb(...)` que devolve: a escala divergente

    var ca = rgbDe(a), cb = rgbDe(b);
    return 'rgb(' + ca.map(function (v, i) {
      return Math.round(v + (cb[i] - v) * t);
    }).join(',') + ')';
  }
  /* Piso da rampa sequencial: o menor valor presente ainda precisa se separar
     da celula vazia, senao "pouco" e "nenhum" viram a mesma cor. */
  function sequencial(cor, frac) { return mistura(FUNDO_CELULA, cor, 0.16 + frac * 0.84); }

  /* Cor de uma taxa de aprovacao: cinza (nenhum passou) → verde (todos). A
     rampa sai do cinza e nao do fundo porque aqui o zero e um valor medido,
     nao ausencia de dado - "0% aprovado" precisa ser visivel. */
  function corTaxa(taxa) { return mistura(CINZA_ESTAVEL, VERDE, taxa); }

  /* Marcador da matriz de cruzamentos: tamanho = total, cor = taxa de
     aprovacao. O diametro sai da RAIZ da fracao porque quem le compara area,
     nao largura - escalar o diametro direto pelo valor triplicaria a mancha de
     um cruzamento que so dobrou. Piso de 9px: abaixo disso o marcador some e
     deixa de ter alvo de hover. */
  var BOLHA_MIN = 9, BOLHA_MAX = 28;
  function bolha(n, max, taxa) {
    if (!n) return '';
    var d = BOLHA_MIN + (BOLHA_MAX - BOLHA_MIN) * Math.sqrt(n / Math.max(1, max));
    return '<span style="display: block; width: ' + d.toFixed(1) + 'px; height: ' + d.toFixed(1) + 'px; ' +
      'border-radius: 50%; background: ' + corTaxa(taxa) + ';"></span>';
  }

  /* `exceto` deixa uma ou mais dimensoes de fora: e o que mantem as outras
     opcoes de um seletor visiveis depois que ele ja filtrou (senao marcar a 2a
     area pelo grafico ficaria impossivel - a 1a teria apagado as demais
     barras). Aceita string ou array: a matriz de areas precisa soltar as duas
     dimensoes de area de uma vez para nao virar uma unica celula acesa. */
  function filtrados(exceto) {
    var s = state;
    var q = (s.busca || '').trim().toLowerCase();
    var solta = typeof exceto === 'string' ? [exceto] : (exceto || []);
    function livre(dim) { return solta.indexOf(dim) >= 0; }
    return DADOS.papers.filter(function (p) {
      if (s.diasSel.length && s.diasSel.indexOf(p.d) < 0) return false;
      if (s.vereditos.length && s.vereditos.indexOf(p.v) < 0) return false;
      // dentro de cada dimensao a selecao e OR; entre dimensoes, AND
      if (!livre('areas') && s.areas.length && s.areas.indexOf(p.a) < 0) return false;
      if (!livre('areasSec') && s.areasSec.length && !s.areasSec.some(function (a) { return (p.as || []).indexOf(a) >= 0; })) return false;
      // marcar uma regra e marcar um recorte de descartados: quem foi aprovado
      // nao tem regra nenhuma e nao pode entrar pela porta do nulo
      if (!livre('regrasFora') && s.regrasFora.length && (p.v !== 'fora' || s.regrasFora.indexOf(chaveRegra(p)) < 0)) return false;
      // espelho exato da regra acima: criterio de veredito so existe para quem
      // foi aprovado, entao marcar um criterio ja implica excluir os `fora`
      if (!livre('criterios') && s.criterios.length &&
        (p.v === 'fora' || !s.criterios.some(function (c) { return (p.cr || []).indexOf(c) >= 0; }))) return false;
      if (!livre('topicos') && s.topicos.length && !s.topicos.some(function (t) { return p.tp.indexOf(t) >= 0; })) return false;
      if (!livre('orgs') && s.orgs.length) {
        var chave = p.org || '__sem-org__';
        if (s.orgs.indexOf(chave) < 0) return false;
      }
      if (q) {
        var alvo = (p.t + ' ' + (p.org || '') + ' ' + p.id).toLowerCase();
        if (alvo.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  /* liga/desliga um valor numa dimensao de selecao multipla */
  function alternaLista(campo, valor) {
    var l = state[campo].slice();
    var i = l.indexOf(valor);
    if (i < 0) l.push(valor); else l.splice(i, 1);
    // `aberta` some porque o card que estava aberto pode nem sobreviver ao
    // novo recorte; `justExp` some pelo mesmo motivo - guardar o "mais" de um
    // card que o filtro tirou de cena so acumularia estado morto.
    var novo = { aberta: null, justExp: {} };
    novo[campo] = l;
    setState(novo);
  }

  function mostraTip(l1, l2) {
    return function (e) {
      elTip.innerHTML =
        '<div class="tip1">' + esc(l1) + '</div>' +
        '<div class="tip2">' + esc(l2) + '</div>';
      elTip.style.display = 'block';
      elTip.style.left = (e.clientX + 16) + 'px';
      elTip.style.top = (e.clientY + 16) + 'px';
    };
  }
  function escondeTip() { return function () { elTip.style.display = 'none'; }; }

  /* Quartil por interpolacao linear, usado tambem para a mediana (q = 0,5).
     Havia uma `mediana` propria, que arredondava para inteiro porque so media
     votos; ela saiu quando a curva de maturacao passou a medir PORCENTAGEM do
     voto final - arredondar ali perderia o cruzamento dos 90% por menos de um
     ponto, e no box plot da defasagem esconderia a assimetria que o grafico
     existe para mostrar. */
  function quartil(xs, q) {
    if (!xs.length) return 0;
    var o = xs.slice().sort(function (a, b) { return a - b; });
    var pos = (o.length - 1) * q;
    var lo = Math.floor(pos), hi = Math.ceil(pos);
    if (lo === hi) return o[lo];
    return o[lo] + (o[hi] - o[lo]) * (pos - lo);
  }
  function diaCurto(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    return p[2] + '/' + p[1];
  }
  /* Dias desde a epoca, para subtrair duas datas ISO sem aritmetica de Date -
     que em fuso local erra por um dia perto do horario de verao. */
  function diaNum(iso) {
    if (!iso) return null;
    var p = iso.split('-');
    return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }
  function escalaLog(v, max) {
    if (max <= 0) return 0;
    return (Math.log(1 + v) / Math.log(1 + max)) * 100;
  }
  /* Ticks de um eixo log1p: os valores redondos que ainda cabem, mais o
     maximo. Derivados do maximo, nunca fixos - com um recorte que baixe o teto,
     escalaLog(160, 50) da 129% e o rotulo sai do container. A folga de 7% e o
     que impede 400 e 510 de virarem um borrao: na escala log eles ficam a
     quatro pixels um do outro, e quem tem de sobreviver e o maximo. */
  function ticksLog(max) {
    if (max <= 0) return [0];
    var out = [0];
    [5, 20, 60, 160, 400, 1000, 2500].concat([max]).forEach(function (v) {
      if (v <= 0 || v > max) return;
      var ultimo = out[out.length - 1];
      if (v === max) {
        while (out.length > 1 && escalaLog(v, max) - escalaLog(out[out.length - 1], max) < 7) out.pop();
        if (v !== out[out.length - 1]) out.push(v);
        return;
      }
      if (escalaLog(v, max) - escalaLog(ultimo, max) >= 7) out.push(v);
    });
    return out;
  }

  /* ── plano cartesiano em SVG ───────────────────────────────────────────────
     Os cards sao fluidos, entao o viewBox e 0-100 nos dois eixos e o desenho
     estica junto (`preserveAspectRatio: none`). `vector-effect` e o que impede
     a espessura do traco de esticar com ele. Ponto e circulo continuam sendo
     div posicionada por porcentagem: dentro do viewBox esticado eles virariam
     elipse. `y` ja chega invertido (0 no topo), como o SVG espera. */
  function svgPlano(conteudo) {
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;">' + conteudo + '</svg>';
  }
  function poliLinha(pts, c, larg, tracos) {
    if (pts.length < 2) return '';
    return '<polyline points="' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') +
      '" fill="none" stroke="' + c + '" stroke-width="' + larg + '" vector-effect="non-scaling-stroke"' +
