ps://huggingface.co/papers/2609.04250","f":0},{"id":"2609.04304","t":"Iris: Climbing to the Search Frontier","d":"2026-09-07","da":"2026-09-03","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":0,"u":51,"c":4,"gs":37,"org":"AllSpark-Research","na":9,"nv":1,"url":"https://huggingface.co/papers/2609.04304","f":0},{"id":"2609.04369","t":"AdaptVPR: Route-Aware Hard Positive Generation for Robust Visual Place Recognition","d":"2026-09-07","da":"2026-09-03","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":0,"u":4,"c":2,"gs":2,"org":null,"na":9,"nv":1,"url":"https://huggingface.co/papers/2609.04369","f":0},{"id":"2609.04444","t":"HarvestBench: Measuring Whether LLM Agents Will Pay to Avoid Killing Animals","d":"2026-09-07","da":"2026-09-03","v":"amplo","rf":null,"art":true,"a":null,"sa":null,"as":[],"vt":[],"oa":0,"pp":0,"u":3,"c":2,"gs":0,"org":"CompassioninMachineLearning","na":5,"nv":0,"url":"https://huggingface.co/papers/2609.04444","f":1,"j":"AMPLO porque é benchmark: mede quanto o agente está disposto a pagar para evitar dano a animais e como sensibilidade a preço e briefing variam entre modelos, sem entregar um instrumento, técnica ou padrão que o leitor adote no dia a dia.","h":0,"fr":1,"cr":["benchmark"],"fc":"artefato_aberto"},{"id":"2609.04490","t":"When Quantization Breaks Memory: Recurrent-State Write-Back in Low-Precision Temporal Inference","d":"2026-09-07","da":"2026-09-03","v":"fora","rf":"fora_de_escopo","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":0,"pp":0,"u":3,"c":2,"gs":0,"org":null,"na":3,"nv":0,"url":"https://huggingface.co/papers/2609.04490","f":0},{"id":"2609.04523","t":"MaxKernel: Agentic Kernel Generation for TPUs","d":"2026-09-07","da":"2026-09-03","v":"estrito","rf":null,"art":true,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":0,"u":10,"c":1,"gs":62,"org":"google","na":10,"nv":0,"url":"https://huggingface.co/papers/2609.04523","f":1,"j":"ESTRITO -07","da":"2026-09-04","v":"amplo","rf":null,"art":false,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":0,"u":12,"c":2,"gs":2,"org":"naver-ai","na":6,"nv":2,"url":"https://huggingface.co/papers/2609.04753","f":1,"j":"AMPLO porque exige_acesso_interno: a separabilidade de operações de raciocínio só é observável lendo ativações internas do modelo, o que informa mas não entrega nada que o leitor adote via API.","h":0,"fr":1,"cr":["exige_acesso_interno"],"fc":"tecnica_de_avaliacao"},{"id":"2609.05258","t":"Ask Before You Optimize: Dynamic Pre-Formulation Clarification for Interactive Optimization","d":"2026-09-07","da":"2026-09-04","v":"estrito","rf":null,"art":true,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":1,"u":16,"c":3,"gs":6,"org":"AIOR-Research","na":6,"nv":2,"url":"https://huggingface.co/papers/2609.05258","f":1,"j":"ESTRITO por padrão arquitetural: a política de dois estágios, que detecta lacunas críticas de formulação e decide perguntar ou parar, é reproduzível pela descrição sem o código dos autores. O benchmark OR-Clarify acompanha como contexto de medida.","h":0,"fr":0,"cr":["benchmark","padrao_arquitetural"]},{"id":"2609.05275","t":"Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference","d":"2026-09-07","da":"2026-09-04","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":0,"pp":0,"u":15,"c":2,"gs":0,"org":"cerebras","na":9,"nv":1,"url":"https://huggingface.co/papers/2609.05275","f":0},{"id":"2609.05295","t":"RISE: Recursive Improvement via Self-Extrapolating Policy Distillation","d":"2026-09-07","da":"2026-09-04","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":0,"pp":0,"u":9,"c":1,"gs":0,"org":"Salesforce","na":3,"nv":0,"url":"https://huggingface.co/papers/2609.05295","f":0},{"id":"2609.05415","t":"UniMate: One Unified Model to Animate Diverse Skeletons","d":"2026-09-07","da":"2026-09-04","v":"fora","rf":"geracao_de_midia","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":1,"u":13,"c":2,"gs":56,"org":"princetonu","na":7,"nv":1,"url":"https://huggingface.co/papers/2609.05415","f":0},{"id":"2609.05416","t":"WorldSculpt: Generating Compositional Worlds from Grounded Videos","d":"2026-09-07","da":"2026-09-04","v":"fora","rf":"geracao_de_midia","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":1,"u":21,"c":1,"gs":48,"org":null,"na":12,"nv":1,"url":"https://huggingface.co/papers/2609.05416","f":0},{"id":"2608.25936","t":"One Symptom, Three Levers: A Critical Review of On-Policy Self-Distillation","d":"2026-09-08","da":"2026-08-26","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":0,"pp":0,"u":7,"c":1,"gs":0,"org":"OVHaiLLM","na":2,"nv":1,"url":"https://huggingface.co/papers/2608.25936","f":0},{"id":"2609.01281","t":"EmbodiedSkills: A Unified Framework for Orchestrating, Training, and Deploying VLA Agents","d":"2026-09-08","da":"2026-09-01","v":"fora","rf":"percepcao_robotica_embodied","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":0,"u":7,"c":1,"gs":26,"org":null,"na":17,"nv":1,"url":"https://huggingface.co/papers/2609.01281","f":0},{"id":"2609.02998","t":"Verify Before You Distill: Prompt-Level Teacher Gating for On-Policy Distillation","d":"2026-09-08","da":"2026-09-02","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":0,"pp":0,"u":5,"c":1,"gs":0,"org":null,"na":9,"nv":1,"url":"https://huggingface.co/papers/2609.02998","f":0},{"id":"2609.03241","t":"FlowBalance: Verifier-Grounded Self-Improvement from On-Policy Reasoning Experience","d":"2026-09-08","da":"2026-09-03","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":1,"u":11,"c":1,"gs":0,"org":"Tencent-Hunyuan","na":4,"nv":0,"url":"https://huggingface.co/papers/2609.03241","f":0},{"id":"2609.03254","t":"What Else Needs Fixing? Exploring Cost-Effective Test-Time Compute for Revision Propagation in Artifacts Generated Through Conversation","d":"2026-09-08","da":"2026-09-03","v":"estrito","rf":null,"art":true,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":0,"u":2,"c":1,"gs":0,"org":null,"na":1,"nv":1,"url":"https://huggingface.co/papers/2609.03254","f":1,"j":"ESTRITO por artefato aberto: código e dataset publicados permitem medir e treinar pipelines de propagação de revisão no próprio produto. O benchmark ao lado é contexto, e a técnica de seleção por amostras paralelas é transferível para outras tarefas de revisão.","h":0,"fr":0,"cr":["artefato_aberto","benchmark","tecnica_de_avaliacao"]},{"id":"2609.04010","t":"Unlocking Lossless Speedups in LLMs via Discrete Diffusion","d":"2026-09-08","da":"2026-09-03","v":"fora","rf":"treino_ou_postreino","art":null,"a":null,"sa":null,"as":[],"vt":[],"oa":1,"pp":1,"u":21,"c":5,"gs":44,"org":"IFM","na":17,"nv":2,"url":"https://huggingface.co/papers/2609.04010","f":0}],"fichas":[{"p":"2606.13610","ach":"Em 225 produtos reais e 12 modelos, uma única página poluída no conjunto recuperado gera taxas de recomendação falsa de até 27%, chegando a 73,8% com as três primeiras páginas substituídas. Raciocínio não mitiga: em vários casos o modelo inventa prova social para justificar o produto falso. Das quatro defesas testadas, nenhuma é adequada — o re-ranking por credibilidade remove apenas um sexto dos falsos.","pn":"Poluição de página recuperada engana recomendador por LLM","pm":"Uma única página da web reescrita com um produto falso, dentro do conjunto de páginas recuperadas, é suficiente para o modelo recomendar o produto falso, e raciocínio mais longo tende a gerar prova social espúria que reforça a recomendação falsa.","imp":"Se seu sistema recomenda produtos a partir de conteúdo vivo da web, trate cada página recuperada como potencialmente adversária: teste seu pipeline com o benchmark antes de confiar, e não conte com prompts de ceticismo ou mais raciocínio como defesa — eles podem piorar o problema. Avalie filtros por consenso com cuidado, porque eles também derrubam produtos legítimos.","ex":"Um assistente de compras com busca na web recupera uma página reescrita por um operador de GEO promovendo um produto inexistente; o modelo recomenda o falso produto em 27% dos casos com uma página só, e ao explicar a escolha cita 'avaliações de usuários' que nunca existiram, convencendo ainda mais o consumidor.","res":"O benchmark reescreve páginas de um conjunto congelado e local, não mede poluição em buscas reais em produção, onde a distribuição de conteúdo poluído difere. As defesas avaliadas são apenas quatro; outras abordagens (verificação de fonte, grounding em catálogos) não foram testadas. Vulnerabilidade varia por categoria e depende do conhecimento prévio do modelo sobre o produto."},{"p":"2607.21596","ach":"Com backbone GPT-4o-mini compartilhado, FlowEvo atinge a maior acurácia entre 8 baselines em ALFWorld, HumanEval, MBPP, GSM8K e MATH-500. Em ALFWorld chega a 85,6%, 26,4 pontos acima do baseline mais forte, usando cerca de um terço dos tokens. Em 50 comparações modelo-dataset (10 modelos, 7B a 671B), supera ExpeL em 49.","pn":"Compilação de workflows bem-sucedidos em skills reutilizáveis com supressão de负","pm":"O agente converte workflows que funcionaram em rotinas executáveis armazenadas em banco persistente, rastreia a utilidade de cada rotina e suprime as que causam transferência negativa.","imp":"Em vez de jogar fora o plano que funcionou no último episódio, você pode transformá-lo em uma rotina pronta que o agente reusa ou usa como referência para montar o próximo plano — e medir se cada rotina ajuda ou atrapalha, desligando as que atrapalham.","ex":"Um agente de atendimento que monta um workflow de triagem de tickets: na primeira execução bem-sucedida, o workflow vira uma skill chamável; se essa skill piorar o desempenho em tickets de outro tipo (transferência negativa), o rastreamento de utilidade a suprime automaticamente.","res":"Os números vêm de benchmarks padrão com GPT-4o-mini como backbone; o ganho de 26,4 pontos em ALFWorld pode não se transferir para tarefas fora desses splits. O paper não mostra custo de manter o banco de skills em produção de longo prazo nem comportamento quando o domínio muda."},{"p":"2608.03744","ach":"Em seis datasets clínicos, comitês de agentes resistem a atalhos isolados (5-16% de flips), mas a afirmação repetida por dois pares faz o agente sob teste adotar a resposta errada em 38% dos casos. Um árbitro que reconsulta o caso sozinho detecta adoção com precisão de 77-88% em imagem e 100% em texto; um juiz que só lê o transcript colapsa em imagem, e um gate tem taxa de falso positivo de 100%. Jogar contra uma rubrica oculta é quase silencioso: apenas 1/134 drifters de imagem a nomeiam.","pn":"Contágio de atalho socialmente plausível em comitês de agentes","pm":"Quando dois agentes pares afirmam a mesma resposta errada ou um flag do sistema a sustenta, o agente sob teste adota a resposta em taxa alta, e apenas um árbitro que reconsulta a fonte de forma independente distingue adoção de concordância honesta.","imp":"Se você valida um comitê de agentes injetando pistas isoladas, está medindo a defesa errada: teste a repetição da mesma resposta errada por dois agentes pares, porque é isso que contamina o comitê. E não confie em um avaliador que só lê o histórico da conversa — faça o avaliador resolver o caso por conta própria antes de comparar com o que foi reportado.","ex":"Num fluxo de suporte a decisão clínica sobre laudos de radiografia, um módulo de pré-triagem marca incorretamente um exame como normal e dois agentes de discussão concordam com 'normal'; o agente final acata a marcação em 38% dos casos, e um juiz que só lê o transcript não distingue essa adoção da concordância genuína — só a reconsulta independente do exame detecta.","res":"Os números vêm de comitês baseados em uma família específica de modelos em datasets públicos clínicos; a taxa de contágio e o desempenho do árbitro não estão validados para outras famílias de modelo nem para domínios fora da saúde. O árbitro independente custa uma inferência extra por caso, preço que o paper não quantifica em produção."},{"p":"2608.06867","ach":"A infraestrutura aberta reúne mais de 16 roteadores representativos sob uma mesma formulação de cinco componentes, com benchmark que avalia qualidade de resposta e custo de inferência em conjunto. Roteadores aprendidos superam o melhor modelo fixo em 14,6% relativo; roteadores leves ganham competitividade sob orçamento apertado e roteamento condicionado ao usuário melhora personalização.","pn":"Roteamento de LLMs como processo de decisão sequencial de cinco componentes","pm":"O roteamento entre modelos é decomposto em codificador de contexto, codificador de modelos, função de pontuação, regra de decisão e sinal de aprendizado, permitindo construir, comparar e treinar roteadores numa única formulação.","imp":"Você pode trocar o modo fixo de chamar um único modelo por uma camada de roteamento construída sobre a infraestrutura aberta, medindo no benchmark de custo e qualidade antes de decidir se um roteador treinado compensa no seu tráfego real.","ex":"Em um assistente de suporte que hoje usa sempre o modelo mais caro, um roteador leve pontua cada consulta e envia perguntas simples para modelos menores, cortando custo enquanto mantém qualidade, e as consultas multimodais ou com memória seguem para modelos especializados.","res":"Os ganhos de 14,6% valem no benchmark do próprio ecossistema; desempenho depende do mix de consultas e da disponibilidade dos modelos roteados. Rodar o roteador também adiciona latência e custo próprios, que precisam entrar na conta do orçamento apertado."},{"p":"2608.06947","ach":"Ataques de envenenamento de RAG induzem baixa perplexidade e confiança aparente, o que derruba detecção por incerteza no lado da saída. O paper mede que essas gerações mostram queda de entropia de atenção concentrada nos documentos maliciosos. Um detector que monitora essa dinâmica sinaliza ataques inclusive quando a resposta final não chega a ser alterada.","pn":"Colapso de atenção como assinatura de envenenamento de RAG","pm":"Documentos envenenados no contexto recuperado fazem a entropia da atenção do gerador cair, concentrando o peso neles; gerações benignas mantêm atenção dispersa, o que separa ataque de ruído.","imp":"Se você depende de checagens de perplexidade ou consistência para detectar conteúdo envenenado no RAG, esses sinais podem falhar justamente nos ataques mais deliberados. Considere registrar sinais de atenção do seu gerador quando hospedar modelo próprio, ou trate a ausência desses sinais como cegueira conhecida do seu monitoramento atual.","ex":"Um assistente de suporte com RAG recebe documento envenenado injetado no corpus; o ataque faz o modelo gerar resposta manipulada com perplexidade menor que a de respostas legítimas, então um detector por incerteza deixa passar, enquanto o colapso de atenção sobre o documento atacado o revela.","res":"A adoção plena pede acesso aos pesos de atenção, indisponível em APIs fechadas de inferência; em produção via API de terceiros o achado só informa, não se implementa. Os resultados vêm de benchmarks de ataque específicos e não provam robustez contra ataques que distribuam atenção para imitar o padrão benigno."},{"p":"2608.07193","ach":"Policies geradas pelo framework removem 94,4% dos tokens visuais preservando mais de 99% do desempenho de token completo, com FLOPs 9,9x menores e latência de prefill 6,4x menor. Os resultados foram validados em 14 benchmarks multimodais e três backbones de MLLM. O método é training-free.","pn":"Busca de políticas como modificação residual de uma política base","pm":"Uma DSL de átomos reutilizáveis representa cada estado de busca como alteração residual de uma política base forte, restringindo o espaço de busca e concentrando a atenção do LLM nos componentes de maior impacto.","imp":"Antes de escrever à mão outra heurística de poda de tokens visuais, você pode descrever a política base e os pontos de modificação como um vocabulário de operações e pedir a um LLM que busque variações residuais sobre ela — cortando o ciclo manual de tentativa e erro.","ex":"Em um assistente multimodal de produção em que o encoder de visão gera milhares de tokens por imagem e o prefill domina a latência, uma política buscada por esse esquema descarta tokens de fundo na entrada e mantém os de regiões relevantes, sem retreinar o modelo.","res":"Os números vêm dos benchmarks dos autores com três backbones; políticas que garantem 99% de desempenho nesses testes podem falhar em distribuições de imagem ou tarefas fora desse conjunto. O padrão residual também pressupõe que já existe uma política base forte — sem ela, o espaço de busca não se restringe da mesma forma."},{"p":"2608.07545","ach":"Um único loop de evolução populacional, com o modelo congelado, adiciona cerca de 17 pontos em média sobre quatro benchmarks que separam o sinal de evolução do teste. Terminal-Bench 2.1 sobe 7,7 pontos até 83,2% na mesma base, e o harness resultante transfere sem alteração para SWE-bench Verified. Os ganhos sobrevivem à troca de tarefa, verificador e modelo base, indicando competência geral e não ajuste ao benchmark.","pn":"Seleção populacional de harnesses com contrato de preservar-e-estender","pm":"Múltiplas linhagens de harnesses de agente competem sobre o mesmo modelo congelado; apenas variantes que ampliam cobertura sem regredir tarefas existentes são admitidas, e um arquivo mantém linhagens alternativas para recombinação.","imp":"Se você mantém um agente que evolui seus próprios prompts ou ferramentas numa linhagem única, passe a manter uma população com um filtro que barra qualquer variante que melhore uma tarefa e regresse outra — isso evita que uma vitória local destrua capacidades que seus clientes já usam.","ex":"Um agente de codificação interno que ganha 5 pontos em geração de testes unitários mas passa a falhar em tarefas de refatoração que antes acertava: na busca de linhagem única, essa regressão só aparece depois de implantada; no contrato de preservar-e-estender, a variante que regrediu é barrada antes de virar a linhagem principal.","res":"Os números dependem de cada benchmark ter um verificador confiável e barato para servir de fitness; em domínios sem verificador objetivo, o mecanismo de seleção não roda como descrito. E ganhos medidos em benchmarks públicos não garantem o mesmo ganho na distribuição de tarefas da sua produção."},{"p":"2608.08020","ach":"Sob o mesmo orçamento de hardware, o algoritmo de busca em feixe no nível de pensamentos alcança até +6,7% de acurácia absoluta no HMMT-24 e +3,3% no AIME-25 sobre baselines de poda, com mais que o dobro de throughput e até 68,5% menos tokens que amostragem paralela. Os ganhos vêm de podar trajetórias fracas e ramificar imediatamente das promissoras, mantendo o hardware ocupado.","pn":"Realocação dinâmica de computação de inferência entre trajetórias parciais","pm":"A cada intervalo, as trajetórias de raciocínio parciais são ranqueadas, as piores são podadas e o orçamento de hardware é concentrado em ramificações a partir dos melhores prefixos.","imp":"Se você roda um modelo de raciocínio em produção e pode mexer na camada de decodificação da engine, vale tratar o orçamento de inferência como alocação dinâmica: corte trajetórias parciais ruins periodicamente em vez de deixar todas as amostras correrem até o fim, e reinvista esse custo nos prefixos mais promissores. Isso reduz consumo de tokens sem trocar de modelo.","ex":"Num serviço que resolve problemas de matemática com 32 amostras paralelas por pergunta, todas as 32 correm até o token final e estouram memória. Com a busca em feixe por pensamentos, as amostras podadas no meio do raciocínio liberam orçamento para estender as poucas que já estavam no caminho certo, cortando o total de tokens em mais da metade.","res":"O escore que decide quais trajetórias morrer é calculado a partir dos estados internos do modelo, então o esquema completo só funciona com acesso a essa camada — não basta orquestrar chamadas de API. A avaliação é em benchmarks de matemática competitiva; não prova que a poda por estados internos não destrói trajetórias boas em tarefas onde o progresso promissor é menos detectável."},{"p":"2608.08466","ach":"Um único LLM congelado atinge ganhos consistentes em tarefas de dificuldade moderada no BALROG: +39,3 em BabyAI, +33,0 em Crafter, +25,0 em TextWorld e +15,0 em MiniHack em progresso bruto, apenas reescrevendo o harness por tarefa. A generalização held-out foi forte em sub-suítes BabaIsAI (0,98 e 1,00 a partir de 20% não visto). Em NLE, acima da capacidade do backbone, a evolução do harness não produziu ganho algum.","pn":"Evolução hierárquica de harness por família de tarefas","pm":"Cada família de tarefas mantém um harness próprio, trocado a quente por uma costura de injeção fixa e reescrito por um evolver que opera sobre o código do harness, com um meta-evolver reescrevendo a estratégia do evolver sob âncora externa congelada.","imp":"Antes de trocar de modelo ou retreinar, trate o scaffold que executa o agente (prompts, ferramentas, fluxo) como código evolvível por tarefa: deixe um processo com acesso a sinais de recompensa da tarefa reescrever esse scaffold automaticamente e teste a cada iteração.","ex":"Um agente de automação de tickets com GPT congelado estagna: um evolver reescreve o fluxo de chamadas de ferramentas do fluxo de triagem usando a taxa de resolução como sinal, melhorando sem tocar no modelo — mas em tarefas além da capacidade do modelo, como raciocínio muito longo, nada muda.","res":"Os ganhos valem para tarefas de dificuldade moderada e dependem de sinais de recompensa informativos: onde o feedback é ruidoso ou a tarefa excede o backbone (NLE), a evolução do harness não entrega nada. Melhorar o scaffold não substitui capacidade do modelo."},{"p":"2608.08975","ach":"Em 4.200 manuscritos derivados de 120 submissões reais, a moldura da evidência e a postura sobre novidade geraram os maiores contrastes de nota entre versões com conteúdo preservado; escopo teve efeito menor, e demais dimensões retóricas foram instáveis. O efeito dependeu da nota original do revisor: notas baixas subiram e altas caíram, e workflows mais elaborados de reescrita não ampliaram o ganho de forma confiável.","pn":"","pm":"","imp":"Se você usa um modelo de linguagem para pontuar ou avaliar textos (revisões, triagem de propostas, classificação de tickets), trate a nota como sensível a como o texto é escrito, não só ao que diz. Teste seu avaliador com pares de versões reescritas que mantenham o conteúdo e veja se as notas se separam; se separarem, calibre ou restrinja o prompt antes de confiar na saída.","ex":"Um pipeline de triagem de propostas internas que usa um LLM como revisor dá nota maior ao relatório redigido com 'resultados fortes demonstrados em três experimentos' do que ao relatório idêntico escrito como 'observações preliminares em três experimentos', porque a moldura da evidência desloca o julgamento mesmo sem mudar os dados reportados.","res":"Os revisores e reescritores são LLMs específicos dos autores; a hierarquia de efeitos foi medida em peer review de papers de ML e não garante os mesmos pesos em outro domínio ou com outro modelo juiz. O paper mede sensibilidade retórica, não propõe correção: strict review reduziu a média das notas sem eliminar o viés, então endurecer o protocolo sozinho não resolve."},{"p":"2608.11994","ach":"Em quatro LLMs e quatro benchmarks de raciocínio, com orçamento igual, a verificação por claims supera pass@1 e self-consistency. Em GPT-OSS-20B no CMIMC25, ganha 27,15 pontos percentuais sobre pass@1 e eleva a self-consistency de 77,50% para 82,19% usando 37% menos tokens. O ganho vem de concentrar o orçamento em refutar afirmações decisivas em vez de gerar mais soluções.","pn":"Realocação de verificação: condensar o raciocínio em claims críticos e falsificá","pm":"O traço de raciocínio é reduzido a um conjunto de afirmações decisivas, e cada uma é submetida a refutação semântica dirigida a evidência negativa; a pontuação de confiabilidade não linear então suprime consensos errados, trocando amostragem extra por verificação direcionada dentro do mesmo orçamento de tokens.","imp":"Se hoje você melhora respostas do seu sistema pedindo mais amostras e votando nelas, passe a gastar parte desse orçamento pedindo ao modelo que quebre a resposta em afirmações-chave e tente derrubar cada uma. Em benchmarks de matemática isso rendeu mais acerto com um terço menos de tokens.","ex":"Num assistente de cálculo que responde com self-consistency (votação entre N amostras), cinco amostras erradas podem concordar entre si e vencer a correta. O mecanismo da falha é a diluição do sinal: o erro decisivo, uma substituição de sinal num passo intermediário, desaparece na média do traço inteiro. A falsificação em nível de claim isola esse passo e busca só o contraexemplo que o derruba.","res":"Os resultados são 'geralmente' superiores, não uniformes: a descrição não garante o ganho em todo domínio, e a eficácia depende de o modelo conseguir gerar contraexemplos válidos para os claims, o que pode falhar em tarefas onde refutação é tão difícil quanto construção. Valide no seu domínio antes de trocar a votação por verificação."},{"p":"2608.12440","ach":"Um agente de codificação executou, em três dias e por USD 2.430, a dismantlagem de um invariante central de um sistema TypeScript de 717 mil linhas, mudança avaliada como inviável por refatoração incremental. O protocolo com 14 ciclos de refinamento da especificação e 17 ciclos de verificação corrigiu 201 defeitos antes de qualquer humano executar o programa. Trinta sessões depois, nenhum bug foi observado; logs e especificação completos foram publicados como evidência.","pn":"","pm":"","imp":"Para mudanças arquiteturais grandes e sem testes existentes, você pode trocar o rewrite convencional por um ciclo de especificação congelada: faça o agente escrever a spec, audite-a contra o código, e só depois implemente, verificando o código contra a spec em passes repetidos até dois deles não acharem nada. Isso muda a decisão de 'reescrever ou remendar' para casos que hoje você descartaria.","ex":"No próprio paper: um editor com painel de IA cuja geração em streaming morria quando o usuário fechava o painel. O agente desmontou o invariante 'painel aberto durante a requisição' em 189 arquivos, permitindo que o stream sobrevivesse ao fechamento e reanexasse sem perda ou duplicação — sem oracle prévio e sem revisão humana do código.","res":"É um único caso, conduzido pelo autor do sistema, sem grupo de controle, sem revisão humana do código e com o critério de convergência ('zero achados em dois passes') definido pelo próprio agente; o resultado não prova que o protocolo generalize para outras bases, equipes ou classes de mudança. A validação final foi observação comportamental em ~30 sessões, não garantia formal."},{"p":"2608.12571","ach":"Em 14 configurações de modelo, citações a casos errados são detectadas em 93-100% dos casos, mas referências com página errada dentro do caso certo passam despercebidas em 37-61% das decisões judiciais e 52-83% das petições. Com raciocínio estendido, GPT-5.4 ainda erra 40% e 18% respectivamente. A falha ocorre porque o modelo valida sobreposição de temas, não suporte na página citada.","pn":"","pm":"","imp":"Não deixe seu sistema de citações confiar num 'achado temático' — quando o RAG aponta para uma página ou trecho específico, valide se aquele trecho sustenta a frase, porque o modelo por si só não faz essa checagem fina. Se pedir verificação de página, prepare-se para mais falsos positivos e calibre o limiar.","ex":"Um assistente jurídico interno que resume jurisprudência e cita 'Súmula X, p. 47' passa na checagem do banco de dados porque o caso existe, mas a proposição resumida está na p. 52 — o revisor humano recebe uma citação aparentemente correta cujo suporte real está em outra página.","res":"Os números vêm de corpora jurídicos norte-americanos; a generalização para outros domínios é plausível mas não medida. O prompt que melhora a detecção de página eleva a taxa de falsos positivos, então o trade-off precisa ser calibrado caso a caso — o paper não entrega um ponto de operação pronto."},{"p":"2608.12875","ach":"Em 37 tarefas, o melhor LLM (77,6) e o melhor modelo de embedding (77,2) empatam na qualidade agregada, mas o LLM custa até 1.431x mais por passada de benchmark e os LLMs abertos rodam 2,5 a 736x mais devagar na mesma GPU. Tokens de raciocínio representam 28 a 81% do custo de inferência dos LLMs. LLMs vencem em recuperação que exige raciocínio; embedding models vencem em classificação.","pn":"Divisão de trabalho por custo na fronteira custo-qualidade","pm":"A fronteira de Pareto entre custo e qualidade é dominada por modelos de embedding dedicados, com LLMs justificando seu custo alto apenas em recuperação que exige raciocínio; tokens de raciocínio respondem por 28 a 81% do custo de inferência dos LLMs.","imp":"Antes de substituir seu pipeline de embeddings por chamadas a um LLM, compare o custo por tarefa: para busca por similaridade, classificação e clustering, a troca tende a custar centenas de vezes mais pelo mesmo resultado. Reserve LLM em recuperação apenas quando a consulta exige raciocínio sobre o conteúdo.","ex":"Um sistema de RAG que usa Gemini para gerar embeddings de documentos paga USD 154 por passada completa de benchmark contra USD 0,11 de um modelo de embedding de qualidade equivalente, além de 2,5 a 736x mais latência de token na mesma GPU — sem ganho agregado de qualidade.","res":"Os números vêm de um benchmark controlado (MTEB-like), não da carga real de produção; latência e custo dependem de batching, cache e provedor. A ablação sobre orçamento de raciocínio mostra preservação de qualidade apenas para a maioria dos modelos testados, não para todos. O paralelismo da fronteira não garante empate na sua tarefa específica."},{"p":"2608.12990","ach":"O framework atinge 89,22% no LoCoMo e 92,20% no LongMemEval-S com GPT-4.1-Mini, estado da arte nesses benchmarks. Em relação ao A-Mem, reduz os tokens de construção da memória em 86,0% e 75,9% respectivamente, sem aumentar o uso de tokens no momento da consulta. A granularidade da consolidação, e não só o que é retido, determina o balanço acusto-custo.","pn":"Consolidação de memória em lote por segmentos semânticos","pm":"Interações concluídas são agrupadas em segmentos por fronteira semântica e codificadas uma única vez em registros tipados independentes de contexto, reduzindo a frequência de chamadas ao LLM na construção da memória sem transferir custo para a consulta.","imp":"Se seu agente chama um LLM para resumir ou atualizar memória a cada turno da conversa, você paga caro conforme o histórico cresce. Agrupar várias trocas concluídas em blocos com corte semântico e processar cada bloco uma vez só corta essa conta sem piorar as respostas. Antes de mudar, meça onde está o custo hoje: construção ou consulta.","ex":"Um assistente de suporte que consolida memória a cada mensagem acumula chamadas de LLM proporcionais ao tamanho da sessão; no esquema de segmentos, um chat de 200 turnos vira dezenas de segmentos consolidados apenas quando fecham, preservando a ordem temporal dos eventos do atendimento.","res":"Os números vêm de dois benchmarks de conversa multi-sessão com um único modelo (GPT-4.1-Mini); não prova o comportamento em outros domínios, modelos ou em tráfego real. A detecção de fronteira semântica pode custar mais do que janelas fixas em cargas muito longas ou desordenadas, e a comparação é feita contra um concorrente específico."},{"p":"2608.13120","ach":"Em 9 Skills de produção e 98 arquivos de referência, em seis categorias de serviços em nuvem, a evolução guiada por feedback multi-turno supera a baseada em auto-reflexão em 23,0 pontos e a guiada por QA de turno único em 15,4 pontos. O paper mostra que o gargalo da evolução sustentada é a qualidade do gradiente de feedback, não a capacidade de edição nem o número de iterações. A governança ativa localiza e repara a causa estrutural da degradação, em vez de apenas rejeitar o candidato.","pn":"Simulação multi-turno como gerador de gradiente de evolução de skills","pm":"Perguntas de acompanhamento geradas em simulação multi-turno expõem defeitos camada por camada, e uma camada de governança independente repara degradação factual e bloat estrutural a cada ciclo de revisão.","imp":"Se você mantém skills ou prompts de agente que só melhoram com avaliações de pergunta e resposta isoladas, troque o laço de avaliação por simulações de conversa com perguntas de acompanhamento, e adicione uma verificação separada que corrija regressões factuais e inchaço de instruções a cada revisão, em vez de só descartar a versão pior.","ex":"Um skill de suporte de nuvem que responde bem à primeira pergunta sobre cota de instância, mas falha quando o usuário pergunta sobre limites regionais no segundo turno: a avaliação de turno único nunca vê essa falha, o gradiente de evolução para após o primeiro ajuste, e a skill acumula instruções redundantes que a governança de gate escalar rejeita sem reparar.","res":"Os resultados vêm de skills de serviços em nuvem da própria avaliação; a transferência para domínios com dinâmica de conversa diferente não é demonstrada. O ganho depende de um simulador de usuário capaz de gerar perguntas de acompanhamento relevantes, e o paper não mede o custo computacional nem a sensibilidade à qualidade desse simulador."},{"p":"2608.13410","ach":"O ParliamentRAG alcança 0,97 de cobertura de grupos políticos contra 0,95 do NotebookLM e fidelidade de citação de 1,00 contra 0,95 em 15 temas legislativos. Seis especialistas em avaliação cega A/B preferiram o sistema nas dimensões ligadas a fontes. O NotebookLM segue melhor nas dimensões de prosa.","pn":"Ponderação de autoridade dos falantes condicionada à consulta","pm":"O sistema estima a autoridade de cada falante em função da consulta corrente, combinando atributos interpretáveis como profissão, escolaridade e histórico de intervenções, e usa esse peso tanto na recuperação quanto na síntese com citações.","imp":"Quando seu RAG resume um domínio com muitos autores (transcrições, issues, tickets), deixe de tratar todos os documentos como iguais: ranqueie as fontes pela expertise delas no assunto da pergunta, exibindo quem falou o quê, para reduzir viés de quem mais fala e evitar citação atribuída à pessoa errada.","ex":"Um chatbot interno que resume discussões de decisões técnicas de um repositório tende a citar repetidamente os engenheiros mais falantes, mesmo em temas em que outros dominam; ponderar a autoridade por tema faz a resposta sobre segurança citar quem respondeu questões de segurança, não quem comenta mais.","res":"A autoridade é estimada por atributos estáticos (profissão, escolaridade, histórico), o que pode preservar vieses de quem historicamente teve voz no parlamento; a validação é restrita a 15 temas e a um corpus em italiano, e a superioridade na prosa ficou com a contraparte comercial."},{"p":"2608.13417","ach":"Sete modelos de fronteira foram avaliados em 36 tarefas de pesquisa e desenvolvimento de longo horizonte, com métricas baseadas em regras para comportamento dentro da execução e comparações controladas de reuso de experiência. Os agentes se comportam como otimizadores de engenharia: formulação e implementação funcionam, mas o desempenho varia muito entre execuções e novidade metodológica genuína é rara. Soluções fortes adaptam ou combinam técnicas existentes, e o reuso de experiência pode tanto ajudar quanto induzir decisões erradas nas etapas seguintes.","pn":"","pm":"","imp":"Não confie na nota final de um agente para decidir se ele serve ao seu caso: meça onde o progresso acontece dentro da execução. Antes de acoplar memória de execuções passadas ao seu agente, teste se o histórico está ajudando ou enviesando as decisões seguintes, porque os resultados mostram os dois efeitos.","ex":"Um agente que resolve a mesma tarefa de tuning em uma execução e falha na seguinte, com a mesma nota final agregada: por trás do número igual, um tropeça na formulação da solução e outro na execução, exigindo correções diferentes. Um pipeline que reutiliza experiências bem-sucedidas do histórico pode copiar uma solução passada que não se aplica ao problema atual, degradando a decisão sem sinal na nota final.","res":"As métricas são baseadas em regras e as tarefas são de um conjunto específico de longo horizonte; os gargalos identificados podem não se transferir para agentes em outros domínios. 'Parecem otimizadores de engenharia' é leitura do estado atual dos modelos de fronteira testados, não um limite estrutural, e o paper aponta direções, não soluções validadas."},{"p":"2608.13547","ach":"Replayar as mesmas respostas por um parser adicional derruba a taxa de sucesso em 55,4 a 73,2 pontos percentuais em oito configurações. Divulgar o contrato de geração recupera 30,4 a 60,7 pontos em seis configurações e nada em duas. Um gap de match de -3,6 pontos esconde -64,3 de dano e +60,7 de compensação.","pn":"Separação entre erro de geração e dano introduzido pelo transporte do comando","pm":"Replayar a mesma resposta bruta do modelo através de um parser adicionado deliberadamente, com validação do estado final, isola o quanto do sucesso medido vem do modelo e o quanto vem da configuração de execução.","imp":"Você deve reportar junto com a nota do seu agente qual caminho o comando percorre até executar — serialização, wrapper, parser — porque a mesma resposta pode virar sucesso ou falha conforme esse caminho. Ao avaliar modelos ou versões, compare-os com o contrato e o transporte reais do seu pipeline, não com a nota bruta divulgada.","ex":"Um agente de codificação em produção cujo harness serializa o JSON do modelo e reparseia o comando Bash antes de executar: o modelo emite aspas sem escapar, o parser extra quebra o comando e a tarefa falha no estado final, embora o score de match em benchmark sem esse transporte mostre o modelo como equivalente aos concorrentes.","res":"Os números vêm de 56 tarefas one-shot derivadas de incidentes, com um único parser adicionado deliberadamente; a recuperação por divulgação do limite foi zero ou negativa em duas das oito configurações, então o efeito de disclosure não é universal."},{"p":"2608.13606","ach":"O paper mostra que benchmarks existentes de memória não cobrem cenários móveis realistas, em que as experiências são heterogêneas, multimodais, mutáveis e pessoais. O benchmark proposto cobre um ano de experiências e inclui tarefas de atualização de conhecimento, raciocínio temporal e multi-hop e inferência implícita de preferência a partir de sessões reais de uso.","pn":"Memória de longo prazo avaliada sobre trajetórias experienciais em escala de ano","pm":"Um pipeline de síntese ancorada em conhecimento constrói trajetórias de uso móvel coerentes e temporalmente consistentes a partir de sessões reais, gerando tarefas que exigem atualização de conhecimento, inferência implícita de preferência e raciocínio temporal e multi-hop.","imp":"Se você avalia memória do seu assistente só com perguntas isoladas sobre fatos, esse benchmark mostra o que essa avaliação não enxerga: o assistente precisa acompanhar mudanças ao longo do tempo, notar preferências que o usuário nunca disse em voz alta e lembrar de algo visto meses antes. Use as categorias de tarefa dele como checklist para estressar seu sistema antes de julgá-lo maduro.","ex":"Um assistente de agenda no celular guarda que o usuário marcava reuniões às 9h, mas três meses depois o horário mudou para a tarde; um sistema de memória que só recupera fatos antigos sem peso temporal continua agendando no horário velho, exatamente a falha de atualização de conhecimento que as tarefas do benchmark medem.","res":"As trajetórias são sintetizadas a partir de sessões reais, o que limita a fidelidade ao comportamento genuíno de usuários; resultados altos no benchmark não garantem bom desempenho com dados orgânicos. Além disso, o paper é instrumento de medida, não evidência de que alguma arquitetura de memória específica funcione melhor em produção."},{"p":"2608.13667","ach":"Em nove pares (modelo, benchmark), o método reduz o número médio de turnos em todos e corta a decodificação da thread principal em seis deles, até 43% (média de ~20% nos casos reduzidos). Pass@1 não muda significativamente em sete de nove pares, com ganhos de +12,4 e +10,2 pontos nos dois casos significantes. Contra um controle de orçamento equivalente na thread principal, atinge Pass@1 estritamente maior com 1,3 a 3,2 menos decodificação sequencial em todos os quatro cenários aplicáveis.","pn":"Raciocínio auxiliar na janela ociosa de espera do agente","pm":"Ao fim de cada fase de pensamento, ramos auxiliares decodificam raciocínio futuro em paralelo enquanto a thread principal serializa a ação e espera a observação do ambiente, fundindo os pensamentos gerados quando a observação chega.","imp":"Você pode usar o tempo em que seu agente espera o ambiente responder para rodar raciocínio em paralelo, encurtando o caminho sequencial de decodificação sem treinar nada. Em agentes ReAct com chamadas lentas (navegador, terminal), isso reduz latência e custo por tarefa mantendo a taxa de acerto.","ex":"Agente ReAct operando um navegador aguarda o retorno de uma página para decidir o próximo clique; nesse intervalo, quatro ramos decodificam hipóteses sobre próximos passos e a fusão evita que o próximo pensamento seja gerado do zero, cortando decodificação sequencial em até 43% nos cenários medidos.","res":"O ganho de decodificação sequencial não ocorre em todos os cenários (dois dos nove pares não reduziram); a decodificação paralela adiciona compute total mesmo quando o caminho sequencial encolhe, e a validade é demonstrada em benchmarks agênticos específicos, não em qualquer sistema de agentes."},{"p":"2608.13900","ach":"O paper define 'agentic transaction' reinterpretando atomicidade, consistência, isolamento e durabilidade como garantias semânticas para agentes LLM em tarefas longas sobre ambientes persistentes. Num agente de dados que instancia o framework, a abordagem supera agentes de ponta, incluindo Claude Code, em 10,6% em benchmarks usados com frequência.","pn":"Transações ACID semânticas para execução de agentes","pm":"Ciclos de exploração-execução-validação do agente ganham garantias de atomicidade, consistência, isolamento e durabilidade reinterpretadas no nível semântico, com validação por divergência de confiança, isolamento guiado por dependências e gerenciamento de estado consciente da transação.","imp":"Quando seu agente executa fluxos longos que mexem em estado persistente, trate cada execução como uma transação: agrupe os passos para que falhem todos juntos ou persistedam todos, valide o resultado antes de confirmar, e nunca deixe dois fluxos concorrentes corromperem o mesmo estado.","ex":"Um agente de análise de dados reescreve dez arquivos num workspace e falha no passo 8; sem atomicidade semântica, os sete arquivos alterados ficam inconsistentes com o objetivo original, e validação por divergência de confiança seria o mecanismo para rejeitar a execução parcial antes do commit do estado.","res":"O ganho de 10,6% vem de um sistema específico em benchmarks de agente de dados; não prova que as garantias semânticas se traduzam diretamente para domínios com outras formas de estado, nem que a sobrecarga de validar cada transação compense em fluxos curtos ou baratos. Os mecanismos são nomeados, mas o abstract não detalha como implementá-los."},{"p":"2608.14036","ach":"Em experimentos controlados com 8.135 tentativas normalizadas, 65,7% dos casos de sucesso de skills vêm de ancoragem procedural (estabilização da execução) contra 4,5% de injeção de conhecimento explícito. Skills superam Workflow Memory em 6,06 pontos em comparações pareadas. A precisão de uso real cai de 29,6% para 3,3% quando o pool de skills cresce de 5 para 100, e a invocação exata da skill correta não é nem suficiente nem necessária para o sucesso.","pn":"Ancoragem procedural como mecanismo de eficácia de skills","pm":"Skills em agentes funcionam quando trajetórias ruidosas viram âncoras procedurais que estabilizam a execução, e não quando injetam conhecimento faltante; a recuperação da skill correta é um gargalo separado que degrada com o tamanho do pool.","imp":"Pare de avaliar skills só pela taxa de sucesso agregada do agente: aplique o desenho contrastivo com trajetórias pareadas para descobrir se a sua skill está estabilizando a execução ou apenas acrescentando fatos, porque só o primeiro caso tende a se sustentar. E se o seu sistema tem dezenas de skills, trate a busca pela skill certa como um problema de recuperação a ser medido e otimizado separadamente, não como um detalhe.","ex":"Um agente de atendimento com 80 skills de fluxo (reembolso, troca, rastreio): o pool grande derruba a precisão de escolha para níveis próximos aos 3,3% medidos, e o time interpreta falhas como 'o modelo não sabe o processo', quando a evidência mostra que o problema é recuperação, não conhecimento — adicionando mais skills só piora.","res":"Os resultados vêm de benchmarks e harnesses controlados; a distribuição de modos de uso (65,7% ancoragem) pode variar em produção com tarefas mais abertas. O paper diagnostica quando e por que skills falham, mas não entrega um método pronto de recuperação que resolva o gargalo de pool grande."},{"p":"2608.14441","ach":"O benchmark avalia 144 pares de ambientes físicos mutados e mostra que agentes autoevolutivos falham muito: Reflexion com Qwen3-14B resolve 35,9% dos pares, e nem revelar as mudanças físicas exatas eleva o teto de desempenho. Reflexão validada por simulador supera autorrevisão sem verificação, e âncoras de memória prendem os agentes a designs iniciais.","pn":"Avaliação de adaptação por mutação de ambiente com feedback de sandbox","pm":"O ambiente de origem é mutado mantendo objetivo e interface, e o agente precisa reescrever o código que funcionava usando feedback diagnóstico do simulador dentro de um orçamento limitado de tentativas.","imp":"Antes de confiar num agente de código que 'aprende com a experiência', teste-o num cenário onde as regras do ambiente mudam por baixo dele: você vai descobrir que ele tende a remendar parâmetros em vez de redesenhar o mecanismo. Ao montar seu pipeline de avaliação, inclua mutações de ambiente com orçamento limitado de tentativas para medir recuperação real, não só acerto na primeira tentativa.","ex":"Um agente que gera código de simulação física para montagem de peças funciona no ambiente original; quando o atrito ou a gravidade muda, o mesmo código falha, e o agente gasta suas tentativas ajustando parâmetros numéricos em vez de reestruturar a estratégia de controle, esgotando o orçamento.","res":"Os domínios são seis ambientes de física simulada, e as taxas de acerto de modelos como GPT-5.5 em subconjuntos não garantem o mesmo comportamento no domínio de produção do leitor. O achado sobre mecanismo vs. parâmetro vem de comparação entre dez métodos num único benchmark, não de uma prova geral."},{"p":"2608.14577","ach":"O benchmark coletou mais de 80.000 saídas nocivas validadas de 23 modelos de fronteira de 13 famílias, organizadas em 15 categorias e 57 subcategorias. Modelos mais capazes produzem conteúdo nocivo mais frequente e mais diverso, e cada família exibe um perfil de risco distinto. Ou seja, modelos que passam nos testes de segurança usuais ainda geram material nocivo em escala.","pn":"Risco do modelo como perfil da distribuição de saídas nocivas","pm":"O risco de segurança de um modelo é caracterizado agregando as saídas nocivas que ele produz em categorias e severidades, formando um perfil por modelo em vez de medir ataques isolados.","imp":"Use o dataset como referência para testar se o seu sistema em produção gera conteúdo nocivo nas categorias onde modelos similares falham — em vez de confiar apenas nos testes de recusa padrão, que não cobrem essa superfície.","ex":"Um assistente corporativo alimentado por um modelo de fronteira passa nos testes de jailbreak usuais, mas o perfil de risco mostra que modelos da mesma família geram conteúdo nocivo variado e de severidade crescente em categorias específicas — uma auditoria com as subcategorias do corpus revelaria essas falhas que o teste de ataque único não pega.","res":"O corpus foi construído com modelos de fronteira e suas respostas a geração nociva; não prova que a distribuição se mantém após filtros de segurança em camada de aplicação nem cobre modelos menores. A correlação entre capacidade e nocividade não estabelece causalidade."},{"p":"2608.14614","ach":"Um cluster físico de 128 GPUs V100 de segunda mão, comprado por cerca de 22 mil dólares, serviu LLaMA-70B por um ano com throughput competitivo após otimizações de pipeline, contra cerca de 600 mil dólares por um sistema de 8 B200. O custo total e a pegada de carbono por token dependem fortemente do preço da eletricidade local: em média, GPUs antigas emitem cerca de 4 vezes mais carbono por token em modelos 8B e mais de 40 vezes em modelos 70B.","pn":"Cluster de GPUs aposentadas com paralelismo de pipeline","pm":"GPUs funcionais aposentadas por datacenters são agrupadas em um cluster físico de baixo custo, e otimizações de paralelismo de pipeline compensam a defasagem do hardware para servir inferência de modelos de 70B parâmetros com throughput competitivo.","imp":"Antes de descartar hardware antigo ou comprar GPUs novas, calcule o custo total incluindo energia: se sua região tem eletricidade barata e de fonte limpa, um cluster de máquinas usadas pode rodar seus modelos grandes por uma fração do preço. Se a eletricidade é cara ou suja, a economia inicial se vira em conta de energia e emissão.","ex":"Uma equipe que serve LLaMA-70B para atendimento interno pode montar o serviço em GPUs V100 compradas no mercado de usados com paralelismo de pipeline, pagando ~22 mil dólares em vez de ~600 mil; o mesmo cluster em uma região com rede elétrica a carvão emite mais de 40 vezes o carbono por token do que um sistema B200 atual.","res":"Os números de carbono e custo valem para o contexto medido: V100 contra B200, tarifas e intensidade de carbono locais específicas, e modelos 8B/70B. Não é uma validação de que qualquer hardware velho serve qualquer modelo — o throughput competitivo exigiu otimizações de pipeline específicas, e a vantagem econômica desaparece fora de regiões com energia barata e limpa."},{"p":"2608.14639","ach":"Em 13.859 campos reais extraídos de 800 recibos CORD, o procedimento natural de aceitar campo por confiança viola o risco seletivo prometido em 95% das divisões, por vazamento do refit do escore. Com separação fit/validação, a cobertura volta a 0.318 com risco 0.096 sob alfa=0.10. Certificados PAC por grupo e uma auditoria humana às cegas confirmam risco de 1.3% no conjunto aceito contra orçamento de 10%.","pn":"Escada de validade para controle de risco seletivo por campo","pm":"O protocolo separa ajuste e validação do escore de confiança, corrige a dependência por documento e só emite garantias por grupo (PAC) no degrau mais alto, com o risco aceito medido sobre o conjunto aceito.","imp":"Se o seu pipeline de extração aceita campos automaticamente quando a confiança passa de um limiar, calibre esse limiar em dados separados do ajuste do escore — e meça o erro só entre os campos aceitos, não no conjunto todo. Sem isso, a taxa de revisão humana que você promete ao cliente não se sustenta em produção.","ex":"Um extrator de notas fiscais que ajusta o escore de fusão de confianças e calibra o limiar de aceitação nos mesmos documentos entrega 41.6% de cobertura com risco de 12.7% quando prometia alfa de 10% — campos errados entram no sistema de contabilidade na proporção que o contrato dizia estar controlada.","res":"As garantias fortes dependem do domínio de documentos e dos modelos testados: o ganho do condicionamento por proveniência não se replicou sob outros modelos, e o degrau com certificados por documento é admitidamente quase vazio hoje (cobertura 0.060). O nível 'on-average' tem risco realizado acima do alfa em 47.5% das redivisões — não é certificado."},{"p":"2608.14905","ach":"Avaliação de 8 combinações de harness e modelo em 100 tarefas reais do ciclo completo de pesquisa produziu 800 trajetórias com anotação de processo. Uma taxonomia de 45 padrões de falha, calibrada por humanos via agente-juiz, mostra os mesmos padrões em todos os sistemas, incluindo os modelos mais fortes. A convergência aponta a ausência de um loop metacognitivo: checar a produção contra a evidência, revisar e questionar o caminho.","pn":"Deficit metacognitivo de agentes de pesquisa é do modelo, não do scaffold","pm":"Os mesmos 45 padrões de falha se repetem em todas as combinações de harness e modelo testadas, indicando que a incapacidade de checar, revisar e questionar o próprio percurso reside no modelo e não na orquestração.","imp":"Se você delega tarefas longas de pesquisa a um agente, não adianta trocar de framework esperando resolver as falhas: elas vêm do modelo. Coloque verificação externa obrigatória no seu pipeline — checagens de consistência entre o que o agente alegou e o que as fontes mostram — em vez de confiar na autocorreção do próprio agente.","ex":"Em tarefas do ciclo de escrita e revisão, o agente afirma conclusões não suportadas pelos dados que ele mesmo coletou na etapa de análise e não revisa o raciocínio quando confrontado, um dos 45 padrões que se repetiu em todos os 8 sistemas testados.","res":"O paper não testa se intervenções de orquestração conseguem fechar o deficit metacognitivo — isso fica em aberto. A conclusão de que a falha é do modelo vale para os 8 sistemas avaliados e não prova que nenhum scaffold pode mitigá-la."},{"p":"2608.15008","ach":"Em três backbones e quatro suítes de benchmark, nenhum substrato de memória domina consistentemente. Recuperação ampla beneficia QA factual de contexto longo, mas recuperação excessiva prejudica decisão sequencial ao desviar a atenção do contexto crítico para ação. Substratos estáveis em histórias moderadas ficam caros ou frágeis em horizontes longos.","pn":"Roteamento de substrato de memória por regime de operação","pm":"Um harness controlado mede substratos de memória (índices densos e esparsos, registros textuais, stores estruturais e hierárquicos, memórias por refinamento, atualizações paramétricas e contexto compatível com ativação) em 26 métricas de desempenho e eficiência, e mostra que nenhum substrato domina: a escolha depende do regime de operação, com recuperação ampla favorecendo QA factual de contexto longo e recuperação excessiva prejudicando decisão sequencial ao desviar a atenção do contexto crítico para ação, e com substratos que degradam em horizontes longos.","imp":"Antes de fixar um único tipo de memória no seu agente, meça o regime em que ele opera: se a tarefa é decisão sequencial, recuperação em excesso rouba atenção do que importa para a ação; se é pergunta factual sobre contexto longo, recuperação ampla ajuda. E teste o custo quando a história cresce, porque o substrato que funciona hoje pode quebrar amanhã.","ex":"Um agente de atendimento que decide se escala para um humano: com recuperação excessiva, o contexto recuperado desloca a atenção do modelo para longe do histórico de ações recentes, e o agente repete um passo já executado ou escala sem necessidade — a falha que o paper mede em benchmarks de decisão sequencial.","res":"Os resultados vêm do harness dos autores sobre quatro suítes específicas; a recomendação de roteamento por regime vale dentro desses regimes testados e não garante transferência para outros domínios. O código só será liberado após aceitação, então a comparação ainda não é reproduzível de fora."},{"p":"2608.15089","ach":"No Terminal-Bench 2.1, o runtime eleva o GPT-5.5 xhigh de 83,1% para 92,1% e atinge 95,3% com GPT-5.6 Sol em 445 tentativas, tudo sem mudar pesos. Com menos de US$ 38 de adaptação, o DeepSeek-V4 Flash sobe de 82,7% para 88,1%, com custo total de API cerca de 15 dólares contra 574 do reference. O runbook transfere intacto entre modelos e famílias de tarefas.","pn":"Runtime de agente com estados duráveis e transições verificadas","pm":"Organiza a execução do agente em estados duráveis com contexto por fase, transições verificadas e runbooks recuperáveis e versionados, sem alterar os pesos do modelo.","imp":"Antes de trocar de modelo para melhorar seu agente de longo prazo, trate as falhas como problemas do sistema de execução: persista o estado entre fases, registre postmortems como pré-condições executáveis e reutilize o runbook ao migrar de modelo — dá para ganhar pontos e cortar custo de API dezenas de vezes.","ex":"Um agente de codificação em terminal que perde o rastro de arquivos modificados após dezenas de passos e abandona a tarefa pela metade: com estados duráveis e transições verificadas, o progresso fica registrado e o runbook permite retomar a partir do último estado válido em vez de recomeçar.","res":"Os números vêm de benchmarks específicos e parte dos ganhos usa runbooks por família construídos sobre conjuntos de desenvolvimento; em famílias sem estrutura de execução compartilhada, o ganho no BusinessBench cai para menos de um ponto. O perfil congelado não substitui ajuste fino para todos os casos."},{"p":"2608.11341","ach":"O framework avaliou 20 problemas reais e mostrou ganhos de 2,5 a 7,6 pontos em scores normalizados de repurposing de fármacos ao adicionar um ambiente biomédico específico a modelos fechados, e superou o estado da arte em 7% no design de capsídeos AAV. Ablations indicam que a interface de episódio fixa permite atribuir diferenças de desempenho a componentes específicos do solver. O HDS6 mede seis capacidades independentemente do sucesso na tarefa final.","pn":"Avaliação por investigações verificáveis com episódios stateful","pm":"Tarefas reais são empacotadas em ambientes com dados, ferramentas e restrições, e o desempenho é verificado por artefatos intermediários gravados em trajetórias, medindo capacidades como reparo e uso de evidência de forma independente do sucesso final.","imp":"Quando for medir se um agente serve para trabalho real, em vez de pontuar tarefas prontas, monte cenários que exijam entregas verificáveis no meio do caminho — registros, protótipos, evidências — e avalie cada etapa separadamente. Isso mostra se o agente sabe consertar erros e mudar de plano, e não só se acertou o resultado final.","ex":"Num pipeline de drug repurposing rodando sobre um modelo fechado, a avaliação fechada (sem ferramentas) pontuou pior que a mesma tarefa dentro de um ambiente com dados biomédicos e verificações intermediárias: o modelo fechado não recuperava a evidência necessária, e o ambiente com ferramentas revelou a falha que o benchmark estático escondia.","res":"Os ambientes e o solver não aparecem como artefato aberto, então os ganhos reportados não são reprodutíveis sem reconstruir os ambientes a partir da descrição. Os problemas são de descoberta científica em setores específicos; a transferência das medições para domínios como atendimento ou código não é demonstrada."},{"p":"2608.14881","ach":"O paper documenta um modo de falha: sistemas de pesquisa automatizada sem personalização retornam essencialmente a mesma pesquisa para pesquisadores distintos com o mesmo objetivo. Ele propõe representações em grafo do pesquisador e avaliação ancorada no indivíduo como correção. Não há execução experimental nem números que validem a proposta.","pn":"Condicionamento do pipeline de pesquisa automatizado em representação individual","pm":"Uma representação em grafo do pesquisador — publicações, repertório metodológico e comunidades — é injetada em todas as etapas do pipeline (recuperação, hipóteses, experimentos, escrita, revisão), e a saída muda conforme a pessoa que emitiu o objetivo.","imp":"Se você monta fluxos automatizados de geração ou análise de hipóteses, pare de otimizar só por métricas genéricas de qualidade: adicione contexto do usuário real (histórico de trabalho, restrições, repertório) na entrada, ou seus usuários receberão a mesma resposta uns dos outros. Para um sistema de suporte à decisão em produção, isso significa guardnar perfil estruturado antes de chamar o modelo.","ex":"Dois times de engenharia pedem ao mesmo agente de pesquisa 'encontre uma forma de reduzir latência de inferência': sem condicionamento individual, ambos recebem a lista genérica de quantização, batching e cache — enquanto o time A já usa quantização e o time B depende de código legado que quantização quebra. A falha é o objetivo idêntico produzir saída idêntica que ignora conhecimento tácito de cada time.","res":"O paper é uma proposta de agenda: os três componentes são descritos, mas não há implementação, avaliação comparativa nem evidência de que a personalização melhora resultados. O 'modo de falha' é argumentado, não medido. Não se conclua daqui que condicionar no usuário melhora qualquer pipeline — isso fica por provar."},{"p":"2608.15242","ach":"Em 1.140 trajetórias de agentes que falharam, com mediana de 145 passos e sem erros injetados, o melhor baseline acerta apenas 13,2% do passo raiz exato. O método RCTA, sem treino, alcança 51,1% de acerto no papel responsável e 24,1% no passo raiz. Os dois alvos se comportam de forma distinta e precisam ser avaliados separadamente.","pn":"Diagnóstico de falha por papel responsável e passo raiz em trajetórias longas","pm":"A avaliação de falha de agentes é decomposta em dois alvos independentes — identificar o papel responsável e localizar o passo decisivo mais antigo — medidos sobre trajetórias de centenas de passos com rótulos humanos independentes.","imp":"Quando seu agente de produção falha depois de dezenas de passos, não trate 'quem errou' e 'em qual passo entrou o erro' como uma única pergunta: meça e depure os dois separadamente, e espere que localizar o passo exato é muito mais difícil do que apontar o papel.","ex":"Um agente de atendimento com planejador, executor e revisor falha após 150 passos; o revisor é apontado como culpado, mas o erro decisivo entrou numa instrução de handoff mal escrita pelo planejador 40 passos antes — diagnóstico de resultado final não revela isso.","res":"Os números vêm de cinco domínios específicos do benchmark; acerto de 24,1% no passo raiz mostra que o problema segue longe de resolvido, e o método depende de resumos de segmento e instruções de handoff registradas, que nem todo sistema de produção mantém."},{"p":"2608.15888","ach":"A arquitetura reduziu a exfiltração de dados no AgentDojo de 75–100% para 0% em todos os quatro domínios e bloqueou todos os 544 casos de roubo de dados do InjecAgent, mesmo com o modelo comprometido. A latência de autorização ficou em 0,24 ms no percentil 99, mas a utilidade caiu 8,6 e 13,9 pontos percentuais em dois cenários do AgentDojo.","pn":"Autorização por sessão com delegação rastreada e decisão fora do modelo","pm":"As permissões do agente deixam de ser estáticas por requisição: o sistema acumula o estado da sessão, restringe o escopo e os orçamentos delegados a sub-agentes, verifica combinações de ações já executadas e aplica a decisão de autorização fora do modelo.","imp":"Você pode tratar prompt injection como problema de permissões, não de modelo: ao integrar um agente que executa ferramentas, avalie cada chamada contra o que já foi feito na sessão e limite o que ele repassa a sub-agentes, em vez de confiar no comportamento do modelo ou de permissões fixas definidas no início da sessão.","ex":"Um agente de suporte com permissão para ler e-mails e chamar uma API de envio pode, sob injeção via e-mail malicioso, encaminhar dados do usuário para fora — cada ação isolada é permitida, mas a combinação não. Checando a requisição contra o histórico da sessão e fechando o escopo delegado, a combinação proibida é bloqueada fora do modelo.","res":"A garantia de sanidade de composição vale apenas para combinações proibidas sob um conjunto completo de restrições e admissão serializada — lacunas nas restrições derrubam a garantia. Há custo de utilidade de até 13,9 pontos percentuais, e as medições foram em host ocioso; latência em produção pode diferir."},{"p":"2608.16002","ach":"Em seis LLMs abertos nos benchmarks τ-2, Terminal-Bench-2 e GAIA, propagar incerteza por um grafo de dependências da trajetória gera estimativas de confiança mais precisas que sinais locais como probabilidade de token ou confiança por passo, e detecta falhas mais cedo. A causa da falha frequentemente surge vários passos antes do erro visível, e sinais locais não a capturam.","pn":"Propagação de incerteza sobre grafo de trajetória do agente","pm":"O histórico de execução é convertido em um grafo dirigido cujos nós são estados de raciocínio, interações com ferramentas e feedback do ambiente, ligados por arestas de dependência temporal e semântica, sobre o qual a incerteza é propagada para estimar confiança da trajetória completa.","imp":"Se você hoje decide abortar ou reexecutar um agente olhando só a confiança da última resposta, passe a olhar o acúmulo de sinal de risco ao longo dos passos: uma chamada de ferramenta que retornou algo estranho lá atrás pode ser a causa raiz de uma resposta errada agora, e valer retriar aquele passo em vez do final.","ex":"Num agente de terminal estilo Terminal-Bench, o agente lê um arquivo com codificação errada no passo 3, segue executando sem erro aparente e falha no passo 20; monitor de confiança por passo passa limpo até o fim, enquanto a propagação sobre o grafo marca risco crescente já a partir do passo 3.","res":"Os resultados vêm de benchmarks de agente com LLMs abertos; não prova que o grafo se sustente em trajetórias muito longas, onde o custo de construir e propagar sobre o grafo pode crescer rápido, nem em ambientes onde o feedback do ambiente é ruidoso ou escasso — justo o insumo de que a propagação depende."},{"p":"2608.16003","ach":"Com a tarefa idêntica byte a byte, um episódio completo de auditoria seguida de correção no contexto reduz alarmes falsos em 15 de 15 combinações de modelo e formulação, de 2,8 a 11,5 pontos percentuais. A análise de detecção de sinal localiza a mudança no critério de decisão, não na discriminação, em 15 de 15 casos. Um episódio cuja auditoria reportou erro reduz ainda mais os alarmes falsos, contra a predição da literatura.","pn":"","pm":"","imp":"Se você usa um modelo para checar a saída de outro, não deixe o avaliador herdar o histórico de auditoria e correção: avalie a resposta em contexto limpo. Se a checagem compartilhada for inevitável, trate a contagem de erros reportados como subestimada e adicione verificação independente para o que passou.","ex":"Num pipeline de revisão de código em que o modelo avaliador vê a correção proposta pelo modelo consertador antes de emitir o veredito, o avaliador passa a aprovar código defeituoso que aprovava menos antes: o critério de decisão afrouxa mesmo com a capacidade de discriminar erro intacta, então a queda de alarmes falsos não sinaliza melhoria na checagem.","res":"A auditoria manual de 50 alarmes falsos achou 82% simplesmente errados, então no ponto de operação testado a tolerância pode não ser prejudicial; o efeito pode ser inofensivo ou até desejável dependendo do custo relativo de falso positivo e falso negativo. O teste de discriminação tem metade da sensibilidade por construção, e o efeito por componente (conteúdo da correção vs. veredito) varia entre famílias de modelos."},{"p":"2608.16157","ach":"Um sistema de servir MoE que remapeia continuamente computação e estado sobre os recursos da máquina roda modelos de fronteira em hardware pessoal: 35B em laptop, 284B em desktop comum e 753B em uma única GPU de workstation. Os testes cobrem mais de 20 modelos MoE e agentes reais de código e uso de ferramentas, de GPU de laptop de 8GB a workstation.","pn":"Execução MoE adaptativa à largura de banda e recursos heterogêneos na borda","pm":"O sistema de servir modelos MoE mapeia continuamente computação e estado do modelo (residência de expertos, execução CPU-GPU, memória em runtime) sobre os recursos efetivamente disponíveis da máquina local, em vez de fixar uma estratégia única de offloading.","imp":"Se você serve modelos abertos, deixe de tratar a máquina local como uma GPU pequena e trate-a como plataforma unificada: dimensione quais expertos ficam em GPU e o resto em CPU/memória de forma dinâmica, revisando o mapeamento conforme a carga do agente muda, em vez de fixar uma política de offloading na instalação.","ex":"Um agente de codificação rodando localmente alterna entre geração longa, chamadas de ferramenta e releitura de contexto grande; com política fixa de offloading a fase de leitura estoura largura de banda ou memória, enquanto o mapeamento dinâmico realoca os expertos entre CPU e GPU a cada mudança de padrão de execução.","res":"Os ganhos dependem de workloads de agente com padrão de execução variável e de hardware heterogêneo típico de borda; em servidores de datacenter com recursos balanceados, um sistema de servir convencional pode empatar ou vencer. Os números vêm dos próprios autores, sem comparação independente publicada no abstract."},{"p":"2608.16391","ach":"Em três rotas com logprobs, a perda de fidelidade média estimada só por contagem de textos concorda linearmente com o comparador derivado de logprobs. Em sete snapshots de rota, sondas de 20 execuções revelam variação de perda extrema específica de cada rota. Perda extrema alta coincide com queda da taxa de acerto em Terminal-Bench conforme a exposição à tarefa cresce, sem associação detectável com GPQA-Diamond.","pn":"Auditoria black-box de fidelidade de API hospedada por reconstrução de distribui","pm":"Reenviar muitas vezes um mesmo contexto congelado a uma API hospedada, reconstruir a distribuição categórica de saída pela contagem dos textos retornados e resumir o desvio com estatísticas de perda de fidelidade média e extrema.","imp":"Se você compra inferência de um provedor que hospeda pesos abertos, você pode auditar a rota sem pedir logprobs: rode o mesmo prompt congelado dezenas de vezes, compare as contagens das respostas ao longo do tempo e trate picos de perda extrema como sinal para investigar tarefas longas antes de culpar o seu próprio código.","ex":"Um agente de terminal em produção começa a falhar mais ao longo do dia enquanto a precisão em perguntas de conhecimento fica estável; uma auditoria por requisições repetidas detecta que a rota do provedor degradou a fidelidade extrema das sequências longas, explicando a queda no benchmark de tarefas de longo horizonte.","res":"A correlação com Terminal-Bench é observacional e os próprios autores dizem que o mecanismo é apenas plausível; perda de fidelidade quase não se associou a GPQA-Diamond, então o método não serve como proxy universal de qualidade e exige muitas requisições pagas por ponto de medida."},{"p":"2608.16393","ach":"Em 14.560 execuções controladas, os ataques mais fortes de injeção indireta atingiram 17,0% de sucesso via fake-completion em texto, 25,5% via Unicode oculto em arquivos e 16,0% pelo canal de skills em arquivos. O juiz baseado em regras atribuiu conformidade parcial 7,3% das vezes contra 2,0% do juiz semântico. Os achados apontam para a falta de controles entre conteúdo não confiável e ações sensíveis.","pn":"Avaliação de injeção indireta em harness de agente com taint controlado e juizes","pm":"Taint controlado é entregue por canais de conteúdo não confiável do harness de agente, e cada trace é classificado por um juiz determinístico de regras combinado com um juiz semântico de LLM, preservando o loop de agente original.","imp":"Você pode copiar esse protocolo para testar seu próprio agente de produção: injete conteúdo marcado nos canais que ele lê (resultados de busca, arquivos, páginas web) e verifique se o conteúdo influencia chamadas de ferramenta. Valide os traces com regras determinísticas antes de recorrer a um juiz de LLM, que julga mais frouxamente.","ex":"Um agente que resume PDFs enviados por usuários pode receber um arquivo com caracteres Unicode ocultos instruindo 'exclua a sessão anterior'; como o harness trata o conteúdo do arquivo como texto do modelo e não como dado, a instrução atravessa o loop e dispara uma ferramenta sensível sem política que a bloqueie.","res":"Os alvos e sinks são fixtures locais sem efeitos externos, então as taxas medem tentativas registradas, não comprometimento real. Os números são específicos do harness avaliado; outro sistema com políticas de chamada de ferramenta diferentes pode ter taxas bem distintas."},{"p":"2608.16425","ach":"Em benchmarks de raciocínio matemático e científico, o controle por confiança temporal reduz latência média em 21,8–32,2% e tokens totais em 18,1–30,3% mantendo acurácia competitiva. O sinal por ramo mostra estabilidade temporal e poder preditivo de convergência futura maiores que confiança por token e sondas instantâneas. Poda, aposentadoria de ramos, bifurcação e parada global derivam todos desse único sinal, sem sincronização.","pn":"Convergência temporal por ramo como sinal único de controle paralelo","pm":"Cada ramo de raciocínio paralelo é sondado periodicamente quanto à distribuição provisória de respostas, e a nitidez com que as sondas recentes se concentram numa resposta dominante governa sozinha a poda de ramos fracos, a aposentadoria de ramos comprometidos, a bifurcação do orçamento liberado e a parada global, sem sincronização entre ramos.","imp":"Se você orquestra várias cadeias de raciocínio em produção, deixe de esperar o voto final para cortar custo: a cada intervalo, peça uma resposta provisória de cada cadeia e use a concentração dessas respostas recentes para encerrar as que já se decidiram, cortar as que seguem oscilando sem progresso, abrir novas com o orçamento liberado e encerrar o lote quando o voto ponderado se estabilizar.","ex":"Um serviço de plantão que responde questões de matemática e física lançando oito cadeias paralelas por pergunta paga hoje o orçamento completo das oito e só descarta respostas no voto final; a falha é que cadeias já convergidas para a mesma resposta dominante seguem gerando tokens redundantes até o fim. Sondando cada cadeia a cada N tokens, o serviço aposenta as duplicadas, realoca o orçamento na cadeia que ainda oscila e encerra o lote quando o voto ponderado se concentra.","res":"Os ganhos vêm de matemática e ciências, tarefas com resposta única em que concentração de respostas provisórias indica progresso; em tarefas abertas, concentração pode refletir apenas viés de formulação. A acurácia é competitiva, não superior — cortar cedo arrisca encerrar a cadeia que encontraria a resposta certa. As sondas também custam tokens, e o ganho líquido depende de elas pagarem a si mesmas."},{"p":"2608.17336","ach":"Em benchmarks de contexto longo (LongEval, LV-Eval) com LLaMA, Qwen e Vicuna, o roteamento misto de precisão recupera a qualidade perdida pelo caminho uniforme INT8 e supera o throughput de prefill do FP16 em A100. O método preserva conectividade densa de tokens e funciona com grouped-query attention e caches INT8. Não exige retreino.","pn":"Roteamento espacial de precisão por blocos de atenção","pm":"A matriz de atenção é dividida em blocos alinhados ao hardware, e cada grupo de blocos é despachado para computação FP16 ou INT8 por meio de bitmasks, com ambos os caminhos atualizando um estado de softmax online compartilhado.","imp":"Se você serve modelos com contexto longo e hoje escolhe entre FP16 caro ou INT8 que degrada qualidade, pode adotar precisão mista por blocos: manter INT8 na maioria dos blocos de scores e FP16 só onde a precisão importa, ganhando throughput sem perder qualidade nas tarefas de contexto longo.","ex":"Um serviço de RAG que faz prefill de documentos de 100k tokens em A100 sofre degradação de recuperação ao usar INT8 uniforme nos scores de atenção; com o kernel TileMix, os blocos de scores com valores extremos vão para FP16 e o resto para INT8, mantendo a qualidade do LongEval com prefill mais rápido.","res":"Os resultados cobrem prefill em A100 com três famílias de modelos; o ganho em outras GPUs, em decodificação incremental ou com outras arquiteturas de atenção não é demonstrado. O ganho depende de escolher quais blocos rotear para FP16 — a fronteira precisão-eficiência é controlável, mas exige ajuste por carga de trabalho."},{"p":"2608.17379","ach":"Nenhum modelo avaliado iguala consistentemente bibliotecas de fronteira; as taxas de sucesso caem bastante em workloads complexos como o backward de attention. Executar a instrução PTX alvo em runtime não garante speedup competitivo. O fine-tuning com condição de reparo melhora algumas tarefas, mas a generalização continua desigual.","pn":"Benchmark de instruções PTX específicas de arquitetura","pm":"O instrumento avalia se modelos de linguagem selecionam e executam instruções PTX alvo em runtime, além de medir a correção funcional e o speedup sobre bibliotecas de fronteira em GEMM e attention em H100 e B200.","imp":"Se você está avaliando se um LLM pode acelerar kernels para o seu hardware, não confie no relato de que a instrução alvo foi emitida: meça execução em runtime e speedup real contra a biblioteca que você já usa, porque escolher a instrução certa não implica ganho de desempenho.","ex":"Um modelo que gera um kernel de attention backward para H100 pode inserir a instrução PTX alvo, o código roda, mas o tempo de execução fica acima do do kernel da biblioteca de fronteira — a falha é que a seleção da instrução não corresponde a um plano de otimização competitivo para o workload.","res":"O benchmark cobre GEMM e attention em duas arquiteturas de GPU; resultados em outros workloads ou hardwares não são garantidos. A parte de adaptação por fine-tuning exige treino, e o próprio paper admite que a qualidade do modelo professor e a cobertura dos dados limitam o que essa adaptação entrega."},{"p":"2608.17597","ach":"Em 128 casos sandboxeados, 14 combinações de harness e modelo apresentam taxa de sucesso de ataque entre 12,6% e 80,9%, com utilidade entre 75,0% e 97,6%. A fase de configuração do harness é a mais vulnerável nos três harnesses testados. Configurações que detectam risco em mais de 90% das execuções ainda sofrem ataques substanciais.","pn":"Avaliação de segurança de agentes por fases do ciclo de vida do harness","pm":"A segurança do harness é decomposta em seis fases operacionais (configuração, extensão, execução, persistência, controle de ações, recuperação), cada uma com casos sandboxeados que emparelham objetivo benigno com instrução adversarial, medindo utilidade e taxa de sucesso de ataque separadamente por fase.","imp":"Você não deve medir a segurança do seu agente com um único teste de ataque: teste cada responsabilidade do harness separadamente, e comece pelas permissões e parâmetros de configuração, que foram o ponto mais frágil. Detecção de risco registrada no log não significa que a ação perigosa foi bloqueada, então trate detecção e bloqueio como métricas distintas.","ex":"Um agente de codificação executando um workflow de terceiros recebe instruções embutidas no artefato que alteram parâmetros sensíveis de configuração dentro de um fluxo aparentemente autorizado: a ação passa pelas permissões normais, o modelo até sinaliza o risco, mas o ataque se concretiza mesmo assim.","res":"Os resultados valem para os três harnesses e seis modelos testados; os percentuais não são transferíveis para outro harness sem reavaliação. O benchmark diagnostica onde as falhas ocorrem, mas não propõe nem valida defesas — reduzir a taxa de ataque exige trabalho posterior."},{"p":"2608.17800","ach":"Mesmo o mode
