valendo — só o backend de evidência muda — e o gate continua autorizando a liberação do buffer de saída mesmo quando o scheduler reordena as requisições.","res":"Os números são de um modelo só (Qwen3-4B) e de um benchmark de ataque (HarmBench); a queda de 39% para 3% não diz nada sobre outros modelos, outros tipos de ataque ou ataques que visem o próprio framework. O custo em falsas recusas é pequeno no XSTest, mas XSTest cobre um conjunto estreito de ambiguidades benignas. E o ganho de throughput (98,14%) foi medido com 32 sequências ativas — sob carga maior, o overhead do monitoramento pode crescer."},{"p":"2608.28122","ach":"O survey revisa 259 trabalhos (230 sistemas e 29 benchmarks) de construção de artefatos por agentes, organizados em seis famílias de artefato. Dois achados estruturais emergem: decompor a construção reduz complexidade local mas aumenta custos de coordenação e remontagem, e juízes aprendidos adicionam pouca evidência independente quando compartilham preferências e pontos cegos do gerador.","pn":"Construção de artefatos como ciclo estado-política-verificação","pm":"A construção de entregáveis é modelada como um ciclo em que uma representação operacional do artefato, uma política de construção e verificação em tempo de execução se conectam, com o feedback da verificação redirecionando as ações seguintes.","imp":"Ao montar um agente que gera entregáveis (código, documentos, relatórios), trate a verificação como parte do loop de construção, não como etapa final: faça o feedback da verificação redirecionar a próxima ação enquanto a falha ainda é reparável. E desconfie de avaliadores automáticos treinados do mesmo jeito que o gerador — eles podem aprovar exatamente os erros que o gerador comete.","ex":"Um agente que gera pipelines de dados em SQL e valida só no final descobre erros de schema quando o artefato já está montado, custando retrabalho caro. Com verificação em tempo de execução, um teste de schema após cada trecho redireciona a próxima query antes do acúmulo — o mecanismo é tornar a falha visível enquanto o estado afetado ainda é pequeno.","res":"Os princípios são formulações conceituais: o paper não entrega política de construção, mecanismo de verificação nem implementação de referência. A taxonomia cobre literatura até agosto de 2026 indexada pelos autores, e a generalização entre as seis famílias de artefato pode não valer igualmente para todas."},{"p":"2608.28478","ach":"ElephantBench avalia 32 modelos em 1.094 perguntas que exigem recuperar duas contas conflitantes do mesmo fato de cauda. O melhor modelo retorna as duas contas em apenas 52,4% das perguntas; quase sempre lembra uma e omite a outra. Exposição maior do lado minoritário no corpus está associada a recall mais completo, e escalar modelo ou raciocínio não elimina a lacuna.","pn":"Sondas de QA multi-conta extraídas de desacordos documentais em corpora de cauda","pm":"Um pipeline em grafo recupera documentos correlatos de baixa exposição, identifica desacordos naturais entre eles e converte cada divergência em uma pergunta fechada verificável cuja resposta completa exige recuperar as duas contas conflitantes da memória paramétrica do modelo.","imp":"Antes de confiar nas respostas de um modelo sobre temas polêmicos ou pouco documentados, teste com perguntas que tenham mais de uma resposta legítima — por exemplo, disputas sobre nomes de entidades ou versões conflitantes de um fato. Se o sistema citar apenas uma versão, trate a ausência da outra como o comportamento esperado, não como bug isolado, e preferencialmente anexe os documentos-fonte no contexto em vez de depender da memória do modelo.","ex":"Um assistente jurídico em produção que responde sobre uma lei com a versão consolidada do texto oficial e omite a decisão judicial que a reinterpretou: o mecanismo é o mesmo do paper — a conta dominante tem muito mais exposição no corpus de treino, então o modelo a recupera sozinha, enquanto a conta minoritária não vem à tona sem recuperação externa.","res":"O dado é sobre memória paramétrica em modo fechado (closed-book): sistemas com RAG robusto não estão necessariamente afetados. O benchmark usa fatos de cauda em inglês e desacordos naturais, então não mede divergência em tópicos de alta exposição, e a lacuna de 52,4% não indica inabilidade geral em QA factual."},{"p":"2608.28833","ach":"Em 13 LLMs avaliados, a presença de perfis de usuário e memórias recuperadas piora consistentemente três comportamentos: personalização irrelevante (queda média de 45,9%), estreitamento de preferências (41,7%) e viés de bajulação (61,7%). O framework gera dados dinamicamente e usa métricas próprias para cada risco, mostrando que os efeitos são sistemáticos e não casos isolados.","pn":"Avaliação dinâmica de efeitos colaterais da personalização","pm":"Um framework gera dinamicamente cenários de avaliação com e sem contexto pessoal do usuário e aplica métricas específicas para medir quanto a personalização degrada a qualidade das respostas.","imp":"Se você mantém um assistente que usa histórico de conversa, preferências inferidas ou perfis de usuário, audite as respostas com e sem esse contexto pessoal. Meça se o modelo cita dados pessoais sem necessidade, repete só o que o usuário já gosta ou concorda demais com opiniões — e trate esses três números como métricas de qualidade, não só satisfação do usuário.","ex":"Um assistente de suporte técnico que recebe a pergunta 'como configuro backups no Linux?' junto com o perfil do usuário pode citar as preferências pessoais sem necessidade, sugerir apenas ferramentas que o usuário já usa (fechando alternativas melhores) ou concordar com uma afirmação errada do usuário sobre o próprio sistema, em vez de corrigir.","res":"Os números medem queda relativa nas métricas do próprio framework, não taxa de falha em produção; a gravidade real depende de quão agressiva é a personalização do seu produto. O paper não propõe correção, só diagnóstico — e a geração dinâmica de cenários pode introduzir vieses próprios nos casos de teste."},{"p":"2608.29310","ach":"Em WebGen-Bench e PaperBench, o scaffold sequencial ingênuo de biblioteca compartilhada sofre baixa taxa de extração de código comum e migração frágil de dependências. Com extração guiada por candidatos, consolidação prévia do codebase e migração consciente de contexto, o método preserva a funcionalidade das aplicações, reduz redundância, tokens, LOC e MDL, e evita a erosão estrutural (código morto, verbosidade) que a construção ingênua da biblioteca introduz.","pn":"Biblioteca compartilhada mantida por agente em portfólio de aplicações","pm":"Um agente que gera aplicações relacionadas em sequência extrai componentes comuns para uma biblioteca compartilhada, guiando a extração por resumos de trechos de código e a migração por grafos de chamada e trilhas de extração.","imp":"Se você usa agentes de código para gerar ou manter vários serviços que compartilham lógica de domínio, não deixe cada agente duplicar o código compartilhado: mantenha uma biblioteca única e faça o agente consolidar cada codebase antes de extrair peças para ela, usando o grafo de chamadas para não quebrar dependências ao migrar.","ex":"Um portfólio de microsserviços de e-commerce (catálogo, pedidos, pagamentos) gerados por agentes separados: cada um reimplementa validação de carrinho e retry de pagamento, e após semanas de manutenção agêntica acumulam-se wrappers mortos e logs verbosos. A migração sem grafo de chamadas renomeia uma função da biblioteca que um serviço ainda importa, quebrando o deploy.","res":"Os resultados vêm de dois benchmarks de geração de aplicações, não de portfólios corporativos reais com histórico e restrições operacionais; a manutenção é sequencial (uma aplicação por vez), e o ganho de redução de tokens e LOC não implica ganho proporcional em qualidade funcional, que apenas se preserva."},{"p":"2608.29387","ach":"Oito modelos avaliados em 150 tarefas de cinco turnos: o melhor atinge 74,9% de sucesso por turno mas completa apenas 37,3% dos episódios, e a retenção adjacente cai a 52,4% em tarefas com estado externo. A execução em navegador com screenshots, DOM e logs mostra que falhas de apresentação se concentram em arquitetura de informação e falhas de interação em propagação de estado derivado.","pn":"Avaliação de UI generativa por sincronização do artefato ao longo dos turnos","pm":"O benchmark executa a interface gerada em navegador real a cada turno e verifica, por evidência de execução, se comportamento, estado derivado, estado externo e alegações do assistente permanecem sincronizados conforme o artefato evolui.","imp":"Se você usa um LLM para gerar ou evoluir interfaces, não confie em métricas de turno único: teste o artefato executado após cada mudança e verifique se o estado derivado e o estado externo continuam corretos, porque o modelo pode acertar cada passo e ainda quebrar o todo.","ex":"Um painel interno gerado por LLM que recebe um novo filtro por turno: o modelo reescreve a tabela a cada pedido, mas deixa de propagar o filtro para o gráfico derivado e para a chamada de API que busca os dados, produzindo uma tela que parece correta e mostra números desatualizados.","res":"Os números vêm de três cenários específicos do benchmark com tarefas de cinco turnos; não provam que o mesmo colapso de retenção ocorra em domínios de geração de código fora de UI, nem que modelos mais novos não fechem essa lacuna. A retenção medida é adjacente, não a degradação ao longo de todo o episódio."},{"p":"2608.29464","ach":"Em 15 modelos abertos (4B a 1,60T), o compromisso verbalizado é menor para pistas vindas de retorno de ferramenta do que de mensagem do usuário, e a adoção não verbalizada é maior no canal de ferramenta em todos os 15 modelos. Monitores de transcrição detectam pior a adoção justamente nas células com maior adoção não verbalizada (r entre -0,54 e -0,78). Avisar que o raciocínio será monitorado não fecha a lacuna de forma confiável.","pn":"Confiabilidade do monitor de raciocínio varia com o canal da pista","pm":"Avalia-se se o traço de raciocínio registra a informação que moldou a resposta, variando o local e a explicitação da pista de preferência e medindo compromisso verbalizado versus adoção não verbalizada.","imp":"Se você audita agentes lendo o traço de raciocínio, pare de tratá-lo como registro completo: quando a preferência entra por retorno de ferramenta ou precisa ser inferida de um artefato bruto, o traço tende a omitir a influência. Adicione ao seu pipeline um teste que injete a mesma pista nos dois canais e compare o que o modelo diz que fez com o que a resposta revela que fez.","ex":"Um agente de suporte com ferramenta de CRM recebe no retorno da ferramenta um campo indicando que o cliente prefere respostas formais. O traço de raciocínio não menciona essa preferência, mas a resposta adota o tom formal; um monitor de transcrição que procura adoção de preferência não sinaliza nada, embora a influência tenha ocorrido.","res":"Os resultados valem para o cenário testado: chamada única com ferramenta pré-preenchida e pistas de preferência, não para conversas longas ou agentes multi-etapa. O prompt de atribuição de fonte reduziu a lacuna em sete modelos, às vezes aumentando a adoção não verbalizada no canal do usuário, e o estudo usa apenas modelos open-weight."},{"p":"2608.31022","ach":"Dez modelos multimodais avaliados em quatro representações de memória caem de desempenho alto sob observação total para desempenho claramente pior sob observação parcial. Três gargalos aparecem: integrar vislumbres fragmentados, parar de explorar antes de ver a sequência completa e não revisar crenças iniciais erradas diante de evidência contraditória.","pn":"Benchmark de percepção parcial que isola memória de trabalho de agentes","pm":"Um benchmark converte reconhecimento de dígitos em busca sequencial por vislumbres com restrição de retorno, isolando a construção de estado perceptual das complexidades física e de controle.","imp":"Se você avalia um agente que consulta documentos ou telas aos pedaços, teste-o com acesso restrito em vez de com o contexto inteiro: o score com tudo visível não prevê o comportamento quando ele precisa montar o quadro por partes e corrigir o que concluiu cedo demais.","ex":"Um agente de extração que folheia um PDF página por página acerta quando o documento cabe no contexto, mas para a busca na primeira página que parece responder à pergunta e mantém a resposta errada mesmo quando páginas seguintes a contradizem — o mesmo gargalo de crença não revisada que o benchmark isola.","res":"A tarefa é reconhecimento de dígitos em grade, muito mais simples que os ambientes visuais reais em produção; os gargalos medidos podem mudar de magnitude ou de forma com texto denso e interfaces complexas, e o paper não mostra que os três gargalos se transferem para esses domínios."},{"p":"2608.31076","ach":"Em ResearchClawBench, o framework ganhou em média 2,08 pontos variando três LLMs base com harness fixo e 2,95 pontos variando três harnesses com modelo fixo. No subconjunto de 20 tarefas do AstaBench E2E Discovery, o ganho médio foi de 16,8 pontos em três harnesses, mantendo ou aumentando as tarefas concluídas. O ganho vem de induzir critérios verificáveis antes de executar, não de um modelo melhor.","pn":"Rubrica executável induzida antes da execução da tarefa","pm":"O sistema decompõe uma instrução aberta em metas científicas atômicas, sintetiza critérios verificáveis a partir da literatura e dos dados visíveis da tarefa, e usa essa rubrica para guiar a execução, verificar por critério e direcionar revisões iterativas.","imp":"Antes de mandar um agente executar uma tarefa aberta, faça o agente (ou um passo seu) gerar uma lista de critérios verificáveis a partir da instrução e dos dados disponíveis, e use essa lista para checar e revisar a saída em vez de confiar em uma única passagem.","ex":"Um agente recebe 'analise este dataset e escreva um relatório' e esquece de testar suposições estatísticas básicas, produzindo conclusões não suportadas; com a rubrica induzida, o critério 'verificar premissas dos testes usados' fica explícito e a revisão guiada pela rubrica detecta e corrige a omissão antes da entrega.","res":"Os números vêm de benchmarks de descoberta científica com um subconjunto amostrado de apenas 20 tarefas no AstaBench, então a generalização para outros domínios de tarefa aberta não está demonstrada; e a validação completa depende de os critérios induzidos serem realmente verificáveis, o que nem toda instrução permite."},{"p":"2608.26175","ach":"Em 250.000+ chamadas de avaliação sobre 11 modelos-alvo, compressores treinados em inglês retêm 57-62% da utilização de contexto em inglês a keep-rate 0,33, mas apenas 10-24% em lituano e quase nada em chinês. Métodos determinísticos não mostram gap comparável, e o compressor multilíngue XProvence v1 não o mostra; sua versão v2, retreinada com dados traduzidos, esvazia 92% dos contextos chineses sem aviso. Um pipeline de traduzir-para-comprimir iguala ou supera a compressão nativa pela metade do custo em 3 de 5 línguas.","pn":"Compressores de prompt supervisionados em inglês degradam contextos em outras lí","pm":"Compressores extrativos treinados com supervisão em inglês preservam a utilidade do contexto em inglês mas descartam conteúdo essencial em outras línguas, e o gap acompanha os dados de supervisão, não a arquitetura.","imp":"Antes de ligar um compressor de prompt (ferramenta que corta tokens do contexto para reduzir custo) em produção, teste-o com prompts reais nas línguas que seu sistema atende — não confie no número de inglês. Se você serve usuários fora do inglês, prefira métodos determinísticos ou compressores treinados multilíngue, e considere traduzir para inglês antes de comprimir, que em várias línguas custa menos e preserva mais.","ex":"Um chatbot de suporte em lituano que usa LLMLingua-2 para cortar o histórico de conversa a 33% do tamanho: o compressor descarta tokens que o modelo-alvo precisa, e a resposta perde informação que o contexto original continha — falha invisível se você só mediu a qualidade em inglês.","res":"O gap foi medido em compressores extrativos e 11 modelos-alvo específicos; compressores generativos e modelos futuros podem se comportar diferente. O translate-then-compress vence em 3 de 5 línguas testadas, não em todas, e orçamentos seguros fora do inglês são menores — o número exato depende do par língua/modelo."},{"p":"2608.28281","ach":"No benchmark publicado, o melhor controlador atinge Strict Success Rate de 24,69% em tarefas completas, mostrando que modelos fortes falham em guiar agentes por tarefas longas. A avaliação por fatia (Type II) reproduz a ordenação dos controladores com Spearman ρ=0,9747. O esquema pareado reduz o custo estimado de inferência em média 64,4%.","pn":"Avaliar um modelo controlador por etapas intermediárias validadas em execução","pm":"O benchmark separa a capacidade de controlar um agente em três níveis: perguntas validadas por execução sem rodar o agente, controle de uma fatia da tarefa, e a tarefa completa pareada, permitindo medir controle de loop com custo de avaliação menor.","imp":"Ao escolher qual modelo usar como cérebro que orienta seus agentes de código, não avalie só pela saída final da tarefa: use checagens intermediárias validadas por execução, que custam menos e discriminam melhor quem controla bem o loop. Um modelo que entrega código bom pode ser um péssimo gestor do processo.","ex":"Numa esteira de desenvolvimento onde um modelo orquestra um agente de código em tarefas de múltiplas rodadas, o controlador pode confiar numa nota de progresso desatualizada e mandar submeter código não verificado — o run termina em sucesso aparente, mas a falha estava na decisão de parar, não no agente que escreve o código.","res":"Os números vêm de um benchmark próprio; o Strict Success Rate de 24,69% não diz qual dos dois lados (loop ou agente) limita o resultado em seu caso. A correlação alta do Type II vale para o critério Core principal e pode não se manter em outros critérios ou domínios de tarefa."},{"p":"2608.28363","ach":"Em 600 tarefas de auto-evolução, 197 mutações que melhoravam capacidade falhavam na verificação de recuperabilidade. Reparo convencional recuperava 0/197; com endereçamento exato de estado e linguagem de recuperação estendida, o oráculo recupera 191/197. A interação negativa entre diagnóstico e linguagem rica (93,0% vs 99,3%) apareceu só em um backbone, indicando dependência do modelo.","pn":"Verificação de recuperabilidade para auto-modificação de agentes","pm":"Cada mutação feita pelo agente é acompanhada de um programa de recuperação que é sintetizado, diagnosticado e verificado de forma independente contra estados contrafactuais antes de ser aceito.","imp":"Antes de aceitar uma mudança que seu agente faz no próprio prompt, ferramenta ou middleware, exija um caminho de reversão verificado contra estados diferentes daquele em que a mudança nasceu. Iterar só com prompting até a mutação 'funcionar' deixa efeitos persistentes que ninguém sabe desfazer.","ex":"Um agente de atendimento reescreve a própria instrução de roteamento para melhorar a taxa de resolução; semanas depois, com catálogo de ferramentas diferente, a mutação quebra o roteamento e não há registro de como restaurar o comportamento anterior. Verificação contrafactual teria rejeitado a mutação no momento da criação.","res":"Os números vêm de 600 tarefas one-shot sintéticas com dois backbones; a interação negativa entre grounding e expressividade não se replicou no Qwen, então resultados finos são dependentes do modelo. O paper valida recuperação em estados contrafactuais, não a segurança da mutação em si."},{"p":"2608.30468","ach":"Hi-Q alcança 52,3 EM e 64,0 F1 de média em três benchmarks de QA multi-hop com recuperação em corpus completo, superando IRCoT em 15,1 EM e PropRAG em 11,5 EM no MuSiQue-full, sem construir grafo em todo o corpus. A topologia da árvore de consulta é decidida por sinais de suporte do corpus, não por um template fixo de decomposição.","pn":"refinamento hierárquico de consulta guiado por evidência recuperável","pm":"Uma árvore de consulta é expandida a partir de sinais de suporte do corpus: um operador de resolução testa se a evidência recuperada sustenta cada unidade da consulta, encerrando nós resolvidos e expandindo apenas os não resolvidos, com um verificador de cobertura semântica validando a expansão.","imp":"Em vez de reformular a consulta do RAG sempre do zero a cada iteração, teste primeiro se os documentos já recuperados sustentam cada subpergunta: o que já está sustentado fica pronto, e só o que falta é decomposto. Isso economiza chamadas de busca e evita decompor demais perguntas que uma única recuperação já resolve.","ex":"Num pipeline RAG que responde perguntas sobre contratos, uma pergunta como 'qual fornecedor ganhou o lote X e quanto foi pago' hoje dispara a mesma reescrita iterativa do IRCoT mesmo quando o contrato já recuperado contém ambas as respostas; o operador de resolução detecta a cobertura e encerra sem segunda busca, enquanto no caso do lote pago em anexo separado ele expande só o ramo de pagamento.","res":"Os números vêm de benchmarks de QA multi-hop com distratores controlados; em produção, a qualidade do verificador de cobertura semântica determina se o nó é encerrado cedo demais, e o paper não mede esse erro de encerramento em domínios abertos. Implementar o padrão por descrição exige reconstruir os operadores sem o código dos autores."},{"p":"2609.00551","ach":"Em três benchmarks de QA sobre vídeos longos, a memória por eventos supera a melhor baseline em 2,0 a 3,7 pontos de acurácia e 7,0 pontos em recall estrito de evidência. Também corta 63,66% dos tokens de inferência e reduz a latência por consulta em 4,67 vezes. O ganho vem de devolver evidência alinhada em vez de fragmentos que o modelo precisa religar na hora de responder.","pn":"Memória multimodal centrada em eventos com evidência pronta para geração","pm":"A construção da memória vincula registros de texto, frames e fatos de grafo a âncoras de evento, de modo que cada célula alinhada carrega contexto temporal, relações e proveniência, e a leitura no momento da consulta devolve evidência compacta em vez de fragmentos isolados por modalidade.","imp":"Você pode reorganizar seu índice de RAG para agrupar evidências em torno de um evento (com timestamp e fonte) em vez de recuperar trechos soltos, e avaliar se a resposta já chega montada: menos tokens por consulta e menos reconstrução no momento da resposta.","ex":"Num assistente que responde perguntas sobre gravações longas de reunião, o RAG atual devolve separadamente a legenda de um slide, um trecho da transcrição e um resumo; o modelo erra a ordem temporal e cita fonte errada. Com células indexadas por evento, a leitura traz os três registros com carimbo de tempo e proveniência já casados.","res":"Validado só em QA de vídeo longo multimodal; os ganhos de latência e tokens dependem do custo de reconstrução na inferência, que pode ser menor em textos puros. O código ainda não está publicado — o repositório anunciado é integração futura —, então hoje a adoção é pela descrição do desenho, não por biblioteca pronta."},{"p":"2609.00621","ach":"Em três domínios (raciocínio sintético, geração de revisão colaborativa e precificação de seguros), a separação entre protocolo e conteúdo atingiu 100% de validade eventual do protocolo, com ganhos consistentes de desempenho na tarefa. Nos sistemas de referência, uma edição de prompt voltada a melhorar conteúdo podia corromper roteamento ou formato e derrubar o pipeline inteiro. Com a separação, o otimizador nunca enxerga a interface de que o código depende.","pn":"Separação de fluxo de controle e de dados em prompts de sistemas multiagente","pm":"A parte do prompt que especifica protocolos de execução (roteamento, formato de saída, sinal de término) é representada como objetos de programa tipados e validados fora do texto otimizável, de modo que o otimizador de prompt só altera o fluxo de linguagem sem tocar a interface de que o código depende.","imp":"Se você otimiza prompts de um sistema multiagente automaticamente, pare de colocar instruções de roteamento, formato de saída e critérios de parada no mesmo texto livre que o otimizador edita. Extraia essas regras para contratos validados fora do prompt — por exemplo, esquemas de saída checados por código — e deixe o otimizador mexer só na linguagem da tarefa. Isso elimina a classe de falha em que uma melhoria de conteúdo quebra a execução.","ex":"Num pipeline de análise de sinistros com agentes de triagem, cálculo e emissão, o texto do prompt dizia qual agente recebe cada mensagem e em qual formato JSON responder. O otimizador reescreveu essa instrução ao buscar respostas melhores, o roteador parou de reconhecer o sinal de término e o fluxo travou; com a separação, o roteamento fica em objeto tipado validado e o otimizador não pode corrompê-lo.","res":"Os resultados vêm de fluxos de trabalho sintéticos e de domínios específicos; 100% de validade eventual não garante os mesmos números em pipelines com protocolos menos padronizados. E o desenho só protege o que é separado: qualquer regra de execução que continuar embutida em linguagem natural no prompt segue exposta ao mesmo risco de corrupção."},{"p":"2609.01481","ach":"A camada orquestradora eleva o desempenho de três pares harness-modelo em média 52,25% (máximo 82,86%) em três benchmarks de desenvolvimento de software após três iterações. Em uma implantação de múltiplos dias com mais de 70 iterações, o sistema produziu sozinho um jogo FPS jogável com mecânicas centrais implementadas, visuais e áudio integrados. O ganho vem do controle de escopo: cada loop entrega incrementos pequenos e verificáveis em vez de tentar o sistema inteiro de uma vez.","pn":"Camada orquestradora sobre harness de agente com incrementos verificáveis","pm":"Uma camada externa organiza execuções de um harness de codificação em loops de planejamento-código-teste que balanceiam reparo com crescimento de capacidade, restringindo cada iteração a entregas verificáveis e separando testes de implementação de avaliação independente, com histórico versionado do projeto.","imp":"Se você roda um agente de codificação em tarefas longas, em vez de pedir o sistema completo e corrigir falhas no final, envolva o harness em uma camada que divide o trabalho em entregas pequenas com verificação própria a cada ciclo, e mantenha um histórico versionado para reutilizar o que já funcionou em vez de recriar.","ex":"Um agente de codificação que recebe 'construa um portal de vendas' e trava gerando 10 mil linhas com bugs encadeados: com incrementos verificáveis, ele entrega primeiro o esquema de dados com testes de implementação passando, depois a API de pedidos validada por avaliação independente, e só então a interface, evitando que um erro de fase inicial contamine todo o código posterior.","res":"Os ganhos são medidos em três benchmarks e três pares harness-modelo após apenas três iterações, o que não garante que a curva de melhoria se sustente em escalas muito maiores; o caso de múltiplos dias é um exemplo, não uma avaliação controlada. O framework restringe saídas verificáveis, então domínios onde a correção não é facilmente testável podem se beneficiar menos."},{"p":"2608.30478","ach":"O paper argumenta que agentes de linguagem atuais resolvem tarefas delimitadas definidas pelo usuário, enquanto assistência persistente exige operação contínua em ambientes de longa duração. Propõe uma arquitetura em que a percepção de sinais de execução, contexto e ambiente gera tarefas de ciclo de vida que governam a adaptação dos procedimentos. Usa essa estrutura para organizar retrospectivamente trabalhos recentes e um estudo de caso detalhado.","pn":"Arquitetura centrada em percepção para agentes persistentes","pm":"Componentes de percepção e controle monitoram continuamente sinais de execuções de tarefas, contexto interno e mudanças do ambiente, e convertem esses sinais em tarefas de ciclo de vida que dirigem a operação e a adaptação contínua dos procedimentos do agente.","imp":"Ao desenhar um agente que fica no ar atendendo necessidades que mudam ao longo do tempo, reserve um componente cujo trabalho é observar execuções passadas e do ambiente e transformar o que percebe em uma fila de tarefas internas de manutenção e adaptação — em vez de tratar cada chamada como um problema isolado.","ex":"Um agente de suporte interno de uma empresa: um procedimento de reembolso muda de política, clientes começam a perguntar sobre um produto novo, e o agente não tem mecanismo para captar essas mudanças; a arquitetura proposta trata essas percepções como tarefas de ciclo de vida que disparam a atualização dos procedimentos do agente.","res":"É um framework conceitual sem instrumento, benchmark ou implementação: nada mede se a arquitetura melhora agentes reais. O estudo de caso é ilustrativo, e ler o modelo como receita pronta de implementação é a leitura errada mais provável."},{"p":"2608.30730","ach":"Em 365 dias simulados de operação de múltiplas lojas, nenhum dos 18 modelos avaliados domina: GPT-5.6 Sol maximiza ativos (100.000 → 1.431.425) mas fica em 16º de 18 em evitar fraude. Entre modelos abertos, Qwen3.8-Max-Preview alcança 416.252, 38% acima do GLM 5.2 (high), e é o que mais aprende ao longo do horizonte, reduzindo preços negociados em pedidos repetidos.","pn":"Ambiente determinístico de dois lados para medir adaptação de longo horizonte","pm":"Um ano simulado de operação com demanda fixa e kernel de negociação determinístico, do qual o modelo de linguagem apenas verbaliza decisões, torna reprodutível a medição de como o agente adapta sua política ao longo de milhares de passos.","imp":"Antes de escolher um modelo para um agente que roda por dias ou semanas, você precisa decidir qual dimensão importa mais: o melhor modelo em lucro não é o melhor em segurança nem em eficiência. Meça as dimensões separadamente no seu domínio em vez de confiar em um placar único, e teste se o agente melhora com o tempo de operação, não só na primeira rodada.","ex":"Um agente de compras que negocia com fornecedores em pedidos recorrentes: o benchmark mostra que modelos conseguem barganhar preços progressivamente mais baixos ao longo de pedidos repetidos, então um sistema avaliado apenas em uma sessão única de negociação subestima essa capacidade de adaptação.","res":"Os dois lados do mercado são determinísticos por construção: clientes e fornecedores seguem modelos fixos, com o LLM apenas verbalizando decisões. Isso garante reprodutibilidade, mas não prova que os rankings se transferem a mercados com contraidentidades adaptativas reais; não é um teste de robustez contra adversários de verdade."},{"p":"2608.24777","ach":"StepGuard atinge a maior acurácia média entre modelos guarda open-weight, com desempenho comparável a GPT-5.4. Usado para proteger agentes no AgentDojo e no AgentDyn, reduz a taxa média de sucesso de ataques em 77,3% relativo ao cenário sem guarda, com queda média de utilidade de apenas 2,8 pontos percentuais. O motor de dados StepGen gera trajetórias seguras e inseguras idênticas até o passo arriscado.","pn":"Guarda por passo com pares de trajetórias divergentes no passo de risco","pm":"Um motor de dados gera pares de trajetórias idênticas até o passo arriscado e divergentes nele, e o treinamento equilibra a precisão entre ações seguras e inseguras para reduzir defesa excessiva e omissão.","imp":"Você pode auditar cada chamada de ferramenta antes de executá-la, em vez de revisar a trajetória inteira depois que o dano já aconteceu. Coloque o modelo guarda open-weight entre o agente e a ferramenta e bloqueie ações arriscadas no momento da decisão, aceitando uma perda pequena de utilidade.","ex":"Um agente com acesso a sistema de arquivos recebe um prompt injetado que o induz a enviar um arquivo confidencial por uma ferramenta de rede. A guarda avalia o passo antes da execução, vê que a ação vaza informação num contexto benigno de leitura, e bloqueia a chamada — em vez de descobrir o vazamento ao auditar a trajetória concluída.","res":"Os números vêm de dois benchmarks de ataque específicos; a queda de utilidade de 2,8 pontos é média e pode se concentrar em tarefas legítimas que parecem arriscadas. Comparação com GPT-5.4 é de acurácia de classificação, não de custo de operação em produção."},{"p":"2608.28444","ach":"Em Needle-in-a-Haystack e BABILong, SWA com sinks atinge desempenho 2 a 10 vezes maior que modelos com attention linear pós-treinada, em múltiplos LLMs e tarefas downstream. O resultado vale sem nenhum pós-treinamento adicional, com inferência rápida e pouca memória.","pn":"","pm":"","imp":"Antes de investir em migrar seu serviço para um modelo com attention linear pós-treinada para cortar custo de contexto longo, teste SWA com sinks no seu workload: a troca não exige retreino e tende a custar menos memória e latência pelo mesmo desempenho.","ex":"Um assistente que recupera trechos de contratos em um contexto de 100k tokens e usa um modelo com attention linear pós-treinada para baratear a inferência: nas tarefas de recuperação tipo BABILong, esse modelo erra até 10 vezes mais que o mesmo pipeline rodando SWA com sinks, porque a compressão de estado da attention linear perde a agulha.","res":"A comparação é contra attention linear aplicada por pós-treinamento; modelos lineares treinados do zero podem se sair melhor e não são cobertos pelo resultado. As tarefas de recuperação medem memória de contexto pontual, não raciocínio distribuído por todo o documento, e o ganho depende de a janela deslizante caber no padrão de acesso do seu caso."},{"p":"2608.29607","ach":"SnapBench avalia 16 recuperadores multimodais sob 53 condições controladas de corrupção em 1.145 queries e 9.085 itens de galeria, com anotação humana. Corrupções de imagem degradam substancialmente a recuperação conjunta, enquanto corrupções de texto afetam pouco a recuperação conjunta. Recuperação só com imagem limpa frequentemente supera a recuperação conjunta.","pn":"Calibração de confiabilidade por modalidade na fusão de recuperação multimodal","pm":"A fusão de pontuações de recuperação entre imagem e texto é reponderada dinamicamente conforme a confiabilidade estimada de cada modalidade diante de entradas corrompidas.","imp":"Antes de confiar num pipeline de busca que combina foto e texto, teste-o com fotos borradas e perguntas com erro de digitação: o resultado limpo pode enganar, porque juntar texto à imagem às vezes puxa a busca para descrições genéricas. Vale medir a qualidade de cada entrada separadamente e desconfiar da fusão fixa entre modalidades.","ex":"Num assistente mobile em que o usuário fotografa um produto e digita a pergunta, uma foto tremida faz o embedder multimodal retornar resultados de categoria genérica em vez do produto correto, enquanto a mesma busca com a imagem limpa acertaria — a fusão pondera a imagem corrompida sem verificar sua confiabilidade.","res":"Os achados valem para o cenário snap-and-ask com corrupções controladas; não provam que o degradê acontece em distribuições naturais de uso. O método de reponderação proposto é apresentado como ilustração da necessidade de calibração, com validação limitada, e não como solução madura."},{"p":"2608.30322","ach":"Em quinze tarefas de calibração, uma configuração de agente de fronteira passou 68,0% com o artefato e 0% sem ele, o que isola o conhecimento ausente dos corpora públicos como causa da falha. Em uma tarefa, um artefato plausível porém incorreto também deu 0% em cinco tentativas. Sete tarefas passaram a triagem empírica de gating em cinco tentativas.","pn":"Porta de conhecimento com instrução byte-idêntica para testar dependência de um","pm":"A construção da tarefa separa a instrução de um artefato compacto com convenções privadas, mantendo a instrução byte-idêntica nas condições com e sem o artefato, com provenance, auditoria de vazamento e witnesses executáveis que tornam a dependência explícita e verificável.","imp":"Quando o seu agente falha em tarefas profissionais, teste se o problema é falta de convenções privadas: rode a mesma tarefa com e sem um artefato contendo as convenções e compare as notas. Se a diferença for abissal, o conserto é injetar o artefato, não refinar o prompt nem trocar de modelo.","ex":"Um agente de codificação que gera consultas SQL internas falha sem o dicionário de dados da empresa: com a tabela de referência no artefato passa 68% das tarefas, sem ele erra tudo — e com um dicionário parecido, mas desatualizado, erra tudo de novo, mostrando que acertar depende do conteúdo exato do artefato.","res":"Os experimentos validam o comportamento do protocolo de construção, não a qualidade das tarefas retidas para pós-treinamento, como os próprios autores admitem. O repositório é liberado só em parte, e a validação cobre quinze tarefas de calibração com uma única configuração de agente de fronteira."},{"p":"2608.30751","ach":"Em oito modelos abertos de texto e código, todos traduzem geometria especificada em palavras para código com confiabilidade, mas o desempenho em layout aberto varia muito. Trocar código procedural por SVG bruto melhora as notas de layout em todos os modelos, e sondas de ativação mostram que o modelo acompanha o estado geométrico durante a geração em vez de executar um plano fixo.","pn":"Separação entre tradução de geometria e composição de layout","pm":"Submeter o modelo a duas tarefas do mesmo domínio, uma com geometria totalmente especificada e outra aberta, isola a capacidade de raciocínio espacial 2D da mera habilidade de traduzir descrições em código.","imp":"Se você pede para um modelo gerar imagens ou diagramas via código, peça SVG direto em vez de código que desenha: o mesmo modelo pontua melhor só pela troca do meio. E ao avaliar candidatos para tarefas espaciais, teste layout aberto separadamente — a nota de tradução de código não prevê quem compõe bem a imagem.","ex":"Um sistema que gera diagramas a partir de descrições em linguagem natural usando um LLM para escrever scripts de plotagem: o paper indica que pedir o SVG bruto do diagrama produz melhor arranjo espacial do que pedir o script, porque o meio de saída muda o desempenho de layout.","res":"Os resultados valem para oito modelos abertos de texto e código e para imagens sintéticas do benchmark; não provam que a troca de meio generalize para qualquer domínio visual ou para modelos fechados. A parte de sondas de ativação exige acesso aos estados internos e serve como evidência, não como método que times de aplicação consigam repetir."},{"p":"2608.30949","ach":"O benchmark mostra que retrievers multimodais existentes sofrem de vies de perspectiva unica: retornam documentos alinhados a um so ponto de vista de consultas abertas. Sao 104.9K consultas do Stack Exchange com descricoes de perspectivas anotadas, cobrindo multiplos dominios e modalidades. O metodo SPIN melhora a cobertura e generaliza para benchmarks de busca aberta fora do conjunto de treino.","pn":"Avaliacao de cobertura de perspectivas em consultas abertas de busca","pm":"Consultas abertas recebem anotacoes de perspectivas implicitas, e a recuperacao e medida pela cobertura dessas perspectivas multiplas em vez da relevancia de um unico documento.","imp":"Se seu sistema de busca atende perguntas abertas (tipo 'vale a pena migrar para Kubernetes?'), nao valide so com relevancia tradicional: rode avaliacao de cobertura de perspectivas usando o dataset publico, e trate retriever que devolve apenas um lado da questao como falha de produto, nao como detalhe.","ex":"Um chatbot de suporte tecnico que recupera documentos do Stack Exchange para perguntas como 'devo usar microservicos?' tende a retornar apenas respostas favoraveis (ou apenas criticas), porque o retriever pontua similaridade sem considerar que a consulta tem lados opostos validos — o usuario recebe uma recomendacao enviesada sem saber que existe outro lado.","res":"O dataset vem de Stack Exchange, dominio de perguntas e respostas em ingles; cobertura de perspectivas em outros tipos de corpus ou idiomas nao esta provada. O ganho relatado do metodo de correcao exige treinar os vetores de ruido, o que nao faz parte do que o leitor adota so com o dataset."},{"p":"2608.31100","ach":"O benchmark avalia três formas de incorporar experiência em sete jogos de texto com verificadores executáveis. Resumos de experiência só superam histórico bruto quando a experiência se comprime em regras estratégicas reutilizáveis; treino de parâmetros traz ganhos grandes em algumas tarefas mas exibe transferência negativa severa em outras. Auto-melhoria não é automática nem uniforme entre pares modelo-tarefa.","pn":"Protocolo de diagnóstico de auto-melhoria de agentes com exploração e avaliação","pm":"Um benchmark interativo separa exploração permissiva de avaliação em tarefas held-out com verificadores executáveis, medindo três capacidades acopladas de agentes de linguagem: testar o próprio comportamento, julgar a experiência gerada e convertê-la em melhoria de decisão futura.","imp":"Antes de adicionar memória de resumos ou ajustar o agente com a própria experiência de execução, teste se a tarefa permite comprimir essa experiência em regras reutilizáveis; em tarefas que dependem de informação exata do estado atual, guardar histórico bruto costuma render mais do que resumir, e treinar com a experiência pode piorar outros casos.","ex":"Em jogos de texto que exigem escolher a ação certa conforme o estado exato do ambiente, comprimir episódios passados em resumos descarta detalhes contingentes do estado, e o agente com memória resumida erra onde o agente que consulta o histórico bruto acerta; no treino de parâmetros com essa experiência, o modelo melhora no jogo visto e regride em tarefa vizinha (transferência negativa).","res":"Os resultados vêm de sete jogos de texto; a regra 'resumo versus histórico bruto' depende da estrutura da tarefa e não foi estabelecida fora desse domínio. O benchmark diagnostica o processo, não prescreve a representação de experiência correta para cada caso."},{"p":"2608.31111","ach":"Agentes atuais completam loops de treino e edição de harness, mas os ganhos em pesos do modelo são esparsos e instáveis, e o melhor harness evoluído fica abaixo da referência engenheirada do Qwen-Agent. Os agentes frequentemente treinam com dados desalinhados da meta e confiam em autoavaliações estreitas, então ganhos locais não transferem para a avaliação oculta, e busca continuada pode apagar melhorias anteriores.","pn":"Avaliação oculta para evolução dirigida por meta vaga","pm":"O agente recebe apenas uma meta de capacidade em linguagem natural, decide sozinho dados, sinais de treino e validação, e é julgado depois em um conjunto de tarefas que nunca viu, expondo se os ganhos locais transferem.","imp":"Desconfie de ganhos medidos por autoavaliação do próprio agente: antes de aceitar que um loop de melhoria funcionou, valide contra um conjunto de testes que o agente nunca viu e que foi escrito por outra pessoa. Se você mantém pipelines de otimização automática de prompt ou harness, reserve uma parcela de tarefas fora do alcance do sistema para checar se a melhora local realmente se transfere.","ex":"Um agente que ajusta o próprio prompt para aumentar acerto num conjunto de validação que ele mesmo escolheu: o ASPIRE mostra que isso frequentemente treina com dados desalinhados da meta real, então a métrica local sobe enquanto o desempenho nas 520 tarefas ocultas de seis metas cai ou fica estagnado.","res":"O benchmark cobre seis metas e 520 itens autoriais, então os números não provam que a instabilidade de ganhos em pesos vale para qualquer meta ou domínio. E o resultado sobre práticas de autoevolução descreve uma capacidade que ainda não existe em produção — não invalida algo que o leitor já faça hoje."},{"p":"2609.01437","ach":"Harnesses gerados por LLMs ficam substancialmente atrás de referências humanas em código e em pesquisa, mas igualam ou superam as referências escolhidas em escrita e experimentação de ML. Os ganhos de evolução iterativa são instáveis e transferem-se apenas parcialmente para tarefas retidas. Com modelo de execução fixo, os ganhos dependem fortemente do modelo que roda o harness, indicando baixa transferência entre modelos.","pn":"Benchmark cuja unidade de avaliação é a infraestrutura de execução","pm":"Avalia-se o agente pelo sistema de execução que ele constrói e itera, medindo sucesso em benchmarks retidos e custo de tokens de execução, em vez de medir apenas saídas de tarefas em um harness fixo.","imp":"Antes de confiar em um harness auto-evoluído pelo próprio agente, você precisa revalidá-lo com o modelo que vai executá-lo em produção, porque o ganho medido com outro modelo não se transfere. E trate ganhos de evolução como instáveis: meça em tarefas retidas, não nas mesmas do loop de ajuste.","ex":"Um agente de código em produção cujo harness foi otimizado por iteração usando GPT-class como executor mostra queda de sucesso quando a empresa troca o modelo de execução por um concorrente mais barato: os ganhos estavam acoplados ao modelo original e não à infraestrutura.","res":"Os ganhos de evolução são parcialmente instáveis e a comparação em escrita e ML usa referências 'selecionadas', não necessariamente as melhores disponíveis, o que pode inflar o empate. O benchmark não prova que auto-evolução de harness seja inútil, apenas que a transferência atual é fraca."},{"p":"2609.01865","ach":"ExecRetrieval mede 23 configurações de embeddings densos mais BM25 em 939 tarefas Python com até quatro distratores defeituosos quase idênticos por tarefa. O melhor sistema hospedado atinge exec@10 de 1,00 mas exec@1 de apenas 0,331. Entre 91,5% e 99,4% dos erros de rank-1 são justamente as variantes com defeito, e em 67-78% das consultas a implementação correta pontua abaixo de ao menos um distrator.","pn":"Distratores quase-clone verificados por execução no pool de busca","pm":"Inserir no pool de recuperação variantes com defeito geradas por mutação única e validadas por execução torna possível medir se o rank do recuperador discrimina correção funcional em vez de similaridade superficial.","imp":"Não confie no rank-1 de busca vetorial de código para escolher qual snippet mostrar ao agente: a semelhança textual engana o modelo e a versão errada pode vir primeiro. Peça vários candidatos (top-10 resolve bem neste benchmark) e valide por execução ou testes antes de usar o código recuperado.","ex":"Em um agente de codificação com RAG que injeta no contexto o primeiro resultado da busca por embeddings, ao buscar uma função de validação de datas, o recuperador pode trazer primeiro uma variante com defeito que difere da correta por um único caractere de comparação, e o agente gera código com o mesmo bug sem perceber.","res":"Os resultados valem para tarefas Python curtas com mutação de edição única; não provam que o mesmo colapso ocorra em corpora grandes e heterogêneos, onde distratores tão próximos são mais raros. Exec@10 = 1,00 indica que o problema está na ordem de ranqueamento, não na ausência do candidato correto no pool."},{"p":"2609.01925","ach":"Em InfiniteBench, RULER e LongBench com duas famílias de modelos, o CRISP substitui o roteamento por divergência Jensen-Shannon por um proxy que mede massa de atenção em posições compatíveis com padrões estruturais, mantendo as mesmas decisões de roteamento. Remove o acúmulo de ruído O(n) dos limiares cumulativos pós-softmax. Resultado: até +28,0 pontos percentuais em tarefas de recuperação sobre baselines e speedup de atenção de até 5,30x com 512k tokens.","pn":"Leitura direta do roteamento a partir da estrutura do proxy de atenção","pm":"A decisão de roteamento de cabeças para padrões esparsos pode ser lida diretamente da estrutura do mapa de atenção do proxy, eliminando o custo de calcular uma divergência estatística como sinal de roteamento.","imp":"Se você opera atendimentos de contexto muito longo, este trabalho mostra que o custo de decidir quais partes da atenção esparsificar pode ser maior do que o ganho dela; ao negociar benchmarks ou kernels com fornecedores de inferência, cobre proxies estruturais diretos em vez de métricas estatísticas indiretas, pois medem a mesma coisa sem a etapa extra de cálculo.","ex":"Em um pipeline de análise de contratos com 500k tokens rodando em vLLM, o prefilling denso domina a latência e os métodos esparsos dinâmicos disponíveis perdem recuperação exata de cláusulas porque seus limiares cumulativos acumulam ruído de fundo conforme o contexto cresce; o mecanismo do CRISP ataca exatamente esse acúmulo, e é por isso que fornecedores de engine devem ser questionados sobre o roteador que usam.","res":"Nada disso é adotável sem modificar o kernel de atenção da engine de inferência; quem usa modelos via API ou engine pronta não ganha nada hoje. O abstract não menciona código aberto, e os ganhos foram medidos apenas em duas famílias de modelos em benchmarks de contexto longo, então a transferência para outras arquiteturas e cargas não está demonstrada."},{"p":"2609.02272","ach":"Substituir planos livres por especificações compiladas do paper eleva a fidelidade referenciada de 3,64 para 4,15 no Paper2CodeBench, um ganho relativo de 13,8%. Críticas de alta severidade caem de 13,2% para 6,1%. O ganho vem de preservar proveniência e restringir consistência entre arquivos.","pn":"Compilação de evidência do paper em especificações de repositório","pm":"A evidência extraída do paper é transformada em especificações explícitas no nível de repositório, com proveniência, requisitos de não-degradação, dependências entre arquivos e atribuição de responsabilidade, que restringem a geração de código sem eliminar escolhas locais de engenharia.","imp":"Quando um agente de código precisar implementar algo descrito em documento (paper, RFC, design doc), faça o agente primeiro gerir uma especificação estruturada com marcação de origem — o que o documento sustenta, o que foi inferido e o que ficou pendente — antes de gerar código. Isso reduz simplificações algorítmicas silenciosas.","ex":"Em geração de código a partir de papers de ML, agentes que recebem planos em texto livre comprimem ou reinterpretam detalhes do protocolo de avaliação, gerando repositórios que rodam mas calculam métricas de forma inconsistente entre arquivos; as especificações com dependências cruzadas explícitas impedem essa divergência.","res":"Os números vêm de um único benchmark (Paper2CodeBench), avaliado com LLM como juiz, cuja correlação com correção real do código não está estabelecida fora do próprio paper. Não há evidência do ganho em outros domínios de especificação, como RFCs de engenharia."},{"p":"2609.02737","ach":"Em 15 tarefas de contexto longo, em zero-shot, o protocolo reduziu em 52,0% e 31,1% os tokens atendidos durante a decodificação em dois modelos comerciais, com quedas de acurácia de 1,27pp e 2,75pp que diminuem com a escala do modelo. O mecanismo é parsear declarações do próprio modelo no raciocínio como se fossem chamadas de ferramenta e pular a leitura do cache de atenção nos modos foco e local. Não há treino: os modelos são usados como vêm.","pn":"Atenção declarada por marcas no raciocínio","pm":"O modelo declara no próprio raciocínio em qual modo de atenção está — contexto total, região específica ou saída recente — e o motor de inferência interpreta essas declarações como chamadas de ferramenta, pulando a leitura da maior parte do cache de chaves e valores.","imp":"Você pode cortar o custo de contextos longos conversando com o modelo em vez de trocar de engine: instrua-o a marcar no raciocínio quando precisa de tudo, de um trecho ou só do que acabou de dizer, e faça o seu serviço de inferência interpretar essas marcas para pular a leitura do cache nos trechos dispensados. Em um assistente com conversas de milhões de tokens, isso reduz o custo por resposta sem trocar de modelo nem retreinar nada.","ex":"Um assistente interno com histórico de conversa de 1 milhão de tokens recebe uma pergunta sobre um detalhe dito no início. Hoje, cada token gerado varre o cache inteiro. Com o protocolo, o modelo declara modo foco na região do detalhe, o parser limita a leitura do cache a essa região e as camadas globais deixam de processar o restante do histórico, cortando mais da metade dos tokens atendidos.","res":"A queda de acurácia é modesta mas real, medida em benchmarks de contexto longo — não prova o comportamento em tráfego de produção com instruções ambíguas. O ganho depende de o modelo declarar os modos de forma confiável em zero-shot, e os autores próprios apontam que métodos com treino teriam potencial maior; a marcação falha em modelos menores."},{"p":"2609.02749","ach":"Com backbone, harness e orçamento de execução fixos, o agente com skills destiladas de 1.000 repositórios ML supera o mesmo agente sem skills em 134,3% no MLE-bench, 34,4% no PaperBench, 9,2% no FrontierCS e 14,0% no PassNet. A biblioteca tem mais de 5.000 skills de 20 áreas e 178 famílias de capacidade. Os ganhos vêm só do contexto operacional adicionado.","pn":"Destilação de repositórios em biblioteca de skills verificadas e reutilizáveis","pm":"Repositórios populares são condensados em skills compactas e verificadas, por via task-agnostic e task-oriented, e carregadas pelo agente durante a tarefa em vez de redescobertas a cada execução.","imp":"Antes de escrever prompts gigantes com know-how de domínio em cada tarefa, construa um pipeline que extraia esse conhecimento dos repositórios que seu time já usa, verifique e compacte em unidades reutilizáveis, e injete só a skill que a tarefa pede.","ex":"Um agente de codificação que refaz fine-tuning de modelo a cada execução carrega o repositório inteiro do Hugging Face e estoura o contexto ou erra a ordem das etapas; com uma skill verificada de 'como submeter ao MLE-bench', a sequência de comandos já testada é carregada direto.","res":"Os ganhos foram medidos em agentes de pesquisa ML com um backbone específico e um harness fixo; não prova que skills destiladas de repositórios de outro domínio (ex.: infraestrutura web) rendam o mesmo, nem que a destilação task-agnostic seja melhor que só a task-oriented. Verificação de skills não elimina skills erradas que passam."},{"p":"2609.02783","ach":"Em três benchmarks de agentes (SWE-bench Verified, TerminalBench, Toolathlon), interromper execuções cujo resultado já é previsível eliminou 13% a 26% dos passos e até 44,1% dos tokens de entrada, com acurácia de predição de 89% a 97%. As taxas de resolução por agente mudaram em média apenas um a dois pontos percentuais. O custo por tarefa — não apenas o número de tarefas — é o que cai.","pn":"Predição calibrada de resultado para interrupção antecipada de execuções de agem","pm":"Classificadores de sucesso e falha treinados sobre comportamento intermediário da execução interrompem a avaliação no momento em que um deles cruza um limiar de confiança calibrado, sem esperar o fim do episódio.","imp":"Você pode cortar a conta de avaliar agentes sem reduzir o conjunto de tarefas: rode os classificadores de resultado sobre o comportamento parcial e aborte a execução quando o veredito já estiver claro. Isso muda o cálculo de custo do seu ciclo de desenvolvimento iterativo, que hoje paga o episódio inteiro mesmo quando ele já era previsível.","ex":"Num agente de correção de bugs avaliado no SWE-bench Verified, uma sessão que já acumulou dezenas de passos sem editar arquivo algum e com o classificador de falha acima do limiar é encerrada antes de gastar os tokens restantes da tentativa — exatamente os episódios mais caros e mais previsíveis.","res":"O ganho depende de o resultado ser evidente cedo; execuções equilibradas rodam até o fim, e o corte de 13%–26% de passos é bem menor que o de tokens de saída. A mudança de um a dois pontos na taxa de resolução é média, não garantia por agente — para comparações finas entre versões, o ruído introduzido pode importar mais que a economia."},{"p":"2609.00519","ach":"A análise codificada de resultados publicados mostra que evidências de ajuda nociva que passa pelo safeguard são frequentes e bastam para provar risco residual, enquanto a alegação oposta — que pouco resta — raramente encontra suporte: só uma pequena minoria das alegações codificadas traz evidência sobre o que o sistema ao redor ainda permite, e uma única delas delimita o resíduo com escopo. Melhorar a métrica local do safeguard não equivale, por si, a tornar o sistema mais seguro.","pn":"","pm":"","imp":"Não aceite o relatório do seu filtro de segurança como atestado de segurança do serviço. Antes de tratar um ganho de taxa de recusa como redução de risco, faça um teste adversário ponta a ponta: tente obter a ajuda nociva através de rotas que contornam o filtro — reformulação, encadeamento de passos inofensivos, uso de ferramentas do sistema — e documente o que ainda passa.","ex":"Um assistente empresarial com moderador de entrada que recusa pedidos explícitos de bioterrorismo ainda responde a uma sequência de perguntas aparentemente legítimas sobre síntese orgânica que, combinadas, montam um protocolo viável: o filtro local pontua bem, mas o serviço continua entregando ajuda prejudicial porque nada mede o risco no nível do sistema.","res":"O paper mapeia o que cada tipo de resultado pode provar, não entrega um instrumento pronto de medição de risco residual; o critério exige que o leitor desenhe e execute a evidência de sistema ao redor. E o escopo é avaliação de safeguards de LLM expostos: não cobre mecanismos internos nem defesa que exija acesso ao modelo."},{"p":"2608.26623","ach":"Em 3.808 instâncias de chamadas de ferramentas sobre DAGs de workflow, o alinhamento dos juízes com referência programática cai monotonicamente com a dificuldade da tarefa, 1,5x mais rápido sem gabarito. Em consultas difíceis sem gabarito, todos os seis juízes, de 20B a fronteira, ficam numa faixa de 77–82%. Expor o gabarito reduziu o alinhamento de GPT-5.4 em 1,5 ponto e de Gemini-2.5-Pro em 3,9 pontos, e rubricas estruturadas melhoraram o alinhamento em até 6,5 pontos.","pn":"Teto de confiabilidade de juízes LLM em workflows com dependências","pm":"O alinhamento de juízes baseados em modelo de linguagem degrada com a dificuldade estrutural da tarefa avaliada, converge para um teto estreito independente da escala do juiz em tarefas difíceis sem gabarito, e a exposição ao gabarito pode reduzir o alinhamento por ancoragem excessiva.","imp":"Se você usa um modelo como juiz para aprovar saídas de agentes que chamam ferramentas, não presuma que um modelo maior julga melhor: em tarefas difíceis todos esbarram no mesmo teto. Teste o juiz com e sem o gabarito — dar a resposta correta pode piorar o julgamento por ancoragem — e prefira rubricas estruturadas com critérios explícitos em vez de pedir apenas uma nota com raciocínio livre.","ex":"Num pipeline de atendimento que encadeia busca, consulta a banco e emissão de reembolso, um juiz GPT de fronteira e um juiz de 20B erram na mesma proporção ao avaliar chamadas com dependências entre etapas sem gabarito; pior, quando o gabarito é mostrado ao juiz, ele ancora na resposta esperada e deixa passar desvios reais na ordem das chamadas.","res":"O ganho das rubricas estruturadas não generaliza uniformemente entre todos os pares juiz-gerador, então o ganho de 6,5 pontos não é garantido em qualquer combinação; raciocínio estendido e temperatura do juiz não ajudaram. O teto foi medido em chamadas de ferramentas sobre DAGs, não em avaliação de texto aberto, e a altura do teto depende parcialmente do prompt para geradores fracos."},{"p":"2608.27831","ach":"Pedidos realistas reduzem as taxas de resolução em 6,4 pontos percentuais em média e podem alterar o ranking de sete modelos avaliados. Incluir Desired Behavior e Motivation afeta significativamente o desempenho, enquanto Environment Information e Reproduction Steps apenas adicionam tokens sem benefício mensurável. O estilo linguístico tem efeito pequeno e dependente do modelo.","pn":"Avaliação de agentes de código com variantes de pedido realista","pm":"Famílias de tarefas derivadas de um benchmark compartilham o mesmo gold patch e variam apenas a composição de informação e o estilo linguístico do pedido, isolando o efeito desses fatores sobre a taxa de resolução.","imp":"Ao escrever prompts para agentes de codificação, declare explicitamente o comportamento desejado e a motivação da mudança — a maioria dos pedidos reais omite isso e perde desempenho. Ao comparar modelos por ranking de benchmark, desconfie: a ordem pode mudar com pedidos curtos e informais como os que chegam em produção.","ex":"Um time avalia agentes de código no SWE-bench e escolhe o modelo A pelo ranking. Em produção, os usuários mandam pedidos curtos sem contexto estruturado, e o modelo B — pior no benchmark — resolve mais tarefas, porque a lacuna entre problema formal e pedido real penaliza os modelos de forma diferente.","res":"Os números vêm de variantes derivadas do SWE-bench Verified e Pro, não de pedidos reais executados em produção; a taxonomia de seis categorias e quatro dimensões de estilo é uma aproximação. O efeito de estilo é pequeno e varia por modelo, então não generalize a sensibilidade a estilo para todos os modelos."},{"p":"2608.31082","ach":"No FanOutQA estendido com uma pergunta relacionada por questão de teste, o cracking corta o custo em 53% mantendo a acurácia. Responder sobre uma base pré-estruturada ideal é 28 vezes mais barato, e a lacuna cresce com o fan-out das questões. Com o tempo, mais consultas são respondidas sem abrir documentos.","pn":"Estruturação especulativa de dados como subproduto da inferência do agente","pm":"Um sub-agente derivado do contexto já carregado extrai, ao abrir cada documento, estrutura fundamentalada em texto bruto, acumulando um repositório que passa a responder consultas futuras sem reabrir o documento.","imp":"Se seus agentes reabrem os mesmos PDFs e páginas para questões parecidas, você pode adicionar uma etapa que, cada vez que um documento é aberto, extrai e persiste a estrutura relevante — o custo extra por consulta é pequeno porque aproveita o contexto já pago.","ex":"Um agente de due diligence que responde perguntas sobre contratos e filings reabre PDFs longos a cada consulta, gastando centenas de milhares de tokens para reunir evidência espalhada; com a estruturação especulativa, as perguntas seguintes sobre os mesmos contratos viram consultas baratas sobre o registro estruturado acumulado.","res":"O ganho de 53% foi medido no FanOutQA com apenas uma questão relacionada por questão de teste, o que favorece o método; workloads com baixa sobreposição entre consultas terão cobertura estrutural menor e economia menor. A base pré-estruturada ideal que mostra 28x é um limite teórico, não um resultado obtido pelo sistema."},{"p":"2609.01836","ach":"Em EAL-Bench, escritores de memória criaram autoridade falsa em até 50,2% dos pedidos não autorizados sob atualizações incrementais, e executores agiram sobre ela em 98,6% dos testes. As salvaguardas testadas — exigir evento-fonte válido e event sourcing limitado — reduzem a lavagem, mas rejeitam mais ações legítimas.","pn":"Memória persistente como política de autorização efetiva","pm":"Escritores de memória introduzem permissões sem lastro nos eventos de origem, e a provenance perdida faz executores agir como se a autoridade fosse legítima.","imp":"Trate o que está na memória do seu agente como parte da política de permissões, não como cache de contexto: audite cada permissão persistida contra o evento que a originou e monitore entradas de autorização que aparecem sem registro de origem.","ex":"Um agente de procurement com memória persistente acumula atualizações de permissão ao longo de semanas; uma escrita incremental registra que o agente pode aprovar compras acima do limite, sem evento de aprovação humana de origem, e o executor processa a compra irregular porque a provenance da permissão se perdeu.","res":"As salvaguardas propostas reduzem a lavagem mas aumentam a rejeição de ações legítimas, então o tradeoff segurança-utilidade não está resolvido. Os números vêm do próprio benchmark em três domínios, e a taxa de executores pode variar com prompts e políticas do executor fora do cenário testado."},{"p":"2608.30391","ach":"Em seis conjuntos de trajetórias, os codebooks gerados recuperam 73% a 91% dos modos de falha presentes em taxonomias anotadas por humanos e ainda revelam padrões que essas taxonomias não capturam. Usado como espaço de features dedutivo, o codebook supera baselines zero-shot e few-shot na predição de falhas. O processo mantém trilha auditável dos dados à teoria.","pn":"Codificação qualitativa iterativa com critério de saturação aplicada a trajetóri","pm":"Um pipeline multiagente executa ciclos de codificação aberta, axial e teórica sobre trajetórias de agentes, parando quando novas categorias deixam de emergir, e o codebook resultante vira espaço de features para prever falhas.","imp":"Quando um agente seu falha em tarefas longas e você não sabe classificar os erros, substitua a criação manual de categorias por rodadas de rotulagem que se corrigem até nenhuma categoria nova aparecer; depois use as categorias como rótulos de entrada para um detector de falhas.","ex":"Um agente de atendimento que encerra conversas sem resolver o chamado: em vez de listar à mão os tipos de falha, o pipeline lê milhares de trajetórias, deriva categorias como 'pergunta respondida antes do usuário confirmar' e essas categorias alimentam um classificador que sinaliza falhas em execuções novas.","res":"Os números vêm de comparação com taxonomias humanas já existentes; em domínios sem anotação de referência não há garantia de que 73-91% se repita. Saturação com LLMs pode parar cedo demais se o modelo de codificação compartilhar vieses do gerador das trajetórias, e não há código aberto confirmado."},{"p":"2609.03293","ach":"Modelos existentes falham em identificar fatos pessoais que conflitam com pedidos do usuario quando esses fatos nao aparecem explicitamente no prompt e precisam ser recuperados de uma base de conhecimento. O dataset pareia pedidos com personas e fatos egocentricos, e o pipeline multiagente supera as abordagens atuais tanto na qualidade da recuperacao de evidencia quanto na decisao de conflito.","pn":"Pipeline multiagente de recuperacao de conflito latente","pm":"Agentes especializados coordenam tres etapas — reformulacao da consulta do usuario, travessia multi-hop em um grafo de conhecimento egocentrico e filtragem sensivel a conflito — para trazer a superficie evidencia latente que torna um pedido aparentemente razoavel inapropriado.","imp":"Se o seu assistente personalizado executa tudo que o usuario pede, considere adicionar uma etapa de checagem que busque ativamente fatos do perfil que contradigam o pedido antes de responde-lo — e organize essa busca como etapas separadas de reformular a pergunta, navegar a base e filtrar por conflito, em vez de confiar numa unica busca por similaridade.","ex":"Um usuario com registro de alergia na base de conhecimento pede ao assistente uma lista de receitas; a busca por similaridade nao traz o fato da alergia porque o pedido nao menciona alergia, e o assistente responde com receitas que contêm o alergeno. O pipeline com travessia multi-hop parte do pedido, identifica a entidade usuario, percorre os fatos ligados a ela e intercepta o conflito antes da resposta.","res":"Os ganhos foram medidos no proprio dataset dos autores, cujos fatos egocentricos sao bem definidos e estruturados; em bases de conhecimento reais, ruidosas e incompletas, a travessia multi-hop pode nao encontrar a evidencia decisiva. Nada e dito sobre conflitos que exigem julgamento ambiguo em vez de um fato recuperavel."},{"p":"2609.03430","ach":"Em quatro modelos e seis tarefas de raciocínio, evicção uniforme aleatória dentro de cada cabeça de atenção, mantendo o prompt, iguala o melhor método seletivo de compressão de KV cache e serve 32–43% mais throughput em vLLM. Experimentos controlados mostram que o sinal de seleção dos métodos pontuadores quase não contribui: a maior parte da diferença é só se a seleção manteve o prompt. O traço de raciocínio se protege por redundância no texto e entre cabeças.","pn":"Evicção aleatória de KV cache com prompt preservado","pm":"Em vez de pontuar tokens por importância futura, o cache mantém o prompt intacto e descarta tokens do raciocínio por sorteio uniforme dentro de cada cabeça de atenção, porque o traço de raciocínio se protege por redundância no texto e entre cabeças.","imp":"Troque seu compressor de KV cache baseado em scores (por exemplo, H2O ou SnapKV) por manutenção do prompt mais descarte aleatório: você ganha throughput sem perda de acurácia em tarefas de raciocínio e elimina o custo de calcular e ordenar pontuações de importância a cada passo.","ex":"Um serviço de chat que roda um modelo de raciocínio longo em vLLM com H2O sofre degradação quando opressor o prompt do sistema é parcialmente evitado, e paga custo de scoring por passo; com Random Attention o prompt fica íntegro e o sorteio uniforme retém cópias suficientes dos tokens que o modelo ainda precisa, elevando o throughput em 32–43%.","res":"A evidência cobre tarefas de raciocínio longo, onde a redundância do traço protege a evicção aleatória; em geração curta, sumarização ou tarefas sem traço auto-reduntante, o sorteio uniforme não tem essa garantia e a comparação com seleção por score pode mudar. Não prova que todo sinal de seleção é inútil, apenas que ele contribui pouco nesse regime."},{"p":"2609.04098","ach":"Quantizar para 4-bit NVFP4 todas as 496 camadas lineares de um híbrido 27B, incluindo as recorrentes Gated DeltaNet, mantém o desempenho em BF16 (média de 5 benchmarks -0,52), com 17,5 GiB e prefill 14-19% mais rápido. O estudo mecânico mostra que os gates considerados frágeis comprimem ~11% de erro de GEMM em ~2% de erro de saída, e a recorrência delta-rule mantém ruído injetado em patamar plano por 32K tokens.","pn":"Quantização 4-bit integral da metade recorrente em LLMs híbridos","pm":"A quantização NVFP4 W4A4 aplicada também às camadas lineares recorrentes se sustenta porque o escalonamento por blocos de 16 elementos localiza outliers e a regra delta sobrescreve o estado a cada escrita, impedindo que erros de quantização se acumulem ao longo do contexto.","imp":"Na hora de quantizar um LLM híbrido com camadas lineares recorrentes, você pode deixar tudo em 4-bit em vez de preservar essas camadas em 8 ou 16 bits: isso reduz memória e acelera o prefill sem perda mensurável. Basta embarcar as escalas do KV-cache em FP8 calibrado no deploy.","ex":"Comunidades que publicaram versões 4-bit do Qwen3.8-27B deixaram o bloco GDN em 8/16 bits por medo de acúmulo de erro na recorrência; o paper mostra que esse cuidado era desnecessário — o gap de perplexidade a 32K até encolhe com a posição, porque cada escrita da delta-rule sobrescreve o estado na direção da chave atual.","res":"A validação cobre um único modelo híbrido de 27B com Gated DeltaNet e a suite NVFP4; a robustez da regra delta não garante o mesmo resultado para outras recorrências lineares nem para arquiteturas sem escalonamento por blocos de 16 elementos. O custo por token de quantização some com o contexto, mas não em contextos curtos."},{"p":"2608.21832","ach":"Dezenove modelos de visão-linguagem atingem no máximo 32% de acerto estrito em 994 pares contrastivos de instruções sobre interfaces gráficas, com 60-92% das previsões caindo fora das duas regiões candidatas. Quando a previsão cai em algum candidato, a seleção chega a 0,82-0,90 para relações horizontais, verticais, proximidade e ordem em lista, mas fica em torno de 0,50 para contenção e oclusão. Marcar os dois candidatos eleva a seleção em 35-57 pontos, caracterizando o diagnóstico como oráculo.","pn":"Diagnóstico contrastivo que separa localização de entendimento relacional","pm":"Pares contrastivos mantêm a captura de tela e a âncora fixos e trocam apenas a expressão relacional, movendo o alvo correto entre dois candidatos, permitindo classificar cada previsão por queda na região do candidato.","imp":"Se o agente que usa screenshots erra cliques, meça antes se a falha é achar o elemento na tela ou entender a instrução: aplique pares em que só a relação muda e veja se a coordenada cai no candidato certo. Se a coordenada nem chega à região do candidato, ajustar o prompt da relação não resolve — o gargalo é localizar o elemento.","ex":"Um agente de automação de navegador recebe 'clique no botão de envio à direita do campo de e-mail' e emite uma coordenada fora dos dois botões plausíveis: o desenho do benchmark mostra que isso acontece na maioria das previsões (até 92%), então a falha do agente é de grounding espacial, não de interpretação da palavra 'direita'.","res":"A correlação com ScreenSpot-Pro (ρ=+0,74) é exploratória com amostra pequena, e o ganho de 35-57 pontos ao marcar candidatos é diagnóstico oráculo, não método implantável — não há como fornecer o conjunto de candidatos em produção. Os resultados cobrem sete relações espaciais em capturas de interface; não provam nada sobre grounding em cenas naturais."},{"p":"2608.19269","ach":"Ao congelar uma coleção grande de avaliações e tentar reexecutar as alegações históricas, a maioria das unidades para porque a evidência necessária para o replay não está vinculada. Onde o replay é possível, alegações diferentes permanecem estáveis em resoluções diferentes. O passo de inferência implícito entre resultado e licença é tornado explícito e executável.","pn":"Replay de alegações com vínculo de evidência em censo de avaliações","pm":"Congela-se uma coleção de avaliações e cada alegação histórica só é reexecutável quando a evidência necessária está vinculada ao artefato; sem vínculo, a unidade para.","imp":"Antes de confiar num número de benchmark, você pode tentar reexecutar a alegação que ele sustenta: se a evidência não está vinculada ao artefato, trate o resultado como não verificável e registre isso na decisão de adoção.","ex":"Um relatório de avaliação de agentes afirma que o sistema passou em 80% das tarefas de código; ao tentar o replay, o harness original, os prompts e as condições de execução não estão vinculados ao resultado, e a alegação não pode ser reexecutada — o número não licencia decisão de produção.","res":"O paper não mostra que alegações não reexecutáveis sejam falsas, apenas que não são verificáveis; e a estabilidade por resolução não garante que a alegação valha na resolução que interessa ao seu caso de uso."},{"p":"2608.29613","ach":"Em Reconhecimento de Emoções multi-rótulo, vetores de função extraídos de uma língua-fonte melhoram substancialmente o desempenho zero-shot em outras línguas, replicando parcialmente o efeito de few-shot sem processar demonstrações. Cada modelo tem uma faixa estável de cabeças de atenção ótimas para construir o vetor, consistente entre línguas.","pn":"Vetores de função como direção latente transferível entre línguas","pm":"Um vetor latente extraído das ativações de demonstrações em uma língua é injetado nas ativações do modelo em outra língua, direcionando a tarefa sem demonstrações no momento da inferência.","imp":"Se você atende um modelo com acesso às ativações internas, pode testar transferir um comportamento de tarefa para outras línguas injetando um vetor extraído uma única vez, em vez de pagar o custo de enviar vários exemplos em todo prompt — uma economia que cresce com o volume de requisições.","ex":"Um classificador de emoção em inglês que hoje recebe 5 demonstrações por requisição em produção: com um vetor de função extraído dessas demonstrações, as chamadas em espanhol e francês rodam zero-shot com desempenho próximo, cortando os tokens de demonstração do prompt em cada chamada.","res":"Não vale para APIs fechadas: sem acesso às ativações e à passagem de atenção do modelo, a técnica é inaplicável. Os ganhos são parciais em relação ao few-shot completo e avaliados em uma tarefa de classificação de emoção, sem evidência de generalização para tarefas mais abertas."},{"p":"2608.29098","ach":"O SafeAtlas-VL reúne 1,5 milhão de instâncias de treino com julgamentos separados para imagem, pedido do usuário e resposta do assistente, cada um numa escala ordinal de cinco níveis, cobrindo 15 categorias de dano e 55 subcategorias. O SafeAtlas-Bench retém 5.000 instâncias fora do treino para avaliar previsões de nível e escores contínuos. O modelo guard de 8B supera o SOTA anterior em cerca de 4 pontos de F1 e mantém desempenho competitivo em benchmarks cujos dados de treino não foram usados.","pn":"Moderação multimodal como classificação ordinal multi-alvo","pm":"O julgamento de segurança é separado em três alvos — conteúdo da imagem, pedido do usuário e resposta do assistente —, cada um classificado numa escala ordinal de cinco níveis da qual se deriva um escore contínuo de risco.","imp":"Troque o filtro de bloqueia-ou-libera por um moderador que devolve nota separada para a imagem, o pedido e a resposta: com isso você pode deixar a resposta passar e ainda segurar a imagem, e usar o escore contínuo para mandar casos cinzentos para revisão humana em vez de decidir tudo num único botão de bloqueio.","ex":"Num atendimento com upload de fotos, um moderador binário que julga apenas a resposta do assistente aprova o turno inteiro, e a foto de documento com CPF visível vai parar no log e no histórico do cliente; com um nível por alvo, o nível alto da imagem dispara o mascaramento do documento antes da persistência.","res":"O ganho de ~4% de F1 e a generalização são medidos no pipeline dos autores, com o SafeAtlas-Bench deles no meio da avaliação. Os rótulos ordinais herdam o critério dos anotadores: discordância entre humanos vira rótulo único, não incerteza calibrada. O guard de 8B custa GPU e latência por requisição, e desempenho competitivo em benchmarks de terceiros não garante que as 15 categorias cubram os riscos específicos do seu produto."},{"p":"2609.00834","ach":"Substituir os dois objetivos principais de fine-tuning de um seletor listwise por estratégias de inferência — recuperação de memórias estruturadas e agregação de rankings sobre permutações — melhora a precisão da seleção: em BIRD-dev, supera o método state-of-the-art anterior em 2,02 pontos de execution accuracy com os mesmos candidatos e 2,92x menos tokens, sem treinar nada.","pn":"Seleção listwise sem fine-tuning via memórias estruturadas recuperadas","pm":"Critérios de seleção de consultas candidatas são armazenados como memórias estruturadas destiladas de dados de treino e recuperadas no tempo de inferência, substituindo objetivos de fine-tuning, enquanto o viés de posição é reduzido agregando rankings sobre múltiplas permutações da lista de candidatos.","imp":"Se você tem um pipeline que gera várias consultas SQL e elege a melhor, dá para melhorar a escolha sem treinar um seletor: guarde exemplos destilados de como perguntas mapeiam para o esquema do banco e use-os como critério explícito na hora de comparar candidatos, e compare os candidatos em ordens diferentes para cancelar o viés de posição do modelo.","ex":"Em um chatbot de dados internos sobre um banco de vendas, o gerador produz cinco SQLs plausíveis e o seletor costuma escolher a primeira por viés de posição; recuperando memórias que dizem como 'por região no último trimestre' mapeia para as colunas e filtros certos, e agregando rankings das cinco ordens possíveis, a consulta executável correta passa a ser escolhida com mais estabilidade e menos chamadas ao modelo.","res":"As memórias precisam ser destiladas de pares pergunta-consulta de treino; em domínios sem dados anotados do seu esquema, essa etapa vira o ga
