"pn":"Priorização informacional de prompts para agentes de código","pm":"A resolução de tarefas por agentes de código é impulsionada pela especificação explícita do comportamento esperado e da motivação da mudança, enquanto detalhes de ambiente e passos de reprodução consomem tokens sem ganho mensurável de desempenho.","imp":"Ao projetar ferramentas ou chatbots de desenvolvimento de software, configure a interface ou use um passo de refinamento para extrair do usuário o comportamento esperado e a motivação do ajuste, evitando injetar automaticamente dumps de ambiente ou transcrições de reprodução desnecessárias.","ex":"Um desenvolvedor abre uma issue informando apenas logs de ambiente e o comando exato que causou o erro, sem dizer o retorno esperado; o agente altera a assinatura do método para silenciar a exceção em vez de corrigir o fluxo de dados, falhando no teste de regressão.","res":"Os resultados foram obtidos sobre repositórios estabelecidos com testes automatizados pré-existentes; em fluxos interativos onde o agente executa e valida o código dinamicamente no terminal, passos de reprodução podem ter utilidade diferente."},{"p":"2608.31082","ach":"Consultar dados em formato tabular/estruturado reduz o consumo de tokens em até 28 vezes em comparação com a leitura repetida de documentos brutos em tarefas multi-documento. A extração adaptativa e especulativa durante a primeira leitura reduziu o custo de tokens em 53% em benchmarks de perguntas encadeadas (FanOutQA), mantendo a mesma precisão de resposta.","pn":"Estruturação especulativa de dados sob demanda durante o raciocínio","pm":"Ao carregar documentos brutos em contexto para responder a uma consulta, um sub-processo extrai e persiste relações estruturadas no mesmo ciclo de inferência, permitindo que consultas futuras sejam resolvidas via busca tabular direta sem reabrir os arquivos originais.","imp":"Pare de rodar pipelines de ETL massivos para estruturar documentos que talvez nunca sejam lidos e evite reler arquivos inteiros a cada pergunta. Configure seu agente para salvar em um banco relacional ou chave-valor as tabelas e fatos correlatos do documento aberto no momento em que ele já pagou o custo de entrada de contexto para responder à primeira query.","ex":"Um agente de due diligence lê um contrato de 80 páginas para responder sobre a cláusula de rescisão. Em vez de descartar o documento da memória de contexto após a resposta, ele extrai a tabela de partes envolvidas, prazos e penalidades para um banco SQL; a pergunta seguinte sobre o prazo de vigência é respondida via SELECT com zero tokens de contexto de PDF.","res":"O benefício financeiro depende de haver reutilização e correlação temática nas perguntas; se cada consulta acessar documentos completamente inéditos e nunca mais revisitados, a extração especulativa adicionará custo extra de tokens de saída sem amortização futura."},{"p":"2609.01836","ach":"Modelos de linguagem atuando como gravadores de memória persistente criam autorizações espúrias em até 50,2% das requisições não autorizadas durante atualizações incrementais. Quando uma permissão falsa é gravada na memória, agentes executores realizam ações indevidas em 98,6% dos testes.","pn":"Rastreabilidade de Proveniência em Memória de Autorização","pm":"O armazenamento de permissões e restrições em memória persistente exige vínculo explícito a eventos de origem válidos ou log imutável de transições de estado para evitar que atualizações incrementais sintetizem autorizações inexistentes.","imp":"Você não deve permitir que o agente resuma ou armazene permissões de acesso diretamente em texto livre dentro da sua memória de trabalho; separe o estado de autorização em uma camada determinística com log de eventos imutáveis e exija validação externa de proveniência antes de autorizar ferramentas sensíveis.","ex":"Um agente de compras corporativo recebe uma restrição temporária para não aprovar compras de hardware acima de 5 mil reais. Ao consolidar interações passadas em sua memória de longo prazo, o modelo resume incorretamente o histórico como 'autorizado para compras rotineiras', e o executor subsequente aprova uma ordem de 20 mil reais confiando apenas nesse resumo.","res":"Aplicar restrições rígidas de validação de proveniência ou reconstrução por eventos reduz significativamente as ações indevidas, mas aumenta a taxa de rejeição de comandos legítimos, exigindo calibragem fina entre segurança e usabilidade operacional."},{"p":"2608.30391","ach":"Em seis conjuntos de trajetorias de agentes, o pipeline automatizado recuperou entre 73% e 91% dos modos de falha identificados por humanos e descobriu novos padroes ignorados pelas taxonomias manuais. Quando o livro de codigos resultante foi utilizado como espaco de caracteristicas dedutivas, a predicao de falhas superou baselines zero-shot e few-shot de LLMs.","pn":"Taxonomia indutiva de falhas por codificacao grounded automatizada","pm":"Um pipeline encadeia agentes para realizar codificacao aberta, axial e teorica sobre traces de execucao ate atingir saturacao semantica, gerando uma taxonomia estruturada de modos de falha sem classes pre-definidas.","imp":"Substitua a criacao manual de rubricas de erro por uma rotina periodica que agrupa e rotula indutivamente seus logs de execucao em tres etapas conceituais. Use a taxonomia consolidada gerada por essa rotina como catalogo de metricas e tags para filtros de observabilidade e validadores de seguranca em producao.","ex":"Um agente de suporte ao cliente comecou a falhar silenciosamente ao interagir com ferramentas legadas, alternando repetidamente entre chamadas invalidas de API ate estourar o limite de passos sem disparar erro explicito. Em vez de adivinhar essa nova classe de erro, o pipeline processa 500 traces desse agente, identifica o padrao de loop estagnado e adiciona automaticamente 'tentativa circular sem mudanca de parametro' ao catalogo de monitoramento.","res":"O processo de mineracao exige multiplas passadas de modelos com janela longa sobre amostras substanciais de traces ate atingir a saturacao, o que gera custo computacional elevado de tokens e inviabiliza a execucao do pipeline em tempo real durante a chamada da aplicacao."},{"p":"2609.01072","ach":"Calibradores multiclasse pós-hoc frequentemente alteram a classe top-1 original do classificador base. A aplicação do reparo analítico zerou essa taxa de troca de decisão por construção em benchmarks como CIFAR e ImageNet, além de reduzir métricas de erro de calibração (ECE, NLL e Brier score) em relação às saídas diretas dos calibradores.","pn":"Reparo de probabilidade preservador de predição para calibração multiclasse","pm":"O vetor de probabilidades gerado por um calibrador pós-processamento é reajustado analiticamente para garantir que a classe de maior escore original retenha a maior probabilidade final, redistribuindo o restante condicionalmente.","imp":"Se você precisa de probabilidades calibradas para estimar incerteza em tarefas de classificação mas seu sistema downstream já depende criticamente dos rótulos emitidos pelo modelo base, adicione um passo de ajuste analítico na saída do calibrador em vez de tentar restringir o treinamento do próprio calibrador.","ex":"Um classificador de triagem de tickets de suporte baseado em extração de logprobs tem suas categorias integradas a regras de negócio fixas; ao rodar um calibrador de probabilidades para descartar casos incertos, a predição da categoria principal de alguns chamados é silenciosamente invertida para outra classe, quebrando o roteamento operacional.","res":"Preservar estritamente o argmax original impede que calibradores mais expressivos corrijam eventuais erros reais cometidos pelo modelo de base, além de os testes empíricos do artigo terem sido conduzidos em modelos de visão computacional clássicos e não diretamente em LLMs."},{"p":"2609.03293","ach":"Modelos que apenas executam instruções ignoram restrições latentes do usuário quando os fatores impeditivos exigem recuperação implícita na base de conhecimento. A pipeline com reformulação de query, travessia multi-hop em grafo e filtragem orientada a conflito supera buscas densas diretas tanto na recuperação de evidências quanto na decisão correta de recusa.","pn":"Verificação multiagente de conflitos contextuais via grafo egocêntrico","pm":"Agentes especializados decompõem a intenção do usuário, reformulam buscas sobre um grafo de conhecimento de contexto pessoal e filtram evidências latentes para identificar restrições que invalidam o pedido antes da execução.","imp":"Antes de permitir que um assistente execute ações ou chame ferramentas com efeitos colaterais, implemente uma camada prévia de checagem contra a base de fatos do usuário. Não dependa de busca semântica simples da mensagem bruta: instrua um agente intermediário a extrair entidades e buscar no histórico especificamente por conflitos potenciais (restrições orçamentárias, compromissos concorrentes, limites de saúde).","ex":"Um assistente pessoal recebe o comando 'Reserve uma mesa no restaurante X para o almoço de amanhã'. Um RAG ingênuo busca apenas 'restaurante X', enquanto a abordagem com busca em grafo recupera o diagnóstico recente de alergia a frutos do mar no perfil médico do usuário e o fato de que o restaurante serve exclusivamente frutos do mar, bloqueando a reserva antes do erro.","res":"A sobrecarga de latência e custo computacional gerada por múltiplos passos de raciocínio e travessia em grafo inviabiliza o padrão para respostas de chat em tempo real se aplicado a toda e qualquer mensagem; é necessário um classificador leve na entrada para acionar a verificação apenas em comandos acionáveis."},{"p":"2609.03430","ach":"Em quatro modelos e seis tarefas de raciocinio, descartar tokens da cadeia intermediaria aleatoriamente por cabeca alcancou a mesma precisao dos melhores algoritmos de poda baseados em pontuacao. A tecnica atingiu throughput 32% a 43% superior no vLLM porque o modelo repete passos internamente e distribui copias entre as cabecas de atencao.","pn":"Eviccao aleatoria de contexto intermediario com protecao estrita do prompt","pm":"A preservacao integral dos tokens de entrada associada ao descarte uniforme e aleatorio de tokens gerados em cada cabeca de atencao mantem a capacidade de inferencia sem o calculo de scores de relevancia.","imp":"Configure o descarte de KV cache do seu motor de inferencia para congelar 100% dos tokens da pergunta inicial e aplicar amostragem aleatoria uniforme sobre o historico de passos intermediarios gerados, eliminando calculos adicionais de pontuacao de atencao por token.","ex":"Um servidor vLLM atendendo um modelo de raciocinio com cadeias de pensamento longas estoura a memoria da GPU com 8k tokens de contexto; em vez de alocar tempo de computacao medindo scores de atencao para decidir o que manter, ele descarta tokens gerados aleatoriamente em cada cabeca e preserva o prompt de entrada intacto.","res":"A tecnica depende da redundancia intrinseca das cadeias de raciocinio passo a passo e falha se aplicada a tarefas onde cada token intermediario contem fatos unicos sem recapitulacao, como extracao direta de informacao ou prompts longos que precisem ser podados."},{"p":"2609.04098","ach":"A quantizacao integral em NVFP4 W4A4 das 496 camadas do modelo hibrido de 27B manteve desempenho equivalente ao BF16 (diferenca de -0,52 pontos na media de 5 tarefas) reduzindo a pegada de memoria para 17,5 GiB e acelerando o prefill em ate 19%. As projecoes de porta comprimiram erros de GEMM de 11% para 2% na saida e o estado recorrente dispersou impulsos de ruido em centenas de tokens em vez de acumular deriva ate 64K tokens.","pn":"Quantizacao uniforme W4A4 em camadas recorrentes com regra delta","pm":"O escalonamento por blocos finos confina outliers na ativacao residual, enquanto as projecoes de porta amortecem o desvio matricial e o mecanismo de sobrescrita da regra delta dissipa ruidos de quantizacao no estado recorrente ao longo do contexto.","imp":"Voce pode quantizar integralmente modelos hibridos com camadas de atencao linear em 4 bits sem manter partes recorrentes em precisao FP8 ou BF16 por receio de acumulo de erro. Para servir o modelo sem perda de qualidade, ajuste as escalas globais de quantizacao quando o seu motor de inferencia fundir projecoes separadas em um unico operador matricial.","ex":"Ao subir o Qwen3.8-27B em uma GPU com suporte a FP4, engenheiros mantinham as camadas Gated DeltaNet em FP16 por receio de corromper o estado em contextos longos, ultrapassando o orcamento de VRAM; a adocao da quantizacao uniforme em 4 bits permitiu alocar o modelo inteiro em 17,5 GiB sustentando recuperacao de contexto no RULER ate 64K tokens.","res":"A preservacao da acuracia depende de tipos numericos com escalonamento por microblocos como o NVFP4 e da dinamica de sobrescrita da regra delta, nao sendo garantida para outras arquiteturas recorrentes lineares ou quantizacoes INT4 sem escala por blocos."},{"p":"2608.21832","ach":"Dezenove modelos de visão e linguagem atingiram no máximo 32% de precisão estrita em coordenadas de tela, com 60% a 92% das previsões caindo no vazio fora dos elementos candidatos. Quando o clique atinge uma região candidata, a precisão para relações como posição e proximidade sobe para 82%-90%, mas cai para o nível do acaso (50%) em contenção e oclusão.","pn":"Avaliação contrastiva de ancoragem espacial com candidatos restritos","pm":"Fixa-se a imagem da interface e o elemento de referência, alterando apenas o termo relacional do prompt para alternar o alvo correto entre dois elementos predefinidos.","imp":"Pare de pedir ao modelo de visão que gere coordenadas numéricas brutas na tela a partir de texto relacional. Extraia previamente a lista de componentes interativos via árvore de acessibilidade e restrinja o modelo a escolher entre as caixas identificadas.","ex":"Um agente de automação de navegador falha ao clicar no botão 'Salvar' abaixo do formulário de endereço porque gera uma coordenada no espaço em branco ao lado do botão, errando a métrica espacial contínua apesar de interpretar corretamente o termo 'abaixo'.","res":"O ganho de 35 a 57 pontos percentuais obtido ao demarcar candidatos na tela utilizou alvos verdadeiros fornecidos por anotação prévia (oráculo), o que não garante o mesmo benefício quando acoplado a detectores automáticos imperfeitos."},{"p":"2608.19269","ach":"Em um censo de 124 unidades de avaliação elegíveis no Inspect Evals fixadas em commit, 110 não alcançaram inferência determinística por ausência de dados históricos de execução ou ancoragem semântica. Onde a execução foi concluída, rankings e métricas variaram substancialmente conforme a família de regras de resolução adotada.","pn":"Auditoria de inferência vinculada a commit para benchmarks","pm":"A verificação formal de reprodutibilidade em benchmarks decompõe a execução em substrato congelado, espaço de variantes semânticas e consulta de asserção, registrando interrupções explícitas quando faltam dados históricos ou amarras determinísticas.","imp":"Ao selecionar ou auditar modelos usando benchmarks públicos, não confie em tabelas agregadas sem travar a semente, o código exato e os dados intermediários; exija traces completos de execução para validar se a classificação de 'melhor modelo' se sustenta sob pequenas variações de medição.","ex":"Uma equipe de engenharia escolhe trocar um LLM em produção porque um benchmark público apontou ganho de 5% em precisão; ao tentar reproduzir a medição com parâmetros idênticos, a ordem dos modelos se inverte devido à ausência de travas semânticas nos scorers de avaliação.","res":"O artigo não fornece uma ferramenta plug-and-play de auditoria para pipelines arbitrários de CI/CD, restringindo-se à formalização conceitual e a uma análise manual/censitária dentro do ecossistema do Inspect."},{"p":"2608.29613","ach":"A injecao de vetores funcionais extraidos de um unico idioma de origem melhora substancialmente a classificacao de emocoes multirrotulo em idiomas de destino em comparacao ao zero-shot padrao. O ganho se aproxima do desempenho de few-shot in-context learning sem o custo de tokens adicionais.","pn":"","pm":"","imp":"Se voce roda modelos abertos na propria infraestrutura e atende usuarios multilingues, considere injetar tensores de intervencao estatica nas cabecas de atencao em vez de preencher a janela de contexto com exemplos em varias linguas.","ex":"Um pipeline de moderacao de conteudo multilocal em LLaMA que enviava 10 exemplos few-shot traduzidos em cada requisicao, inflando a latencia e a conta de inferencia, substituido por um vetor estatico somado no forward pass que mantem a acuracia emocional em cinco idiomas.","res":"A abordagem e totalmente inaplicavel para quem consome modelos proprietarios via API comercial (como OpenAI ou Anthropic), pois exige acesso de leitura e escrita as ativacoes intermediarias das cabecas de atencao durante a inferencia."},{"p":"2608.29098","ach":"O paper apresenta 1.5M instâncias de dados multimodais rotulados em uma escala de cinco níveis de risco. Os modelos de guarda treinados neste dataset atingem performance superior aos SOTA anteriores em F1, generalizando bem para outros benchmarks sem usar seus dados de treino.","pn":"Guarda multimodal com escala ordinal de risco","pm":"Classifica a segurança de interações com imagens e texto em cinco níveis ordenados, mapeando o risco para um score contínuo.","imp":"Você pode substituir filtros binários de segurança por um score contínuo de risco em seus fluxos de produção multimodal. Isso permite configurar alertas graduais e revisar apenas as interações com risco médio ou alto, em vez de bloquear tudo ou nada.","ex":"Em um chatbot de suporte que recebe prints de telas de erro, o sistema atual bloqueia qualquer imagem com texto suspeito. Com o SafeAtlas Guard, uma imagem com um erro técnico benigno recebe score 1 (baixo risco) e prossegue, enquanto uma imagem com tentativa de phishing recebe score 4 (alto risco) e aciona uma revisão humana.","res":"A adoção direta depende do tamanho do modelo (8B) caber na sua infraestrutura de inferência. A escala de cinco níveis exige ajuste fino dos limiares de decisão do seu sistema de negócios para evitar falsos positivos ou negativos na sua tarefa específica."},{"p":"2608.30005","ach":"Modelos pequenos (1.7B) usando sondas de classificação em camadas internas alcançam maior concordância com rótulos de rubrica do que geradores de texto. Como recompensa em RL, esse método reduz o tempo de julgamento em 10.7x comparado a um modelo de 8B.","pn":"Julgamento por Sonda de Critério","pm":"A extração de vereditos de rubrica é realizada por sondas de classificação binária sobre ativações intermediárias, substituindo a geração de texto para reduzir latência e custo de inferência.","imp":"Você não pode adotar esta técnica se usa APIs fechadas. Para replicar, é necessário carregar o modelo em um ambiente controlado (como vLLM ou HF Transformers) e modificar o pipeline de inferência para extrair e classificar os vetores de ativação ocultos.","ex":"Em um pipeline de RLHF customizado rodando em GPUs locais, a equipe substitui chamadas a `model.generate()` por uma função que intercepta `hidden_states` da última camada e aplica uma cabeça de classificação treinada para decidir se a resposta satisfaz o critério da rubrica.","res":"Não se aplica a qualquer uso de modelos de linguagem via API pública. A técnica é restrita a cenários onde você tem controle total sobre o peso do modelo e o motor de inferência para acessar estados internos."},{"p":"2609.00834","ach":"No benchmark BIRD-dev, o método supera o R^3-SQL em 2,02 pontos de execução média usando os mesmos conjuntos de candidatos, consumindo 2,92x menos tokens. A melhoria vem da estabilidade da seleção listwise sem fine-tuning, obtida por memórias estruturadas e agregação de rankings.","pn":"Seleção listwise sem fine-tuning via memória estruturada e agregação de permutas","pm":"Substitui o aprendizado de critérios de seleção por parâmetros por recuperação de memórias estruturadas que codificam mapeamentos e operações, e reduz o viés posicional agregando rankings de múltiplas permutações dos candidatos.","imp":"Ao construir um seletor de consultas SQL, você substitui o custo de treinar um modelo de ranking por um pipeline de recuperação de memória que injeta regras de mapeamento no prompt, e implementa um loop de votação entre permutações dos candidatos para eliminar o viés de posição.","ex":"Em um sistema de consulta a banco de dados que gera 5 SQLs por pergunta, você injeta no prompt do seletor memórias pré-computadas (ex: 'a coluna X é sempre agregada com COUNT') e executa o seletor 3 vezes com ordens diferentes dos candidatos, escolhendo a consulta com melhor média de rank.","res":"O padrão exige a construção prévia das memórias estruturadas a partir de dados de treino, o que pode demandar esforço de curadoria; a eficiência de tokens depende da implementação do cache de execução e do scoring pontual para evitar comparações desnecessárias."},{"p":"2609.04242","ach":"Em 56 benchmarks e 21 idiomas, o roteamento de transcrições do Whisper em VLMs congelados compete com modelos nativos omni. A abordagem preserva melhor o raciocínio visual, código e matemática, e melhora o desempenho em áudio puro.","pn":"Roteamento modular de transcrição para VLMs congelados","pm":"A entrada de fala é convertida em texto com timestamps e confiança por um ASR externo, sendo injetada no prompt do modelo visual sem alterar pesos ou arquitetura.","imp":"Você adiciona capacidade de entender fala a um modelo de visão já em produção sem treinar nada. Basta passar o áudio por um ASR com timestamps e inserir o texto no prompt do VLM, mantendo o modelo original intacto.","ex":"Num sistema de análise de reuniões que usa um VLM para ler slides, você injeta a transcrição do áudio com horários no prompt. O modelo entende o que foi dito sem perder a capacidade de ler o gráfico na tela.","res":"Não captura prosódia, tom de voz ou ruídos não verbais, pois depende exclusivamente da transcrição textual. O desempenho em fala cai se o ASR errar a transcrição."},{"p":"2609.04523","ach":"O sistema MaxKernel demonstra que agentes autônomos conseguem escrever e otimizar kernels para TPUs, alcançando desempenho comparável a especialistas humanos. A avaliação foi feita em 50 tarefas da suite JaxBench, utilizando feedback de compilador e profiling em tempo real para guiar a geração de código.","pn":"Otimização de código via feedback de execução","pm":"Agentes geram código, executam-no em hardware real para coletar métricas de performance e erros, e usam esses sinais de execução como contexto para iterar a implementação até atingir o alvo.","imp":"Você não pode aplicar esse fluxo diretamente em aplicações de LLM em produção, pois não tem controle sobre o hardware ou o compilador. O insight transferível é que agentes de código precisam de sinais de execução (logs, testes, métricas) para convergir, não apenas de texto.","ex":"Ao tentar usar um agente para otimizar uma query SQL, o agente falha se não tiver acesso ao plano de execução (EXPLAIN) e aos logs de erro do banco, assim como o MaxKernel precisa do profiler da TPU para saber se o kernel está lento.","res":"O padrão de usar feedback de execução é válido, mas a implementação específica depende de infraestrutura de hardware e compiladores que não estão expostos em APIs de modelos de linguagem."},{"p":"2609.04611","ach":"O τ^τ-bench testa se agentes de código conseguem construir agentes de atendimento sob condições reais. A melhor configuração (Claude Opus 5 + Claude Code) atingiu apenas 23,9% de sucesso nas simulações, contra 82,2% de um especialista humano.","pn":"Avaliação de agentes construtores em ambiente de produção simulado","pm":"Mede a capacidade de um agente de código em construir agentes de serviço ao cliente completos, fornecendo registros reais, requisitos vagos e API de produção, e avaliando o resultado final contra usuários simulados.","imp":"Você deve assumir que agentes autônomos ainda não conseguem substituir a arquitetura manual de agentes complexos, pois tendem a fazer consultas superficiais e não exploram variações de custo/modelo.","ex":"Ao pedir para um agente de código criar um chatbot de suporte técnico com base em tickets antigos, ele provavelmente ignorará a necessidade de consultar a API de inventário em tempo real, entregando um sistema que falha em perguntas sobre disponibilidade.","res":"O benchmark foca em tarefas de construção de agentes de serviço ao cliente; não prova que agentes de código falhem em tarefas de refatoração de código isolado ou geração de scripts simples."},{"p":"2609.04173","ach":"O LTB apresenta um conjunto de dados multimodais (texto, imagem, áudio, vídeo) validado por pares, contendo exemplos que falham nos modelos de tradução de ponta. Cada exemplo inclui regras de verificação manuais que definem objetivamente a falha, substituindo métricas automáticas vulneráveis a hacking de recompensa.","pn":"Benchmark de Casos de Quebra com Regras de Verificação","pm":"Avaliação guiada por exemplos adversariais multimodais acompanhados de regras de verificação programáticas que detectam falhas específicas em vez de medir similaridade média","imp":"Você pode usar os exemplos e as regras de verificação como um conjunto de testes de regressão para avaliar a robustez dos seus modelos de tradução ou LLMs multimodais, focando em casos extremos que as métricas tradicionais ignoram.","ex":"Ao desenvolver um sistema de tradução de legendas para vídeos com áudio de fundo, você utiliza um caso do LTB onde a tradução do texto na tela conflita com o áudio para verificar se seu pipeline prioriza corretamente a fonte visual ou auditiva.","res":"O benchmark é específico para tradução e modelos multimodais; a adoção das regras de verificação exige esforço manual para adaptar ao seu domínio, pois as regras são escritas para os exemplos específicos do dataset."},{"p":"2609.02750","ach":"O paper demonstra que reflexões baseadas apenas no transcript gerado não conseguem melhorar uniformemente sistemas em ambientes indistinguíveis por texto. Ao introduzir um gate que exige redução de risco de avaliação ancorado no ambiente (SRMA), o sistema Kimi resolveu 72,2% das instâncias do SWE-bench, superando a referência de 70,8%.","pn":"Gate de risco de avaliação ancorado no ambiente","pm":"A aceitação de uma memória ou estado de reflexão é condicionada à redução estrita do risco de avaliação medido por sinais externos ao texto gerado, garantindo que melhorias sejam validadas por evidência do ambiente real e não apenas por consistência textual interna.","imp":"Você deve implementar um filtro que só aceita atualizações na memória do agente se uma métrica externa (como um teste unitário passando ou um log de erro desaparecendo) mostrar melhoria objetiva. Isso impede que o modelo 'alucine' sucesso apenas porque o texto da reflexão parece coerente.","ex":"Em um agente de coding que corrige bugs, a reflexão 'você deve usar try-catch' é aceita apenas se o script de validação rodar o teste de regressão correspondente e confirmar que a taxa de falha caiu, em vez de confiar na autoavaliação do LLM.","res":"O padrão exige que você tenha acesso a métricas de avaliação automatizadas e confiáveis do ambiente; em tarefas abertas sem ground truth claro, o gate não pode ser implementado diretamente."},{"p":"2609.05258","ach":"O benchmark OR-Clarify mede a capacidade de agentes em identificar informações faltantes antes de criar modelos de otimização. O framework InterOPT demonstrou maior precisão na recuperação de dados ocultos em cenários de múltipla escolha, superando baselines.","pn":"Decisão de Clarificação Pré-Formulação","pm":"Identificação de lacunas críticas na especificação do problema para guiar a escolha entre solicitar esclarecimentos ao usuário ou prosseguir com a modelagem.","imp":"Implemente um passo de validação no seu agente que liste explicitamente quais variáveis ou restrições estão ausentes na entrada do usuário antes de gerar o código final. Isso reduz a necessidade de refações causadas por suposições silenciosas.","ex":"Um assistente de logística que recebe 'otimize as rotas' sem saber o custo do combustível ou a capacidade dos veículos. Em vez de assumir valores médios, o agente pausa e pergunta especificamente sobre esses dois parâmetros críticos.","res":"O padrão foi validado especificamente para formulação de modelos de otimização (OR). A eficácia em domínios menos estruturados, como redação criativa ou análise de código, pode exigir ajustes na definição do que constitui uma 'lacuna crítica'."}],"serie":{"2504.15476":[["2026-09-04",1,1,null],["2026-09-05",1,1,null],["2026-09-06",1,1,null],["2026-09-07",1,1,null]],"2512.14629":[["2026-08-20",2,null,null],["2026-08-26",3,2,2],["2026-08-27",3,2,2],["2026-08-28",3,2,2],["2026-08-29",3,2,2],["2026-08-30",3,2,2],["2026-08-31",3,2,2],["2026-09-01",3,2,2],["2026-09-02",3,2,2],["2026-09-03",3,2,2],["2026-09-04",3,2,2],["2026-09-05",3,2,2],["2026-09-06",3,2,2],["2026-09-07",3,2,2]],"2606.13610":[["2026-08-25",5,null,null],["2026-08-26",5,2,null],["2026-08-27",5,2,null],["2026-08-28",5,2,null],["2026-08-29",5,2,1],["2026-08-30",5,2,1],["2026-08-31",5,2,1],["2026-09-01",5,2,1],["2026-09-02",5,2,1],["2026-09-03",5,2,1],["2026-09-04",5,2,1],["2026-09-05",5,2,1],["2026-09-06",5,2,1],["2026-09-07",5,2,1]],"2607.21596":[["2026-08-21",9,null,null],["2026-08-26",20,2,19],["2026-08-27",20,2,19],["2026-08-28",20,2,20],["2026-08-29",20,2,20],["2026-08-30",20,2,20],["2026-08-31",21,2,20],["2026-09-01",21,2,20],["2026-09-02",21,2,20],["2026-09-03",21,2,20],["2026-09-04",21,2,20],["2026-09-05",21,2,20],["2026-09-06",21,2,20],["2026-09-07",21,2,20]],"2607.29211":[["2026-08-14",12,null,null],["2026-08-26",14,2,1],["2026-08-27",14,2,1],["2026-08-28",14,2,1],["2026-08-29",14,2,1],["2026-08-30",14,2,1],["2026-08-31",14,2,1] <script>/* Painel Daily Papers - porte do design canvas para HTML/JS puro.
 *
 * O desenho nasceu como artboard `.dc.html` da Claude Design (Artifact
 * "Painel Daily Papers"). Aquele arquivo so roda dentro do runtime do canvas;
 * este e o mesmo layout e a mesma logica de recorte reescritos em JS de
 * navegador, para o painel abrir em qualquer lugar.
 *
 * Duas diferencas deliberadas em relacao ao original:
 *
 * 1. O tooltip nao passa pelo estado. No canvas cada hover era um setState e
 *    um re-render; com 268 pontos de dispersao isso pisca no navegador. Aqui o
 *    tooltip e um no fixo que so muda de posicao e texto.
 *
 * 2. A linha de filtro que esta com o menu aberto sobe para z-index 90. No
 *    canvas as linhas ficam em 4/3/2/1 e a cortina de fechar em 80 - o que
 *    deixaria o proprio menu embaixo da cortina num navegador de verdade.
 *
 * O resto (cores, tipografia, ordem das secoes, textos) e o artboard.
 */
(function () {
  'use strict';

  /* ACCENT e so link e destaque (ticket 04). Ele ja significou "aprovado" na
     linha da taxa, no heatmap e na matriz - e por isso brigava com o proprio
     papel de chamar atencao: metade do painel ficava amarela. Aprovado agora
     tem cor propria, VERDE, e ela vale em todo lugar onde a medida e "quanto
     passou". */
  var ACCENT = '#d9a441';
  var VERDE = '#4ec07a';

  /* Passos escuro e claro da MESMA rampa de verde. Validados com o
     `validate_palette.js` da skill dataviz contra o fundo do card (#16191c),
     em modo ordinal: L monotona, ΔL >= 0.06, extremo claro a 4,16:1, e
     ΔE 27 sob protanopia - a separacao entre eles nao depende de enxergar o
     verde. Sao passos da rampa, nao cores avulsas: mexer num deles e mexer na
     rampa, e por isso o hex mora aqui uma vez so. */
  var VERDE_ESCURO = '#2e8b57';
  var VERDE_CLARO = '#8fe0ae';

  /* Os dois papeis do passo claro, nomeados a parte de proposito: eles dizem
     coisas diferentes em cards diferentes ("amplo" no empilhamento por
     veredito, "cresceu" na escala divergente do heatmap) e nunca aparecem na
     mesma escala - cada card tem a sua legenda. O valor coincidir e
     intencional, e a indirecao e o que impede o acidente inverso: reestepar um
     dos papeis (por CVD, por exemplo) sem perceber que mexeu no outro exige
     trocar o alias aqui, de olho nos dois nomes. */
  var VERDE_ESTRITO = VERDE_ESCURO;
  var VERDE_AMPLO = VERDE_CLARO;
  var VERDE_ALTA = VERDE_CLARO;

  /* Polos da escala divergente do heatmap (vista `crescimento`). O ticket pede
     vermelho = caiu, cinza = estavel, verde = cresceu; os TONS sao escolha
     desta implementacao, porque o par obvio (#e66767 com #4ec07a) mede ΔE 4,8
     sob deuteranopia - abaixo do piso 6 da skill, ou seja, dois cinzas iguais
     para quem nao distingue vermelho de verde. Escurecer o vermelho e clarear
     o verde poe a diferenca na LUMINANCIA, que a deuteranopia preserva: o
     mesmo par medido de novo da ΔE 24,3. O sinal tambem sai por escrito no
     tooltip, entao a cor nunca e o unico canal. */
  var VERMELHO_QUEDA = '#c94f4f';
  var CINZA_ESTAVEL = '#6b7480';
  /* Fundo da celula vazia do heatmap e da matriz: e o zero das rampas, e nao o
     fundo do card - uma celula sem dado precisa se distinguir de uma celula
     com o menor valor da escala. */
  var FUNDO_CELULA = '#1a1d21';

  /* Serie do card "Como o voto amadurece". Roxo por eliminacao deliberada:
     azul e laranja sao estrito e amplo, cinza e `fora`, verde e aprovado e
     amarelo e link - a curva do voto nao e nenhuma dessas coisas, e pintar ela
     com uma delas sugeriria um recorte por veredito que o card justamente
     deixou de fazer. O hex e o slot violeta do mesmo catalogo dark de
     `camposFicha`. */
  var ROXO_VOTO = '#9085e9';

  var COMPACTA = false;

  var root = document.getElementById('painel');
  var elTip = document.getElementById('tip');

  var state = {
    aba: 'janela',
    diasSel: [], vereditos: [], areas: [], topicos: [], orgs: [],
    // recortes que so o grafico produz (nao ha menu para eles na barra de
    // filtro): `regrasFora` vem do clique no Pareto, `criterios` do clique no
    // card espelho dele ("Por que o pipeline aprova"), `areasSec` do clique na
    // matriz de cruzamento. Entram em `filtrados()` como qualquer dimensao.
    regrasFora: [], criterios: [], areasSec: [],
    busca: '', ordem: 'votos', aberta: null,
    menu: null, buscaMenu: '',
    perSel: null, abertaH: null,
    // alternancias de desenho dentro de um card - nao recortam dado
    vistaArea: 'dist', taxaDecomp: false,
    heatVista: 'volume', lagGrupo: 'veredito',
    // "mais" do cabecalho da decisao, por card aberto (chave: secao + id) -
    // um objeto, nao um id unico, porque o card da aba viva e o do hall podem
    // estar abertos ao mesmo tempo (abas diferentes, mesmo estado).
    justExp: {}
  };

  /* Handlers vivem num array reconstruido a cada render; o HTML so carrega o
     indice. Evita serializar funcao em atributo. */
  var H = [];
  function h(fn) { H.push(fn); return H.length - 1; }
  function ev(tipo, fn) { return ' data-' + tipo + '="' + h(fn) + '"'; }

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* Corta no ultimo espaco antes do limite e sinaliza o corte. Sem as
     reticencias o leitor nao distingue um titulo truncado de um titulo curto -
     "Beyond Data Scaling: Representatio" parece um erro de digitacao. */
  function rotuloCurto(texto, limite) {
    var t = String(texto || '');
    if (t.length <= limite) return t;
    var corte = t.slice(0, limite);
    var porPalavra = corte.replace(/\s+\S*$/, '');
    /* Quando nao sobra palavra inteira - titulo de uma palavra so, ou titulo
       que comeca com espaco - o corte por palavra devolve vazio e o rotulo
       viraria so "…". Nesse caso vale o corte cru, que ao menos informa. */
    return (porPalavra.trim() ? porPalavra : corte.trim()) + '…';
  }

  function setState(patch) {
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) state[k] = patch[k];
    render();
  }

  /* ── cores das series (dataviz, coluna dark; hex literais) ─────────────── */
  function cor(v) { return v === 'estrito' ? '#3987e5' : v === 'amplo' ? '#d95926' : '#6b7480'; }
  function corTexto(v) { return v === 'estrito' ? '#6aa9ee' : v === 'amplo' ? '#e8794c' : '#8b8f96'; }

  /* Chave do motivo de descarte. `regra_fora` so existe para quem saiu, e a
     cobertura hoje e parcial - o Pareto exige que o nulo continue visivel em
     vez de sumir da contagem, entao ele vira uma categoria de verdade. */
  var REGRA_NULA = '__sem-regra__';
  function chaveRegra(p) { return p.rf || REGRA_NULA; }

  /* ── enum → rótulo legível ──────────────────────────────────────────────
     UM mapa para os tres vocabularios que o painel imprime: os 10 criterios de
     veredito, as 6 regras de descarte e a categoria do nulo. Um so porque os
     dois lugares que os exibem nao podem divergir - a linha do veredito da
     ficha ("ESTRITO · artefato aberto + benchmark"), a contraparte de uma
     decisao de fronteira (que pode ser criterio OU regra, por isso o mesmo
     registro atende as duas) e as barras dos dois cards da secao 03.

     Mora aqui, e nao em `gerar_painel.py`, porque o navegador e o unico
     consumidor: serializar 16 strings dentro de `DADOS` as repetiria no
     arquivo distribuido sem nenhum leitor em Python. Os ENUMS vem de
     `src/hfpapers/llm/schemas.py` (REGRAS_FORA, CRITERIOS_ESTRITO,
     CRITERIOS_AMPLO) - copiados de la, nao inventados; um enum novo que
     aparecer sem entrada aqui sai como o proprio enum, feio mas honesto. */
  var CRITERIOS_ESTRITO = [
    'padrao_arquitetural', 'artefato_aberto', 'invalida_pratica',
    'vulnerabilidade', 'tecnica_de_avaliacao'
  ];
  var CRITERIOS_AMPLO = [
    'benchmark', 'panorama', 'framework_conceitual',
    'principio_sem_o_como', 'exige_acesso_interno'
  ];
  var CRITERIOS = CRITERIOS_ESTRITO.concat(CRITERIOS_AMPLO);

  var ROTULOS = {
    // criterios de veredito (schemas.CRITERIOS_ESTRITO)
    padrao_arquitetural: 'padrão arquitetural',
    artefato_aberto: 'artefato aberto',
    invalida_pratica: 'invalida prática corrente',
    vulnerabilidade: 'vulnerabilidade',
    tecnica_de_avaliacao: 'técnica de avaliação',
    // (schemas.CRITERIOS_AMPLO)
    benchmark: 'benchmark',
    panorama: 'panorama',
    framework_conceitual: 'framework conceitual',
    principio_sem_o_como: 'princípio sem o como',
    exige_acesso_interno: 'exige acesso interno',
    // regras de descarte (schemas.REGRAS_FORA, na ordem de teste)
    treino_ou_postreino: 'treino ou pós-treino',
    geracao_de_midia: 'geração de mídia',
    percepcao_robotica_embodied: 'percepção robótica / embodied',
    relatorio_tecnico_de_modelo: 'relatório técnico de modelo',
    fora_de_escopo: 'fora de escopo',
    portabilidade_reprovada: 'portabilidade reprovada'
  };
  ROTULOS[REGRA_NULA] = 'regra não registrada';

  function rotulo(k) {
    return Object.prototype.hasOwnProperty.call(ROTULOS, k) ? ROTULOS[k] : String(k);
  }
  /* Lado do criterio, na ordem canonica do `schemas.py`. O grafico dos
     aprovados separa os dois blocos por ela e a ficha lista os criterios nela -
     um paper estrito le "artefato aberto + benchmark", nunca o contrario. */
  function ordemCriterio(k) {
    var i = CRITERIOS.indexOf(k);
    return i < 0 ? CRITERIOS.length : i;
  }
  function criteriosOrdenados(lista) {
    return (lista || []).slice().sort(function (a, b) {
      return ordemCriterio(a) - ordemCriterio(b) || a.localeCompare(b);
    });
  }

  /* Interpolacao de cor para as rampas sequenciais e divergentes dos mapas de
     calor. Mistura sobre `FUNDO_CELULA` em vez de usar alfa: com alfa a celula
     herdaria o que estiver atras dela (o card, a borda, outra celula) e a
     mesma intensidade mudaria de cor conforme o lugar - numa rampa que E o
     dado, isso e erro de leitura, nao detalhe. */
  /* Aceita `#rrggbb` e o proprio `rgb(...)` que devolve: a escala divergente
     mistura DUAS vezes (fundo → cinza neutro, depois neutro → polo), e sem
     isso a segunda chamada recebia "rgb(" no lugar de um hex, `parseInt` dava
     NaN e a celula saia transparente - o mapa inteiro ficava preto sem erro
     nenhum no console. */
  function rgbDe(c) {
    if (c.charAt(0) === '#') {
      return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
    }
    return c.replace(/[^0-9,]/g, '').split(',').map(Number);
  }
  function mistura(a, b, t) {
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var ca = rgbDe(a), cb = rgbDe(b);
    return 'rgb(' + ca.map(function (v, i) {
      return Math.round(v + (cb[i] - v) * t);
    }).join(',') + ')';
  }
  /* Piso da rampa sequencial: o menor valor presente ainda precisa se separar
     da celula vazia, senao "pouco" e "nenhum" viram a mesma cor. */
  function sequencial(cor, frac) { return mistura(FUNDO_CELULA, cor, 0.16 + frac * 0.84); }

  /* Cor de uma taxa de aprovacao: cinza (nenhum passou) → verde (todos). A
     rampa sai do cinza e nao do fundo porque aqui o zero e um valor medido,
     nao ausencia de dado - "0% aprovado" precisa ser visivel. */
  function corTaxa(taxa) { return mistura(CINZA_ESTAVEL, VERDE, taxa); }

  /* Marcador da matriz de cruzamentos: tamanho = total, cor = taxa de
     aprovacao. O diametro sai da RAIZ da fracao porque quem le compara area,
     nao largura - escalar o diametro direto pelo valor triplicaria a mancha de
     um cruzamento que so dobrou. Piso de 9px: abaixo disso o marcador some e
     deixa de ter alvo de hover. */
  var BOLHA_MIN = 9, BOLHA_MAX = 28;
  function bolha(n, max, taxa) {
    if (!n) return '';
    var d = BOLHA_MIN + (BOLHA_MAX - BOLHA_MIN) * Math.sqrt(n / Math.max(1, max));
    return '<span style="display: block; width: ' + d.toFixed(1) + 'px; height: ' + d.toFixed(1) + 'px; ' +
      'border-radius: 50%; background: ' + corTaxa(taxa) + ';"></span>';
  }

  /* `exceto` deixa uma ou mais dimensoes de fora: e o que mantem as outras
     opcoes de um seletor visiveis depois que ele ja filtrou (senao marcar a 2a
     area pelo grafico ficaria impossivel - a 1a teria apagado as demais
     barras). Aceita string ou array: a matriz de areas precisa soltar as duas
     dimensoes de area de uma vez para nao virar uma unica celula acesa. */
  function filtrados(exceto) {
    var s = state;
    var q = (s.busca || '').trim().toLowerCase();
    var solta = typeof exceto === 'string' ? [exceto] : (exceto || []);
    function livre(dim) { return solta.indexOf(dim) >= 0; }
    return DADOS.papers.filter(function (p) {
      if (s.diasSel.length && s.diasSel.indexOf(p.d) < 0) return false;
      if (s.vereditos.length && s.vereditos.indexOf(p.v) < 0) return false;
      // dentro de cada dimensao a selecao e OR; entre dimensoes, AND
      if (!livre('areas') && s.areas.length && s.areas.indexOf(p.a) < 0) return false;
      if (!livre('areasSec') && s.areasSec.length && !s.areasSec.some(function (a) { return (p.as || []).indexOf(a) >= 0; })) return false;
      // marcar uma regra e marcar um recorte de descartados: quem foi aprovado
      // nao tem regra nenhuma e nao pode entrar pela porta do nulo
      if (!livre('regrasFora') && s.regrasFora.length && (p.v !== 'fora' || s.regrasFora.indexOf(chaveRegra(p)) < 0)) return false;
      // espelho exato da regra acima: criterio de veredito so existe para quem
      // foi aprovado, entao marcar um criterio ja implica excluir os `fora`
      if (!livre('criterios') && s.criterios.length &&
        (p.v === 'fora' || !s.criterios.some(function (c) { return (p.cr || []).indexOf(c) >= 0; }))) return false;
      if (!livre('topicos') && s.topicos.length && !s.topicos.some(function (t) { return p.tp.indexOf(t) >= 0; })) return false;
      if (!livre('orgs') && s.orgs.length) {
        var chave = p.org || '__sem-org__';
        if (s.orgs.indexOf(chave) < 0) return false;
      }
      if (q) {
        var alvo = (p.t + ' ' + (p.org || '') + ' ' + p.id).toLowerCase();
        if (alvo.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  /* liga/desliga um valor numa dimensao de selecao multipla */
  function alternaLista(campo, valor) {
    var l = state[campo].slice();
    var i = l.indexOf(valor);
    if (i < 0) l.push(valor); else l.splice(i, 1);
    // `aberta` some porque o card que estava aberto pode nem sobreviver ao
    // novo recorte; `justExp` some pelo mesmo motivo - guardar o "mais" de um
    // card que o filtro tirou de cena so acumularia estado morto.
    var novo = { aberta: null, justExp: {} };
    novo[campo] = l;
    setState(novo);
  }

  function mostraTip(l1, l2) {
    return function (e) {
      elTip.innerHTML =
        '<div class="tip1">' + esc(l1) + '</div>' +
        '<div class="tip2">' + esc(l2) + '</div>';
      elTip.style.display = 'block';
      elTip.style.left = (e.clientX + 16) + 'px';
      elTip.style.top = (e.clientY + 16) + 'px';
    };
  }
  function escondeTip() { return function () { elTip.style.display = 'none'; }; }

  /* Quartil por interpolacao linear, usado tambem para a mediana (q = 0,5).
     Havia uma `mediana` propria, que arredondava para inteiro porque so media
     votos; ela saiu quando a curva de maturacao passou a medir PORCENTAGEM do
     voto final - arredondar ali perderia o cruzamento dos 90% por menos de um
     ponto, e no box plot da defasagem esconderia a assimetria que o grafico
     existe para mostrar. */
  function quartil(xs, q) {
    if (!xs.length) return 0;
    var o = xs.slice().sort(function (a, b) { return a - b; });
    var pos = (o.length - 1) * q;
    var lo = Math.floor(pos), hi = Math.ceil(pos);
    if (lo === hi) return o[lo];
    return o[lo] + (o[hi] - o[lo]) * (pos - lo);
  }
  function diaCurto(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    return p[2] + '/' + p[1];
  }
  /* Dias desde a epoca, para subtrair duas datas ISO sem aritmetica de Date -
     que em fuso local erra por um dia perto do horario de verao. */
  function diaNum(iso) {
    if (!iso) return null;
    var p = iso.split('-');
    return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }
  function escalaLog(v, max) {
    if (max <= 0) return 0;
    return (Math.log(1 + v) / Math.log(1 + max)) * 100;
  }
  /* Ticks de um eixo log1p: os valores redondos que ainda cabem, mais o
     maximo. Derivados do maximo, nunca fixos - com um recorte que baixe o teto,
     escalaLog(160, 50) da 129% e o rotulo sai do container. A folga de 7% e o
     que impede 400 e 510 de virarem um borrao: na escala log eles ficam a
     quatro pixels um do outro, e quem tem de sobreviver e o maximo. */
  function ticksLog(max) {
    if (max <= 0) return [0];
    var out = [0];
    [5, 20, 60, 160, 400, 1000, 2500].concat([max]).forEach(function (v) {
      if (v <= 0 || v > max) return;
      var ultimo = out[out.length - 1];
      if (v === max) {
        while (out.length > 1 && escalaLog(v, max) - escalaLog(out[out.length - 1], max) < 7) out.pop();
        if (v !== out[out.length - 1]) out.push(v);
        return;
      }
      if (escalaLog(v, max) - escalaLog(ultimo, max) >= 7) out.push(v);
    });
    return out;
  }

  /* ── plano cartesiano em SVG ───────────────────────────────────────────────
     Os cards sao fluidos, entao o viewBox e 0-100 nos dois eixos e o desenho
     estica junto (`preserveAspectRatio: none`). `vector-effect` e o que impede
     a espessura do traco de esticar com ele. Ponto e circulo continuam sendo
     div posicionada por porcentagem: dentro do viewBox esticado eles virariam
     elipse. `y` ja chega invertido (0 no topo), como o SVG espera. */
  function svgPlano(conteudo) {
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;">' + conteudo + '</svg>';
  }
  function poliLinha(pts, c, larg, tracos) {
    if (pts.length < 2) return '';
    return '<polyline points="' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') +
      '" fill="none" stroke="' + c + '" stroke-width="' + larg + '" vector-effect="non-scaling-stroke"' +
      (tracos ? ' stroke-dasharray="' + tracos + '"' : '') +
      ' stroke-linejoin="round" stroke-linecap="round"></polyline>';
  }
  function poliArea(pts, c, opacidade) {
    if (pts.length < 3) return '';
    return '<polygon points="' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') +
      '" fill="' + c + '" opacity="' + opacidade + '" stroke="none"></polygon>';
  }
  /* Quebra a serie nos buracos: com `n` abaixo do minimo a mediana daquela
     idade nao existe, e ligar os dois lados inventaria o ponto que falta. */
  function trechos(pontos) {
    var out = [], atual = [];
    pontos.forEach(function (p) {
      if (p === null) { if (atual.length) out.push(atual); atual = []; }
      else atual.push(p);
    });
    if (atual.length) out.push(atual);
    return out;
  }

  /* pilula de filtro: arredondada, com estados legiveis no escuro */
  function pill(on, corOn) {
    var base = 'display: inline-flex; align-items: center; gap: 0; font-size: 12.5px; line-height: 1; padding: 8px 15px; border-radius: 100px; white-space: nowrap;';
    if (!on) return base + ' background: #1b1f23; border: 1px solid #2b3138; color: #a8a49b;';
    if (corOn) return base + ' background: ' + corOn + '26; border: 1px solid ' + corOn + '; color: ' + corOn + '; font-weight: 500;';
    return base + ' background: #d9a441; border: 1px solid #d9a441; color: #14161a; font-weight: 600;';
  }

  /* Alternador de vista dentro de um card (Distribuicao|Cruzamentos, dia|
     semana, veredito|area). Menor e mais discreto que a pilula de filtro de
     proposito: ele nao recorta paper nenhum, so troca o desenho - e no
     vocabulario do painel a pilula cheia significa filtro. */
  function chipVista(rotulo, on, fn) {
    return '<div class="' + (on ? 'chip chip-on' : 'chip') + '"' + ev('c', fn) +
      ' style="' + (on ? pillOnGlobal() : pill(false)) + ' font-size: 11.5px; padding: 6px 12px;">' + esc(rotulo) + '</div>';
  }

  var SVG_CHEVRON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg>';
  var SVG_CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"></path></svg>';

  /* Menu suspenso de selecao multipla (dia, area, topico, organizacao).
     `campo` e a chave de estado; `itens` e [{valor, label, n}] ja ordenado. */
  function montaMenu(rotulo, campo, itens, opcoes) {
    var s = state;
    var aberto = s.menu === campo;
    var marcados = s[campo];
    var temBusca = itens.length > 12;
    var q = aberto && temBusca ? (s.buscaMenu || '').trim().toLowerCase() : '';
    var visiveis = q ? itens.filter(function (i) { return i.label.toLowerCase().indexOf(q) >= 0; }) : itens;
    var rotuloTodos = (opcoes && opcoes.todos) || 'todos';

    // caixa de selecao desenhada: o clique alterna e o menu FICA aberto,
    // senao marcar tres topicos exigiria reabrir o menu tres vezes
    function caixa(marcado) {
      return 'display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 4px; ' +
        (marcado
          ? 'background: ' + ACCENT + '; border: 1px solid ' + ACCENT + '; color: #14161a;'
          : 'background: #16191c; border: 1px solid #3a4149; color: transparent;');
    }

    var linhas = [{
      label: rotuloTodos, n: '',
      style: 'display: grid; grid-template-columns: 15px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 13px; cursor: pointer; border-bottom: 1px solid #242a30;',
      check: caixa(marcados.length === 0),
      labelStyle: 'font-size: 12.5px; color: ' + (marcados.length === 0 ? '#f5f3ee' : '#8b8f96') + ';',
      click: function () {
        var novo = { aberta: null, justExp: {} };
        novo[campo] = [];
        setState(novo);
      }
    }].concat(visiveis.map(function (i) {
      var marcado = marcados.indexOf(i.valor) >= 0;
      return {
        label: i.label, n: i.n,
        style: 'display: grid; grid-template-columns: 15px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 13px; cursor: pointer;',
        check: caixa(marcado),
        labelStyle: 'font-size: 12.5px; color: ' + (marcado ? '#f5f3ee' : '#a8a49b') + '; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;',
        click: function () { alternaLista(campo, i.valor); }
      };
    }));

    var nomes = marcados.map(function (v) {
      var achado = itens.filter(function (i) { return i.valor === v; })[0];
      return achado ? achado.label : v;
    });
    var valorLabel = marcados.length === 0 ? rotuloTodos
      : (marcados.length === 1 ? nomes[0] : marcados.length + ' selecionados');
    var ativo = marcados.length > 0;

    var botao = 'display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; line-height: 1; padding: 9px 14px; border-radius: 100px; white-space: nowrap; max-width: 340px; ' +
      (ativo
        ? 'background: ' + ACCENT + '1f; border: 1px solid ' + ACCENT + '; color: #f5f3ee;'
        : 'background: #1b1f23; border: 1px solid #2b3138; color: #a8a49b;');
    var contadorStyle = marcados.length > 1
      ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 100px; background: ' + ACCENT + '; color: #14161a; font-family: \'IBM Plex Mono\', monospace; font-size: 11px; font-weight: 500;'
      : 'display: none;';

    var html = '<div style="position: relative;">' +
      '<div class="chip"' + ev('c', function () { setState({ menu: aberto ? null : campo, buscaMenu: '' }); }) + ' style="' + botao + '">' +
        '<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.13em; color: ' + (ativo ? ACCENT : '#6d7178') + ';">' + esc(rotulo) + '</span>' +
        '<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 196px; color: ' + (ativo ? '#f5f3ee' : '#a8a49b') + ';">' + esc(valorLabel) + '</span>' +
        '<span style="' + contadorStyle + '">' + (marcados.length > 1 ? marcados.length : '') + '</span>' +
        '<span style="display: inline-flex; color: ' + (ativo ? ACCENT : '#6d7178') + '; transform: rotate(' + (aberto ? '180deg' : '0deg') + '); transition: transform 140ms ease;">' + SVG_CHEVRON + '</span>' +
      '</div>';

    if (aberto) {
      html += '<div style="position: absolute; top: calc(100% + 7px); left: 0; z-index: 81; width: 306px; background: #1b1f23; border: 1px solid #333a41; border-radius: 6px; box-shadow: 0 18px 42px rgba(0,0,0,0.55); overflow: hidden;">';
      if (temBusca) {
        html += '<div style="padding: 10px 11px; border-bottom: 1px solid #242a30;">' +
          '<input id="q-menu" class="busca" type="text" value="' + esc(s.buscaMenu || '') + '"' +
          ev('i', function (e) { setState({ buscaMenu: e.target.value }); }) +
          ' placeholder="filtrar lista" style="font-family: \'Instrument Sans\', sans-serif; font-size: 12.5px; padding: 7px 12px; width: 100%; border: 1px solid #2b3138; border-radius: 5px; background: #16191c; color: #ecebe6; outline: none;">' +
          '</div>';
      }
      html += '<div style="max-height: 288px; overflow-y: auto;">' +
        linhas.map(function (i) {
          return '<div class="row"' + ev('c', i.click) + ' style="' + i.style + '">' +
            '<span style="' + i.check + '">' + SVG_CHECK + '</span>' +
            '<span style="' + i.labelStyle + '">' + esc(i.label) + '</span>' +
            '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 11.5px; color: #6d7178;">' + esc(i.n) + '</span>' +
            '</div>';
        }).join('') +
        '</div>';
      if (visiveis.length === 0) {
        html += '<div style="padding: 20px 14px; text-align: center; font-size: 12.5px; color: #6d7178;">Nada encontrado.</div>';
      }
      html += '</div>';
    }
    return html + '</div>';
  }

  /* Os cinco campos da ficha, na ordem normativa, cada um com sua cor.
     Os hexes sao os slots dark do catalogo na ordem canonica (aqua, yellow,
     magenta, violet, red) - validados como conjunto contra o fundo do card.
     Azul e laranja ficam de fora de proposito: pertencem a estrito e amplo. */
  function camposFicha(f) {
    var cores = {
      'ACHADO': '#199e70',
      'PADRÃO EXTRAÍDO': '#c98500',
      'IMPLICAÇÃO PRÁTICA': '#d55181',
      'EXEMPLO CONCRETO': '#9085e9',
      'RESSALVA': '#e66767'
    };
    var bruto = [
      { rotulo: 'ACHADO', texto: f.ach, nome: '', largo: true },
      { rotulo: 'PADRÃO EXTRAÍDO', texto: f.pm || '', nome: f.pn || '', largo: true, condicional: true },
      { rotulo: 'IMPLICAÇÃO PRÁTICA', texto: f.imp, nome: '', largo: false },
      { rotulo: 'EXEMPLO CONCRETO', texto: f.ex, nome: '', largo: false },
      { rotulo: 'RESSALVA', texto: f.res, nome: '', largo: true }
    ];
    return bruto.filter(function (c) { return !c.condicional || c.nome; }).map(function (c) {
      var cr = cores[c.rotulo];
      return {
        rotulo: c.rotulo, texto: c.texto, nome: c.nome,
        wrap: c.largo ? 'grid-column: 1 / -1;' : '',
        regua: 'height: 2px; width: 34px; background: ' + cr + '; margin-bottom: 10px;',
        rotuloStyle: 'font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em; color: ' + cr + '; margin-bottom: 8px;',
        nomeStyle: c.nome
          ? 'font-family: \'Instrument Sans\', system-ui, sans-serif; font-size: 17px; font-weight: 600; line-height: 1.32; letter-spacing: -0.01em; color: #f7f5f0; margin-bottom: 9px;'
          : 'display: none;'
      };
    });
  }

  /* Acima de 320 caracteres o texto e cortado com "mais". 320 fica acima do
     `maxLength: 300` do schema do Estagio B (src/hfpapers/llm/schemas.py) -
     isto e rede de seguranca para texto que escapou do limite, nao interacao
     de todo card: a maioria nunca precisa do botao. */
  var LIMITE_JUSTIFICATIVA = 320;

  /* Traduz o codigo de `justificativa_exibivel` (gerar_painel.py) para o aviso
     que substitui o texto - ou `null` quando ha texto de verdade para mostrar.
     Unica funcao a interpretar `h`: os tres consumidores do contrato (a lista
     da janela, os aprovados e os descartados do hall) chamam esta funcao em
     vez de testar `h` por si, porque um `if (p.h)` cru trata qualquer valor
     diferente de zero como falha do Estagio B - e o codigo 3 (justificativa
     vazia gravada pelo proprio pipeline) e um caso vivo em
     `estagios/classificacao.py`, nao hipotetico.
     So o codigo 0 devolve `null` (ha texto). Qualquer outro valor, `undefined`
     incluido, cai no aviso residual - a guarda e invertida de proposito: o
     painel publica sozinho as 08:30, e um `h` fora do contrato nao pode virar
     cabecalho com rotulo e corpo vazio. */
  function avisoDecisao(h) {
    if (h === 2) return 'O Estágio B não concluiu neste paper — o veredito é preliminar.';
    // codigo 3 e qualquer residual: a decisao pode ter sido so do Estagio A
    // (classificacao.py:206 grava "fora" sem o B chegar a rodar), entao o
    // aviso nao pode apontar o dedo para um estagio especifico.
    if (h !== 0) return 'O pipeline não registrou motivo para esta decisão.';
    return null;
  }

  /* Cabecalho da decisao: por que o veredito saiu estrito ou amplo, acima dos
     cinco campos da ficha (ou sozinho, quando nao ha ficha). Nao e um sexto
     campo - os cinco falam do paper, este fala da decisao do pipeline - entao
     ele nao usa a regua colorida nem o rotulo espacado de `camposFicha`: uma
     barra lateral na cor do veredito (azul/laranja, `cor()`) e texto em itálico
     o separam visualmente dos cinco.
     `p` precisa de {v, j, h, fr}; `chave` identifica o card para o estado do
     "mais" (aba viva e historica podem ter cards abertos ao mesmo tempo). */
  function cabecalhoDecisao(p, chave) {
    // `v` inalcancavel hoje (fora nunca chega aqui), mas o painel e publicado
    // sozinho as 08:30 pelo launchd - sem essa guarda um dado torto vira
    // TypeError em `toUpperCase()` e a pagina inteira sai em branco.
    if (!p.v) return '';

    var corV = cor(p.v);
    /* A linha do veredito diz por que ele saiu como saiu: "ESTRITO · artefato
       aberto + benchmark". Os criterios saem na ordem canonica do `schemas.py`
       (estrito antes de amplo), nao na ordem em que o Parquet os devolveu. Um
       aprovado de linha antiga nao tem criterio nenhum e a linha volta a ser
       so o veredito - sem separador solto. */
    var criterios = criteriosOrdenados(p.cr).map(rotulo).join(' + ');
    var selo = '';
    if (p.fc) {
      // a contraparte pode ser um criterio ou uma regra de descarte - o mesmo
      // mapa atende as duas, que e a razao de ele ser um so
      selo = '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 10.5px; color: #8b8f96; background: #1d2226; border: 1px solid #2b3138; border-radius: 100px; padding: 3px 9px;">fronteira: quase ' + esc(rotulo(p.fc)) + '</span>';
    } else if (p.fr) {
      // fronteira de linha antiga, gravada antes de a contraparte existir
      selo = '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 10.5px; color: #8b8f96; background: #1d2226; border: 1px solid #2b3138; border-radius: 100px; padding: 3px 9px;">decisão de fronteira</span>';
    }

    var miolo;
    var aviso = avisoDecisao(p.h);
    if (aviso) {
      miolo = '<div style="font-size: 12.5px; font-style: italic; color: #6d7178;">' + aviso + '</div>';
    } else {
      var texto = p.j || '';
      var aberto = !!state.justExp[chave];
      var precisaCortar = texto.length > LIMITE_JUSTIFICATIVA;
      var exibido = (precisaCortar && !aberto) ? rotuloCurto(texto, LIMITE_JUSTIFICATIVA) : texto;
      // classe `mais`: sem ela o unico elemento clicavel do painel sem hover
      // seria este link (todo o resto - `a`, `.chip`, `.aba`, `.row`, `.mark`,
      // `.bar` - tem estado de hover no CSS de gerar_painel.py).
      var botaoMais = precisaCortar
        ? ' <span class="mais" style="font-size: 12px;"' +
          ev('c', function () {
            var m = {};
            for (var k in state.justExp) if (Object.prototype.hasOwnProperty.call(state.justExp, k)) m[k] = state.justExp[k];
            m[chave] = !aberto;
            setState({ justExp: m });
          }) + '>' + (aberto ? 'menos' : 'mais') + '</span>'
        : '';
      miolo = '<div style="font-family: Newsreader, Georgia, serif; font-size: 15px; font-style: italic; font-weight: 300; line-height: 1.62; color: #c9c5bb; text-wrap: pretty;">' + esc(exibido) + botaoMais + '</div>';
    }

    return '<div style="border-left: 2px solid ' + corV + '; padding: 1px 0 1px 16px; margin-bottom: 22px;">' +
      '<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px;">' +
        '<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: ' + corV + ';">POR QUE ' + esc(String(p.v).toUpperCase()) + '</span>' +
        // o rotulo do criterio vai em tinta de texto, nao na cor do veredito:
        // a cor ja foi dita pela palavra ao lado e pela barra da esquerda
        (criterios ? '<span style="font-size: 12.5px; color: #a8a49b;">· ' + esc(criterios) + '</span>' : '') +
        selo +
      '</div>' +
      miolo +
      '</div>';
  }

  function secao(numero, titulo) {
    return '<div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px;">' +
      '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 11px; color: ' + ACCENT + ';">' + numero + '</span>' +
      '<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #a8a49b;">' + titulo + '</span>' +
      '<span style="flex: 1; height: 1px; background: #242a30;"></span>' +
      '</div>';
  }

  function linhaFiltro(rotulo, zIndex, conteudo) {
    return '<div style="display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 16px; align-items: start; position: relative; z-index: ' + zIndex + ';">' +
      '<div style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #8b8f96; padding-top: 11px;">' + rotulo + '</div>' +
      '<div style="display: flex; gap: 10px; flex-wrap: wrap;">' + conteudo + '</div>' +
      '</div>';
  }

  /* Rodape comum as duas abas: a procedencia do dado e os modelos que o
     produziram nao mudam de aba para aba. */
  function rodape(esquerda) {
    return '<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 28px; padding-top: 24px; margin-top: 30px; border-top: 1px solid #242a30; font-size: 10.5px; letter-spacing: 0.1em; color: #5f636a;">' +
      '<span>' + esquerda + '</span>' +
      '<span>ESTÁGIO A: ' + esc(DADOS.modeloA) + ' · ESTÁGIO B: ' + esc(DADOS.modeloB) + '</span>' +
      '</div>';
  }

  /* Navegacao entre as duas abas. Sublinhado em vez de pilula: as pilulas ja
     significam "filtro" em todo o resto do painel, e uma aba nao filtra nada -
     ela troca a pergunta que a pagina responde. */
  function navAbas() {
    var s = state;
    var itens = [
      { valor: 'janela', label: 'Janela', nota: DADOS.papers.length + ' papers · ' + DADOS.janela + 'd' +
          (DADOS.pendentes ? ' · +' + DADOS.pendentes + ' na fila' : '') },
      { valor: 'historico', label: 'Registro histórico', nota: (DADOS.hall || []).length + ' trimestres' }
    ];
    return '<div style="display: flex; gap: 30px; margin-top: 26px; border-bottom: 1px solid #242a30;">' +
      itens.map(function (i) {
        var on = s.aba === i.valor;
        return '<div class="aba"' + ev('c', function () { setState({ aba: i.valor, menu: null, aberta: null, abertaH: null, justExp: {} }); }) +
          ' style="display: flex; align-items: baseline; gap: 10px; padding: 0 2px 13px; margin-bottom: -1px; border-bottom: 2px solid ' +
          (on ? ACCENT : 'transparent') + '; color: ' + (on ? '#f5f3ee' : '#8b8f96') + ';">' +
          '<span style="font-size: 13.5px; font-weight: ' + (on ? '600' : '400') + ';">' + i.label + '</span>' +
          '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 11px; color: ' + (on ? '#8b8f96' : '#5f636a') + ';">' + esc(i.nota) + '</span>' +
          '</div>';
      }).join('') +
      '</div>';
  }

  /* ══════════════ ABA HISTÓRICA ══════════════

     A aba viva mostra uma janela de dias; esta guarda o que saiu dela. Ela NAO
     preserva dado contra perda - nada e apagado, a serie inteira continua em
     marts/*.parquet e no banco. O que ela resolve e visibilidade: impedir que o
     recorte esconda para sempre o que a comunidade mais votou.

     O ranking de um trimestre congela sozinho, sem passo de "selagem": quando o
     ultimo dia dele cruza o corte, nem entram papers novos no grupo (data_hf_daily
     e imutavel) nem os votos se mexem (o refresh para de re-consultar na mesma
     marca de dias). Ate isso acontecer o trimestre e marcado "em consolidação",
     porque o top-10 dele ainda muda a cada dia que passa. */
  function construirHall() {
    var s = state;
    var hall = DADOS.hall || [];
    var out = [];

    if (!hall.length) {
      out.push(
        '<div class="card" style="padding: 62px 26px; text-align: center;">' +
          '<div style="font-family: Newsreader, Georgia, serif; font-size: 28px; font-weight: 400; color: #f5f3ee; margin-bottom: 12px;">Nenhum período saiu da janela ainda</div>' +
          '<div style="font-size: 13px; line-height: 1.65; color: #8b8f96; max-width: 580px; margin: 0 auto;">Um paper entra no registro histórico quando completa ' +
            (DADOS.diasRefresh || DADOS.diasHall) + ' dias — a mesma marca em que o pipeline para de reconsultar os votos dele. Até lá ele está na aba <em style="color: #a8a49b;">Janela</em>, com o número de votos ainda vivo.</div>' +
        '</div>');
      out.push(rodape('REGISTRO HISTÓRICO · NENHUM PERÍODO FECHADO'));
      return out.join('');
    }

    var atual = null;
    hall.forEach(function (per) { if (per.per === s.perSel) atual = per; });
    if (!atual) atual = hall[0];

    /* ── nota de leitura ────────────────────────────────────────────────── */
    out.push(
      '<div class="card" style="margin: 26px 0 30px; padding: 20px 24px; display: flex; align-items: flex-start; gap: 16px;">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + ACCENT + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.01"></path></svg>' +
        '<div style="font-size: 12.5px; line-height: 1.7; color: #a8a49b; max-width: 880px; text-wrap: pretty;">' +
          'A aba <em style="color: #ecebe6; font-style: normal;">Janela</em> mostra os últimos ' + DADOS.janela + ' dias. Aqui ficam, de cada trimestre já fora dela, os mais votados pela comunidade — ' +
          'os dez aprovados com a ficha inteira e os dez que o pipeline descartou. ' +
          '<span style="color: #6d7178;">Nada é apagado em lugar nenhum: a série completa continua no banco e nos Parquet. Os votos aqui estão congelados porque o refresh para de reconsultá-los aos ' + (DADOS.diasRefresh || DADOS.diasHall) + ' dias — medido, eles param de se mexer por volta do décimo quarto.</span>' +
        '</div>' +
      '</div>'
    );

    /* ── seletor de trimestre ───────────────────────────────────────────── */
    // `per` e nao `h`: `h` e o registrador global de handlers, e sombrea-lo aqui
    // deixaria a proxima edicao deste callback sem como registrar evento
    var chipsPer = hall.map(function (per) {
      var on = per.per === atual.per;
      return '<div class="' + (on ? 'chip chip-on' : 'chip') + '"' +
        ev('c', function () { setState({ perSel: per.per, abertaH: null, justExp: {} }); }) +
        ' style="' + (on ? pillOnGlobal() : pill(false)) + '">' +
        esc(per.rot) +
        '<span style="margin-left: 7px; font-family: \'IBM Plex Mono\', monospace; font-size: 11px; opacity: 0.62;">' + per.n + '</span>' +
        (per.cons ? '<span style="margin-left: 8px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7;">consolidando</span>' : '') +
        '</div>';
    }).join('');

    out.push(
      '<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 30px;">' +
        '<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #8b8f96;">PERÍODO</span>' +
        chipsPer +
      '</div>'
    );

    var avisoCons = atual.cons
      ? '<span style="display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: ' + ACCENT + '; background: rgba(217,164,65,0.1); border: 1px solid rgba(217,164,65,0.35); border-radius: 100px; padding: 6px 13px;">' +
          '<span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: ' + ACCENT + ';"></span>' +
          'em consolidação — o trimestre ainda não saiu inteiro do corte</span>'
      : '<span style="font-size: 11.5px; color: #6d7178;">período fechado · ranking definitivo</span>';

    /* ── 01 · os dez aprovados mais votados ─────────────────────────────── */
    out.push(secao('01', 'Os mais votados entre os aprovados'));

    var linhasAp = atual.ap.map(function (p, i) {
      var aberta = s.abertaH === p.id;
      var badge = 'display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 0; border-radius: 100px; color: ' + cor(p.v) + '; background: ' + cor(p.v) + '1f; border: 1px solid ' + cor(p.v) + '4d;';

      var corpo = '';
      if (aberta) {
        corpo = '<div style="padding: 10px 24px 30px;">';
        corpo += cabecalhoDecisao(p, 'hall:' + p.id);
        if (p.f) {
          // ordem normativa da ficha: Achado, Padrao Extraido, Implicacao,
          // Exemplo, Ressalva. O Padrao some quando o achado e puramente empirico.
          corpo += '<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 40px;">' +
            camposFicha(p).map(function (c) {
              return '<div style="' + c.wrap + '">' +
                '<div style="' + c.regua + '"></div>' +
                '<div style="' + c.rotuloStyle + '">' + c.rotulo + '</div>' +
                '<div style="' + c.nomeStyle + '">' + esc(c.nome) + '</div>' +
                '<div style="font-family: Newsreader, Georgia, serif; font-size: 16px; font-weight: 300; line-height: 1.68; color: #d5d1c8; text-wrap: pretty;">' + esc(c.texto) + '</div>' +
                '</div>';
            }).join('') +
            '</div>';
        } else {
          corpo += '<div style="font-size: 12.5px; color: #6d7178; padding: 6px 0 14px;">Aprovado sem ficha gerada — o Estágio B não chegou a escrevê-la. Ele fica no ranking porque tirá-lo faria o top-10 mentir sobre quem foi mais votado.</div>';
        }
        corpo += '<div style="display: flex; gap: 20px; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #242a30;">' +
            '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="font-family: \'IBM Plex Mono\', monospace; font-size: 12px;">' + esc(p.id) + ' ↗</a>' +
            '<span style="font-size: 11.5px; color: #6d7178;">' + esc(p.tp.join(' · ')) + '</span>' +
            (p.uq ? '<span style="font-size: 11.5px; color: #5f636a;">votos medidos em ' + esc(diaCurto(p.uq)) + '</span>' : '') +
          '</div>' +
          '</div>';
      }

      return '<div style="border-bottom: 1px solid #1d2226;">' +
        '<div class="row"' + ev('c', function () { setState({ abertaH: aberta ? null : p.id }); }) + ' style="display: grid; grid-template-columns: 30px 78px minmax(0, 1fr) 200px 66px 60px; gap: 14px; padding: 14px 24px; align-items: center;">' +
          '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 12px; color: ' + (i < 3 ? ACCENT : '#4a5058') + ';">' + (i + 1) + '</span>' +
          '<span style="' + badge + '">' + esc(p.v) + '</span>' +
          '<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">' +
            '<span style="font-size: 13.5px; color: #ecebe6; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + esc(p.t) + '</span>' +
            '<span style="font-size: 11.5px; color: #6d7178; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + esc(p.org || '—') + (p.f ? '' : ' · sem ficha') + '</span>' +
          '</div>' +
          '<span style="font-size: 11.5px; color: #8b8f96; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + esc(p.a || '—') + '</span>' +
          '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 12.5px; color: #ecebe6; text-align: right;">' + p.u + '</span>' +
          '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 11.5px; color: #6d7178; text-align: right;">' + diaCurto(p.d) + '</span>' +
        '</div>' + corpo +
        '</div>';
    }).join('');

    out.push(
      '<div class="card" style="overflow: hidden; margin-bottom: 34px;">' +
        '<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; padding: 22px 24px 18px;">' +
          '<div style="display: flex; flex-direction: column; gap: 5px;">' +
            '<div style="font-family: Newsreader, Georgia, serif; font-size: 26px; font-weight: 400; line-height: 1.1; color: #f5f3ee;">O que ficou do ' + esc(atual.rot) + '</div>' +
            '<div style="font-size: 12.5px; color: #8b8f96;">' + atual.ap.length + ' de ' + atual.na + ' aprovados, ordenados por voto da comunidade. Clique para abrir o porquê da decisão — e a ficha inteira, quando o Estágio B chegou a escrevê-la.</div>' +
          '</div>' + avisoCons +
        '</div>' +
        '<div style="display: grid; grid-template-columns: 30px 78px minmax(0, 1fr) 200px 66px 60px; gap: 14px; padding: 11px 24px; border-top: 1px solid #242a30; border-bottom: 1px solid #242a30; background: #131619; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; color: #8b8f96;">' +
          '<span>#</span><span>CRITÉRIO</span><span>TÍTULO</span><span>ÁREA</span><span style="text-align: right;">VOTOS</span><span style="text-align: right;">DIA</span>' +
        '</div>' +
        linhasAp +
        (linhasAp ? '' : '<div style="padding: 54px 24px; text-align: center; font-size: 13px; color: #6d7178;">Nenhum aprovado neste trimestre.</div>') +
      '</div>'
    );

    /* ── 02 · votados e descartados ─────────────────────────────────────── */
    out.push(secao('02', 'Votados pela comunidade, descartados pelo pipeline'));

    var linhasDe = atual.de.map(function (p, i) {
      return '<div style="display: grid; grid-template-columns: 30px 66px minmax(0, 1fr); gap: 16px; padding: 15px 24px; border-bottom: 1px solid #1d2226; align-items: start;">' +
        '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 12px; color: #4a5058; padding-top: 2px;">' + (i + 1) + '</span>' +
        '<span style="font-family: \'IBM Plex Mono\', monospace; font-size: 13px; color: #9aa1a9; text-align: right; padding-top: 1px;">' + p.u + '</span>' +
        '<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">' +
          '<div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;">' +
            '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="font-size: 13.5px; color: #ecebe6; border-bottom-color: rgba(236,235,230,0.18);">' + esc(p.t) + '</a>' +
            (p.rf
              ? '<span style="font-size: 10.5px; color: #8b8f96; background: #1d2226; border: 1px solid #2b3138; border-radius: 100px; padding: 3px 9px;">' + esc(rotulo(p.rf)) + '</span>'
              : '') +
            '<span style="font-size: 11.5px; color: #6d7178;">' + esc(p.org || '—') + ' · ' + diaCurto(p.d) + '</span>' +
          '</div>' +
          (function () {
            var aviso = avisoDecisao(p.h);
            return aviso
              ? '<div style="font-size: 12.5px; font-style: italic; color: #6d7178;">' + aviso + '</div>'
              : '<div style="font-family: Newsreader, Georgia, serif; font-size: 15px; font-weight: 300; line-height: 1.6; color: #a8a49b; text-wrap: pretty;">' + esc(p.j) + '</div>';
          })() +
        '</div>' +
        '</div>';
    }).join('');

    out.push(
      '<div class="card" style="overflow: hidden; margin-bottom: 34px;">' +
        '<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; padding: 22px 24px 18px;">' +
          '<div style="display: flex; flex-direction: column; gap: 5px;">' +
            '<div style="font-family: Newsreader, Georgia, serif; font-size: 26px; font-weight: 400; line-height: 1.1; color: #f5f3ee;">O outro lado do voto</div>' +
            '<div style="font-size: 12.5px; color: #8b8f96;">Os ' + atual.de.length + ' mais votados entre os ' + atual.nd + ' descartados do trimestre, com a regra e a justificativa que os tiraram.' +
              (atual.nx ? ' <span style="color: #6d7178;">Outros ' + atual.nx + ' do trimestre nunca chegaram a ser classificados e ficam fora das duas listas.</span>' : '') +
            '</div>' +
          '</div>' +
