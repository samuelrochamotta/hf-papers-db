lo mais forte completa cerca de 30% das tarefas do StartupBench, embora progrida parcialmente em muitas outras. As principais causas de falha são seguir instruções complexas e conhecimento específico de domínio. Isso mostra que muitos fluxos validados pelo mercado ainda estão fora da capacidade confiável de agentes atuais.","pn":"Derivar tarefas de benchmark de produtos com adoção real de mercado","pm":"Tarefas de avaliação de agentes são construídas a partir de fluxos de trabalho de produtos com demanda comprovada de usuários, e não de escolhas de pesquisadores, com rubricas finas sobre o entregável final.","imp":"Ao decidir quais fluxos de trabalho automatizar com agentes, trate o desempenho em benchmarks de tarefas selecionadas por pesquisadores como teto otimista; valide o fim a fim no seu caso real antes de prometer entrega completa, porque até tarefas de mercado consolidadas falham na etapa final.","ex":"Um assistente que gera entregáveis jurídicos ou financeiros a partir de instruções longas consegue produzir 80% do documento, mas erra cláusulas específicas de domínio ou ignora restrições da instrução, e o resultado final não é utilizável sem revisão humana.","res":"A régua de mercado é a demanda por produtos de startups de IA, que pode enviesar as tarefas para o que vende e não para o que falha em produção. O percentual de conclusão depende do harness unificado e das rubricas dos autores, então comparações absolutas com outros benchmarks não são diretas."},{"p":"2608.18115","ach":"Detector de alucinação por rotulação de sequência sobre 33 features externas (estatísticas de texto, NLI e surprisal) atinge AUC de 0.840 no RAGTruth, ganho de 11 pontos sobre o baseline de tokens independentes. A decomposição controlada atribui a maior parte do ganho à ordem temporal, não à capacidade do modelo. Em texto gerado por modelos nunca vistos no treino, a perda de AUC fica abaixo de 4%.","pn":"","pm":"","imp":"Se hoje você detecta alucinação olhando token por token, troque por um rotulador de trechos que propaga evidência entre tokens vizinhos. Isso funciona mesmo quando o modelo gera alucinações com alta confiança, e dispensa acesso aos pesos ou às ativações do modelo que gera o texto.","ex":"Em um sistema de RAG com modelo fechado via API, o gerador produz um trecho sustentado com convicção que não segue do contexto recuperado. Um classificador por token baseado em surprisal dá nota baixa de risco; o rotulador de sequência usa a entropia dos tokens vizinhos e o resultado da verificação NLI do trecho contra o contexto para marcar o span inteiro como alucinado.","res":"Os resultados valem no RAGTruth, um dataset de RAG; não há evidência de transferência para alucinação em diálogos ou geração livre sem fonte. O teto de 0.845 recorrente em três arquiteturas indica que o limite está no conjunto de features, então ganhos futuros dependem de novas sinais, não de modelos maiores. O baseline é logística por token, não detectores estado da arte mais fortes."},{"p":"2608.18423","ach":"Quinze modelos fronteira gerenciam um clube por 20 anos simulados em 26 ferramentas e cerca de 400 paradas de decisão, com score determinístico e sem juiz por LLM. Nem escala, preço ou gasto de tokens prevê o ranking, que só se estabiliza no fim do horizonte. O que separa os modelos é comportamento gerencial: os melhores cortam investimento de retorno lento perto do fim, mantêm caixa investida e abrem renovações de contrato cedo, enquanto a memória autogerida falha em dois modos opostos (arquivo que só cresce ou plano reescrito toda temporada).","pn":"Simulação determinística de horizonte longo com âncora roteirizada","pm":"Um ambiente de gerenciamento com engine determinístico acumula as consequências de centenas de decisões em um único score final, sem juiz por LLM, e uma âncora roteirizada compartilhada permite comparação direta entre agentes no mesmo mundo.","imp":"Antes de confiar um fluxo de decisão acumulativa a um agente, rode-o num ambiente com consequences cumulativas e score objetivo em vez de avaliar por tarefas isoladas — e monitore comportamentos específicos como manter caixa parada ou adiar decisões com prazo, não o gasto de tokens, que não indicou desempenho aqui.","ex":"Um agente que negocia contratos e renovações com prazos reais: os modelos de pior score deixavam as renovações chegar perto do prazo e perdiam jogadores ou pagavam mais caro — a mesma falha de um agente de compras que adia renegociações de contrato de fornecedor até o limite, acumulando custo em cada ciclo.","res":"Os achados vêm de um único domínio simulado (gerenciamento de futebol) com mundo roteirizado congelado na pista solo; a transferência dos comportamentos gerenciais identificados para ambientes de produção reais não é demonstrada. A memória autogerida falhou nos formatos testados, mas o paper não valida um desenho de memória que funcione."},{"p":"2608.18565","ach":"Em 117 tarefas independentes, o harness atinge 72,6% de pass rate verificado médio, o mais alto entre sete modelos. Na trilha de projeto real (65 tarefas), é o melhor em compilação integrada, comportamento estático e dinâmico. A separação principal aparece no comportamento dinâmico: 52,2 contra 22,4–31,4 dos baselines, enquanto os escores estáticos ficam a menos de 10 pontos uns dos outros.","pn":"Conclusão de tarefa de agente liberada por verificações externas registradas","pm":"O agente só declara tarefa completa quando checagens externas registradas — especificação, compilação e execução em runtime real — confirmam o resultado, substituindo a autoavaliação do modelo como critério de parada.","imp":"Troque o critério de parada do seu agente de código: em vez de confiar no julgamento do modelo sobre o próprio output, exija que checagens externas — compilação, testes, execução — passem e fiquem registradas antes de encerrar a tarefa. E desconfie de métricas estáticas: avalie seus agentes comparando comportamento executado, não apenas código que parece certo.","ex":"Em controladores lógicos programáveis de chão de fábrica, lógica gerada que compila e passa em checagem estática ainda falha ao rodar: os baselines marcam 22–31% em comportamento dinâmico contra 52% do harness com gate de verificação, porque traços executados no runtime real divergem do que a análise estática aprova.","res":"Os resultados valem para geração de código PLC com runtime executável e checável disponível; domínios sem compilador ou runtime de referência não oferecem o gate externo. O ganho dinâmico foi medido em uma trilha de 65 tarefas de um único contexto de projeto, não em grande variedade de projetos industriais."},{"p":"2608.19741","ach":"No benchmark de 507 fluxos de trabalho com políticas de negócio, o melhor modelo atinge 65,36% de acerto em uma tentativa, mas apenas 25,25% em vinte tentativas. Muitas falhas terminam de forma limpa com ações válidas que mudam o estado, mostrando que sinais no nível da resposta ou da chamada de ferramenta não indicam conclusão correta da tarefa.","pn":"Avaliação de agentes pelo estado terminal do backend","pm":"Cada tentativa do agente roda em sessão de ferramentas isolada e é julgada por verificações executáveis sobre o estado persistente final, aceitando trajetórias válidas e rejeitando efeitos errados, ausentes ou extras, em vez de julgar a resposta ou a chamada de ferramenta.","imp":"Se você valida agentes de negócio olhando só se a resposta parece certa ou se a chamada de API foi bem-formada, você está aprovando execuções que deixaram o sistema em estado errado. Troque o critério: escreva verificações que inspecionem o estado final do sistema (o que ficou gravado nos registros e bancos após a execução) e conte como sucesso só quando ele estiver correto.","ex":"Um agente de suporte de RH emite um reembolso duplicado: a resposta ao usuário está impecável e cada chamada de API retorna 200, mas o estado final do sistema de folha tem dois pagamentos. Verificações no nível da resposta e da chamada aprovam a execução; verificações sobre o estado terminal rejeitam.","res":"O benchmark cobre cinco domínios de negócio simulados em sandbox; a lacuna entre acerto ocasional e confiabilidade não foi medida em produção real. E o número de pass^20 mede repetição independente de tentativas, não o ganho de um agente que aprende entre tentativas."},{"p":"2608.19758","ach":"Em GPUs H20, o operador esparsamente pré-preenchido atinge até 47,26x de aceleração sobre FlashAttention-2 em contexto de 128K com FP8, e 27,19x em BF16. Contra um baseline denso alinhado ao FlashAttention-3/4 em FP8, a aceleração é de 30,49x. A correção de média mantém a degradação de qualidade controlada mesmo em níveis extremos de esparsidade.","pn":"Atenção esparsa no prefill com correção de média e kernel alinhado a produção","pm":"Um termo de correção de média suprime o erro de aproximação do esparsamento dinâmico do prefill, e o operador é reescrito com acesso de memória empacotado, especialização de warps e pipelining para se integrar como backend de atenção em frameworks de inferência.","imp":"Se você serve modelos com contexto longo, pode trocar o backend de atenção denso do prefill por esse operador esparso no framework que já usa, cortando o custo da fase mais pesada sem retreinar o modelo nem reescrever o servidor. Em contexto de 128K tokens, o prefill deixa de dominar a latência do primeiro token.","ex":"Um serviço de análise de documentos que preenche 128K tokens de contexto por requisição paga o prefill denso a cada chamada; com o backend esparso integrado ao SGLang, o mesmo prefill roda dezenas de vezes mais rápido em FP8, reduzindo a latência do primeiro token e o custo de GPU por requisição.","res":"Os ganhos são medidos em H20 e contra baselines específicos; a aceleração sobre o baseline denso mais moderno em FP8 é menor que sobre FA2. A qualidade é avaliada com degradação 'gerenciável', não idêntica à atenção densa, e a aceleração real depende do padrão de esparsidade do workload — tarefas com atenção difusa podem se beneficiar menos."},{"p":"2608.19799","ach":"O melhor agente testado atinge menos de 50% de pass@1 em 119 tarefas de reparo de software científico, distribuídas em 98 repositórios e 20 domínios. A análise identifica quatro mecanismos de falha recorrentes, como exploração equivocada e reparo superficial. A ablação pareada mostra que conhecimento científico bem alinhado melhora desempenho médio e eficiência de tokens, mas orientação mal alinhada induz ancoragem e não garante sucesso no reparo exato.","pn":"Benchmark de reparo de software científico com ablação de conhecimento de domíno","pm":"Tarefas de reparo em repositórios científicos reais são agrupadas por paradigma de tarefa, e um ablação pareada remove a orientação científica mantendo o contexto executável para isolar o efeito do conhecimento de domínio sobre o sucesso do reparo.","imp":"Antes de medir seu agente de codificação só pela taxa de sucesso agregada, separe as falhas por tipo — falta de conhecimento do domínio, exploração rasa, cobertura incompleta do reparo — porque cada tipo pede intervenção diferente. E se você injeta documentos ou contexto de domínio no agente, teste também sem ele: guia mal alinhada pode piorar o resultado e custar mais tokens.","ex":"Um agente que conserta um pipeline de processamento de dados científicos recebe um trecho de documentação do domínio como orientação; a orientação descreve um caso típico, o agente ancora nele e aplica um reparo que preserva a descrição mas não resolve a exceção real do repositório, falhando o teste executável que passaria sem a orientação.","res":"Os resultados vêm de poucos agentes comerciais avaliados com pass@1, e pass@1 abaixo de 50% em tarefas científicas difíceis não significa que agentes falhem igual em software comum. O efeito da orientação científica é misto e depende do alinhamento com a tarefa, não é um ganho uniforme."},{"p":"2608.19861","ach":"Compilar políticas de domínio em grafos de workflow e verificar o estado em cada turno do usuário eleva o Pass^4 médio de 0.42 para 0.62 no τ²-bench (airline, retail, telecom) com GPT-5.4. O maior ganho ocorre no domínio telecom (0.19 para 0.61), o mais estruturado em workflow. Os mesmos workflows transferem para Claude Sonnet 4.6 e Gemini 2.5 Pro, e a taxa de sucesso de ataques adversariais é a mais baixa observada.","pn":"Verificação de política em fronteira de turno com grafo de workflow","pm":"A política do domínio é compilada em um grafo de workflow cujo estado persistido permite um verificador, a cada turno do usuário, reconciliar requisições abertas e devolver remediação específica do passo ao agente.","imp":"Se seu agente de atendimento erra por pular etapas obrigatórias (confirmar identidade, validar elegibilidade), pare de tentar consertar isso só com prompts: represente a política como um grafo de passos e, a cada mensagem do usuário, compare o estado atual com o caminho exigido antes de deixar o agente agir. O verificador devolve a correção do passo específico, não um lembrete genérico.","ex":"Agente de companhia aérea que concede reembolso sem confirmar identidade: a checagem local da ação de reembolso não impede a omissão, porque a falha é procedural. Com o grafo, o verificador detecta no turno anterior que o nó de identificação está aberto e devolve ao agente a instrução de completar esse passo antes de prosseguir.","res":"Os resultados vêm do τ²-bench com agentes e verificador de fronteira (GPT-5.4) e validação desenhada pelos próprios autores; o ganho concentra-se no domínio mais estruturado em workflow, então o benefício em políticas vagas ou pouco sequenciais não está demonstrado. O custo de latência e a manutenção dos grafos em produção não são medidos."},{"p":"2608.20169","ach":"Em otimização de harness, avaliar o conjunto de validação completo a cada iteração gasta 80% mais avaliações do que amostrar apenas as tarefas em que candidatos divergem, com estimativa corrigida pela probabilidade de amostragem. O desempenho final iguala o da busca com conjunto completo em classificação de texto online e Terminal-Bench 2.1. Tarefas sempre resolvidas ou sempre falhadas deixam de ser discriminativas conforme o harness evolui.","pn":"Amostragem ponderada por variância de tarefas de validação durante otimização de","pm":"Durante a otimização iterativa de um harness, as tarefas de validação em que candidatos divergem são amostradas com peso maior, e o escore do conjunto completo é estimado corrigindo pelas probabilidades de amostragem.","imp":"Se você roda loops que reescrevem prompts, ferramentas ou código de orquestração validando em dataset fixo, corte o custo: a cada iteração, avalie só as tarefas onde as versões candidatas discordam e estime o escore total corrigindo pelo viés de amostragem, em vez de rodar tudo.","ex":"Um pipeline de atendimento que otimiza o agente contra 500 tickets de validação: após poucas iterações, 400 tickets todos os candidatos acertam, e o custo de avaliá-los não muda a escolha. Amostrando os ~100 tickets em que as versões divergem, a iteração fica 5x mais barata com a mesma decisão.","res":"Os resultados cobrem classificação de texto online e Terminal-Bench 2.1; a estimativa do escore completo assume que a distribuição de amostragem captura bem a fronteira de capacidade, o que pode falhar quando pouquíssimas tarefas discriminam os candidatos. O código é prometido, não confirmado como disponível."},{"p":"2608.20202","ach":"Em cinco frameworks de memória e duas famílias de modelos, todas as estratégias de memória pioram em MemTrapBench em relação a não usar memória, com quedas acima de 10% mesmo no melhor caso. Isso ocorre mesmo quando as memórias estão corretas e são semanticamente relevantes. Um método de inferência que instrui o modelo a evitar as armadilhas reduz a degradação sem perder desempenho em benchmarks tradicionais.","pn":"Memória recuperada pode corromper o raciocínio em vez de ajudar","pm":"Memórias fielmente armazenadas e semanticamente relevantes distorcem fixações de raciocínio e crenças do modelo na tarefa corrente, e instruir o modelo em tempo de inferência a contornar essas armadilhas mitiga a degradação.","imp":"Se o seu sistema guarda memórias de interações passadas, trate memória recuperada como entrada potencialmente enviesante: teste as respostas com e sem memória antes de confiar nela, e avalie adicionar instruções explícitas pedindo ao modelo para não se prender a memórias antigas quando elas conflitam com a tarefa atual.","ex":"Um assistente com memória de longo prazo recebe do usuário uma correção que contradiz uma crença registrada em sessões anteriores; o mecanismo de Belief Distortion faz o modelo reafirmar a crença antiga e responder errado, embora a memória esteja gravada de forma fiel e a busca a recupere corretamente.","res":"Os traps são induzidos pelo benchmark, então a frequência real dessas falhas em dados de produção não está estabelecida. O método mitigador foi avaliado quase só no benchmark dos próprios autores; a regra 'memória sempre ajuda' já era questionada, mas o tamanho do efeito em cenários naturais segue desconhecido."},{"p":"2608.20574","ach":"FlavourBench pontua 27 modelos frontier em 534 tarefas culinárias com 14.418 células completas, sem respostas faltantes diferenciais. Painéis independentes correlacionam em r = 0.89, e intervalos simultâneos de 95% resolvem 101 dos 351 pares de modelos. Todo o resultado é reconstrutível offline a partir de hashes e rotas publicadas.","pn":"Ground truth executável pré-computado para benchmark aberto","pm":"O benchmark pontua antecipadamente todas as respostas possíveis com um sistema versionado e publica um verificador offline que reconstrói cada resultado, eliminando o juiz humano ou de modelo.","imp":"Você pode trocar o juiz por LLM dos seus evals por um verificador determinístico: enumerate as respostas aceitáveis antes de rodar o modelo e publique o mapa de pontuação junto com os resultados. Isso elimina a variância do juiz e permite reavaliar outputs antigos sem reexecutar nada.","ex":"Um leaderboard interno de agentes de atendimento é re-feito toda semana porque o GPT-judge muda de nota em respostas idênticas. Com pontuação exaustiva pré-computada — todas as combinações de ação do agente pontuadas antes da execução — a mesma resposta recebe sempre a mesma nota e comparações entre versões param de oscilar.","res":"A abordagem só funciona onde o espaço de respostas é enumerável: 8 ingredientes com portfólios de 3 dão 56 combinações; tarefas abertas de linguagem livre não cabem nesse esquema. O domínio culinário também diz pouco sobre transferência para tarefas fora de composição restrita, e o ranking depende do conjunto fixo de tarefas escolhido."},{"p":"2608.23200","ach":"Em 252 tarefas com trajetórias verificadas, estruturas de experiência verificada superam Skills em sete modelos, com ganhos de 8,7 a 15,5 pontos percentuais, inclusive em modelos de outras famílias. Estruturas destiladas apenas de referências não mostram a mesma vantagem, e o reuso completa 39 tarefas a mais com 9,9% menos tokens no modelo de referência.","pn":"Experiência de execução verificada como recurso externo reutilizável","pm":"Trajetórias de execução confirmadas por um verificador são consolidadas em estruturas reutilizáveis que modelos subsequentes carregam, evando redescobrir estratégias a cada execução.","imp":"Antes de descartar execuções bem-sucedidas do seu agente, guarde as que passaram na verificação ponta a ponta e reutilize-as como material de apoio em execuções seguintes; a proveniência verificada importa mais que a compactação do material.","ex":"Um pipeline de geração de código com testes automáticos como verificador: em vez de cada execução recomeçar do zero, as trajetórias que passaram em todos os testes são consolidadas e fornecidas às execuções seguintes, que resolvem mais tarefas gastando menos tokens.","res":"Os ganhos vêm do subconjunto de 252 tarefas com trajetórias verificadas do modelo de referência, não das 778 tarefas do benchmark completo; o sistema de consolidação não é descrito como aberto, e o resultado sobre destilação por referência é negativo, limitando o padrão a experiência com verificação real."},{"p":"2608.23252","ach":"Proxies padrao de relevancia falham catastroficamente em hard negatives, e alargar o contexto de forma monolitica decai em utilizacao. Alocar orcamento iterativamente em geracoes sequenciais eleva portfolio recall em 16,7 a 20,5 pontos percentuais absolutos, com ganhos robustos ate modelos de 32B. O agendador de circuito fechado domina baselines de circuito aberto.","pn":"Alocacao iterativa de contexto guiada por sonda causal de utilizacao","pm":"Uma sonda causal mede a dependencia real do gerador em cada evidencia, e o orcamento de contexto e distribuido em geracoes sequenciais com feedback em vez de em uma unica janela alargada.","imp":"Na proxima vez que o RAG errar por falta de evidencia, nao aumente a janela de contexto: rode o gerador mais de uma vez, medindo com uma sonda de ablação (remover cada trecho e ver se a resposta muda) quais fontes ele realmente usa, e realoque o orcamento entre as passadas.","ex":"Um assistente de busca que responde a perguntas juridicas com 20 documentos na janela ignora as emendas mais recentes porque a atencao se dilui entre trechos parecidos; com alocacao sequencial, a segunda passada insere apenas os trechos cuja remocao alterou a resposta anterior, forçando a integracao da emenda.","res":"Os ganhos sao medidos em portfolio recall em geracao de busca com portfolios diversos; nao prova que a mesma iteracao ajude tarefas de resposta curta ou dominios com evidencia esparsa. A sonda causal exige executar o modelo multiplas vezes por consulta, o que multiplica custo de inferencia em producao."},{"p":"2608.13558","ach":"Em 36 casos reais de dados em 5 famílias de disciplinas, o sistema completa o fluxo de dados brutos a manuscrito compilado em todos, com pontuação média de 6,3. Em comparações pareadas contra uma variante cega que recebe apenas atributos escalares pré-computados, a percepção direta vence 85% dos julgamentos e melhora todas as 7 dimensões avaliadas.","pn":"Pipeline determinístico com percepção direta de evidência bruta e checagens em代码","pm":"Um pipeline determinístico com camada de percepção multimodal alimenta agentes de ideação, experimento e escrita, enquanto verificações de ideia, rigor e afirmação executadas em código garantem rastreabilidade numérica e proveniência de execução.","imp":"Se seus agentes de pesquisa ou análise trabalham sobre resumos, tabelas prontas ou features já extraídas, avalie trocar isso por acesso direto ao dado bruto com checagens em código: a comparação pareada mostra que resumos pré-computados derrubam a qualidade das decisões do agente.","ex":"Num agente que analisa imagens de microscopia e gera relatórios, alimentá-lo com métricas escalares pré-computadas (contagens, médias) esconde relações espaciais e temporais decisivas; o mesmo agente sobre as imagens originais, com verificação de afirmações em código, detecta padrões que os escalares não capturam.","res":"A pontuação média de 6,3 vem de avaliação com um backbone de raciocínio específico, e os julgamentos pareados dependem de juízes cuja composição não está no abstract; o ganho de percepção não prova que o sistema produz descobertas científicas corretas, apenas manuscritos melhor avaliados."},{"p":"2608.20438","ach":"Em experimento preregistrado com 448 trials, quatro famílias de modelos open-weight e quatro tópicos, um feed de posts de pares ordenado por likes gerados pelos próprios pares elevou a similaridade lexical final em +0,0082 de cosseno TF-IDF (IC 95% [0,0043–0,0121]) contra controle só de tópico. O contraste preregistrado de quatro fontes distribuídas contra uma fonte única, com impressões adversárias fixadas, ficou positivo mas inconclusivo no painel principal (+0,057, p=0,112), negativo nas variantes maiores e falhou no critério de consistência entre modelos e tópicos. O resultado robusto é convergência lexical sob o feed testado, não captura de opinião nem vantagem de coordenação.","pn":"Plataforma social sintética com feed ranqueado por aprovação entre pares","pm":"Agentes de linguagem postam e votam em uma plataforma social sintética, e o feed de cada agente reúne posts de pares ordenados pelos likes que os próprios pares deram, o que permite experimentos controlados de exposição em populações.","imp":"Se você opera vários agentes que leem as saídas uns dos outros, não trate vocabulário parecido entre eles como sinal de acordo: mostrar aos agentes os posts dos colegas ordenados por aprovação já basta para o vocabulário se igualar, mesmo sem ninguém mudar de posição. E não conte com espalhar a mesma informação por quatro fontes diferentes para empurrar a posição final de um agente — no teste, esse efeito não se repetiu de forma confiável entre modelos e tópicos.","ex":"No testbed PV-SST do estudo, agentes de quatro famílias open-weight postaram sobre quatro tópicos em rodadas: quem recebeu o feed de posts de pares ordenado por likes terminou com textos mais parecidos entre si (+0,0082 de cosseno TF-IDF), enquanto a posição dos agentes honestos não se moveu de forma confiável quando a mesma informação veio de quatro fontes em vez de uma. O mecanismo é de canal, não de convencimento: a exposição ao feed concentra o vocabulário sem deslocar a posição.","res":"O estudo avalia populações sintéticas de agentes LLM e afirma explicitamente que não estima efeitos sobre pessoas nem sobre plataformas de produção. O contraste de feed mistura exposição a posts com ranqueamento, então não isola o efeito do ranqueamento sozinho. O nulo de fontes distribuídas é inconclusivo sob o critério preregistrado — não demonstra ausência de efeito — e a convergência medida é lexical, não semântica."},{"p":"2608.21156","ach":"A revisão sistemática sustenta que a inteligência de um único agente tem limite arquitetural: tarefas com expertise heterogênea, subtarefas interdependentes, execução paralela e verificação independente excedem a capacidade organizacional de um contexto só. O paper organiza princípios, metodologias e aplicações existentes sob a ideia de representar tarefas, agentes e estados como nós e arestas que evoluem. Um repositório no GitHub agrega os papers e projetos coletados.","pn":"Orquestração multi-agente como grafo explícito e dinâmico","pm":"Tarefas, agentes e estados de execução são representados como nós e arestas de um grafo explícito que evolui durante a execução, distribuindo o trabalho entre agentes especializados coordenados no nível do sistema.","imp":"Quando um único agente começa a errar por misturar etapas no mesmo contexto — buscar, decidir, verificar —, pare de engordar o prompt e separe o trabalho em agentes especializados conectados por dependências explícitas, atualizando esse mapa conforme a execução avança em vez de manter tudo num histórico único.","ex":"Em um agente de código que gera o patch, roda os testes e revisa o próprio trabalho no mesmo contexto, a revisão tende a aprovar os mesmos erros da geração, porque herda as suposições que produziram o patch; separar gerador, executor de testes e revisor como nós independentes, com aresta de dependência do patch para os testes, quebra esse ciclo.","res":"É um panorama conceitual: não apresenta experimento comparando sistemas com grafo explícito contra orquestrações mais simples, como pipeline linear ou supervisor único, então o ganho declarado de inteligência de sistema é tese, não medida. O custo de desenhar e manter o grafo, e de decidir quando ele vale mais que um fluxo fixo, fica inteiramente com quem adota."},{"p":"2608.21833","ach":"O benchmark cobre 97 tarefas de geração em 11 gêneros, 100 tarefas de reparo com 19 a 27 bugs injetados por nível verificado por humanos, e 17 cadeias de otimização com seis turnos cada. Os agentes atuais são mais confiáveis ao produzir bases jogáveis e implementar requisitos explícitos do que ao descobrir defeitos, verificar comportamento em execução e preservar funcionalidade entre mudanças.","pn":"Avaliação de agentes de código por estágios do ciclo de vida","pm":"O ciclo de trabalho com um agente de código é decomposto em três trilhas complementares — geração a partir de pedido único, diagnóstico e reparo de defeitos, e otimização acumulativa em cadeias de pedidos — cada uma medida por instrumentos próprios: interação ao vivo com o artefato executável, testes comportamentais determinísticos com bugs injetados e critérios de produto final com checagens de regressão.","imp":"Antes de confiar num agente de código para manter um projeto, teste-o primeiro em cenários de reparo e regressão, não só em geração do zero — é aí que ele falha. Rode o mesmo conjunto de testes comportamentais antes e depois de cada mudança pedida ao agente para pegar funcionalidade que ele quebra sem avisar.","ex":"Um time usa um agente para evoluir um jogo interno: o agente implementa a nova mecânica pedida, mas quebra o salvamento de progresso porque nenhum teste de regressão verifica comportamento em execução — exatamente a fraqueza que a trilha de reparo do benchmark quantifica com bugs injetados.","res":"Os números valem para desenvolvimento de jogos, domínio que exige lógica, conteúdo e interação num único executável; não provam que o desequilíbrio geração-forte/reparo-fraco se repete em outros tipos de projeto. A trilha de otimização tem apenas 17 cadeias, amostra pequena para conclusões fortes."},{"p":"2608.22510","ach":"Em 68 configurações avaliadas, a melhor média de trace score com gate de segurança foi 0,7671, e tarefas em superfícies nativas do runtime renderam menos que tarefas em workspace ao vivo (0,5238 contra 0,6415). No holdout congelado, pass@k-any alcançou 0,6638 contra 0,2890 de pass estrito em três tentativas. O ranking do perfil completo e o do holdout alinham mal (Spearman 0,1300), e rankings só de corretude divergem dos rankings conscientes de processo.","pn":"Avaliação de agentes por unidade modelo-mais-runtime com scoring de trace","pm":"O benchmark trata cada configuração de modelo mais runtime como unidade avaliada, pontua tentativas a partir de traces de execução com gate de segurança, e mantém um holdout congelado com contratos de saída fechados para ranking robusto.","imp":"Se você escolhe agentes pelo leaderboard de respostas finais, você pode estar contratando um agente que falha em navegação, memória e mensagens do runtime real. Antes de fechar a escolha, rode seus candidatos num cenário que reproduza seu runtime e compare o trace das tentativas, não só a resposta final, olhando quantas tentativas cada sucesso exigiu.","ex":"Um agente de workspace corporativo que responde corretamente a um pedido de agendamento na terceira tentativa, depois de duas falhas de roteamento para a ferramenta de calendário, aparece como aprovado num leaderboard de resposta final; no trace com gate de segurança, a mesma tentativa pontua menos porque o processo incluiu violações de limite e retrabalho.","res":"Os números valem para o runtime OpenClaw e seus cenários; a correlação fraca entre perfil completo e holdout indica que a escolha da trilha muda o ranking, então não generalize os valores absolutos para outro runtime. O padrão de avaliação por trace passou na descrição, mas adotar o scoring exige adaptar os contratos de saída ao seu domínio, e o paper não valida isso fora do próprio benchmark."},{"p":"2608.22856","ach":"Ao expandir um índice FineWeb de um para sete shards, o churn excessivo de respostas foi de 6,44 pontos percentuais (exact match normalizado) e 10,25 (semântico cego), enquanto a acurácia mudou apenas -1,50 ponto. Em TriviaQA o churn foi menor e a acurácia moveu-se na direção oposta. Uma replicação com outro gerador DeepSeek achou 8,75 pp de churn semântico mesmo com acurácia subindo 3,00 pontos.","pn":"Auditoria de churn de respostas por comparação de snapshots","pm":"O excesso de churn entre dois snapshots de um índice é estimado subtraindo a discordância de repetições dentro do mesmo snapshot da discordância entre snapshots, isolando o efeito da atualização da variabilidade natural de geração.","imp":"Quando você atualiza o índice de busca do seu sistema de perguntas e respostas, não confie só na acurácia para validar a atualização: rode as mesmas perguntas antes e depois, e também repetições no mesmo índice, para ver quantas respostas mudaram sem motivo aparente.","ex":"Um assistente de suporte com RAG sobre documentação interna recebe expansão do índice; a taxa de acerto fica estável, mas 10% das perguntas passam a retornar respostas diferentes — usuários que antes recebiam a resposta correta começam a receber respostas erradas, e o dashboard de acurácia não acusa nada.","res":"Os efeitos medidos dependem do corpus FineWeb e dos geradores DeepSeek testados; TriviaQA mostrou churn menor e acurácia em direção oposta, então a magnitude não é universal. A análise de flips semânticos estáveis foi post-hoc, não pré-registrada, e o método mede churn, não utilidade — churn alto não implica piora."},{"p":"2608.22872","ach":"Em três benchmarks multi-hop (HotpotQA, 2WikiMultiHopQA, MuSiQue) com quatro sotaques sintetizados por TTS, extensões de RAG — ligação por grafo de entidades e reformulação iterativa — amplificam erros de ASR: a queda de F1 do texto limpo ao sotaque com maior WER é 36-67% maior com as duas extensões combinadas do que com recuperação densa simples. A corrupção de entidades da query explica 87-96% dos casos de degradação. Mitigações leves de superfície não fecham a maior parte do gap.","pn":"","pm":"","imp":"Antes de adicionar estrutura sofisticada de recuperação a um pipeline de voz, meça o F1 sob áudio real com sotaque: se o ASR corrompe entidades, cada salto extra de recuperação multiplica o erro em vez de absorvê-lo. Priorize corrigir ou reescrever entidades da transcrição antes de investir em grafos ou reformulação iterativa.","ex":"Um assistente de suporte por voz que responde perguntas multi-hop sobre produtos: o usuário fala um nome de modelo com sotaque, o ASR transcreve a entidade errada, e o grafo de entidades puxa documentos do produto incorreto — a falha dominante medida no paper, responsável por até 96% das degradações no 2WikiMultiHopQA.","res":"Os sotaques são sintetizados por TTS neural, não fala humana real, e os benchmarks são em inglês; a magnitude da amplificação pode diferir com áudio genuíno. O paper mede degradação sob ASR, não propõe correção — as duas mitigações leves testadas deixam a maior parte do gap intacto."},{"p":"2608.22876","ach":"Em 192 tentativas com falhas injetadas em oito checkpoints, a inspeção de máscaras de atenção não detectou nenhuma, enquanto a auditoria de invariância de prefixo localizou 192/192. O método também encontrou um defeito real de causalidade em Zamba2 e Nemotron-H. Vazamentos ocorrem via scans e normalização mesmo com máscaras corretas.","pn":"Auditoria de invariância de prefixo por passagens forward duplas","pm":"Rodam-se duas passagens forward sobre a mesma posição, uma com as entradas futuras substituídas, e compara-se a representação resultante para localizar exatamente em qual camada ou componente a causalidade quebra.","imp":"Pare de confiar na checagem de máscara de atenção como prova de que seu modelo não olha o futuro: rode a auditoria de duas passagens no seu checkpoint para confirmar que a saída em cada posição não muda quando as entradas futuras mudam.","ex":"Um modelo híbrido como o Zamba2 passava na inspeção de máscaras, mas a normalização entre camadas propagava informação de tokens futuros, contaminando respostas em tarefas de geração causal.","res":"A auditoria localiza onde a causalidade quebra, mas não corrige o defeito nem quantifica o impacto no desempenho final da aplicação; modelos com componentes não determinísticos podem exigir múltiplas repetições das passagens."},{"p":"2608.23035","ach":"O benchmark cobre 13 domínios funcionais e 212 ferramentas móveis realistas em um sandbox com estado. Modelos de fronteira atuais mostram desempenho instável em tarefas móveis: a acurácia cai acentuadamente quando há ordenação estrita de ferramentas, limites de permissão ou erros inesperados de runtime. Avalia também três dimensões além do uso básico de ferramentas: colaboração com sub-agentes, uso de memória e invocação de habilidades compostas.","pn":"Sandbox executável com estado para avaliar agentes de ferramentas","pm":"Um ambiente interativo mantém bancos de dados de aplicativos vivos, executa as chamadas de ferramentas do agente e devolve feedback estruturado, permitindo medir planejamento sob restrições reais de execução.","imp":"Antes de confiar num agente que chama APIs em produção, teste-o num ambiente com estado real, não só com correspondência offline de chamadas: inclua cenários em que a ordem das chamadas importa, permissões bloqueiam ações e erros acontecem no meio da tarefa. Se o seu pipeline de avaliação só verifica se a chamada certa foi emitida, você está medindo menos do que imagina.","ex":"Um assistente móvel que agenda uma reunião precisa consultar a agenda, checar permissões do calendário e criar o evento nessa ordem; num benchmark de correspondência offline ele acerta a sequência de chamadas, mas num sandbox com banco de dados vivo o evento de calendário já ocupado ou uma permissão negada no meio da cadeia derruba o desempenho.","res":"Os resultados valem para o domínio móvel e para as 212 ferramentas do sandbox; não provam que os mesmos modelos falham igual em outros domínios de ferramentas. E o sandbox simula runtime com bancos de dados vivos, mas não é um dispositivo real com todas as suas irregularidades."},{"p":"2608.23552","ach":"O harness eleva o ARC-AGI-3 RHAE Best@1 de 30% para 95,5% e iguala ou supera harnesses nativos e populares em codificação de contexto longo, geração de kernels de GPU e speedruns autônomos de nanoGPT. Em Factorio, subagentes dedicados permitem trabalho paralelizado e refinamento contínuo de progresso tecnológico. O código está disponível publicamente.","pn":"Sessão persistente com REPL e subagentes recursivos no harness","pm":"Um REPL persistente processa o contexto programaticamente, enquanto subagentes recursivos se coordenam por comunicação direta e o harness preserva histórias, memórias e habilidades entre trajetórias.","imp":"Você pode adotar o harness aberto como base para fluxos de agente de longa duração, em vez de construir do zero a persistência de sessão, a recuperação de falhas e a coordenação entre subagentes que seu sistema de produção precisa.","ex":"Um agente de codificação que processa repositórios grandes estoura o contexto e perde o estado entre etapas; com o REPL persistente do harness, o contexto é processado programaticamente e as memórias e habilidades sobrevivem entre trajetórias, evitando que a falha do harness apareça como falha do modelo.","res":"Os ganhos são medidos em benchmarks de avaliação de longa duração e tarefas de codificação; não prova que o mesmo desenho melhora tarefas de produção com requisitos de latência ou custo diferentes. A comparação com harnesses populares depende das configurações testadas pelos autores."},{"p":"2608.23041","ach":"O framework alcança ganhos de 9,0, 9,6 e 10,0 pontos percentuais sobre harnesses base em GAIA2, SWE-Bench Pro e Terminal-Bench 2.0. As ablações mostram que três ingredientes importam: depuração profunda em vez de reflexão superficial, modificações direcionadas em vez de edição livre, e seleção com consciência de generalização em vez de reparo específico da trajetória.","pn":"Otimização offline de harness dirigida por traces de falha","pm":"O harness é tratado como código: traces de execuções que falharam são diagnosticados, patches estruturados e direcionados são gerados, e apenas atualizações que melhoram um conjunto de validação sem reparo específico de trajetória são mantidas.","imp":"Em vez de ajustar prompts e configurações do seu agente no olho, você pode rodar um ciclo offline: colete traces de execuções que falharam, gere correções direcionadas no harness como se fosse código, e só aceite a correção se ela melhorar num conjunto de validação separado das falhas usadas para gerá-la.","ex":"Um agente de engenharia de software no SWE-Bench Pro falha em tarefas longas porque o loop de ferramentas não revalida o patch após edição; o diagnóstico do trace identifica essa falha local, um patch direcionado adiciona a etapa de revalidação, e a melhoria é confirmada num mini-batch de validação antes de entrar no harness de produção.","res":"Os ganhos são medidos sobre harnesses base específicos dos autores em três benchmarks; não há evidência de que o procedimento generalize para harnesses de produção com restrições de custo ou latência, nem que os 9-10 pontos se mantenham fora desses ambientes de avaliação. O paper não publica código, então a reprodução depende da descrição dos componentes."},{"p":"2608.23670","ach":"Em doze datasets públicos, as FSMs construídas a partir de traces têm 7 a 43 estados, reproduzem dados de teste com fitness >= 0,997 e topologia quase idêntica entre splits, em milissegundos. Contexto de estado da FSM supera Agent Workflow Memory em predição de próximo passo em todos os datasets com ground truth casado. Um monitor online classifica execuções que falharão acima das que passarão a partir de trace parcial, com AUROC de até 0,94, permitindo parada antecipada.","pn":"Topologia comportamental de agentes via FSM de traces","pm":"Um corpus inteiro de traces de execução de agentes é colapsado em uma única máquina de estados finitos compacta, cujos estados servem como contexto estrutural para prever o próximo passo e a falha de execuções novas.","imp":"Você pode trocar a leitura manual de traces longos por um mapa de estados construído em cima do seu próprio log de execuções: use o estado atual do agente nesse mapa como contexto para o modelo prever o próximo passo, e ligue um monitor que interrompe execuções quando o caminho no mapa indica falha provável, antes de gastar o custo completo da execução.","ex":"Um agente de atendimento que navega entre busca de pedido, verificação de estoque e emissão de reembolso gera traces repetitivos; colapsados em uma FSM, os estados revelam que execuções que entram no estado de reembolso sem passar pela verificação de estoque quase sempre falham na auditoria, e o monitor corta essas execuções no meio, poupando chamadas de API e evitando ações incorretas.","res":"A topologia reflete mais o harness de deploy do que o modelo, então o mapa precisa ser reconstruído quando o harness muda e não transfere para agentes com espaço de ações muito aberto. Os números de predição vêm de datasets públicos com ground truth casado; em produção sem rótulos de falha, calibrar o monitor exige rotular execuções próprias primeiro."},{"p":"2608.23691","ach":"Em 12 problemas de construção do catálogo AlphaEvolve, o ambiente multiagente produziu resultados novos em cinco: família infinita de conjuntos de Kakeya em corpos finitos, configurações exatas de 604 pontos em dimensão 11, recordes em Kakeya discretizado e sign uncertainty, e limitante inferior melhorado para o problema de sobreposição mínima de Erdős. Os agentes geraram também teoremas e análises, não só construções numéricas. Diálogos, provas e código de verificação foram liberados.","pn":"descoberta científica por enxame de agentes sem coordenador central","pm":"Agentes de famílias de modelos distintas operam em um ambiente aberto compartilhado, escolhem direções de pesquisa, colaboram e acumulam uma literatura comum verificável, sem pipeline roteirizado nem orquestrador central.","imp":"Se você orquestra múltiplos agentes, este resultado sugere que vale testar coordenação por artefato compartilhado (uma literatura comum que todos leem e escrevem) em vez de um orquestrador que distribui tarefas — e que exigir explicação junto com o resultado facilita auditar o que os agentes produziram.","ex":"Um time que roda um pipeline multiagente com um coordenador central atribuindo subtarefas pode comparar com o desenho do paper: no Station, cada agente escolhe o problema, publica no repositório compartilhado e outros constroem em cima — foi assim que emergiram as famílias infinitas de Book Ramsey sem ninguém roteirizar o caminho.","res":"Os resultados são em matemática de construção, onde verificação é barata e objetiva; não prova que o desenho funcione em domínios de engenharia onde validar a saída é caro ou ambíguo. O ambiente completo não fica claro se é adotável — o que foi liberado são diálogos, provas e código de verificação."},{"p":"2608.23740","ach":"Em quatro tarefas de backend com cinco modelos de CLI de fronteira, a configuração com 2 agentes coordenados abandona menos tarefas que um agente solo e varia menos entre execuções. Em compute pareado, o contraste de LLM-judge favorece o sistema coordenado sobre paralelismo com merge posterior, e o probe em bundle indica que a coordenação, não o merge CRDT nem o paralelismo, produz o ganho.","pn":"Coordenação de agentes por claims em workspace compartilhado com merge CRDT","pm":"Um runtime expõe sobre um sistema de arquivos compartilhado, sincronizado por CRDT, ferramentas de claim de arquivo, status e broadcast, de modo que agentes concorrentes editam o mesmo workspace sem handoffs seriais nem merge posterior.","imp":"Se você roda vários agentes de código em paralelo hoje e depois reconcilia os resultados, troque o merge no final por coordenação durante a execução: deixe cada agente reservar os arquivos que vai tocar e anunciar status num workspace compartilhado, reduzindo retrabalho e tarefas abandonadas.","ex":"Refatoração multi-arquivo em que dois agentes paralelos editam o mesmo módulo e o merge posterior quebra a build: com claims de arquivo no workspace compartilhado, o segundo agente vê o arquivo reservado e trabalha em outro módulo, evitando o conflito na origem.","res":"A evidência vem de quatro tarefas backend e um contraste positivo de LLM-judge, com ganhos claros só em modelos CLI-estáveis; o juiz automatizado é medida indireta de qualidade de código, e o probe em bundle sugere ordem de fatores, não magnitude de ganho percentual."},{"p":"2608.23918","ach":"No CodeContests com Gemma 4, o sistema atinge 0,624 de taxa de aprovação, 14,4 pontos percentuais acima de prompting direto, com 2,3 estágios registrados por tarefa. Fecha quase a distância para CodeSIM (0,731) com custo de tempo 3,3 vezes menor e variância de gasto de tokens bem menor.","pn":"Retransmissão de especialistas por tópico com teste em sandbox","pm":"Recuperação sobre um corpus de teoria seleciona um pequeno time de agentes especializados em tópicos algorítmicos; um rascunho inicial passa por turnos em que o especialista ativo testa em sandbox, repara ou transfere o código, e um passe final normaliza o boilerplate.","imp":"Você pode trocar um único agente genérico de código por um pipeline que escolhe 2 ou 3 especialistas por tópico via busca em documentação, e rodar os testes públicos em sandbox a cada turno antes de passar adiante — isso levanta a taxa de acerto sem aumentar proporcionalmente o custo.","ex":"Num problema de programação dinâmica, o rascunho inicial falha nos exemplos públicos; o especialista em DP testa no sandbox, repara o caso de borda e transfere um pacote estruturado ao próximo especialista, em vez de reiniciar do zero como faria um agente único.","res":"Os resultados são no CodeContests, domínio fechado com exemplos públicos e verificação automática; não prova ganho em geração de código de produção, onde os testes são parciais e os tópicos não cabem em categorias fixas. A comparação com CodeSIM usa backbone e custo medidos pelos próprios autores."},{"p":"2608.24569","ach":"Em 1.296 episódios controlados, handoffs diretos preservam 100% dos bloqueadores de segurança, mas compressão normal de handoff produz 100% de desativação do requisito e 54,2% de ações proibidas executadas. Restaurar os quatro campos do estado (pré-requisito, autoridade, fallback, consequência) eleva a preservação a 100% e zera ações proibidas. Verificação a jusante elimina ações proibidas mesmo com o artefato ainda desativado em 95,3% dos casos.","pn":"","pm":"","imp":"Pare de resumir livremente notas de handoff entre estágios do seu pipeline: quando o estado carrega um requisito obrigatório, transmita os quatro campos explícitos (pré-requisito, autoridade, fallback, consequência) em vez de um resumo que apenas menciona o assunto. Adicione verificação no estágio receptor como segunda linha de defesa.","ex":"Um agente de suporte com bloqueador 'não executar reembolso sem aprovação do supervisor' gera um ticket de handoff que resume o caso; o executor lê 'reembolso pendente de aprovação' como contexto informativo e processa o reembolso — o conteúdo sobreviveu, a obrigatoriedade não.","res":"Os episódios são sintéticos e condicionados à identificação correta do bloqueador a montante; não prova que falha ocorre com a mesma frequência em workflows reais, nem que os quatro campos cobrem todos os tipos de estado operacional além de bloqueadores de segurança."},{"p":"2608.24735","ach":"Meta^n aplica uma meta-operação fixa repetidamente sobre os traces e o código de um solver stack, gerando camadas de raciocínio cada vez mais altas. Supera agentes auto-melhorantes anteriores em oito famílias de benchmark, com dois backbones diferentes. Em ARC-AGI-2, projetado para resistir à memorização de habilidades, é o único sistema que pontua acima de zero; ablações atribuem a maior parte do ganho ao condicionamento passado entre camadas.","pn":"Recursão com meta-operação fixa sobre entradas crescentes","pm":"Uma operação imutável é aplicada repetidamente aos produtos das camadas anteriores, lendo os traces e o código do solver abaixo e escrevendo a próxima camada como pré-processamento estratégico e biblioteca de helpers, com profundidade definida por convergência.","imp":"Quando seu agente só refina respostas, considere fazer cada iteração ler os traces e o código das iterações anteriores e gerar um pré-processamento e helpers reutilizáveis, em vez de reescrever a resposta. Você pode limitar a profundidade pela convergência dos ganhos, não por um número fixo, e manter a operação de edição imutável para não desestabilizar o sistema.","ex":"Em ARC-AGI-2, agentes auto-melhorantes que refinam apenas a resposta pontuam zero porque memorizam habilidades em vez de transformar o processo; a recursão sobre traces e código gera camadas de pré-processamento que elevam o ponto de partida de cada tentativa, o que permitiu ao sistema pontuar acima de zero nesse benchmark.","res":"Os ganhos vêm de benchmarks de raciocínio e puzzles; não há evidência de que a recursão em profundidade compense em tarefas de produção com latência e custo restritos, onde empilhar camadas de pré-processamento pode ser proibitivo. O papel emergente das camadas com profundidade é observado, mas não controlado por design."},{"p":"2608.24876","ach":"Em quatro benchmarks de tarefa longa e dez modelos, a arquitetura melhora a taxa de sucesso em 35 dos 37 pares modelo-benchmark, com ganhos de +17,8 pontos no tau-bench para um modelo de fronteira e +32,2 pontos nas tarefas mais longas. Falhas comuns de horizonte longo caem até 80%. A vantagem cresce conforme o horizonte da interação aumenta.","pn":"Memória de trabalho acoplada a memória de experiência com atualizações validadas","pm":"Uma memória de trabalho rastreia o progresso da tarefa e seleciona habilidades de uma memória de experiência com base no estado atual, e as execuções geram evidência estruturada que localiza falhas em componentes específicos da memória, permitindo atualizações locais aprovadas por validação.","imp":"Se seu agente erra em tarefas longas porque se perde no histórico, separe a seleção de habilidades do histórico bruto: mantenha um registro curto de progresso que decide qual habilidade usar, e registre cada execução de forma estruturada para saber qual parte da memória falhou antes de mexer nela.","ex":"Um agente de atendimento que executa fluxos de múltiplas etapas em tau-bench invoca a habilidade errada porque o histórico acumulado obscurece o estado da tarefa; com o registro de progresso guiando a seleção, a invocação passa a depender do estado atual, e a falha localizada num componente específico da memória é corrigida por atualização validada em vez de reescrita global.","res":"Os resultados vêm dos benchmarks e modelos avaliados pelos autores, com dois pares modelo-benchmark incompletos ou não melhorados; o ganho depende de tarefas com horizonte longo o suficiente para o histórico atrapalhar, e a validação das atualizações de memória precisa de sinais de sucesso confiáveis que nem todo domínio de produção oferece."},{"p":"2608.24189","ach":"Em 4 meses de implantação com 40 usuários e 7 condições de memória, a acurácia em perguntas diretas variou de 19,7% a 70,1%, mas a satisfação dos usuários não mudou. O mesmo sistema com 78,8% de recall direto referenciou apenas 7,9% dos fatos em conversa natural, uma diferença de 71 pontos. Nos momentos de memória, a integração natural se associou à satisfação; o recall direto, não.","pn":"Recall sob demanda não prevê uso natural de memória","pm":"Benchmarks de memória medem recuperação quando perguntado diretamente, enquanto conversas reais exigem detectar relevância e integrar contexto prévio espontaneamente, e as duas capacidades divergem.","imp":"Pare de reportar só a acurácia de recall direto como prova de que seu sistema de memória funciona: meça se o sistema realmente usa o fato lembrado na resposta quando ele é relevante, e trate recall alto sem uso em conversa como sinal de que a avaliação está medindo a coisa errada.","ex":"Um assistente de atendimento que acerta 78% quando perguntado 'qual plano o cliente mencionou na semana passada' mas, na conversa seguinte sobre renovação, não menciona o plano nem ajusta a resposta ao histórico — o mecanismo de memória só recupera sob pergunta explícita, não dispara por relevância.","res":"O corpus vem de uma única implantação com 40 usuários e julgamento de integração feito por modelo com prompts próprios, então a associação com satisfação pode não generalizar para outros domínios e depende da qualidade desses juízes. O gap de 71 pontos mede referência ao fato, não qualidade da resposta."},{"p":"2608.23564","ach":"Em 520 execuções de 8 modelos de fronteira, apenas 5,4% passam nos três estágios de avaliação, e 13 das 20 migrações não recebem solução aceita. Entre as execuções que passam na auditoria de migração, 58% atingem 99% das verificações fixadas, mas só 26% chegam a 100%. Desempenho varia fortemente por tipo de dívida técnica: 31,4 em reescritas de toolchain contra 5,6 em reescritas de linguagem.","pn":"Protocolo de três estágios que separa completude de migração de correção comport","pm":"Avaliação em que um estágio de auditoria verifica se a transformação estrutural realmente ocorreu, testes comportamentais fixados medem correção e agentes verificadores independentes geram testes direcionados para diferenças ocultas, impedindo que o sistema contorne a tarefa copiando a implementação original.","imp":"Se você usa agentes de código para refatorações grandes, não confie em suíte de testes verde como prova de que a migração aconteceu: o agente pode copiar código antigo para passar nos testes. Adicione uma checagem separada que confirme a mudança estrutural antes de aceitar o resultado.","ex":"Um agente encarregado de migrar um repositório de Python 2 para Python 3 mantém o módulo legado intacto e duplica as funções já convertidas, fazendo a suíte fixa passar sem que a migração ocorra; o estágio de auditoria do benchmark barra exatamente esse atalho.","res":"O benchmark cobre 20 migrações em 4 categorias de dívida técnica, amostra pequena para generalizar taxas de sucesso a repositórios de perfil diferente. Os números medem modelos de fronteira em configurações específicas e não preveem desempenho em migrações com dependências externas ou estado de produção."},{"p":"2608.24358","ach":"Em pares de modelos fracos e fortes das famílias Claude e GPT, escalar no meio de uma tarefa repassando a trajetória completa recupera menos da metade da diferença de qualidade entre os modelos, com custo bem maior. Reduzir a informação herdada do modelo fraco melhora a escalada. Já ao descer para o modelo barato, remover a trajetória do modelo forte piora o resultado.","pn":"","pm":"","imp":"Se você troca de modelo no meio de uma sessão de agente de código, não repasse o histórico inteiro ao subir para o modelo mais forte: resuma ou corte o que o modelo fraco fez. Ao descer, mantenha o máximo do histórico do modelo forte.","ex":"Um agente de código rodando com um modelo barato trava em uma refatoração difícil e o sistema escalona para um modelo premium passando todas as chamadas anteriores e edições; o receiver continua uma trajetória não nativa, recupera pouco da qualidade perdida e a conta sobe — o oposto do esperado ao pagar pelo modelo melhor.","res":"Os resultados vêm de agentes de código com pares específicos de modelos; a direção do efeito da interface (cortar ajuda na escalada, cortar atrapalha na descida) pode não se transferir para outras tarefas ou famílias de modelos. O paper mede o fenômeno, não propõe uma política de troca pronta."},{"p":"2608.24979","ach":"Doze modelos de fronteira com três scaffolds de agente completaram integralmente apenas 20,6% das 97 tarefas liberadas. Em química analítica e eletroquímica, o escore parcial chegou a 87,6 e 94,9, mas a taxa de conclusão plena foi de 4% e 0%. Entre trajetórias reprovadas do Claude Code, 75,5% terminaram com linguagem afirmando que a tarefa estava concluída.","pn":"Avaliação de completude por pacote de entregáveis fim-a-fim","pm":"Cada tarefa fixa as entradas e especifica um conjunto de entregáveis científicos exigidos; a métrica de aprovação só conta quando todos os entregáveis são entregues, separada de uma métrica de progresso parcial.","imp":"Não trate um escore alto de progresso parcial nem uma mensagem final de 'concluído' do agente como prova de entrega: defina antecipadamente a lista de artefatos que o pipeline precisa produzir e verifique cada um antes de aceitar o resultado do agente.","ex":"Um agente rodando análise de dados de cromatografia gera gráficos e um relatório parcial, declara sucesso, mas não entrega o arquivo de quantificação calibrada exigido — exatamente o padrão de 75,5% de alegações falsas de conclusão medido no benchmark.","res":"Os domínios são workflows científicos específicos (química, ciências da vida); a taxa de 20,6% não se transfere diretamente para tarefas de engenharia de software com LLM. O gap entre escore parcial e conclusão plena é medido com três scaffolds e doze modelos, não prova que scaffolds melhores não fechem a lacuna."},{"p":"2608.25529","ach":"Avaliação de mais de 20 modelos multimodais recentes mostra que seguir instruções sobre vídeo continua difícil, sobretudo com muitas restrições, restrições semânticas e estruturas condicionais que exigem escolher o caminho certo conforme o conteúdo. O benchmark tem 1,5 mil amostras construídas com pipeline semiautomático e verificação humana.","pn":"Avaliar aderência a restrições em vez de acurácia de tarefa","pm":"O benchmark mede se o modelo satisfaz restrições semânticas e de formato especificadas pelo usuário sobre conteúdo de vídeo, com taxonomia de tipos de instrução e categorias de restrição verificáveis.","imp":"Se você testa um modelo multimodal só com perguntas de acurácia sobre vídeo, está medindo outra coisa do que o usuário pede no dia a dia. Vale adicionar casos com restrições de formato e condições dependendo do conteúdo antes de confiar nas respostas do modelo em produção.","ex":"Um assistente que resume vídeos de vigilância recebe o pedido 'liste apenas pessoas com capacete vermelho; se não houver nenhuma, responda com o número total de pessoas'. Modelos avaliados no benchmark falham sobretudo nesses desvios condicionais, respondendo com a lista mesmo quando a condição manda outra coisa.","res":"O conjunto tem apenas 1,5 mil amostras e restrições desenhadas manualmente, então cobre uma fração do espaço real de pedidos de usuários. Os resultados dizem respeito a modelos multimodais de vídeo, não a modelos somente texto, e não mostram como fechar a lacuna encontrada."},{"p":"2608.25625","ach":"Em benchmarks financeiros e científicos, nenhum pipeline estático de recuperação domina: os mais precisos são lentos, os rápidos perdem evidência. O roteador por consulta oferece, contra cada baseline estático, um ponto simultaneamente mais preciso e mais rápido — 2,5% mais acurado e 12,4 vezes mais veloz que o melhor baseline estático.","pn":"Roteamento por consulta entre pipelines de recuperação","pm":"Um roteador leve classifica cada consulta pelo texto e a direciona ao pipeline de recuperação mais adequado, expondo uma fronteira acurácia-latência ajustável por um único parâmetro.","imp":"Se hoje você fixa um único pipeline de recuperação para todo o tráfego, passe a rotear cada consulta para o pipeline adequado a ela: consultas simples vão para o caminho barato e consultas complexas para o caro, sem escolher manualmente onde fica o corte.","ex":"Um sistema de busca sobre relatórios financeiros em PDF roda late-interaction para tudo e estoura o orçamento de latência no pico de tráfego; com o roteador, consultas de extração simples seguem por busca densa rápida e só consultas sobre tabelas e figuras complexas pagam o pipeline caro.","res":"Os ganhos vêm de benchmarks financeiros e científicos com pipelines específicos; em corpora homogêneos ou com consultas de dificuldade similar, um pipeline estático pode bastar e o roteador adiciona custo e um ponto de falha a mais. O roteador aprende por texto da consulta, então consultas cuja dificuldade não aparece no texto podem ser mal roteadas."},{"p":"2608.26005","ach":"Em recuperação top-5, o nó informacional supera sistemas clássicos de memória em top-200 por quase 30 pontos, e o nó afetivo melhora a pontuação agregada em benchmarks de persona em 4,29 pontos sobre o melhor sistema anterior. A recuperação completa em 134 ms, dentro da latência típica de detecção de atividade de voz. O sistema foi validado em implantação real, não só em benchmark.","pn":"Memória dual com separação informacional e afetiva em streaming","pm":"A arquitetura mantém dois nós de memória paralelos — um para fatos informacionais e outro para atribuição afetiva e persona — alimentados por I/O de memória em streaming durante a conversa, com recuperação desacoplada do backend e latência compatível com detecção de fala.","imp":"Se você mantém um assistente de voz com memória única que mistura fatos e tom emocional do usuário, separe os dois em canais paralelos e recupere cada um com consultas próprias. Isso permite responder com contexto factual correto e tom emocional adequado sem adicionar atraso perceptível à conversa.","ex":"Um assistente de atendimento por voz que lembra que o cliente reclamou três vezes do mesmo problema (nó afetivo) e do número do pedido e da política aplicável (nó informacional) responde com empatia e solução correta, em vez de repetir o script neutro ou errar o dado do pedido.","res":"Os ganhos de recuperação são medidos contra sistemas de memória de texto, não contra outras arquiteturas de memória para fala; a comparação top-5 contra top-200 favorece o método. A parte de treinamento com consciência de memória não é adotável por quem não treina modelos, e os benchmarks de persona são específicos do domínio avaliado."},{"p":"2608.25500","ach":"Em doze combinações de modelo e benchmark (ALFWorld e ScienceWorld, seis backbones), o grafo calibrado por sondas contrafactuais alcança a maior pontuação em todas. Contra Graph-of-Skills, sobe a média ScienceWorld de 72,62 para 80,50 e o sucesso em ALFWorld de 80,01% para 86,79%, reduzindo passos de ambiente. Ablações mostram que arestas calibradas preservam pré-requisitos e rotinas de verificação.","pn":"Calibração de arestas de grafo de habilidades por sondas contrafactuais","pm":"As relações entre habilidades são construídas com alta revocação e depois calibradas offline removendo, substituindo e reordenando pares de habilidades, agregando a evidência com suavização bayesiana antes da recuperação.","imp":"Se seu agente busca habilidades em uma biblioteca por similaridade vetorial, você pode trocar a busca plana por um grafo cujas arestas foram testadas antes: remova a habilidade e veja se a tarefa falha, e só mantenha a aresta se a dependência sobreviver ao teste. Isso reduz o contexto enviado ao modelo sem perder cobertura.","ex":"Em ScienceWorld, um agente que recupera a habilidade de medir temperatura sem a aresta calibrada para a habilidade de ligar o equipamento pula o passo de estado que torna a medição possível; o grafo calibrado mantém essa dependência e o agente executa a sequência completa em menos passos de ambiente.","res":"Os resultados vêm de dois benchmarks de tarefas procedurais com passos discretos; não há evidência em domínios abertos ou conversacionais, onde dependências entre habilidades são menos verificáveis por sondas de remoção. A construção do grafo é offline e pode ficar defasada se a biblioteca de habilidades mudar com frequência."},{"p":"2608.26530","ach":"Em dois modelos congelados e três benchmarks, o harness com supervisor em tempo real ficou em primeiro em cinco de seis configurações, com ganhos de 12,4 a 14,6 pontos no cenário de autoaperfeiçoamento. Tokens de saída caíram 42,9% a 47,4%, e avaliações bem-sucedidas por milhão de tokens subiram mais de 110%. O ganho vem de corrigir a execução enquanto ela ainda está ativa, não depois.","pn":"Supervisor separado que redireciona o agente durante a execução","pm":"Um supervisor com contexto próprio monitora o worker em execução e pode redirecioná-lo ou abortá-lo, enquanto destila falhas e procedimentos observados em skills e memória reutilizáveis ainda durante a mesma execução.","imp":"Se você roda agentes de longa duração, separe a avaliação da execução em dois contextos: um processo supervisor que lê o andamento e pode abortar ou redirecionar o worker antes que ele queime tokens numa direção errada. Guarde as falhas corrigidas como instruções reutilizáveis para as próximas execuções.","ex":"Um agente de terminal preso em loop reinstalando dependências: um supervisor com contexto separado detecta a repetição, aborta o worker e reinjeta a instrução 'verificar cache do gerenciador de pacotes antes de reinstalar', evitando o gasto de tokens e o timeout da tarefa.","res":"Os números vêm de benchmarks específicos e de dois modelos congelados; o ganho de autoaperfeiçoamento depende de as falhas serem destiláveis em procedimentos reutilizáveis, o que nem todo domínio permite. Tarefas onde a correção exige contexto que o supervisor não consegue avaliar de fora podem não se beneficiar do live steering."},{"p":"2608.27454","ach":"Em múltiplos benchmarks e modelos, a co-evolução de skills com wiki persistente supera métodos de evolução de skills sem base de conhecimento, e ablações mostram que remover o acúmulo persistente degrada o resultado. Skills evoluídas transferem entre modelos e famílias, e skills feitas por modelos maiores podem superar as auto-evoluídas por modelos menores. Modelos menores com skills chegam a superar modelos maiores sem elas.","pn":"Co-evolução de skills com base de conhecimento persistente","pm":"A experiência bruta de execução do agente é continuamente consolidada numa wiki persistente, separada das skills executáveis, e as atualizações de skill passam a se apoiar nesse conhecimento acumulado em vez de reprocessar históricos dispersos.","imp":"Se você mantém skills ou prompts acumulados por execução de agentes, pare de tratá-los como artefatos isolados: escreva num repositório de conhecimento o que cada execução ensinou, e derive as atualizações de skill desse repositório. Isso reduz retrabalho entre iterações e facilita reaproveitar skills entre modelos diferentes do seu stack.","ex":"Um agente de atendimento que reescreve seu skill de escalonamento a cada ciclo a partir do log da última execução refaz as mesmas descobertas; com uma wiki persistente, a lição de que tickets sem ID de pedido devem ir direto para o time de cobrança fica registrada uma vez e todas as revisões futuras do skill partem dela.","res":"Os ganhos vêm de benchmarks de agentes com ciclos de evolução longos; um sistema com poucas execuções repetidas pode não acumular conhecimento suficiente para o wiki justificar o custo de manutenção. O paper não mostra custo operacional da consolidação contínua em produção."},{"p":"2608.26070","ach":"A maioria dos tokens intermediários de raciocínio perde importância conforme o modelo avança. Descartá-los, mantendo prefixo e janela recente, torna modelos existentes 3x mais rápidos sem treino, com desempenho mantido. Com RL, o método escala raciocínios para além de cem mil tokens com desempenho superior.","pn":"Descarte de tokens intermediários mantendo prefixo e janela recente","pm":"Durante o raciocínio longo, a atenção é restrita ao prefixo (instruções e ferramentas) e a uma janela dos últimos milhares de tokens, descartando os tokens intermediários, o que limita a memória necessária independentemente do comprimento do raciocínio.","imp":"Você pode servir modelos que raciocinam por muito tempo sem o custo de memória crescer a cada token gerado: aplique a restrição de atenção ao prefixo e à janela recente no seu stack de inferência e ganhe velocidade sem retreinar nada.","ex":"Um agente de código que gera traces de raciocínio de dezenas de milhares de tokens estoura a memória da GPU ou paga KV cache caro; com o descarte de tokens intermediários, o custo fica limitado ao prefixo mais a janela, e a velocidade sobe 3x sem perda de acurácia.","res":"O ganho de 3x sem treino vale para modelos treinados com atenção completa; a variante com RL, que melhora desempenho em traces muito longos, exige retreino e não é adotável sem treinar. A ablação mostra que resumir tokens ou usar janela deslizante simples funciona pior, mas os ganhos dependem de tarefas que pedem raciocínio longo."},{"p":"2608.27455","ach":"CritICL usa padrões estruturados de falha de modelos menores da mesma família como exemplos de crítica no contexto, nas variantes dinâmica (recupera críticas por entrada) e estática (perfil global de falhas). Supera in-context learning padrão e compete com métodos de test-time scaling usando menos gerações e menos tokens.","pn":"Falhas de modelos menores como exemplos de crítica na inferência","pm":"Os modos de falha estruturados de um modelo menor da mesma família são transformados em exemplos de crítica no contexto, guiando o modelo maior a evitar esses erros sem gerações repetidas.","imp":"Antes de pagar por gerações repetidas ou verificador externo, rode o modelo menor da mesma família no seu pipeline, catalogue como ele erra nas suas tarefas e coloque esses erros como exemplos de crítica no prompt do modelo maior — custa tokens de contexto, não chamadas extras.","ex":"Um assistente de extração de dados que com o modelo maior erra formatos de data e confunde entidades numéricas: rodando o modelo menor da mesma família, esses mesmos erros aparecem de forma estruturada, e viram críticas no contexto que reduzem as falhas sem múltiplas gerações por requisição.","res":"O ganho depende de os modos de falha serem estruturados e compartilhados entre escalas da mesma família; em famílias heterogêneas ou tarefas onde o modelo menor falha de forma aleatória, o perfil de críticas pode não transferir. Os resultados são de benchmarks de raciocínio, não de cargas de produção arbitrárias."},{"p":"2608.24804","ach":"Em três ambientes empresariais (ITBench SRE, EnterpriseOps-Gym ITSM, AutomationBench Finance), a evolução do harness elevou o desempenho em 20-35 pontos percentuais sobre o harness padrão, com 4-12 mudanças aceitas por ambiente. Os ganhos persistem em tarefas excluídas da evolução e transferem entre famílias GPT e Qwen sem nova evolução. As traces atribuem os ganhos a reparos de interface, convenções do ambiente e conhecimento operacional, com menos diagnósticos falso-positivos.","pn":"Evolução de harness com pool estratificado e seleção oculta","pm":"O harness do agente é evoluído por busca sobre mudanças aceitas, com tarefas estratificadas por comportamento de falha do baseline, tarefas de busca visíveis ao proponente separadas de tarefas de seleção ocultas e tarefas held-out reservadas para medir generalização, mantendo os pesos do modelo fixos.","imp":"Antes de trocar de modelo ou retreinar, você pode atacar o mismatch entre modelo e ambiente ajustando o harness: prompts, interfaces de ferramentas e estrutura de subagentes. Reserve um conjunto de tarefas que o proponente nunca vê para checar se a melhoria generaliza de verdade, e não só decorou o conjunto de busca.","ex":"Um agente de SRE que diagnostica incidentes no ITBench erra por convenções do ambiente: chama ferramentas com parâmetros no formato errado e gera diagnósticos falso-positivos. Evoluindo o harness — corrigindo a interface da ferramenta e codificando convenções operacionais nos prompts — o mesmo modelo fixo passa a acertar com trajetórias mais curtas.","res":"Os ganhos são medidos em três benchmarks empresariais específicos; não há evidência de que o procedimento funcione em ambientes com dinâmica diferente ou sem tarefas suficientes para estratificar. O abstract não indica código aberto, então reproduzir exige implementar o pipeline de evolução a partir da descrição."},{"p":"2608.25697","ach":"O protótipo reduz a taxa de sucesso de ataques HarmBench de 39,20% para 3,32% no Qwen3-4B, com falsas recusas subindo de 2,40% para 4,40% no XSTest. Mantém 98,14% da vazão de um caminho de serving sem monitoramento com 32 sequências ativas. O mesmo substrato hospeda backends distintos (SAE, transcoder, probes densas) e compõe múltiplas regras por requisição.","pn":"Separação de evidência, política e liberação no serving de LLM","pm":"Um backend de segurança expõe evidência calibrada, uma política versionada avalia regras sobre contexto por requisição e um gate separado autoriza a liberação da saída, permitindo trocar backend ou regras sem reescrever o caminho de atendimento.","imp":"Você pode organizar seus guardrails como três peças independentes — detector de evidência, regras de política e bloqueio de saída — em vez de colar cada detector de interpretabilidade direto no código de atendimento. Assim, trocar um detector ou ajustar uma regra não exige mexer no servidor de inferência.","ex":"Um serviço de chat em produção com vLLM recebe um prompt malicioso que passaria pelos filtros de prompt; o backend de evidência sinaliza o padrão interno, a política marca a requisição e o gate retém a resposta antes da liberação, sem que a troca futura desse backend por um probe mais barato exija reescrever o tratamento de requisições.","res":"Os números vêm de um modelo de 4B e de um protótipo; o custo em falsas recusas (quase dobrou no XSTest) e o comportamento sob modelos maiores ou ataques adaptados ao próprio gate não são demonstrados. A redução de ataque depende da qualidade do backend de evidência, que o framework não fornece."},{"p":"2608.28122","ach":"O survey revisa 259 trabalhos (230 sistemas e 29 benchmarks) e organiza a construção de artefatos por agentes em seis famílias de artefato. Mostra que decompor tarefas reduz complexidade local mas aumenta custos de coordenação e remontagem, e que juízes aprendidos agregam pouca evidência quando compartilham os pontos cegos do gerador.","pn":"","pm":"","imp":"Ao montar um pipeline que gera entregáveis (código, documentos, relatórios), verifique se as falhas aparecem enquanto ainda dá para consertar: se as etapas estão muito acopladas, um erro no começo só é descoberto no final, quando o conserto custa caro. Prefira pontos de verificação entre etapas em vez de confiar num único julgador automático no fim.","ex":"Um assistente que gera um relatório com código embutido: se o código é validado só depois do texto final montado, um bug de cálculo força refazer seções inteiras; com verificação do código logo após a geração, o reparo fica restrito ao trecho afetado.","res":"É um survey com princípios conceituais, não um método testado: os princípios de manter compromissos explícitos e revalidar estado não vêm acompanhados de evidência de ganho medido em produção, e a classificação em seis famílias pode não cobrir pipelines híbridos do leitor."},{"p":"2608.28478","ach":"Em 32 modelos avaliados em perguntas fechadas sobre fatos de cauda longa com contas divergentes, o melhor modelo recupera ambas as versões em apenas 52,4% dos casos; nas demais, lembra uma conta e omite a outra. Aumentar o tamanho do modelo e o raciocínio em inferência melhora o recall sem eliminar a omissão. A exposição desequilibrada do corpus favorece a conta dominante, e mais exposição do lado minoritário se associa a recall mais completo.","pn":"Sondagem de memória paramétrica por contas divergentes de fatos de cauda longa","pm":"Um pipeline baseado em grafo extrai desacordos naturais de um corpus web de baixa exposição e os converte em perguntas fechadas multi-conta, com cada resposta verificável contra os documentos-fonte que originaram o desacordo.","imp":"Antes de confiar em respostas factuais do seu modelo sobre temas controversos ou pouco documentados, teste se ele conhece os dois lados: faça a pergunta duas vezes, formulada a partir de cada versão do fato. Se o sistema só reproduz a versão majoritária, adicione verificação de fontes externas em vez de tratar a resposta como completa.","ex":"Um assistente de compliance responde sobre uma disputa regulatória citando apenas a posição do órgão regulador e omite a contestação da empresa investigada; o usuário toma a resposta como o quadro completo do caso. O mecanismo é a assimetria de exposição no treino: a conta dominante aparece muito mais no corpus, então o modelo a memoriza e a minoritária fica ausente da memória paramétrica.","res":"O resultado vale para fatos de cauda longa em perguntas fechadas, sem acesso a busca ou documentos; não prova que o modelo falha igualmente quando pode consultar fontes. E recall de ambas as contas em 52,4% não significa que as respostas estejam corretas ou bem calibradas — apenas que ambas aparecem."},{"p":"2608.28833","ach":"Em 13 LLMs, a presença de perfis de usuário e memórias recuperadas degrada consistentemente a qualidade das respostas: queda média de 45,9% em personalização irrelevante, 41,7% em estreitamento de preferências e 61,7% em viés de bajulação. O framework PRISK gera cenários dinâmicos e métricas dedicadas para expor esses três riscos de forma sistemática.","pn":"Avaliação dinâmica dos custos ocultos da personalização","pm":"Um framework de avaliação gera dinamicamente cenários com perfis de usuário e memórias recuperadas, e aplica métricas dedicadas que quantificam quanto o contexto pessoal amplifica personalização irrelevante, estreitamento de preferências e viés de bajulação.","imp":"Antes de ligar personalização ou memória de usuário no seu assistente de produção, rode um teste com perfis sintéticos e compare respostas com e sem contexto pessoal: se a diversidade cai ou o modelo passa a concordar demais, limite quais campos do perfil entram no prompt.","ex":"Um assistente com histórico de conversas e preferências inferidas do usuário passa a citar o gosto pessoal do usuário em perguntas técnicas sem relação, recomenda sempre fontes alinhadas ao que ele já lê e concorda com opiniões erradas dele — exatamente os três vieses medidos no paper.","res":"Os números são médias sobre 13 modelos com o framework dos autores; modelos ou
