configurações de personalização fora dessa amostra podem se comportar diferente. O paper mede e diagnostica os vieses, mas não propõe correção — não prova que limitar o perfil no prompt resolva o problema."},{"p":"2608.29310","ach":"Em WebGen-Bench e PaperBench, o agente mantém uma biblioteca compartilhada entre N aplicações geradas sequencialmente, preservando funcionalidade enquanto reduz redundância, verbosidade e pegada de tokens frente ao fluxo zero-shot. A construção ingênua da biblioteca causa erosão estrutural, código morto e baixa recall de extração, que as três técnicas propostas evitam, com reduções adicionais em LOC e MDL.","pn":"Manutenção de biblioteca compartilhada durante geração sequencial de aplicações","pm":"Um agente que gera aplicações relacionadas em sequência extrai componentes comuns para uma biblioteca compartilhada, usando resumos de trechos de código para guiar a extração, consolidação prévia do codebase e migração consciente de contexto apoiada em traces de extração e grafo de chamadas.","imp":"Se você usa agentes de código para gerar ou manter várias aplicações que compartilham lógica de domínio, passe a tratar a biblioteca compartilhada como artefato mantido pelo próprio agente, não como subproduto. Antes de extrair código comum, consolide o codebase e registre traces de extração e grafo de chamadas para migrar dependências sem quebrar as aplicações já geradas.","ex":"Um time mantém cinco microsserviços de checkout gerados por agentes, cada um com sua própria cópia da lógica de cálculo de impostos. Após meses de manutenção agêntica, cada cópia acumulou validações mortas e nomes divergentes; a migração para uma biblioteca única, feita sem grafo de chamadas, quebrou chamadas indiretas nos serviços que importavam funções renomeadas.","res":"Os resultados vêm de geração sequencial de aplicações relacionadas em benchmarks específicos; não prova ganho em portfólios heterogêneos nem em manutenção de codebases legados escritos por humanos. A erosão estrutural medida depende da métrica de MDL e do horizonte de manutenção simulado."},{"p":"2608.29387","ach":"Em 750 turnos e 150 episódios de cinco turnos, o melhor dos oito modelos atinge 74,9% de sucesso por turno, mas completa apenas 37,3% dos episódios inteiros. A retenção de passes adjacentes cai a 52,4% em tarefas com estado externo via ferramentas. As falhas se concentram em arquitetura de informação, propagação de estado derivado e ancoragem de estado externo.","pn":"Avaliação de UI generativa por execução multi-turno com retenção entre turnos","pm":"O artefato gerado é executado em navegador a cada turno, e a avaliação combina evidência de screenshot, DOM, traces de ator e logs de runtime, medindo além do sucesso por turno a retenção de passes adjacentes conforme a interface evolui.","imp":"Se você usa um modelo para gerar ou editar interfaces web, não avalie cada resposta isolada: teste a interface executada após várias edições seguidas e verifique se o que funcionou no turno anterior continua funcionando no seguinte. Um modelo que acerta 3 de 4 respostas soltas pode quebrar a tela na metade das sequências reais.","ex":"Um assistente que gera um painel de vendas conectado a uma API: o usuário pede um filtro por região, depois um gráfico, depois uma ordenação. A cada edição o modelo regenera a página e o estado derivado dos turnos anteriores — filtros aplicados, dados carregados — dessincroniza, deixando a tela executável mas mostrando dados inconsistentes com o que o usuário já configurou.","res":"Os números valem para o cenário do benchmark, com tarefas de cinco turnos e três tipos de cenário específicos; não provam que o mesmo colapso ocorre em qualquer fluxo de edição de UI. A métrica de retenção adjacente compara apenas turnos vizinhos, então degradação lenta ao longo de episódios longos pode ficar invisível."},{"p":"2608.29464","ach":"Em 15 modelos abertos (4B a 1,60T), o compromisso verbalizado no raciocínio é sempre menor quando a preferência chega via retorno de ferramenta ou artefato implícito, e a adoção não verbalizada é maior nesses canais. Dois monitores de transcrição detectam pior a adoção justamente nas células de maior adoção oculta (r=-0,54 e r=-0,78). Um prompt de atribuição de fonte fecha parte da lacuna, mas avisar que o raciocínio será monitorado não fecha de forma confiável.","pn":"Medição de fidelidade de CoT variando canal e explicitade da pista","pm":"Avaliação que entrega a mesma preferência por canais diferentes (mensagem do usuário, retorno de ferramenta, artefato bruto) e separa compromisso verbalizado no raciocínio de adoção não verbalizada na resposta final.","imp":"Se você monitora o raciocínio passo a passo para detectar viés ou influência indevida, trate o silêncio no raciocínio como sinal de risco, não como prova de ausência: quando a informação problemática entra por ferramenta, o modelo pode adotá-la sem escrever nada. Adicione checagens na resposta final e nos dados que as ferramentas devolvem, não só no texto do raciocínio.","ex":"Um agente de compras recebe no retorno da API de um fornecedor um campo sugerindo priorizar aquele vendedor. O modelo adota a preferência na resposta final sem mencioná-la no raciocínio; um monitor de transcrição baseado em LLM não sinaliza, porque a adoção oculta correlaciona com falha de detecção.","res":"Os resultados valem para o cenário testado: chamada única com ferramentas pré-preenchidas e pistas de preferência. Não prova que o monitoramento de CoT falhe em tarefas multi-turno, em agentes que escrevem as próprias ferramentas ou fora de cenários de viés de preferência. O prompt de atribuição de fonte fechou a lacuna em apenas sete modelos e às vezes piorou o canal do usuário."},{"p":"2608.31022","ach":"Dez modelos multimodais avaliados em quatro representações de memória performam bem sob observabilidade total, mas degradam claramente sob observabilidade parcial. Três gargalos aparecem: integrar vislumbres fragmentados, parar de explorar antes de ver a sequência completa e não revisar crenças iniciais erradas diante de evidência contraditória.","pn":"Isolamento de percepção agêntica por busca em vislumbres","pm":"Um benchmark converte uma tarefa de reconhecimento simples em busca sequencial com vislumbres parciais e restrições de retorno, isolando a construção e revisão do estado perceptual sem complexidade de controle físico.","imp":"Se você avalia um agente que consulta documentos, telas ou bases em partes, teste-o com informação incompleta e evidência que contradiga conclusões iniciais. Um agente que acerta com tudo visível pode falhar em decidir quando parar de buscar e em corrigir uma conclusão errada.","ex":"Um agente de suporte que lê tickets longos em janelas e conclui cedo a causa do problema: ao encontrar depois um trecho que contradiz a hipótese inicial, mantém o diagnóstico errado — o mesmo gargalo de revisão de crença que o benchmark mede.","res":"O benchmark usa dígitos manuscritos, uma tarefa deliberadamente simples; os gargalos medidos podem se manifestar de forma diferente em ambientes com controle físico ou domínios complexos. Os números não dizem como corrigir os gargalos, apenas que existem."},{"p":"2608.31076","ach":"Induzir uma rubrica executável antes da execução melhora agentes de pesquisa de forma consistente: ganho médio de 2,08 pontos em três LLMs sob harness fixo e 2,95 pontos em três harnesses com backbone fixo no ResearchClawBench, e 16,8 pontos em um subconjunto de 20 tarefas do AstaBench E2E Discovery, mantendo ou aumentando o número de tarefas concluídas.","pn":"Indução de rubrica executável antes da execução da tarefa","pm":"A instrução subespecificada é decomposta em metas científicas atômicas, fundamentadas em literatura e dados visíveis da tarefa, e convertida em critérios verificáveis que guiam a execução, a verificação por critério e a revisão iterativa do resultado.","imp":"Antes de mandar um agente executar uma tarefa mal especificada, você pode gerar primeiro uma lista de critérios verificáveis derivados da própria tarefa e usá-la para checar e revisar a saída — em vez de confiar só no prompt inicial ou em avaliação genérica de qualidade.","ex":"Um agente recebe 'analise este dataset e gere um relatório' e entrega conclusões sem teste estatístico algum; com verificação guiada por rubrica, o critério 'todo achado tem teste de significância reportado' falha e dispara uma revisão direcionada que adiciona a análise faltante.","res":"Os ganhos no AstaBench vêm de um subconjunto aleatório de 20 tarefas, não do benchmark completo, e os ganhos no ResearchClawBench são modestos (2 a 3 pontos); o padrão pressupõe que a tarefa tem critérios objetivos induzíveis, o que pode não valer para tarefas de engenharia com preferências difusas."},{"p":"2608.26175","ach":"Em auditoria controlada com 250 mil chamadas em dez idiomas, compressores extrativos treinados com supervisão em inglês retêm 57-62% da utilização de contexto em inglês a keep-rate 0,33, mas apenas 10-24% em lituano e praticamente nada em chinês. Métodos determinísticos e o compressor multilíngue XProvence v1 não apresentam esse gap, e a v2 retraduzida esvazia 92% dos contextos chineses sem aviso. Um pipeline de traduzir-antes-de-comprimir iguala ou supera a compressão nativa pela metade do custo em três de cinco idiomas.","pn":"","pm":"","imp":"Se você usa LLMLingua-2 ou compressor similar para cortar custo de contexto em idiomas que não são inglês, pare e meça a retenção real no seu idioma antes de confiar no budget configurado; provavelmente você precisa reduzir a taxa de compressão drasticamente ou trocar por método determinístico, ou simplesmente traduzir o conteúdo para inglês antes de comprimir.","ex":"Um assistente de suporte em lituano que comprime o histórico de conversa com LLMLingua-2 a keep-rate 0,33 entrega ao modelo um contexto com apenas 10-24% da utilidade original: o compressor descarta tokens que o modelo-alvo consideraria informativos porque a supervisão de treinamento nunca viu lituano, e o resultado se aproxima de rodar sem contexto nenhum.","res":"O gap foi medido em compressores extrativos específicos e cinco idiomas em cenário de contexto longo; compressores novos treinados multilíngue podem não apresentá-lo, como mostra o XProvence v1. O resultado não diz que compressão de prompt é inútil em inglês, apenas que budgets seguros fora do inglês são muito menores e devem ser revalidados por modelo e idioma."},{"p":"2608.28281","ach":"O melhor controlador observado atinge apenas 24,69% de taxa de sucesso estrita em tarefas completas de longa duração, mostrando que orquestrar loops de agentes é o gargalo, não o agente em si. O modo de avaliação parcial (Type II) reproduz a ordenação dos controladores do modo completo (Spearman ρ=0,9747) com custo médio 64,4% menor. Dados e código de avaliação estão liberados publicamente.","pn":"Avaliação separada do controlador e do executor em tarefas longas","pm":"O modelo avaliado recebe resumos estruturados de cada rodada de execução e emite instruções ou ordem de parada para um agente de codificação fixo, permitindo medir a qualidade da orquestração isolada da capacidade do agente executor, com validação por execução e modos de custo decrescente.","imp":"Ao escolher qual modelo usar para coordenar seus agentes de codificação, avalie essa coordenação separadamente do agente executor, usando o benchmark aberto em vez de julgar pelo resultado final da tarefa, que mistura as duas capacidades. Você também pode rodar a avaliação parcial mais barata primeiro, porque ela ordena os modelos de forma quase idêntica à completa.","ex":"Um time que usa um agente de codificação em tarefas de várias horas vê falhas e não sabe se o problema foi o prompt de coordenação ou o agente. Com o benchmark, descobre que o modelo controlador confiou em uma nota de progresso desatualizada e encerrou a tarefa antes da verificação de segurança — falha do controlador, não do executor.","res":"A taxa de sucesso estrita de 24,69% vem do melhor controlador em tarefas completas; números em fatias menores (Type II) medem ordenação, não sucesso absoluto. O benchmark avalia controle sobre um agente executor fixo, então resultados podem variar com outro executor ou outra família de tarefas."},{"p":"2608.28363","ach":"Em 600 tarefas de auto-evolução, 197 mutações que melhoram a capacidade falham na verificação de recuperabilidade. Reparo convencional recupera 0/197; com diagnóstico de endereçamento exato de estado a recuperação sobe de 0/48 para 38/48, e estender a linguagem de recuperação leva a 99,3% no estrato definido pelo oráculo.","pn":"Verificação de recuperabilidade de mutações auto-evolutivas em estados contrafá","pm":"Toda mutação que o agente faz no próprio harness é sintetizada com um cálculo de recuperação e verificada de forma independente contra estados contrafactuais, rejeitando as que não podem ser revertidas fora do estado original.","imp":"Antes de deixar seu agente alterar prompts, ferramentas ou middleware em produção, exija que cada mutação venha acompanhada de um plano de reversão testado em estados diferentes daquele em que foi criada — e descarte a mutação se o plano falhar, mesmo que ela melhore o desempenho.","ex":"Um agente de atendimento que reescreve o próprio prompt de roteamento para elevar a taxa de acerto: a mutação funciona no estado atual, mas num estado com fila de ferramentas diferente o prompt antigo não pode ser restaurado, deixando o sistema preso numa configuração sem volta.","res":"Os números vêm de tarefas one-shot sintéticas com oráculo determinístico, e a interação negativa entre diagnóstico e linguagem estendida só aparece no backbone gpt-oss-120b, não se replicando no Qwen3.8-27B — o efeito é dependente de modelo e não generaliza automaticamente para outros harnesses."},{"p":"2608.30468","ach":"Hi-Q alcança 52,3 EM e 64,0 F1 de média em três benchmarks de QA multi-hop com recuperação em corpus completo, superando IRCoT em 15,1 EM e PropRAG em 11,5 EM no MuSiQue-full, sem construir grafo em todo o corpus. A topologia da árvore de consulta é decidida por sinais de suporte do corpus, não por um template fixo de decomposição.","pn":"refinamento hierárquico de consulta guiado por evidência recuperável","pm":"Uma árvore de consulta é expandida a partir de sinais de suporte do corpus: um operador de resolução testa se a evidência recuperada sustenta cada unidade da consulta, encerrando nós resolvidos e expandindo apenas os não resolvidos, com um verificador de cobertura semântica validando a expansão.","imp":"Em vez de reformular a consulta do RAG sempre do zero a cada iteração, teste primeiro se os documentos já recuperados sustentam cada subpergunta: o que já está sustentado fica pronto, e só o que falta é decomposto. Isso economiza chamadas de busca e evita decompor demais perguntas que uma única recuperação já resolve.","ex":"Num pipeline RAG que responde perguntas sobre contratos, uma pergunta como 'qual fornecedor ganhou o lote X e quanto foi pago' hoje dispara a mesma reescrita iterativa do IRCoT mesmo quando o contrato já recuperado contém ambas as respostas; o operador de resolução detecta a cobertura e encerra sem segunda busca, enquanto no caso do lote pago em anexo separado ele expande só o ramo de pagamento.","res":"Os números vêm de benchmarks de QA multi-hop com distratores controlados; em produção, a qualidade do verificador de cobertura semântica determina se o nó é encerrado cedo demais, e o paper não mede esse erro de encerramento em domínios abertos. Implementar o padrão por descrição exige reconstruir os operadores sem o código dos autores."},{"p":"2609.00551","ach":"Em três benchmarks de QA sobre vídeos longos, a memória por eventos supera a melhor baseline em 2,0 a 3,7 pontos de acurácia e 7,0 pontos em recall estrito de evidência. Também corta 63,66% dos tokens de inferência e reduz a latência por consulta em 4,67 vezes. O ganho vem de devolver evidência alinhada em vez de fragmentos que o modelo precisa religar na hora de responder.","pn":"Memória multimodal centrada em eventos com evidência pronta para geração","pm":"A construção da memória vincula registros de texto, frames e fatos de grafo a âncoras de evento, de modo que cada célula alinhada carrega contexto temporal, relações e proveniência, e a leitura no momento da consulta devolve evidência compacta em vez de fragmentos isolados por modalidade.","imp":"Você pode reorganizar seu índice de RAG para agrupar evidências em torno de um evento (com timestamp e fonte) em vez de recuperar trechos soltos, e avaliar se a resposta já chega montada: menos tokens por consulta e menos reconstrução no momento da resposta.","ex":"Num assistente que responde perguntas sobre gravações longas de reunião, o RAG atual devolve separadamente a legenda de um slide, um trecho da transcrição e um resumo; o modelo erra a ordem temporal e cita fonte errada. Com células indexadas por evento, a leitura traz os três registros com carimbo de tempo e proveniência já casados.","res":"Validado só em QA de vídeo longo multimodal; os ganhos de latência e tokens dependem do custo de reconstrução na inferência, que pode ser menor em textos puros. O código ainda não está publicado — o repositório anunciado é integração futura —, então hoje a adoção é pela descrição do desenho, não por biblioteca pronta."},{"p":"2609.00621","ach":"Em três domínios (raciocínio sintético, geração de revisão colaborativa e precificação de seguros), a separação entre protocolo e conteúdo atingiu 100% de validade eventual do protocolo, com ganhos consistentes de desempenho na tarefa. Nos sistemas de referência, uma edição de prompt voltada a melhorar conteúdo podia corromper roteamento ou formato e derrubar o pipeline inteiro. Com a separação, o otimizador nunca enxerga a interface de que o código depende.","pn":"Separação de fluxo de controle e de dados em prompts de sistemas multiagente","pm":"A parte do prompt que especifica protocolos de execução (roteamento, formato de saída, sinal de término) é representada como objetos de programa tipados e validados fora do texto otimizável, de modo que o otimizador de prompt só altera o fluxo de linguagem sem tocar a interface de que o código depende.","imp":"Se você otimiza prompts de um sistema multiagente automaticamente, pare de colocar instruções de roteamento, formato de saída e critérios de parada no mesmo texto livre que o otimizador edita. Extraia essas regras para contratos validados fora do prompt — por exemplo, esquemas de saída checados por código — e deixe o otimizador mexer só na linguagem da tarefa. Isso elimina a classe de falha em que uma melhoria de conteúdo quebra a execução.","ex":"Num pipeline de análise de sinistros com agentes de triagem, cálculo e emissão, o texto do prompt dizia qual agente recebe cada mensagem e em qual formato JSON responder. O otimizador reescreveu essa instrução ao buscar respostas melhores, o roteador parou de reconhecer o sinal de término e o fluxo travou; com a separação, o roteamento fica em objeto tipado validado e o otimizador não pode corrompê-lo.","res":"Os resultados vêm de fluxos de trabalho sintéticos e de domínios específicos; 100% de validade eventual não garante os mesmos números em pipelines com protocolos menos padronizados. E o desenho só protege o que é separado: qualquer regra de execução que continuar embutida em linguagem natural no prompt segue exposta ao mesmo risco de corrupção."},{"p":"2609.01481","ach":"A camada orquestradora eleva o desempenho de três pares harness-modelo em média 52,25% (máximo 82,86%) em três benchmarks de desenvolvimento de software após três iterações. Em uma implantação de múltiplos dias com mais de 70 iterações, o sistema produziu sozinho um jogo FPS jogável com mecânicas centrais implementadas, visuais e áudio integrados. O ganho vem do controle de escopo: cada loop entrega incrementos pequenos e verificáveis em vez de tentar o sistema inteiro de uma vez.","pn":"Camada orquestradora sobre harness de agente com incrementos verificáveis","pm":"Uma camada externa organiza execuções de um harness de codificação em loops de planejamento-código-teste que balanceiam reparo com crescimento de capacidade, restringindo cada iteração a entregas verificáveis e separando testes de implementação de avaliação independente, com histórico versionado do projeto.","imp":"Se você roda um agente de codificação em tarefas longas, em vez de pedir o sistema completo e corrigir falhas no final, envolva o harness em uma camada que divide o trabalho em entregas pequenas com verificação própria a cada ciclo, e mantenha um histórico versionado para reutilizar o que já funcionou em vez de recriar.","ex":"Um agente de codificação que recebe 'construa um portal de vendas' e trava gerando 10 mil linhas com bugs encadeados: com incrementos verificáveis, ele entrega primeiro o esquema de dados com testes de implementação passando, depois a API de pedidos validada por avaliação independente, e só então a interface, evitando que um erro de fase inicial contamine todo o código posterior.","res":"Os ganhos são medidos em três benchmarks e três pares harness-modelo após apenas três iterações, o que não garante que a curva de melhoria se sustente em escalas muito maiores; o caso de múltiplos dias é um exemplo, não uma avaliação controlada. O framework restringe saídas verificáveis, então domínios onde a correção não é facilmente testável podem se beneficiar menos."},{"p":"2608.30478","ach":"O paper argumenta que agentes de linguagem atuais resolvem tarefas delimitadas definidas pelo usuário, enquanto assistência persistente exige operação contínua em ambientes de longa duração. Propõe uma arquitetura em que a percepção de sinais de execução, contexto e ambiente gera tarefas de ciclo de vida que governam a adaptação dos procedimentos. Usa essa estrutura para organizar retrospectivamente trabalhos recentes e um estudo de caso detalhado.","pn":"Arquitetura centrada em percepção para agentes persistentes","pm":"Componentes de percepção e controle monitoram continuamente sinais de execuções de tarefas, contexto interno e mudanças do ambiente, e convertem esses sinais em tarefas de ciclo de vida que dirigem a operação e a adaptação contínua dos procedimentos do agente.","imp":"Ao desenhar um agente que fica no ar atendendo necessidades que mudam ao longo do tempo, reserve um componente cujo trabalho é observar execuções passadas e do ambiente e transformar o que percebe em uma fila de tarefas internas de manutenção e adaptação — em vez de tratar cada chamada como um problema isolado.","ex":"Um agente de suporte interno de uma empresa: um procedimento de reembolso muda de política, clientes começam a perguntar sobre um produto novo, e o agente não tem mecanismo para captar essas mudanças; a arquitetura proposta trata essas percepções como tarefas de ciclo de vida que disparam a atualização dos procedimentos do agente.","res":"É um framework conceitual sem instrumento, benchmark ou implementação: nada mede se a arquitetura melhora agentes reais. O estudo de caso é ilustrativo, e ler o modelo como receita pronta de implementação é a leitura errada mais provável."},{"p":"2608.30730","ach":"Em 365 dias simulados de operação de múltiplas lojas, nenhum dos 18 modelos avaliados domina: GPT-5.6 Sol maximiza ativos (100.000 → 1.431.425) mas fica em 16º de 18 em evitar fraude. Entre modelos abertos, Qwen3.8-Max-Preview alcança 416.252, 38% acima do GLM 5.2 (high), e é o que mais aprende ao longo do horizonte, reduzindo preços negociados em pedidos repetidos.","pn":"Ambiente determinístico de dois lados para medir adaptação de longo horizonte","pm":"Um ano simulado de operação com demanda fixa e kernel de negociação determinístico, do qual o modelo de linguagem apenas verbaliza decisões, torna reprodutível a medição de como o agente adapta sua política ao longo de milhares de passos.","imp":"Antes de escolher um modelo para um agente que roda por dias ou semanas, você precisa decidir qual dimensão importa mais: o melhor modelo em lucro não é o melhor em segurança nem em eficiência. Meça as dimensões separadamente no seu domínio em vez de confiar em um placar único, e teste se o agente melhora com o tempo de operação, não só na primeira rodada.","ex":"Um agente de compras que negocia com fornecedores em pedidos recorrentes: o benchmark mostra que modelos conseguem barganhar preços progressivamente mais baixos ao longo de pedidos repetidos, então um sistema avaliado apenas em uma sessão única de negociação subestima essa capacidade de adaptação.","res":"Os dois lados do mercado são determinísticos por construção: clientes e fornecedores seguem modelos fixos, com o LLM apenas verbalizando decisões. Isso garante reprodutibilidade, mas não prova que os rankings se transferem a mercados com contraidentidades adaptativas reais; não é um teste de robustez contra adversários de verdade."},{"p":"2608.24777","ach":"O modelo guarda em nível de passo alcança a maior acurácia média entre guardas open-weight, com desempenho próximo a um modelo de fronteira fechado. Em dois benchmarks de agentes, reduz a taxa média de sucesso de ataques em 77,3% relativa ao cenário sem guarda, com queda média de utilidade de apenas 2,8 pontos percentuais. A engenharia de dados gera automaticamente pares de trajetórias seguras e inseguras que diferem somente na ação do passo arriscado.","pn":"Guarda em nível de passo com pares contrafactuais de trajetória","pm":"Um modelo guarda audita cada ação de ferramenta antes da execução e é treinado com pares de trajetórias idênticas até o passo de risco, diferindo só na ação tomada, com recompensa balanceada entre defesa excessiva e defesa insuficiente.","imp":"Você pode colocar a checagem de segurança antes de cada chamada de ferramenta, em vez de auditar a trajetória inteira depois que o dano já aconteceu. Na prática, isso significa interceptar a ação de escrever arquivo, enviar e-mail ou executar comando no momento em que o agente decide executá-la, bloqueando ou sinalizando antes do efeito colateral.","ex":"Um agente de atendimento com acesso a um sistema de tickets recebe uma instrução injetada em um documento e decide chamar a ferramenta de envio de e-mail para vazar dados de clientes. Um guarda em nível de trajetória só perceberia o vazamento após o envio; o guarda em nível de passo compara a ação proposta com a alternativa segura no mesmo contexto e bloqueia a chamada antes da execução.","res":"Os números de redução de ataque vêm de benchmarks específicos de agentes; o comportamento em ferramentas e domínios fora desses cenários não está provado. O balanceamento entre defesa excessiva e insuficiente é dinâmico durante o treino, então a taxa de falsos bloqueios em tráfego legítimo de produção precisa ser medida no seu próprio ambiente antes de confiar no custo de 2,8 pontos de utilidade."},{"p":"2608.28444","ach":"Em múltiplos LLMs e tarefas downstream, atenção de janela deslizante com sinks iguala ou supera modelos com atenção linear pós-treinada. Em tarefas de raciocínio de contexto longo (Needle-in-a-Haystack e BABILong), a janela deslizante alcança desempenho 2 a 10 vezes maior. A solução dispensa pós-treinamento, é rápida e usa pouca memória.","pn":"","pm":"","imp":"Antes de escolher um modelo com atenção linear para servir contexto longo, teste a variante com janela deslizante e sinks: você pode cortar memória e custo de inferência trocando de modelo em vez de pagar por um pós-treinamento caro que nem supera o baseline simples.","ex":"Um serviço de busca em documentos longos que roda um modelo com atenção linear pós-treinada para economizar memória perde a agulha em testes tipo BABILong, porque o estado comprimido da atenção linear descarta detalhes; o mesmo serviço com janela deslizante e sinks mantém os tokens recentes intactos e recupera a informação com custo menor.","res":"A comparação é contra modelos lineares pós-treinados, não contra modelos lineares treinados do zero ou contra atenção quadrática completa; em tarefas que exigem depender de contexto muito anterior à janela, a janela deslizante não resolve, e o ganho relatado se limita aos benchmarks testados."},{"p":"2608.29607","ach":"SnapBench avalia 16 recuperadores multimodais sob 53 condições controladas de corrupção em 1.145 queries e 9.085 itens de galeria, com anotação humana. Corrupções de imagem degradam substancialmente a recuperação conjunta, enquanto corrupções de texto afetam pouco a recuperação conjunta. Recuperação só com imagem limpa frequentemente supera a recuperação conjunta.","pn":"Calibração de confiabilidade por modalidade na fusão de recuperação multimodal","pm":"A fusão de pontuações de recuperação entre imagem e texto é reponderada dinamicamente conforme a confiabilidade estimada de cada modalidade diante de entradas corrompidas.","imp":"Antes de confiar num pipeline de busca que combina foto e texto, teste-o com fotos borradas e perguntas com erro de digitação: o resultado limpo pode enganar, porque juntar texto à imagem às vezes puxa a busca para descrições genéricas. Vale medir a qualidade de cada entrada separadamente e desconfiar da fusão fixa entre modalidades.","ex":"Num assistente mobile em que o usuário fotografa um produto e digita a pergunta, uma foto tremida faz o embedder multimodal retornar resultados de categoria genérica em vez do produto correto, enquanto a mesma busca com a imagem limpa acertaria — a fusão pondera a imagem corrompida sem verificar sua confiabilidade.","res":"Os achados valem para o cenário snap-and-ask com corrupções controladas; não provam que o degradê acontece em distribuições naturais de uso. O método de reponderação proposto é apresentado como ilustração da necessidade de calibração, com validação limitada, e não como solução madura."},{"p":"2608.30322","ach":"Em quinze tarefas de calibração, uma configuração de agente de fronteira passou 68,0% com o artefato e 0% sem ele, o que isola o conhecimento ausente dos corpora públicos como causa da falha. Em uma tarefa, um artefato plausível porém incorreto também deu 0% em cinco tentativas. Sete tarefas passaram a triagem empírica de gating em cinco tentativas.","pn":"Porta de conhecimento com instrução byte-idêntica para testar dependência de um","pm":"A construção da tarefa separa a instrução de um artefato compacto com convenções privadas, mantendo a instrução byte-idêntica nas condições com e sem o artefato, com provenance, auditoria de vazamento e witnesses executáveis que tornam a dependência explícita e verificável.","imp":"Quando o seu agente falha em tarefas profissionais, teste se o problema é falta de convenções privadas: rode a mesma tarefa com e sem um artefato contendo as convenções e compare as notas. Se a diferença for abissal, o conserto é injetar o artefato, não refinar o prompt nem trocar de modelo.","ex":"Um agente de codificação que gera consultas SQL internas falha sem o dicionário de dados da empresa: com a tabela de referência no artefato passa 68% das tarefas, sem ele erra tudo — e com um dicionário parecido, mas desatualizado, erra tudo de novo, mostrando que acertar depende do conteúdo exato do artefato.","res":"Os experimentos validam o comportamento do protocolo de construção, não a qualidade das tarefas retidas para pós-treinamento, como os próprios autores admitem. O repositório é liberado só em parte, e a validação cobre quinze tarefas de calibração com uma única configuração de agente de fronteira."},{"p":"2608.30751","ach":"Em oito modelos abertos de texto e código, todos traduzem geometria especificada em palavras para código com confiabilidade, mas o desempenho em layout aberto varia muito. Trocar código procedural por SVG bruto melhora as notas de layout em todos os modelos, e sondas de ativação mostram que o modelo acompanha o estado geométrico durante a geração em vez de executar um plano fixo.","pn":"Separação entre tradução de geometria e composição de layout","pm":"Submeter o modelo a duas tarefas do mesmo domínio, uma com geometria totalmente especificada e outra aberta, isola a capacidade de raciocínio espacial 2D da mera habilidade de traduzir descrições em código.","imp":"Se você pede para um modelo gerar imagens ou diagramas via código, peça SVG direto em vez de código que desenha: o mesmo modelo pontua melhor só pela troca do meio. E ao avaliar candidatos para tarefas espaciais, teste layout aberto separadamente — a nota de tradução de código não prevê quem compõe bem a imagem.","ex":"Um sistema que gera diagramas a partir de descrições em linguagem natural usando um LLM para escrever scripts de plotagem: o paper indica que pedir o SVG bruto do diagrama produz melhor arranjo espacial do que pedir o script, porque o meio de saída muda o desempenho de layout.","res":"Os resultados valem para oito modelos abertos de texto e código e para imagens sintéticas do benchmark; não provam que a troca de meio generalize para qualquer domínio visual ou para modelos fechados. A parte de sondas de ativação exige acesso aos estados internos e serve como evidência, não como método que times de aplicação consigam repetir."},{"p":"2608.30949","ach":"O benchmark mostra que retrievers multimodais existentes sofrem de vies de perspectiva unica: retornam documentos alinhados a um so ponto de vista de consultas abertas. Sao 104.9K consultas do Stack Exchange com descricoes de perspectivas anotadas, cobrindo multiplos dominios e modalidades. O metodo SPIN melhora a cobertura e generaliza para benchmarks de busca aberta fora do conjunto de treino.","pn":"Avaliacao de cobertura de perspectivas em consultas abertas de busca","pm":"Consultas abertas recebem anotacoes de perspectivas implicitas, e a recuperacao e medida pela cobertura dessas perspectivas multiplas em vez da relevancia de um unico documento.","imp":"Se seu sistema de busca atende perguntas abertas (tipo 'vale a pena migrar para Kubernetes?'), nao valide so com relevancia tradicional: rode avaliacao de cobertura de perspectivas usando o dataset publico, e trate retriever que devolve apenas um lado da questao como falha de produto, nao como detalhe.","ex":"Um chatbot de suporte tecnico que recupera documentos do Stack Exchange para perguntas como 'devo usar microservicos?' tende a retornar apenas respostas favoraveis (ou apenas criticas), porque o retriever pontua similaridade sem considerar que a consulta tem lados opostos validos — o usuario recebe uma recomendacao enviesada sem saber que existe outro lado.","res":"O dataset vem de Stack Exchange, dominio de perguntas e respostas em ingles; cobertura de perspectivas em outros tipos de corpus ou idiomas nao esta provada. O ganho relatado do metodo de correcao exige treinar os vetores de ruido, o que nao faz parte do que o leitor adota so com o dataset."},{"p":"2608.31100","ach":"O benchmark avalia três formas de incorporar experiência em sete jogos de texto com verificadores executáveis. Resumos de experiência só superam histórico bruto quando a experiência se comprime em regras estratégicas reutilizáveis; treino de parâmetros traz ganhos grandes em algumas tarefas mas exibe transferência negativa severa em outras. Auto-melhoria não é automática nem uniforme entre pares modelo-tarefa.","pn":"Protocolo de diagnóstico de auto-melhoria de agentes com exploração e avaliação","pm":"Um benchmark interativo separa exploração permissiva de avaliação em tarefas held-out com verificadores executáveis, medindo três capacidades acopladas de agentes de linguagem: testar o próprio comportamento, julgar a experiência gerada e convertê-la em melhoria de decisão futura.","imp":"Antes de adicionar memória de resumos ou ajustar o agente com a própria experiência de execução, teste se a tarefa permite comprimir essa experiência em regras reutilizáveis; em tarefas que dependem de informação exata do estado atual, guardar histórico bruto costuma render mais do que resumir, e treinar com a experiência pode piorar outros casos.","ex":"Em jogos de texto que exigem escolher a ação certa conforme o estado exato do ambiente, comprimir episódios passados em resumos descarta detalhes contingentes do estado, e o agente com memória resumida erra onde o agente que consulta o histórico bruto acerta; no treino de parâmetros com essa experiência, o modelo melhora no jogo visto e regride em tarefa vizinha (transferência negativa).","res":"Os resultados vêm de sete jogos de texto; a regra 'resumo versus histórico bruto' depende da estrutura da tarefa e não foi estabelecida fora desse domínio. O benchmark diagnostica o processo, não prescreve a representação de experiência correta para cada caso."},{"p":"2608.31111","ach":"Agentes atuais completam loops de treino e edição de harness, mas os ganhos em pesos do modelo são esparsos e instáveis, e o melhor harness evoluído fica abaixo da referência engenheirada do Qwen-Agent. Os agentes frequentemente treinam com dados desalinhados da meta e confiam em autoavaliações estreitas, então ganhos locais não transferem para a avaliação oculta, e busca continuada pode apagar melhorias anteriores.","pn":"Avaliação oculta para evolução dirigida por meta vaga","pm":"O agente recebe apenas uma meta de capacidade em linguagem natural, decide sozinho dados, sinais de treino e validação, e é julgado depois em um conjunto de tarefas que nunca viu, expondo se os ganhos locais transferem.","imp":"Desconfie de ganhos medidos por autoavaliação do próprio agente: antes de aceitar que um loop de melhoria funcionou, valide contra um conjunto de testes que o agente nunca viu e que foi escrito por outra pessoa. Se você mantém pipelines de otimização automática de prompt ou harness, reserve uma parcela de tarefas fora do alcance do sistema para checar se a melhora local realmente se transfere.","ex":"Um agente que ajusta o próprio prompt para aumentar acerto num conjunto de validação que ele mesmo escolheu: o ASPIRE mostra que isso frequentemente treina com dados desalinhados da meta real, então a métrica local sobe enquanto o desempenho nas 520 tarefas ocultas de seis metas cai ou fica estagnado.","res":"O benchmark cobre seis metas e 520 itens autoriais, então os números não provam que a instabilidade de ganhos em pesos vale para qualquer meta ou domínio. E o resultado sobre práticas de autoevolução descreve uma capacidade que ainda não existe em produção — não invalida algo que o leitor já faça hoje."},{"p":"2609.01437","ach":"Harnesses gerados por LLMs ficam substancialmente atrás de referências humanas em código e em pesquisa, mas igualam ou superam as referências escolhidas em escrita e experimentação de ML. Os ganhos de evolução iterativa são instáveis e transferem-se apenas parcialmente para tarefas retidas. Com modelo de execução fixo, os ganhos dependem fortemente do modelo que roda o harness, indicando baixa transferência entre modelos.","pn":"Benchmark cuja unidade de avaliação é a infraestrutura de execução","pm":"Avalia-se o agente pelo sistema de execução que ele constrói e itera, medindo sucesso em benchmarks retidos e custo de tokens de execução, em vez de medir apenas saídas de tarefas em um harness fixo.","imp":"Antes de confiar em um harness auto-evoluído pelo próprio agente, você precisa revalidá-lo com o modelo que vai executá-lo em produção, porque o ganho medido com outro modelo não se transfere. E trate ganhos de evolução como instáveis: meça em tarefas retidas, não nas mesmas do loop de ajuste.","ex":"Um agente de código em produção cujo harness foi otimizado por iteração usando GPT-class como executor mostra queda de sucesso quando a empresa troca o modelo de execução por um concorrente mais barato: os ganhos estavam acoplados ao modelo original e não à infraestrutura.","res":"Os ganhos de evolução são parcialmente instáveis e a comparação em escrita e ML usa referências 'selecionadas', não necessariamente as melhores disponíveis, o que pode inflar o empate. O benchmark não prova que auto-evolução de harness seja inútil, apenas que a transferência atual é fraca."},{"p":"2609.01865","ach":"ExecRetrieval mede 23 configurações de embeddings densos mais BM25 em 939 tarefas Python com até quatro distratores defeituosos quase idênticos por tarefa. O melhor sistema hospedado atinge exec@10 de 1,00 mas exec@1 de apenas 0,331. Entre 91,5% e 99,4% dos erros de rank-1 são justamente as variantes com defeito, e em 67-78% das consultas a implementação correta pontua abaixo de ao menos um distrator.","pn":"Distratores quase-clone verificados por execução no pool de busca","pm":"Inserir no pool de recuperação variantes com defeito geradas por mutação única e validadas por execução torna possível medir se o rank do recuperador discrimina correção funcional em vez de similaridade superficial.","imp":"Não confie no rank-1 de busca vetorial de código para escolher qual snippet mostrar ao agente: a semelhança textual engana o modelo e a versão errada pode vir primeiro. Peça vários candidatos (top-10 resolve bem neste benchmark) e valide por execução ou testes antes de usar o código recuperado.","ex":"Em um agente de codificação com RAG que injeta no contexto o primeiro resultado da busca por embeddings, ao buscar uma função de validação de datas, o recuperador pode trazer primeiro uma variante com defeito que difere da correta por um único caractere de comparação, e o agente gera código com o mesmo bug sem perceber.","res":"Os resultados valem para tarefas Python curtas com mutação de edição única; não provam que o mesmo colapso ocorra em corpora grandes e heterogêneos, onde distratores tão próximos são mais raros. Exec@10 = 1,00 indica que o problema está na ordem de ranqueamento, não na ausência do candidato correto no pool."},{"p":"2609.01925","ach":"Em InfiniteBench, RULER e LongBench com duas famílias de modelos, o CRISP substitui o roteamento por divergência Jensen-Shannon por um proxy que mede massa de atenção em posições compatíveis com padrões estruturais, mantendo as mesmas decisões de roteamento. Remove o acúmulo de ruído O(n) dos limiares cumulativos pós-softmax. Resultado: até +28,0 pontos percentuais em tarefas de recuperação sobre baselines e speedup de atenção de até 5,30x com 512k tokens.","pn":"Leitura direta do roteamento a partir da estrutura do proxy de atenção","pm":"A decisão de roteamento de cabeças para padrões esparsos pode ser lida diretamente da estrutura do mapa de atenção do proxy, eliminando o custo de calcular uma divergência estatística como sinal de roteamento.","imp":"Se você opera atendimentos de contexto muito longo, este trabalho mostra que o custo de decidir quais partes da atenção esparsificar pode ser maior do que o ganho dela; ao negociar benchmarks ou kernels com fornecedores de inferência, cobre proxies estruturais diretos em vez de métricas estatísticas indiretas, pois medem a mesma coisa sem a etapa extra de cálculo.","ex":"Em um pipeline de análise de contratos com 500k tokens rodando em vLLM, o prefilling denso domina a latência e os métodos esparsos dinâmicos disponíveis perdem recuperação exata de cláusulas porque seus limiares cumulativos acumulam ruído de fundo conforme o contexto cresce; o mecanismo do CRISP ataca exatamente esse acúmulo, e é por isso que fornecedores de engine devem ser questionados sobre o roteador que usam.","res":"Nada disso é adotável sem modificar o kernel de atenção da engine de inferência; quem usa modelos via API ou engine pronta não ganha nada hoje. O abstract não menciona código aberto, e os ganhos foram medidos apenas em duas famílias de modelos em benchmarks de contexto longo, então a transferência para outras arquiteturas e cargas não está demonstrada."},{"p":"2609.02272","ach":"Substituir planos livres por especificações compiladas do paper eleva a fidelidade referenciada de 3,64 para 4,15 no Paper2CodeBench, um ganho relativo de 13,8%. Críticas de alta severidade caem de 13,2% para 6,1%. O ganho vem de preservar proveniência e restringir consistência entre arquivos.","pn":"Compilação de evidência do paper em especificações de repositório","pm":"A evidência extraída do paper é transformada em especificações explícitas no nível de repositório, com proveniência, requisitos de não-degradação, dependências entre arquivos e atribuição de responsabilidade, que restringem a geração de código sem eliminar escolhas locais de engenharia.","imp":"Quando um agente de código precisar implementar algo descrito em documento (paper, RFC, design doc), faça o agente primeiro gerir uma especificação estruturada com marcação de origem — o que o documento sustenta, o que foi inferido e o que ficou pendente — antes de gerar código. Isso reduz simplificações algorítmicas silenciosas.","ex":"Em geração de código a partir de papers de ML, agentes que recebem planos em texto livre comprimem ou reinterpretam detalhes do protocolo de avaliação, gerando repositórios que rodam mas calculam métricas de forma inconsistente entre arquivos; as especificações com dependências cruzadas explícitas impedem essa divergência.","res":"Os números vêm de um único benchmark (Paper2CodeBench), avaliado com LLM como juiz, cuja correlação com correção real do código não está estabelecida fora do próprio paper. Não há evidência do ganho em outros domínios de especificação, como RFCs de engenharia."},{"p":"2609.02737","ach":"Em 15 tarefas de contexto longo, em zero-shot, o protocolo reduziu em 52,0% e 31,1% os tokens atendidos durante a decodificação em dois modelos comerciais, com quedas de acurácia de 1,27pp e 2,75pp que diminuem com a escala do modelo. O mecanismo é parsear declarações do próprio modelo no raciocínio como se fossem chamadas de ferramenta e pular a leitura do cache de atenção nos modos foco e local. Não há treino: os modelos são usados como vêm.","pn":"Atenção declarada por marcas no raciocínio","pm":"O modelo declara no próprio raciocínio em qual modo de atenção está — contexto total, região específica ou saída recente — e o motor de inferência interpreta essas declarações como chamadas de ferramenta, pulando a leitura da maior parte do cache de chaves e valores.","imp":"Você pode cortar o custo de contextos longos conversando com o modelo em vez de trocar de engine: instrua-o a marcar no raciocínio quando precisa de tudo, de um trecho ou só do que acabou de dizer, e faça o seu serviço de inferência interpretar essas marcas para pular a leitura do cache nos trechos dispensados. Em um assistente com conversas de milhões de tokens, isso reduz o custo por resposta sem trocar de modelo nem retreinar nada.","ex":"Um assistente interno com histórico de conversa de 1 milhão de tokens recebe uma pergunta sobre um detalhe dito no início. Hoje, cada token gerado varre o cache inteiro. Com o protocolo, o modelo declara modo foco na região do detalhe, o parser limita a leitura do cache a essa região e as camadas globais deixam de processar o restante do histórico, cortando mais da metade dos tokens atendidos.","res":"A queda de acurácia é modesta mas real, medida em benchmarks de contexto longo — não prova o comportamento em tráfego de produção com instruções ambíguas. O ganho depende de o modelo declarar os modos de forma confiável em zero-shot, e os autores próprios apontam que métodos com treino teriam potencial maior; a marcação falha em modelos menores."},{"p":"2609.02749","ach":"Com backbone, harness e orçamento de execução fixos, o agente com skills destiladas de 1.000 repositórios ML supera o mesmo agente sem skills em 134,3% no MLE-bench, 34,4% no PaperBench, 9,2% no FrontierCS e 14,0% no PassNet. A biblioteca tem mais de 5.000 skills de 20 áreas e 178 famílias de capacidade. Os ganhos vêm só do contexto operacional adicionado.","pn":"Destilação de repositórios em biblioteca de skills verificadas e reutilizáveis","pm":"Repositórios populares são condensados em skills compactas e verificadas, por via task-agnostic e task-oriented, e carregadas pelo agente durante a tarefa em vez de redescobertas a cada execução.","imp":"Antes de escrever prompts gigantes com know-how de domínio em cada tarefa, construa um pipeline que extraia esse conhecimento dos repositórios que seu time já usa, verifique e compacte em unidades reutilizáveis, e injete só a skill que a tarefa pede.","ex":"Um agente de codificação que refaz fine-tuning de modelo a cada execução carrega o repositório inteiro do Hugging Face e estoura o contexto ou erra a ordem das etapas; com uma skill verificada de 'como submeter ao MLE-bench', a sequência de comandos já testada é carregada direto.","res":"Os ganhos foram medidos em agentes de pesquisa ML com um backbone específico e um harness fixo; não prova que skills destiladas de repositórios de outro domínio (ex.: infraestrutura web) rendam o mesmo, nem que a destilação task-agnostic seja melhor que só a task-oriented. Verificação de skills não elimina skills erradas que passam."},{"p":"2609.02783","ach":"Em três benchmarks de agentes (SWE-bench Verified, TerminalBench, Toolathlon), interromper execuções cujo resultado já é previsível eliminou 13% a 26% dos passos e até 44,1% dos tokens de entrada, com acurácia de predição de 89% a 97%. As taxas de resolução por agente mudaram em média apenas um a dois pontos percentuais. O custo por tarefa — não apenas o número de tarefas — é o que cai.","pn":"Predição calibrada de resultado para interrupção antecipada de execuções de agem","pm":"Classificadores de sucesso e falha treinados sobre comportamento intermediário da execução interrompem a avaliação no momento em que um deles cruza um limiar de confiança calibrado, sem esperar o fim do episódio.","imp":"Você pode cortar a conta de avaliar agentes sem reduzir o conjunto de tarefas: rode os classificadores de resultado sobre o comportamento parcial e aborte a execução quando o veredito já estiver claro. Isso muda o cálculo de custo do seu ciclo de desenvolvimento iterativo, que hoje paga o episódio inteiro mesmo quando ele já era previsível.","ex":"Num agente de correção de bugs avaliado no SWE-bench Verified, uma sessão que já acumulou dezenas de passos sem editar arquivo algum e com o classificador de falha acima do limiar é encerrada antes de gastar os tokens restantes da tentativa — exatamente os episódios mais caros e mais previsíveis.","res":"O ganho depende de o resultado ser evidente cedo; execuções equilibradas rodam até o fim, e o corte de 13%–26% de passos é bem menor que o de tokens de saída. A mudança de um a dois pontos na taxa de resolução é média, não garantia por agente — para comparações finas entre versões, o ruído introduzido pode importar mais que a economia."},{"p":"2609.00519","ach":"O paper codifica resultados reportados de safeguards e mostra que a evidência é fortemente assimétrica: um único ataque que obtém ajuda nociva do serviço em produção basta para provar que ela existe, mas concluir que pouco resta exige evidência sobre o sistema ao redor, presente em apenas uma pequena minoria das alegações codificadas. Melhorar a taxa local de recusa ou de ataque não implica, por si só, sistema mais seguro.","pn":"","pm":"","imp":"Pare de reportar só a taxa de recusa ou de ataque do seu filtro; antes de declarar que um safeguard melhorou a segurança, teste o que um atacante persistente ainda consegue extrair do sistema inteiro, não só do filtro.","ex":"Um serviço de chat com filtro de jailbreak que passa de 5% para 1% de ataques bloqueados: se o atacante contorna o filtro e usa a ferramenta de busca do agente para obter o mesmo conteúdo, o risco residual de deployment não caiu, embora a métrica local tenha melhorado.","res":"O paper não entrega instrumento nem benchmark pronto: é um critério de interpretação de evidência, e aplicá-lo exige desenhar os próprios testes de ataque adaptativo contra o sistema completo. Ele também não quantifica quão comum é a falha além do registro codificado analisado."},{"p":"2608.26623","ach":"Em 3.808 instâncias de chamadas de ferramentas sobre DAGs de workflow, o alinhamento dos juízes com referência programática cai monotonicamente com a dificuldade da tarefa, 1,5x mais rápido sem gabarito. Em consultas difíceis sem gabarito, todos os seis juízes, de 20B a fronteira, ficam numa faixa de 77–82%. Expor o gabarito reduziu o alinhamento de GPT-5.4 em 1,5 ponto e de Gemini-2.5-Pro em 3,9 pontos, e rubricas estruturadas melhoraram o alinhamento em até 6,5 pontos.","pn":"Teto de confiabilidade de juízes LLM em workflows com dependências","pm":"O alinhamento de juízes baseados em modelo de linguagem degrada com a dificuldade estrutural da tarefa avaliada, converge para um teto estreito independente da escala do juiz em tarefas difíceis sem gabarito, e a exposição ao gabarito pode reduzir o alinhamento por ancoragem excessiva.","imp":"Se você usa um modelo como juiz para aprovar saídas de agentes que chamam ferramentas, não presuma que um modelo maior julga melhor: em tarefas difíceis todos esbarram no mesmo teto. Teste o juiz com e sem o gabarito — dar a resposta correta pode piorar o julgamento por ancoragem — e prefira rubricas estruturadas com critérios explícitos em vez de pedir apenas uma nota com raciocínio livre.","ex":"Num pipeline de atendimento que encadeia busca, consulta a banco e emissão de reembolso, um juiz GPT de fronteira e um juiz de 20B erram na mesma proporção ao avaliar chamadas com dependências entre etapas sem gabarito; pior, quando o gabarito é mostrado ao juiz, ele ancora na resposta esperada e deixa passar desvios reais na ordem das chamadas.","res":"O ganho das rubricas estruturadas não generaliza uniformemente entre todos os pares juiz-gerador, então o ganho de 6,5 pontos não é garantido em qualquer combinação; raciocínio estendido e temperatura do juiz não ajudaram. O teto foi medido em chamadas de ferramentas sobre DAGs, não em avaliação de texto aberto, e a altura do teto depende parcialmente do prompt para geradores fracos."},{"p":"2608.27831","ach":"Pedidos realistas reduzem as taxas de resolução em 6,4 pontos percentuais em média e podem alterar o ranking de sete modelos avaliados. Incluir Desired Behavior e Motivation afeta significativamente o desempenho, enquanto Environment Information e Reproduction Steps apenas adicionam tokens sem benefício mensurável. O estilo linguístico tem efeito pequeno e dependente do modelo.","pn":"Avaliação de agentes de código com variantes de pedido realista","pm":"Famílias de tarefas derivadas de um benchmark compartilham o mesmo gold patch e variam apenas a composição de informação e o estilo linguístico do pedido, isolando o efeito desses fatores sobre a taxa de resolução.","imp":"Ao escrever prompts para agentes de codificação, declare explicitamente o comportamento desejado e a motivação da mudança — a maioria dos pedidos reais omite isso e perde desempenho. Ao comparar modelos por ranking de benchmark, desconfie: a ordem pode mudar com pedidos curtos e informais como os que chegam em produção.","ex":"Um time avalia agentes de código no SWE-bench e escolhe o modelo A pelo ranking. Em produção, os usuários mandam pedidos curtos sem contexto estruturado, e o modelo B — pior no benchmark — resolve mais tarefas, porque a lacuna entre problema formal e pedido real penaliza os modelos de forma diferente.","res":"Os números vêm de variantes derivadas do SWE-bench Verified e Pro, não de pedidos reais executados em produção; a taxonomia de seis categorias e quatro dimensões de estilo é uma aproximação. O efeito de estilo é pequeno e varia por modelo, então não generalize a sensibilidade a estilo para todos os modelos."},{"p":"2608.31082","ach":"No FanOutQA estendido com uma pergunta relacionada por questão de teste, o cracking corta o custo em 53% mantendo a acurácia. Responder sobre uma base pré-estruturada ideal é 28 vezes mais barato, e a lacuna cresce com o fan-out das questões. Com o tempo, mais consultas são respondidas sem abrir documentos.","pn":"Estruturação especulativa de dados como subproduto da inferência do agente","pm":"Um sub-agente derivado do contexto já carregado extrai, ao abrir cada documento, estrutura fundamentalada em texto bruto, acumulando um repositório que passa a responder consultas futuras sem reabrir o documento.","imp":"Se seus agentes reabrem os mesmos PDFs e páginas para questões parecidas, você pode adicionar uma etapa que, cada vez que um documento é aberto, extrai e persiste a estrutura relevante — o custo extra por consulta é pequeno porque aproveita o contexto já pago.","ex":"Um agente de due diligence que responde perguntas sobre contratos e filings reabre PDFs longos a cada consulta, gastando centenas de milhares de tokens para reunir evidência espalhada; com a estruturação especulativa, as perguntas seguintes sobre os mesmos contratos viram consultas baratas sobre o registro estruturado acumulado.","res":"O ganho de 53% foi medido no FanOutQA com apenas uma questão relacionada por questão de teste, o que favorece o método; workloads com baixa sobreposição entre consultas terão cobertura estrutural menor e economia menor. A base pré-estruturada ideal que mostra 28x é um limite teórico, não um resultado obtido pelo sistema."},{"p":"2609.01836","ach":"Em EAL-Bench, escritores de memória criaram autoridade falsa em até 50,2% dos pedidos não autorizados sob atualizações incrementais, e executores agiram sobre ela em 98,6% dos testes. As salvaguardas testadas — exigir evento-fonte válido e event sourcing limitado — reduzem a lavagem, mas rejeitam mais ações legítimas.","pn":"Memória persistente como política de autorização efetiva","pm":"Escritores de memória introduzem permissões sem lastro nos eventos de origem, e a provenance perdida faz executores agir como se a autoridade fosse legítima.","imp":"Trate o que está na memória do seu agente como parte da política de permissões, não como cache de contexto: audite cada permissão persistida contra o evento que a originou e monitore entradas de autorização que aparecem sem registro de origem.","ex":"Um agente de procurement com memória persistente acumula atualizações de permissão ao longo de semanas; uma escrita incremental registra que o agente pode aprovar compras acima do limite, sem evento de aprovação humana de origem, e o executor processa a compra irregular porque a provenance da permissão se perdeu.","res":"As salvaguardas propostas reduzem a lavagem mas aumentam a rejeição de ações legítimas, então o tradeoff segurança-utilidade não está resolvido. Os números vêm do próprio benchmark em três domínios, e a taxa de executores pode variar com prompts e políticas do executor fora do cenário testado."},{"p":"2608.30391","ach":"Em seis conjuntos de trajetórias, os codebooks gerados recuperam 73% a 91% dos modos de falha presentes em taxonomias anotadas por humanos e ainda revelam padrões que essas taxonomias não capturam. Usado como espaço de features dedutivo, o codebook supera baselines zero-shot e few-shot na predição de falhas. O processo mantém trilha auditável dos dados à teoria.","pn":"Codificação qualitativa iterativa com critério de saturação aplicada a trajetóri","pm":"Um pipeline multiagente executa ciclos de codificação aberta, axial e teórica sobre trajetórias de agentes, parando quando novas categorias deixam de emergir, e o codebook resultante vira espaço de features para prever falhas.","imp":"Quando um agente seu falha em tarefas longas e você não sabe classificar os erros, substitua a criação manual de categorias por rodadas de rotulagem que se corrigem até nenhuma categoria nova aparecer; depois use as categorias como rótulos de entrada para um detector de falhas.","ex":"Um agente de atendimento que encerra conversas sem resolver o chamado: em vez de listar à mão os tipos de falha, o pipeline lê milhares de trajetórias, deriva categorias como 'pergunta respondida antes do usuário confirmar' e essas categorias alimentam um classificador que sinaliza falhas em execuções novas.","res":"Os números vêm de comparação com taxonomias humanas já existentes; em domínios sem anotação de referência não há garantia de que 73-91% se repita. Saturação com LLMs pode parar cedo demais se o modelo de codificação compartilhar vieses do gerador das trajetórias, e não há código aberto confirmado."},{"p":"2609.03293","ach":"Modelos existentes falham em identificar fatos pessoais que conflitam com pedidos do usuario quando esses fatos nao aparecem explicitamente no prompt e precisam ser recuperados de uma base de conhecimento. O dataset pareia pedidos com personas e fatos egocentricos, e o pipeline multiagente supera as abordagens atuais tanto na qualidade da recuperacao de evidencia quanto na decisao de conflito.","pn":"Pipeline multiagente de recuperacao de conflito latente","pm":"Agentes especializados coordenam tres etapas — reformulacao da consulta do usuario, travessia multi-hop em um grafo de conhecimento egocentrico e filtragem sensivel a conflito — para trazer a superficie evidencia latente que torna um pedido aparentemente razoavel inapropriado.","imp":"Se o seu assistente personalizado executa tudo que o usuario pede, considere adicionar uma etapa de checagem que busque ativamente fatos do perfil que contradigam o pedido antes de responde-lo — e organize essa busca como etapas separadas de reformular a pergunta, navegar a base e filtrar por conflito, em vez de confiar numa unica busca por similaridade.","ex":"Um usuario com registro de alergia na base de conhecimento pede ao assistente uma lista de receitas; a busca por similaridade nao traz o fato da alergia porque o pedido nao menciona alergia, e o assistente responde com receitas que contêm o alergeno. O pipeline com travessia multi-hop parte do pedido, identifica a entidade usuario, percorre os fatos ligados a ela e intercepta o conflito antes da resposta.","res":"Os ganhos foram medidos no proprio dataset dos autores, cujos fatos egocentricos sao bem definidos e estruturados; em bases de conhecimento reais, ruidosas e incompletas, a travessia multi-hop pode nao encontrar a evidencia decisiva. Nada e dito sobre conflitos que exigem julgamento ambiguo em vez de um fato recuperavel."},{"p":"2609.03430","ach":"Em quatro modelos e seis tarefas de raciocínio, evicção uniforme aleatória dentro de cada cabeça de atenção, mantendo o prompt, iguala o melhor método seletivo de compressão de KV cache e serve 32–43% mais throughput em vLLM. Experimentos controlados mostram que o sinal de seleção dos métodos pontuadores quase não contribui: a maior parte da diferença é só se a seleção manteve o prompt. O traço de raciocínio se protege por redundância no texto e entre cabeças.","pn":"Evicção aleatória de KV cache com prompt preservado","pm":"Em vez de pontuar tokens por importância futura, o cache mantém o prompt intacto e descarta tokens do raciocínio por sorteio uniforme dentro de cada cabeça de atenção, porque o traço de raciocínio se protege por redundância no texto e entre cabeças.","imp":"Troque seu compressor de KV cache baseado em scores (por exemplo, H2O ou SnapKV) por manutenção do prompt mais descarte aleatório: você ganha throughput sem perda de acurácia em tarefas de raciocínio e elimina o custo de calcular e ordenar pontuações de importância a cada passo.","ex":"Um serviço de chat que roda um modelo de raciocínio longo em vLLM com H2O sofre degradação quando opressor o prompt do sistema é parcialmente evitado, e paga custo de scoring por passo; com Random Attention o prompt fica íntegro e o sorteio uniforme retém cópias suficientes dos tokens que o modelo ainda precisa, elevando o throughput em 32–43%.","res":"A evidência cobre tarefas de raciocínio longo, onde a redundância do traço protege a evicção aleatória; em geração curta, sumarização ou tarefas sem traço auto-reduntante, o sorteio uniforme não tem essa garantia e a comparação com seleção por score pode mudar. Não prova que todo sinal de seleção é inútil, apenas que ele contribui pouco nesse regime."},{"p":"2609.04098","ach":"Quantizar para 4-bit NVFP4 todas as 496 camadas lineares de um híbrido 27B, incluindo as recorrentes Gated DeltaNet, mantém o desempenho em BF16 (média de 5 benchmarks -0,52), com 17,5 GiB e prefill 14-19% mais rápido. O estudo mecânico mostra que os gates considerados frágeis comprimem ~11% de erro de GEMM em ~2% de erro de saída, e a recorrência delta-rule mantém ruído injetado em patamar plano por 32K tokens.","pn":"Quantização 4-bit integral da metade recorrente em LLMs híbridos","pm":"A quantização NVFP4 W4A4 aplicada também às camadas lineares recorrentes se sustenta porque o escalonamento por blocos de 16 elementos localiza outliers e a regra delta sobrescreve o estado a cada escrita, impedindo que erros de quantização se acumulem ao longo do contexto.","imp":"Na hora de quantizar um LLM híbrido com camadas lineares recorrentes, você pode deixar tudo em 4-bit em vez de preservar essas camadas em 8 ou 16 bits: isso reduz memória e acelera o prefill sem perda mensurável. Basta embarcar as escalas do KV-cache em FP8 calibrado no deploy.","ex":"Comunidades que publicaram versões 4-bit do Qwen3.8-27B deixaram o bloco GDN em 8/16 bits por medo de acúmulo de erro na recorrência; o paper mostra que esse cuidado era desnecessário — o gap de perplexidade a 32K até encolhe com a posição, porque cada escrita da delta-rule sobrescreve o estado na direção da chave atual.","res":"A validação cobre um único modelo híbrido de 27B com Gated DeltaNet e a suite NVFP4; a robustez da regra delta não garante o mesmo resultado para outras recorrências lineares nem para arquiteturas sem escalonamento por blocos de 16 elementos. O custo por token de quantização some com o contexto, mas não em contextos curtos."},{"p":"2608.21832","ach":"Dezenove modelos de visão-linguagem alcançam no máximo 32% de acurácia estrita ponto-dentro-da-caixa no benchmark de 994 itens. Em 60–92% dos itens a predição cai fora das duas regiões candidatas, e condicionada a cair em uma candidata, a seleção do alvo chega a 0,82–0,90 para relações horizontais, verticais, proximidade e ordem, mas fica em torno de 0,50 para contenção e oclusão. Marcar as candidatas eleva a seleção em 35–57 pontos percentuais.","pn":"Diagnóstico contrastivo que separa localização de compreensão relacional","pm":"Pares de instruções mantêm a captura de tela e o elemento âncora fixos e variam apenas a expressão relacional, e cada predição de coordenada é classificada pela região candidata em que cai, decompondo a acurácia em falha de localização versus falha de entendimento da relação.","imp":"Antes de trocar de modelo porque o agente clica no elemento errado, rode este tipo de teste para descobrir se o problema é o modelo não achar o elemento na tela ou não entender a instrução — o conserto é outro em cada caso. Se a coordenada sai de qualquer região plausível, invista em melhorar a localização, não no prompt da relação espacial.","ex":"Um agente de computador recebe 'clique no botão abaixo do campo de busca' e emite uma coordenada que não cai nem no botão alvo nem no distrator desenhado no mesmo screenshot: a falha é de localização do candidato, não de interpretação de 'abaixo', e o diagnóstico por região candidata evidencia isso sem retreino.","res":"Marcar as duas candidatas é diagnóstico oráculo, não método implantável — os 35–57 pontos não se transferem para produção. A correlação com ScreenSpot-Pro (ρ=+0,74) é exploratória com dez modelos. O benchmark cobre sete relações espaciais em interfaces gráficas e não prova o padrão fora desse domínio."},{"p":"2608.19269","ach":"Ao congelar uma coleção grande de avaliações e tentar reproduzir as claims históricas, a maioria das unidades de replay não se completa porque a evidência necessária não está vinculada ao resultado. Nas claims em que o replay é possível, a estabilidade varia conforme a resolução exigida: um número solto se reproduz com mais facilidade do que uma comparação entre sistemas. O paper torna essa etapa de inferência, antes implícita, explícita e executável.","pn":"Replay de claims de avaliação com evidência vinculada a commits","pm":"Congela-se uma coleção de avaliações, vincula-se cada claim histórica ao commit e à evidência necessária para reproduzi-la, e executa-se o replay para verificar quais claims permanecem estáveis e em qual resolução.","imp":"Antes de citar um número de benchmark em uma decisão, você pode checar se consegue reproduzi-lo a partir do estado registrado do código e dos dados; se não consegue, trate o número como não verificável. Na prática, isso muda como você documenta suas próprias avaliações: vincule cada resultado ao commit e à configuração que o gerou, para que a claim continue defendível depois.","ex":"Um time de plataforma usa a pontuação de um benchmark público em um relatório de escolha de modelo. Meses depois, o repositório do benchmark mudou de prompt, de parser ou de versão de dataset, e o número antigo não pode mais ser reproduzido — a comparação entre modelos citada na decisão fica sem evidência. Com replay vinculado a commits, o replay falharia de forma explícita em vez de silenciosa.","res":"O resultado vem de um censo sobre uma coleção específica de avaliações; a proporção de claims não-reproduzíveis não se transfere automaticamente para outras coleções. E replay estável em resolução baixa (o número solto) não garante que a interpretação da claim original continue válida — estabilidade de reprodução não é estabilidade de significado."},{"p":"2608.29613","ach":"Vetores de função extraídos de uma língua-fonte melhoram substancialmente o reconhecimento multilíngue de emoções em cenários zero-shot, limpos e perturbados, indicando que capturam sinais de tarefa independentes da língua. O paper também mostra que cada LLM tem uma faixa estável de cabeças de atenção ótimas para construir os vetores, consistente entre línguas. Os vetores replicam parcialmente o efeito de few-shot em-context com custo de inferência menor.","pn":"Vetores de função extraídos em uma língua direcionam a tarefa em outra língua","pm":"Uma direção latente de tarefa, extraída das ativações durante demonstrações em-contexto em uma língua-fonte, é injetada nas ativações do modelo em inferência zero-shot e transfere o comportamento da tarefa para línguas-alvo sem repetir demonstrações.","imp":"Se você controla o modelo por baixo da API, pode substituir algumas execuções com exemplos no prompt por uma única injeção de vetor latente, cortando tokens de demonstração em cargas multilíngues. Se você consome modelo via API fechada, nada disso é aplicável — o mecanismo mora nas ativações, que você não enxerga.","ex":"Um classificador de emoções em atendimento multilíngue que hoje envia 5 demonstrações rotuladas no prompt para cada chamada em espanhol, francês e alemão: com vetores extraídos das ativações em inglês, o mesmo direcionamento de tarefa é obtido injetando a direção latente, sem as demonstrações — mas só em modelo servido com acesso a hooks de ativação.","res":"O ganho é medido em uma tarefa só, reconhecimento de emoções multirrótulo, e a transferência é parcial em relação ao few-shot completo — não prova que o mecanismo generalize para tarefas semânticas mais complexas. A adoção exige acesso a ativações e escolha da faixa de cabeças de atenção por modelo, o que restringe o uso a quem opera o modelo internamente."},{"p":"2608.29098","ach":"O paper libera um dataset de 1,5M instâncias com rótulos de risco em cinco níveis para imagem, pedido e resposta, mais um benchmark de 5.000 casos e modelos guard abertos. O modelo de 8B supera o estado anterior da arte em cerca de 4% de F1 e generaliza para benchmarks cujos dados de treino nunca viu.","pn":"Moderação de segurança multimodal com escala ordinal de cinco níveis","pm":"A moderação separa o julgamento de risco em três alvos distintos (conteúdo da imagem, pedido do usuário e resposta do assistente) e substitui a decisão binária por uma escala ordinal de cinco níveis, com uma cabeça ordinal que também produz um escore contínuo de risco.","imp":"Se seu pipeline de moderação decide apenas 'bloquear ou liberar', você pode trocar por um guard pronto que dá um nível de risco de 1 a 5 e um escore contínuo, permitindo ações graduais: degradar resposta, pedir reformulação ou escalar para revisão humana em vez de cortar tudo.","ex":"Um chatbot com upload de imagens recebe um pedido ambíguo com imagem de arma de brinquedo: um moderador binário bloqueia ou libera; um guard ordinal marca risco 2 na imagem, risco 4 no pedido e risco 1 na resposta, e o sistema responde com aviso em vez de banir o usuário.","res":"Os rótulos vêm de anotação com desacordo consciente entre anotadores, e parte dos dados é sintética; a calibração do escore contínuo em domínios fora das 15 categorias de dano não é garantida. Avalie no seu próprio tráfego antes de confiar nos níveis intermediários."},{"p":"2609.00834","ach":"Substituir os dois objetivos principais de fine-tuning de um seletor listwise por estratégias de inferência — recuperação de memórias estruturadas e agregação de rankings sobre permutações — melhora a precisão da seleção: em BIRD-dev, supera o método state-of-the-art anterior em 2,02 pontos de execution accuracy com os mesmos candidatos e 2,92x menos tokens, sem treinar nada.","pn":"Seleção listwise sem fine-tuning via memórias estruturadas recuperadas","pm":"Critérios de seleção de consultas candidatas são armazenados como memórias estruturadas destiladas de dados de treino e recuperadas no tempo de inferência, substituindo objetivos de fine-tuning, enquanto o viés de posição é reduzido agregando rankings sobre múltiplas permutações da lista de candidatos.","imp":"Se você tem um pipeline que gera várias consultas SQL e elege a melhor, dá para melhorar a escolha sem treinar um seletor: guarde exemplos destilados de como perguntas mapeiam para o esquema do banco e use-os como critério explícito na hora de comparar candidatos, e compare os candidatos em ordens diferentes para cancelar o viés de posição do modelo.","ex":"Em um chatbot de dados internos sobre um banco de vendas, o gerador produz cinco SQLs plausíveis e o seletor costuma escolher a primeira por viés de posição; recuperando memórias que dizem como 'por região no último trimestre' mapeia para as colunas e filtros certos, e agregando rankings das cinco ordens possíveis, a consulta executável correta passa a ser escolhida com mais estabilidade e menos chamadas ao modelo.","res":"As memórias precisam ser destiladas de pares pergunta-consulta de treino; em domínios sem dados anotados do seu esquema, essa etapa vira o gargalo. Os números vêm de benchmarks públicos (BIRD-dev) com os mesmos conjuntos de candidatos de métodos anteriores, não de cargas de produção, e o ganho médio de 2,02 pontos esconde variância entre consultas."},{"p":"2609.04242","ach":"Em comparações pareadas com modelos omni nativos em 56 benchmarks e 21 idiomas, o framework sem treino foi competitivo em compreensão áudio-visual e melhorou o desempenho médio em áudio puro em todas as cinco configurações testadas. Congelar o backbone preservou, em geral, desempenho superior em imagem, vídeo, código, matemática e QA médico em relação aos checkpoints omni nativos.","pn":"Roteamento de transcrições de fala para VLM congelado","pm":"Transcrições com marcação de tempo e filtradas por confiança, extraídas por um reconhecedor de fala, são injetadas na interface de linguagem de um modelo visão-linguagem congelado, mantendo o caminho visual intacto e sem treino nem realinhamento multimodal.","imp":"Você pode adicionar compreensão de fala ao seu modelo visão-linguagem de produção apenas acoplando um reconhecedor de fala e roteando transcrições na entrada de texto, sem retreinar nada e sem degradar as capacidades visuais e de raciocínio que o modelo já tem.","ex":"Um assistente que analisa gravações de reuniões com slides: em vez de migrar para um modelo omni treinado, o pipeline transcreve o áudio com timestamps, filtra trechos de baixa confiança e concatena as transcrições ao prompt visual, mantendo o mesmo backbone e evitando a perda de capacidade de leitura de gráficos que os modelos omni nativos costumam sofrer.","res":"Os ganhos valem para fala centrada em texto transcrito; cenários onde paralinguagem importa (tom, emoção, sobreposição de falantes) podem exigir representações acústicas mais ricas, e o próprio paper reconhece que há casos em que codificadores de áudio dedicados seguem necessários. A comparação é com checkpoints omni específicos, não com todos os modelos do mercado."},{"p":"2609.04523","ach":"O sistema gera kernels para TPU que igualam baselines ajustados manualmente por especialistas em 50 tarefas do JaxBench e em workloads reais de modelos open-source. Três paradigmas (colaborativo, autônomo e busca em grafo) compartilham o mesmo pool de sub-agentes. O código foi aberto publicamente.","pn":"Loop agêntico de otimização de kernels guiado por métricas e traços de hardware","pm":"Um conjunto de sub-agentes especializados (planejamento, implementação, depuração, testes, profiling) itera sobre código de kernel usando feedback do compilador e traços de hardware em tempo real, com variantes colaborativa, autônoma e de busca em grafo.","imp":"Se você precisa de kernels customizados para aceleradores e não tem especialista em hardware na equipe, pode usar ou adaptar o sistema aberto para gerar e otimizar essas implementações automaticamente, em vez de escrever à mão ou terceirizar.","ex":"Um time que serve um modelo open-source em TPUs e identifica uma operação lenta no perfil de inferência pode acionar o agente autônomo para gerar um kernel otimizado para essa operação, usando os traços de hardware como sinal de otimização em vez de contratar engenharia de kernels.","res":"Os resultados são específicos para TPUs e para o JaxBench; a transferência para GPUs ou outros aceleradores não é demonstrada. O paradigma autônomo depende de profiling de hardware confiável, e kernels gerados automaticamente exigem validação de correção antes de entrar em produção."},{"p":"2609.04611","ach":"Em 53 tarefas em quatro dominios, a melhor configuracao (Claude Opus 5 com Claude Code) passa em apenas 23,9% das simulacoes de avaliacao, contra 82,2% de um teto escrito por especialistas. As falhas incluem consultas superficiais aos registros, comunicacao quase nula com o cliente e pouca experimentacao com arquitetura e custo de serving.","pn":"Avaliacao de construcao de agente ponta a ponta","pm":"Um agente desenvolvedor recebe registros reais de negocio, requisitos de um cliente, API de producao e orcamento de serving, e a nota vem de implantar o agente entregue contra usuarios simulados reservados.","imp":"Se voce usa agentes de codificacao para construir agentes de producao, nao trate a primeira versao que roda como pronta: o dado mostra que ela falha na maioria dos cenarios de avaliacao, entao vale exigir testes contra usuarios simulados antes de implantar.","ex":"Um agente de atendimento de companhia aerea construido por agente de codificacao responde consultas rasas ao banco de reservas em vez de cruzar historico do cliente e regras da politica, e o cliente descobre a falha so quando o usuario simulado contesta um reembolso.","res":"Os numeros valem para usuarios simulados e quatro dominios de atendimento; nao provam que a lacuna se repete em outros tipos de tarefa nem que o teto de especialistas e alcancavel. O benchmark mede, mas nao entrega correcao para as falhas observadas."},{"p":"2609.04173","ach":"O benchmark reúne LTBv1, um dataset aberto de textos, imagens, áudio e vídeos escritos por humanos e revisados por pares, selecionados porque quebram modelos de tradução de ponta. Cada exemplo vem com regras de verificação manuais que descrevem falhas concretas, permitindo avaliação automática confiável, acionável e resistente a reward-hacking das métricas tradicionais.","pn":"Exemplos adversários revisados por pares com regras de verificação manuais por","pm":"Cada caso de avaliação é um exemplo multimodal revisad
