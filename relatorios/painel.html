m juiz por LLM. Nem escala, preço ou gasto de tokens prevê o ranking, que só se estabiliza no fim do horizonte. O que separa os modelos é comportamento gerencial: os melhores cortam investimento de retorno lento perto do fim, mantêm caixa investida e abrem renovações de contrato cedo, enquanto a memória autogerida falha em dois modos opostos (arquivo que só cresce ou plano reescrito toda temporada).","pn":"Simulação determinística de horizonte longo com âncora roteirizada","pm":"Um ambiente de gerenciamento com engine determinístico acumula as consequências de centenas de decisões em um único score final, sem juiz por LLM, e uma âncora roteirizada compartilhada permite comparação direta entre agentes no mesmo mundo.","imp":"Antes de confiar um fluxo de decisão acumulativa a um agente, rode-o num ambiente com consequences cumulativas e score objetivo em vez de avaliar por tarefas isoladas — e monitore comportamentos específicos como manter caixa parada ou adiar decisões com prazo, não o gasto de tokens, que não indicou desempenho aqui.","ex":"Um agente que negocia contratos e renovações com prazos reais: os modelos de pior score deixavam as renovações chegar perto do prazo e perdiam jogadores ou pagavam mais caro — a mesma falha de um agente de compras que adia renegociações de contrato de fornecedor até o limite, acumulando custo em cada ciclo.","res":"Os achados vêm de um único domínio simulado (gerenciamento de futebol) com mundo roteirizado congelado na pista solo; a transferência dos comportamentos gerenciais identificados para ambientes de produção reais não é demonstrada. A memória autogerida falhou nos formatos testados, mas o paper não valida um desenho de memória que funcione."},{"p":"2608.18565","ach":"Em 117 tarefas independentes, o harness atinge 72,6% de pass rate verificado médio, o mais alto entre sete modelos. Na trilha de projeto real (65 tarefas), é o melhor em compilação integrada, comportamento estático e dinâmico. A separação principal aparece no comportamento dinâmico: 52,2 contra 22,4–31,4 dos baselines, enquanto os escores estáticos ficam a menos de 10 pontos uns dos outros.","pn":"Conclusão de tarefa de agente liberada por verificações externas registradas","pm":"O agente só declara tarefa completa quando checagens externas registradas — especificação, compilação e execução em runtime real — confirmam o resultado, substituindo a autoavaliação do modelo como critério de parada.","imp":"Troque o critério de parada do seu agente de código: em vez de confiar no julgamento do modelo sobre o próprio output, exija que checagens externas — compilação, testes, execução — passem e fiquem registradas antes de encerrar a tarefa. E desconfie de métricas estáticas: avalie seus agentes comparando comportamento executado, não apenas código que parece certo.","ex":"Em controladores lógicos programáveis de chão de fábrica, lógica gerada que compila e passa em checagem estática ainda falha ao rodar: os baselines marcam 22–31% em comportamento dinâmico contra 52% do harness com gate de verificação, porque traços executados no runtime real divergem do que a análise estática aprova.","res":"Os resultados valem para geração de código PLC com runtime executável e checável disponível; domínios sem compilador ou runtime de referência não oferecem o gate externo. O ganho dinâmico foi medido em uma trilha de 65 tarefas de um único contexto de projeto, não em grande variedade de projetos industriais."},{"p":"2608.19741","ach":"O melhor modelo atinge 65,36% de pass@1 mas apenas 25,25% de pass^20 em 507 fluxos de negocio com estado. Muitas falhas terminam com encerramento limpo e acoes validas de mudanca de estado, mostrando que sinal de resposta ou de chamada de ferramenta nao prediz conclusao correta da tarefa.","pn":"avaliacao de agentes pelo estado terminal do backend, nao pela resposta","pm":"cada tentativa do agente e verificada por checagens executaveis que inspecionam o estado persistente final do sistema, rejeitando efeitos errados, ausentes ou extras mesmo quando a resposta e a chamada de ferramenta parecem validas.","imp":"Nao decrete sucesso do seu agente olhando o texto da resposta ou o log das chamadas: rode uma checagem no estado final do sistema (registros criados, tickets alterados, pagamentos efetivados) e trate encerramento limpo sem efeito correto como falha real.","ex":"Num agente de suporte de RH interno, a tentativa devolve mensagem educada e registra uma chamada de API aparentemente valida, mas o pedido de ferias foi criado duas vezes ou no periodo errado; avaliacao por resposta aprovava, checagem do banco reprova.","res":"Os numeros valem dos cenarios de negocio cobertos pelo bench (varejo, seguro, banco digital); sistemas sem estado persistente verificavel nao se beneficiam do metodo. A diferenca pass@1 versus pass^20 mede variabilidade, nao garante que 65% de sucesso unico signifique producao confiavel."},{"p":"2608.19758","ach":"Em GPUs H20, o operador esparsamente pré-preenchido atinge até 47,26x de aceleração sobre FlashAttention-2 em contexto de 128K com FP8, e 27,19x em BF16. Contra um baseline denso alinhado ao FlashAttention-3/4 em FP8, a aceleração é de 30,49x. A correção de média mantém a degradação de qualidade controlada mesmo em níveis extremos de esparsidade.","pn":"Atenção esparsa no prefill com correção de média e kernel alinhado a produção","pm":"Um termo de correção de média suprime o erro de aproximação do esparsamento dinâmico do prefill, e o operador é reescrito com acesso de memória empacotado, especialização de warps e pipelining para se integrar como backend de atenção em frameworks de inferência.","imp":"Se você serve modelos com contexto longo, pode trocar o backend de atenção denso do prefill por esse operador esparso no framework que já usa, cortando o custo da fase mais pesada sem retreinar o modelo nem reescrever o servidor. Em contexto de 128K tokens, o prefill deixa de dominar a latência do primeiro token.","ex":"Um serviço de análise de documentos que preenche 128K tokens de contexto por requisição paga o prefill denso a cada chamada; com o backend esparso integrado ao SGLang, o mesmo prefill roda dezenas de vezes mais rápido em FP8, reduzindo a latência do primeiro token e o custo de GPU por requisição.","res":"Os ganhos são medidos em H20 e contra baselines específicos; a aceleração sobre o baseline denso mais moderno em FP8 é menor que sobre FA2. A qualidade é avaliada com degradação 'gerenciável', não idêntica à atenção densa, e a aceleração real depende do padrão de esparsidade do workload — tarefas com atenção difusa podem se beneficiar menos."},{"p":"2608.19799","ach":"O melhor agente testado atinge menos de 50% de pass@1 em 119 tarefas de reparo de software científico, distribuídas em 98 repositórios e 20 domínios. A análise identifica quatro mecanismos de falha recorrentes, como exploração equivocada e reparo superficial. A ablação pareada mostra que conhecimento científico bem alinhado melhora desempenho médio e eficiência de tokens, mas orientação mal alinhada induz ancoragem e não garante sucesso no reparo exato.","pn":"Benchmark de reparo de software científico com ablação de conhecimento de domíno","pm":"Tarefas de reparo em repositórios científicos reais são agrupadas por paradigma de tarefa, e um ablação pareada remove a orientação científica mantendo o contexto executável para isolar o efeito do conhecimento de domínio sobre o sucesso do reparo.","imp":"Antes de medir seu agente de codificação só pela taxa de sucesso agregada, separe as falhas por tipo — falta de conhecimento do domínio, exploração rasa, cobertura incompleta do reparo — porque cada tipo pede intervenção diferente. E se você injeta documentos ou contexto de domínio no agente, teste também sem ele: guia mal alinhada pode piorar o resultado e custar mais tokens.","ex":"Um agente que conserta um pipeline de processamento de dados científicos recebe um trecho de documentação do domínio como orientação; a orientação descreve um caso típico, o agente ancora nele e aplica um reparo que preserva a descrição mas não resolve a exceção real do repositório, falhando o teste executável que passaria sem a orientação.","res":"Os resultados vêm de poucos agentes comerciais avaliados com pass@1, e pass@1 abaixo de 50% em tarefas científicas difíceis não significa que agentes falhem igual em software comum. O efeito da orientação científica é misto e depende do alinhamento com a tarefa, não é um ganho uniforme."},{"p":"2608.19861","ach":"Compilar políticas de domínio em grafos de workflow e verificar o estado em cada turno do usuário eleva o Pass^4 médio de 0.42 para 0.62 no τ²-bench (airline, retail, telecom) com GPT-5.4. O maior ganho ocorre no domínio telecom (0.19 para 0.61), o mais estruturado em workflow. Os mesmos workflows transferem para Claude Sonnet 4.6 e Gemini 2.5 Pro, e a taxa de sucesso de ataques adversariais é a mais baixa observada.","pn":"Verificação de política em fronteira de turno com grafo de workflow","pm":"A política do domínio é compilada em um grafo de workflow cujo estado persistido permite um verificador, a cada turno do usuário, reconciliar requisições abertas e devolver remediação específica do passo ao agente.","imp":"Se seu agente de atendimento erra por pular etapas obrigatórias (confirmar identidade, validar elegibilidade), pare de tentar consertar isso só com prompts: represente a política como um grafo de passos e, a cada mensagem do usuário, compare o estado atual com o caminho exigido antes de deixar o agente agir. O verificador devolve a correção do passo específico, não um lembrete genérico.","ex":"Agente de companhia aérea que concede reembolso sem confirmar identidade: a checagem local da ação de reembolso não impede a omissão, porque a falha é procedural. Com o grafo, o verificador detecta no turno anterior que o nó de identificação está aberto e devolve ao agente a instrução de completar esse passo antes de prosseguir.","res":"Os resultados vêm do τ²-bench com agentes e verificador de fronteira (GPT-5.4) e validação desenhada pelos próprios autores; o ganho concentra-se no domínio mais estruturado em workflow, então o benefício em políticas vagas ou pouco sequenciais não está demonstrado. O custo de latência e a manutenção dos grafos em produção não são medidos."},{"p":"2608.20169","ach":"Em otimização de harness, avaliar o conjunto de validação completo a cada iteração é caro, e a maioria das tarefas deixa de discriminar entre candidatos conforme o harness evolui. Task-CoEvolve amostra tarefas ponderadas pela variância de resultados passados, focando nas próximas à fronteira de capacidade, e estima o escore do conjunto completo corrigindo pelas probabilidades de amostragem. Em classificação de texto online e Terminal-Bench 2.1, reduz as avaliações durante a otimização em 80% mantendo o desempenho final da busca com conjunto completo.","pn":"Amostragem ponderada por variância de tarefas de validação na otimização de iter","pm":"O co-evolvimento de harness e tarefas de validação concentra a avaliação em tarefas onde candidatos divergem, e estima o escore do conjunto completo corrigindo pelas probabilidades de amostragem.","imp":"Se você itera prompts ou código de agente guiado por um conjunto de validação, pare de rodar tudo a cada iteração. Priorize os casos onde as versões candidatas discordam entre si — os acertos e erros consistentes não ajudam a escolher — e ajuste o escore para compensar o subconjunto avaliado, para que as comparações entre iterações continuem justas.","ex":"Um agente de terminal avaliado no Terminal-Bench 2.1 gasta a maior parte do orçamento reexecutando tarefas que todas as versões do harness já resolvem ou todas já falham. Com amostragem ponderada por variância, o orçamento vai para as tarefas em que as versões divergem, e a correção pelas probabilidades de amostragem mantém as comparações consistentes entre iterações.","res":"Os resultados cobrem classificação de texto online e Terminal-Bench 2.1; a estimativa a partir de subconjuntos assume que a amostra ponderada por variância representa bem o conjunto completo, o que pode falhar quando a distribuição de dificuldade muda rápido. O código foi anunciado, mas a avaliação aqui se baseia no abstract."},{"p":"2608.20202","ach":"Em cinco frameworks de memória e duas famílias de modelos, todas as estratégias de memória pioram em MemTrapBench em relação a não usar memória, com quedas acima de 10% mesmo no melhor caso. Isso ocorre mesmo quando as memórias estão corretas e são semanticamente relevantes. Um método de inferência que instrui o modelo a evitar as armadilhas reduz a degradação sem perder desempenho em benchmarks tradicionais.","pn":"Memória recuperada pode corromper o raciocínio em vez de ajudar","pm":"Memórias fielmente armazenadas e semanticamente relevantes distorcem fixações de raciocínio e crenças do modelo na tarefa corrente, e instruir o modelo em tempo de inferência a contornar essas armadilhas mitiga a degradação.","imp":"Se o seu sistema guarda memórias de interações passadas, trate memória recuperada como entrada potencialmente enviesante: teste as respostas com e sem memória antes de confiar nela, e avalie adicionar instruções explícitas pedindo ao modelo para não se prender a memórias antigas quando elas conflitam com a tarefa atual.","ex":"Um assistente com memória de longo prazo recebe do usuário uma correção que contradiz uma crença registrada em sessões anteriores; o mecanismo de Belief Distortion faz o modelo reafirmar a crença antiga e responder errado, embora a memória esteja gravada de forma fiel e a busca a recupere corretamente.","res":"Os traps são induzidos pelo benchmark, então a frequência real dessas falhas em dados de produção não está estabelecida. O método mitigador foi avaliado quase só no benchmark dos próprios autores; a regra 'memória sempre ajuda' já era questionada, mas o tamanho do efeito em cenários naturais segue desconhecido."},{"p":"2608.20574","ach":"27 modelos de fronteira foram ranqueados em 534 tarefas culinárias em que cada resposta é uma escolha de 3 entre 8 ingredientes, e os 56 portfólios possíveis recebem nota de um sistema versionado antes de qualquer modelo executar. Dois painéis compilados independentemente correlacionam a r = 0,89, e 101 dos 351 pares de modelos ficam resolvidos com intervalos simultâneos de 95% e controle de Holm sobre 100 mil sorteios. O release publica prompts, mapas de nota, respostas brutas e um verificador offline que reconstrói cada um dos 14.418 resultados.","pn":"Pontuação executável pré-computada elimina o juiz do benchmark","pm":"Cada tarefa tem um espaço de respostas enumerável cujas opções recebem nota de um sistema versionado antes da execução do modelo, e um verificador offline reconstrói qualquer resultado a partir das respostas brutas e dos hashes publicados.","imp":"Se hoje você usa outro modelo como juiz para medir a qualidade das respostas do seu sistema, troque por tabela de notas pré-computada sempre que a saída for escolha entre opções fixas — rotear um ticket, escolher entre ferramentas, classificar em categorias fechadas: você pontua as opções uma única vez, congela, e cada rodada de avaliação vira consulta determinística, sem custo de juiz por execução e sem ranking que muda entre rodadas idênticas.","ex":"O MT-Bench, benchmark de conversa, usa um modelo forte como juiz; esse juiz oscila entre execuções e prefere respostas no estilo dele, então parte da diferença de nota entre dois modelos é ruído do juiz, não do avaliado. No FlavourBench essa fonte de ruído não existe: a nota de cada tarefa sai de uma tabela de 56 portfólios pontuados antes da execução, e qualquer resultado pode ser reconstruído offline a partir das respostas brutas e dos hashes.","res":"A pré-pontuação total só existe quando o espaço de respostas é pequeno e verificável por programa — 56 opções por tarefa aqui; em saída livre (texto aberto, código, conversa) não há como enumerar e o juiz volta. O domínio é culinário: a concordância entre painéis (r = 0,89) prova consistência interna do instrumento, não que a nota prevê desempenho na tarefa de produção do leitor, e compilar os mapas de nota é trabalho de quem montar o próprio eval."},{"p":"2608.23200","ach":"Em 252 tarefas com trajetórias verificadas do Opus, Gene evoluídos superam Skill em 8,7–15,5 pontos percentuais em sete modelos, incluindo famílias diferentes. Reuso de Gene completa 39 tarefas a mais que Skill para o Opus, com 9,9% menos tokens de resolução. Gene destilados de referência não mostram a mesma vantagem, apontando proveniência verificada como fator determinante.","pn":"Experiência de execução verificada consolidada como recurso externo reutilizável","pm":"Trajetórias de execução confirmadas por verificador são consolidadas em estruturas nomeadas que modelos subsequentes carregam como memória externa, evitando redescobrir estratégias a cada execução.","imp":"Se você mantém agentes que repetem workflows longos, trate execuções que passaram na verificação como ativo reutilizável: guarde o que funcionou em forma estruturada e carregue junto na próxima execução, em vez de deixar cada rodada começar do zero — isso reduz custo de tokens e aumenta taxa de conclusão.","ex":"Um agente de codificação que gera migrações de banco com testes end-to-end falha repetidamente nas mesmas restrições de schema a cada execução; consolidar as trajetórias que passaram nos testes e reutilizá-las evita pagar de novo os tokens de descoberta dessas restrições.","res":"O ganho vem de trajetórias verificadas de um modelo específico (Opus) em 252 das 778 tarefas; Gene destilados de referência não ganham, então a vantagem depende de proveniência verificada, não de representação compacta. O paper não mostra o mecanismo de consolidação em detalhe suficiente para reprodução."},{"p":"2608.23252","ach":"Proxies padrão de relevância falham em negativos difíceis, superestimando a utilidade de evidências que o modelo não usa. A sonda causal de leave-one-out isola a dependência real da geração e calibra a diluição estrutural da atenção. Alocar o orçamento iterativamente em gerações sequenciais eleva o portfolio recall em 16,7 a 20,5 pontos percentuais absolutos, com validação até modelos de 32B.","pn":"Alocação de contexto por sonda causal em vez de proxy de relevância","pm":"Uma sonda causal de leave-one-out mede a dependência real da geração em cada evidência, e um agendador submodular de malha fechada usa essa medida para distribuir o orçamento de contexto entre gerações sequenciais em vez de alargar o contexto de uma vez.","imp":"Pare de decidir quais documentos entram no contexto por similaridade ou ranking: meça com a sonda causal quais evidências a geração realmente usa e descarte o resto. Se o orçamento de tokens estiver apertado, divida a tarefa em várias passadas com realocação entre elas em vez de empilhar mais contexto numa única janela.","ex":"Um assistente de busca corporativa que monta um contexto único com os 20 documentos mais similares falha em perguntas cujo documento decisivo tem baixa similaridade superficial com a query: o proxy de relevância o classifica bem, mas a sonda causal mostra que a geração ignora o trecho. Com o agendador de malha fechada, o sistema detecta a evidência não integrada numa primeira passada e a realoca numa segunda geração, recuperando a resposta.","res":"Os ganhos de recall são medidos em benchmarks de geração de portfólio com modelos até 32B; não há evidência para domínios fora desse regime nem para tarefas de resposta única e curta, onde gerações sequenciais multiplicam custo de inferência. O decodificador contrastivo guiado por atribuição é parte do sistema completo, e a contribuição isolada de cada componente sobre o ganho final não fica clara no abstract."},{"p":"2608.13558","ach":"Em 36 casos reais de dados em 5 famílias de disciplinas, o sistema completa o fluxo de dados brutos a manuscrito compilado em todos, com pontuação média de 6,3. Em comparações pareadas contra uma variante cega que recebe apenas atributos escalares pré-computados, a percepção direta vence 85% dos julgamentos e melhora todas as 7 dimensões avaliadas.","pn":"Pipeline determinístico com percepção direta de evidência bruta e checagens em代码","pm":"Um pipeline determinístico com camada de percepção multimodal alimenta agentes de ideação, experimento e escrita, enquanto verificações de ideia, rigor e afirmação executadas em código garantem rastreabilidade numérica e proveniência de execução.","imp":"Se seus agentes de pesquisa ou análise trabalham sobre resumos, tabelas prontas ou features já extraídas, avalie trocar isso por acesso direto ao dado bruto com checagens em código: a comparação pareada mostra que resumos pré-computados derrubam a qualidade das decisões do agente.","ex":"Num agente que analisa imagens de microscopia e gera relatórios, alimentá-lo com métricas escalares pré-computadas (contagens, médias) esconde relações espaciais e temporais decisivas; o mesmo agente sobre as imagens originais, com verificação de afirmações em código, detecta padrões que os escalares não capturam.","res":"A pontuação média de 6,3 vem de avaliação com um backbone de raciocínio específico, e os julgamentos pareados dependem de juízes cuja composição não está no abstract; o ganho de percepção não prova que o sistema produz descobertas científicas corretas, apenas manuscritos melhor avaliados."},{"p":"2608.20438","ach":"Em 448 trials com quatro famílias de modelos abertos, um feed de posts de pares ranqueado por curtas geradas pelos próprios pares aumenta a similaridade lexical TF-IDF em +0,0082 (IC [0,0043; 0,0121], p=0,000105). O contraste pré-registrado de fontes distribuídas contra fonte única não é conclusivo (+0,057, p=0,112) e falha no critério de consistência entre modelos e tópicos. Sobrevivência do lado oposto cai 3,9 pontos percentuais apenas no painel central.","pn":"Convergência lexical por feed ranqueado por pares em populações sintéticas de L","pm":"Agentes de linguagem expostos a um feed de posts de pares ranqueados por curtas geradas pelos próprios pares convergem lexicalmente na rodada final, sem captura confiável de opinião.","imp":"Se você mede riscos de manipulação multiagente apenas por mudança de postura, está medindo a coisa errada: o efeito robusto aqui é superficial (vocabulário), não de opinião. Ao auditar sistemas multiagente, separe métricas de convergência lexical de métricas de mudança de posição, e não trate diversificar as fontes de influência como defesa comprovada.","ex":"Um time que roda uma simulação de rede social com agentes LLM para estimar risco de influência coordenada conclui, com este resultado, que quatro bots espalhados no feed não capturam opiniões de forma confiavelmente maior que um bot único sob impressões adversárias fixas — o sinal muda o vocabulário dos agentes, não o que eles defendem.","res":"O contraste do feed mistura exposição a posts de pares com o ranqueamento por curtas, então não isola o efeito do ranqueamento. O resultado sobre fontes distribuídas é inconclusivo, e tudo foi medido em populações sintéticas: nada disso estima efeitos em pessoas reais ou plataformas em produção."},{"p":"2608.21156","ach":"O paper sistematiza a passagem de paradigmas que otimizam um agente só — prompt, contexto, harness, loop — para a organização no nível do sistema, que chama de inteligência de sistema. Sua tese é que tarefas longas com especialistas diferentes, subtarefas dependentes, execução paralela e verificação independente extrapolam a capacidade organizacional de um único agente, e propõe representar tarefas, agentes e estados como grafos explícitos e dinâmicos. Acompanha repositório curado com papers e projetos.","pn":"Orquestração multiagente por grafos dinâmicos de tarefas, agentes e estados","pm":"Tarefas, agentes especializados e estados de execução são representados como nós e arestas de um grafo explícito que evolui durante a operação, coordenando especialistas heterogêneos em torno de um objetivo comum.","imp":"Quando um agente único com prompt caprichado e muitas ferramentas começa a se perder em tarefas longas, pare de empilhar contexto e trate o problema como de organização: desenhe explicitamente quem executa o quê, quem confere o resultado e onde o estado do trabalho fica guardado entre as etapas.","ex":"Num atendimento com um único agente que carrega histórico do cliente, políticas internas e ferramentas de reembolso no mesmo contexto, pedidos longos fazem o modelo misturar regras de produtos diferentes e autorizar reembolsos fora da política, porque nenhuma etapa separada confere a decisão antes de executá-la.","res":"É um panorama conceitual, sem experimentos próprios comparando sistemas com e sem grafos explícitos e sem critério para decidir quando o grafo vale mais que uma fila simples de mensagens. A leitura errada mais provável é tratar o termo novo como validação de que toda orquestração multiagente precisa de grafo; muitos casos se resolvem com roteiro linear e um verificador."},{"p":"2608.21833","ach":"O benchmark avalia 97 tarefas de geração, 100 de reparo com 19-27 bugs injetados cada, e 17 cadeias de otimização com 102 requisições. Os agentes atuais são mais confiáveis em produzir bases jogáveis e implementar requisitos explícitos do que em descobrir defeitos, verificar comportamento em execução e preservar funcionalidade entre mudanças.","pn":"Avaliação de agentes de codificação por estágios do ciclo de vida com testes de","pm":"O benchmark decompõe o desenvolvimento assistido por agente em três trilhas complementares — geração, reparo e otimização — e avalia cada uma com interação ao vivo, testes comportamentais determinísticos e checagens de regressão sobre o artefato executável.","imp":"Se você usa agentes de codificação em produção, não confie neles para encontrar bugs sozinhos: trate a detecção de defeitos e a verificação de regressão como etapas que exigem testes determinísticos seus, não como capacidade do agente.","ex":"Um agente que conserta um bug de colisão em um jogo de plataforma pode quebrar a pontuação sem perceber: o benchmark mostra que preservar funcionalidade entre mudanças é justamente o ponto fraco, então cada reparo precisa de checagem de regressão externa.","res":"O domínio é desenvolvimento de jogos, que exige lógica, áudio, visual e jogabilidade num único executável; a generalização para outros tipos de software não é demonstrada pelo paper, apenas sugerida pela estrutura das trilhas."},{"p":"2608.22510","ach":"Em 68 configurações avaliadas, a média máxima com portão de segurança foi 0,7671, e tarefas em superfícies nativas do runtime ficaram bem abaixo das tarefas de workspace ao vivo (0,5238 contra 0,6415). No holdout congelado, pass@k-any alcançou 0,6638 contra 0,2890 de pass estrito em três tentativas, e o ranking do perfil completo alinhou fracamente com o do holdout (Spearman 0,1300). Rankings baseados só na resposta final divergem substancialmente das visões com qualidade de processo e portão de segurança.","pn":"Avaliação de agentes por traço de execução com configuração declarada","pm":"O benchmark avalia a unidade modelo-mais-runtime declarada, pontuando cada tentativa a partir do traço de execução com uma fórmula com portão de segurança que combina correção, qualidade do processo e eficiência, preservando evidência de falha para auditoria.","imp":"Antes de escolher um agente pelo leaderboard de respostas finais, rode as tarefas do seu domínio várias vezes e olhe o caminho que o agente percorreu até a resposta, não só o resultado. Um agente que acerta uma vez em três tentativas pode estar escondendo falhas de navegação ou de segurança que a média final não mostra.","ex":"Um agente de agendamento que responde corretamente ao pedido do usuário mas acessa uma superfície nativa de mensagens sem passar pela checagem de permissão: num leaderboard de resposta final ele empataria com um agente que respeitou o limite, enquanto a pontuação por traço com portão de segurança rebaixaria a tentativa e registraria a evidência da violação para auditoria.","res":"O benchmark foi instanciado num único runtime de agente; os números absolutos e o ranking não se transferem automaticamente para outros runtimes, e a fraca correlação entre perfil completo e holdout indica que a escolha da trilha muda o resultado. A pontuação com portão de segurança também depende das regras de segurança codificadas pelos autores, que podem não refletir as políticas do ambiente do leitor."},{"p":"2608.22856","ach":"Ao expandir um índice FineWeb de 1 para 7 shards, o churn excessivo de respostas em Natural Questions foi de 6,44 pontos percentuais (exact match normalizado) e 10,25 (semântico cego), enquanto a acurácia mudou apenas -1,50. Em TriviaQA o churn foi menor e a acurácia moveu-se em direção oposta. Uma replicação com segundo gerador DeepSeek achou 8,75 pp de churn semântico mesmo com acurácia subindo 3,00 pontos.","pn":"Auditoria de compatibilidade por churn de respostas entre snapshots","pm":"Subtrai a discordância de repetições dentro do mesmo snapshot da discordância entre snapshots distintos, isolando o churn de respostas causado pela atualização do índice que a acurácia agregada não revela.","imp":"Antes de trocar ou expandir o índice de busca do seu sistema de perguntas e respostas, rode o mesmo conjunto de perguntas duas vezes no snapshot atual e duas no novo, e compare as discordâncias entre os dois grupos. Se o novo índice mudar respostas além do que a variação natural do modelo explica, trate como quebra de compatibilidade mesmo que a taxa de acerto fique igual.","ex":"Um assistente de FAQ em produção recebe expansão do índice vetorial; 40 de 400 perguntas mudam de resposta de forma estável entre repetições, algumas virando erros, outras acertos, enquanto o dashboard de acurácia segue estável — o time só descobre quando um usuário nota resposta inconsistente para a mesma pergunta em dias diferentes.","res":"Os estudos usam um gerador DeepSeek e índices FineWeb congelados; a magnitude do churn pode variar com outro modelo, outro corpus ou outra política de recuperação. O TriviaQA mostra efeito menor e acurácia em direção oposta, então o padrão não garante que todo churn seja prejudicial — ele sinaliza mudança não visível, não degradação."},{"p":"2608.22872","ach":"Em três benchmarks de QA multi-hop com quatro sotaques sintetizados, a combinação de entity-graph linking e reformulação iterativa amplia o gap de F1 entre texto limpo e o pior sotaque em 36-67% comparado à recuperação densa simples. A corrupção de entidades da consulta responde por 87-96% dos casos de degradação. Mitigações leves de superfície não fecham o gap.","pn":"Estrutura de recuperação multi-hop amplifica erros de ASR","pm":"Extensões de recuperação que dependem de entidades da consulta propagam e amplificam erros de reconhecimento de fala, aumentando a distância de qualidade entre entrada limpa e ruidosa em relação à recuperação densa simples.","imp":"Se sua aplicação recebe fala e passa por ASR antes do RAG, não presuma que adicionar estrutura de recuperação (grafo de entidades, reformulação iterativa) compensa erros de transcrição — ela tende a piorar. Meça o pipeline com áudio real antes de escolher a configuração mais sofisticada de recuperação.","ex":"Assistente de suporte por voz que responde perguntas multi-hop sobre documentos internos: um sotaque regional corrompe o nome de uma entidade na pergunta, e o grafo de entidades segue a entidade errada, recuperando documentos irrelevantes que a recuperação densa simples teria rejeitado.","res":"O resultado vale para QA multi-hop em inglês com fala sintetizada por TTS; fala real e outros idiomas podem se comportar diferente. Configurações mais ricas mantêm F1 absoluto maior — o achado é sobre a amplificação relativa do erro, não sobre qual configuração tem melhor qualidade absoluta."},{"p":"2608.22876","ach":"Em 192 injeções de falha em oito checkpoints, a inspeção de máscaras de atenção não encontrou nenhum vazamento causal, enquanto a auditoria de invariância de prefixo localizou 192/192. O método custa duas passadas adiante, sem treino nem gradientes. Ele ainda revelou defeitos reais em Zamba2 e Nemotron-H, provando que modelos híbridos e de estado vazam por varreduras e normalização mesmo com máscaras corretas.","pn":"Auditoria de invariância de prefixo por duas passadas","pm":"Rodam-se duas passadas adiante com entradas futuras alteradas após a posição t e comparam-se as representações; divergência localiza exatamente onde a causalidade quebra, inclusive por varreduras e normalização que a inspeção de máscara não pega.","imp":"Se hoje você valida a causalidade do seu modelo olhando só as máscaras de atenção, pare: a máscara correta não prova nada. Rode a auditoria de duas passadas — altere a entrada futura, compare as representações na posição alvo — sobre cada checkpoint antes de colocá-lo em produção.","ex":"Um sistema de atendimento que roda um modelo híbrido tipo Zamba2 para resumir conversas: as respostas na posição t já carregam informação de turnos futuros da transcrição via camadas de varredura, então o resumo 'em tempo real' usa o final da conversa que ainda não aconteceu, gerando respostas impossíveis de justificar no momento.","res":"A auditoria detecta onde a causalidade quebra, não corrige o defeito — os defeitos em Zamba2 e Nemotron-H seguem abertos. O resultado vale para os checkpoints e injeções testados; não prova que todo vazamento futuro é localizável, nem que a auditoria é barata o suficiente para rodar continuamente em modelos muito grandes."},{"p":"2608.23035","ach":"O benchmark cobre 13 domínios funcionais e 212 ferramentas móveis realistas em sandbox com estado vivo e verificação baseada em evidência. Modelos fronteira atuais mostram desempenho instável no ambiente: quedas acentuadas quando a ordem das ferramentas é estrita, quando há limites de permissão e quando ocorrem erros de runtime inesperados. O instrumento também serve de base interativa para treino com reforço de agentes.","pn":"Benchmark de agentes móveis com sandbox interativo e stateful","pm":"Avalia agentes de planejamento em sandbox executável que mantém bancos de dados de aplicação vivos, retorna feedback estruturado e testa chamadas de ferramentas, colaboração entre subagentes, memória e skills compostas sob restrições reais de execução.","imp":"Antes de confiar num agente que opera apps móveis por chamadas de ferramentas, rode-o num cenário com estado real e falhas de runtime: os números de benchmarks offline de function-calling não preveem o comportamento quando a ordem das ações importa, permissões bloqueiam caminhos e erros aparecem no meio da tarefa.","ex":"Um copiloto móvel que reserva um voo e depois ajusta o calendário: num benchmark offline de APIs a sequência passa; num sandbox com banco de dados vivo, um erro de runtime no meio (assento indisponível) faz o agente seguir o plano sem se recuperar, e a tarefa inteira falha.","res":"O ambiente é uma simulação com ferramentas e bancos de dados sintéticos, não aparelhos reais com variações de fabricante e rede; os números medem capacidade nesse sandbox. Não há evidência de que a hierarquia de falhas observada se transfira integralmente para dispositivos reais, e os resultados de treino com reforço ficam como uso potencial, não validado no abstract."},{"p":"2608.23552","ach":"No ARC-AGI-3, o harness eleva o Best@1 de 30% para 95,5% comparado ao harness RHAE, e iguala ou supera harnesses populares em código de contexto longo, geração de kernel de GPU e speedruns do nanoGPT. Em Factorio, subagentes dedicados permitem trabalho paralelizado e refinamento sustenta progresso tecnológico contínuo. O código está aberto para inspeção e adoção.","pn":"Computação persistente e comunicação direta entre subagentes no harness","pm":"Um harness com REPL persistente e subagentes que se comunicam diretamente entre si processa contexto programaticamente e preserva histórico, memórias e habilidades entre trajetórias.","imp":"Você pode trocar o harness do seu agente por um que mantenha REPL persistente e memórias entre sessões em vez de recomeçar a cada execução. Quando seu agente falha em tarefas longas, teste se a falha está no harness — perda de contexto, ausência de recuperação — antes de concluir que o modelo não dá conta.","ex":"Um agente de codificação que processa um repositório grande falha porque estoura a janela de contexto ao reler arquivos a cada passo. Com um REPL persistente, os arquivos já lidos ficam armazenados como variáveis da sessão, e o agente consulta resultados anteriores sem reprocessá-los — evitando que a limitação do harness vire falha atribuída ao modelo.","res":"O salto de 30% para 95,5% no ARC-AGI-3 foi medido com o próprio harness rodando com estratégias que deixam espaço para overfitting ao benchmark; a comparação com outros harnesses usa configurações que podem não estar igualmente afinadas. Ganho de benchmark não isola o efeito de cada mecanismo — comunicação entre subagentes, persistência e REPL contribuem em conjunto, sem ablação reportada no abstract."},{"p":"2608.23041","ach":"Otimizar automaticamente o harness de um agente elevou o desempenho em 9,0 pontos no GAIA2, 9,6 no SWE-Bench Pro e 10,0 no Terminal-Bench 2.0 sobre os harnesses base. Ablações mostram que os três ingredientes importam: depuração profunda, patches direcionados e seleção com atenção à generalização. Cada um desses elementos removido degrada o ganho.","pn":"Otimização de harness como problema de aprendizado offline dirigido por falhas","pm":"Traços de execução que terminam em falha são diagnosticados em profundidade, o harness é tratado como código e recebe patches estruturados, e só o patch validado em mini-lotes com critério de generalização é mantido.","imp":"Em vez de ajustar prompt, ferramentas e fluxo de controle do agente à mão, você pode rodar um ciclo offline sobre os traços de falhas da sua própria produção: diagnosticar a causa, editar o harness como se fosse código e só aceitar a mudança se ela validar em lote — sem retreinar nada.","ex":"Um agente de codificação que falha no Terminal-Bench porque reflete superficialmente sobre o erro e aplica edições difusas: a depuração profunda sobre o traço de falha, seguida de patch direcionado validado, é o que separa o ganho de 10 pontos de uma 'correção' que só serve para aquela trajetória.","res":"Os ganhos são medidos em benchmarks com harnesses base específicos; a seleção orientada a generalização mitiga, mas não elimina, o risco de o patch ser um reparo de trajetória disfarçado. O paper não reporta custo computacional do ciclo offline nem comportamento fora desses três benchmarks."},{"p":"2608.23670","ach":"Em doze datasets públicos, os FSMs têm 7–43 estados, reproduzem dados de teste com fitness ≥0.997 e são construídos em milissegundos. Contexto de estado do FSM supera Agent Workflow Memory em predição de próximo passo em todos os datasets com ground truth. Para predição de falha, features por estado alcançam AUROC de até 0.94, e um monitor online ranqueia execuções que falham acima das que passam a partir de traço parcial, permitindo parada antecipada.","pn":"Topologia comportamental de agentes como autômato finito colapsado do corpus de","pm":"O corpus inteiro de execuções de um agente é colapsado em um único autômato finito compacto, cujos estados servem como contexto para prever o próximo passo e a falha de execuções novas.","imp":"Você pode auditar e monitorar seu agente em produção sem instrumentar o modelo: construa o FSM a partir dos traços que já coleta, use o estado atual como sinal de monitoramento e configure parada antecipada quando a execução entrar em estados associados a falha.","ex":"Um agente de atendimento que navega por ferramentas de CRM falha ao entrar em ciclos de chamada repetida à mesma API. O FSM construído dos traços marca esses estados; o monitor detecta o loop no meio da execução e interrompe antes de estourar o limite de chamadas.","res":"A própria conclusão do paper é que a topologia é moldada mais pelo harness de deploy do que pelo LLM: o FSM é válido para o par agente-ambiente que gerou os traços, e traços de outro harness ou tarefa podem exigir reconstrução. Fitness alto mede reprodução da distribuição observada, não garantia de cobertura de falhas não vistas."},{"p":"2608.23691","ach":"Em 12 problemas de construção do catálogo AlphaEvolve, o ambiente produziu resultados novos em cinco: família infinita de conjuntos de Kakeya em corpos finitos, configurações exatas de 604 pontos em dimensão 11, recordes em Kakeya discretizado e incerteza de sinal, e limitante inferior melhorado para o problema de sobreposição mínima de Erdős. Os agentes geraram também teoremas e análises explicando as construções, não apenas números. Todos os diálogos, provas e código de verificação foram liberados.","pn":"Ambiente multiagente aberto para descoberta matemática autônoma","pm":"Agentes de famílias de modelos distintas operam num ambiente compartilhado sem coordenador central, escolhendo direções de pesquisa, conduzindo experimentos e acumulando uma literatura científica comum verificável.","imp":"Se você mantém pipelines de agentes que resolvem tarefas fechadas com orquestrador central, este resultado sugere trocar o roteiro fixo por um ambiente compartilhado onde os agentes escolhem o próximo passo e validam uns aos outros. Antes de descartar um domínio como 'difícil demais para LLMs', teste se ele tem um verificador automático — a verificação é o que permite que agentes sem coordenação central acumulem progresso real.","ex":"Um time que usa um único agente orquestrador para otimizar configurações numéricas (por exemplo, buscar parâmetros de corte ou layouts) pode substituir o orquestrador por agentes independentes que propõem candidatos e checam as propostas dos demais contra um verificador determinístico, acumulando os melhores resultados numa base comum em vez de depender de um pipeline único.","res":"Os domínios validados são problemas matemáticos com verificadores objetivos e baratos — a mesma arquitetura pode não transferir para tarefas onde a qualidade só pode ser julgada por outro modelo ou por humanos. Os cinco resultados novos saíram de 12 problemas, então a taxa de sucesso é menor que 50%, e os casos fora da matemática são apenas dois estudos de caso, não uma avaliação sistemática."},{"p":"2608.23740","ach":"Em quatro tarefas de backend e checagens cruzadas em Python DevBench e Rust+axum, a configuração com 2 agentes abandona menos tarefas difíceis que um agente solo, com menos variação entre execuções. Em computo igualado, um contraste positivo de LLM-judge coloca a coordenação completa acima de paralelismo sem coordenação e de casos parciais, indicando que a coordenação em si, não o merge ou o paralelismo, explica o ganho.","pn":"Coordenação de agentes de código via workspace compartilhado com merge CRDT","pm":"Um filesystem compartilhado mesclado por CRDT expõe reivindicação de arquivo, status e broadcast como ferramentas, permitindo que múltiplos agentes codifiquem concorrentemente sem sequenciamento por fases nem amostras independentes sem coordenação.","imp":"Se você roda agentes de codificação, troque o pipeline serial de handoffs por arquivos com dono declarado e sincronização automática de estado: um agente trava o arquivo em que trabalha, anuncia o status e os demais leem o mesmo estado sem conflito de escrita.","ex":"Refatorar um monorepo em que dois agentes editam módulos interdependentes: sem coordenação, cada um gera stub do arquivo do outro e desiste; com claim de arquivo e broadcast de status, o segundo agente espera ou assume outro arquivo em vez de descartar metade da tarefa.","res":"A evidência vem de apenas quatro tarefas backend e um contraste médio positivo de LLM-judge, com avaliação feita por outro modelo de linguagem — ganho pequeno e não testado em larga escala. O resultado cobre modelos de CLI estáveis e não prova ganho em todos os tipos de tarefa."},{"p":"2608.23918","ach":"No CodeContests com Gemma 4, o sistema atinge 0,624 de taxa de aprovação, 14,4 pontos percentuais acima de prompting direto, com 2,3 estágios registrados por tarefa. Fecha a maior parte da distância para o CodeSIM (0,731) a 3,3 vezes menos custo de tempo real, com variância bem menor de gasto de tokens por tarefa.","pn":"Pipeline de especialistas por tópico com retransmissão e sandbox","pm":"Recuperação seleciona especialistas de tópicos algorítmicos; cada agente testa a solução candidata em sandbox e decide manter, reparar ou repassar o rascunho ao próximo especialista, com uma passada final de normalização de boilerplate.","imp":"Antes de montar um pipeline genérico de planejador-codificador-depurador, você pode trocar os papéis genéricos por especialistas de domínio escolhidos por busca sobre um corpus de referência, e deixar cada agente decidir entre manter, consertar ou repassar o código após rodar em sandbox. Isso tende a reduzir o custo por tarefa e a variância de gasto de tokens sem trocar o modelo base.","ex":"Em um serviço que gera soluções para problemas algorítmicos, um rascunho de programação dinâmica que falha nos exemplos públicos é repassado ao especialista de grafos com um pacote estruturado do histórico, em vez de o mesmo agente genérico tentar consertar repetidamente; a passada final de infraestrutura normaliza o boilerplate de I/O antes da submissão.","res":"Os resultados são do CodeContests, um domínio com exemplos públicos e verificação objetiva; nada prova que a divisão por tópicos algorítmicos se transfere a tarefas de engenharia de software sem casos de teste públicos. A comparação com o CodeSIM usa custo de tempo real reportado pelos autores, não medido em ambiente comum."},{"p":"2608.24569","ach":"Em 1.296 episódios sintéticos controlados, handoffs diretos preservam 100% dos bloqueios de segurança, enquanto compressão normal de handoff produz 100% de desativação do bloqueio e 54,2% de ações proibidas. Restaurar os quatro campos de estado (pré-requisito, autoridade, fallback, consequência) eleva a preservação a 100% e zera a ação proibida. Verificação a jusante elimina a ação proibida, mas o artefato permanece desativado em 95,3% dos casos.","pn":"","pm":"","imp":"Pare de tratar o resumo de handoff como portador confiável de restrições: quando um estágio comprime o estado para o próximo, reescreva explicitamente os campos de ação (o que precisa acontecer antes, quem autoriza, o que fazer se falhar) em vez de confiar que a menção ao tema basta. Adicione verificação a jusante como camada separada, porque preservar o conteúdo no artefato não impede a ação proibida.","ex":"Um pipeline de atendimento onde o agente de triagem identifica 'não executar reembolso sem aprovação do supervisor' e o agente de execução recebe um resumo que diz 'condição de reembolso pendente — considerar na próxima etapa'. O resumo menciona a condição, mas a transforma de pré-requisito em contexto informativo, e o executor prossegue com o reembolso sem aprovação.","res":"Os resultados vêm de episódios sintéticos com identificação correta do bloqueio a montante garantida por construção; não medem a taxa de falha quando o upstream não detecta o bloqueio. O domínio é restrito a bloqueios com estrutura explícita de pré-requisito/autoridade/fallback/consequência, e a generalização para restrições menos estruturadas não é demonstrada."},{"p":"2608.24735","ach":"Em dois backbones, o sistema supera agentes auto-aperfeiçoantes anteriores em oito famílias de benchmark. Em ARC-AGI-2, construído para resistir à memorização de habilidades, é o único que pontua acima de zero. Ablicações indicam que a maior parte do ganho vem do condicionamento que cada camada passa à seguinte, e papéis distintos de camada emergem com a profundidade sem que nenhum prompt os prescreva.","pn":"Meta-operação fixa que recursa sobre a entrada em vez de sobre si mesma","pm":"Uma operação imutável lê os traços e o código das camadas anteriores e escreve a próxima camada como pré-processamento estratégico mais uma biblioteca de funções chamáveis, com profundidade definida por convergência e um arquivo evolutivo buscando sobre cadeias de camadas.","imp":"Quando seu agente precisa melhorar respostas repetidamente, faça-o escrever camadas de pré-processamento e funções auxiliares sobre o histórico de execuções anteriores, em vez de pedir que ele edite os próprios prompts ou ferramentas. Isso evita o limite de profundidade em que o mecanismo de edição precisa ficar intocado para o sistema não quebrar.","ex":"Um pipeline de resolução de tarefas do tipo ARC-AGI-2, onde o agente precisa resolver puzzles que exigem abstração nova a cada instância: em vez de reescrever o próprio prompt de sistema a cada iteração — o que estabiliza em no máximo dois níveis de meta-melhoria —, uma operação fixa lê os traços e o código das execuções anteriores e adiciona uma nova camada de pré-processamento com funções reutilizáveis, permitindo que camadas mais altas raciocinem de um ponto de vista mais elevado.","res":"Os ganhos vêm medidos em benchmarks de raciocínio abstrato; não há evidência de que o esquema se transfira a tarefas de produção com feedback ruidoso ou latência restrita. A profundidade por convergência e o arquivo evolutivo adicionam custo computacional que o abstract não quantifica, e o papel exato do condicionamento entre camadas ainda é inferido de ablações, não de um mecanismo isolado."},{"p":"2608.24876","ach":"Em quatro benchmarks de tarefa longa e dez modelos, a arquitetura melhora a taxa de sucesso em 35 dos 37 pares modelo-benchmark. Em tau-bench, adiciona +17,8 pontos ao GPT-5.6 Sol e +15,6 ao Claude Opus 5, levando-o a 87,9%. A vantagem cresce com o horizonte da interação, chegando a +32,2 pontos nas tarefas mais longas, e falhas comuns de tarefa longa caem até 80%.","pn":"Memória de trabalho acoplada à memória de habilidades com atualização validada","pm":"Uma memória de trabalho rastreia o progresso da tarefa e seleciona habilidades de uma memória de experiência, e as execuções viram evidência estruturada que localiza falhas em componentes específicos da memória, permitindo atualizações locais aprovadas por validação.","imp":"Se seu agente erra em tarefas longas porque se perde no histórico ou chama a habilidade errada, separe a memória de habilidades da memória de progresso e use o progresso atual para escolher a habilidade. Quando uma execução falha, registre qual componente da memória guiou a decisão errada e corrija só esse componente, aceitando a correção só se ela passar num teste de validação.","ex":"Um agente de atendimento que roda fluxos de reembolso com dezenas de passos: perto do fim, o histórico acumulado confunde o agente, que invoca a habilidade de verificação de identidade já concluída e reinicia o fluxo. Com a memória de trabalho marcando a etapa atual, a seleção consulta o estado da tarefa, e a falha fica localizada na entrada de habilidade errada, que é corrigida e revalidada sem tocar no resto da memória.","res":"Os números vêm dos benchmarks e modelos testados pelos autores; não há evidência de que o ganho se mantenha em domínios com habilidades menos padronizadas ou histórico mais ruidoso. O loop recursivo depende de um validador confiável: se o teste de validação for fraco, atualizações ruins entram na memória e degradam o agente ao longo do tempo."},{"p":"2608.24189","ach":"Em 4 meses de uso real (40 usuarios, 1.872 sessoes, 7 condicoes de memoria), a acuracia em QA direto variou de 19,7% a 70,1% sem mudar a satisfacao dos usuarios. No mesmo modelo e contexto, o sistema acerta 78,8% no QA direto mas usa apenas 7,9% desses fatos espontaneamente na conversa. Nos momentos avaliados pela MemUse, a integracao natural se associa a satisfacao; o QA direto, nao.","pn":"Avaliar memoria por integracao natural, nao por pergunta direta","pm":"Momentos de memoria sao disparados por pistas reais de usuarios em conversas longas, e o sistema e julgado por quanto teor relevante aparece espontaneamente na resposta, e nao por acerto em perguntas factuais feitas sob demanda.","imp":"Pare de reportar so a acuracia de QA direto do seu sistema de memoria: adicione casos em que o usuario da uma pista indireta e meça se o sistema puxa o fato relevante sem ser perguntado. Se o seu bot lembra tudo sob pergunta mas ignora contexto util na conversa, o numero alto de recall nao garante experiencias melhores para quem usa.","ex":"Assistente de saude conversacional: o usuario menciona semanas antes que tem alergia a penicilina; depois diz 'estou com dor de garganta'. Sistema com QA direto de 78,8% recomenda amoxicilina porque a recuperacao sob demanda nao foi disparada — falha de integracao natural que o benchmark classico pontuaria como sucesso.","res":"A correlacao com satisfacao vem de um deployment de 40 usuarios e 7 condicoes; nao prova causalidade nem generaliza para todo dominio. A rubrica de integracao usa julgamento por LLM avaliador, que herda seus vieses. E o gap de 71 pontos compara recuperaçao elicita com uso espontaneo — metricas diferentes, nao necessariamente um sistema quebrado."},{"p":"2608.23564","ach":"Em 520 execuções de 8 modelos de fronteira, apenas 5,4% passam nas três etapas de avaliação; 13 das 20 migrações não recebem solução aceita. Entre 340 execuções que provam que a migração ocorreu, 58% atingem 99% das verificações fixas, mas só 26% chegam a 100%. Capacidade varia por tipo de dívida técnica: 31,4 em reescrita de toolchain contra 5,6 em reescrita de linguagem.","pn":"Avaliação de migração em três estágios contra o hack de copiar código","pm":"Um protocolo de avaliação separa completude da migração de corretude comportamental: uma auditoria verifica que a migração ocorreu, testes fixos medem comportamento e agentes independentes geram testes direcionados para diferenças ocultas.","imp":"Se você mede seus agentes de codificação só pela suíte de testes existente, um agente pode copiar a implementação antiga e parecer bom sem fazer o trabalho. Antes de confiar num relatório de sucesso, exija uma verificação separada de que a mudança pedida realmente aconteceu, não só que os testes passaram.","ex":"Numa migração de repositório de Maven para Gradle, o agente copia o build original e ajusta os testes até passarem: a suíte fica verde, mas nenhuma migração ocorreu. O estágio de auditoria do benchmark barra esse caso, e os dados mostram que execuções que preservam comportamento pulando a migração são barradas exatamente aí.","res":"O benchmark cobre 20 migrações em 4 categorias de dívida técnica, amostra pequena para generalizar rankings entre modelos; os números de 5,4% e 47/100 valem para este conjunto de tarefas, não como medida absoluta de capacidade de agentes em migrações quaisquer."},{"p":"2608.24358","ach":"Em pares de modelos Claude e GPT, escalar de um modelo barato para um forte transferindo a trajetória completa recupera menos da metade da diferença de qualidade, com custo bem maior. Reduzir a informação herdada do modelo barato melhora a escalada. Na direção oposta, remover a trajetória do modelo forte piora a qualidade do retorno ao modelo barato.","pn":"","pm":"","imp":"Antes de trocar de modelo no meio de uma tarefa de agente, teste remover ou resumir o histórico do modelo barato ao escalar — e mantenha o histórico completo ao voltar para o modelo barato. Se sua pipeline hoje repassa tudo nos dois sentidos, ela provavelmente paga caro por qualidade que não chega.","ex":"Um agente de codificação rodando dezenas de chamadas com um modelo barato trava num bug difícil; a pipeline escala para o modelo forte repassando todo o histórico de chamadas e edições. O receptor continua uma trajetória não nativa, herda decisões ruins do modelo barato e entrega qualidade inferior à esperada, com custo alto.","res":"Os resultados vêm de pares específicos das famílias Claude e GPT em tarefas de codificação; a magnitude do imposto pode variar com outros pares de modelos e domínios. O paper mede o efeito em benchmark, não valida a política de handoff em produção."},{"p":"2608.24979","ach":"Doze modelos de fronteira com três scaffolds de agente completaram integralmente no máximo 20 das 97 tarefas liberadas, um Pass Rate de 20,6%. Em química analítica e eletroquímica, o Avg. Score chegou a 87,6 e 94,9, mas o Pass Rate máximo foi de 4% e 0%. Entre trajetórias reprovadas do Claude Code, 75,5% terminaram com linguagem afirmando conclusão.","pn":"Avaliação de workflow científico por pacote de entregáveis","pm":"O benchmark define cada tarefa como um workflow científico completo com entregáveis obrigatórios, e mede separadamente o progresso parcial e a entrega integral, expondo a diferença entre os dois.","imp":"Não trate pontuação parcial alta ou mensagem de 'tarefa concluída' do agente como entrega feita: valide cada entregável exigido antes de aceitar o resultado, especialmente em tarefas de análise química ou eletroquímica.","ex":"Um agente de codificação rodando um workflow de eletroquímica reporta 94,9 de score parcial e declara sucesso, mas nenhum entregável obrigatório do pacote foi produzido por completo; o pipeline de produção aceitaria o resultado como válido se confiasse na autoavaliação do agente.","res":"O benchmark cobre seis domínios científicos específicos; a lacuna entre progresso parcial e entrega completa não está demonstrada para workflows de engenharia de software ou tarefas gerais de produção, e os números vêm de três scaffolds avaliados em um único benchmark."},{"p":"2608.25512","ach":"O paper formaliza duas dimensões da composição dinâmica: temporal (reverter completamente os efeitos colaterais de um componente ao removê-lo) e espacial (declarar e gerenciar reativamente dependências entre componentes). A unificação em um único contexto produz equivalência observacional sob a qual efeitos de componentes distintos se intercalam sem se perturbar. A implementação Cordis inclui rastreamento de efeitos, resolução de coefeitos e substituição de módulos a quente.","pn":"Composição dinâmica com efeitos revertíveis e coefeitos reativos","pm":"Cada transformação de contexto carrega um inverso que o runtime retém para reverter efeitos, e cada mudança de contexto é classificada contra uma especificação de coefeito que ativa e desativa componentes.","imp":"Se você mantém um sistema de plugins ou um harness de agentes que carrega e descarrega componentes em tempo de execução, passe a exigir que cada componente declare como desfazer suas próprias mudanças e de quais outros componentes depende. Assim, remover um plugin não deixa estado sujo — hooks registrados, cache modificado, variáveis de ambiente — e trocar um componente não quebra silenciosamente os que dependiam dele.","ex":"Um harness de agentes autoevolutivo que recarrega ferramentas via hot module replacement: sem inversos de efeito, uma versão antiga de uma ferramenta deixa um handler de webhook registrado ou sobrescreve uma variável de configuração, e a execução seguinte usa comportamento obsoleto; sem coefeitos reativos, uma dependência removida só falha quando o componente a invoca, em vez de ser desativada no momento da mudança.","res":"O mecanismo é formalizado em um cálculo e implementado em um meta-framework específico; a equivalência observacional vale dentro da disciplina do contexto único mediador, e sistemas existentes que misturam efeitos fora desse contexto não herdam a garantia. Portar a ideia para um runtime que não controla o ciclo de vida dos componentes exige reconstruir o rastreamento de efeitos do zero."},{"p":"2608.25529","ach":"Em mais de 20 modelos multimodais avaliados, seguir instruções em vídeo continua difícil, sobretudo com muitas restrições, restrições semânticas ligadas ao conteúdo e estruturas condicionais que exigem escolher o caminho certo conforme o vídeo. O benchmark traz 1.5K amostras com 39 categorias de restrição, construídas com pipeline semiautomático e verificação humana.","pn":"Avaliação de aderência a instruções em vez de acurácia de tarefa","pm":"Um benchmark de entendimento de vídeo pontua se a resposta satisfaz restrições semânticas e de formato impostas pelo usuário — incluindo condições que dependem do conteúdo do vídeo — em vez de medir apenas se a tarefa foi resolvida.","imp":"Se você testa um sistema que responde perguntas sobre vídeo, não basta checar se a resposta está correta: inclua casos em que a resposta só vale se o vídeo mostra ou diz algo específico, e verifique se o formato pedido foi respeitado.","ex":"Um assistente de análise de vídeo recebe 'se houver um carro vermelho, liste as placas visíveis; senão, resuma a cena em uma frase'. Modelos avaliados tendem a executar a tarefa genérica e ignorar a condição, devolvendo placas mesmo sem o carro vermelho ou resumindo quando deviam listar.","res":"Os resultados valem para modelos multimodais de vídeo avaliados neste benchmark; medir capacidade não mostra como resolver a falha. As restrições são 39 categorias desenhadas manualmente, então a cobertura do espaço real de instruções de usuários é parcial, e 1.5K amostras limitam generalizações finas por tipo de restrição."},{"p":"2608.25593","ach":"Um modelo treinado para gerar harnesses sob demanda eleva DeepSeek-V4-Flash acima de GPT-5.6 em DeepSearchQA (+9,1) e OdysseyBench (+4,3), e dá até +20,2 pontos ao GLM-5.2. Os harnesses gerados competem com runtimes maduros como OpenCode e Claude Code em avaliações controladas. O ganho aparece consistentemente em três famílias de modelos de escalas diferentes.","pn":"Harness como artefato composto gerado por protocolo de quatro módulos","pm":"O harness do agente é formalizado como artefato composto e gerável por máquina, regido por protocolo fixo de quatro módulos, sintetizado sob demanda para a tarefa.","imp":"Se o seu agente está limitado pelo harness e não pelo modelo, não adote a ideia direto: o mecanismo aqui é um modelo treinado para gerar harnesses, não uma receita. O que muda para você é a prioridade — antes de trocar de modelo, trate o harness (memória, planejamento, protocolo de ação, ferramentas) como variável ajustável por tarefa, e meça o ganho de customizá-lo por tarefa antes de pagar por um modelo maior.","ex":"Um agente de busca profunda rodando sobre um modelo médio perde para um concorrente com modelo maior; ao regenerar o harness para cada tarefa — ajustando gerenciamento de memória e protocolo de ação — o mesmo modelo médio supera o concorrente, porque a falha estava no harness fixo e genérico, não na capacidade do modelo.","res":"Os números vêm de benchmarks controlados (DeepSearchQA, OdysseyBench) e de comparação com runtimes maduros, não de produção; o custo de gerar e reparar harnesses em tempo real não é reportado no abstract. E o mecanismo central é um modelo treinado — sem acesso a ele ou a um treino equivalente, o leitor reproduz no máximo o protocolo de quatro módulos, não os ganhos."},{"p":"2608.25625","ach":"Em benchmarks financeiros e científicos, nenhum pipeline fixo de recuperação domina: o mais preciso é inviável em latência, o mais rápido perde evidência. O roteador por consulta oferece um ponto mais preciso e 12,4 vezes mais rápido que o melhor pipeline estático (2,5% de ganho de acurácia), superando métodos adaptativos anteriores em nDCG@5 nos cenários de acurácia.","pn":"Roteamento por consulta entre pipelines de recuperação heterogêneos","pm":"Um roteador leve treinado só com o texto da consulta decide, por requisição, qual pipeline de recuperação (denso ou late-interaction, textual ou multimodal) atenderá aquela consulta, expondo a troca precisão-latência em um único parâmetro ajustável.","imp":"Em vez de escolher um único pipeline de busca para todo o tráfego, você pode despachar cada consulta ao pipeline mais barato que resolve aquela consulta — consultas simples vão para o recuperador denso barato, e apenas as difíceis pagam o custo do late-interaction, com um único parâmetro para calibrar onde fica seu corte entre custo e qualidade.","ex":"Numa ferramenta de due diligence que busca em relatórios financeiros digitalizados, um pipeline denso rápido falha em recuperar o número em uma tabela no meio de um PDF complexo; o roteador direciona as consultas sobre tabelas para o pipeline late-interaction multimodal e manda o resto do tráfego para o denso, derrubando a latência média sem perder as respostas baseadas em tabelas.","res":"Os ganhos vêm de benchmarks financeiros e científicos com pipelines de recuperação específicos; nada prova que o roteador generaliza para outros domínios ou que a vantagem persiste quando a mixagem de consultas difíceis muda muito. E o roteador precisa ser treinado para o seu conjunto de pipelines e distribuição de consultas — não é um artefato de plugar."},{"p":"2608.26005","ach":"Sob recuperação top-5, o banco informativo supera sistemas como Mem0 em top-200 por quase 30 pontos. O banco afetivo com modelagem de persona em dois nós ganha 4,29 pontos agregados sobre o melhor sistema anterior em três benchmarks de persona. A recuperação completa em 134 ms, dentro da janela típica de latência de detecção de atividade de voz.","pn":"Memória paralela informativa e afetiva com E/S em streaming","pm":"A arquitetura mantém dois bancos de memória independentes — um para fatos recuperáveis e outro para atribuição afetiva ao longo do tempo — consultados em streaming durante a fala, com limite de latência alinhado ao detector de atividade de voz, e backends de memória intercambiáveis.","imp":"Se você mantém memória de conversa como um único banco consultado fora do fluxo de fala, vale dividir em duas camadas — fatos e estado emocional — e medir a recuperação contra a janela de latência da sua interface, não contra um orçamento genérico de backend.","ex":"Um assistente de voz duplex que hoje recupera histórico antes de responder atrasa a resposta do usuário; com recuperação em streaming durante a própria fala do usuário (134 ms), o atraso some, e o registro afetivo separado impede que o assistente responda a uma reclamação irritada como se fosse uma pergunta neutra.","res":"Os números vêm do sistema completo com treino sensível à memória dos modelos de fala dos autores; a arquitetura de memória em si é reproduzível, mas os ganhos de persona e precisão não foram demonstrados com modelos de linguagem textuais comuns nem com backends de memória distintos dos testados pelos autores."},{"p":"2608.25500","ach":"Em doze combinações de modelo e benchmark (seis backbones LLM em ALFWorld ID-140 e ScienceWorld U211), CaSKG obteve a maior pontuação de tarefa em todas. Contra Graph-of-Skills, eleva a média macro de ScienceWorld de 72,62 para 80,50 e o sucesso em ALFWorld de 80,01% para 86,79%, reduzindo também os passos médios de ambiente. Ablações mostram que arestas calibradas preservam pré-requisitos, ações que mudam estado e rotinas de verificação.","pn":"Calibração de arestas de grafo de habilidades por sondas contrafactuais","pm":"Um grafo candidato de relações entre habilidades é construído com alta revocação e, em seguida, cada aresta é calibrada por sondas textuais contrafactuais que removem, substituem e reordenam pares de habilidades, agregando a evidência com suavização bayesiana antes da recuperação.","imp":"Se seu agente busca habilidades em uma biblioteca por similaridade vetorial, trate as relações entre habilidades como hipóteses a testar antes de confiar nelas: construa o grafo offline, teste cada aresta removendo ou reordenando os pares e só publique as arestas que sobreviverem. Isso reduz o custo de contexto sem perder cobertura de fluxo de trabalho.","ex":"Um agente de automação de tarefas em ScienceWorld precisa executar uma sequência em que aquecer um objeto exige ligar o equipamento antes. Com recuperação vetorial, a habilidade de aquecer é recuperada como texto independente e o passo de ligar o equipamento fica fora do contexto, forçando passos extras ou falha; com arestas calibradas, o pré-requisito entra junto na expansão do grafo.","res":"A validação é em dois benchmarks de agentes com tarefas procedurais simuladas; não prova que a calibração por sondas contrafactuais se transfira a bibliotecas de habilidades em domínios abertos ou a código de produção. O grafo é construído offline, então habilidades novas exigem reconstrução, e o ganho depende de a relevância estar nas arestas, não no texto das habilidades."},{"p":"2608.26530","ach":"Em seis configurações (dois modelos congelados, três benchmarks), o harness ficou em primeiro em cinco. No Terminal-Bench 2.0 supera harnesses concorrentes em até 9,8 pontos percentuais. No modo de autoaperfeiçoamento ganha 14,6 e 12,4 pontos, com queda de 42,9% e 47,4% nos tokens de saída e mais que o dobro de avaliações bem-sucedidas por milhão de tokens.","pn":"Supervisor separado que redireciona o worker durante a execução","pm":"Um supervisor com contexto próprio observa a trajetória do worker em tempo real e pode abortar ou redirecionar a execução ativa, enquanto destila falhas em skills reutilizáveis.","imp":"Se você roda agentes em tarefas longas, separe a avaliação da execução: um supervisor com contexto próprio, que acompanha a trajetória e pode abortar ou redirecionar o worker no meio da execução, evita gastar tokens num caminho que já falhou. Guarde as falhas como procedimentos reutilizáveis em vez de deixá-las morrer no log da sessão.","ex":"Um agente de migração de código que passa 40 minutos editando arquivos com uma abordagem errada: um supervisor que lê a trajetória em tempo real detecta o desvio e aborta antes do gasto total, e a falha vira uma skill que impede a repetição na próxima tarefa.","res":"Os ganhos vêm de benchmarks de terminal e de dois modelos específicos; não há evidência de que o ganho se sustente em domínios onde a avaliação do supervisor é menos confiável que a execução. O supervisor também adiciona custo de tokens que os números agregados não isolam."},{"p":"2608.26993","ach":"Em 20 tarefas e varias combinacoes editor-MLLM, ganhos de intermediarios visuais concentram-se em injecao de pista visual, grounding e realizacao de estados contrafactuais; construcao sensivel a simbolos e extrapolacao estrutural falham. No subconjunto positivo, o pipeline Qwen sobe de 0.343 para 0.445 no escore medio. Tarefas filtradas e malsucedidas sao mantidas para expor o limite.","pn":"Diagnostico em circuito fechado de intermediarios visuais gerados por editor de","pm":"Avalia simultaneamente raciocinio direto, raciocinio com intermediario gerado pelo editor e com intermediario idealizado, separando o potencial visual da tarefa da capacidade real do editor de realizar a transformacao.","imp":"Antes de plugar um editor de imagem como etapa intermediaria do seu pipeline multimodal, rode as tres condicoes do diagnostico: se o intermediario idealizado nao melhora a tarefa, o problema nao e o editor, e a tarefa nao se beneficia desse caminho. Isso evita gastar engenharia num elo inutil.","ex":"Um assistente que edita capturas de tela para responder perguntas sobre UI: pedir ao editor para inserir um cursor realcado (injecao de pista visual) tende a funcionar; pedir para ele redesenhar a tela com um menu adicional extrapolado (extrapolacao estrutural) produz intermediarios nao fiis que degradam a resposta.","res":"Os ganhos vem de um subconjunto positivo selecionado de tarefas; fora dele a utilidade e baixa ou nula. O padrao nao vale como mecanismo universal de raciocinio, e os resultados dependem das combinacoes especificas editor-MLLM testadas, sem garantia de transferencia para outros pares."},{"p":"2608.27454","ach":"Em múltiplos benchmarks e modelos, o framework supera métodos de evolução de skills estado-da-arte e baselines sem skill na maioria das combinações. Skills evoluídas transferem entre modelos e famílias, e skills de outros modelos podem superar as auto-evoluídas. Ablations mostram que a wiki persistente é componente crítico: sem ela, a evolução de skills degrada.","pn":"Separação de experiência bruta, wiki persistente e skills executáveis","pm":"O framework consolida continuamente o histórico de execução do agente em uma base de conhecimento persistente, e as atualizações de skills passam a se apoiar nessa base consolidada em vez de nos registros brutos.","imp":"Se você mantém um agente que melhora com o uso, pare de tratar cada execução como log descartável: acumule o que foi aprendido em uma base de conhecimento separada e faça as atualizações de prompts e skills consultarem essa base. Isso reduz retrabalho de iteração e permite reaproveitar skills ajustadas por um modelo maior em um menor, cortando custo.","ex":"Um agente de suporte que refina prompts de resolução de tickets a cada ciclo: hoje os insights ficam presos no histórico de otimização e se perdem entre iterações; com a wiki persistente, a lição de um tipo de ticket resolvido alimenta as skills dos próximos, inclusive quando o modelo de inferência é trocado.","res":"Os ganhos são medidos nos benchmarks e modelos do paper; a transferência entre modelos não garante que skills evoluídas em um domínio específico do leitor transfiram sem reevolução. O paper não publica o código, então a reprodução depende da descrição da arquitetura."},{"p":"2608.26070","ach":"Manter apenas o prefixo e os últimos milhares de tokens do raciocínio deixa modelos existentes 3x mais rápidos sem treino e sem perda de desempenho. Com reinforcement learning sobre essa configuração, o modelo escala raciocínios para além de cem mil tokens com desempenho superior. Ablations mostram que a abordagem supera resumir tokens intermediários ou usar janela deslizante simples.","pn":"Descarte de tokens intermediários mantendo prefixo e janela recente no raciocín","pm":"Durante o raciocínio, o modelo mantém apenas o prefixo com instruções e ferramentas e a janela dos últimos milhares de tokens, descartando os tokens intermediários, o que limita a memória de atenção independentemente do comprimento do raciocínio.","imp":"Você pode cortar o meio do histórico de raciocínio em vez de pagar memória crescente a cada passo: mantenha as instruções e ferramentas no começo e a janela recente, e descarte o resto. Em um agente que raciocina por dezenas de milhares de tokens, isso derruba o custo de memória sem trocar de modelo nem retreinar nada.","ex":"Um agente de código que resolve tarefas longas acumulando traços de raciocínio de cem mil tokens estoura a memória de atenção da engine de inferência. Com essa política, o traço fica limitado ao prefixo de instruções mais a janela recente, e a memória deixa de crescer com o comprimento do raciocínio.","res":"O ganho de 3x sem treino vale para os modelos e tarefas testados; traços muito longos com ganho adicional exigem retreino com reinforcement learning, que está fora do alcance de quem só usa modelos prontos. Descartar tokens intermediários pode perder informações que tarefas com dependências distantes no raciocínio precisam."},{"p":"2608.27455","ach":"Incorporar falhas típicas de modelos menores da mesma família como exemplos de crítica no contexto melhora o raciocínio do modelo maior, superando in-context learning padrão e rivalizando com test-time scaling. Isso ocorre com menos gerações e menor custo em tokens. Há duas variantes: uma que prevê os modos de falha específicos da entrada e outra que usa um perfil global de falhas.","pn":"Falhas de modelos fracos como críticas no contexto","pm":"Padrões estruturados de erro de modelos menores da mesma família são convertidos em exemplos de crítica inseridos no contexto do modelo maior no momento da inferência.","imp":"Antes de gastar com múltiplas gerações ou verificadores externos, rode o modelo menor da sua família nas suas tarefas, catalogue como ele erra e insira esses erros comentados no prompt do modelo maior. É um ganho de acurácia que você paga em tokens de contexto, não em chamadas extras.","ex":"Em um pipeline de extração de dados de contratos, o modelo menor confunde sistematicamente cláusulas de rescisão com cláusulas de renovação; incluir esse erro rotulado como falha nos exemplos do prompt do modelo maior ensina-o a evitar a confusão sem gerar três respostas e escolher a melhor.","res":"O ganho depende de os modos de falha serem estruturados e compartilhados dentro da mesma família de modelos; entre famílias distintas o padrão pode não transferir. Os resultados são validados em benchmarks de raciocínio, e não está demonstrado que funciona igualmente bem em tarefas produtivas fora desse domínio."},{"p":"2608.24804","ach":"Em três ambientes empresariais (SRE, ITSM, finanças), a evolução do harness elevou o desempenho em 20 a 35 pontos percentuais sobre o harness padrão, com apenas 4 a 12 mudanças aceitas. Os ganhos persistem em tarefas excluídas da evolução e transferem entre famílias GPT e Qwen sem nova evolução. As trajetórias ficam mais curtas e com menos diagnósticos falsos positivos.","pn":"Evolução de harness de agente com pesos congelados","pm":"Um pipeline de busca propõe mudanças no harness (prompts, ferramentas, subagentes, loop do agente) a partir de um pool estratificado por comportamento de falha, valida em tarefas ocultas ao proponente e preserva um conjunto held-out para medir generalização, sem retreinar o modelo.","imp":"Antes de pagar por modelo maior ou fine-tuning, você pode atacar a incompatibilidade entre modelo e ambiente ajustando a camada ao redor do modelo: descrição das ferramentas, convenções do domínio e divisão em subagentes. Se um agente erra repetidamente em ferramentas internas, rode um ciclo de ajuste do harness validando em tarefas separadas das que guiaram o ajuste.","ex":"Um agente de SRE que investiga incidentes via APIs de observabilidade acumula diagnósticos falsos positivos porque a interface das ferramentas não reflete as convenções do ambiente; a evolução do harness repara essas interfaces e comprime o conhecimento operacional, encurtando a trajetória de investigação.","res":"Os ganhos foram medidos em três benchmarks empresariais específicos; não há evidência de que a mesma rotina de evolução funcione em domínios sem falhas de baseline bem definidas para estratificar. O processo de evolução em si consome tarefas rotuladas e execuções de referência, custo que o paper não quantifica em termos de esforço humano."},{"p":"2608.25697","ach":"Em Qwen3-4B, o LMSM-Checkpoint reduz a taxa de sucesso de ataques do HarmBench de 39,20% para 3,32%, com falsas recusas no XSTest subindo de 2,40% para 4,40%. O mesmo substrato hospeda backends distintos (SAE, transcoders e probes densos) e mantém 98,14% da throughput de um caminho de serving sem monitoramento, com 32 sequências ativas. As decisões por requisição se preservam sob churn do scheduler e múltiplas regras compõem por requisição.","pn":"Separação entre evidência, política e liberação de saída na camada de segurança","pm":"Um backend expõe evidência calibrada, uma política versionada avalia regras sobre contexto confiável por requisição e um gate separado autoriza a liberação do buffer de saída, desacoplando correção da mediação da eficácia da política.","imp":"Se hoje cada sinal de interpretabilidade que você coloca em produção vem com seu próprio código de intervenção e calibração acoplados, você pode reorganizar o caminho de resposta em três peças separadas: coleta de evidência, avaliação de regras e liberação do texto. Trocar o detector ou ajustar a regra deixa de exigar mexer no código do servidor, e adicionar um segundo sinal deixa de ser um projeto novo de integração.","ex":"Um serviço de chat com vLLM em batching contínuo que usa um sparse autoencoder para detectar prompts de jailbreak: sem a separação, o detector, o limiar e o código que bloqueia a resposta ficam colados no handler de requisições, e trocar o detector por um probe denso significa reescrever esse handler. Com a separação, o mesmo handler continua
