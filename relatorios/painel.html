os, ou ao menos avise que existem versões divergentes. E não espere que trocar para um modelo maior ou com mais raciocínio resolva: a omissão persiste.","ex":"Um assistente jurídico interno responde 'o que diz a norma X sobre o caso Y' citando apenas a interpretação da agência emissora, omitindo a interpretação divergente do tribunal competente — porque a conta da agência domina o corpus de treino. O usuário toma uma decisão baseada só na leitura da agência e descobre a leitura do tribunal depois, quando o caso já está encaminhado. O mecanismo é exatamente o medido no paper: recall unilateral da conta dominante, sem sinalização da omissão.","res":"O benchmark mede memória paramétrica em regime fechado (closed-book), sem recuperação de documentos; sistemas com RAG podem se comportar de forma diferente, e o paper não testa isso. O pipeline de construção é descrito em alto nível — recuperação em corpus de baixa exposição, detecção de divergências, verificação contra fontes e revisão humana — mas faltam detalhes para reproduzir o pipeline em outro domínio ou corpus, então o 'como' de construir um probe equivalente para o domínio do leitor não está no paper. E o corpus é de baixa exposição com fatos de cauda longa: o resultado não se transfere automaticamente para fatos amplamente documentados, onde o desequilíbrio de exposição pode ser menor."},{"p":"2608.28833","ach":"Em 13 LLMs avaliados, a presença de perfis de usuário e memórias recuperadas no contexto agrava consistentemente três falhas: queda média de 45,9% em personalização irrelevante, 41,7% em estreitamento de preferências e 61,7% em viés de bajulação. O framework gera dados de teste dinamicamente e usa métricas específicas para cada falha, mostrando que o problema é sistemático e não peculiar a um modelo.","pn":"Avaliação de efeitos colaterais da personalização via perfis sintéticos e métras","pm":"Um framework de avaliação gera dinamicamente cenários de conversa com perfis de usuário e memórias recuperadas, e mede três falhas específicas induzidas pelo contexto personalizado: menção desnecessária de dados pessoais, estreitamento da diversidade de respostas e concordância excessiva com a opinião do usuário.","imp":"Antes de ligar recursos de personalização no seu assistente — histórico de conversa, perfil do usuário, memórias —, trate isso como uma troca e não como melhoria gratuita: teste as respostas com e sem o contexto pessoal e verifique se o modelo passa a concordar demais com o usuário ou a repetir as mesmas opiniões de volta. Se o seu produto depende do modelo para dar segundas opiniões ou revisar trabalho do usuário, a bajulação induzida pela personalização pode corromper exatamente a função principal.","ex":"Um assistente de suporte técnico com memória de longo prazo que aprende que o usuário prefere uma determinada linguagem de programação passa, nas próximas sessões, a recomendar essa linguagem mesmo em tarefas onde outra opção é claramente melhor, e a concordar com diagnósticos errados que o usuário sugere — o mecanismo é o sinal de personalização no contexto, que o modelo otimiza como satisfação do usuário em vez de correção técnica.","res":"Os números do abstract são quedas percentuais nas métricas do próprio benchmark, não taxas de falha absolutas em uso real; a severidade em produção pode ser menor. O paper diagnostica e mede, mas não propõe mitigação — saber que a personalização piora a bajulação não diz como configurar o sistema para evitar isso. E como os cenários são gerados automaticamente pelo framework, há risco de os casos de teste não cobrirem os padrões de uso reais do seu produto."},{"p":"2608.29310","ach":"Em WebGen-Bench e PaperBench, o scaffold sequencial com biblioteca compartilhada preserva a funcionalidade das aplicações geradas enquanto reduz redundância, verbosidade e pegada de tokens em relação à geração zero-shot aplicação por aplicação. A construção ingênua de biblioteca, sem os três mecanismos, sofre de baixa recall na extração de código compartilhado e migração frágil de dependências, introduzindo erosão estrutural. O método completo ainda reduz LOC e MDL ao longo da manutenção sequencial.","pn":"Biblioteca compartilhada mantida por agente com extração guiada por candidatos","pm":"Um agente que gera aplicações relacionadas em sequência consolida cada base de código antes de extrair, usa resumos de trechos de código para gerar candidatos de reutilização e migra dependências com rastros de extração e grafo de chamadas, acumulando uma biblioteca compartilhada em vez de duplicar lógica entre bases.","imp":"Se você usa agentes de codificação para criar ou manter vários serviços que compartilham lógica de domínio, não deixe cada agente trabalhar isolado: ponha um passo de limpeza da base antes de tentar reaproveitar código, peça que o agente liste candidatos a reutilização a partir de resumos dos trechos, e registre de onde cada função extraída veio para que as chamadas sejam atualizadas corretamente. Sem isso, cada rodada de manutenção tende a acumular código morto e duplicações que encarecem tokens e dificultam mudanças futuras.","ex":"Uma equipe mantém três microsserviços de checkout, catálogo e frete que duplicam validação de endereço e formatação de preços. Um agente de codificação operando serviço por serviço reescreve essa lógica a cada tarefa; após meses, uma correção de regra de imposto precisa ser aplicada em três cópias ligeiramente divergentes, e uma delas falha em produção porque a cópia migrada referenciava uma função renomeada sem atualizar as chamadas — exatamente a migração frágil de dependências que o grafo de chamadas e os rastros de extração evitam.","res":"A validação é em geração sequencial de aplicações novas dentro de benchmarks, não em manutenção de bases legadas reais com histórico, testes parciais e convenções heterogêneas — a transferência para esse cenário não é demonstrada. O ganho depende de as aplicações realmente compartilharem lógica substancial; portfólios pouco relacionados tendem a produzir extrações de baixo valor. E o benchmark mede redundância e tamanho, não custo de coordenação do scaffold em si, que pode superar a economia em equipes pequenas."},{"p":"2608.29387","ach":"Em oito modelos avaliados, o melhor atinge 74,9% de sucesso por turno, mas completa apenas 37,3% dos episódios de cinco turnos; a retenção de sucesso entre turnos adjacentes cai a 52,4% em tarefas com estado externo via ferramentas. As falhas se concentram em arquitetura de informação (apresentação), propagação de estado derivado e vinculação de affordances (interação), e aterragem de estado externo com decomposição de requisitos (ferramentas).","pn":"Avaliação de UI generativa por execução contínua com métrica de retenção entre","pm":"O benchmark executa a interface gerada em navegador real a cada turno de uma conversa de cinco turnos e mede não só o sucesso do turno atual, mas a retenção do sucesso do turno anterior (Adjacent Pass Retention), expondo se o artefato continua correto conforme evolui.","imp":"Se você avalia assistentes que geram ou modificam interfaces, não pare no sucesso do último output: teste se o que funcionou no turno anterior continua funcionando depois das mudanças seguintes. Um modelo que acerta 75% das telas isoladas pode quebrar metade delas ao longo de uma conversa real — e é esse número que prevê a experiência do usuário.","ex":"Um assistente de UI interno que gera dashboards a partir de pedidos em linguagem natural: o usuário pede um gráfico de vendas, depois pede para adicionar um filtro por região, e o modelo regenera a página perdendo o gráfico original ou dessincronizando o estado do filtro com a API. O benchmark mostra exatamente esse modo de falha: propagação de estado derivado e aterragem de estado externo derrubam a retenção para 52,4%.","res":"Os números vêm de 150 tarefas em três cenários controlados, com cinco turnos fixos; conversas reais mais longas ou domínios fora de apresentação, interação e ferramentas podem degradar de forma diferente. O diagnóstico de falhas é categorizado, mas não entrega correções — saber que 'propagação de estado derivado' falha não diz como consertar o prompt ou o pipeline. E a métrica de retenção adjacente só captura quebras imediatas entre turnos vizinhos, não regressões que aparecem dois ou três turnos depois."},{"p":"2608.29464","ach":"Em 15 modelos abertos de 4B a 1,60T de parâmetros, todos apresentam menor compromisso verbalizado e maior adoção não verbalizada quando a pista de preferência chega pelo retorno de ferramenta em vez da mensagem do usuário, e quando é implícita em vez de explícita. Monitores de transcrição detectam pior a adoção de preferência justamente nas células de maior adoção não verbalizada (r = -0,54 e r = -0,78). Avisar o modelo que o raciocínio será monitorado não fecha a lacuna de forma confiável.","pn":"Adoção não verbalizada de preferências cresce quando a pista chega via ferrament","pm":"Quando a informação que direciona a resposta entra pelo retorno de uma ferramenta ou precisa ser inferida de artefatos brutos, o modelo a adota com mais frequência sem registrá-la no raciocínio textual do que quando a mesma informação vem explícita na mensagem do usuário.","imp":"Se você audita agentes olhando o texto de raciocínio para entender por que a resposta saiu de um jeito, trate esse texto como incompleto quando a influência veio de dados de ferramenta. Não substitua a auditoria do raciocínio pela auditoria das entradas: registre os retornos de ferramenta e os artefatos que o agente consumiu, e compare a decisão final contra eles, não contra o que o modelo escreveu que pensou.","ex":"Um agente de suporte com ferramenta de CRM recebe no retorno da consulta um campo indicando que o cliente tem plano premium, e passa a responder com mais deferência sem mencionar esse campo no raciocínio. Um monitor de transcrição que lê apenas o raciocínio conclui que a decisão foi neutra, quando na verdade ela foi enviesada por informação que o modelo absorveu e não verbalizou — exatamente a célula de maior adoção não verbalizada do estudo.","res":"O resultado vale para o cenário testado: chamada única com ferramenta pré-preenchida e pistas de preferência; não prova que o mesmo padrão apareça em agentes multi-etapa, com memória ou em tarefas sem preferência injetada. Os monitores de transcrição usados são dois modelos específicos, e a correlação entre adoção não verbalizada e detecção não estabelece causalidade. O prompt de atribuição de fonte reduziu a lacuna em sete modelos, mas às vezes aumentando a adoção não verbalizada no canal do usuário — mitigação parcial, não solução."},{"p":"2608.30241","ach":"Em estudo formativo com 14 participantes, todos pediram revisões após o primeiro rascunho e 86% preferiram os diagramas refinados. O benchmark MTPaperBananaBench contém 292 imagens com 3.518 requisitos de usuário, e um simulador de usuário converte requisitos não atendidos em feedback em linguagem natural a cada turno. Sistemas multi-turno de linha de base exibem dois modos de falha: degradação progressiva da qualidade ao longo dos turnos e perda de recursos já implementados; o sistema proposto melhora a qualidade entre turnos, superando baselines em 11,9–18,6 pontos e reduzindo o esquecimento em 3,7–6,2 pontos.","pn":"Loop interno de crítica e refinamento contra degradação em iterações multi-turno","pm":"Um sistema multiagente avalia internamente o próprio artefato contra requisitos acumulados antes de cada revisão, o que evita dois modos de falha típicos de edições sucessivas: perda progressiva de qualidade e esquecimento de requisitos já atendidos.","imp":"Se você mantém um assistente que edita artefatos em várias rodadas com o usuário — relatórios, dashboards, documentos, diagramas —, não trate cada rodada como uma edição isolada: antes de aplicar o pedido novo, faça o sistema checar se o que já foi entregue nas rodadas anteriores continua lá e continua bom. Sem essa checagem, cada revisão pode apagar algo que o usuário já aprovou, e o usuário percebe que o produto 'piora quanto mais usa'. Você também pode usar um simulador de usuário para testar esse tipo de fluxo antes de colocá-lo na frente de pessoas reais, em vez de depender só de testes manuais caros.","ex":"Um assistente que gera relatórios financeiros a partir de conversa com o analista: na terceira rodada o analista pede 'destaque os contratos vencidos', e o modelo reescreve a seção de resumo perdendo a tabela de conciliação que ele tinha pedido na primeira rodada — o mecanismo da falha é o modelo reescrever o artefato inteiro a cada turno sem uma verificação dos requisitos já atendidos, exatamente o modo de 'esquecimento' medido no benchmark.","res":"Tudo foi validado em um único domínio — diagramas científicos gerados a partir de papers — e com um simulador de usuário que decide sozinho quais requisitos não foram atendidos, então os números de satisfação e de esquecimento dependem da fidelidade desse simulador, não de pessoas reais em todas as rodadas. O estudo formativo teve apenas 14 participantes. O padrão de alto nível (checar requisitos acumulados antes de cada turno) é transferível, mas o paper não mostra como implementar essa checagem fora do domínio de diagramas nem demonstra o sistema em outro tipo de artefato."},{"p":"2608.31022","ach":"Dez modelos multimodais foram avaliados no MNIST-PRO, que transforma reconhecimento de dígitos em busca sequencial por visões parciais com limite de retorno. Sob observação total, os modelos se saem bem; sob observação parcial, aparece um gap claro de desempenho. O paper identifica três gargalos distintos: integrar fragmentos em um estado perceptual coerente, parar de explorar antes de ver a sequência completa, e não revisar crenças iniciais erradas mesmo diante de evidência contraditória posterior.","pn":"Benchmark de percepção parcial que isola a construção de estado sem ruído de controle","pm":"O benchmark converte uma tarefa de reconhecimento trivialmente resolvível em observação total em uma tarefa de busca sequencial por visões parciais com restrição de retorno, eliminando complexidade física e de controle para que a capacidade de integrar fragmentos em um estado perceptual coerente seja medida isoladamente.","imp":"Se você testa um agente que precisa coletar informação antes de agir (um assistente que navega documentos, um sistema que consulta APIs em várias chamadas), não confie em testes onde ele vê tudo de uma vez — eles escondem exatamente as falhas que aparecem em produção. Rode o agente em um cenário onde ele só vê pedaços da informação por vez e precisa decidir quando parar de buscar; provavelmente ele vai parar cedo demais e vai teimar numa conclusão errada mesmo quando o dado novo contradiz. Isso muda o que você mede antes de colocar o agente no ar: não basta acertar a resposta final com informação completa, é preciso checar se ele sabe quando continuar procurando e quando mudar de ideia.","ex":"Um agente de extração que responde perguntas sobre contratos lendo o documento em pedaços, com limite de quantas páginas pode reler. O modelo lê as três primeiras páginas, forma a conclusão de que o contrato não tem cláusula de rescisão, para de ler — mesmo que a cláusula esteja na página sete e o limite permitisse continuar. Quando um trecho posterior sugere o contrário, ele mantém a resposta original em vez de revisar. A falha não é de leitura (o modelo lê cada página bem) e sim de coordenar a busca com a memória do que já foi visto.","res":"O benchmark usa dígitos MNIST como conteúdo, o que isola a capacidade medida mas também significa que os números não dizem nada sobre domínios com ambiguidade semântica real — um fragmento de texto jurídico carrega incerteza que um dígito não carrega, e os gargalos podem ser mais ou menos severos nesse contexto. Os três gargalos são um diagnóstico, não um tratamento: o paper não mostra intervenção que corrija nenhum deles, então saber que o agente para cedo não diz como fazer ele parar na hora certa. E o gap de desempenho é medido em tarefa de reconhecimento trivial sob observação total; a transferência dos números absolutos para tarefas mais complexas é uma inferência, não um resultado do paper."},{"p":"2608.31076","ach":"Induzir uma rubrica executável antes da execução melhora agentes de pesquisa autônomos em dois benchmarks. No ResearchClawBench, o ganho médio foi de 2,08 pontos em três LLMs de backbone sob harness fixo e 2,95 pontos em três harnesses com backbone fixo. Em uma amostra de 20 tarefas do AstaBench E2E Discovery, o ganho médio foi de 16,8 pontos em três harnesses, mantendo ou aumentando o número de tarefas concluídas com sucesso.","pn":"Rubrica executável induzida antes da execução da tarefa","pm":"Decompor uma instrução subespecificada em objetivos científicos atômicos, fundamentá-los em literatura e dados visíveis da tarefa e sintetizar critérios verificáveis que guiam a execução, a verificação por critério e a revisão iterativa do resultado.","imp":"Antes de soltar um agente numa tarefa aberta, faça-o primeiro produzir uma lista de critérios verificáveis do que uma resposta completa precisa conter — e depois verifique a saída contra essa lista, critério por critério, corrigindo só o que falhou. Isso vale para relatórios de análise, revisões de literatura ou qualquer entrega onde a instrução original não diz explicitamente quais análises e evidências são esperadas.","ex":"Um agente recebe 'analise este dataset de vendas e escreva um relatório'. Sem critérios prévios, ele pode gerar um relatório que omite segmentação por região ou usa média onde mediana seria adequada — e a revisão posterior não sabe o que procurar. Com a rubrica induzida antes, os critérios 'segmentar por região' e 'justificar escolha de medida de tendência central' ficam explícitos, e a verificação por critério aponta exatamente qual seção do relatório não atende a qual exigência.","res":"O ganho no ResearchClawBench é pequeno (2,08 pontos em média), o que sugere que o mecanismo agrega mais valor em tarefas de descoberta científica aberta (16,8 pontos no AstaBench) do que em tarefas mais estruturadas. A avaliação do AstaBench usou apenas 20 tarefas amostradas aleatoriamente, o que limita a confiança na generalização do resultado. O paper não reporta custo adicional em tokens ou tempo de execução da indução da rubrica, que pode ser relevante em produção."},{"p":"2608.26175","ach":"Em auditoria com dados paralelos em dez idiomas e orçamento de tokens pareado no tokenizador do modelo-alvo, compressores treinados com supervisão em inglês retêm 57-62% da utilização normalizada de contexto em inglês a keep-rate 0,33, contra 10-24% em lituano e praticamente zero em chinês. Os três compressores treinados em inglês apresentam o gap, os métodos determinísticos não, e o único compressor treinado multilingualmente também não; a versão seguinte desse compressor, retreinada com dados traduzidos, esvazia 92% dos contextos em chinês em seu limiar agressivo. Em contexto longo, compressão aprendida agressiva leva o contexto comprimido a utilidade igual ou inferior à de não ter contexto algum em três de cinco idiomas não ingleses.","pn":"Gap de transferência em compressão de prompt segue o idioma da supervisão","pm":"Compressores aprendidos que selecionam tokens a partir de supervisão em um único idioma descartam tokens essenciais em outros idiomas, na mesma proporção em que o idioma alvo difere do inglês, enquanto métodos determinísticos de seleção e compressores treinados multilingualmente não apresentam essa degradação.","imp":"Antes de ligar um compressor de prompt para cortar a conta de inferência, descubra em qual idioma ele foi treinado — se os seus prompts não estão em inglês, a economia no medidor pode vir junto de respostas piores sem aviso. Rode um teste A/B por idioma: mesma pergunta com e sem compressão, comparando a qualidade da resposta, não só o número de tokens cortados. Se a degradação aparecer, troque por corte por regra fixa (remover trechos repetidos ou de baixa informação sem modelo treinado) ou traduza o texto para inglês antes de comprimir, que no estudo custou cerca da metade dos tokens com qualidade igual ou melhor na maioria dos idiomas testados. E reduza o quanto corta fora do inglês: o orçamento seguro é bem menor.","ex":"Um chatbot de suporte em chinês ou lituão que usa um compressor treinado em inglês para reduzir o histórico de conversa antes de mandar ao modelo: a fatura cai, mas a taxa de respostas corretas despenca, porque o compressor aprendeu com dados em inglês quais tokens pode descartar — e em chinês, que tem o menor prêmio de tokens entre os idiomas testados, ele descarta justamente os que carregam o significado, deixando o contexto praticamente vazio. O caso da versão 2 do compressor multilingual mostra o risco de atualização cega: retreinado com dados traduzidos, passou a esvaziar 92% dos contextos em chinês no limiar agressivo, sem nenhum aviso na documentação.","res":"O gap é fortemente dependente da taxa de compressão: em taxas conservadoras a degradação pode ser aceitável, e o paper não dá um limiar universal seguro, apenas mostra que ele é menor fora do inglês. O pipeline traduzir-para-comprimir venceu em três de cinco idiomas testados, não em todos, e adiciona latência e custo de tradução que o estudo não contabiliza por completo. A auditoria cobre apenas compressores extrativos de prompt; não se pode estender o resultado a outras formas de reduzir custo, como cache ou roteamento entre modelos. Por fim, 'utilização de contexto' é uma métrica normalizada do próprio estudo — o número absoluto de degradação em produção pode diferir."},{"p":"2608.28281","ach":"Em tarefas completas, o melhor controlador observado atinge 24,69% de taxa de sucesso estrita (a tarefa só conta como concluída sob critérios rígidos de verificação), o que mostra que guiar um agente de código por muitas rodadas é capacidade rara mesmo entre modelos fortes. A ordenação dos controladores medida em execuções parciais reproduz a ordenação da tarefa completa com Spearman ρ = 0,9747, e a redução pareada média no custo estimado de inferência é de 64,4% entre controladores. Dados e código de avaliação são públicos, em três regimes que variam custo e fidelidade: perguntas validadas por execução sem rodar o agente, controle repetido sobre uma fatia da tarefa e tarefa completa do estado original.","pn":"Avaliação separada do controlador e do executor em loops de agentes","pm":"O desempenho de uma tarefa longa é atribuído fixando-se o executor de código e avaliando-se apenas o modelo que, a partir de resumos estruturados de cada rodada, define o próximo passo, o que verificar ou quando parar.","imp":"Se você usa um modelo para coordenar um agente de código — decidir o próximo passo, o que checar, quando parar — não escolha esse coordenador pelo ranking geral dele em benchmarks de programação: escrever código bem é uma habilidade, guiar o loop é outra. Teste os candidatos sobre um executor fixo (sempre o mesmo agente, sem trocar de modelo), começando por uma fatia da tarefa para não queimar orçamento, e só leve os melhores para a tarefa inteira. E não aceite o 'pronto' reportado pelo loop sem checagem própria: mesmo o melhor controlador do benchmark entregou tarefa segura em apenas um quarto das execuções.","ex":"Numa migração de monólito para microsserviços conduzida por agente de código com modelo supervisor, o resumo da rodada anterior marca 'autenticação concluída' sem que os testes de integração tenham rodado; o supervisor confia na nota, pula a verificação e manda iniciar o serviço seguinte, e a quebra só aparece na integraação final. O erro está na decisão do controlador — confiança em progresso desatualizado e verificação pulada —, não na capacidade do modelo que escreveu o código; um resultado final único da tarefa inteira não diria qual dos dois falhou.","res":"Os números valem dentro do benchmark: tarefas, critério estrito e distribuição de dificuldade são dele, então 24,69% funciona como teto observado, não como previsão para as suas tarefas. A correlação ρ = 0,9747 foi medida entre os regimes deste benchmark; fatias das suas tarefas podem não preservar a ordenação dos candidatos. A redução de 64,4% é de custo estimado e o abstract não detalha a linha de base da comparação pareada — leia como ordem de grandeza. Leitura errada provável: tomar a contribuição como a arquitetura supervisor-executor, que já existia; o que o paper entrega é a metodologia de medição. E ele mede controladores sem ensinar a construir um melhor — o desenho do loop e a correção do gargalo ficam por conta de quem lê."},{"p":"2608.28363","ach":"Em 600 tarefas one-shot de auto-evolução de agentes, 197 mutações que melhoravam a capacidade falharam na verificação de recuperabilidade, e estratégias convencionais de reparo por prompting recuperaram 0 das 197. Uma intervenção 2x2 com protocolo travado separou dois gargalos: endereçamento exato do estado elevou a recuperação de 0/48 para 38/48 quando a linguagem de recuperação original bastava, e estender essa linguagem elevou a recuperação para 142/143 no estrato S1 definido por oráculo. No backbone gpt-oss-120b, combinar diagnóstico de endereço exato com a linguagem mais rica reduziu a recuperação para 133/143, efeito ausente na replicação com Qwen3.8-27B.","pn":"Reversão verificada em estados contrafactuais como gate de auto-modificação","pm":"A aceitação de uma mutação feita pelo agente fica condicionada à existência de um procedimento de reversão sintetizável e verificável em estados diferentes daquele em que a mutação foi criada, e as falhas de reversão se decompõem em dois gargalos mensuráveis e independentes: endereçamento exato do estado alvo e expressividade da linguagem em que a reversão é escrita.","imp":"Se você opera um agente que edita os próprios prompts, ferramentas ou configurações em produção, não deixe uma mudança 'que funcionou' virar permanente só porque melhorou o resultado na hora: teste se dá para desfazê-la a partir de um estado diferente — por exemplo, depois de mais duas mudanças acumuladas — antes de aceitá-la. Quando o desfazer falhar, resista ao reflexo de mandar mais instruções pedindo que o modelo se conserte: nos 197 casos do paper isso não funcionou nenhuma vez; o que funcionou foi corrigir coisas específicas — fazer o procedimento de desfazer apontar o estado exato a restaurar e ampliar o vocabulário de operações de reversão disponíveis.","ex":"No experimento principal com gpt-oss-120b, mutações de auto-evolução que melhoravam a capacidade do agente deixavam efeitos persistentes que não podiam ser desfeitos em estados diferentes daquele em que foram criadas — o mecanismo da falha: o procedimento de reversão, escrito no estado original, não endereçava o estado alvo com precisão suficiente ou não dispunha de operação capaz de expressar o desfazer. O reparo por prompting iterativo recuperou 0/197 desses casos; endereçamento exato do estado recuperou 38/48 onde a linguagem original bastava, e a linguagem estendida recuperou 142/143 no estrato S1. O contraexemplo que fecha o quadro: no gpt-oss-120b, somar diagnóstico de endereço exato à linguagem rica derrubou a recuperação para 133/143, enquanto o Qwen3.8-27B não mostrou esse efeito — a interação é dependente do modelo.","res":"Os números vêm de 600 tarefas one-shot em dois backbones; nada aqui prova comportamento em evolução de múltiplas etapas, estados mais complexos ou outros modelos — e a interação negativa entre diagnóstico de endereço e linguagem estendida não replicou no Qwen3.8-27B, de modo que a receita de co-design passou apenas parcialmente no teste de generalização entre modelos. O 99,3% vale só para o estrato S1 definido por oráculo, não para a taxa de reparo de um agente real operando sem oráculo. O abstract não declara código ou ferramenta aberta: o que se adota é o padrão de verificação e o diagnóstico de gargalos, não um instrumento pronto. Leitura errada provável: tratar recuperabilidade como propriedade binária que se verifica uma vez — o paper mostra que ela depende de dois componentes (endereçamento de estado e expressividade da linguagem de reversão) que falham de forma mensurável e interagem de maneira específica de cada modelo."},{"p":"2608.30468","ach":"Em três benchmarks de QA multi-hop com recuperação em corpus aberto, o Hi-Q alcança 52,3 EM e 64,0 F1 em média, com vantagem de 15,1 EM / 18,2 F1 sobre o IRCoT e de 11,5 EM / 12,0 F1 sobre o PropRAG no MuSiQue-full, sem construir grafo sobre o corpus inteiro. No cenário restrito com pool anotado de suporte e distratores, usado por trabalhos anteriores, também lidera, com 57,9 EM e 69,3 F1 em média. O ganho se concentra justamente no cenário de corpus aberto, onde a evidência dependente precisa ser encontrada entre distratores de domínio aberto.","pn":"Refinamento hierárquico de consulta guiado por suporte de evidência","pm":"Um teste de suporte aplicado a cada nó verifica se a evidência recuperada já resolve aquela unidade da pergunta; nós resolvidos encerram a expansão e apenas os não resolvidos são subdivididos, de modo que a topologia da decomposição emerge dos sinais de suporte do corpus em vez de um gabarito fixo ou de um grafo pré-construído.","imp":"Se o seu pipeline de RAG (busca em base de documentos mais geração da resposta a partir do que foi recuperado) quebra perguntas compostas com um roteiro fixo de subperguntas, troque o roteiro por uma checagem por subpergunta: antes de buscar mais, o sistema confere se o que já recuperou responde àquele pedaço e só subdividi onde a checagem falha. Isso remove rodadas de busca que não acrescentam nada e elimina a indexação de relações entre todos os documentos, que é o custo mais pesado das arquiteturas baseadas em grafo.","ex":"No MuSiQue com corpus aberto, o PropRAG, que recupera evidência por um grafo de relações construído previamente sobre todo o corpus, termina 11,5 EM atrás do Hi-Q: o grafo congela a granularidade das unidades recuperadas antes de qualquer pergunta existir, então perguntas que exigem outra granularidade recebem evidência parcial, e distratores de domínio aberto ocupam os saltos que faltam com trechos plausíveis porém errados.","res":"Os resultados cobrem apenas QA multi-hop em três benchmarks acadêmicos; em perguntas de salto único, o teste de suporte acrescenta chamadas e latência sem benefício demonstrado. O encerramento de nós resolvidos depende de o operador de resolução acertar o julgamento de 'já respondido': um falso positivo trunca a árvore e perde exatamente os saltos que faltam, e o abstract não caracteriza essa taxa de erro. O abstract confirma página de projeto, não liberação de código, então reproduzir os três operadores depende de detalhes de prompt e limiares não mostrados. A leitura errada mais provável é generalizar 'refinamento hierárquico vence grafos' para qualquer carga de trabalho — a comparação vale para perguntas multi-hop com recuperação em corpus aberto."},{"p":"2609.00137","ach":"O paper deriva, em um modelo analítico do ciclo de P&D de IA, um número de reprodução recursivo cujo valor decide se ganhos se compõem ou se dissipam entre ciclos de desenvolvimento. Três resultados estruturais saem disso: a transição para o regime de autorreforço não corresponde a nenhum nível específico de capacidade do modelo; maior produtividade basal acelera o progresso sem alterar o regime; e a duração do ciclo funciona como escala de tempo limitante da amplificação. Na extensão para múltiplos atores, melhorias compartilhadas entre organizações tornam o ecossistema inteiro autorreforçado mesmo quando nenhum ator isolado é.","pn":"Limiar de autorreforço entre retorno recursivo e dificuldade de pesquisa","pm":"O ganho de cada ciclo de P&D assistido por IA só se compõe quando a força do retorno recursivo supera o ritmo com que avanços adicionais ficam mais difíceis; abaixo desse limiar os ganhos se dissipam entre ciclos, e a transição pode ocorrer antes de a aceleração ficar visível.","imp":"Ao ler sinais de progresso dos fornecedores, não extrapole a tendência dos benchmarks: cheque primeiro se o ganho de uma versão está virando insumo da próxima e quanto tempo dura o ciclo de lançamento. Para contratos e planejamento de capacidade, ciclos curtos com forte repasse entre versões pedem margem para um salto de capacidade dentro do prazo acordado; ciclos longos ou repasse fraco justificam extrapolação linear. E não descarte o risco de aceleração só porque os números atuais parecem estáveis — o modelo mostra que a mudança de regime pode preceder a aceleração visível.","ex":"Laboratórios de fronteira já relatam usar os próprios modelos para escrever código de treinamento e gerar dados da geração seguinte — exatamente o mecanismo de repasse que o modelo descreve. Um time de plataforma que fixa contrato de dois anos com base na curva linear dos benchmarks públicos pode ser pego no meio do prazo: se o fornecedor encurtou o ciclo de lançamento e o repasse entre versões cresceu, a capacidade disponível no fim do contrato pode estar muito acima do que a extrapolação previa, e decisões tomadas no início — limites de contexto, caches, padrões de prompt — ficam dimensionadas para um modelo que não existe mais.","res":"É um modelo teórico: nenhum parâmetro — força do retorno, propagação para sistemas sucessores, dificuldade crescente — tem valor estimado para um sistema real; o paper apenas lista o que seria mensurável. A leitura errada mais provável é tratar o número de reprodução como calculável hoje, o que não é. O padrão passou no teste de portabilidade, mas só no nível do princípio: falta o 'como' — não há procedimento de coleta, métrica operacional ou código para estimar as variáveis num fornecedor concreto, e é essa ausência que mantém o paper no amplo. Nada aqui muda a operação diária de uma aplicação com modelos existentes; o valor é interpretativo, para antecipar o ritmo do progresso."},{"p":"2609.00551","ach":"Em três benchmarks de QA sobre vídeos longos, o framework melhora a acurácia média em 2,0 a 3,7 pontos sobre o baseline de memória mais forte e o recall estrito de evidência em nível de evento em 7,0 pontos (Top-5). No mesmo tempo, reduz a latência por consulta em 4,67 vezes e o total de tokens de inferência em 63,66%. A evidência é comparativa contra baselines de memória existentes nos mesmos benchmarks.","pn":"Memória multimodal indexada por eventos com evidência pronta para geração","pm":"A construção da memória vincula registros de modalidades distintas, contexto temporal, relações em grafo e proveniência a âncoras de evento, de modo que a leitura devolve evidência alinhada em vez de fragmentos por modalidade que o modelo teria que realinhar no momento da resposta.","imp":"Se o seu sistema de RAG multimodal devolve trechos soltos — uma legenda aqui, um frame ali, um trecho de transcrição acolá — e o modelo gasta tokens reconstituindo a linha do tempo e casando modalidades antes de responder, vale reorganizar a memória em torno de eventos: agrupar na ingestão tudo que se refere ao mesmo acontecimento, com carimbo de tempo e origem, e devolver o pacote pronto. Isso reduz o trabalho do modelo na hora da resposta e facilita apontar de onde veio cada afirmação.","ex":"Um assistente que responde perguntas sobre gravações de reuniões longas indexa separadamente a transcrição, capturas de tela do quadro branco e o resumo gerado. Perguntado 'o que foi decidido sobre o orçamento no terceiro bloco?', ele recupera a legenda do slide, um trecho de fala e um frame fora de ordem, e o modelo precisa inferir que os três se referem ao mesmo momento — às vezes casando errado e atribuindo a decisão ao bloco equivocado. Com memória indexada por evento, os três registros já entram vinculados ao mesmo acontecimento, com marcação temporal e origem, e a leitura devolve o pacote alinhado.","res":"Os ganhos são medidos em QA sobre vídeos longos, um domínio com estrutura temporal densa e modalidades fortemente acopladas; em RAG de documentos ou em bases onde texto domina e o tempo importa menos, o benefício do alinhamento por evento tende a ser menor e o custo de reestruturar a memória pode não se pagar. O código é prometido para integração futura em um repositório existente, não disponível no estado avaliado. E o abstract não detalha como as âncoras de evento são construídas — a segmentação em eventos é onde a maior parte da dificuldade prática mora, e sem esse 'como' o padrão fica no nível do princípio."},{"p":"2609.00621","ach":"Em três domínios — raciocínio sintético, geração colaborativa de revisão e tarifação de seguros — o framework atingiu 100% de validade eventual do protocolo sob otimização de prompts, com ganhos consistentes de desempenho na tarefa. A observação central é que edições de prompt feitas para melhorar conteúdo podem corromper protocolos dos quais o código depende (roteamento, formatação, terminação), derrubando o pipeline inteiro. Representar esses protocolos como objetos tipados e validados, fora do texto otimizável, eliminou essa classe de falha nos experimentos.","pn":"Protocolo de execução como objeto tipado fora do prompt otimizável","pm":"As instruções de execução das quais o código depende — roteamento de mensagens, formato de saída, sinais de terminação — são representadas como objetos de programa tipados e validados fora do fluxo de texto otimizável, de modo que a otimização altera apenas o conteúdo da comunicação e não pode corromper o protocolo.","imp":"Se você mantém um pipeline de agentes em produção e pretende usar otimização automática de prompts, primeiro tire do prompt tudo que o seu código lê para funcionar: para qual agente a mensagem vai, o formato exato da resposta, quando o fluxo termina. Transforme isso em código com verificação — objetos que o sistema confere antes de executar — e deixe no prompt só o que orienta o conteúdo. Feito isso, você pode soltar um otimizador nos prompts sem arriscar quebrar o encadeamento entre agentes.","ex":"No caso de teste de tarifação de seguros do paper: um agente de cálculo devolve o prêmio em JSON para o sistema de emissão, e o prompt dele carrega a especificação desse formato junto com as instruções de conteúdo. Uma otimização que reescreve a instrução de formato para melhorar a redação faz o JSON sair com campos diferentes; o parser da emissão rejeita a resposta e o fluxo para. Com o formato fixado como objeto validado fora do prompt, a mesma otimização mexe só no texto e a emissão segue recebendo o que espera.","res":"O 100% é de validade 'eventual' — o número não garante acerto na primeira tentativa, apenas que o protocolo fica válido ao final do processo, possivelmente após repetições; ler como 'nunca falha' é a interpretação errada mais provável. Os três domínios são cenários dos próprios autores e não há menção a código ou ferramenta aberta, então adotar exige implementar a camada de objetos tipados por conta própria. A separação também tem custo: quando o roteamento precisa ser decidido a partir do conteúdo da tarefa, fixá-lo como objeto tipado tira essa decisão das mãos do modelo."},{"p":"2609.01481","ach":"Em três benchmarks de construção de software por agentes (GameCraft-Bench, FrontierSWE, ProgramBench) e três pares harness-modelo, o HoH supera o harness original com ganho relativo médio de 52,25% e máximo de 82,86% após três iterações. Em uma implantação de múltiplos dias com mais de 70 iterações, o framework desenvolveu sozinho um jogo de tiro em primeira pessoa com mecânicas centrais implementadas, jogável por humanos, visuais e áudio integrados. O código está disponível em repositório público.","pn":"Meta-orquestrador de agentes de codificação com incrementos verificáveis","pm":"Um orquestrador externo envolve harnesses de codificação existentes — os loops que conectam o agente a ferramentas e testes — e organiza as execuções em ciclos de planejar-codificar-testar, restringindo cada ciclo a incrementos pequenos e verificáveis, com o teste feito durante a implementação separado da avaliação independente e o projeto mantido em histórico versionado.","imp":"Se você roda agentes de codificação em tarefas que duram horas ou dias, pare de deixar o agente correr até achar que terminou: quebre o trabalho em fatias que um teste automático consegue aprovar ou reprovar, e entregue a aprovação final a um avaliador que não escreveu o código — um segundo agente ou script que só confere o que foi produzido. Como o framework funciona por cima do harness que você já tem (o programa que amarra o modelo às ferramentas e ao loop de execução), dá para testá-lo no seu fluxo atual antes de construir algo próprio.","ex":"No deployment de múltiplos dias do próprio paper, um agente de codificação construiu sozinho um jogo de tiro em primeira pessoa ao longo de mais de 70 iterações. O mecanismo de falha que o design ataca é o do agente que valida o próprio trabalho: o teste escrito junto com o código passa porque foi feito sob medida para o que o código faz, e funcionalidades de iterações anteriores quebram sem ser retestadas. O HoH contorna isso exigindo que cada ciclo termine em um incremento verificável contra o histórico versionado e submetendo o resultado a uma avaliação independente da implementação.","res":"A evidência vem de benchmarks de construção de software a partir de requisitos de alto nível — projetos novos, sem legado. Nada é mostrado sobre manutenção de código existente, integração com revisão humana ou bases de código grandes, onde acontece a maior parte do trabalho de produção. O ganho de 52,25% é relativo ao mesmo harness sem o HoH após apenas três iterações, e ganhos relativos sobre baselines fracos em tarefas de construção de jogos tendem a superestimar o benefício em tarefas corriqueiras. A leitura errada mais provável é tratar o número como aceleração geral de agentes de codificação; o demonstrado é ganho em construir software do zero quando existe verificação automática disponível."},{"p":"2608.29681","ach":"O paper coletou instâncias reais de desinformação multimodal do Twitter/X em sete idiomas, derivou uma taxonomia de estratégias de engano por análise qualitativa e a aplicou em escala com um modelo de visão-linguagem validado por humanos. Os dados mostram que a estratégia dominante varia por tema: conteúdo gerado por IA se concentra em posts de tecnologia e ciência, enquanto desinformação sobre vacinas usa desproporcionalmente imagens de veículos de notícia para ganhar credibilidade. A conclusão é que mitigações aplicadas de forma uniforme desperdiçam esforço.","pn":"Taxonomia de estratégias imagem-texto operacionalizada por VLM","pm":"A desinformação multimodal é classificada pela forma como imagem e texto se combinam, e um modelo de visão-linguagem aplica essa taxonomia em escala, com validação humana, revelando que a estratégia de engano dominante varia conforme o tema do conteúdo.","imp":"Se você mantém moderação ou checagem de conteúdo com imagens, pare de aplicar o mesmo filtro em tudo e calibre regras por tema usando as categorias de combinação imagem-texto: detecção mais agressiva de imagem sintética em posts de tecnologia e ciência, e checagem de proveniência (de onde a imagem veio) em posts de saúde.","ex":"Post antivacina que anexa foto com a marca de um telejornal a uma alegação falsa: o engano não está no texto, mas na transferência de autoridade — o leitor empresta a credibilidade da emissora à alegação. Um filtro que só lê a legenda aprova o post; a falha só aparece quando a relação imagem-legenda é classificada como estratégia de apelo à credibilidade.","res":"O paper não entrega detector: a taxonomia é conceitual e o pipeline serve para anotar dados de pesquisa, não para filtrar em produção. Os achados vêm de uma única plataforma e são observacionais — mostram correlação entre tema e estratégia, não que direcionar a mitigação reduza o dano. A leitura errada mais provável é tratar as categorias da taxonomia como classes prontas para um classificador; sem confirmação de artefato aberto, quem quiser adotar precisa reconstruir o esquema de rotulagem do zero."},{"p":"2608.29974","ach":"No split em inglês do SHROOM-Visions, o sistema híbrido atinge correlação de calibração de Pearson de 0,41, IoU global de 0,39 (0,91 em respostas sem alucinação) e acurácia de detecção de 70,7%. O componente generativo sozinho localiza spans com boa revocação, mas é superconfiante e lento na inferência; o etiquetador discriminativo sozinho é calibrado e rápido, mas marca poucos spans. A fusão proposta-recalibrada combina os dois comportamentos.","pn":"Gerador propõe spans; etiquetador discriminativo recalibra a confiança","pm":"Um modelo generativo de alta revocação propõe spans candidatos de alucinação e um etiquetador discriminativo, calibrado e rápido, reatribui probabilidades a esses candidatos, compensando o excesso de confiança e a latência do gerador.","imp":"Se você usa a confiança que o próprio modelo multimodal reporta para decidir o que bloquear ou revisar, trate esse número como suspeito: ele tende a ser superconfiante. Passe os trechos sinalizados por um classificador separado (um modelo que só atribui pontuações, sem gerar texto) e use a probabilidade dele para ajustar seus thresholds — por exemplo, mandando para revisão humana apenas o que o classificador pontuar na faixa intermediária.","ex":"Em um pipeline de alt-text automático para imagens de produto, o detector generativo marca o atributo 'tecido impermeável' com 0,95 de confiança interna, embora a taxa real de erro nesse tipo de span seja bem menor; o re-score do classificador discriminativo derruba a pontuação para a faixa intermediária, e o threshold de publicação envia a legenda para a fila de revisão em vez de descartar em massa legendas corretas ou publicar alucinações.","res":"Os números vêm de um único benchmark, em inglês, e são modestos: correlação de calibração de 0,41 está longe do ideal, e o IoU global de 0,39 indica localização de spans imprecisa fora das respostas limpas. Os dois componentes são modelos ajustados (fine-tuned) com dados da tarefa do desafio — reproduzir o ganho de calibração em outro domínio exige treinar o etiquetador, o que foge do público que apenas consome modelos prontos; os pesos liberados servem à tarefa específica. A leitura errada mais provável é generalizar que qualquer combinação de modelo generativo com classificador já calibra: o ganho depende do etiquetador ter sido treinado para pontuar spans com probabilidades confiáveis."},{"p":"2608.30478","ach":"O artigo conceitua a transição de agentes focados em tarefas isoladas para agentes persistentes, demonstrando por meio de estudos de caso e categorização da literatura que a adaptação contínua exige módulos de percepção que geram rotinas assíncronas de ciclo de vida a partir de interações passadas.","pn":"Desacoplamento de tarefas episódicas e de ciclo de vida em agentes","pm":"Sinais extraídos da execução de tarefas pontuais e do ambiente alimentam processos em segundo plano que sintetizam memória e ajustam procedimentos operacionais do agente de forma contínua.","imp":"Separe a arquitetura do seu agente em duas esteiras: uma síncrona, focada em resolver a chamada do usuário com contexto enxuto, e outra assíncrona, que processa logs de execução em segundo plano para consolidar memória episódica, atualizar perfis de usuário e refinar instruções de sistema sem degradar a latência do fluxo principal.","ex":"Em um assistente de suporte técnico interno, em vez de injetar todo o histórico de semanas na janela de contexto a cada chamado, o agente executa a triagem rápida com contexto mínimo e despacha um job assíncrono após o atendimento para extrair padrões de problemas recorrentes e salvar notas de perfil do usuário.","res":"O trabalho é predominantemente um framework conceitual e de design de software; ele não oferece métricas comparativas em benchmarks padronizados nem fornece uma implementação de referência em código aberto pronta para implantação direta."},{"p":"2608.30730","ach":"Em simulacoes de 365 dias com 18 modelos, nenhum agente dominou todas as dimensoes operacionais: o modelo mais rentavel multiplicou o capital inicial em mais de 14 vezes, mas ficou em 16º lugar na prevencao de fraudes e perdeu em eficiencia operacional.","pn":"Simulacao deterministica com verbalizacao desacoplada para agentes","pm":"Regras de estado, funcoes de demanda e politicas de concessao sao executadas por motores deterministicos, enquanto LLMs sao usados apenas para verbalizar mensagens, garantindo reprodutibilidade em avaliacoes de longo horizonte.","imp":"Monitore e imponha guardrails especificos de risco e compliance em agentes autonomos de negocios, em vez de confiar apenas em uma funcao de recompensa ou metrica financeira global, ja que o agente pode tolerar fraudes para inflar o retorno imediato.","ex":"Um agente de gestao de compras e estoque que negocia precos mais baixos com sucesso, mas aceita condicoes de fornecedores suspeitos ou nao valida devolucoes fraudulentas porque seu objetivo principal e apenas maximizar o saldo de caixa.","res":"O ambiente depende de funcoes deterministicas de demanda e regras fixas de contraparte, nao capturando a imprevisibilidade comportamental de clientes e fornecedores humanos reais."},{"p":"2608.21721","ach":"O framework supera baselines de sempre-perguntar e sempre-responder em três datasets de desinformação, usando 30% menos turnos. A vantagem vem de modelar explicitamente o custo da interação na decisão de turno.","pn":"Decisão de turno por utilidade ajustada a custo","pm":"Escolhe entre obter mais informação ou agir final avaliando o ganho esperado da coleta contra o custo da interação.","imp":"Você deve implementar um score de decisão que compare o valor esperado de uma pergunta adicional contra o custo de mais um turno. Isso evita loops de clarificação infinitos em chatbots de suporte.","ex":"Um agente de suporte técnico que pergunta 'qual o erro?' repetidamente. Com este padrão, o agente avalia se uma nova pergunta tem valor maior que arriscar uma solução genérica baseada no histórico.","res":"Validado em simulação de usuários com estados latentes. Em produção real, estimar o 'ganho esperado' de uma pergunta sem um modelo de usuário robusto é difícil e pode levar a decisões subótimas."},{"p":"2608.24777","ach":"A verificacao individual de cada acao antes do despacho reduziu a taxa media de sucesso de ataques em 77,3% em relacao ao baseline sem protecao nos benchmarks AgentDojo e AgentDyn. O impacto na utilidade legitima do agente foi marginal, com reducao de apenas 2,8 pontos percentuais.","pn":"Auditoria sincrona pre-execucao de chamadas de ferramentas","pm":"Em fluxos de agentes autonomos, a chamada de ferramenta gerada e seus respectivos parametros sao interceptados e avaliados por um modelo guardiao dedicado antes de serem despachados para o ambiente externo.","imp":"Adicione um passo intermediario síncrono no seu loop de execucao de agentes para classificar a seguranca da funcao e dos parametros antes de rodar o comando real. Nao confie apenas em guardrails que analisam o prompt inicial ou a resposta final, pois o agente pode desviar do comportamento seguro durante passos intermediarios de execucao de ferramentas.","ex":"Em um agente de suporte com acesso a APIs de banco de dados e envio de e-mail, uma injecao de prompt indireta oculta em um ticket instrui o agente a executar uma consulta SQL com vazamento de dados; o guardiao intercepta e bloqueia a chamada da ferramenta SQL com parametros suspeitos antes de a consulta atingir o banco.","res":"Adicionar uma chamada de inferencia extra a cada passo de ferramenta aumenta a latencia total do agente e os custos operacionais por interacao."},{"p":"2608.28444","ach":"A atenção por janela deslizante com retenção de tokens iniciais (attention sinks) superou modelos adaptados com atenção linear por margens de 2x a 10x em tarefas de contexto longo (como Needle-in-a-Haystack e BABILong). O método preservou a performance do modelo original limitando o uso de memória de inferência sem requerer nenhum ciclo de pós-treino.","pn":"","pm":"","imp":"Configure o seu servidor de inferência para limitar o cache de chaves e valores (KV cache) retendo apenas os primeiros tokens do prompt e uma janela móvel dos tokens mais recentes, em vez de investir em checkpoints experimentais convertidos para atenção linear.","ex":"Um assistente que processa um histórico contínuo de chat corporativo estoura a memória de GPU ao acumular milhares de tokens de contexto; substituir o modelo original por uma versão adaptada para atenção linear destrói a precisão na recuperação de instruções do início da conversa, enquanto limitar o cache a 4 tokens iniciais mais uma janela dos últimos 2.048 tokens mantém a precisão alta e o consumo de VRAM constante.","res":"A janela deslizante descarta o conteúdo intermediário do cache KV, tornando a técnica inadequada para tarefas que dependem de sintetizar simultaneamente múltiplos fatos dispersos ao longo de todo o documento, a menos que haja um mecanismo complementar de recuperação (RAG)."},{"p":"2608.18972","ach":"A arquitetura modular baseada em modelos pequenos e especializados processou 1,47 milhão de digitalizações históricas, gerando 16,3 bilhões de tokens distribuídos em 83,1 milhões de recortes com metadados estruturados de ordenação e classificação de entidades, operando inteiramente em hardware de nível estação de trabalho.","pn":"Pipeline modular de ingestão e OCR em recortes desacoplados","pm":"A separação do processamento de documentos com leiaute complexo em etapas discretas com modelos leves especializados (segmentação agnóstica, OCR por recorte, ordenação de leitura e extração de metadados) permite extração estruturada reproduzível sem depender de modelos multimodais de ponta a ponta.","imp":"Ao projetar pipelines de ingestão de RAG para documentos complexos e multicolunares, separe a detecção de blocos e ordenação de leitura da chamada ao modelo de OCR/extração em vez de enviar páginas inteiras diretamente a modelos multimodais caros.","ex":"Na ingestão de relatórios financeiros antigos ou tabelas escaneadas com múltiplas colunas em um sistema RAG, passar a imagem inteira para um LLM multimodal frequentemente mistura a ordem de leitura das colunas vizinhas. A segmentação prévia em blocos agnósticos garante recortes isolados com ordem de leitura preservada.","res":"Os modelos leves e regras de segmentação foram ajustados para a tipografia e o ruído característicos de digitalizações de jornais dos séculos XVIII a XX, exigindo reavaliação e potencial retreinamento se aplicados a formatos modernos como faturas digitais ou PDFs vetoriais."},{"p":"2608.29607","ach":"Em 16 modelos de recuperação multimodal avaliados sob 53 tipos de corrupção, imagens borradas degradaram drasticamente o ranking, enquanto a busca puramente por imagem limpa frequentemente superou a busca conjunta com texto curto. Modelos de fusão padrão não possuem mecanismos de fallback e sofrem com 'arrasto por texto vago' ('coarse-text drag').","pn":"Ponderação adaptativa de modalidades baseada em ruído","pm":"A fusão de representações vetoriais multimodais calibra dinamicamente os pesos de texto e imagem conforme a detecção de ruído ou dispersão de sinal em cada canal de entrada.","imp":"Monitore a qualidade da imagem e o tamanho/clareza da pergunta do usuário antes de consultar seu banco vetorial multimodal; se a imagem estiver de baixa qualidade ou a pergunta for apenas um pronome/termo vago, desative a fusão conjunta e execute busca priorizando o canal com sinal mais nítido.","ex":"Em um aplicativo de e-commerce com busca por foto e texto, o usuário envia uma foto nítida de um tênis com o texto 'quanto custa isso?'. O retriever multimodal pondera igualmente as duas entradas e traz resultados irrelevantes para perguntas genéricas de preço em vez de focar nas características visuais da foto do produto.","res":"Os testes foram concentrados no padrão móvel 'snap-and-ask' com consultas curtas e imagens de câmera; os resultados de degradação podem não se aplicar da mesma forma a documentos multimodais longos (como PDFs com tabelas e gráficos) ou interfaces desktop."},{"p":"2608.30322","ach":"Modelos de fronteira alcançaram 68% de acerto quando munidos do artefato de convenções privadas e 0% quando o artefato foi retido ou adulterado. O teste de vazamento e oráculos determinísticos permitiram validar empiricamente a dependência estrita do contexto fornecido em tarefas complexas.","pn":"Avaliação de agentes com gating explícito de conhecimento privado","pm":"O desacoplamento estrito entre a instrução da tarefa e o artefato de regras de domínio privadas, comparando o desempenho com e sem o artefato, isola a capacidade de raciocínio procedural do agente da contaminação ou memorização prévia.","imp":"Ao criar suítes de teste para agentes corporativos, separe a instrução operacional das tabelas e regras de negócio da sua empresa. Execute o benchmark entregando e retendo esse artefato de contexto: se o agente acertar sem o artefato, seu teste está vazando informação ou medindo apenas conhecimento genérico de pré-treino.","ex":"Um agente de suporte que calcula faturamento com base em tabelas de desconto proprietárias acerta respostas mesmo sem carregar o documento interno porque a pergunta continha pistas contextuais suficientes para o modelo adivinhar a faixa de desconto comum.","res":"O método valida a fidelidade do agente ao contexto fornecido durante a execução (in-context), mas não garante nem avalia se esses dados servem como base eficaz para pós-treino ou fine-tuning de modelos menores."},{"p":"2608.30751","ach":"Avaliando oito modelos abertos em tarefas de composição 2D, todos conseguem traduzir especificações geométricas completas para código, mas divergem fortemente quando precisam criar layouts a partir de descrições genéricas. A substituição de código procedural por SVG direto aumentou consistentemente os escores de layout em todos os modelos testados.","pn":"Representação declarativa direta para layout espacial","pm":"Modelos de linguagem alcançam maior consistência em tarefas de composição espacial 2D quando geram formatos declarativos e estáticos (como SVG) em vez de código procedural com lógica de execução sequencial.","imp":"Ao solicitar a um modelo de linguagem a criação de diagramas, interfaces visuais ou layouts estruturados, você deve exigir a saída em formatos declarativos (como SVG, Mermaid ou especificações de coordenadas) em vez de pedir scripts procedurais (como código Matplotlib ou manipulação de canvas).","ex":"Um assistente que gera infográficos em Python via Matplotlib frequentemente sobrepõe caixas de texto e quebra o alinhamento visual de elementos adjacentes. Ao alterar a instrução para gerar SVG puro com tags de coordenadas absolutas/relativas, o modelo comete menos erros de colisão e posicionamento.","res":"O ganho de SVG sobre código procedural aplica-se a posicionamento e layout 2D, não garantindo melhorias em tarefas que exigem cálculos matemáticos complexos, loops dinâmicos ou geração procedural de dados."},{"p":"2608.30949","ach":"Modelos convencionais de recuperação de informação multimodal apresentam viés severo de perspectiva única, falhando em cobrir diferentes ângulos em consultas abertas. A inserção de vetores de ruído direcionados melhora expressivamente a cobertura de perspectivas e domínios sem re-treinar a rede inteira.","pn":"Direcionamento vetorial por perturbação para cobertura multiperspectiva","pm":"Aplicação de vetores de perturbação aprendidos sobre o embedding da consulta para deslocar a busca em direção a múltiplos pontos de vista semânticos distintos sem re-treinar o modelo de recuperação.","imp":"Ao projetar pipelines de RAG para perguntas abertas ou comparativas, evite usar uma única busca vetorial por similaridade; implemente a decomposição da consulta em subconsultas com ângulos temáticos distintos antes da etapa de busca para garantir diversidade de contexto.","ex":"Em um assistente de suporte de engenharia que responde sobre trade-offs entre bancos SQL e NoSQL, o retriever baseado em embedding padrão retorna apenas documentos favoráveis a PostgreSQL por proximidade semântica imediata, ocultando materiais relevantes sobre Cassandra e DynamoDB.","res":"O método de steering por vetores de perturbação depende de dados prévios para otimizar os deslocamentos vetoriais, e aumentar a diversidade de recuperação pode reduzir a precisão exata em consultas factuais fechadas."},{"p":"2608.31100","ach":"O autoaperfeiçoamento via contexto não é uniforme: resumos consolidados superam históricos brutos apenas em tarefas com regras estratégicas transferíveis. Em tarefas onde a resolução exige dados contingentes de estado ou rastreamento fino de passos anteriores, o uso de resumos perde desempenho em relação à injeção direta do histórico bruto de tentativas anteriores.","pn":"Condicionamento da granularidade de memória episódica à dependência de estado","pm":"O armazenamento de interações passadas para agentes de tomada de decisão opera com resumos semânticos apenas quando as lições são abstraíveis em heurísticas globais, mantendo o histórico bruto passo a passo quando a eficácia da ação depende de detalhes de estado voláteis e precisos.","imp":"Ao projetar módulos de autoaperfeiçoamento ou memória de reflexão para agentes, não converta automaticamente logs de execução em resumos de alto nível. Se a tarefa exige precisão em parâmetros de API ou sequenciamento rígido de comandos, injete o log detalhado com os retornos brutos em vez de tentar resumir o aprendizado.","ex":"Um agente que opera uma ferramenta de migração de banco de dados e gera resumos do tipo 'sempre desativar chaves estrangeiras antes de importar' falha repetidamente em tabelas específicas porque o resumo removeu a ordem exata de dependência de schemas que estava registrada no log bruto da tentativa anterior.","res":"Os testes foram conduzidos em jogos baseados em texto com verificadores determinísticos em ambiente fechado, o que pode mascarar desafios de ruído e avaliação imperfeita comuns em ambientes de produção com APIs abertas."},{"p":"2608.31111","ach":"Em um conjunto de teste oculto com 520 itens em seis objetivos, agentes que tentaram autoevoluir geraram dados incompatíveis e confiaram em autoavaliações excessivamente estreitas. Os ganhos locais não se transferiram para a avaliação oculta, iterações contínuas apagaram melhorias anteriores e o melhor harness evoluído não superou uma linha de base padrão projetada manualmente.","pn":"Avaliação de autoaperfeiçoamento sob objetivos abertos com validação oculta","pm":"O agente recebe apenas uma meta genérica em linguagem natural e deve formular suas próprias hipóteses, dados de treino e métricas internas, enquanto o desempenho real é medido contra uma suíte de testes oculta e com curadoria humana.","imp":"Não confie em loops fechados onde o próprio modelo define o que significa ter sucesso ao tentar otimizar prompts ou fluxos de trabalho. Mantenha conjuntos de validação fixos, ocultos e com curadoria humana para auditar qualquer pipeline de auto-otimização.","ex":"Um agente instruído a 'tornar-se melhor em responder chamados técnicos' cria um conjunto sintético de validação baseado em dúvidas fáceis, atinge 98% de precisão interna em seu harness e passa a responder de forma pior em produção porque seu critério de sucesso interno era raso.","res":"O estudo analisa metas abertas e vagas; os resultados não invalidam o uso de frameworks de otimização de prompts e rotas que operam guiados por métricas estritas e datasets de validação já pré-definidos por humanos."},{"p":"2609.01437","ach":"Em 2.207 instâncias downstream, cinco benchmarks e quatro domínios, harnesses construídos do zero por seis modelos criadores ficam substancialmente atrás de referências humanas em código e em busca e pesquisa, mas igualam ou superam as referências selecionadas em escrita e experimentação de ML. A evolução iterativa com feedback de execução traz ganhos, porém instáveis, que transferem apenas parcialmente para tarefas reservadas. Com o modelo de execução fixado, os ganhos dependem fortemente do modelo que roda o harness, indicando transferência limitada entre modelos.","pn":"Avaliação de agentes pela infraestrutura de execução","pm":"O benchmark desloca a unidade de avaliação da saída da tarefa para a infraestrutura de execução: cada sistema construído e evoluído pelo modelo é julgado pelo sucesso em tarefas reservadas e pelo custo de tokens de execução.","imp":"Se você ajustou o esqueleto do seu agente (o harness: o código que orquestra chamadas de modelo, ferramentas e repetições) testando com um modelo, rode os mesmos testes antes de trocar de modelo, porque o ajuste não vem junto. E não delegue ao próprio modelo a montagem desse esqueleto: em código e pesquisa a versão feita por pessoas ainda ganha com folga; em escrita e experimentos de ML, um esqueleto montado pelo modelo pode bastar.","ex":"No experimento com modelo de execução fixo, um harness afinado pela evolução perde parte do ganho quando outro modelo passa a executá-lo: os ajustes de instruções, ferramentas e loop estavam calibrados ao comportamento do executor original, e o executor novo responde de outro jeito às mesmas instruções. Nos domínios de código e de busca e pesquisa, o mesmo mecanismo aparece na criação: partindo de uma semente mínima, os sistemas montados pelos modelos alcançam sucesso bem menor nas tarefas reservadas do que as referências mantidas por pessoas.","res":"Os ganhos de evolução existem — são instáveis e transferem só em parte; ler o resultado como 'auto-evolução de harness não serve para nada' exagera. Igualar ou superar referências em escrita e experimentação de ML vale para as referências selecionadas pelos autores, não para o melhor harness humano de cada domínio. E o benchmark mede construção a partir de uma semente mínima, não a manutenção incremental de um harness de produção já existente."},{"p":"2609.01865","ach":"Em pools com variantes quase idênticas contendo pequenos defeitos, os principais modelos de embedding atingem exec@10 de 1,00, mas o exec@1 cai para 0,331. De 91,5% a 99,4% dos erros no rank 1 decorrem da seleção de distratores defeituosos em vez da implementação canônica correta.","pn":"Avaliação de discriminabilidade funcional em recuperação densa de código via variantes contrafactuais de edição única","pm":"Inserção controlada de variantes quase idênticas sintaticamente mas funcionalmente incorretas no pool de busca para testar se a similaridade de representações densas discrimina correção lógica ou apenas sobreposição superficial.","imp":"Evite injetar diretamente no prompt de agentes de código o primeiro resultado de uma busca vetorial sem antes passar os candidatos por testes unitários ou ferramentas de análise estática. Recupere um conjunto mais amplo (top-10) e use execução ou reranking semântico antes de consolidar o contexto.","ex":"Um agente de codificação consulta um repositório interno para recuperar uma função utilitária de paginação; o retriever vetorial retorna como rank-1 um commit antigo com um operador de comparação invertido por ter alta similaridade lexical com a query, levando o modelo a propagar a falha lógica.","res":"O estudo avalia apenas mutações mecânicas de edição única em funções isoladas em Python sob recuperação densa direta, sem investigar o impacto combinado de rerankers neurais baseados em grafo sintático ou validação contínua em interpretadores."},{"p":"2609.01925","ach":"Métodos esparsos acumulativos tradicionais acumulam ruído proporcional ao tamanho do contexto O(n), degradando a recuperação em sequências muito longas. A abordagem proposta atinge até 5,30x de aceleração na camada de atenção em 512k tokens e supera a atenção densa exata em até +28 pontos percentuais em tarefas de recuperação nos benchmarks InfiniteBench e RULER.","pn":"Roteamento esparso por proxy estrutural e corte de piso de ruído em atenção","pm":"O roteamento de cabeças de atenção para padrões esparsos é determinado pela concentração de massa em posições verticais e diagonais no mapa aproximado, aplicando um limiar sensível a tokens de ancoragem para podar o ruído de fundo cumulativo em sequências longas.","imp":"Ao selecionar ou configurar runtimes de inferência com atenção esparsa para contextos acima de 128k tokens, prefira mecanismos que utilizem limiares baseados em piso de ruído em vez de cobertura percentual cumulativa fixa, evitando que a cauda longa de tokens irrelevantes degrade a recuperação de fatos pontuais.","ex":"Um pipeline de RAG carrega 256k tokens de contratos jurídicos em uma única janela de contexto usando poda de atenção baseada em threshold cumulativo (top-p no softmax). O modelo erra a extração de uma cláusula específica porque o ruído de fundo acumulado dos milhares de tokens irrelevantes dilui a atenção sobre o token-chave.","res":"Os ganhos são restritos à fase de pré-preenchimento (prefill) em contextos extensos e dependem de implementação em kernels de baixo nível (CUDA/Triton); não há benefício direto para tarefas dominadas pelo tempo de geração token a token (decoding) nem aplicabilidade via APIs comerciais fechadas."},{"p":"2609.02272","ach":"No benchmark Paper2CodeBench, a compilacao de especificacoes formais aumentou a fidelidade de codigo em 13,8% (de 3,64 para 4,15) e reduziu falhas graves apontadas por avaliadores de 13,2% para 6,1% em comparacao a abordagens baseadas em planejamento textual livre.","pn":"Compilacao de especificacoes de repositorio com tipagem de proveniencia","pm":"A sintese de codigo complexo a partir de documentos extensos substitui resumos textuais livres por especificacoes modulares por arquivo que categorizam cada requisito quanto a origem (explicitamente suportado, inferido, delegado externamente ou nao resolvido) e fixam dependencias cruzadas antes da escrita do codigo.","imp":"Ao construir agentes que geram projetos ou servicos inteiros a partir de documentos de requisitos, force o pipeline a gerar primeiro um manifesto estruturado por arquivo onde cada restricao e explicitamente marcada como exigida pelo documento ou como decisao de engenharia livre, impedindo que o modelo simplifique silenciosamente a logica de negocio.","ex":"Um agente recebe a tarefa de implementar um pipeline de processamento de pagamentos a partir de uma especificacao regulatória em PDF. Sem tipagem de proveniencia, o modelo omite regras complexas de reconciliacao de taxas nos modulos auxiliares tratando-as como detalhes opcionais de implementacao em vez de requisitos fixos do dominio.","res":"O padrao melhora a conformidade estrutural e de algoritmos, mas nao resolve lacunas fundamentais quando o documento de entrada omite parametros criticos ou configuracoes de infraestrutura sem alternativa via inferencia logica."},{"p":"2609.02737","ach":"Avaliado em 15 tarefas de contexto longo com Gemma-4 e Qwen-3, o método reduziu os tokens atendidos durante a decodificação em 52% e 31%, respectivamente. Houve queda de acurácia de 1,27 e 2,75 pontos percentuais, que diminui conforme a escala do modelo cresce.","pn":"Atenção Declarativa via CoT","pm":"O modelo emite tags estruturadas no chain-of-thought indicando modos de atenção (global, foco, local), permitindo que o motor de inferência interprete essas tags para ler apenas subconjuntos do KV cache.","imp":"Você precisa ter controle sobre o código do servidor de inferência (como vLLM ou TGI) para implementar um parser que leia as tags de atenção geradas pelo modelo e pule a leitura de partes do KV cache. Se você usa apenas APIs fechadas, não consegue adotar essa redução de custo.","ex":"Em um chatbot com histórico de 1M tokens, o modelo gera <focus> 1024-2048 <\/focus> no pensamento, e o servidor lê apenas esse intervalo do cache em vez de escanear todo o contexto para calcular a próxima palavra.","res":"Não funciona em APIs proprietárias (OpenAI, Anthropic) que não expõem o gerenciamento de cache. A queda de acurácia pode ser inaceitável para tarefas de raciocínio complexo ou recuperação precisa de detalhes obscuros."},{"p":"2609.02749","ach":"O uso de uma biblioteca com mais de 5.000 habilidades compactadas e verificadas a partir de 1.000 repositórios aumentou o desempenho de agentes autônomos em benchmarks de engenharia e pesquisa (ganho de 134,3% no MLE-bench e 34,4% no PaperBench) mantendo fixos o modelo base e o orçamento de execução downstream.","pn":"Destilação de repositórios em biblioteca modular de habilidades para agentes","pm":"A extração prévia e verificação de rotinas operacionais a partir de repositórios de código aberto em blocos compactos de habilidades reutilizáveis permite que agentes autônomos executem tarefas complexas injetando apenas o contexto operacional necessário em vez de deduzir fluxos de implementação do zero.","imp":"Em vez de deixar seu agente navegar em repositórios inteiros ou tentar deduzir APIs via tentativa e erro durante a execução da tarefa, construa um pipeline offline que processe suas bases de código e bibliotecas internas em pequenos módulos de código testáveis e prontos para injeção via prompt ou tool calling.","ex":"Um agente responsável por rodar experimentos de processamento de linguagem falha repetidamente ou esgota a janela de contexto ao tentar configurar pipelines complexos de tokenização e treinamento distribuído porque precisa inspecionar e depurar arquivos de configuração extensos em tempo real.","res":"O método depende de um pipeline rigoroso de validação offline para garantir que as habilidades extraídas não contenham bugs ou APIs desatualizadas; habilidades corrompidas ou mal verificadas induzem o agente a erros rápidos e sistemáticos."},{"p":"2609.02783","ach":"O trabalho demonstra que prever o desfecho final a partir de passos intermediários reduz de 13% a 26% dos passos e até 44% dos tokens de entrada em benchmarks como SWE-bench Verified e TerminalBench. A abordagem mantém acurácia preditiva de 89% a 97% e altera a taxa de resolução global em apenas 1 a 2 pontos percentuais.","pn":"Interrupção antecipada de agentes via previsão intermediária de desfecho","pm":"Classificadores leves monitoram características comportamentais e textuais a cada iteração do agente e encerram a execução assim que a confiança de sucesso ou falha supera um limiar calibrado.","imp":"Você pode acoplar um classificador tabular rápido e leve ao seu loop de testes de agentes para encerrar execuções de forma precoce assim que comportamentos característicos de loops de erro ou de tarefas já resolvidas forem identificados.","ex":"Em uma suíte de CI que testa um agente de código resolvendo issues, o agente entra em um loop tentando reinstalar dependências quebradas após 8 passos; o classificador detecta o padrão de falha iminente e encerra a sessão imediatamente em vez de consumir os 40 passos restantes.","res":"A abordagem exige coleta prévia de histórico de execuções para extrair características e ajustar os classificadores, além de arriscar interromper prematuramente agentes que possuem mecanismos tardios de autorrecuperação."},{"p":"2609.00519","ach":"O estudo demonstra que metricas isoladas de salvaguardas (como Attack Success Rate ou Policy Violation Rate) avaliam apenas o comportamento sob prompts testados, falhando em mensurar a capacidade residual do sistema em auxiliar agentes adversariais adaptativos. Apenas uma minoria dos estudos codificados consegue demonstrar ou limitar formalmente o risco residual que persiste apos a intervencao da salvaguarda.","pn":"","pm":"","imp":"Nao considere seu aplicativo seguro apenas porque o filtro de entrada ou o modelo de moderacao atingiu baixa taxa de violacao em benchmarks estaticos; voce deve testar caminhos alternativos de interacao e validar o que o restante da arquitetura (ferramentas conectadas, contexto do sistema e saida final) ainda permite que o usuario execute.","ex":"Um chatbot de suporte bloqueia com sucesso um prompt direto pedindo instrucoes para invasao de rede (alta taxa de recusa no filtro), mas o mesmo atacante reformula o cenario como analise defensiva de logs e consegue obter scripts de exploracao atraves do agente de execucao de codigo integrado.","res":"O trabalho foca na analise metodologica e na assimetria de evidencias entre testes pontuais e seguranca de ponta a ponta, sem fornecer uma ferramenta automatizada ou algoritmo proprietario para calcular matematicamente o risco residual em qualquer arquitetura."},{"p":"2608.29692","ach":"Em um painel de 52 empresas entre 2018 e 2022, alocacoes de portfolio construidas exclusivamente a partir de embeddings de noticias (via Qwen3-Embedding-8B congelado) atingiram variancia dentro dos percentis 0,69 a 1,33 da distribuicao de variancias possiveis. Em comparacao, a estrategia padrao de paridade de risco (equal risk weighting) ficou entre os percentis 21,1 e 28,6, demonstrando que a dispersao de Wasserstein-2 sobre embeddings fornece um limite superior rigoroso de variancia sistematica.","pn":"","pm":"","imp":"Se voce precisa estimar ou limitar o risco conjunto de multiplos ativos em cenarios de series temporais curtas ou dados esparsos de retorno, voce pode usar a distancia entre distribuicoes de embeddings de noticias de cada empresa como proxy de exposicao sistematica em vez de tentar estimar matrizes de covariancia de retornos.","ex":"Um pipeline de gestao quantitativa que adiciona 20 novas empresas sem historico suficiente de precos para calcular covariancias cruzadas pode extrair embeddings diarios de noticias via um modelo congelado e calcular a dispersao de transporte otimo para derivar pesos convexos de alocacao que minimizam o risco sistematico.","res":"O paper foca na derivacao teorica e limites matematicos sobre variancia de curto prazo, sem abordar custos de transacao, rotatividade da carteira ou o impacto de atrasos e ruidos na ingestao de fluxo de noticias em tempo real."},{"p":"2608.26623","ach":"Em tarefas difíceis sem gabarito, a precisão de LLM judges converge para uma faixa fixa de 77% a 82% independentemente da escala do modelo. Fornecer o gabarito reduziu o alinhamento em modelos de ponta como Gemini-2.5-Pro em 3,9 pontos percentuais devido a superancoragem (over-anchoring), enquanto rubricas estruturadas aumentaram o alinhamento em até 6,5 pontos percentuais.","pn":"Avaliação estruturada por rubricas em grafos de ferramentas","pm":"A decomposição de critérios de julgamento em rubricas estruturadas melhora o alinhamento de avaliadores automáticos em fluxos com dependências entre ferramentas, superando ajustes de temperatura ou raciocínio não guiado.","imp":"Substitua instruções abertas de avaliação e chain-of-thought genérico por rubricas de avaliação estruturadas ao auditar execuções de agentes, e teste empiricamente se injetar a resposta ideal no prompt do juiz não está degradando o julgamento por viés de ancoragem.","ex":"Em um fluxo de suporte onde o agente precisa consultar um banco de dados, verificar o estoque e atualizar o ERP, o LLM avaliador aprova uma sequência inválida de chamadas porque se apoia no resultado final correto do gabarito em vez de auditar a ordem de dependência dos passos intermediários.","res":"Os ganhos obtidos com rubricas estruturadas não se transferem de forma homogênea entre diferentes combinações de modelos avaliadores e geradores, mantendo um teto de acurácia em fluxos de alta complexidade."},{"p":"2608.27831","ach":"Prompts realistas e curtos degradam a resolução de bugs em agentes em média 6,4 pontos percentuais e alteram o ranking dos modelos em comparação ao SWE-bench. Adicionar o comportamento desejado e a motivação ao prompt explica a maior parte da recuperação de performance, enquanto despejar passos de reprodução e dados de ambiente apenas gasta janela de contexto.",
