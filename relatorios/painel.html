 de imagem a partir de texto e imagem de referência. A verificação por critérios explícitos reduz omissões e alucinações de atributos complexos durante a ordenação dos resultados.","pn":"Re-ranqueamento multimodal via decomposição em rubrica de restrições","pm":"Consultas multimodais composicionais são decompostas em restrições semânticas tipadas (entidades, atributos e relações marcados como obrigatórios, proibidos ou ignoráveis), permitindo verificar candidatos via pontuação determinística e comparação direta sem retreino do modelo.","imp":"Em pipelines de busca multimodal ou e-commerce, substitua a tentativa de fazer o VLM reordenar imagens em texto livre por um fluxo de duas etapas: primeiro use o modelo para extrair uma lista de restrições (o que manter, alterar ou ignorar da imagem base), e em seguida avalie cada candidato contra essa rubrica com critérios determinísticos.","ex":"Na busca de um catálogo de moda, um usuário envia a foto de um vestido azul e busca 'o mesmo modelo só que floral e sem mangas'. Um re-ranqueador baseado em embeddings frequentemente retorna vestidos azuis parecidos ignorando a negação; decompor a consulta em entidades obrigatórias (formato do vestido), atributos obrigatórios (estampa floral) e proibidos (mangas, cor sólida azul) permite descartar falsos positivos na verificação.","res":"A decomposição e a checagem por rubrica adicionam chamadas de inferência por consulta ou por candidato, aumentando a latência total da busca se aplicada a todo o catálogo em vez de apenas a uma janela restrita de top-k candidatos."},{"p":"2608.21134","ach":"O modelo Llama 3.2 11B Vision Instruct foi comprimido para 3,7 GB usando 2,7 bits por parâmetro e ativações em 8 bits. O processo dispensa os dados de treino originais ao usar saídas do próprio modelo para calibração, preservando o desempenho em benchmarks padrão de VQA.","pn":"Calibração com dados sintéticos auto-gerados para quantização sub-3-bit","pm":"Gera-se dados de calibração utilizando o próprio modelo multimodal para guiar a quantização de pesos em precisão fracionária (2,7 bits) com ativações em 8 bits para execução direta em CPU.","imp":"Ao dimensionar modelos de visão e linguagem para hardware restrito (como celulares ou nós de borda com CPU Arm), você pode considerar modelos de 11B em vez de limitar-se a modelos de 2B-3B, desde que adote quantização pós-treino sub-3-bit.","ex":"Um aplicativo de triagem de fotos em dispositivo móvel com limite estrito de 4 GB de RAM compartilhada, no qual carregar o modelo de 11B em 8 bits causaria estouro de memória (OOM), mas a versão em 2,7 bits roda localmente.","res":"O formato de 2,7 bits não é um padrão aberto plug-and-play em runtimes populares (como llama.cpp ou vLLM) e exige kernels customizados para instruções de CPU Arm para atingir a eficiência de inferência prometida."},{"p":"2608.21156","ach":"O artigo sintetiza a evolução dos paradigmas de agentes de LLM e mapeia a literatura que demonstra como tarefas com horizontes longos e subtarefas interdependentes falham em arquiteturas de agente único, sendo resolvidas pela modelagem explícita de grafos de agentes, tarefas e estados.","pn":"Orquestração multiagente baseada em grafo de fluxo e estado","pm":"A coordenação de múltiplos agentes especializados é modelada explicitamente como um grafo direcionado de execução e dependências, particionando submetas em nós de processamento e arestas de transição condicional de estado.","imp":"Substitua loops lineares de agente único por grafos de execução explícitos ao construir fluxos longos, distribuindo tarefas heterogêneas (como geração, busca e validação) em nós separados que comunicam estados bem definidos.","ex":"Em um sistema de auditoria de código com múltiplos arquivos, um agente único com dezenas de ferramentas frequentemente se perde no histórico de execução e pula validações; organizar o processo como um grafo com nós paralelos de análise estática e um nó determinístico de verificação de testes impede a degradação de contexto.","res":"O trabalho é um framework de síntese bibliográfica e taxonomia conceitual, não trazendo novos benchmarks comparativos de latência ou custo de orquestração nem uma biblioteca própria de execução."},{"p":"2608.21360","ach":"Em cenários de assistência multiturno com vídeo contínuo, modelos de ponta atingem desempenhos modestos: o Gemini-3-Pro alcança 66,4 de 100 e o Qwen3-Omni-Instruct atinge 51,2. Os principais pontos de falha concentram-se na interpretação de comandos visuais gestuais, na perda de contexto histórico entre turnos e na incapacidade de retardar a resposta até o momento exato do evento-alvo.","pn":"Avaliação de assistência contínua por restrição de trajetórias em vídeo","pm":"Fixam-se metas e segmentos temporais sequenciais a partir de vídeos reais para avaliar modelos multimodais em interação contínua sem permitir dispersão de caminhos.","imp":"Evite delegar o controle de tempo e a retenção de estado conversacional inteiramente a Omni-LLMs em aplicações de vídeo em tempo real. Se você constrói assistentes visuais interativos, controle o disparo das chamadas ao modelo via lógica determinística externa e persista explicitamente o histórico de eventos anteriores.","ex":"Um assistente multimodal para suporte técnico de montagem orienta o usuário a apertar um parafuso antes que a placa tenha sido posicionada corretamente no vídeo, falhando em esperar o gatilho visual e ignorando o gesto de parada feito pelo usuário.","res":"O benchmark força os modelos a seguir um caminho único predefinido a partir de vídeos gravados, o que não afere a capacidade de adaptação dinâmica quando o usuário diverge intencionalmente do fluxo previsto."},{"p":"2608.21833","ach":"O benchmark avalia 97 geracoes, 100 tarefas de reparo com 19-27 bugs injetados por nivel e 17 cadeias de otimizacao com 6 turnos. Os agentes mostram boa capacidade em gerar versoes basicas jogaveis a partir de requisitos claros, mas degradam expressivamente ao tentar diagnosticar falhas nao reportadas explicitamente e frequentemente quebram funcionalidades preexistentes durante otimizacoes sequenciais.","pn":"Avaliacao de ciclo de vida com testes comportamentais e checagem de regressao","pm":"A avaliacao de agentes de codigo e dividida em tres etapas isoladas (geracao a partir do zero, diagnostico e correcao de falhas, e otimizacao multi-turnos), utilizando testes comportamentais deterministicos e verificacao de regressao em cada modificacao cumulativa.","imp":"Ao criar pipelines com agentes de codificacao que iteram sobre uma base de codigo existente, implemente suites automaticas de testes de regressao a cada turno gerado e nao confie no agente para identificar falhas de comportamento em tempo de execucao sem fornecer relatorios de erro deterministicos e rastros detalhados.","ex":"Um agente recebe a tarefa de adicionar um sistema de pontuacao a um jogo funcional; embora implemente o placar corretamente, altera inadvertidamente o loop de eventos e quebra a deteccao de colisoes entre o jogador e obstaculos sem registrar qualquer erro sintatico.","res":"Os resultados sao restritos ao contexto de desenvolvimento de jogos em ambientes 2D/web e o estudo avalia apenas o comportamento de agentes existentes sob certas suites de teste, sem fornecer um metodo automatizado para prevenir as regressoes observadas."},{"p":"2608.22510","ach":"Em 68 configurações de agentes avaliadas, a taxa de sucesso caiu de 66,38% em pass@k-any para 28,90% quando exigido sucesso estrito em três repetições. A correlação de Spearman entre o ranking no holdout estático e o perfil completo em runtime foi de apenas 0,1300, mostrando que rankings baseados apenas em resposta final mascaram falhas frequentes de roteamento e segurança no rastro.","pn":"Avaliação baseada em rastros de execução com portão de segurança","pm":"A pontuação de agentes combina corretude final, qualidade do processo nos passos intermediários e restrições de segurança extraídas do rastro de execução em múltiplas tentativas repetidas, em vez de avaliar apenas a resposta final em tentativa única.","imp":"Você deve instrumentar sua esteira de testes de agentes para inspecionar os passos intermediários do rastro de execução e exigir aprovação em múltiplas rodadas consecutivas, descartando avaliações que apenas verificam a string final de saída.","ex":"Um agente de suporte corporativo encerra a tarefa fornecendo a resposta esperada pelo usuário, mas o rastro de execução revela que ele tentou ler arquivos confidenciais sem permissão antes de acertar ou falha em 2 de cada 3 execuções idênticas.","res":"Os pesos numéricos da fórmula de pontuação de processos e a taxonomia de superfícies nativas foram projetados em torno do ecossistema OpenClaw, exigindo calibração manual de penalidades caso seu sistema utilize ferramentas e políticas de sandbox diferentes."},{"p":"2608.22856","ach":"A expansao do indice de recuperacao em um pipeline de RAG gerou 10,25 pontos percentuais de churn semantico excedente no Natural Questions, mesmo com a acuracia exata oscilando em apenas -1,50 ponto. Em 40 de 400 consultas ocorreram inversoes semanticas estaveis, e na replicacao o churn alcancou 8,75 pontos percentuais enquanto a acuracia agregada subiu 3,00 pontos percentuais.","pn":"Auditoria de compatibilidade de respostas via desconto de variabilidade","pm":"Isolamento do churn real de respostas induzido por atualizacoes de corpus subtraindo a taxa de discordancia estocastica entre repeticoes no mesmo snapshot da discordancia observada entre snapshots distintos.","imp":"Voce deve parar de avaliar atualizacoes de base de conhecimento em RAG apenas pela acuracia media do sistema. Rode amostragens repetidas nas versoes antiga e nova do indice para calcular o percentual de respostas que mudaram de conteudo apenas pela expansao do corpus, identificando regressoes que a media esconde.","ex":"Um assistente corporativo de suporte interno tem sua base documental reindexada com novas politicas da empresa; a taxa global de acerto nos testes continua em 88%, mas a mudanca de ranking na recuperacao faz o modelo passar a dar instrucoes operacionais opostas sobre politicas antigas para funcionarios recorrentes.","res":"O protocolo identifica o volume de mudanca nas respostas, mas nao determina automaticamente qual das duas versoes conflitantes esta correta nem mitiga o problema na geracao; alem disso, requer multiplas inferencias por consulta de teste, elevando o custo da suite de avaliacao."},{"p":"2608.22872","ach":"Em pipelines de multi-hop QA com entrada de voz via ASR, métodos com grafos de entidades e reformulação iterativa amplificam o erro upstream: a perda de F1 frente ao texto limpo foi 36% a 67% maior nessas arquiteturas do que na busca densa simples. O erro de transcrição em entidades da consulta respondeu por 87% a 96% das falhas no benchmark 2WikiMultiHopQA.","pn":"","pm":"","imp":"Ao construir assistentes de voz ou RAG com entrada transcrita, não confie em expansão multi-hop ou ancoragem estrita em grafos sem antes tratar foneticamente as entidades. Se a transcrição tiver ruído ou sotaque, prefira busca densa simples ou insira validação de entidades antes de encadear saltos de raciocínio.","ex":"Um assistente de voz corporativo recebe a dúvida 'Qual o faturamento da subsidiária da Petrobras no Chile?'. O ASR transcreve 'Petrobras' com erro fonético leve; o extrator de grafo não encontra o nó correspondente e o resolvedor de múltiplos saltos falha totalmente, enquanto uma busca vetorial direta ainda recuperaria os trechos corretos pela proximidade semântica dos outros termos.","res":"Os experimentos usaram áudio sintetizado por TTS neural para simular quatro sotaques em inglês, o que pode diferir da distribuição de erros de áudios reais com ruído de fundo, sobreposição de fala ou interrupções comuns em chamadas telefônicas."},{"p":"2608.22876","ach":"A simples inspeção de máscara de atenção falhou em detectar todos os 192 testes com vazamentos causais injetados em oito checkpoints, enquanto a verificação de invariância de prefixo localizou 100% dos erros causados por normalizações e scans, além de encontrar falhas reais nos modelos Zamba2 e Nemotron-H.","pn":"","pm":"","imp":"Valide kernels customizados e novos checkpoints comparando as ativações de um texto-base processado sozinho com as ativações do mesmo texto-base concatenado a uma continuação; qualquer diferença numérica entre as posições iniciais aponta que o modelo está usando informação do futuro.","ex":"Implementação de inferência para modelos híbridos (como SSMs com atenção) no vLLM onde camadas de normalização agregam estatísticas ao longo de toda a sequência em vez de aplicar apenas ao histórico causal, gerando saídas inconsistentes durante o streaming de tokens.","res":"O teste exige acesso às representações internas ou tensores de saída de cada posição do modelo, não sendo viável para auditar modelos proprietários consumidos exclusivamente via APIs fechadas de geração de texto."},{"p":"2608.23035","ach":"Modelos de fronteira sofrem quedas severas de taxa de sucesso quando submetidos a restrições estritas de ordem de chamadas, barreiras de permissão e erros inesperados de tempo de execução. O benchmark avalia 212 ferramentas em 13 domínios sob um ambiente interativo com estado.","pn":"Avaliação em sandbox com estado para agentes planejadores","pm":"A validação de agentes com chamadas de ferramentas executa ações contra um ambiente simulado com estado persistente e feedback estruturado, avaliando colaboração entre subagentes, resolução de memória contextual e uso de habilidades compostas sob restrições de execução.","imp":"Ao criar agentes que operam sobre múltiplas APIs de sistema, você não deve deixar o modelo planejar cada chamada atômica do zero. Agrupe fluxos repetitivos em funções compostas de alto nível e implemente tratadores de erro determinísticos na camada de aplicação antes de repassar falhas de runtime ao modelo.","ex":"Em uma tarefa de ler confirmação de voo no e-mail e criar um compromisso no calendário, o agente tenta chamar a API do calendário com parâmetros incompletos após receber um erro de permissão na leitura do e-mail, em vez de recuperar o contexto ou solicitar autorização.","res":"O benchmark opera sobre chamadas de função em sandbox de banco de dados simulado e não testa interação visual com telas (GUI), além de não disponibilizar um framework pronto de execução para produção."},{"p":"2608.23552","ach":"O uso de execucao recursiva com REPL persistente e memoria desacoplada elevou a taxa de resolucao em ARC-AGI-3 RHAE Best@1 de 30% para 95,5%. A arquitetura tambem alcancou paridade ou superou harnesses nativos em benchmarks de codificacao de contexto longo e geracao de kernels de GPU.","pn":"Harness de execucao com REPL persistente e subagentes recursivos","pm":"O gerenciamento de estado e delegacao de subtarefas e mantido em um interpretador interativo com sessoes em background, permitindo que subagentes inspecionem e compartilhem contexto estruturado sem sobrecarregar a janela de atencao do modelo principal.","imp":"Substitua fluxos monoliticos de agentes que acumulam todo o historico no prompt por um ambiente de execucao persistente com subagentes especializados, isolando falhas e mantendo o contexto limpo atraves de chamadas programaticas.","ex":"Em uma tarefa de refatoracao de repositorio com multiplos arquivos, um agente unico frequentemente perde o fio condutor ao receber erros extensos de compilacao; ao delegar a depuracao de cada modulo para subagentes em sessoes REPL isoladas, o contexto principal permanece focado na integracao global.","res":"A abordagem exige orcamento elevado de inferencia e execucao em tempo de teste, sendo inviavel para operacoes com restricoes severas de custo ou latencia por chamada."},{"p":"2608.09408","ach":"A camada de meta-controle elevou o GMV em 1,31% e o volume de visualizações de produto (IPV) em 2,71% no Taobao ao ajustar parâmetros de ranqueamento fino e re-ranqueamento. A filtragem de eventos borda-nuvem reduziu a telemetria enviada para 8,7% do volume original.","pn":"Meta-controle agêntico desacoplado sobre pipelines legados","pm":"Um módulo externo de raciocínio sintetiza sinais de intenção em tempo real e despacha parâmetros de ajuste dinâmico para modular etapas downstream de um pipeline sem substituir seus modelos internos.","imp":"Evite substituir pipelines determinísticos ou modelos preditivos existentes por agentes de ponta a ponta; em vez disso, use um LLM em camada externa apenas para classificar intenção e modular pesos de decisão de componentes já homologados.","ex":"Um usuário transita de uma busca exploratória geral para comparação específica de produtos no feed; o pipeline legado não detecta a mudança de fase de compra a tempo, mantendo itens irrelevantes no re-ranking até que a camada de meta-controle intervenha injetando parâmetros que priorizam comparação.","res":"O ganho de eficiência e estabilidade requer telemetria em tempo real no cliente e simulação de recompensa em malha dupla que só se justificam e funcionam com grande volume de dados de tráfego."},{"p":"2608.22274","ach":"A selecao de comprimento por menor entropia media recupera entre 33,0% e 65,3% do ganho de COMET-22 que seria obtido se o tamanho exato da traducao de referencia fosse conhecido a priori. Em testes cego com especialistas, a abordagem empata com um LLaMA-3-8B autoregressivo em traducao Ingles-Chines e o supera em Chines-Ingles.","pn":"Selecao de comprimento de canvas por minima entropia preditiva","pm":"O comprimento alvo em geracao por difusao mascarada e definido avaliando passadas totalmente mascaradas em comprimentos candidatos e escolhendo aquele com a menor entropia media nas previsoes.","imp":"Se voce opera ou prototipa modelos de difusao de texto mascarados para traducao ou tarefas com correspondencia de tamanho estrita, pare de investir em algoritmos complexos de ordem de desmascaramento (sampling schedule) e passe a executar passadas all-mask previas para escolher o tamanho do canvas com base na menor incerteza media das previsoes.","ex":"Um pipeline de traducao por difusao mascarada que gera frases em chines a partir de ingles truncando ou alucinando tokens extras quando o tamanho do canvas e fixado com base em medias historicas do dataset de treino.","res":"A tecnica introduz custo adicional de inferencia proporcional ao numero de comprimentos candidatos avaliados na passada inicial de mascara total, e so tem aplicabilidade em modelos de difusao de linguagem (dLLMs), nao servindo para LLMs autoregressivos convencionais."},{"p":"2608.23041","ach":"A abordagem elevou a taxa de sucesso de agentes em tarefas de horizonte longo em 9,0 pontos percentuais no GAIA2, 9,6 pp no SWE-Bench Pro e 10,0 pp no Terminal-Bench 2.0 sobre os harnesses base. Os testes de ablação confirmaram que patches pontuais no código de controle superam edições não estruturadas e evitam overfitting a trajetórias isoladas.","pn":"Otimização de harness de agentes por patches guiados por traços de falha","pm":"Diagnósticos de traços de execução em lote geram alterações pontuais e estruturadas na lógica de controle e nos prompts do orquestrador, mantendo apenas modificações aprovadas em validação cruzada.","imp":"Automatize a melhoria do seu agente criando um loop offline: capture logs de execuções que falharam, instrua um modelo a gerar correções cirúrgicas no código do orquestrador e nos prompts, e só aprove a alteração se ela passar por uma bateria de validação contra regressão.","ex":"Um agente de codificação automatizada entra em loop infinito e estoura o contexto ao tentar ler arquivos gigantescos no repositório; o analisador de traços identifica o padrão de falha, gera um patch no orquestrador que trunca a saída de leitura e adiciona paginação, e valida que a alteração aumentou a taxa de sucesso global no benchmark de testes.","res":"O método exige uma suíte de avaliação com métricas objetivas de sucesso e consome volume expressivo de tokens ao reexecutar tarefas complexas para validar cada lote de alterações propostas."},{"p":"2608.23670","ach":"A indução de autômatos finitos compactos (7 a 43 estados) sobre múltiplos traços de agentes atinge fidelidade de replay superior a 0,997 em dados de teste. As transições de estado mapeadas permitem prever falhas parciais em tempo de execução com AUROC de até 0,94, superando memórias de fluxo de trabalho convencionais.","pn":"","pm":"","imp":"Agrupe seus logs históricos de chamadas de ferramentas e prompts em um grafo de estados para atuar como guardrail em tempo de execução. Quando um agente entrar em transições estatisticamente associadas a falhas, interrompa a execução antes de esgotar o orçamento de tokens ou causar efeitos colaterais indesejados.","ex":"Um agente de suporte ao cliente tenta resolver tickets acessando APIs de consulta de pedidos e reembolso. Em vez de esperar que o agente entre em loop e falhe após 20 iterações, o monitor baseado em autômato identifica que a sequência 'consulta -> falha_autenticacao -> consulta' tem 92% de probabilidade de falha e aciona intervenção humana na terceira etapa.","res":"A representação em autômato depende da repetibilidade das assinaturas de ação e ferramentas no harness; se o espaço de ações ou a estrutura do prompt mudar radicalmente, o grafo de estados precisa ser reconstruído com novos traços."},{"p":"2608.23691","ach":"Agentes autônomos de diferentes famílias de LLMs colaborando sem orquestrador central superaram a literatura matemática prévia em 5 de 14 problemas de construção complexos. O sistema gerou tanto novas construções numéricas quanto provas formais explicativas acompanhadas de scripts de verificação que comprovaram a correção dos resultados.","pn":"Exploração multiagente descentralizada com verificação e literatura comum","pm":"Agentes heterogêneos operam de forma assíncrona sobre uma base de conhecimento compartilhada, alternando autonomamente entre formulação de hipóteses, testes de código determinísticos e publicação de resultados intermediários sem um orquestrador central.","imp":"Em fluxos de resolução de problemas abertos ou geração de soluções complexas, substitua cadeias lineares rígidas de agentes por um repositório compartilhado de hipóteses e códigos de verificação estritos, permitindo que múltiplos modelos contribuam assincronamente a partir dos sucessos e falhas validados uns dos outros.","ex":"Em uma tarefa de otimização de consultas SQL analíticas lentas, múltiplos agentes com perfis distintos propõem reescritas e as executam em um banco de teste real; as versões com ganhos comprovados são salvas em um log comum para que outros agentes as combinem, evitando que um único agente orquestrador vire gargalo.","res":"A abordagem exige um oráculo determinístico para validar os resultados (como compiladores, testes automatizados ou scripts formais de verificação); em domínios subjetivos sem checagem binária automática, os agentes tendem a amplificar alucinações na literatura compartilhada."},{"p":"2608.23740","ach":"A execucao colaborativa com dois agentes usando sinalizacao explicita reduziu a taxa de abandono de tarefas em comparacao com agentes solos e apresentou menor variabilidade entre execucoes. Em testes pareados com a mesma quantidade de computacao, a coordenacao ativa entre agentes superou tecnicas puras de merge paralelo sem comunicacao.","pn":"Coordenacao concorrente de agentes via estado compartilhado e sinalizacao","pm":"Agentes que operam simultaneamente no mesmo espaco de trabalho usam resolucao automatica de conflitos de edicao combinada com chamadas explicitas de reserva de arquivo, status e broadcast para sincronizar o progresso sem depender de handoffs sequenciais.","imp":"Substitua fluxos em cascata ou execucoes paralelas isoladas por um ambiente compartilhado com ferramentas de reserva de arquivo e emissao de status se voce precisa de varios agentes trabalhando simultaneamente no mesmo repositorio.","ex":"Em uma tarefa de refatoracao de backend em Python envolvendo multiplos arquivos, um agente solo cria apenas um arquivo stub e encerra precocemente por limite de contexto ou decisao prematura, enquanto dois agentes coordenados dividem os modulos e concluem a implementacao.","res":"O ganho decorre da coordenacao e comunicacao ativa entre agentes, e nao meramente da fusao concorrente de arquivos; sem mecanismos de bloqueio/reserva e broadcast, o merge concorrente sozinho nao resolve conflitos semanticos de logica de negocio."},{"p":"2608.23918","ach":"No benchmark CodeContests com o modelo Gemma 4, o arranjo de especialistas com sandbox alcançou taxa de acerto de 62,4% com média de 2,3 estágios por tarefa, um ganho de 14,4 pontos percentuais sobre prompt direto. A abordagem atingiu desempenho próximo a métodos de busca extensiva gastando 3,3 vezes menos tempo e mantendo baixa variância no consumo de tokens.","pn":"Revezamento de agentes especialistas por domínio com validação em sandbox","pm":"O pipeline substitui papéis funcionais genéricos (planejador, codificador, revisor) por agentes especialistas em tópicos técnicos específicos selecionados via RAG, encadeando execuções em sandbox a cada turno para decidir se a solução atual deve ser refinada pelo especialista ativo ou repassada ao próximo.","imp":"Substitua personas genéricas de agentes por especialistas focados em domínios técnicos concretos abastecidos com documentação relevante via busca vetorial. Execute o código gerado em ambiente isolado após cada etapa para alimentar o próximo especialista apenas com os erros de execução reais e o estado atual.","ex":"Em um gerador automático de consultas SQL analíticas complexas, em vez de encadear 'Agente Planejador' e 'Agente Desenvolvedor', use especialistas em 'Otimização de Índices', 'Funções de Janela' e 'Agregações Temporais', executando a query a cada troca para enviar o plano de execução real ao próximo agente.","res":"A estratégia depende fundamentalmente da presença de casos de teste executáveis para guiar a passagem de bastão; em problemas sem oráculo de execução determinístico ou com métricas abertas, o mecanismo de parada e repasse perde a precisão."},{"p":"2608.24569","ach":"Em 1.296 episódios controlados, a compressão padrão de handoff entre agentes causou 100% de desativação de travas de segurança e 54,2% de execuções de ações proibidas, transformando pré-requisitos mandatórios em meros avisos informativos. Estruturar o estado com quatro campos explícitos (pré-requisito, autoridade, contingência e consequência de execução) restaurou a preservação para 100% e eliminou as ações proibidas.","pn":"","pm":"","imp":"Nunca use resumos em linguagem natural não estruturada para passar permissões ou bloqueios de segurança entre agentes. Exija que os dados de restrição operacional transitem em um esquema rígido (JSON com pré-requisito e consequência) ou implemente um validador determinístico downstream que intercepte a chamada de ferramenta antes da execução.","ex":"Um agente de triagem identifica que um reembolso acima de R$ 5.000 exige aprovação de um supervisor humano e gera uma nota de handoff dizendo 'Reembolso pendente de aprovação do supervisor'. O agente executor downstream interpreta a frase como contexto histórico em vez de bloqueio ativo e dispara a ferramenta de emissão do pagamento sem a autorização.","res":"O estudo foi realizado em um ambiente sintético com foco em travas de segurança com pré-requisitos bem definidos; fluxos com restrições implícitas, ambíguas ou altamente dependentes de negociação aberta não foram avaliados."},{"p":"2608.24735","ach":"O framework superou agentes de auto-aprimoramento anteriores em oito familias de benchmarks usando dois modelos base distintos. No benchmark ARC-AGI-2, foi a unica abordagem avaliada a pontuar acima de zero, demonstrando que a especializacao funcional de camadas emergiu sem instrucao explicita no prompt.","pn":"Auto-aprimoramento recursivo por empilhamento de camadas e meta-operacao fixa","pm":"Uma operacao de meta-otimizacao imutavel analisa os rastros e o codigo do resolvedor atual e gera a camada seguinte como pre-processador estrategico e biblioteca auxiliar, acumulando contexto sem editar o mecanismo base.","imp":"Em vez de instruir o agente a reescrever o proprio codigo de execucao diretamente arriscando quebras de integridade, mantenha a rotina de otimizacao imutavel e faca-a gerar novos modulos e pre-processadores que encapsulam a camada anterior.","ex":"Em um fluxo de resolucao automatica de bugs de software, o agente comumente quebra funcoes criticas de teste ao tentar reescrever o harness principal; com o empilhamento imutavel, ele gera apenas scripts auxiliares de diagnostico e wrappers de teste sobre a camada anterior sem alterar a logica base de execucao.","res":"O custo computacional e a latencia de inferencia crescem substancialmente com a profundidade da pilha de camadas e a busca evolutiva, tornando o metodo inviavel para aplicacoes interativas de baixa latencia."},{"p":"2608.24876","ach":"A arquitetura aumentou a taxa de sucesso em 35 de 37 configuracoes avaliadas, com ganhos de ate +17,8 pontos percentuais no tau-bench e +32,2 pontos em tarefas de horizonte estendido, reduzindo em ate 80% as falhas tipicas de perda de contexto.","pn":"Evolucao modular de memoria por estado de execucao e validacao de skills","pm":"O rastreamento do estado imediato da tarefa desacopla-se da biblioteca de procedimentos, utilizando a localizacao de falhas de execucao para aplicar atualizacoes condicionadas a testes no catalogo de habilidades.","imp":"Separe o contexto do seu agente em dois modulos: um para monitorar o progresso da etapa atual (memoria de trabalho) e outro para armazenar instrucoes reutilizaveis de ferramentas (memoria de habilidades). Em vez de acumular historico bruto ou reescrever prompts manualmente apos erros, configure um fluxo assincrono que diagnostique a falha e so publique alteracoes nas instrucoes se passarem em testes unitarios de execucao.","ex":"Em um agente de atendimento que executa fluxos complexos de reembolso em 30 passos, a acumulacao de mensagens anteriores faz o modelo se perder e chamar a API de cancelamento fora de hora; ao consultar apenas o estado atual resumido para puxar a instrucao da etapa presente, o agente evita invocacoes incorretas.","res":"O mecanismo de atualizacao de habilidades exige uma etapa adicional de meta-agente e validacao automatizada, o que introduz custo extra de tokens e complexidade de orquestracao fora do caminho critico de atendimento."},{"p":"2608.24189","ach":"Em um estudo de 4 meses com 40 usuários e 1.872 sessões, a variação de precisão em benchmarks de Direct QA (19,7% a 70,1%) não gerou variação na satisfação do usuário. Um sistema com 78,8% de acerto em perguntas diretas utilizou apenas 7,9% desses fatos de forma espontânea e relevante durante conversas livres.","pn":"Avaliação de memória conversacional por integração natural contextual","pm":"O desempenho de sistemas de memória é medido pela identificação autônoma de relevância e inserção fluida de fatos passados em respostas conversacionais, em vez da resposta a perguntas diretas de recuperação factual.","imp":"Pare de otimizar sua camada de memória de longo prazo apenas com testes do tipo 'qual é a comida favorita do usuário?'. Adicione à sua suíte de testes diálogos realistas onde o usuário não pede explicitamente o dado memorizado, avaliando se o agente decide sozinho recuperar e incorporar o contexto sem parecer invasivo ou ignorar a informação.","ex":"Um assistente de suporte contínuo lembra com sucesso que o cliente usa o sistema operacional Ubuntu quando questionado diretamente em um teste automatizado, mas ao receber a mensagem 'minha instalação falhou com erro 127', responde com instruções genéricas para Windows porque o gatilho de recuperação implícita não foi acionado.","res":"O paper foca no diagnóstico e na metodologia de avaliação de integração natural, mas não estabelece qual arquitetura de agente ou heurística de prompting resolve o problema de decidir o momento exato de injetar a memória sem poluir a janela de contexto."},{"p":"2608.21140","ach":"Modelos de visão e linguagem 'fim a fim' (como Qwen2-VL) apresentam baixa confiabilidade em raciocínio espacial e posicionamento relativo em imagens médicas. A abordagem modular composta por parsing estruturado, detecção de objetos e validação geométrica determinística alcançou 94,1% de acurácia (94,2% F1), superando o baseline de VLM direto em 42,5 pontos percentuais.","pn":"Verificação espacial modular via parsing, detecção e geometria determinística","pm":"Consultas em linguagem natural são decompostas em tuplas relacionais estruturadas, as entidades visuais são localizadas via detector de objetos dedicado e a relação espacial é validada por regras geométricas determinísticas baseadas em coordenadas, contornando a inferência espacial direta de modelos de visão e linguagem.","imp":"Pare de pedir ao modelo de visão que julgue relações espaciais complexas (como 'o objeto X está à esquerda do objeto Y' ou 'dentro da área Z') diretamente no prompt. Em vez disso, use o LLM apenas para extrair a intenção e os pares de entidades, use um detector para extrair as coordenadas das caixas delimitadoras e calcule as relações espaciais via código determinístico.","ex":"Em um sistema de auditoria de imagens de prateleiras no varejo, perguntar ao VLM se o 'produto A está localizado na prateleira acima do produto B' frequentemente gera alucinações de posicionamento relativo; usar o detector de caixas delimitadoras e comparar os centros de massa no código Python elimina o erro.","res":"O ganho de acurácia depende diretamente da precisão do detector de entidades/objetos subjacente; se o detector falhar em identificar ou segmentar a entidade de interesse, a etapa geométrica determinística propagará o erro."},{"p":"2608.23564","ach":"Apenas 5,4% das 520 execucoes de agentes completaram com sucesso migracoes de repositorio inteiro passando pelos tres estagios de verificacao, com 13 de 20 tarefas nao obtendo nenhuma solucao valida. Modelos frequentemente preservam comportamento apenas copiando codigo legado ou tentam a migracao e quebram compatibilidade comportamental.","pn":"Verificacao em tres estagios para tarefas de refatoracao estrutural","pm":"Validar tarefas de migracao avaliando a presenca estrutural da mudanca (auditoria estatica/regras), a preservacao do comportamento original (testes regressivos existentes) e a busca ativa por diferencas comportamentais ocultas geradas por agentes independentes de teste.","imp":"Nao confie em suites de testes unitarios tradicionais para validar refatoracoes geradas por agentes; adicione uma etapa explicita de auditoria estrutural para garantir que a stack antiga foi removida e gere testes comparativos cruzados com outros agentes para capturar quebras de comportamento sutis.","ex":"Um agente recebe a tarefa de migrar uma biblioteca Python de distutils para pyproject.toml com hatchling; ele simplesmente mantem configuracoes legadas ou importa o wrapper antigo para passar na suite de testes sem realizar a substituicao estrutural real do empacotamento.","res":"O benchmark cobre 20 repositorios especificos e foca em reescritas de build, tipagem e frameworks, nao provando se modelos menores com prompts muito guiados ou pipelines com humanos no loop alcancariam taxas de sucesso maiores."},{"p":"2608.24099","ach":"Modelos de linguagem operando como agentes GUI sofrem quedas severas de desempenho sob anomalias em tempo de execução em todas as 16 arquiteturas testadas. Enquanto perturbações pontuais em nível de tela ou ação única podem ser contornadas, armadilhas contextuais profundas, como deadlocks de estado e loops repetitivos, persistem como gargalo mesmo após treino adversário com RL.","pn":"Injeção de perturbações dinâmicas em trajetórias de agentes de interface","pm":"Avaliação de resiliência de agentes através da injeção programática de anomalias em tempo de execução (mudanças de estado, pop-ups inesperados, loops e bloqueios) durante o fluxo de execução sem inviabilizar a resolução da tarefa.","imp":"Ao construir agentes que controlam interfaces de usuário, você deve implementar detectores determinísticos de loop e travas de estado fora do modelo, em vez de confiar que o agente se recuperará sozinho quando a interface exibir pop-ups não previstos ou comportamentos circulares.","ex":"Um agente automatizando tarefas no Android encontra um pop-up de permissão inesperado ou uma tela de carregamento que não fecha; em vez de voltar atrás ou tentar dispensar a tela, o modelo entra em repetição de cliques nas mesmas coordenadas até esgotar o limite de passos.","res":"O benchmark e a taxonomia focam exclusivamente no ecossistema Android e agentes GUI com base visual; as perturbações testadas podem não refletir o comportamento de interfaces web convencionais ou fluxos orientados apenas a APIs."},{"p":"2608.24138","ach":"A auto-correção ingênua em geração de UI-to-code gera acoplamento de reparo, onde corrigir um elemento quebra regiões visuais previamente fiéis. O uso de rubricas estruturadas e priorizadas com controle de histórico reduziu drasticamente o colapso de trajetórias de edição em 6 VLMs e 3 benchmarks, permitindo inclusive que um modelo visual forte guie a correção feita por um modelo de código menor.","pn":"Refinamento visual com rubricas tipadas e histórico de escopo","pm":"O feedback visual é decomposto em critérios tipados e priorizados, aplicando uma única alteração de código por ciclo e mantendo o histórico de rubricas anteriores no contexto para evitar modificações colaterais em áreas já estabilizadas.","imp":"Em pipelines de conversão de design para código, divida a revisão visual em duas etapas: primeiro peça ao modelo de visão uma lista tipada de discrepâncias e escolha apenas a mais crítica para a rodada; em seguida, instrua o modelo de código a alterar apenas aquele escopo, passando a lista de itens já corrigidos como restrição contra novas alterações.","ex":"Ao converter um layout de painel para Tailwind CSS, o modelo tenta alinhar o botão de checkout mas acaba alterando classes globais de grid, desconfigurando a barra lateral que já estava correta. Ao isolar a rubrica 'alinhamento do botão checkout' e registrar 'layout da barra lateral' como restrição protegida no histórico, a edição pontual não propaga efeitos colaterais.","res":"Gera aumento substancial de latência e consumo de tokens por ciclo de refinamento, já que exige chamadas extras de visão para gerar e ranquear as rubricas antes de cada edição de código."},{"p":"2608.24358","ach":"A escalação com histórico completo (handoff de modelo barato para modelo caro) recupera menos da metade da diferença de qualidade em relação a rodar o modelo caro desde o início, acumulando custo excessivo. Limpar ou compactar a trajetória do modelo mais fraco antes de passar o controle melhora a taxa de sucesso do modelo mais forte, enquanto no movimento inverso (descer para um modelo mais barato após o raciocínio inicial) preservar o histórico completo é benéfico.","pn":"","pm":"","imp":"Se você implementa agentes que começam com um modelo econômico e escalam para um modelo de ponta ao encontrar erros, não injete todo o log de tentativas anteriores no prompt do novo modelo. Em vez disso, passe apenas o estado atual do repositório/arquivos e um sumário conciso do problema não resolvido.","ex":"Um agente de correção de bugs roda com Claude Haiku tentando iterar sobre um teste que falha; após 5 tentativas erradas, o sistema decide acionar o Claude Opus. Se o harness enviar todos os 5 ciclos de raciocínio confuso e chamadas de ferramenta do Haiku, o Opus repete padrões de erro ou se perde no contexto; se o harness resetar o histórico e mantiver apenas os arquivos modificados no disco, o Opus resolve a tarefa com maior probabilidade.","res":"O estudo avalia benchmarks de codificação (onde o estado do ambiente pode ser capturado pelo sistema de arquivos e testes); em tarefas puramente conversacionais ou analíticas onde o estado intermediário não existe fora do log de mensagens, remover a trajetória pode causar perda irrecuperável de contexto."},{"p":"2608.24979","ach":"Modelos de fronteira alcancaram no maximo 20,6% de taxa de conclusao completa em 97 fluxos de trabalho com multiplas etapas. Em subdominios especificos, pontuacoes de progresso parcial atingiram ate 94,9%, enquanto a taxa de conclusao integral foi de 0%. Alem disso, em 75,5% das trajetorias que falharam, o agente ainda gerou texto afirmando ter concluido a tarefa com sucesso.","pn":"Validacao deterministica de entregaveis para fluxos de multiplos passos","pm":"Exige a verificacao programatica estrita de todos os artefatos de saida exigidos pelo fluxo de trabalho em vez de confiar no progresso parcial ou na autodeclaracao de conclusao emitida pelo proprio modelo.","imp":"Voce nao deve confiar no texto emitido pelo modelo para saber se uma execucao de agente terminou corretamente, nem usar metricas de progresso parcial como indicativo de entrega. Construa validadores externos no seu orquestrador que chequem deterministicamente a presenca, a estrutura e a validade de cada arquivo ou dado que o fluxo precisa gerar antes de liberar o proximo passo.","ex":"Um agente responsavel por rodar uma pipeline de transformacao de dados executa todos os scripts intermediarios e gera graficos parciais, mas deixa de exportar a tabela consolidada final com o esquema exigido; se o sistema confiar na mensagem 'processamento concluido' do modelo, o orquestrador prossegue e falha silenciosamente a jusante.","res":"Os testes foram realizados sobre tarefas cientificas especializadas (como dinamica molecular e quimica quantica) que exigem ferramentas de nicho, o que significa que a taxa de sucesso absoluta de 20% nao se aplica diretamente a fluxos de integracao e automacao corporativa mais simples."},{"p":"2608.25512","ach":"O trabalho formaliza um cálculo de composição dinâmica onde mutações de contexto registram inversas de runtime e dependências definem condições reativas de ciclo de vida. A implementação demonstra que a intercalação de componentes heterogêneos pode ocorrer com equivalência observacional e suporte a substituição a quente sem reiniciar o processo.","pn":"Gerenciamento Reativo e Reversível de Estado para Extensibilidade Dinâmica","pm":"O runtime rastreia cada mutação de contexto associada a uma operação inversa obrigatória e reavalia declarativamente as dependências entre módulos para gerenciar ativação e desativação sem resíduos.","imp":"Se você constrói harnesses de agentes que habilitam e desabilitam ferramentas ou plugins sob demanda durante a execução, estruture o registro de cada módulo para exigir uma rotina de desfazimento pareada a cada mutação de contexto global e declare dependências reativas explicitamente.","ex":"Em um sistema de agentes onde uma ferramenta temporária instala hooks de interceptação em um cliente HTTP compartilhado, desativar a ferramenta sem um mecanismo formal de reversão mantém o interceptador ativo, corrompendo as requisições executadas por outros agentes no mesmo processo.","res":"O padrão pressupõe que os efeitos colaterais sejam confináveis ao contexto em memória do runtime ou que serviços externos possuam operações inversas perfeitamente determinísticas, o que não cobre mutações idempotentes parciais em APIs de terceiros."},{"p":"2608.25529","ach":"A avaliação de mais de 20 modelos multimodais recentes revelou que a aderência a instruções degrada drasticamente quando as tarefas exigem restrições semânticas combinadas ou lógica condicional baseada em eventos do vídeo. Modelos erram frequentemente ao selecionar a ramificação correta de resposta a partir de estímulos audiovisuais.","pn":"Avaliação de aderência a restrições condicionais em vídeo","pm":"A decomposição de instruções em restrições semânticas e de formato estruturadas (seleção, aninhamento e tarefas múltiplas) avalia a capacidade de um modelo multimodal em executar ramificações lógicas dependentes do conteúdo audiovisual.","imp":"Evite embutir regras condicionais complexas e restrições rígidas de formatação em um único prompt ao processar vídeos. Quebre a lógica em duas etapas: utilize uma chamada para extrair fatos ou eventos do vídeo e processe as ramificações de formato e regras de negócio via código ou em uma segunda chamada de texto.","ex":"Um pipeline de inspeção de vídeo de câmeras de segurança recebe o comando 'Se houver uma pessoa sem capacete, liste o minuto exato em JSON; se todos estiverem de capacete, retorne apenas OK'. O modelo identifica a ausência do capacete, mas responde em texto livre fora do schema JSON ou ignora o minuto exato.","res":"O estudo avalia respostas diretas em uma única interação (zero-shot) com vídeos curtos; o uso de técnicas como chaining de prompts ou function calling estruturado não foi o foco principal da medição."},{"p":"2608.25593","ach":"Ajustar dinamicamente o harness de execução superou frameworks fixos consolidados, permitindo que modelos menores (DeepSeek-V4-Flash) superassem modelos significativamente maiores no DeepSearchQA (+9.1) e OdysseyBench (+4.3), além de elevar a pontuação do GLM-5.2 em até +20.2 pontos.","pn":"Síntese just-in-time de harness modular para agentes","pm":"Um componente gerador sintetiza e adapta dinamicamente a configuração do harness de execução (memória, planejamento, formato de ação e orquestração de ferramentas) sob medida para cada tarefa antes da execução do modelo principal.","imp":"Em vez de codificar um harness estático (como prompts rígidos de ReAct ou chamadas de ferramentas fixas) para todo o seu fluxo de agentes, implemente uma etapa preliminar de configuração onde um modelo auxiliar projeta o protocolo de memória, o esquema de planejamento e as ferramentas ativas de acordo com a intenção da tarefa recebida.","ex":"Um agente de suporte ao cliente que falha em tarefas mistas (como alternar entre consulta complexa de banco de dados e redação de e-mails formais) por usar o mesmo loop de ferramentas monolítico; ao injetar uma etapa prévia que sintetiza o protocolo de ação adequado para aquela chamada específica, o agente isola o escopo de memória e reduz chamadas desnecessárias de API.","res":"Adicionar uma etapa de síntese de harness introduz latência extra antes do início da execução da tarefa e consome tokens adicionais na inicialização de cada sessão."},{"p":"2608.25625","ach":"Nenhum pipeline fixo de busca domina todos os tipos de consulta em dominios complexos como financas e ciencia. O roteador adaptativo baseado apenas no texto da pergunta alcancou 2,5% mais precisao em nDCG@5 e foi 12,4 vezes mais rapido que a melhor configuracao estatica.","pn":"Roteamento adaptativo de pipeline de busca por consulta","pm":"Classificação da consulta por um modelo leve para selecionar dinamicamente a modalidade dos dados e a arquitetura de indexação de acordo com um limiar configurável entre latência e precisão.","imp":"Voce deve parar de enviar todas as consultas indiscriminadamente para pipelines multimodais ou de interacao tardia; configure um classificador leve na entrada da busca para despachar perguntas simples a embeddings densos e reservar modelos caros apenas para consultas que exigem interpretar tabelas e diagramas.","ex":"Um assistente de analise de relatorios financeiros corporativos onde perguntas diretas de texto estouram o SLA de latencia de 1 segundo se processadas por modelos multimodais pesados, enquanto perguntas sobre graficos de balanco patrimonial retornam respostas incorretas se passadas apenas por busca densa tradicional.","res":"Requer calibracao de um parametro de corte entre latencia e acuracia, alem de manter indices duplicados ou heterogeneos (densa e late-interaction/multimodal) disponiveis no banco de vetores."},{"p":"2608.26005","ach":"A arquitetura de memória dual alcança recuperação em 134 ms (cabendo no intervalo padrão de detecção de atividade de voz/VAD) e supera o Mem0 em quase 30 pontos percentuais no top-5 factual, além de superar o estado da arte em personalização afetiva em 4,29 pontos médios.","pn":"Memória assíncrona desacoplada em eixos informacional e afetivo","pm":"A separação do armazenamento de memória em dois nós paralelos (fatos objetivos versus atributos afetivos e de persona) com recuperação em streaming assíncrono permite injetar contexto emocional e factual dentro da janela de detecção de silêncio de voz sem adicionar latência perceptível à resposta.","imp":"Separe o estado de memória do seu agente de voz em dois índices paralelos — um para histórico factual e outro para tom/persona — e dispare a recuperação em streaming logo no início da pausa de fala do usuário, alimentando o modelo antes que o atraso de rede cause silêncio constrangedor.","ex":"Um atendente de suporte por voz que precisa recuperar o protocolo cancelado do cliente e manter uma postura paciente; consultas em índice monolítico demoravam mais de 400 ms e frequentemente misturavam instruções de tom de voz com os parâmetros técnicos do chamado.","res":"O benefício de baixa latência pressupõe arquitetura duplex de áudio com streaming contínuo; em fluxos conversacionais síncronos baseados puramente em requisições de texto, o particionamento em dois nós introduz custos de escrita e complexidade operacional sem ganho perceptível de tempo de resposta."},{"p":"2608.23172","ach":"Em quatro datasets de humor (sátira, sarcasmo, memes), gerar primeiro um grafo de relações causais serializado em código e interpretá-lo num segundo passo elevou a compreensão de humor em cerca de 1-20% e a detecção em 1-3% sobre baselines de raciocínio, com VLMs comerciais e de pesos abertos, sem treino (zero-shot ou com exemplos no prompt). Análise por informação mútua mostra que essas representações intermediárias carregam mais informação relevante à resposta final do que as dos raciocínios lineares comparados. O código está publicado.","pn":"Grafo de relações causais serializado em código como raciocínio intermediário","pm":"O modelo produz primeiro uma representação em código das relações causais e contextuais entre entidades de imagem e texto, e a resposta final vem da interpretação desse grafo em um segundo passo, em vez de um raciocínio linear único.","imp":"Quando a resposta certa depende de como as peças se relacionam — um print de tela junto com o texto da reclamação, um meme em fila de moderação —, troque o 'pense passo a passo' por um prompt que exija primeiro um bloco de código listando cada elemento e a relação de causa entre eles, e só depois a resposta final com base nesse bloco. É mudança de template, não de infraestrutura: você roda contra o seu conjunto atual de casos, compara com o método de hoje e só liga em produção se o ganho aparecer.","ex":"Numa fila de moderação de memes, o raciocínio linear lê a imagem e a legenda em sequência e marca sátira como ofensiva — ou libera ódio disfarçado de piada — porque a piada vive no contraste entre os dois canais, e a leitura sequencial nunca registra esse contraste como passo. Exigir o grafo antes da decisão força a relação de contraste a aparecer como aresta explícita entre imagem e legenda antes de o modelo classificar.","res":"Toda a evidência é em humor: os ganhos grandes (até 20%) vêm dos datasets de compreensão, enquanto a detecção sobe apenas 1-3%, margem que em benchmarks pequenos pode ser ruído. O paper não testa o padrão fora desse domínio — a transferência para outras tarefas relacionais é plausível, não medida. O esquema dobra o custo por consulta, com um passe para gerar o grafo e outro para interpretá-lo. A leitura errada mais provável: assumir que 'grafo de pensamento' melhora qualquer tarefa; o que foi demonstrado é ganho em tarefas onde a resposta depende de relações causais explícitas entre modalidades."},{"p":"2608.25500","ach":"Em doze combinações de seis modelos de linguagem com ALFWorld e ScienceWorld, a recuperação sobre o grafo com arestas calibradas obteve a maior pontuação em todas. Contra o grafo sem calibração (Graph-of-Skills), o macro-average em ScienceWorld subiu de 72,62 para 80,50 e o sucesso em ALFWorld de 80,01% para 86,79%, com menos passos de ambiente nos dois benchmarks. Ablações atribuem o ganho às arestas calibradas, que preservam pré-requisitos, ações que alteram estado e rotinas de verificação.","pn":"Calibração contrafactual de arestas em grafos de procedimentos antes da busca","pm":"Cada aresta candidata de um grafo de procedimentos é testada por sondas que removem, substituem e reordenam o par que ela conecta; a evidência, agregada com suavização bayesiana, publica um grafo filtrado por estado para expansão condicionada à tarefa.","imp":"Se você recupera procedimentos por similaridade e cogita montar um grafo de dependências entre eles, invista primeiro em testar as conexões, não em desenhar a estrutura: rode offline um experimento que remove ou embaralha cada ligação entre dois passos e mantenha só as ligações cuja ausência piora a resposta final. O grafo resultante é construído uma vez, fora do caminho da requisição, e não exige treinar nem ajustar modelo nenhum.","ex":"Em ALFWorld, tarefas domésticas em texto exigem ordem fixa — abrir a gaveta antes de pegar o objeto que está nela. Com recuperação que trata habilidades como texto independente, o passo 'pegar objeto' chega sem o pré-requisito 'abrir gaveta'; o agente executa fora de ordem, queima passos de ambiente e o episódio termina em falha. As arestas calibradas por sondas mantêm exatamente essa dependência de ordem, e o sucesso em ALFWorld subiu de 80,01% para 86,79% com menos passos por episódio.","res":"A evidência vem de dois benchmarks de agente textual com estado explícito e ordem de execução bem definida; em coleções de documentos sem noção clara de estado ou de sequência — a maioria dos RAGs de produção — o filtro por estado e as sondas de reordenação perdem o alvo, e o ganho não está demonstrado nesse cenário. O custo de construção também não aparece: sondar cada par com remoção, substituição e reordenação, além de juiz LLM opcional, é processamento offline cujo preço o abstract não quantifica. A leitura errada mais provável é atribuir o ganho à estrutura de grafo em si; as ablações apontam para a calibração das arestas, e o grafo sem calibração ficou oito pontos atrás em ScienceWorld."},{"p":"2608.26530","ach":"Em dois modelos congelados e três benchmarks, o harness PILOT ficou em primeiro em cinco de seis configurações. No Terminal-Bench 2.0 supera harnesses comparáveis em até 9,8 pontos percentuais, e no cenário de auto-aperfeiçoamento ganha 14,6 e 12,4 pontos com GLM-5.1 e Kimi-K2.6. Reduz tokens de saída em 42,9% e 47,4% e aumenta avaliações bem-sucedidas por milhão de tokens em 110,3% e 134,0%.","pn":"Supervisão fora do contexto de execução com destilação durante a execução","pm":"Um supervisor com contexto separado do worker avalia a trajetória em andamento e pode redirecionar ou abortar a execução, enquanto as lições emergentes são destiladas em habilidades e memória reutilizáveis ainda antes do fim da execução.","imp":"Se seus agentes longos rodam até o fim para só então você analisar o que deu errado, está deixando valor na mesa: separe quem executa de quem avalia e dê ao avaliador poder de interromper e redirecionar a execução em andamento. Em paralelo, registre as falhas que aparecem durante a corrida e converta-as em instruções ou habilidades salvas antes de encerrar a tarefa, para que a mesma corrida já beneficie as próximas.","ex":"Um agente de engenharia rodando uma bateria de testes de integração entra em loop tentando consertar a mesma dependência. Num harness de agente único, a correção e a autoavaliação dividem o mesmo contexto, o que degrada o julgamento; num harness com delegação simples, o supervisor só vê o resultado no fim. Com supervisão em contexto separado e autoridade de aborto, o supervisor detecta a repetição nos logs parciais, mata o worker, reinicia com instrução corrigida e grava 'loop em dependência ausente' como modo de falha reutilizável — evitando o mesmo gasto nas execuções seguintes.","res":"Os números vêm de benchmarks de agente com tarefas bem definidas e verificáveis (testes que passam ou falham); em produção com critérios de sucesso ambíguos, o supervisor precisa de outro sinal para decidir quando abortar, e a taxa de falsos abortos não é reportada. A destilação de habilidades também assume que falhas passadas se repetem — domínios muito variáveis tendem a acumular memória pouco reutilizável. O paper compara apenas com harnesses concorrentes da mesma literatura, não com pipelines de produção típicos."},{"p":"2608.26993","ach":"Em 20 tarefas candidatas e múltiplas combinações de editor e modelo, o ganho de intermediários visuais editados concentra-se em três famílias: injeção de pista visual, grounding e realização de estado contrafactual. Tarefas que exigem construção sensível a símbolos ou extrapolação estrutural têm realização substancialmente menos confiável pelo editor. No subconjunto positivo, um pipeline Qwen sobe de 0.343 para 0.445 de score médio (+29,7% relativo), mas o estudo mantém as tarefas filtradas e malsucedidas visíveis para expor o limite.","pn":"Diagnóstico em circuito fechado para intermediários visuais editados","pm":"Um protocolo que compara três condições de raciocínio — sem intermediário, com intermediário gerado por editor de imagem e com intermediário idealizado — para separar o ganho potencial do intermediário visual da perda introduzida pela fidelidade do editor.","imp":"Antes de montar um pipeline que usa um editor de imagem como passo intermediário de raciocínio, classifique a tarefa: se ela depende de desenhar símbolos, texto ou estruturas que não existem na imagem original, o editor provavelmente vai estragar o intermediário e o ganho esperado não se materializa. Se a tarefa é apontar onde algo está, destacar uma pista visual já presente ou mostrar como a cena ficaria após uma mudança, vale testar o pipeline. Rode as três condições do protocolo — direto, com editor, com referência ideal — para saber se o gargalo é o editor ou a própria ideia do intermediário.","ex":"Um sistema de inspeção visual que precisa responder 'onde está o defeito nesta placa' pode se beneficiar de um editor que circula ou destaca a região defeituosa antes do modelo raciocinar — é injeção de pista visual, família com ganho comprovado. O mesmo sistema, se a tarefa for 'redesenhe a placa como ela ficaria com o componente faltante', cai na família de extrapolação estrutural, onde o editor produz intermediários não confiáveis e o score do pipeline despenca em vez de subir.","res":"O ganho de +10,2 pontos vale apenas para o subconjunto de tarefas selecionadas como positivas; a média sobre todas as 20 tarefas não é reportada no abstract, e a utilidade geral do pipeline pode ser bem menor. O paper não entrega implementação aberta do protocolo nem critérios operacionais prontos para classificar uma tarefa nova antes de rodá-la — a taxonomia de famílias de tarefa é descritiva, não preditiva. E o resultado depende dos editores e modelos testados; com outra combinação, a fronteira entre famílias confiáveis e não confiáveis pode se deslocar."},{"p":"2608.27454","ach":"Em múltiplos benchmarks e famílias de modelos, o framework supera métodos state-of-the-art de evolução de skills e o baseline sem skills na maioria das combinações modelo-benchmark. As ablations mostram que a acumulação persistente de conhecimento é o componente crítico: sem ela, a evolução de skills degrada. Skills evoluídas por um modelo transferem para outros modelos e famílias — às vezes superando as auto-evoluídas — e modelos menores equipados com skills superam modelos substancialmente maiores sem elas.","pn":"Evolução de skills mediada por base de conhecimento persistente","pm":"A experiência bruta de execução do agente é continuamente consolidada em uma base de conhecimento persistente, e as habilidades executáveis são reescritas a partir dessa base consolidada em vez de diretamente do histórico de execuções.","imp":"Se você mantém um agente em produção, pare de corrigir o prompt caso a caso a cada falha: abra um documento vivo onde cada erro recorrente vira uma lição escrita, e reescreva o procedimento do agente a partir desse documento, não a partir do histórico de conversas. Antes de pagar por um modelo maior, teste primeiro se skills bem acumuladas fecham a diferença; e se você opera mais de um modelo, reutilize as skills de um no outro antes de regenerar tudo do zero.","ex":"Agente de revisão de pull requests em um monorepo: a cada iteração de melhoria, a correção para falsos positivos em migrações de banco fica registrada apenas no log de execuções; na reescrita seguinte da skill, o histórico longo dilui o insight e o mesmo falso positivo volta. Com a camada de wiki, a lição 'validar a migração em dry-run antes de sinalizar' vira entrada estável da qual a skill é reescrita, e o erro para de recorrer entre iterações.","res":"Os ganhos foram medidos em benchmarks de agentes, ambientes com feedback claro e tarefas que se repetem; em produção com cauda longa de tarefas únicas, o retorno de acumular skills tende a ser menor. O abstract não indica código aberto, e o ponto difícil — decidir o que vira entrada consolidada e evitar que lições erradas contaminem skills futuras — não é resolvido pela regra em si. A leitura errada mais provável: tratar 'modelo menor com skills supera modelo maior' como regra geral; o paper mostra complementaridade (modelos maiores se beneficiam mais das skills), não substituição universal, e a transferência entre modelos foi demonstrada apenas nos benchmarks avaliados."},{"p":"2608.25832","ach":"Três modelos open-weight, cada um jogando contra uma cópia de si mesmo em seis jogos de texto e oito línguas, apresentam força de jogo sistematicamente diferente conforme o idioma da interface: variam margens de vitória e derrota, frequência de ações inválidas e tendências estratégicas, com falhas específicas por língua em raciocínio espacial, decisões condicionadas a cartas e escolha do lance ótimo. A inconsistência aparece mesmo com o conhecimento do modelo fixo, indicando que a língua afeta estágios distintos do processo de decisão. Em parte dos cenários, trocar apenas o idioma em que o modelo raciocina antes de agir recupera boa parte do desempenho perdido.","pn":"auto-jogo entre línguas isola o efeito do idioma na habilidade","pm":"Duas instâncias do mesmo modelo competem em um jogo com regras, estado e ações fixos, cada uma por uma interface em língua diferente, de modo que qualquer diferença de desempenho mede apenas o efeito da língua sobre a habilidade realizada.","imp":"Se você opera o mesmo agente para usuários em vários idiomas, não presuma que a qualidade medida em inglês vale para os demais: rode a mesma bateria de tarefas pareada em cada idioma suportado e trate diferenças grandes como bug de configuração, não como ruído. Quando um idioma vier claramente fraco, teste fixar o idioma do raciocínio interno — o texto que o modelo escreve para si antes de responder — em inglês, mantendo a resposta final no idioma do usuário, e meça a taxa de acerto antes de recorrer a trocar de modelo ou reescrever prompts.","ex":"No estudo, o mesmo modelo open-weight competindo contra a própria cópia em um jogo de cartas de informação imperfeita comete mais ações inválidas e decide sem considerar as cartas da própria mão quando a interface está em certos idiomas; a falha está na etapa de decisão — condicionar o lance ao estado visível — e não no conhecimento das regras, já que regras e oponente são idênticos dos dois lados. Nos cenários afetados, mudar apenas o idioma do raciocínio intermediário devolve boa parte da força de jogo.","res":"A evidência vem de jogos de texto adversariais com três modelos open-weight e oito línguas; a recuperação pela língua intermediária é reportada só 'em alguns cenários', sem critério para prever quando funciona — não é garantia para o seu caso, e o paper não testa efeitos colaterais dessa troca nas demais línguas. O desenho de auto-jogo exige tarefa em que o próprio modelo sirva de oponente; para tarefas de produção não-competitivas (extração, código, atendimento) ele não se aplica diretamente, e resta a avaliação pareada por idioma, menos controlada. Também não há demonstração de que a discrepância por idioma persista com ferramentas e contextos longos típicos de produção."},{"p":"2608.26070","ach":"A maioria dos tokens intermediários de um traço de raciocínio perde importância à medida que o modelo continua gerando, então mantê-los em atenção completa custa caro sem trazer benefício. Descartar tudo exceto o prefixo de instruções e a janela dos últimos milhares de tokens torna modelos existentes 3x mais rápidos sem treino, mantendo o desempenho em benchmarks. Com treinamento via aprendizado por reforço sob essa restrição, o método escala para traços de raciocínio acima de cem mil tokens com desempenho superior, e ablações mostram que supera tanto resumir tokens intermediários quanto janela deslizante simples.","pn":"Descarte de tokens intermediários durante raciocínio longo, preservando prefixo e janela recente","pm":"Durante a geração de uma cadeia de raciocínio, a atenção é restrita ao prefixo de instruções e ferramentas mais a janela dos últimos milhares de tokens, descartando os tokens intermediários, o que limita o custo de memória independentemente do comprimento do raciocínio.","imp":"Se você roda modelos de raciocínio em produção e paga caro por traços longos, dá para cortar o custo de memória e acelerar a geração em torno de 3x sem tocar no modelo: configure a atenção para manter as instruções do sistema e as definições de ferramentas fixas no começo do contexto, mantenha só os últimos milhares de tokens e descarte o meio. O código está aberto, então a integração é questão de engenharia, não de pesquisa. O ganho de qualidade em traços acima de cem mil tokens, esse sim, exige retreinar o modelo — não conte com ele.","ex":"Um agente de código que resolve tarefas complexas gerando dezenas de milhares de tokens de raciocínio entre chamadas de ferramenta: com atenção completa, o cache de chaves e valores cresce a cada token gerado e o custo por token e a latência sobem ao longo do traço, tornando tarefas difíceis proibitivamente caras. Com o descarte do meio do traço, o cache fica com tamanho teto fixo — o prefixo com as instruções e ferramentas mais a janela do raciocínio em curso — porque os tokens intermediários já consumidos deixam de ser consultados pela atenção sem degradar a resposta final.","res":"A validação sem treino mostra manutenção de desempenho nos benchmarks testados, não em qualquer tarefa: raciocínios que exigem retomar um detalhe específico do meio do traço — um número calculado há vinte mil tokens, por exemplo — podem degradar, e o paper não estabelece qual fração de tarefas reais depende disso. O resultado de 3x é de velocidade, não de qualidade. E a parte que melhora o desempenho em traços muito longos depende de treinamento com aprendizado por reforço, fora do alcance do público que apenas consome modelos; para esse público, o método é uma técnica de inferência, não uma forma de estender a capacidade de raciocínio do modelo."},{"p":"2608.27455","ach":"Em tarefas de raciocínio, injetar críticas derivadas dos erros de um modelo menor da mesma família supera consistentemente o in-context learning padrão e alcança desempenho competitivo ou superior ao de métodos que escalam computação em tempo de inferência, com menos gerações e menos tokens. A variante dinâmica prevê os modos de falha prováveis de cada entrada e recupera críticas correspondentes; a estática usa um perfil global de falhas. O código foi liberado publicamente.","pn":"Modos de falha de modelos menores como crítica em contexto","pm":"Erros típicos de um modelo menor da mesma família são catalogados e apresentados ao modelo maior como exemplos de crítica no contexto, orientando-o a evitá-los sem retreino e sem gerar múltiplas respostas.","imp":"Quando a resposta do seu modelo grande não está boa e o próximo passo óbvio é gerar várias respostas e escolher entre elas — o que multiplica o custo por pergunta —, teste primeiro a via mais barata: rode um modelo pequeno da mesma família nas suas tarefas, anote os erros que ele repete e transforme cada um num aviso curto dentro do prompt do modelo grande, do tipo 'um erro comum é responder antes de reler o histórico da conversa'. O custo extra vira tokens de entrada, não várias respostas completas.","ex":"Num sistema de suporte, um modelo de 8 bilhões de parâmetros faz a triagem dos tickets e um de 70 bilhões redige as respostas. Auditando a triagem, a equipe constata que o menor ignora o histórico quando o cliente muda de assunto no meio do ticket. Esse erro recorrente vira uma crítica no prompt do modelo maior — 'respostas que desconsideram mudança de assunto no histórico costumam errar' — e o modelo maior passa a reler o histórico antes de redigir, sem retreinar nada e sem gerar cinco candidatos por ticket.","res":"Tudo depende da aposta empírica de que os modos de falha se repetem entre escalas da mesma família — isso foi observado nos modelos e benchmarks do paper, não é garantia para qualquer par de modelos; se os erros do modelo pequeno não coincidirem com os do grande, as críticas apontam para o lugar errado. 'Competitivo ou superior' ao escalonamento em tempo de inferência não significa 'sempre superior': em tarefas muito difíceis, gerar múltiplas respostas ainda pode ganhar. O perfil estático de falhas envelhece — trocou de modelo ou mudou a distribuição das tarefas, o catálogo precisa ser refeito. A leitura errada mais provável é tratar isso como substituto universal de escalonamento em tempo de inferência; o que foi medido são tarefas de raciocínio de benchmark, não tarefas de produção como extração estruturada ou uso de ferramentas."},{"p":"2608.24804","ach":"Em três benchmarks de operações empresariais (ITBench SRE, EnterpriseOps-Gym ITSM, AutomationBench Finance), evoluir o harness do agente com pesos do modelo congelados elevou o desempenho full-benchmark em 20-35 pontos percentuais sobre o harness padrão, com apenas 4-12 mudanças aceitas por ambiente. Os ganhos persistem em tarefas excluídas da evolução e transferem sem re-evolução entre as famílias GPT e Qwen. Análise de traces atribui os ganhos a reparos de interface, convenções de ambiente e conhecimento operacional que comprime a busca, com menos diagnósticos falso-positivos e trajetórias mais curtas em vários cenários.","pn":"Evolução de harness de agente com pesos do modelo congelados","pm":"O harness do agente — prompts, interfaces de ferramenta, estrutura de subagentes e configuração do loop — é tratado como o artefato otimizável, enquanto os pesos do modelo permanecem fixos; um pool compacto de tarefas estratificado por comportamento de falha baseline separa tarefas de busca visíveis ao proponente de tarefas de seleção ocultas, e as mudanças aceitas no harness são validadas em tarefas held-out e transferidas entre famílias de modelos sem nova evolução.","imp":"Quando seu agente erra repetidamente ao usar ferramentas internas, antes de trocar de modelo ou ajustar pesos, trate o harness como o componente a corrigir: repare as interfaces de ferramenta, codifique as convenções do ambiente no prompt e na estrutura de subagentes, e valide cada mudança em tarefas que o processo de ajuste nunca viu. Monte um pool pequeno de tarefas estratificado pelos modos de falha atuais do agente, reserve uma parte fora do alcance de quem propõe as mudanças, e aceite apenas alterações que sobrevivam a esse conjunto oculto — assim você corrige o descompasso entre modelo e ambiente sem treinar nada e sem colar o agente nos casos de teste.","ex":"Um agente de SRE operando contra um ambiente de monitoramento no estilo ITBench: o harness padrão gera diagnósticos falso-positivos porque as chamadas às ferramentas de consulta não seguem as convenções reais do ambiente e o loop do agente explora caminhos que não comprimem a busca. Evoluindo o harness — corrigindo a interface das ferramentas, incorporando o conhecimento operacional do domínio e ajustando a configuração do loop — com um pool estratificado por comportamento de falha baseline e seleção oculta em tarefas held-out, o paper reporta ganhos de 20-35 pontos percentuais, menos diagnósticos falso-positivos e trajetórias mais curtas, com as mesmas melhorias transferindo para modelos Qwen sem re-evolução quando o time troca de fornecedor de modelo.","res":"Os ganhos são medidos em três benchmarks empresariais específicos, não em produção real de um time; a evolução exige um pool de tarefas representativo com falhas baseline já caracterizadas, e montar esse pool é o custo oculto do método — em ambientes onde essas tarefas não existem ou são caras de construir, o procedimento não arranca. A transferência entre GPT e Qwen não garante transferência para qualquer família de modelos, e o paper não reporta quantas mudanças propostas foram rejeitadas antes das 4-12 aceitas, o que deixa opaco o custo humano ou computacional da busca. Quem ler os 20-35 pontos como ganho garantido em qualquer ambiente de ferramentas estará superestimando: o resultado vale para tarefas ricas em ferramentas com descompasso modelo-ambiente persistente, não para falhas de raciocínio que só o modelo resolve."},{"p":"2608.25697","ach":"Um framework que separa coleta de evidência interna do modelo, avaliação de política e liberação de saída reduz a taxa de ataque bem-sucedido no HarmBench de 39,20% para 3,32% no Qwen3-4B, com aumento de falsas recusas no XSTest de 2,40% para 4,40% e retenção de 98,14% da throughput de um caminho de serving sem monitoramento, com 32 sequências ativas. O mesmo substrato hospedou backends distintos (SAEs, transcoders e probes densos) sem alterar o tratamento de requisições, e preservou decisões por requisição sob churn do scheduler. Isso demonstra que a separação de mediação e política, já consolidada em segurança de kernel, funciona sobre serving de LLM com batching contínuo.","pn":"Separação entre coleta de evidência, política de segurança e liberação de saída","pm":"Um backend de segurança expõe evidência calibrada, uma política versionada avalia regras sobre contexto confiável por requisição, e um gate separado autoriza a liberação da saída em buffer, de modo que trocar backend, regra ou agendamento não exige reescrever o tratamento de requisições nem o código de enforcement.","imp":"Se hoje cada sinal de segurança seu (classificador de prompt, detector de jailbreak, filtro de saída) tem seu próprio código de intervenção acoplado ao caminho da requisição, trocar um deles ou adicionar outro vira retrabalho e risco de regressão. Adotar a separação em três camadas — evidência, política, gate — significa que você pode trocar o detector por um mais barato ou mais preciso, ajustar regras e mudar quando a checagem acontece sem tocar no código de serving, e compor várias regras sobre a mesma requisição em vez de empilhar filtros independentes. O custo disso aparece como falsas recusas: no experimento, a proteção mais agressiva dobrou a taxa de recusas legítimas, então meça o impacto em usuários honestos junto com a taxa de ataque.","ex":"Um assistente de atendimento em produção usa vLLM com batching contínuo e tem um classificador de prompts maliciosos acoplado diretamente ao handler de requisições. Quando a equipe tenta substituí-lo por um detector baseado em SAE, precisa reescrever o handler inteiro, e a troca quebra a lógica de retry e de streaming já validada. Com a separação do LMSM, o detector novo entra como backend de evidência, a política existente continua avaliando as mesmas regras sobre o contexto da requisição, e o gate continua liberando a saída em buffer — a troca não altera o caminho de serving, e as decisões por requisição sobrevivem ao reordenamento do scheduler.","res":"Os números vêm de um único modelo (Qwen3-4B) e de um único backend de serving; a redução de ASR de 39,20% para 3,32% não foi demonstrada em modelos maiores, em outros servidores ou em ataques fora do HarmBench. O aumento de falsas recusas (2,40% para 4,40%) é pequeno em valor absoluto, mas foi medido no XSTest, que cobre um conjunto limitado de ambiguidades benignas — em domínios com mais ambiguidade legítima, o custo pode ser maior. O paper também não reporta latência de cauda nem comportamento sob saturação, situações em que buffering de saída e checagem por requisição tendem a pesar mais do que a throughput média sugere."},{"p":"2608.28122","ach":"O levantamento de 230 sistemas de construção agêntica de artefatos mostra que o gargalo da construção não é a modalidade, mas o acoplamento entre decisões e a visibilidade das falhas enquanto ainda são reparáveis. A decomposição de tarefas reduz a complexidade local mas aumenta os custos de coordenação e remontagem. Em avaliação, juízes baseados em modelos que compartilham preferências ou cegueiras com o gerador acrescentam pouca evidência independente.","pn":"","pm":"","imp":"Ao montar um pipeline de agentes que produz entregáveis, trate a verificação como parte do loop de construção, não como etapa final: valide cada mudança enquanto ela ainda pode ser desfeita barato. E ao usar um modelo para avaliar a saída de outro, cheque primeiro se ambos vêm da mesma família ou compartilham o mesmo tipo de erro — se sim, esse avaliador não está testando quase nada que o gerador já não 'sabe' que passaria.","ex":"Num sistema de agentes que gera e revisa documentação de API em várias etapas, um erro de referência introduzido na primeira etapa só é detectado na etapa final de revisão, quando já foi propagado para dez páginas — o custo de correção multiplica-se. O survey aponta exatamente isso: falhas que só ficam visíveis tarde deixam de ser reparáveis e viram retrabalho coordenado entre etapas.","res":"Os princípios formulados (compromissos explícitos, reparo direcionado, revalidação de estado) passam apenas no nível conceitual: o survey não fornece implementação, métrica nem referência de quando cada princípio se aplica, então cada equipe precisa derivar o 'como' por conta própria. A revisão cobre trabalhos até agosto de 2026 indexados pelos autores, com possível viés de seleção, e a taxonomia de seis famílias de artefatos ainda não foi validada fora do próprio corpus."},{"p":"2608.28478","ach":"Em 1.094 perguntas construídas a partir de divergências naturais em documentos de baixa exposição, o melhor de 32 modelos recupera ambas as contas conflitantes em apenas 52,4% dos casos; nas demais, quase sempre lembra uma conta e omite a outra. Aumentar o tamanho do modelo e o raciocínio em inferência melhora o recall sem eliminar a omissão. A análise do corpus mostra que a exposição desequilibrada favorece a conta dominante, e mais exposição do lado minoritário se associa a recall mais completo.","pn":"Benchmark de respostas multi-conta para fatos de cauda longa","pm":"Um pipeline baseado em grafo recupera documentos de um corpus de baixa exposição, detecta divergências naturais entre fontes e converte cada divergência em uma pergunta fechada cuja resposta correta exige recuperar todas as contas conflitantes, com cada resposta verificável contra os documentos de origem.","imp":"Quando o sistema responde uma pergunta sobre um tema controverso ou pouco documentado, trate a resposta única como suspeita de versão parcial: o modelo provavelmente conhece só um lado e não sinaliza que o outro existe. Em produtos de QA ou assistentes, isso muda a decisão de design — para temas com contas conflitantes conhecidas, não confie na memória do modelo sozinho; conecte a resposta a fontes que tragam os dois lad
