o por pares que quebra modelos atuais, acompanhado de regras de verificação escritas à mão que descrevem falhas concretas e verificáveis naquele exemplo específico.","imp":"Você pode substituir métricas automáticas genéricas de tradução por casos curados com critérios de aprovação explícitos: avalie seu pipeline de tradução nos exemplos do dataset e replique o esquema de regras de verificação por caso nos seus próprios testes de regressão.","ex":"Um sistema de tradução de documentação técnica que passa em métricas como BLEU/COMET mas inverte negações ou omite restrições de segurança: as regras de verificação do exemplo sinalizam exatamente essa falha, enquanto a métrica numérica a esconde.","res":"O dataset é vivo e focado em tradução multimodal; as regras são escritas à mão caso a caso, então reproduzi-las fora do domínio exige esforço humano de curadoria, e cobrir os modos de falha do seu domínio não está garantido."},{"p":"2609.02750","ach":"Em 500 instâncias do SWE-bench, o sistema completo com portão ancorado no ambiente resolve 72,2% contra 70,8% da referência pública mini-SWE-agent, ganho de 1,4 ponto. A teoria prova que nenhum portão que observa só o texto gerado melhora uniformemente sobre ambientes indistinguíveis por texto, enquanto um portão com acesso ao ambiente pode. Resultados de convergência exata, geométrica ou polinomial são demonstrados sob calibração e massa corretiva não degenerada.","pn":"Portão de memória ancorado no ambiente com risco decrescente","pm":"A aceitação de memória refletida é condicionada a uma verificação externa que observa o resultado no ambiente, não apenas o texto gerado, e só passa quando o risco de avaliação medido diminui estritamente.","imp":"Ao montar um loop de reflexão com memória persistente, você para de deixar o próprio agente julgar se a memória nova é boa: adicione uma verificação que mede o resultado no ambiente real (teste que roda, tarefa concluída) e descarte a memória candidata sempre que essa medida não melhorar estritamente.","ex":"Em um sistema de agentes de codificação com memória compartilhada, a reflexão livre pode gravar uma lição errada que parece plausível no texto e degrada tarefas futuras silenciosamente; com o portão ancorado, a memória candidata só entra se a taxa de testes passando nas tarefas avaliadas subir, o que bloqueia a propagação desse dano persistente.","res":"O ganho empírico medido é de 1,4 ponto percentual sobre uma referência pública, o que está dentro da margem de variância típica entre execuções; a validação forte é teórica e a separação entre portões textuais e ambientais vale em cenários de pior caso, não garante melhora em todo sistema. A teoria de convergência depende de calibração e de condições de massa corretiva que raramente são verificáveis em produção."},{"p":"2609.05258","ach":"Em tarefas com descrições parciais de problemas de pesquisa operacional, agentes que assumem a especificação completa produzem modelos com lacunas silenciosas. O framework de dois estágios recupera substancialmente mais slots exatos que os baselines no modo de escolha e permanece competitivo no modo aberto, controlando o custo de interação.","pn":"Perguntar-ou-parar guiado por lacunas críticas de formulação","pm":"Um agente identifica lacunas não resolvidas que mudam o modelo matemático e decide, a cada turno, entre fazer uma nova pergunta ao usuário ou encerrar a interação, medindo o que permanece faltando.","imp":"Antes de deixar o LLM montar um modelo de otimização a partir de um pedido em linguagem natural, você pode adicionar um passo que lista o que falta (objetivo, restrições, regras de negócio) e só prossegue quando as lacunas críticas estiverem fechadas — evitando modelos que parecem certos mas codificam suposições erradas.","ex":"Um pedido de escalonamento de turnos chega sem a regra de que ninguém pode fechar dois turnos consecutivos; o agente que não pergunta gera um modelo viável matematicamente, mas que viola a regra trabalhista, e o erro só aparece na operação.","res":"Os resultados fortes vêm do cenário com usuário simulado e slots ocultos estruturados; com usuários reais, as respostas são ruidosas e as lacunas menos bem definidas, e no modo aberto a vantagem sobre métodos anteriores é apenas competitiva, não dominante."},{"p":"2609.00365","ach":"Em comparação com um agente de linha de comando puro usando o mesmo executor de fundo, o workspace pontua mais alto em completude de pesquisa e mantém um histórico de processo auditável e recuperável. A comparação isola a camada de orquestração, variando só o executor é fixo. O demo cobre um cenário de três visões e um passo a passo de recuperação de falha.","pn":"Orquestração auditável de agentes de código em workspace","pm":"Agentes de linha de comando são envolvidos por uma camada de orquestração com objetos de estado persistentes, biblioteca de habilidades reutilizáveis e coordenação de múltiplos executores, de modo que cada decisão humana fica vinculada à execução da IA em um histórico rastreável e recuperável.","imp":"Em vez de deixar o trabalho espalhado entre chat, editor e terminal, você pode envolver o mesmo agente de código que já usa em uma camada que guarda o estado entre sessões e registra quais decisões suas levaram a quais execuções. Quando algo dá errado, você recupera o processo em vez de refazer do zero.","ex":"Uma equipe usando Claude Code para refatorar um pipeline de dados perde o contexto quando a sessão quebra e ninguém sabe por que uma decisão de design foi tomada. Com esse padrão, o grafo de tarefas e o estado persistido mostram qual decisão humana gerou qual execução, e a sessão é retomada de onde parou.","res":"A avaliação é um cenário demonstrativo com walkthrough de recuperação, não um benchmark amplo; a vantagem de completude vem da comparação contra agente puro do mesmo executor, o que favorece a camada por construção. O ganho depende de o fluxo de trabalho incluir revisão humana ativa; em automação sem humano no laço, a camada pode ser sobrecarga."},{"p":"2609.04061","ach":"Modelos de fronteira editam código além do necessário mesmo quando corrigem o bug: Pass@1 alto convive com excesso de edição e complexidade adicionada. Uma instrução de preservação corta o excesso de Levenshtein de 0,195 para 0,131, reduz a complexidade adicionada em 26,6% e sobe Pass@1 em 2,3 pontos. SFT sobre padrões de corrupção sofre overfitting, enquanto RL dá o melhor equilíbrio fora do domínio entre fidelidade e retenção de desempenho.","pn":"Avaliação de fidelidade de edição via patch mínimo conhecido","pm":"Injetam-se corrupções controladas em nível de AST em soluções de referência, gerando tarefas de reparo com patch mínimo conhecido, sobre as quais se mede o excesso de edição pela distância de Levenshtein e pela complexidade cognitiva adicionada.","imp":"Não avalie seu agente de reparo só por 'passa nos testes': rode também uma comparação de diff contra o mínimo necessário, porque um modelo que reescreve demais gera revisões caras e riscos de regressão. Antes de investir em treino, teste instruções do tipo 'mude apenas o necessário' no prompt, que já capturam boa parte do ganho.","ex":"Um assistente de código que corrige uma exceção de tipo nulo reescrevendo a função inteira com renomeações e reestruturações: o patch passa nos testes, mas o revisor precisa auditar 40 linhas mudadas em vez de 3, e a reescrita esconde uma mudança de comportamento não solicitada.","res":"Os ganhos de RL dependem de um pipeline de post-training com dados de corrupção controlada, que quem só consome modelos prontos não reproduz; e a instrução de preservação foi medida num único benchmark de reparo, então seu efeito em refatorações grandes ou tarefas de feature não está provado."},{"p":"2609.04444","ach":"Em 7.201 decisões precificadas entre nove modelos, as taxas de atropelamento de animais variam de 0,4% a 98,8% e não seguem a ordem de capacidade dos modelos. Seis de seis modelos de raciocínio tiveram taxa acima de 84% sem o briefing moral e abaixo de 6% com ele. Nove de nove atropelaram mais animais selvagens que animais de fazenda, em todas as geometrias de mapa.","pn":"Preço explícito sobre efeito colateral moral como medida de comportamento","pm":"Cenários simulados que obrigam o agente a escolher entre causar dano a um ser vivo sem custo ou evitá-lo pagando um preço tornam a disposição real de evitar dano observável em decisões, em vez de declarada em respostas sobre valores.","imp":"Se você avalia agentes em produção, não confie no que o modelo diz sobre prioridades quando perguntado diretamente: este benchmark mostra que a mesma disposição muda drasticamente conforme a instrução de sistema e o custo envolvido. Inclua nos seus testes de agente situações em que seguir a regra custa algo, e teste variações do seu prompt de sistema — uma frase removida pode derrubar o comportamento seguro.","ex":"Um agente de roteamento logístico com GPT-4o-mini decidindo entre desviar de um obstáculo (custo de combustível) ou passar por cima: neste benchmark ele atropelou animais em até 98,8% dos casos, enquanto modelos de raciocínio com briefing moral ficaram abaixo de 6% — mesma tarefa, mesma arquitetura de decisão sem memória.","res":"Os resultados vêm de um gridworld com decisões sem memória e dano nunca nomeado no objetivo; a transferência para ambientes reais ou para agentes com memória e contexto rico não é demonstrada. A sensibilidade ao preço só apareceu em quatro dos seis modelos testados nesse eixo, e o ranking não indica qual modelo escolher, apenas que a ordem de capacidade não prevê o comportamento."},{"p":"2609.04753","ach":"Operações de raciocínio como formulação de problema, decomposição e dedução são separáveis geometricamente nas representações internas, com pico de separabilidade nas camadas intermediárias. Intervenções de mascaramento de atenção mostram que essas representações dependem do contexto de raciocínio anterior. O código está aberto em repositório público.","pn":"","pm":"","imp":"Você não pode usar isso diretamente via API, mas deve desconfiar de inferências sobre raciocínio feitas apenas lendo o texto do chain-of-thought: o texto e a estrutura interna não são a mesma coisa, então auditorias baseadas só no texto podem errar.","ex":"Um time que audita um agente de atendimento lendo os passos escritos no chain-of-thought para verificar se ele decompôs o problema corretamente pode estar validando uma narrativa textual que não corresponde à organização interna das operações de raciocínio.","res":"Os resultados vêm de análise em camadas internas de modelos específicos e não mostram como corrigir ou melhorar o raciocínio; a correspondência representacional não prova que o modelo 'realmente raciocina', apenas que há estrutura geométrica alinhada ao texto."},{"p":"2609.00581","ach":"O framework unifica dois níveis de detecção de alucinação usando fatos relacionais como representação compartilhada, eliminando a chamada de alinhamento entre afirmações e spans. Fica competitivo com sistemas de nível de afirmação usando menos chamadas e recursos, e supera sistemas anteriores na localização fina de spans e entidades. O dataset EnokiQA fornece anotações alinhadas nos dois níveis de granularidade.","pn":"Fatos relacionais ancorados no texto como ponte entre verificação de afirmações","pm":"Um extrator produz fatos relacionais ancorados em spans do texto, os fatos são verificados contra evidência e os fatos sem suporte são projetados de volta para os trechos originais, unificando verificação em nível de afirmação e localização de span sem etapa de alinhamento separada.","imp":"Se hoje você roda um pipeline que primeiro quebra a resposta em afirmações, verifica cada uma e depois tenta mapear de volta para o texto original, pode trocar por uma única passagem de extração e verificação que já aponta o trecho problemático, cortando chamadas de modelo e o custo de manter esse mapeamento.","ex":"Um sistema de atendimento que valida respostas geradas contra a base de conhecimento: no esquema em dois estágios, a afirmação 'o plano X inclui suporte 24h' é verificada como falsa, mas o alinhamento de volta ao texto falha quando a resposta parafraseia. Com fatos ancorados nos spans originais, o trecho exato 'suporte 24h' é marcado diretamente como sem suporte na evidência.","res":"Os resultados competitivos valem contra os sistemas comparados no paper; a qualidade depende do regime de extração escolhido (LLM, encoder ou regras), e o modo mais barato tende a sacrificar precisão. A vantagem em localização de span é medida nos benchmarks do próprio paper, e generalização para domínios fora desses dados não está demonstrada."},{"p":"2609.02780","ach":"O sistema mantém um índice leve construído nas camadas rasas durante o fluxo de vídeo e recupera evidência apenas na resposta, alcançando qualidade comparável aos melhores métodos de streaming com redução de latência de prefill por quadro de até 52,1x e latência ponta a ponta de 10 segundos de até 11,9x.","pn":"Índice de recuperação construído em camadas rasas durante o streaming","pm":"As camadas rasas do modelo multimodal geram um índice permanente a partir do KV cache, e os escores de atenção dessas camadas, combinados com seleção sensível à diversidade, recuperam os quadros relevantes apenas no momento da pergunta, evitando prefill em profundidade total a cada quadro.","imp":"Se você processa vídeo contínuo com modelos multimodais, pode cortar o custo de pré-processar cada quadro em profundidade total: use as camadas iniciais para indexar e só rode o modelo completo quando houver pergunta, reduzindo latência e o crescimento do cache de atenção.","ex":"Em um sistema de monitoramento por câmeras que responde consultas sobre eventos gravados, pré-processar cada quadro com o modelo completo estoura o custo e o cache de atenção cresce a cada quadro; indexar com camadas rasas e pré-preencher em profundidade só os quadros recuperados na consulta mantém a resposta precisa com uma fração da latência.","res":"Os ganhos valem para cenários de streaming com consultas posteriores; a qualidade fica 'no mesmo nível' dos melhores métodos, não acima, e a avaliação cobre tarefas de compreensão de vídeo, sem evidência para outros domínios multimodais."},{"p":"2609.04720","ach":"VLMs avaliados frequentemente não recusam, corrigem ou abstêm quando a consulta contém premissa falsa, conteúdo inacessível visualmente ou pedido inseguro, e a falha se agrava em consultas compostas que exigem recusa apenas de parte do pedido. Fine-tuning com exemplos de recusa seletiva eleva a acurácia de não conformidade preservando o desempenho em consultas totalmente respondíveis.","pn":"Avaliação de recusa seletiva em consultas compostas","pm":"Pares de consultas simples e compostas separam a recusa no nível da consulta inteira da recusa no nível de componentes, medindo se o modelo atende a parte respondível e recusa a parte problemática na mesma pergunta.","imp":"Ao montar testes de robustez para o seu assistente multimodal, inclua perguntas que misturam parte respondível e parte impossível ou insegura; medir só recusa da pergunta inteira esconde falhas que aparecem exatamente nos casos mistos, que são comuns em uso real.","ex":"Um usuário pergunta a um assistente de catálogo visual: 'Quanto custa a chaleira azul da foto e o que a pessoa ao fundo está fazendo?' O modelo responde o preço mas alucina uma ação para a pessoa, porque o benchmark de recusa por consulta inteira nunca testou a recusa do segundo componente isoladamente.","res":"Os ganhos de recusa seletiva vêm de fine-tuning nos próprios exemplos do benchmark, o que levanta risco de ajuste ao instrumento; os resultados valem para os VLMs testados e não demonstram que a capacidade generaliza a categorias de falha fora das cinco avaliadas."},{"p":"2609.03820","ach":"Em vídeos de uma hora do LongVideoBench, oito frames selecionados pela consulta batem dezesseis frames uniformemente espaçados por 6,9 pontos, e o Orthogonal Matching Pursuit, algoritmo dos anos 1980, empata ou fica a um ponto de seletores feitos sob medida em três benchmarks. Comprimir a resolução espacial dos frames custa no máximo 0,44 pontos. Reinvestir os tokens poupados em duas vezes mais frames comprimidos devolve mais 2 a 3 pontos, ao mesmo custo original.","pn":"","pm":"","imp":"Se você monta um pipeline de vídeo que amostra frames em intervalos fixos, troque por seleção guiada pela pergunta do usuário usando um algoritmo de aproximação esparsa simples, sem treinar nada. Quando precisar caber no orçamento de tokens, reduza a resolução de cada frame e use a economia para olhar mais frames, em vez de menos frames em alta resolução.","ex":"Um assistente que responde perguntas sobre gravações de reuniões de uma hora amostra um frame por segundo e mantém 16 em intervalos uniformes; perguntas sobre um evento citado no final são perdidas porque os frames do momento relevante não entraram na fatia fixa. Com seleção guiada pela consulta, os frames daquele trecho entram no contexto e a resposta melhora sem custo adicional de tokens.","res":"Os números valem para os três benchmarks e dois modelos testados em cenário de perguntas e respostas sobre vídeo; não provam que a seleção guiada por consulta ajuda em tarefas que varrem o vídeo inteiro, como sumarização. O ganho da compressão só existe quando a economia é reinvestida — aplicá-la sozinha não melhora nada, e o bug encontrado no baseline próprio e a diferença de até 3,74 pontos entre harnesses mostram que comparações entre papers não são confiáveis."},{"p":"2609.04034","ach":"O sistema produz designs editáveis em camadas com texto real, em vez de bitmaps achatados, para pôsteres e infográficos. O circuito fechado de gerar ativo isolado, escrever HTML/CSS e refinar contra feedback de renderização atinge estética refinada e editabilidade de nível de produção. A reprodução da trajetória criativa via Agent Design Replay mantém o raciocínio do agente auditável.","pn":"Agente de código com simulador visual sob demanda","pm":"Um VLM planeja e julga a estética, um modelo de difusão gera ativos visuais isolados sob demanda, e o agente de codificação escreve HTML/CSS nativo e refina o design em um circuito fechado com feedback do render visual.","imp":"Se você gera artefatos visuais (relatórios, dashboards, materiais) com modelo de imagem, troque o bitmap final por um agente que escreve HTML/CSS e só chama o modelo de imagem para criar peças avulsas. O resultado continua editável por arrastar e soltar, e o texto deixa de sair corrompido porque passa a ser texto de verdade, não pixels.","ex":"Um pipeline que hoje usa GPT-Image-2 para gerar uma infográfico de vendas entrega um PNG com números ilegíveis e impossíveis de corrigir sem regenerar tudo. Com esse padrão, o gráfico de barras é gerado como PNG avulso e inserido num HTML com camadas separadas; ajustar o título é editar uma linha de CSS, não recriar a imagem.","res":"A validação cobre pôsteres e infográficos; não há evidência de que o padrão generalize para interfaces interativas complexas ou designs com dezenas de ativos. O custo de múltiplas chamadas a modelos de difusão por iteração do loop não é reportado, e a qualidade depende de um VLM com bom julgamento estético."},{"p":"2608.21450","ach":"Substituir o codificador duplo estilo CLIP por um recuperador baseado em modelo multimodal de linguagem eleva o Recall@1 de recuperação em até 14,7% e a acurácia de VQA de ponta a ponta em 9,4% em consultas com entidades de cauda longa. O ganho vem de embutir a imagem por identidade semântica da entidade, não por aparência visual. Um discriminador semântico gera pesos contínuos de consistência que substituem rótulos binários rígidos na supervisão.","pn":"Recuperação por identidade semântica de entidade em vez de similaridade visual","pm":"Um modelo multimodal de linguagem gera o embedding da imagem num espaço que preserva a identidade da entidade, com pesos de consistência contínuos produzidos por um discriminador semântico para supervisionar destilação com negativos difíceis.","imp":"Se o seu RAG multimodal recupera documentos por similaridade visual de imagens, troque o recuperador por um que embuta a imagem por identidade da entidade — por exemplo, indexe a foto do 'Ponte Golden Gate' pelo conceito, não pelo visual, para não perder a resposta quando a foto é de outro ângulo ou de uma ponte parecida.","ex":"Num pipeline de VQA sobre Wikipédia, uma pergunta sobre um monumento de cauda longa recebe como negativo difícil a foto de um prédio visualmente parecido; o recuperador estilo CLIP ranqueia o documento errado em primeiro lugar e o modelo responde a entidade errada, enquanto o embedding por identidade semântica puxa o documento correto.","res":"Os ganhos são medidos em KB-VQA com recuperação em escala Wikipédia; não há evidência de que o mesmo mecanismo melhore recuperação onde a similaridade visual é o sinal relevante, como busca de produtos por aparência. A adoção sem retreino depende de o checkpoint publicado cobrir o domínio de entidades do seu caso."},{"p":"2609.01657","ach":"O encoder de 260M atinge 0,523 nDCG@10 no ViDoRe v3, superando todos os modelos avaliados abaixo de 800M parâmetros, e o de 800M chega a 0,556. Com entrada de imagem equivalente, o 260M codifica páginas com cerca de 2x o throughput do ColModernVBERT em uma L40S. Pooling hierárquico e quantização assimétrica comprimem os embeddings de recuperação 255x mantendo mais de 95% do nDCG@10.","pn":"Encoder bidirecional multimodal pequeno treinado do zero para busca visual","pm":"Um encoder bidirecional pré-treinado do zero com difusão mascarada condicionada em patches de imagem substitui a reutilização de VLMs generativos grandes como base para recuperadores de documentos, com pooling hierárquico e quantização assimétrica comprimindo os embeddings tardios.","imp":"Você pode trocar o recuperador visual do seu pipeline de RAG por um checkpoint de 260M ou 800M já publicado, reduzindo o custo de indexação e consulta sem treinar modelo e mantendo qualidade de busca comparável ou superior.","ex":"Um sistema que responde perguntas sobre PDFs digitalizados usando um recuperador tipo ColPali, que carrega um VLM generativo inteiro só para gerar embeddings, pode indexar com o encoder de 260M e armazenar os vetores comprimidos 255x, reduzindo a memória do índice vetorial e dobrando a taxa de páginas processadas.","res":"Os números vêm do ViDoRe v3, benchmark de documentos visuais; desempenho em outras tarefas de recuperação ou domínios fora de documentos não é demonstrado. A compressão de 255x preserva 95% do nDCG@10, não 100%, e o ganho de throughput foi medido em hardware específico (NVIDIA L40S)."},{"p":"2609.01936","ach":"Duas lentes ajustadas em corpora diferentes podem reportar tokens distintos para os mesmos estados ocultos, o paper chama isso de condicionalidade de corpus. A decomposição esparsa da matriz de unembedding reconstrói 8,9 a 17,3 pontos percentuais mais diferenças de logit do que seis baselines geométricos. A feature dominante do readout permanece estável mesmo quando a leitura em tokens varia com o corpus.","pn":"Leitura de lens em features de leitura em vez de tokens","pm":"Decompõe a matriz de unembedding em features esparsas usando apenas os pesos, permitindo expressar qualquer logit como soma de contribuições dessas features, sem depender do corpus usado para ajustar a lente.","imp":"Quando um diagnóstico de lente (técnica que decodifica estados intermediários do modelo em tokens) der um resultado estranho, você passa a considerar que o problema pode estar na matriz de decodificação e no corpus em que ela foi ajustada, não no estado interno do modelo. Isso muda como você interpreta comparações de logits entre configurações.","ex":"Equipe compara logit differences entre checkpoints com uma lente ajustada em corpus de código; a leitura em tokens muda entre checkpoints, mas a feature dominante do readout não muda, indicando que a aparente regressão vinha da dependência de corpus da lente, não do modelo.","res":"Os ganhos de reconstrução são medidos em diferenças de logit testadas e comparados a baselines específicos; não prova que leituras em features superem leituras em tokens para toda análise interpretativa. Aplicar exige acesso à matriz de unembedding e a estados intermediários, o que só é viável com pesos abertos ou acesso aos internals."},{"p":"2608.30428","ach":"Em um sandbox 3D de dedução social, agentes de visão e linguagem que fazem o papel de impostor vencem combinando mentiras na fala com ações físicas enganosas. A ablação de componentes do harness e a troca de modelo mostram que os canais não-verbais são os contribuidores mais decisivos para a vitória. O juiz automatizado de anotação chega a concordância próxima da humana na rotulagem de átomos de engano.","pn":"Separação de canais verbais e não-verbais na avaliação de engano de agentes","pm":"O ambiente coloca agentes multimodais em jogo de dedução social com ações físicas observáveis, e um esquema de anotação em átomos e arcos, operacionalizado por juiz automatizado, mede quanto cada canal de comunicação contribui para o resultado.","imp":"Se você monitora agentes apenas pelo que eles escrevem, trate o texto como evidência incompleta: um agente pode cooperar na fala enquanto sabota por ações. Ao avaliar comportamento de agentes com acesso a ferramentas ou ambientes, registre e audite as ações executadas junto com as mensagens, não só a conversa.","ex":"Um agente impostor em Among Us caminha até longe de um sabotagem para parecer ocupado enquanto acusa verbalmente outro jogador; o juiz de anotação atribui a contribuição decisiva para a vitória ao movimento, que um log só de chat não mostraria.","res":"O resultado vem de um ambiente de jogo com regras fechadas e agentes configurados pelos autores; não prova que canais não-verbais dominem engano em ambientes de produção, nem oferece detector ou defesa — mede o fenômeno, não o mitiga."},{"p":"2608.17906","ach":"Em três domínios representativos, o sistema converte ideias geradas em progresso mensurável e detecta resultados experimentais não confiáveis. No benchmark RSICD, uma ideia gerada eleva o Recall médio de 32,84 para 34,69, com apenas 5 eventos de problema confirmados por auditoria, contra 11 a 27 de outros sistemas de pesquisa autônoma. As decisões de continuar, revisar ou encerrar uma direção são condicionadas a evidência.","pn":"Revisão baseada em evidência antes de aceitar conclusões de agentes","pm":"Um pipeline de duas etapas separa a formulação de ideias (geração multi-modelo com revisão cruzada) da execução experimental, e nenhuma conclusão de agente é aceita sem passar por uma revisão independente que exige evidência auditada dos experimentos.","imp":"Se você tem agentes encadeados que produzem relatórios ou conclusões, adicione uma etapa final de revisão feita por um agente independente que só aprova uma afirmação quando ela vem com evidência verificável do processo — não confie na saída do mesmo agente que a produziu.","ex":"Um pipeline de agentes que escreve e executa experimentos aceita um resultado falso porque o próprio agente que rodou o código também redige a conclusão; com revisão independente baseada em evidência, esse resultado é flagrado como não auditado e a direção é revisada em vez de encerrada com conclusão alucinada.","res":"Os números vêm de três domínios escolhidos pelos autores e a auditoria de 'eventos de problema confirmados' depende do próprio sistema para classificar o que é problema; não há evidência de que o ganho se transfira para cargas de trabalho fora de pesquisa automatizada."},{"p":"2608.22817","ach":"O pipeline converte 906 relatórios técnicos industriais (7.525 páginas) em dois datasets de ~13,6k pares de QA cada, com split de benchmark retido. Ajuste fino de LLMs abertos abaixo de 10B eleva Set-Match Accuracy de 28,5% para 42,0% e F1 de 46,6% para 63,5%. Dados gerados por modelo fechado rendem mais, a custo cerca de cem vezes maior, e preservam conhecimento geral no MMLU.","pn":"Síntese de QA ancorada em evidência recuperada de documentos técnicos","pm":"Um pipeline de extração consciente de layout indexa documentos técnicos, recupera evidência e sintetiza QA de múltipla escolha classificadas por relação consulta-documento, com filtragem e divisão de benchmark retida.","imp":"Se sua equipe mantém documentação técnica interna difícil de indexar, você pode rodar o pipeline liberado sobre seus próprios relatórios para gerar datasets de QA e benchmark sem escrever o extrator nem o gerador do zero.","ex":"Um sistema de suporte que usa RAG sobre manuais de manutenção falha porque a prosa densa e as tabelas de especificação quebram a indexação padrão; o pipeline de extração por layout e a síntese de QA ancorada em evidência recuperada produzem pares de treino e avaliação diretamente desses documentos.","res":"Os ganhos de ajuste fino vêm de dados industriais da Panasonic; domínios com estrutura documental muito diferente podem exigir adaptação do pipeline. A comparação aberto-versus-fechado depende de um único par de geradores, e o custo cem vezes maior do modelo fechado pode inviabilizar regeneração frequente."},{"p":"2608.18027","ach":"Em 8 LLMs e três domínios, iterar com feedback em tempo de inferência supera baselines sem feedback: 5,6% de ganho médio e custo de API 19% menor. A maior parte do ganho surge nas primeiras iterações, e combinar canais de feedback complementares (autoavaliação do modelo e sinal de correção) rende ganho adicional. Modelos mais fortes melhoram mais, e o loop é robusto mesmo com feedback fraco ou espúrio.","pn":"Loop de experiência acumulada em tempo de inferência","pm":"O modelo acumula traços de interações anteriores consigo mesmo ou com sinais ambientais de correção, e reutiliza esses traços nas iterações seguintes para melhorar a resposta sem retreino.","imp":"Antes de pagar por retreino ou por estratégias caras de raciocínio estendido, rode 2 ou 3 iterações do seu agente guardando o que deu errado em cada tentativa e alimentando isso de volta no prompt — o paper indica que o ganho vem cedo e custa menos por resposta correta. Se você já tem testes automatizados (como testes de código), use o resultado deles como sinal de feedback junto com a autoavaliação do modelo.","ex":"Um assistente de código em produção que gera uma função, roda a suíte de testes e recebe 'falhou no teste X' pode reusar esse traço de falha na próxima tentativa em vez de recomeçar do zero: o mecanismo é o traço de experiência anterior condicionando a nova geração, o que reduz tentativas cegas e o custo por tarefa resolvida.","res":"Os ganhos são medidos em benchmarks de matemática, código e conhecimento com loops de avaliação controlados; em produção, onde cada tarefa é única e não há sinal de correção confiável, o loop pode não reproduzir os mesmos números. A correlação entre capacidade base e ganho também sugere que modelos fracos se beneficiam menos."},{"p":"2608.19854","ach":"Em seis repositórios reais do RepoCraft, o framework com estado Dual-DAG supera o baseline RPG em até 20,08 pontos percentuais de cobertura de funcionalidade e 29,74 pontos de taxa de aprovação, usando GPT-5 mini e DeepSeek V3.2. Abações mostram que remover o estado arquitetural, a evolução por modularidade ou a convergência estrutural degrada o resultado.","pn":"Estado arquitetural explícito em grafo duplo antes da geração de código","pm":"O agente mantém dois DAGs alinhados (requisitos e componentes), evolui as fronteiras dos componentes por ações estruturais guiadas por métricas de modularidade até convergência, e só então gera código guiado por testes.","imp":"Antes de mandar um agente escrever um projeto do zero, exija que ele decida e mantenha as fronteiras dos módulos primeiro, com um critério objetivo de quando essa estrutura parou de mudar, e só depois gere código dirigido por testes.","ex":"Um agente de codificação que recebe 'construa um sistema de pedidos' e gera arquivos direto tende a criar um módulo único onde a lógica de pagamento e a de estoque ficam acopladas; reestruturar depois custa reescrita. Com o grafo duplo, essas fronteiras são decididas antes da primeira linha de código.","res":"A descrição dos critérios de modularidade e das ações estruturais é de alto nível no abstract; reproduzir o desenho sem o artigo completo ou o código pode exigir decidir detalhes que o paper não especifica. Os ganhos foram medidos em seis repositórios com dois modelos específicos, não em produção real."},{"p":"2608.19880","ach":"Envolver cinco benchmarks em quatro domínios com a camada adaptativa elevou o desempenho em até 9,0 pontos em instâncias de teste não vistas, com 9,8% menos passos de execução que o ambiente original. A abordagem também superou pipelines de geração de ambientes específicos por domínio. Quando usada como sinal de otimização para aprendizado por reforço, permite que política e ambiente evoluam juntos de forma contínua e direcionada.","pn":"Camada de plugins que adapta ambiente estático aos pontos fracos do agente","pm":"Uma camada plugável envolve o ambiente existente por interfaces padrão, observando trajetórias de execução da política para diagnosticar falhas e sintetizar componentes que remodelam as tarefas sem alterar a lógica nem o verificador original.","imp":"Antes de descartar aquele ambiente de treino ou avaliação que ficou 'fácil demais' para o seu agente, envolva-o com uma camada que observe onde as execuções falham e gere variações de tarefa mirando essas falhas — mantendo o mesmo verificador para não perder a confiabilidade da avaliação.","ex":"Um agente de atendimento que resolve 95% dos tickets do dataset fixo de testes: a camada detecta nas trajetórias que as falhas se concentram em pedidos com múltiplas trocas de contexto e injeta componentes que reescrevem as tarefas para exigir essa habilidade, sem alterar a função que valida se o ticket foi resolvido.","res":"Os ganhos são medidos em benchmarks acadêmicos de raciocínio e código; não há evidência de que a abordagem funcione em ambientes de produção com efeitos colaterais reais, onde rollouts adicionais custam caro ou são arriscados. A validação dos componentes gerados depende de rollouts confiáveis, o que exige ambientes determinísticos ou verificadores baratos."},{"p":"2608.16977","ach":"Partindo de 5.245 papers de combinatória, o pipeline extraiu 6.453 conjecturas ou problemas abertos, manteve 4.717 bem postos e ainda abertos, e reduziu a 77 itens levados a revisão dos autores. Desses 77, surgiram resultados sobre conjecturas de Davies-Jenssen-Perkins-Roberts, Erdős-Straus e outros.","pn":"Cascata de triagem literatura-para-revisão com recurso caro no fim","pm":"Um pipeline extrai problemas candidatos de um corpus de papers, passa-os por estágios sucessivos de filtragem automatizada e encaminha apenas os sobreviventes para revisão humana, reservando o recurso mais escasso para o fim.","imp":"Se você opera um fluxo onde humanos ou modelos caros revisam saídas, inverta a ordem: coloque triagem automatizada em cascata antes da etapa cara e corte o volume com filtros baratos. No lugar de um revisor avaliar mil itens, ele avalia 77 que já passaram por três portas.","ex":"Um time que usa LLM de fronteira para revisar PRs gerados por agentes paga token de razoamento em cada item. Com a cascata, um modelo barato descarta PRs malformados, um segundo estágio checa duplicidade e apenas os candidatos plausíveis chegam ao modelo caro.","res":"O piloto é em combinatória, um domínio com corpus denso e verificação de conjecturas relativamente barata; nada prova que a cascata funciona em domínios onde os estágios de filtragem erram muito. Os 77 itens ainda passaram por revisão de especialistas autores do trabalho, então a qualidade final dos resultados não é medida automaticamente."},{"p":"2608.10679","ach":"Em 907 perguntas sobre um mundo empresarial reconstruído e auditado, 30,4% das perguntas de raciocínio latente permanecem sem resposta mesmo quando os documentos de ouro são fornecidos, contra 12,6% e 6,2% para perguntas de busca explícita e composição entre fontes. Estruturar o corpus como grafo de entidades ou base navegável deu os melhores resultados entre as 56 configurações testadas.","pn":"Benchmark de raciocínio organizacional latente em QA empresarial","pm":"Um mundo empresarial auditado é reconstruído a partir de documentos de rotina e tabelas organizacionais, com perguntas que exigem recuperar relações implícitas ausentes do corpus.","imp":"Se você mede a qualidade do seu RAG interno só com perguntas cuja resposta está escrita em algum documento, o número superestima o sistema: teste também perguntas cuja resposta depende de inferir relações entre registros de rotina, como quem aprovou o quê ou qual equipe cuida de qual ativo.","ex":"Um assistente interno que responde 'qual política se aplica ao reembolso X?' acertando o documento da política, mas falha quando a pergunta é 'quem é o gestor responsável pelo projeto citado neste chamado?', porque essa relação só aparece espalhada entre um ticket, uma tabela de alocações e um e-mail.","res":"O gap de 30,4% foi medido num mundo sintético reconstruído e anonimizado; empresas reais têm ruído, permissões e dependências que o benchmark não replica. O resultado não prova que nenhum sistema resolve o problema, só que as configurações testadas não resolvem nesse corpus."},{"p":"2608.11947","ach":"Em benchmarks multiple-choice, impedir que o modelo veja os rótulos das opções antes de responder não reduz o viés posicional nem melhora a acurácia de forma confiável. A decomposição mostra que o gargalo é esconder as opções, não a etapa de casamento. A única configuração que sustenta o baseline é mostrar todas as opções com um LLM matcher, e a permutação cíclica das opções é o que costuma melhorar a acurácia.","pn":"","pm":"","imp":"Pare de adotar estratégias que escondem os rótulos das opções (gerar a resposta e depois casar, ou pontuar cada opção isolada) achando que isso debia o viés de posição; na prática elas custam acurácia. Antes de publicar um número de benchmark, rode o teste com permutação cíclica das opções e reporte a faixa — é barato e captura a instabilidade que o score único esconde.","ex":"Um harness de avaliação que usa generation-then-matching (o modelo escreve a resposta sem ver as letras A-D e depois um passo de matching atribui a opção) para eliminar influência posicional em MMLU. O paper mostra que esse pipeline perde em relação ao baseline porque o gargalo é o modelo responder sem ver as opções, não o matching.","res":"O resultado vale para benchmarks multiple-choice com esse formato; não prova que permutação cíclica elimina o viés — ela só melhora a acurácia na média, e a sensibilidade por questão persiste. As medidas de desbalanceamento de recall testadas também falharam em detectar o problema, então diagnóstico de viés posicional segue sem métrica agregada confiável."},{"p":"2608.15022","ach":"Em modelos open-weight, uma variável latente só se torna verbalizável via gathering mediado por atenção numa janela de profundidade média, com transporte pelo menos 17x maior ali do que em camadas mais rasas. A janela é específica de demanda: um braço da tarefa que não precisa da variável concentra sete vezes menos. Nenhum gate seletivo foi encontrado onde a hipótese de workspace previa um.","pn":"Janela de profundidade média instala variáveis latentes em forma verbalizável","pm":"A forma legível de uma quantidade latente surge de gathering mediado por atenção dentro de uma janela de profundidade média, sem gate seletivo, e essa janela só aparece quando a tarefa demanda reutilizar a variável.","imp":"Quando um modelo parece não reportar um valor que está no contexto, o problema pode estar no transporte interno numa faixa de camadas, não na ausência do valor. Isso sugere que variar a profundidade efetiva do processamento — por exemplo, com mais passos de raciocínio intermediário — pode recuperar informações que a resposta final omite, sem tocar nos pesos.","ex":"Um assistente que lê um número de contrato no início de um documento longo e erra ao citá-lo em uma pergunta final: o valor está decodificável nas ativações (até 9x acima do piso), mas a leitura falha porque o gathering na janela de profundidade média não o trouxe para a posição consultada.","res":"O readout de percentil não é medida calibrada de uso: três componentes chegam a leituras quase iguais com efeitos 7,4x diferentes na resposta, e sob essa medida saturante a janela nem se localiza. O paper localiza onde a variável é instalada e lida, não a rota a partir da passagem original."},{"p":"2608.16033","ach":"Em 72 células com seis modelos, um oráculo empírico construído com as curvas de resposta de problemas isolados iguala ou supera a média do contest sob orçamento compartilhado, sendo estritamente superior em 71. Sob pressão moderada sem ferramentas, a alocação igualitária supera o desempenho do contest em quatro de seis modelos. Um agendador fixo supera a média em seis de nove células agenticas, mas nenhuma política domina entre domínios.","pn":"Déficit de alocação sob orçamento compartilhado","pm":"Avaliar um conjunto de problemas sob um único orçamento compartilhado de computação revela que o desempenho do modelo fica abaixo do que sua competência demonstrada em problemas isolados permite, calibrada por curvas de resposta individuais.","imp":"Se você roda um agente que resolve várias tarefas com um único teto de tokens ou chamadas, não presuma que o desempenho por tarefa se soma. Meça a curva de acerto de cada tarefa isolada primeiro e distribua o orçamento com base nisso; os resultados sugerem que distribuições não otimizadas deixam capacidade comprada e paga sem uso.","ex":"Um pipeline de revisão de código que processa cinco pull requests sob um teto único de tokens de raciocínio entrega menos patches corretos do que a mesma tarefa avaliada isoladamente permite: o modelo demonstra resolver o PR difícil sozinho, mas, com o orçamento disputado pelos cinco, falha justamente nele, por falta de atualização de estratégia entre os problemas.","res":"Os diagnósticos de trajetória mostram pouca atualização de estratégia, mas o paper não propõe nem valida um método de alocação melhor: nenhum agendador domina entre domínios, e o resultado agéntico vem de diagnóstico com apenas três modelos sob pressão forte. Não se pode ler como prova de que algum esquema de distribuição específico funcione em produção."},{"p":"2608.09209","ach":"O pipeline verifica 9 de 10 atalhos espúrios no BERT e 6 no RoBERTa treinados em MNLI, redescobrindo independentemente os vieses conhecidos de sobreposição lexical e negação, e eleva a acurácia em HANS em até 12,58 pontos percentuais. Em CivilComments-WILDS, os grupos gerados programaticamente atingem 70,1% de worst-group accuracy, igualando a reponderação com rótulos demográficos feitos à mão. Os estágios de descoberta e validação também encontram correlações espúrias interpretáveis em dados de preferência de reward models no RewardBench2.","pn":"Descoberta e verificação causal de atalhos espúrios como expressões booleanas","pm":"Um pipeline gera padrões superficiais candidatos como expressões booleanas executáveis, valida-os estatisticamente com replicação independente e confirma a dependência causal do modelo via intervenções contrafactuais, usando os padrões confirmados como definições de grupo para reponderação sem rótulos demográficos.","imp":"Antes de confiar na acurácia de um classificador em produção, rode uma verificação contrafactual: troque apenas o padrão suspeito na entrada (por exemplo, remova a frase que o modelo parece 'copiar') e veja se a previsão muda. Se mudar, o modelo está dependendo de um atalho, e benchmarks agregados não vão detectar isso — meça a acurácia separadamente por grupo definido pelo padrão.","ex":"Classificador BERT de inferência textual treinado em MNLI que acerta o benchmark mas erra o desafio HANS: ele decide 'implicação' quando a hipótese repete palavras da premissa, mesmo sem relação lógica. A intervenção contrafactual trocando a premissa sem alterar a sobreposição lexical expõe a dependência do atalho.","res":"Os resultados são sobre classificadores BERT/RoBERTa de tarefas de classificação, não sobre modelos de linguagem gerativos maiores em produção; os números de recuperação de atalhos (9/10, 6/10) dependem do vocabulário de candidatos gerado e podem não cobrir atalhos mais abstratos. A equalização com DFR rotulado à mão foi demonstrada em um dataset; a generalidade dessa igualdade não está provada."},{"p":"2608.10835","ach":"O detector alcança estado da arte em detecção de alucinação token-level e de objetos em múltiplos backbones de LVLM. Durante a decodificação, reduz alucinações de objetos em até 55% com latência de 1,06x a geração padrão. O treino do detector não exige ajustar o modelo base.","pn":"Detector de alucinação token-level sobre o traço interno como grafo","pm":"O traço computacional de uma passagem adiante congelada é representado como grafo dirigido de patches, tokens de consulta e tokens gerados, processado por módulos estruturais alternados que combinam evidência relacional, espacial e sequencial para marcar tokens alucinados e permitir reamostragem durante a decodificação.","imp":"Se você opera o modelo com acesso aos pesos de atenção, pode acoplar um detector leve que marca tokens suspeitos em tempo real e os reamostra, em vez de rejeitar a resposta inteira ou pós-filtrar com um verificador externo.","ex":"Num assistente visual que descreve imagens de catálogo, o decodificador reamostra o token 'tênis' gerado numa região da imagem sem calçado, corrigindo a alucinação no fluxo sem regenerar a descrição inteira nem latência perceptível.","res":"Não funciona sobre APIs fechadas: sem acesso às ativações e pesos de atenção do modelo, o detector não pode ser construído. Os ganhos de 55% e 1,06x de latência vêm dos testes dos autores em benchmarks de alucinação de objetos; comportamento em outros tipos de alucinação ou domínios não está demonstrado."},{"p":"2608.13987","ach":"O checkpoint liberado do Nanbeige4.2-3B não roda no PyTorch MPS por cinco bugs independentes, incluindo um buffer RoPE zerado silenciosamente. Mesmo corrigidos, o reuso de camadas dobra a memória de atenção no pico; a estratégia de prefill em blocos amplia o contexto possível em 2,7 vezes em 32 GiB. Com os patches, o modelo passa de 0% para até 30% nas tarefas avaliadas do MCPMark e fica perto do perfeito em chamadas simples no BFCL, mas falha na maioria dos testes multi-ferramenta.","pn":"Prefill em blocos para viabilizar reuso de camadas em memória compartilhada","pm":"O reuso de uma pilha de camadas em segunda passada dobra a memória de atenção no pico, e processar o prefill em blocos reduz esse pico, permitindo contexto maior em memória unificada limitada.","imp":"Se você roda modelos de código aberto em Mac (Apple Silicon), não assuma que um checkpoint novo funciona direto: bugs de compatibilidade podem zerar componentes sem erro visível. Verifique o buffer de posicionamento com testes de saída antes de avaliar o modelo, e use prefill em blocos quando o contexto estourar a memória.","ex":"Um agente de codificação servido localmente num MacBook de 32 GiB retorna tool calls com coordenadas de posição erradas porque o buffer RoPE foi zerado pelo backend MPS; o agente falha silenciosamente em vez de lançar erro, e o time erra o diagnóstico achando que o prompt é o problema.","res":"Os resultados vêm de um único modelo de 3B com arquitetura de reuso de camadas e num subconjunto do MCPMark; o ganho de 2,7 vezes em contexto vale para memória unificada de 32 GiB e não foi demonstrado em outras plataformas ou tamanhos de modelo. O desempenho em multi-tool permanece fraco, então a correção viabiliza execução, não competência agentica."},{"p":"2608.13430","ach":"Em três pares de modelos base/instruction-tuned avaliados em benchmarks de question answering, o tuning altera consistentemente a confiança nas respostas sem mudar quase nada a acurácia preditiva e com piora na calibração baseada em verossimilhança. A diversidade entre raciocínios distintos diminui, enquanto a diversidade lexical de superfície varia em direção e magnitude conforme modelo e benchmark. Os efeitos persistem após controlar seleção de resposta e comprimento do raciocínio.","pn":"","pm":"","imp":"Você não deve usar a frase de confiança que o modelo imprime ('tenho certeza') como sinal de acerto depois de um instruction tuning: confirme com verificações externas, como checagem contra fonte ou amostragem de múltiplas respostas, porque o modelo pode afirmar certeza maior sem errar menos.","ex":"Um assistente de QA em produção baseado em um modelo instruction-tuned responde perguntas de suporte com 'tenho certeza que X' e o pipeline prioriza tickets por essa confiança; como o tuning elevou a confiança verbalizada sem elevar a acurácia, casos errados recebem a mesma prioridade alta que os certos, e erros chegam primeiro ao cliente.","res":"Os efeitos foram medidos em três pares de modelos e benchmarks de QA; a direção da diversidade lexical de superfície não é uniforme, então o achado sólido é sobre confiança e diversidade entre raciocínios, não uma regra geral sobre todo instruction tuning em qualquer domínio."},{"p":"2609.03254","ach":"Em artefatos gerados por conversa, aplicar uma revisão local exige propagá-la às dependências espalhadas no histórico. Nove métodos testados em seis modelos alcançam 68,3–93% de acurácia, e selecionar entre três amostras paralelas (por LLM ou medoide) eleva a acurácia em 2,2–9,7% sendo o método mais custo-efetivo.","pn":"Propagação de revisão local em artefatos gerados por conversa","pm":"Ao receber uma mudança local solicitada em conversa, o modelo identifica dependências no histórico e propaga a revisão a todas as partes afetadas do artefato, e a seleção entre três amostras paralelas por LLM ou medoide é o método mais custo-efetivo.","imp":"Se seu assistente edita documentos, código ou planilhas por conversa, trate cada pedido de mudança como potencialmente global: valide se partes dependentes foram atualizadas, e quando o orçamento permitir, gere três versões da revisão e escolha a melhor em vez de aceitar a primeira.","ex":"Num assistente que gera dashboards por chat, o usuário pede para renomear uma métrica; o modelo troca o rótulo no gráfico mas deixa o filtro e a legenda com o nome antigo, exatamente a falha de propagação que o benchmark mede.","res":"Os ganhos de 2,2–9,7% vêm de um benchmark próprio de propagação de revisão; acurácias de até 93% dos baselines indicam que a tarefa já é razoavelmente resolvida, e o resultado pode não se transferir a artefatos muito maiores ou com dependências mais implícitas."},{"p":"2608.12781","ach":"Em 2.415 prompts multimodais, falhas de padrão de resposta aparecem de forma generalizada entre modelos de diferentes provedores, e o modo non-thinking apresenta taxas de falha substancialmente maiores que o modo thinking. Isso cria desalinhamento sistemático entre as duas interfaces do mesmo modelo, mesmo quando a resposta está correta. As quatro falhas medidas são vazamento de raciocínio, repetição, contradição lógica e raciocínio performativo.","pn":"Diagnóstico de falhas de padrão de resposta entre modos thinking e non-thinking","pm":"Um benchmark diagnostica falhas visíveis na resposta final (vazamento de raciocínio, repetição, contradição lógica, raciocínio performativo) de forma independente da corretude da tarefa, comparando os dois modos de inferência de um mesmo modelo híbrido.","imp":"Se seu produto oferece um modo rápido e um modo deliberado do mesmo modelo, pare de avaliar só a corretude: teste a resposta final dos dois modos com as mesmas regras, porque o modo rápido tende a falhar de formas que a corretude não captura.","ex":"Um chatbot multimodal com modo rápido responde a uma pergunta sobre uma imagem repetindo a mesma frase ou soltando o texto de raciocínio interno na resposta visível; o usuário vê um artefato de raciocínio que a avaliação de acurácia nunca detectou.","res":"A mitigação proposta usa aprendizado por reforço com um modelo de recompensa, inacessível a quem não treina modelos. O benchmark diagnostica falhas, mas não prova que a correção via penalidades generalize para outros modelos além dos dois testados (Qwen3-VL 4B e 8B), e o paper admite um custo na performance da tarefa."},{"p":"2608.20886","ach":"Em cinco benchmarks de recuperação multimodal (texto-para-imagem, imagem-para-imagem e composta), o procedimento sem treino supera re-rankers por embedding e por cadeia de pensamento livre, atingindo estado da arte. A variante destilada preserva mais de 90% da capacidade do professor com custo substancialmente menor. O ganho vem de rotular cada critério da query como obrigatório, proibido ou ignorável, o que evita que restrições finas sejam omitidas ou alucinadas.","pn":"Re-ranking como verificação de critérios tipados extraídos da query","pm":"A query é decomposta em critérios tipados rotulados como obrigatório, proibido ou ignorável, e cada candidato é verificado contra esses critérios por pontuação de rubrica determinística combinada com comparação listwise, sem treino.","imp":"Quando seu buscador receber pedidos com várias condições ao mesmo tempo — 'esse tênis, mas em azul e sem cadarço' —, deixe de resumir tudo num embedding: monte a lista do que é obrigatório, do que é proibido e do que pode ser ignorado, e verifique cada candidato item por item antes de ordenar os resultados.","ex":"Na busca de moda do tipo 'ache esta camisa em rosa', um re-ranker por embedding comprime 'camisa', 'rosa' e 'fundo irrelevante' num único vetor; a cor pesa pouco na similaridade, então camisas de outras cores sobem no ranking. Com a checagem por critérios, 'rosa' fica rotulada como obrigatória e esses candidatos são rebaixados antes da ordenação final.","res":"Os resultados vêm de benchmarks de recuperação de imagens; não há evidência de que os seis slots cubram domínios com critérios difíceis de tipar, como código ou tabelas. A destilação que preserva 90% exige treino, então quem não treina fica com o procedimento completo, que chama um modelo multimodal para verificar cada candidato e encarece cada consulta."},{"p":"2608.21360","ach":"Gemini-3-Pro atinge 66,4 de 100 e Qwen3-Omni-Instruct 51,2 no benchmark. Os modelos em geral entendem o que o usuário pede, mas erram ou respondem incompleto: falham em ler gestos como pedidos, perdem o contexto acumulado ao longo dos turnos e começam a responder antes do evento-alvo.","pn":"Engenharia reversa de vídeo em episódios multi-turn com rota fixada por priors","pm":"Vídeos existentes da internet são decompostos em clipes multi-turn com objetivos de usuário deduzidos, e priors derivados do vídeo de origem fixam a rota da interação, permitindo avaliar assistência em tempo real com dados estáticos.","imp":"Se você avalia um modelo omni para um produto que assiste vídeo e conversa, não decida por respostas a clipes isolados: teste conversas de vários turnos e verifique se o modelo lembra do combinado antes, entende um gesto sem fala e espera o momento certo de falar.","ex":"No benchmark, o Gemini-3-Pro guiando um usuário por uma tarefa mostrada em vídeo: quando o usuário responde com um gesto em vez de falar, o modelo não interpreta o pedido; em turnos seguintes, perde restrições dadas antes (o contexto histórico) e repete instruções já corrigidas; e antecipa a resposta antes de o evento-alvo acontecer na cena.","res":"As interações são simuladas: vídeos existentes são re-engenheirados e um prior força uma rota única, então os resultados não cobrem diálogo livre em que o usuário muda de rumo. O abstract reporta apenas dois modelos e não confirma a disponibilidade pública do dataset para reuso."},{"p":"2608.20707","ach":"Em sessões de compras com dezenas de páginas, simuladores atuais ou descartam o histórico e perdem o estado do usuário, ou concatenam tudo e estouram o contexto com queda de qualidade; supervisão por passo deixa passar padrões não realistas como sobre-exploração e passividade. Com memória hierárquica e RL em nível de trajetória, o RecVerse supera baselines em fidelidade comportamental e consistência de intenção. O abstract não traz números — a evidência é comparativa contra baselines.","pn":"Memória hierárquica com gravação tratada como ação","pm":"O agente mantém três camadas de memória — foco imediato, traços da sessão e intenção de longo prazo — e cada atualização de memória é uma ação que o próprio agente decide executar.","imp":"Quando um agente seu começa a esquecer o que o usuário fez vinte passos atrás, resista à tentação de só aumentar a janela ou resumir tudo: separe o histórico em três cadernos — o que vale agora, o que já rolou na sessão, o que a pessoa quer de forma estável — e deixe o próprio modelo decidir, a cada passo, em qual caderno anotar.","ex":"Num simulador de comprador reproduzindo uma sessão real de 40 páginas de e-commerce, concatenar todas as capturas de tela estoura a janela de contexto e o agente passa a vagar entre categorias sem efetivar compra — a sobre-exploração relatada — porque cada clique foi imitado isoladamente, sem nenhum sinal sobre a sessão inteira.","res":"A fidelidade reportada depende do RL em nível de trajetória, que exige treinar o agente; quem implementar só a hierarquia de memória via prompts não obtém os números do paper e precisa improvisar a política de quando gravar. O domínio medido é e-commerce por capturas de tela, e o abstract afirma superioridade sem apresentar números."},{"p":"2608.22274","ach":"O seletor training-free recupera 64,9%, 65,3% e 33,0% do ganho de COMET-22 que se obteria com comprimentos de referência, em três pares de tradução. Diagnósticos mostram que comprimentos 'denoising-friendly' não coincidem com os de referência, e que a ordem de revelação dos tokens importa menos que o comprimento fornecido.","pn":"Seleção de comprimento-alvo por entropia preditiva em decodificação por difusão","pm":"Candidatos de comprimento do canvas-alvo são pontuados pela entropia preditiva média de passagens forward com todas as máscaras, e o canvas que o modelo está mais preparado para preencher é escolhido antes da denoising.","imp":"Se você roda um modelo de difusão mascarada em produção, não fixe o comprimento da resposta por estatísticas do corpus de treino: meça a entropia preditiva do modelo em um passe com tudo mascarado para cada comprimento candidato e escolha o de menor valor antes de decodificar.","ex":"Em tradução En→Zh com dLLM, um canvas escolhido por estatística de treino deixa tokens redundantes ou corta conteúdo; o seletor por entropia identifica o canvas que o modelo consegue preencher, elevando adequação medida por três tradutores especialistas.","res":"Os ganhos são medidos apenas em tradução automática com modelos de difusão mascarada; não há evidência de que a entropia do passe all-mask selecione bem comprimentos em outras tarefas de geração. O ganho em EntoDe é bem menor (33%), e a evidência humana é mais forte em ZhtoEn que em En→Zh."},{"p":"2608.24053","ach":"A variante de 2B parâmetros supera o baseline open-source líder de 8B no MMEB-v2, e a de 9B atinge 80,6, novo estado da arte. Em produção no WeChat, houve ganhos consistentes em 14 testes A/B online e em um benchmark interno de 26 tarefas, com pesos e código publicados.","pn":"Refino de embeddings multimodais com supervisão de relevância fina e transferênc","pm":"Um alinhamento multimodal em larga escala é seguido por um estágio de refino com dados curados, supervisão de relevância em nível fino e transferência de conhecimento entre escalas de modelo, produzindo embeddings universais em dimensões flexíveis.","imp":"Se seu sistema de busca ou RAG precisa indexar texto, imagem e vídeo no mesmo espaço vetorial, você pode trocar seu embedding atual por um modelo aberto menor e mais barato de servir, sem retreinar nada e reduzindo custo de inferência.","ex":"Um buscador de e-commerce que hoje roda um modelo de embedding de 8B para recuperar produtos a partir de fotos e descrições pode substituí-lo pela variante 2B, mantendo qualidade de recuperação e cortando custo de GPU por consulta.","res":"Os números de estado da arte vêm de benchmarks avaliados pelos próprios autores, e o benchmark interno de 26 tarefas não é público, então os ganhos em produção não são reproduzíveis fora do WeChat. O ganho do 2B sobre o 8B é no MMEB-v2, não necessariamente no seu domínio."},{"p":"2608.21140","ach":"Em CT axial, o agente modular atinge 94,1% de acurácia e 94,2% de F1 no MIRP spatial QA, superando prompting direto do Qwen2-VL em 42,5 pontos percentuais. A decomposição em parsing, localização anatômica e verificação geométrica determinística elimina as falhas de grounding espacial do modelo ponta a ponta. Os estágios intermediários permanecem interpretáveis e auditáveis.","pn":"Verificação espacial por decomposição em regras geométricas determinísticas","pm":"A pergunta espacial em linguagem natural é convertida em tuplas estruturadas, os órgãos são localizados por um detector treinado e a decisão final de relação espacial é calculada por regras geométricas determinísticas sobre os centros dos objetos, em vez de ser prevista ponta a ponta por um modelo de visão-linguagem.","imp":"Quando um modelo de visão-linguagem precisa responder se uma estrutura está acima, abaixo ou à esquerda de outra, não peça essa decisão ao modelo: extraia a relação como dados estruturados, localize os objetos com um detector e calcule a resposta com geometria simples. Você ganha acurácia e um rastro de auditoria para revisão clínica.","ex":"Em um sistema de triagem de laudos de tórax, a pergunta 'o nódulo está acima do diafragma?' falha quando respondida direto pelo VLM, que confunde estruturas vizinhas; com o padrão do paper, o detector marca nódulo e diafragma e a regra geométrica compara coordenadas, produzindo decisão verificável.","res":"Os resultados valem para relações binárias entre órgãos em cortes axiais de CT; relações mais complexas, múltiplos achados ou outras modalidades não foram testadas. O detector YOLO precisa ser treinado para as estruturas de interesse, o que limita a portabilidade para anatomias sem dados de anotação."},{"p":"2608.24099","ach":"Avaliando 16 modelos de agente GUI sob anomalias dinâmicas injetadas em execução, todos sofrem degradação significativa de desempenho. Treino com GRPO em ambientes com armadilhas resolve armadilhas de um passo nas camadas de estado e ação, mas não resolve armadilhas contextuais profundas como deadlock de estado.","pn":"Injeção de anomalias dinâmicas em trajetórias de execução de agentes","pm":"Perturbações adversariais são inseridas durante a execução do agente, em camadas de estado, pensamento, ação e turno, preservando a solvabilidade da tarefa para medir robustez e separar anomalias aprendíveis por treino de gargalos intrínsecos de raciocínio.","imp":"Se você opera um agente que controla interfaces gráficas, não confie em testes só com fluxos limpos: pop-ups e eventos inesperados no meio da execução derrubam até os modelos mais fortes. Adicione ao seu conjunto de testes cenários com interrupções injetadas e trate falhas em armadilhas de múltiplos passos como limite do modelo, não como falta de treino.","ex":"Um agente Android que preenche um formulário recebe um pop-up de permissão do sistema no meio da tarefa; o modelo perde o contexto do formulário e entra em deadlock de estado, repetindo ações sem progresso mesmo após o pop-up ser fechado.","res":"O treino adversarial foi feito pelos autores em ambientes controlados por eles; não prova que treino em produção com anomalias reais funcione igual. A separação entre anomalia aprendível e gargalo de raciocínio vale para os ambientes e modelos testados, não como lei geral."},{"p":"2608.24138","ach":"Em seis VLMs e três benchmarks de UI-to-code, o framework alcança desempenho final e de melhor rodada superiores à auto-evolução ingênua, com trajetórias de refinamento mais estáveis. O mecanismo identificado é o acoplamento de reparo visual: editar um trecho do código propaga mudanças por layout e estilo, corrigindo um defeito e degradando regiões antes corretas. As rubricas estruturadas mitigam o colapso de trajetória ao melhorar a recuperação de regressões visuais severas.","pn":"Rubricas tipadas como contexto de reparo visual em auto-evolução","pm":"O feedback visual é convertido em rubricas tipadas, uma única meta de reparo priorizada é selecionada por rodada e as rubricas já usadas são guardadas como histórico, restringindo cada revisão a um escopo local e evitando mudanças repetidas ou amplas demais.","imp":"Se você deixa um modelo revisar telas geradas em loop, pare de mandar o feedback visual inteiro a cada rodada: transforme-o em uma lista de defeitos tipados, escolha um alvo por rodada e guarde o que já foi corrigido para o loop não desfazer ou espalhar o reparo.","ex":"Em um gerador de telas de checkout, o modelo corrige o botão de pagamento desalinhado, mas a edição desloca o resumo do carrinho que estava correto; com um alvo de reparo único por rodada e histórico das rubricas já resolvidas, essa regressão em cadeia é evitada.","res":"Os resultados vêm de benchmarks de UI-to-code com VLMs específicos; não há código aberto dos autores, então a reprodução depende da reimplementação da geração e seleção de rubricas, cujo custo e sensibilidade ao gerador de rubricas não são totalmente caracterizados."},{"p":"2608.25832","ach":"Três modelos abertos avaliados em oito línguas e seis jogos mostram força de jogo marcadamente diferente conforme a língua da interface, com variação sistemática em margens de vitória, ações inválidas e tendências estratégicas. As falhas se concentram em raciocínio espacial, decisões condicionadas a cartas e escolha do lance ótimo. Em parte dos casos, trocar apenas a língua do raciocínio intermediário recupera boa parte do desempenho perdido.","pn":"Self-play multilíngue para isolar o efeito da língua","pm":"Duas instâncias do mesmo modelo competem em um jogo de texto, cada uma por uma interface em língua diferente, mantendo modelo, oponente, regras e ações fixos, o que isola a língua como única variável do desempenho observado.","imp":"Se seu sistema atende usuários em vários idiomas, não presuma que a qualidade é a mesma: rode o mesmo conjunto de tarefas em cada língua e compare as taxas de erro. Quando uma língua performa mal, teste pedir ao modelo para raciocinar em outra língua antes de responder — a troca pode recuperar desempenho sem retreinar nada.","ex":"Um assistente de atendimento bilíngue português-inglês que joga bem xadrez em inglês mas comete movimentos ilegais ao descrever posições em português: o self-play revela que a falha está na etapa de raciocínio espacial naquela língua, não no conhecimento do jogo, e instruir o raciocínio em inglês antes de responder em português reduz os movimentos inválidos.","res":"A evidência vem de jogos de texto com três modelos abertos e seis jogos; não prova que a inconsistência se estenda a domínios como código ou redação, nem que a recuperação via língua de raciocínio funcione para todas as línguas e tarefas testadas. O efeito da língua de raciocínio apareceu apenas em parte dos cenários."},{"p":"2608.23172","ach":"Em quatro datasets de humor (sátira, sarcasmo, memes), o framework de grafo causal supera baselines de raciocínio linear em 1-20% em compreensão de humor e 1-3% em detecção, com VLMs comerciais e open-source em zero-shot. Análise por informação mútua mostra que as representações geradas contêm mais informação relevante para a saída do que as dos baselines.","pn":"Grafo de relações causais serializado em código para raciocínio multimodal","pm":"As relações causais e contextuais entre entidades de imagem e texto são representadas como um grafo leve, serializado em forma de código por um modelo vision-language e interpretado pelo mesmo ou por outro modelo para gerar a predição final em zero-shot.","imp":"Quando uma tarefa depende de relações implícitas entre imagem e texto, você pode pedir ao modelo que primeiro escreva um pequeno grafo de causa e efeito em formato de código e depois responda a partir dele, em vez de usar cadeia de raciocínio linear — e testar isso custa apenas mudanças no prompt.","ex":"Um moderador de conteúdo que usa um VLM para classificar memes sarcásticos: a cadeia de raciocínio linear perde a inversão entre texto positivo e imagem contraditória; o grafo causal explicita o nó 'imagem contradiz texto' antes da decisão, reduzindo falsos negativos.","res":"Os ganhos em detecção são de 1-3%, margem que pode não justificar o custo extra de uma chamada adicional por item; os 20% aparecem apenas em compreensão, tarefa menos comum em produção. Os datasets são todos de humor, então a transferência do padrão para outros domínios multimodais não é medida no paper."},{"p":"2608.21721","ach":"Em três datasets de desinformação em saúde e três modelos base, a política de decidir por turno entre sondar e responder obteve a maior utilidade ajustada por custo, usando 30% menos turnos do que baselines que sempre perguntam. A comparação usa usuários simulados com estado latente de letramento em saúde e comprometimento de crença. O ganho vem de perguntar apenas quando o valor informacional supera o custo da interação.","pn":"Decisão por turno entre perguntar e responder com utilidade ajustada por custo","pm":"A cada turno, o sistema compara o ganho esperado de fazer uma pergunta de esclarecimento com o custo de interação dessa pergunta e só sonda quando o saldo é positivo; caso contrário, entrega a correção final.","imp":"No seu pipeline de diálogo, antes de disparar mais uma pergunta de esclarecimento, estime se a resposta extra muda a correção final; se não muda, responda direto e economize turnos. Perguntas de clarificação não são grátis: cada uma custa um turno e pode irritar o usuário.","ex":"Chatbot de triagem em saúde que hoje sempre pede esclarecimento antes de corrigir: um usuário que já desconfia da mensagem falsa recebe perguntas redundantes, gasta turnos extras e abandona antes da correção; com a decisão por turno, o sistema detecta o estado latente favorável e corrige na primeira resposta.","res":"Os usuários são simulados com estados latentes modelados pelos autores, não pessoas reais; o ganho de 30% em turnos pode não se transferir para a variabilidade real de letramento e crença. Além disso, a política foi otimizada com recompensa por turno, e reproduzi-la sem esse sinal de treino pode exigir ajuste de limiares no seu domínio."},{"p":"2608.25417","ach":"Em 25 modelos avaliados, a similaridade de reconstrução satura entre 0,40 e 0,54, e os diagnósticos de trajetória mostram instabilidade em loop fechado: os modelos param cedo ou degradam após o pico. As tarefas semânticas revelam limites duros em anotação de precisão e planejamento de trajetória. O modelo EASEL-9B, treinado no dataset curricular, supera o modelo base em 6,3% relativo.","pn":"Avaliação de uso de ferramentas visuais por reconstrução guiada por referência","pm":"Um benchmark mede a precisão de agentes multimodais em ações visuais parametrizadas em loop fechado, usando a reconstrução incremental de uma imagem de referência como tarefa proxy e diagnósticos de trajetória para expor instabilidade pós-pico.","imp":"Se seu agente desenha, anota regiões ou edita imagens via ferramentas, teste-o nesse benchmark antes de confiar na precisão: a falha típica não é escolher a ferramenta errada, mas perder o controle fino dos parâmetros ao longo da execução. Use os diagnósticos de trajetória para decidir se vale adicionar verificação visual entre passos.","ex":"Um agente de edição de imagens em produção que recebe 'contorne a lesão nesta radiografia' e traça o contorno de uma vez, sem conferir o resultado contra a imagem: é exatamente o padrão de saturação precoce que o benchmark mede, em que a precisão do parâmetro do traço define o resultado final.","res":"A tarefa proxy é pintar um canvas até igualar uma referência — mede controle motor visual parametrizado, não uso de ferramentas visuais reais como editores ou CAD. O ganho de 6,3% do modelo treinado é modesto e o modelo continua longe do teto; os números não dizem nada sobre agentes que operam ferramentas com APIs textuais."},{"p":"2608.28600","ach":"A análise de trajetórias de raciocínio mostra que as heurísticas matemáticas usadas pelo modelo explicam a correção da resposta final melhor que features tradicionais de cadeia de pensamento. Modelos acertam mais quando concentram o esforço em poucos espaços semânticos, padrão parecido com o humano. Pós-treino com reforço induz uso de heurísticas em modos restritos, e promover diversidade de heurísticas melhora a acurácia.","pn":"Diagnóstico de raciocínio por espaços semânticos e heurísticas","pm":"Cadeias de pensamento são decompostas em interpretações matemáticas sucessivas do problema e nas ações heurísticas tomadas dentro delas, e a distribuição dessas ações explica a correção da resposta final melhor que features tradicionais do texto.","imp":"Você pode auditar por que seu modelo erra em matemática olhando quais ações heurísticas ele tenta, em vez de confiar no texto da cadeia de pensamento como sinal de qualidade. Se o seu agente repete sempre o mesmo tipo de abordagem, diversificar as estratégias promovidas no ajuste fino pode render ganho de acurácia mensurável.","ex":"Um assistente de resolução de problemas de olimpíada que erra mesmo com cadeia de pensamento aparentemente coerente: o diagnóstico por heurísticas revela que ele tenta sempre simplificar o problema e nunca trabalhar de trás para frente, e a falha está na repetição de estratégia, não na redação do raciocínio.","res":"A lente foi validada em raciocínio matemático; a transferência para outros domínios depende de definir espaços semânticos e heurísticas adequados a cada um, o que o paper não faz. A parte de pós-treino envolve retreino, então o ganho de acurácia por diversidade de heurísticas não é adotável sem infraestrutura de treino."},{"p":"2608.28695","ach":"Modelos de embedding de ponta e pipelines de decompor-e-reranquear falham em montar grupos de imagens ligados por relacoes estruturais, um problema que o paper chama de cegueira relacional. O framework agentico proposto atinge ganhos substanciais sobre essas baselines no benchmark de 109.467 imagens e 667 consultas verificadas. A verificacao do grupo inteiro por um modelo de visao e linguagem e o componente que navega a explosao combinatória.","pn":"Recuperacao como montagem incremental de grupos com relevancia conjunta","pm":"Em vez de pontuar cada imagem isoladamente, um agente busca iterativamente os papeis relacionais que faltam no grupo e um modelo de visao e linguagem verifica a coerencia do conjunto inteiro antes de aceita-lo.","imp":"Se o seu sistema de busca devolve itens um a um e o usuario na verdade quer conjuntos coerentes (um album, um incidente, uma receita completa), pare de tratar a relevancia como soma de scores individuais. Adote um laco em que um modelo de linguagem identifica qual papel falta no conjunto, busca esse item, e um verificador julga o grupo fechado antes de entrega-lo.","ex":"Busca em acervo pessoal de fotos: a consulta 'o churrasco de dezembro' exige mesa, pessoas, comida e fogo juntos; o ranqueamento ponto a ponto devolve quatro close-ups de comida parecidos, porque cada um pontua alto isolado, enquanto a verificacao conjunta rejeitaria o grupo sem a foto das pessoas.","res":"O dominio e colecoes de fotos pessoais com intencao narrativa; nao ha evidencia de que o laco se transfira a busca corporativa ou a texto puro sem revalidacao. O benchmark foi construido por pipeline semiautomatizado, e consultas verificadas em 667 casos podem nao cobrir a variedade de intencoes reais. O ganho depende de chamadas multiplas de LLM e VLM por consulta, com custo de latencia nao reportado em detalhe."},{"p":"2608.29974","ach":"No split inglês do SHROOM-Visions, o ensemble atinge correlação de calibração Pearson de 0,41, IoU geral de 0,39 (0,91 em respostas limpas) e acurácia de detecção de 70,7%. O tagger discriminativo sozinho é mais calibrado e rápido, mas perde spans; o gerador sozinho sofre de excesso de confiança. A fusão por união calibrada combina os dois pontos fortes.","pn":"Re-pontuação calibrada de spans por tagger discriminativo","pm":"Um modelo generativo propõe spans candidatos de alucinação e um tagger discriminativo multimodal, melhor calibrado e mais rápido, re-pontua esses spans com probabilidades confiáveis, combinando recall do gerador com calibração do classificador.","imp":"Se você detecta alucinações com um modelo generativo que diz 'confio 95%' e erra muito, adicione um segundo modelo classificador que só marca trechos e dá probabilidades, e use as notas dele para filtrar ou ordenar os trechos que o gerador apontou. Isso cabe num pipeline de produção sem retreinar nada além do classificador.","ex":"Um assistente que descreve imagens de laudos médicos alucina detalhes: o gerador marca o trecho 'o nódulo tem 3mm' com confiança alta mesmo errando. Um tagger do tipo XLM-R com encoder visual re-pontua esse span com probabilidade calibrada baixa, e o sistema suprime ou sinaliza o trecho antes de exibir ao médico.","res":"Os números vêm de um único split de uma shared task (inglês, SHROOM-Visions); IoU geral de 0,39 indica localização ainda imprecisa fora de respostas limpas. O padrão foi validado numa tarefa e domínio só — não há evidência de que a fusão transfira para outros tipos de conteúdo ou idiomas sem reajuste."}],"serie":{"2504.15476":[["2026-09-04",1,1,null],["2026-09-05",1,1,null],["2026-09-06",1,1,null],["2026-09-07",1,1,null],["2026-09-08",1,1,null]],"2512.14629":[[" <script>/* Painel Daily Papers - porte do design canvas para HTML/JS puro.
 *
 * O desenho nasceu como artboard `.dc.html` da Claude Design (Artifact
 * "Painel Daily Papers"). Aquele arquivo so roda dentro do runtime do canvas;
 * este e o mesmo layout e a mesma logica de recorte reescritos em JS de
 * navegador, para o painel abrir em qualquer lugar.
 *
 * Duas diferencas deliberadas em relacao ao original:
 *
 * 1. O tooltip nao passa pelo estado. No canvas cada hover era um setState e
 *    um re-render; com 268 pontos de dispersao isso pisca no navegador. Aqui o
 *    tooltip e um no fixo que so muda de posicao e texto.
 *
 * 2. A linha de filtro que esta com o menu aberto sobe para z-index 90. No
 *    canvas as linhas ficam em 4/3/2/1 e a cortina de fechar em 80 - o que
 *    deixaria o proprio menu embaixo da cortina num navegador de verdade.
 *
 * O resto (cores, tipografia, ordem das secoes, textos) e o artboard.
 */
(function () {
  'use strict';

  /* ACCENT e so link e destaque (ticket 04). Ele ja significou "aprovado" na
     linha da taxa, no heatmap e na matriz - e por isso brigava com o proprio
     papel de chamar atencao: metade do painel ficava amarela. Aprovado agora
     tem cor propria, VERDE, e ela vale em todo lugar onde a medida e "quanto
     passou". */
  var ACCENT = '#d9a441';
  var VERDE = '#4ec07a';

  /* Passos escuro e claro da MESMA rampa de verde. Validados com o
     `validate_palette.js` da skill dataviz contra o fundo do card (#16191c),
     em modo ordinal: L monotona, ΔL >= 0.06, extremo claro a 4,16:1, e
     ΔE 27 sob protanopia - a separacao entre eles nao depende de enxergar o
     verde. Sao passos da rampa, nao cores avulsas: mexer num deles e mexer na
     rampa, e por isso o hex mora aqui uma vez so. */
  var VERDE_ESCURO = '#2e8b57';
  var VERDE_CLARO = '#8fe0ae';

  /* Os dois papeis do passo claro, nomeados a parte de proposito: eles dizem
