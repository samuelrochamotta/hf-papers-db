a agentes de código, atendimento ou outras tarefas de produção."},{"p":"2608.14929","ach":"O método compara a estrutura residual específica de cada checkpoint, após remover o componente de identidade compartilhado que o treino residual sempre introduz entre modelo-base e derivados, produzindo um score de linhagem calibrado contra checkpoints independentes. Em benchmarks residual-MLP e GPT-2 o score separa perfeitamente (AUROC=1.0) descendentes fine-tuned, LoRA-merged, podados e quantizados de modelos independentes e destilados, permanece inalterado sob ataques de 'checkpoint laundering' que preservam a função (onde baselines de espaço de pesos falham ou perdem margem) e roda 76x mais rápido que o baseline robusto mais próximo em GPT-2.","pn":"","pm":"","imp":"Antes de baixar e colocar em produção um checkpoint de peso aberto de terceiros — por exemplo uma variante fine-tuned, podada, quantizada ou fundida via LoRA encontrada em um hub — você pode calcular esse score de linhagem diretamente sobre os pesos, sem precisar de dados de teste nem de acesso à API do autor original, para confirmar se o checkpoint realmente deriva do modelo-base que ele afirma ter, mesmo que alguém tenha tentado disfarçar a origem por poda, quantização ou fusão de pesos.","ex":"No estudo de caso com checkpoints públicos do LLaMA-2, o método classificou corretamente 3 checkpoints como realmente derivados do modelo-base e 7 como independentes, incluindo casos em que técnicas de 'checkpoint laundering' preservando a função tentavam mascarar a ancestralidade real dos pesos.","res":"O método exige acesso white-box aos pesos completos de ambos os checkpoints comparados — não funciona a partir de acesso via API ou apenas aos outputs do modelo — e foi validado principalmente entre checkpoints compatíveis da mesma família arquitetural; não há evidência de que funcione para comparar modelos com arquiteturas totalmente distintas ou quando apenas um dos dois checkpoints está disponível em peso aberto."},{"p":"2608.15008","ach":"Uma avaliação controlada com três modelos-base e quatro suítes de benchmark, medindo 26 métricas de desempenho e eficiência, mostra que nenhum substrato de memória (índices densos, esparsos, registros de texto, stores estruturados/hierárquicos, memórias por refinamento, atualizações parametrizadas, contexto compatível com ativação) vence em todos os cenários. Retrieval amplo melhora QA factual de contexto longo mas piora tomada de decisão sequencial ao desviar atenção do contexto crítico para a ação; substratos eficientes em horizontes moderados tornam-se caros ou instáveis em horizontes longos.","pn":"","pm":"","imp":"Ao montar a memória de um agente, você precisa decidir o tipo de tarefa antes de escolher o mecanismo: se o agente só responde perguntas com base em histórico longo, pode usar recuperação ampla (buscar muitos trechos relevantes no índice de memória) sem medo; se o agente toma decisões passo a passo (como executar ações em sequência), reduzir a quantidade de contexto recuperado por vez tende a preservar o foco nas informações realmente necessárias para a próxima ação. Também vale testar o comportamento do mecanismo de memória em horizontes de interação mais longos do que os usados nos testes iniciais, porque o que funciona bem no começo pode ficar lento ou caro depois.","ex":"Um agente de automação de tarefas web que mantém histórico de páginas visitadas e usa recuperação densa agressiva para trazer contexto a cada passo: segundo o padrão observado no paper, esse volume de contexto recuperado desloca a atenção do modelo para detalhes irrelevantes da história e piora a taxa de sucesso nas ações seguintes, comparado a uma versão com recuperação mais seletiva.","res":"Os resultados vêm de um harness com três backbones e quatro suítes específicas de benchmark; a generalização para outros modelos, tarefas ou combinações de substratos não é demonstrada. O paper motiva a necessidade de 'substrate routing' adaptativo mas não fornece o mecanismo de roteamento em si — não há política, heurística ou código de decisão testado, apenas a constatação de que a escolha deveria depender do regime."},{"p":"2608.15089","ach":"StateM eleva a acurácia em Terminal-Bench 2.1 de 83,1% para 92,1% com GPT-5.5 xhigh, atinge 95,3% de acurácia bruta em 445 execuções com GPT-5.6 Sol xhigh e resolve todas as 89 tarefas ao menos uma vez. Com menos de $38 de adaptação, o mesmo runtime e as mesmas regras elevam o DeepSeek-V4 Flash de 82,7% para 88,1-89,1%, reduzindo o custo de execução por corrida final de $574,68 (referência GPT) para cerca de $15.","pn":"Runtime de controle de estado para agentes de longo horizonte","pm":"A execução do agente é organizada em estados duráveis com contexto local à fase, transições verificadas entre elas, e runbooks recuperáveis e versionados que convertem lições de falhas passadas em pré-condições executáveis e inspecionáveis, permitindo que o mesmo esquema de controle seja transferido entre modelos subjacentes distintos sem alteração dos pesos.","imp":"Se você opera agentes que executam tarefas de vários passos (por exemplo, manipulação de terminal ou fluxos de negócio), separar o rastreamento do que já foi feito e do que falta — o 'estado' da tarefa — da lógica interna do modelo permite trocar o modelo subjacente sem reescrever a camada de controle, e permite converter relatórios de falhas passadas (postmortems) em travas automáticas que impedem o agente de repetir o mesmo erro, em vez de confiar que ele vai 'lembrar' isso pelo contexto.","ex":"Em tarefas de Terminal-Bench, agentes falham ao esquecer que já criaram um diretório ou já concluíram um passo e repetem a ação, corrompendo o estado do sistema; ao registrar esse tipo de falha como uma pré-condição executável ('não criar diretório se já existe'), o runbook bloqueia a repetição do erro em execuções futuras, inclusive ao trocar o modelo de GPT-5.5 para GPT-5.6 ou DeepSeek-V4 Flash.","res":"O ganho de regras concretas de runbook só se transfere quando as tarefas compartilham estrutura de execução semelhante: no BusinessBench, famílias de tarefas não correspondentes tiveram ganho marginal (0,55 ponto macro, 1,34 micro), enquanto famílias com estrutura equivalente saltaram 10,04 pontos. Ou seja, o método de controle generaliza, mas as regras específicas escritas para um domínio não devem ser copiadas diretamente para tarefas com estrutura de execução diferente."},{"p":"2608.11341","ach":"O paper descreve um processo de 'problem-scouting' que levantou 561 indústrias em 16 setores e selecionou 423 problemas de alto valor, reduzidos a 20 para o lançamento inicial. Reporta que o sistema superou o estado da arte publicado em 7% em design de capsídeo AAV (viabilidade, tropismo, predição de estrutura, design generativo) e melhorou o escore médio normalizado de predição em 2,5 e 7,6 pontos para dois backbones em reformulação/reposicionamento de fármacos usando um ambiente biomédico específico da tarefa. Ablations controladas com a interface fixa TRACES permitiram atribuir diferenças de desempenho a componentes específicos do solver.","pn":"Rubrica de processo desacoplada do sucesso final sobre interface de episódio fixa","pm":"Uma interface de episódio fixa que padroniza dados, ferramentas, restrições, feedback e registro de trajetória, combinada com critérios de processo avaliados independentemente do sucesso da tarefa final, permite atribuir diferenças de desempenho a componentes específicos de um sistema mesmo quando a investigação de longo horizonte não chega a uma solução completa.","imp":"Se você constrói um agente para tarefas longas e abertas onde o sucesso final é raro ou ambíguo, você pode fixar uma interface de episódio (mesmos dados, ferramentas, restrições e formato de registro de trajetória entre execuções) e avaliar cada execução com critérios de processo — se as ferramentas certas foram usadas, se erros foram corrigidos, se alternativas foram consideradas, se o raciocínio foi coerente, se houve evidência suficiente, se o escopo da resposta foi adequado — independentemente de a tarefa ter sido resolvida. Isso te dá um sinal de diagnóstico (qual parte do pipeline falhou: modelo, harness, ferramenta ou política de controle) mesmo quando não há um veredito claro de sucesso/fracasso no mundo real.","ex":"Na tarefa de reformulação de medicamentos, ao trocar o backbone GPT-5.5 por GPT-5.6-sol dentro do mesmo ambiente biomédico específico da tarefa, o ganho médio normalizado foi de 7,6 pontos contra 2,5 pontos do mesmo par de modelos em modo closed-book sem esse ambiente — a diferença só é atribuível ao ambiente porque a interface de episódio (TRACES) foi mantida fixa entre as duas comparações, isolando a contribuição da estrutura da avaliação da contribuição do modelo em si.","res":"Os ganhos numéricos (7% em capsídeos AAV, os pontos em reformulação de fármacos) dependem de ambientes proprietários e de um conjunto de 423 problemas curados que não são descritos em detalhe operacional no material disponível; a rubrica HDS6 é mencionada por nome (Tools, Repair, Alternatives, Coherence, Evidence, Scope) mas sem os critérios de pontuação necessários para replicá-la fora do harness original. Trate o padrão extraído como um princípio de design de avaliação a ser reimplementado do zero, não como um pacote ou biblioteca pronta para uso — a leitura errada mais provável é assumir que HDS6 ou TRACES são artefatos abertos e reutilizáveis diretamente."},{"p":"2608.11951","ach":"TailBooster combina extração estatística de extremos via intervalo interquartil, que direciona um Variational Autoencoder tabular, com uma segunda camada de autoencoder que descarta registros sintéticos que violam restrições operacionais aprendidas dos dados históricos (por exemplo, tempo de voo curto combinado com distância longa). Em dados de voos dos EUA, treinar seis algoritmos de regressão com esses registros reduziu o erro absoluto médio em 47-49% na previsão de tempo de voo extremo e em 29-57% na previsão de atraso extremo de chegada, comparado a dados sintéticos gerados sem essa filtragem.","pn":"Geração direcionada à cauda com filtragem por envelope de viabilidade","pm":"Um estágio estatístico isola os registros extremos de um conjunto de dados tabulares via intervalo interquartil para concentrar o sinal de treinamento de um modelo generativo dedicado, e uma segunda camada baseada em autoencoder descarta os registros sintéticos gerados que violam o envelope de viabilidade operacional aprendido a partir dos dados históricos.","imp":"Se você depende de dados sintéticos para testar ou ampliar cenários raros de um pipeline de previsão — mesmo fora de aviação —, não basta confiar que o gerador reproduz bem a distribuição estatística: verifique também se cada registro sintético respeita as restrições físicas ou operacionais do domínio (por exemplo, uma combinação de valores que nunca ocorreria na prática), porque um registro estatisticamente parecido com o real pode ainda ser impossível de ocorrer e distorcer a avaliação ou o treino de modelos que consomem esses dados.","ex":"No conjunto de voos dos EUA usado no paper, um gerador convencional (VAE tabular sem filtro) pode produzir um registro sintético com distância de voo longa e tempo de voo curto — combinação fisicamente impossível para uma aeronave real. A camada de autoencoder do TailBooster identifica esse tipo de registro comparando-o ao envelope de valores historicamente observados e o descarta antes que ele entre no conjunto usado para treinar os algoritmos de regressão que preveem atrasos extremos de chegada.","res":"Os ganhos foram medidos só em dados tabulares de voos e modelos de regressão clássicos, não em texto ou LLMs, e a técnica exige treinar dois modelos generativos (VAE e autoencoder de limpeza), algo fora do alcance de quem apenas usa modelos prontos em produção. A afirmação dos autores de que o método 'se estende a domínios onde regras específicas são indisponíveis' não foi testada fora do contexto de aviação, e o padrão passou no teste de portabilidade apenas como princípio geral — não como algo diretamente implementável sem infraestrutura de treino."},{"p":"2608.14881","ach":"O paper argumenta que sistemas atuais de co-cientista de IA (geração de hipóteses, busca de literatura, experimentação, redação) são agnósticos ao pesquisador: dado o mesmo objetivo de pesquisa, pesquisadores diferentes recebem essencialmente a mesma saída, o que os autores chamam de 'one-size-fits-all failure mode'. A partir disso propõem, sem prototipagem nem avaliação, uma estrutura de três componentes para condicionar cada etapa do pipeline de pesquisa a uma representação do pesquisador em grafo, deixando explicitamente 'open problems and challenges' como próximos passos.","pn":"","pm":"","imp":"Se você mantém um agente que gera planos, relatórios ou recomendações de pesquisa/análise para múltiplos usuários a partir do mesmo prompt de objetivo, isso serve como checklist de risco: vale auditar se saídas para perfis distintos (histórico, ferramentas preferidas, domínio de atuação) estão saindo idênticas, porque isso indica que o contexto do usuário está sendo descartado no pipeline. O paper não fornece, porém, uma métrica, um dataset ou um método concreto para medir ou corrigir esse problema — só o diagnóstico.","ex":"O próprio cenário descrito pelos autores: dois pesquisadores com formações diferentes (um especialista em bases de conhecimento em grafo, outro em avaliação empírica de sistemas) submetem o mesmo objetivo de pesquisa a um agente de co-cientista e recebem a mesma lista de hipóteses, o mesmo desenho experimental e a mesma revisão de literatura — apagando o repertório metodológico e o conhecimento tácito de cada um, que é justamente o que os autores apontam como fonte de ideias originais.","res":"Não há implementação, código, benchmark ou medição empírica de que a personalização proposta melhore hipóteses, experimentos ou avaliação; o texto é uma agenda de pesquisa e uma taxonomia de componentes, não uma demonstração. Trate o 'achado' como uma tese normativa sobre o que sistemas deveriam fazer, não como evidência de que o framework funciona ou de como implementá-lo."},{"p":"2608.15242","ach":"Em 1.140 trajetórias falhas de agentes de longo horizonte (mediana de 145 passos, sem erros injetados), a melhor linha de base atinge apenas 13,2% de acurácia exata no passo-causa-raiz. O método RCTA, usando o mesmo backbone, instâncias e protocolo de pontuação, eleva a acurácia de papel-responsável para 51,1% e a de passo-causa-raiz exata para 24,1%.","pn":"Atribuição por resumo de segmento e rastreio de handoff","pm":"A causa raiz de uma falha é localizada recuperando-se candidatos a partir de resumos condensados de segmentos da trajetória e rastreando-os retroativamente até a instrução de transferência (handoff) mais recente entre papéis responsáveis, sem necessidade de treinamento adicional do modelo.","imp":"Se você opera um agente multi-etapas ou multi-subagente em produção e precisa depurar uma execução longa que falhou, pode implementar um pipeline de dois estágios: primeiro gerar resumos curtos de blocos consecutivos de passos da trajetória (em vez de reler o log inteiro), depois usar esses resumos para localizar candidatos a erro e rastrear cada candidato até a última instrução de transferência entre componentes ou papéis do sistema — isso reduz a inspeção manual de centenas de passos, mas ainda exige revisão humana porque a localização exata do passo-causa continua errando na maioria dos casos.","ex":"Um sistema de agente com um planejador que delega subtarefas a um executor de código e depois a um verificador falha após 150 passos porque o verificador aceitou um resultado incorreto do executor; em vez de ler o log completo, um engenheiro roda a atribuição por resumos de segmento, que aponta o segmento do verificador como suspeito e rastreia até a instrução de handoff do planejador que definiu o critério de aceitação frouxo, revelando ali a causa raiz.","res":"A acurácia exata de localização do passo-causa permanece baixa (24,1%), então o método serve como triagem que reduz o espaço de busca, não como veredito confiável sobre qual passo exato causou a falha; a atribuição de papel responsável é comparativamente mais confiável (51,1%) mas ainda está longe de ser definitiva. Os números foram obtidos em cinco domínios específicos com um backbone fixo, e o desempenho pode variar em arquiteturas de agente ou domínios de tarefa diferentes dos avaliados."},{"p":"2608.15304","ach":"O paper define uma taxonomia de três níveis de risco cognitivo — físico, social e autorreferencial — para sistemas agentic baseados em LLM e argumenta, sem experimentos próprios, que a expansão do escopo cognitivo em cada nível amplia riscos à agência, autonomia e capacidade de controle humano. Propõe estratégias de mitigação correspondentes a cada nível, descritas em nível de princípio.","pn":"","pm":"","imp":"Ao decidir quais capacidades dar a um agente que você opera em produção — acesso a ações físicas ou externas, interação social autônoma com pessoas, ou capacidade de alterar seus próprios objetivos ou instruções — você pode usar esses três níveis como checklist de risco: cada nível adicional deveria exigir uma camada extra de supervisão, como aprovação humana antes de ações irreversíveis, limites em decisões que afetam terceiros sem revisão, e bloqueio de qualquer mecanismo que deixe o agente reescrever seus próprios prompts ou metas sem intervenção externa.","ex":"Um agente do tipo AutoGPT, que mantém um loop de planejamento autônomo e pode gerar e substituir suas próprias submetas intermediárias sem checagem humana, ilustra o nível 'autorreferencial' descrito no paper: a falha não é uma ação externa incorreta, mas a deriva do objetivo original para um sub-objetivo criado pelo próprio agente, o que retira do operador o controle sobre o que o sistema está de fato tentando fazer.","res":"O paper não testa a taxonomia em nenhum sistema real, não mede frequência ou severidade desses riscos, e as estratégias de mitigação são descritas em nível de princípio, sem protocolo, métrica ou implementação verificável. A leitura errada mais provável é tratar os três níveis como um checklist já validado empiricamente, quando na verdade é uma proposta de categorização ainda não testada contra casos reais."},{"p":"2608.15888","ach":"A camada de autorização baseada em estado de sessão reduziu a exfiltração de dados no AgentDojo de 75-100% para 0% nos quatro domínios testados e bloqueou todos os 544 casos de roubo de dados do InjecAgent. A vinculação de intenção reduziu ações destrutivas de 38,6% para 4,0% e manipulação de 90,5% para 12,1%, com latência de autorização de 0,24 ms no percentil 99.","pn":"Autorização de sessão com fechamento de composição","pm":"Cada requisição de um agente é avaliada contra o estado acumulado de ações anteriores na sessão, e a decisão de permitir ou bloquear é aplicada por uma camada externa ao modelo, impedindo que ações individualmente permitidas se combinem em um resultado proibido.","imp":"Se seu agente encadeia chamadas de ferramentas ou delega tarefas a subagentes, não confie em checar cada chamada isoladamente: mantenha um registro do que já foi feito na sessão e valide toda nova ação contra esse histórico antes de executá-la, fora do próprio modelo, para impedir que passos individualmente inofensivos se somem em uma ação proibida.","ex":"No AgentDojo, um e-mail malicioso instrui o agente a primeiro ler a caixa de entrada (ação permitida) e depois enviar esses dados para um endereço externo (também permitida isoladamente); sem verificação de histórico, o agente executa ambas e exfiltra os dados, e é exatamente essa combinação que a camada de estado de sessão passou a bloquear, zerando a taxa de sucesso do ataque.","res":"A prova de Composition Soundness só vale sob um conjunto de restrições completo e admissão serializada; em sistemas com admissão concorrente ou listas de restrição incompletas essa garantia não se sustenta. Além disso, a utilidade do agente caiu 8,6 a 13,9 pontos percentuais nos dois cenários avaliados, mostrando que o bloqueio de combinações também rejeita algumas ações legítimas."},{"p":"2608.16002","ach":"RUPA supera métodos de UQ existentes ao ser avaliado em três benchmarks de agentes (τ-2, Terminal-Bench-2, GAIA) com seis LLMs open-source de famílias distintas. Os resultados mostram estimativas de confiança mais precisas, detecção mais precoce de falhas e melhor execução guiada por incerteza em comparação com sinais locais como probabilidade de token ou confiança por passo.","pn":"Propagação de incerteza sobre grafo de dependência de trajetória","pm":"A confiança de uma trajetória de agente é estimada representando estados de raciocínio, chamadas de ferramenta e retornos do ambiente como nós de um grafo direcionado, ligados por arestas de dependência temporal e semântica, sobre o qual o risco de execução é propagado e acumulado ao longo dos passos, em vez de ser inferido apenas por sinais locais independentes em cada passo isolado.","imp":"Se você monitora um agente de longa duração em produção, considere registrar cada etapa (chamada de ferramenta, resposta do ambiente, passo de raciocínio) como um nó conectado às etapas anteriores por relações de dependência, e observar como o risco se acumula ao longo dessa cadeia — em vez de decidir se algo deu errado só olhando a confiança da resposta final ou de cada passo isoladamente. Isso permite interromper ou escalar para revisão humana antes que o erro apareça no resultado.","ex":"Em um agente que opera um terminal (cenário do Terminal-Bench-2), um erro de permissão cometido no terceiro comando não aparece na saída final, mas leva a uma cadeia de comandos incorretos até o décimo passo; um monitor de confiança baseado apenas na resposta final não detectaria a causa raiz, enquanto propagar incerteza pelas dependências entre as chamadas de ferramenta sinalizaria o acúmulo de risco a partir do terceiro passo.","res":"A validação cobre apenas benchmarks controlados com modelos open-source específicos; não há evidência de desempenho em agentes proprietários, volumes de interação maiores ou ambientes de produção reais. O paper também não detalha como construir as arestas semânticas do grafo em código, então o padrão passa apenas parcialmente: a ideia estrutural é transferível, mas a implementação exata exigiria reconstruir escolhas de projeto não especificadas no abstract."},{"p":"2608.16003","ach":"Em traços do ProcessBench verificados por humanos como corretos, com a tarefa de checagem mantida idêntica, um episódio anterior de audit->repair já presente no contexto reduz falsos alarmes em 15 de 15 combinações modelo x formulação, entre 2,8 e 11,5 pontos percentuais (9 a 25% de redução) frente a um controle sem audit de tamanho equivalente. A análise de detecção de sinal mostra que o critério de decisão se move em 15/15 casos (sobrevivendo à correção em 13), enquanto a discriminação (d') não sobrevive em nenhum; uma auditoria manual de 50 falsos alarmes achou 82% genuinamente errados.","pn":"","pm":"","imp":"Se seu pipeline usa o mesmo modelo (ou modelo da mesma família) para verificar uma saída, corrigi-la e depois verificar de novo dentro da mesma conversa, saiba que essa segunda verificação tende a ficar mais permissiva só por ter um episódio de correção anterior no histórico — não porque o novo item ficou mais fácil de julgar. Antes de confiar em taxas de aprovação de um verificador reaproveitado ao longo de várias etapas, teste se resetar o contexto entre chamadas de verificação muda a taxa de aprovação; se mudar, isso indica que parte da leniência observada vem do histórico e não da qualidade real da saída.","ex":"Um pipeline de revisão automática de raciocínio matemático ou de código, onde o modelo A audita a resposta do modelo B, pede correção, e depois reaudita a versão corrigida na mesma janela de contexto: mesmo mantendo erros reais idênticos entre casos, a segunda auditoria aprova mais casos com erro só por já existir no histórico um ciclo de audit->repair, não porque o erro desapareceu.","res":"O efeito é sobre o limiar de decisão, não sobre a capacidade de discriminar certo de errado — a maioria dos falsos alarmes auditados manualmente (82%) eram de fato erros reais sinalizados incorretamente como erro, então nesse ponto operacional específico a leniência não necessariamente piora a qualidade prática. O resultado foi obtido com wordings e modelos específicos testados pelos autores e pode não generalizar para todo tipo de tarefa de verificação ou para pipelines com prompts de sistema muito diferentes."},{"p":"2608.16157","ach":"FreeToken é um sistema de serving para modelos MoE open-weight que remapeia continuamente a computação e o estado do modelo entre CPU e GPU conforme o hardware disponível. Os autores reportam suporte a mais de 20 modelos MoE e agentes reais de codificação/uso de ferramentas, permitindo rodar um modelo de 35B em um laptop com GPU de 8GB, 284B em um desktop com GPU de jogo e 753B (GLM-5.2) em uma única GPU de workstation.","pn":"Offloading adaptativo de experts MoE por hardware disponível","pm":"A alocação de experts e do estado de execução entre CPU e GPU é recalculada continuamente a partir do padrão de uso do agente e dos recursos de hardware realmente disponíveis, em vez de seguir uma estratégia de offloading fixada antes da execução.","imp":"Se você precisa servir modelos open-weight grandes fora de um datacenter, esse tipo de sistema permite usar a máquina que você já tem (CPU, RAM e uma única GPU de consumo) como plataforma de inferência, sem precisar escrever manualmente uma estratégia de offloading fixa para cada configuração de hardware ou reduzir o modelo para caber na VRAM disponível.","ex":"Um desenvolvedor com uma GPU de laptop de 8GB conseguindo rodar um coding agent baseado em um modelo de 35B parâmetros localmente, ou uma workstation com uma única GPU servindo o GLM-5.2 de 753B para tarefas de uso de ferramentas — cenários explicitamente citados pelos autores como capacidade nova habilitada pelo sistema.","res":"Os números de escala (35B a 753B) foram medidos nas configurações de hardware e nos workloads de agente escolhidos pelos autores; desempenho e limites de memória podem variar em padrões de uso diferentes dos testados (coding e tool-use agents) ou em arquiteturas MoE com distribuição de experts distinta. A disponibilização em flashml.ai não garante, por si só, que a licença e o código sejam abertos e auditáveis no sentido usado por infraestrutura de produção — isso precisa ser verificado antes de adoção."},{"p":"2608.16391","ach":"O paper mede fidelity loss médio (AFL) e extremo (EFL) em sete snapshots de rotas hospedadas de modelos open-weight, usando sondas de sequência longa com 20 execuções cada. AFL concorda linearmente com uma medida baseada em log-probabilidades quando disponível, mas tem pouca associação detectável com a acurácia em GPQA-Diamond. Em contraste, EFL elevado coincide com queda na taxa de acerto do Terminal-Bench conforme a exposição à tarefa aumenta.","pn":"Auditoria de fidelidade por sondagem black-box repetida","pm":"Enviar repetidamente o mesmo contexto congelado a uma API de inferência hospedada permite reconstruir a distribuição categórica de saída a partir de contagens de texto e detectar divergência estatística sem acesso a probabilidades internas, e métricas de cauda extrema captam degradação em tarefas de longo horizonte que métricas médias não detectam.'","imp":"Se você contrata uma API de terceiros para servir um modelo open-weight, pode rodar auditorias com o mesmo prompt congelado repetido várias vezes para detectar se o provedor está trocando silenciosamente o modelo, quantizando ou degradando a rota — e deve acompanhar picos extremos de divergência entre as respostas (não apenas a média), porque são esses picos que antecipam falhas em tarefas que exigem muitos passos seguidos, como fluxos de agente em terminal.","ex":"Em testes com Terminal-Bench (tarefas agenticas de terminal com múltiplos passos), rotas hospedadas com EFL alto mostraram queda progressiva na taxa de acerto conforme a tarefa exigia mais passos consecutivos, enquanto no GPQA-Diamond (perguntas de escolha única, sem acúmulo de passos) essa relação não apareceu — indicando que a degradação de fidelidade se acumula e só se manifesta em tarefas longas.","res":"A relação entre EFL e queda no Terminal-Bench é correlacional, observada em apenas sete snapshots de rota, sem mecanismo causal estabelecido; a ausência de associação com GPQA-Diamond pode refletir que benchmarks de resposta única não expõem esse tipo de degradação, e não que ela seja rara. O método também exige múltiplas requisições repetidas ao mesmo prompt, o que tem custo de API e pode ficar menos eficaz se o provedor souber que está sendo auditado dessa forma."},{"p":"2608.16393","ach":"O estudo executou 14.560 execuções controladas de injeção indireta contra o DeepSeek Harness, cobrindo 16 canais de conteúdo indireto, dois modos de carga (texto e arquivo), 35 objetivos de payload e 12 métodos de ataque. As maiores taxas de sucesso observadas foram 17,0% para ataque de falsa-conclusão em modo texto, 25,5% para unicode oculto em modo arquivo e 16,0% para o canal de skills em modo arquivo, sob o juiz semântico LLMJudge; o juiz baseado em regras também registrou sucesso, embora atribuindo conformidade parcial com menor frequência (2,0% contra 7,3%).","pn":"Injeção indireta sem controle entre conteúdo não confiável e ação sensível","pm":"Conteúdo entregue por canais indiretos — arquivos, unicode oculto, resultados de ferramentas, canais de skills — é processado pelo loop do agente como instrução legítima quando não existem políticas de verificação entre a ingestão desse conteúdo e a execução de ações sensíveis, produzindo taxas de sucesso de ataque mensuráveis mesmo sob julgamento semântico e baseado em regras.","imp":"Se seu agente lê arquivos, recebe resultados de ferramentas ou processa canais de skills como entrada, você precisa colocar uma verificação entre esse conteúdo externo e qualquer ação que o agente de fato execute, porque texto escondido dentro de um arquivo ou embutido em Unicode invisível pode ser interpretado pelo agente como um comando válido e disparar uma ação sem que ninguém tenha digitado esse comando.","ex":"No teste com o DeepSeek Harness, um arquivo carregava caracteres Unicode invisíveis contendo uma instrução; em 25,5% das execuções em modo arquivo o agente seguiu essa instrução oculta como se fosse um comando legítimo do usuário, sem qualquer alteração visível no conteúdo apresentado a quem revisasse o arquivo.","res":"As taxas foram medidas especificamente contra o agent loop, o tool registry e o model adapter do DeepSeek Harness, com sinks sensíveis simulados como fixtures locais sem efeitos externos reais; outro agente com arquitetura de ferramentas diferente pode apresentar taxas distintas. Além disso, o próprio paper mostra que a métrica de 'sucesso do ataque' varia conforme o juiz usado — o LLMJudge marca mais conformidade parcial que o RuleJudge — o que significa que o número de 25,5% não é uma constante fixa da vulnerabilidade, mas depende também de como o julgamento foi definido."},{"p":"2608.16425","ach":"ParaTempo reduz latência média em 21,8-32,2% e uso total de tokens em 18,1-30,3% em benchmarks desafiadores de raciocínio matemático e científico, mantendo acurácia competitiva, ao usar confiança temporal — uma medida de quão fortemente as respostas tentativas recentes de uma trajetória convergem para uma resposta dominante — como sinal único para poda, retirada antecipada, realocação e parada global das trajetórias paralelas.","pn":"Confiança temporal para controle de branches paralelas de raciocínio","pm":"Um sinal de confiança é derivado da estabilidade, ao longo de sucessivas amostragens periódicas, da distribuição de respostas tentativas emitida por cada trajetória de raciocínio paralela, e esse sinal único é usado para decidir poda, retirada antecipada, realocação de computação para novas trajetórias e parada global, sem exigir sincronização entre as trajetórias.","imp":"Se você roda várias cadeias de raciocínio em paralelo para depois votar na resposta majoritária, pode parar de esperar todas terminarem: amostre periodicamente uma resposta tentativa de cada cadeia, veja se essa resposta parou de mudar nas últimas amostras, e corte cedo as cadeias que já estabilizaram ou que estão fracas, reaproveitando o orçamento de tokens liberado em novas cadeias — isso corta gasto de tokens e tempo de resposta sem sacrificar a taxa de acerto final.","ex":"Um pipeline que gera 16 cadeias de raciocínio para um problema de matemática e vota na resposta mais frequente ao final costuma gastar tokens completos em cadeias que já convergiram para a resposta errada muitas etapas antes do término; monitorar a resposta tentativa a cada poucos tokens permite abortar essas cadeias com antecedência, falha que sinais de confiança baseados só na probabilidade instantânea do próximo token não conseguem detectar por serem ruidosos e desconectados do progresso real do raciocínio.","res":"A técnica exige capacidade de pausar a geração e extrair uma resposta tentativa de cada trajetória em intervalos regulares, o que só é viável com controle de geração passo a passo (streaming ou reamostragem), não com chamadas de API que retornam apenas a resposta final completa; além disso, os ganhos foram medidos em tarefas de matemática e ciência com respostas curtas e verificáveis, cenário onde existe uma 'resposta dominante' bem definida para medir convergência — em tarefas abertas, sem esse critério de convergência, o mecanismo de parada pode não se aplicar da mesma forma."},{"p":"2608.17271","ach":"ASI-Bench testa 18 configurações de agente-modelo em 60 tarefas de pesquisa de nível de projeto, reduzindo progressivamente a orientação metodológica fornecida. A pontuação média cai de 50,91 com orientação completa para 29,10 quando só o método é especificado e 26,62 quando o agente deve escolher o método por conta própria. A queda é consistente entre domínios e configurações testadas.","pn":"Retirada progressiva de orientação metodológica dentro do mesmo projeto","pm":"A avaliação reduz gradualmente a orientação metodológica fornecida a um sistema dentro da mesma tarefa de pesquisa, isolando o quanto o desempenho observado depende de instruções humanas em vez de capacidade autônoma real.","imp":"Se você avalia agentes de IA para tarefas abertas em produção, não confie em benchmarks que fornecem passos detalhados do que fazer: teste o mesmo agente na mesma tarefa retirando gradualmente as instruções que você normalmente dá, para descobrir em que ponto o desempenho desmorona e se o que parecia 'autonomia' era na verdade execução guiada.","ex":"Um agente de análise de dados que atinge alta acurácia quando recebe o pipeline passo a passo (quais colunas comparar, qual teste estatístico aplicar) mas tem desempenho quase pela metade quando recebe apenas o objetivo geral da análise, revela que a métrica de sucesso divulgada superestima a capacidade de decisão autônoma do sistema.","res":"O benchmark mede pesquisa científica de projeto completo, validada por especialistas e execução em sandbox — um cenário distante de tarefas típicas de produção e caro de reproduzir integralmente. A queda de desempenho documentada não prova incapacidade geral de agentes em tarefas menos abertas ou mais curtas, e a técnica de retirada progressiva de guidance só foi validada nesse domínio científico específico, não em fluxos de trabalho comerciais comuns."},{"p":"2608.17336","ach":"TileMix particiona a matriz de atenção em blocos alinhados a hardware e roteia cada grupo de blocos para computação em FP16 ou INT8, mantendo um estado de softmax online compartilhado entre os dois caminhos de precisão. Em LongEval, LV-Eval e benchmarks de prefill em A100, com LLaMA, Qwen e Vicuna, a técnica recupera a qualidade de contexto longo perdida sob INT8 uniforme e melhora o throughput de prefill em relação a FP16 puro.","pn":"Roteamento de precisão por blocos (tiles) em atenção densa","pm":"A matriz de atenção é particionada em blocos alinhados ao hardware, e cada grupo de blocos é roteado para computação em FP16 ou INT8 conforme uma decisão espacial compacta, com ambos os caminhos atualizando um mesmo estado de softmax online.","imp":"Se você opera um serviço de inferência com contexto longo e já usa cache key/value em INT8 para economizar memória, mas percebe queda de qualidade nessas tarefas, pode substituir o kernel de atenção denso por um que roteia blocos entre FP16 e INT8, recuperando parte da qualidade perdida sem voltar a rodar tudo em FP16 e sem precisar retreinar o modelo.","ex":"Um serviço rodando LLaMA ou Qwen com prefill de contexto longo (o processamento inicial do prompt inteiro antes de gerar tokens) e cache KV quantizado em INT8 para caber em memória de GPU — nos testes do paper, esse tipo de configuração perde qualidade em avaliações como LongEval, e o roteamento por blocos reduz essa perda sem descartar a economia de memória do INT8.","res":"Os ganhos foram medidos especificamente em GPUs A100 com um kernel customizado para essa arquitetura; adotar a técnica exige integração de engenharia em nível de kernel, não é uma troca de flag de configuração. Resultados em outras GPUs, outros esquemas de atenção esparsa ou contextos muito mais longos que os testados não estão garantidos pelo que o paper mostra."},{"p":"2608.17379","ach":"PTXBench avalia LLMs na geração de PTX específico de arquitetura para kernels GEMM e attention em H100 e B200, medindo correção funcional, execução real das instruções-alvo e speedup contra bibliotecas frontier. Nenhum modelo testado bate consistentemente as bibliotecas frontier, o sucesso cai bastante em workloads de attention backward, e executar a instrução-alvo não implica speedup competitivo. Fine-tuning supervisionado com treinamento condicionado a reparo melhora algumas tarefas, mas a generalização permanece desigual e depende de cobertura de dados, balanceamento e qualidade do professor de raciocínio.","pn":"Dissociação entre uso da instrução-alvo e ganho de performance","pm":"Medir separadamente a correção funcional, a execução real de instruções específicas de arquitetura em runtime e o speedup resultante revela que essas três dimensões podem se dissociar: um sistema pode executar a instrução correta sem alcançar desempenho competitivo, de modo que verificar o uso da instrução não é um proxy confiável de ganho real.","imp":"Se você avalia ou seleciona um modelo para gerar ou otimizar código de baixo nível (kernels, compiladores, assembly específico de arquitetura), não trate 'o modelo usou a instrução certa' como sinal suficiente de qualidade - meça o ganho de desempenho real, porque um modelo pode acertar a instrução e ainda entregar performance inferior à esperada.","ex":"Em kernels de attention backward em GPUs B200, modelos que efetivamente executaram a instrução PTX-alvo especificada ainda ficaram atrás das bibliotecas frontier em velocidade, o que mostra que checar apenas 'a instrução X foi usada' teria dado um falso sinal de sucesso nesse workload.","res":"O benchmark é restrito a PTX em GPUs H100/B200 para GEMM e attention; a dissociação entre uso de instrução e performance foi demonstrada nesse domínio específico e não está testada para geração de código em linguagens de alto nível ou outros aceleradores. O experimento de fine-tuning usa um único modelo (Qwen3.6-27B) e mostra generalização desigual, então a parte de adaptação via treino não constitui um método pronto e replicável, apenas uma exploração parcial."},{"p":"2608.17597","ach":"Em três harnesses de agentes e seis modelos de linguagem, testados em 14 configurações, a taxa de sucesso de ataque variou de 12,6% a 80,9%, enquanto a utilidade das tarefas permaneceu entre 75,0% e 97,6%. A fase de Configuração do Harness foi a mais vulnerável em todas as combinações testadas, e algumas configurações detectaram o risco em mais de 90% das execuções mas ainda assim mantiveram sucesso de ataque substancial.","pn":"Desacoplamento entre detecção de risco e contenção de ação em agentes com harness","pm":"Em sistemas onde um agente opera através de um harness com ferramentas, permissões e estado persistente, o mecanismo que reconhece uma instrução como arriscada pode estar desacoplado do mecanismo que decide executar ou bloquear a ação, de modo que a detecção explícita do risco não impede, por si só, que a ação arriscada seja realizada.","imp":"Se você opera um agente com acesso a ferramentas, permissões ou estado persistente, não assuma que uma camada de detecção de instruções arriscadas equivale a bloqueio: verifique separadamente se uma ação sinalizada como arriscada é de fato impedida antes de ser executada, e concentre a revisão de segurança nos parâmetros de configuração do harness (escopos de permissão, chaves de acesso, opções de extensão), não só no conteúdo das instruções recebidas pelo usuário.","ex":"Um agente que lê um artefato de workflow não confiável — por exemplo, um arquivo de configuração de pipeline ou uma issue de repositório — contém uma instrução adversarial embutida que altera um parâmetro de permissão sensível durante uma tarefa aparentemente autorizada; o sistema registra a tentativa como arriscada em mais de 90% dos casos mas executa a alteração de configuração de qualquer forma, deixando o comportamento malicioso persistir em execuções futuras.","res":"Os intervalos de taxa de sucesso de ataque (12,6% a 80,9%) foram medidos em cenários sandboxed construídos pelos autores, com três harnesses e seis modelos específicos, e não se transferem numericamente para outras combinações de harness e modelo não testadas. O achado sobre desacoplamento entre detecção e contenção é qualitativo: o paper mostra que ele ocorre, mas não isola se a causa está no desenho do harness, no modelo subjacente, ou na interação entre os dois, o que limita a generalização da causa raiz."},{"p":"2608.17800","ach":"StartupBench avalia agentes de ponta a ponta em workflows reais extraídos de produtos de startups de IA com adoção comprovada no mercado, usando rubricas granulares por tarefa. Mesmo o modelo mais forte completa apenas cerca de 30% das tarefas, apesar de progresso parcial substancial em muitas delas. Os autores identificam seguimento de instruções complexas e falta de expertise de domínio como as principais fontes de falha.","pn":"Benchmark derivado de workflows de produtos com adoção validada no mercado","pm":"As tarefas de avaliação são extraídas de workflows reais de produtos de IA que já possuem adoção comprovada por usuários, em vez de serem definidas a partir de suposições de pesquisadores sobre quais capacidades de agentes seriam úteis.","imp":"Se você está avaliando se um agente pode substituir um workflow de negócio inteiro (por exemplo, gerar um relatório de due diligence ou executar um pipeline de atendimento completo), não confie em benchmarks de tarefas isoladas para prever esse desempenho: teste o agente contra o entregável completo, com todas as sub-instruções e exigências específicas do domínio, porque é exatamente aí que a taxa de acerto despenca mesmo em modelos considerados fortes.","ex":"Um agente encarregado de replicar o workflow de um produto de automação de due diligence financeira falha em entregar o relatório completo porque ignora parte das sub-instruções da tarefa e não aplica corretamente conhecimento específico do domínio financeiro exigido para validar os números apresentados.","res":"O conjunto de workflows chamados de 'market-validated' foi selecionado e traduzido em tarefas pelos próprios autores, o que limita a generalização para domínios de negócio não cobertos pelo benchmark. Além disso, o paper expõe a lacuna de desempenho mas não propõe nenhuma técnica, arquitetura ou método para reduzi-la — quem busca uma solução prática para os problemas de seguimento de instrução ou expertise de domínio não encontra isso aqui."},{"p":"2608.18115","ach":"Um BiGRU sobre um stream de 33 features (estatísticas textuais, entailment via NLI, surprisal do modelo de linguagem) atinge AUC 0.840 em RAGTruth (10 seeds), 11 pontos acima de uma baseline de regressão logística (p=0.002, Wilcoxon). Uma decomposição controlada mostra que o ganho vem da ordem temporal, não da capacidade do modelo: BiGRU, Mamba e um modelo com atenção convergem no mesmo teto de 0.845 AUC. O detector perde menos de 4% de AUC quando aplicado a texto gerado por modelos que nunca viu em treino.","pn":"","pm":"","imp":"Se você mantém um detector de alucinação em produção que pontua cada token isoladamente, ele vai falhar justamente quando o modelo gerador estiver confiante e errado — porque não há mecanismo para propagar evidência de tokens vizinhos confiáveis para os ambíguos. Trocar para um classificador sequencial (mesmo simples) sobre um conjunto de sinais externos — sem precisar de acesso a logits ou pesos internos — resolve isso, e funciona igual em modelos fechados via API. Além disso, não vale investir em trocar a arquitetura do classificador esperando ganho: o teto está no conjunto de features, então o esforço de engenharia deve ir para adicionar/melhorar sinais (NLI, surprisal, estatísticas), não para testar arquiteturas mais sofisticadas.","ex":"Um pipeline RAG que troca o modelo gerador de GPT-3.5 para Claude ou GPT-4 sem retreinar o detector de alucinação: um classificador token-a-token treinado nos outputs do GPT-3.5 tende a degradar porque o padrão de confiança do novo modelo é diferente token a token; o detector sequencial fusionado mantém a performance com perda menor que 4% de AUC porque ainda consegue propagar evidência de spans vizinhos, independente de qual modelo gerou o texto.","res":"O ganho está limitado a um teto de 0.845 AUC que se repete em três famílias de arquitetura diferentes — isso significa que a solução para melhorar detecção não está em buscar arquiteturas temporais mais sofisticadas, e sim em melhorar o conjunto de 33 features, algo que o paper não resolve. A validação de generalização cruzada foi feita dentro do mesmo tipo de tarefa (alucinação em RAG via RAGTruth); não há evidência de que o mesmo ganho se sustente em geração aberta sem contexto de recuperação ou em domínios muito distintos do testado."},{"p":"2608.18423","ach":"FM-Bench mede agentes de LLM gerenciando um clube de futebol por 20 anos simulados, com 26 ferramentas e 340 a 400 decisões, pontuados por um motor determinístico sem juiz humano ou de IA. Todos os 15 modelos completam o horizonte enquanto baselines cegas morrem na maioria dos casos; a ordem final não é prevista por escala, preço ou fornecedor e só se estabiliza tarde no horizonte. Nenhum modelo aprende os preços ocultos do mercado após centenas de propostas rejeitadas, e a memória autogerida falha de duas formas opostas: um arquivo que só cresce ou um plano reescrito toda temporada.","pn":"Avaliação de longo horizonte com ancora roteirizada determinística","pm":"Um ambiente determinístico acumula centenas de decisões interdependentes ao longo de um horizonte longo, comparando agentes de linguagem entre si e contra um oponente roteirizado fixo, e pontua apenas o resultado final acumulado sem avaliação por juiz humano ou por outro modelo, isolando comportamento decisório sustentado de desempenho em tarefas curtas isoladas.","imp":"Se você avalia agentes para tarefas com muitas decisões encadeadas ao longo do tempo, não confie no tamanho, preço ou fornecedor do modelo para prever quem vai sustentar boas decisões: teste explicitamente comportamentos como gestão de caixa ao longo do tempo, timing de renovação de compromissos e capacidade de manter memória útil sem ela virar um arquivo inútil, porque foi isso, e não o gasto de tokens, que separou os modelos no experimento.","ex":"No benchmark, os modelos com pontuação mais alta reduzem investimentos de retorno lento perto do fim do horizonte simulado, mantêm caixa investido em vez de ocioso e abrem renovações de contrato bem antes do prazo; claude-fable-5 lidera o placar solo e a Arena, mas o título rotaciona entre dez modelos diferentes na Arena, mostrando que nenhum fornecedor domina de forma estável ao longo de 20 anos simulados.","res":"O ambiente é uma simulação de gestão de futebol com regras e ferramentas fixas definidas pelos autores; o desempenho relativo dos modelos nesse domínio específico não garante que as mesmas capacidades comportamentais se generalizem para agentes em produção fora desse jogo simulado, e a comparação usa apenas três seeds e 15 modelos, o que limita a robustez estatística das conclusões sobre a ordem entre fornecedores."},{"p":"2608.18565","ach":"Em 117 tarefas independentes, o harness atinge 72.6% de taxa de aprovação verificada estrita, a maior entre sete modelos testados. Em 65 tarefas de contexto de projeto real, todos os métodos ficam dentro de 10 pontos uns dos outros em métricas estáticas, mas nas métricas dinâmicas (comparação de traces executados em runtime ao vivo) os baselines variam de 22.4 a 31.4 contra 52.2 do harness proposto.","pn":"Gate de conclusão por verificação externa multi-camada","pm":"Uma tarefa de geração de código é declarada completa apenas quando checagens externas logadas confirmam a especificação, a compilação integrada e o comportamento observado em um runtime ao vivo, em vez de o próprio modelo julgar seu output como adequado.","imp":"Se você monta um agente para gerar código que precisa funcionar dentro de um sistema real (não só passar em testes sintáticos ou de compilação), não confie em métricas estáticas nem no julgamento do próprio modelo sobre quando a tarefa está pronta: insira um passo obrigatório de execução real do código gerado e compare o comportamento resultante contra uma referência antes de aceitar o resultado.","ex":"Lógica de controlador industrial (PLC) gerada por um modelo compila sem erros e passa checagens de especificação, mas ao ser executada no runtime real produz uma sequência de saídas diferente da lógica de referência — falha que as métricas estáticas não capturam, mas a comparação de traces de execução revela.","res":"O benchmark e os ganhos reportados são específicos ao domínio de PLCs, onde existe um runtime determinístico e uma referência clara de comportamento para comparar traces. Não há demonstração de que o mesmo gate de verificação dinâmica se transfira facilmente para domínios de software geral, onde 'comportamento correto' costuma ser mais difícil de definir e comparar por trace."},{"p":"2608.18933","ach":"SkillForge sintetiza issues específicas de um repositório reimplementando funcionalidades já cobertas por testes, resolve essas issues e destila conhecimento reutilizável em 'skills' associadas a entidades do repositório. Experimentos com modelos abertos e fechados mostram melhoria consistente na resolução de issues reais sobre baselines fortes, medida em benchmarks de resolução automática de issues.","pn":"Destilação proativa de skills ancoradas a entidades de código","pm":"Um agente gera issues sintéticas reimplementando funcionalidades já cobertas por testes do repositório, resolve essas issues e extrai conhecimento reutilizável associado a entidades específicas do código, que é recuperado posteriormente para orientar a resolução de issues reais relacionadas às mesmas entidades.","imp":"Antes de colocar um agente de código para atender issues reais em um repositório específico, é possível gerar issues artificiais a partir do próprio código — pedindo para reimplementar funções que já têm testes — deixar o agente resolvê-las, e guardar as lições associadas ao arquivo ou função envolvida; quando um issue real tocar essa mesma parte do código, essas lições são recuperadas automaticamente para dar contexto específico do projeto ao agente.","ex":"Um agente tentando corrigir um bug numa função de parsing de datas de um repositório Python falha por não conhecer uma convenção interna (ex.: datas sempre em UTC sem timezone explícito). Em vez de esperar esse bug real, o sistema gera antes uma issue sintética do tipo 'reimplemente parse_date', usa o próprio teste existente para validar a solução, e grava a lição 'esta função assume UTC-naive por convenção' associada à entidade parse_date — lição que é recuperada quando o bug real de timezone aparece.","res":"O ganho foi medido em benchmarks de resolução de issues sobre repositórios com boa cobertura de testes; a técnica depende de existirem funcionalidades bem testadas para servir de fonte de issues sintéticas, então repositórios com cobertura de teste fraca ou nula podem não se beneficiar da mesma forma. Há também um custo upfront de gerar e resolver issues sintéticas antes de qualquer ganho em issues reais, que precisa ser amortizado ao longo de múltiplos usos do agente no mesmo repositório."},{"p":"2608.19741","ach":"Em 507 workflows de negócio com estado (varejo, hotelaria, seguro auto, TI interna de neobank, suporte de TI/RH), o modelo mais forte atinge 65,36% de pass@1 mas apenas 25,25% de pass^20. Muitos episódios falhos apresentam terminação limpa e ações de mudança de estado aparentemente válidas, apesar de o estado final do backend estar incorreto.","pn":"Lacuna entre sucesso ocasional e confiabilidade repetida em tarefas stateful","pm":"Avaliação de agentes por verificação executável do estado terminal do sistema, em vez de sinais de resposta ou de chamada de ferramenta, revela que uma execução bem-sucedida isolada não implica repetibilidade, pois trajetórias podem terminar de forma limpa e com ações aparentemente válidas mesmo quando o efeito final no estado persistente está incorreto.","imp":"Ao avaliar um agente que já está em produção ou perto disso, meça a taxa de sucesso em várias repetições da mesma tarefa (não apenas uma tentativa) e verifique o resultado final no sistema de backend — por exemplo, se o registro do pedido, do cartão ou da apólice realmente mudou como esperado — em vez de confiar apenas em a conversa ter terminado bem ou a chamada de ferramenta ter sido aceita sem erro.","ex":"Um agente de atendimento de um neobank recebe um pedido de bloqueio de cartão, conduz a conversa de forma educada, executa uma chamada de API que o sistema aceita sem erro e termina o atendimento normalmente; mesmo assim, o registro final do cartão no backend continua marcado como ativo, porque o efeito colateral correto da ação não foi realizado — uma falha que passaria despercebida se a avaliação olhasse só para a resposta ou para a validade da chamada de ferramenta.","res":"O achado vale especificamente para tarefas que alteram estado persistente e são avaliadas por checagem executável desse estado; não se aplica diretamente a tarefas de resposta única sem efeito de sistema. Os números de pass@1 e pass^20 são específicos dos cenários simulados no sandbox liberado pelos autores e dependem de reproduzir o desenho de verificação de estado terminal; sem esse desenho, a técnica de medir 'sucesso repetido' perde a base de comparação apresentada no paper."},{"p":"2608.19758","ach":"O paper mostra que um termo de correção de média reduz a degradação de qualidade da atenção esparsa mesmo em esparsidade extrema, e que o operador reprojetado, combinado com FP8, atinge speedups de até 47.26x sobre FlashAttention-2 e 30.49x sobre um baseline denso alinhado a FlashAttention-3/4, medidos em GPUs H20 com contexto de até 128K tokens.","pn":"Correção de média em atenção esparsa aproximada","pm":"Um termo de correção de média compensa o erro sistemático introduzido por thresholding dinâmico em atenção esparsa, permitindo manter a qualidade do modelo mesmo em níveis extremos de esparsidade.","imp":"Se você serve modelos com contextos muito longos (dezenas de milhares de tokens ou mais) e usa um framework como SGLang, vale investigar se esse backend de atenção esparsa com FP8 está disponível para a fase de prefill, já que ele promete reduzir bastante o tempo de GPU consumido nessa etapa antes de gerar a primeira resposta — mas é preciso testar em seus próprios dados se a perda de qualidade sob alta esparsidade é aceitável para seu caso.","ex":"Um serviço que recebe documentos de 128K tokens para resumir ou responder perguntas gasta a maior parte do tempo de GPU na fase de prefill, antes de gerar qualquer token de saída; troca da atenção densa por esse operador esparso com correção de média e FP8 reduziu esse tempo de forma acentuada nos testes em GPUs H20 relatados no paper.","res":"Os speedups foram medidos especificamente em GPUs H20 e dependem de alinhamento com kernels FlashAttention-3/4 e integração com paged KV cache e continuous batching do SGLang; não há evidência de que a técnica de correção de média generalize para outros mecanismos de esparsificação, outro hardware, ou frameworks de serving diferentes, e a queda de qualidade sob esparsidade extrema é descrita como 'gerenciável' sem métrica independente de benchmark próprio dos autores."},{"p":"2608.19799","ach":"O benchmark testa 119 tarefas de reparo em 98 repositórios científicos de 20 domínios; o melhor agente avaliado (Claude Code com Opus-5 max) atinge pass@1 abaixo de 50%. Uma ablação pareada que remove a orientação científica explícita, preservando o resto do contexto, mostra que essa orientação nem sempre ajuda: quando bem alinhada, melhora eficiência de tokens e taxa média de sucesso; quando mal alinhada, induz ancoragem e não melhora o sucesso exato do reparo.","pn":"Benchmark de reparo de software científico com ablação de orientação de domínio","pm":"Agentes de codificação recebem contexto de domínio explícito que é removido em uma ablação pareada; quando esse contexto está bem alinhado ao problema, ele reduz exploração e melhora a eficiência de tokens e a taxa média de sucesso, mas quando mal alinhado induz ancoragem em hipóteses incorretas e não garante melhora no sucesso exato do reparo.","imp":"Se você usa agentes de codificação para tarefas que exigem conhecimento especializado (não apenas científico), não assuma que adicionar explicações de domínio ao prompt sempre melhora o resultado: teste separadamente o efeito de incluir ou remover esse contexto, porque uma explicação mal alinhada com a causa real do problema pode fazer o agente fixar a busca numa hipótese errada e produzir uma correção que parece plausível mas não resolve o bug.","ex":"Em tarefas de correção de bugs em repositórios de simulação científica, como pipelines de processamento de dados astronômicos, fornecer ao agente uma explicação do fenômeno físico subjacente por vezes leva a um patch que ajusta valores ou fórmulas de forma consistente com a explicação dada, mas não corrige a causa raiz do bug no código, porque o agente ancorou a exploração na hipótese fornecida em vez de investigar o comportamento real do sistema.","res":"O benchmark cobre apenas 20 domínios científicos e 98 repositórios, e o efeito de ancoragem por orientação mal alinhada foi observado nesse contexto específico; não há garantia de que o mesmo padrão se replique em tarefas de engenharia de software fora do domínio científico ou com outros modelos. O paper não oferece um critério prévio para saber, antes de testar, se uma dada orientação de domínio vai ajudar ou prejudicar — a decisão de incluí-la ainda depende de experimentação caso a caso."},{"p":"2608.19861","ach":"PolicyGuide eleva o Pass^4 médio de 0.42 para 0.62 nos domínios airline, retail e telecom do τ²-bench com agente e verificador GPT-5.4, com o maior ganho em telecom (0.19 para 0.61, o domínio mais estruturado em workflow). Os mesmos workflows compilados transferem para agentes Claude Sonnet 4.6 e Gemini 2.5 Pro. O sistema também apresenta a menor taxa de sucesso de ataque observada sob usuários adversariais e a maior conformidade procedural em uma validação de nível de workflow desenhada pelos autores.","pn":"Verificação de política via grafo de workflow em fronteiras de turno","pm":"A política do domínio é compilada em um grafo de workflow com estado persistido entre turnos, e um verificador é invocado nas fronteiras de turno do usuário para reconciliar pedidos abertos e indicar o próximo passo compatível com a política, em vez de checar cada ação isoladamente no momento em que ocorre.","imp":"Se seu agente precisa seguir um procedimento de várias etapas antes de executar uma ação sensível (por exemplo, confirmar identidade antes de trocar um plano, ou validar elegibilidade antes de aplicar um reembolso), não dependa apenas de uma checagem feita no momento da ação: ela não sabe o que já aconteceu em turnos anteriores. Em vez disso, modele o procedimento como uma sequência de etapas com estado que persiste entre turnos, e faça a verificação acontecer a cada resposta do usuário, comparando o que falta com o que já foi cumprido antes de deixar a próxima ação passar.","ex":"Em um domínio de telecom, um agente pode aplicar um desconto corretamente do ponto de vista da ação isolada, mas ter pulado uma etapa anterior de confirmação de identidade em um turno anterior; um verificador que só olha a ação de aplicar desconto não percebe essa omissão porque não tem acesso ao histórico do procedimento. Foi exatamente nesse tipo de domínio, mais dependente de sequência de etapas, que o ganho de conformidade foi maior (de 0.19 para 0.61).","res":"Os resultados vêm de um benchmark controlado (τ²-bench) com agentes simulados, não de tráfego real de produção, e o ganho maior em telecom sugere que o benefício é proporcional ao quanto a política do domínio pode ser formalizada como um workflow bem definido — em políticas ambíguas, com muitas exceções ou pouco sequenciais, a compilação em grafo pode ser difícil ou o ganho menor do que o observado aqui."},{"p":"2608.20169","ach":"O paper mostra que amostrar tarefas de validação com peso proporcional à variância dos resultados entre candidatos, e depois estimar o desempenho no conjunto completo por ponderação inversa da probabilidade de amostragem, reduz o número de avaliações necessárias durante a otimização de harness em 80%. O desempenho final obtido iguala o da busca que avalia o conjunto completo a cada iteração, testado em classificação de texto online e em Terminal-Bench 2.1.","pn":"Amostragem ponderada por variância com estimação por probabilidade inversa","pm":"A cada iteração de otimização, as tarefas de validação são amostradas com probabilidade proporcional à variância dos resultados passados entre candidatos concorrentes, concentrando a avaliação nas tarefas onde os candidatos ainda discordam (próximas à fronteira de capacidade), e o desempenho no conjunto completo é reconstruído a partir da amostra ponderando cada resultado pelo inverso de sua probabilidade de seleção, o que permite comparar pontuações entre iterações mesmo quando subconjuntos diferentes de tarefas foram avaliados.","imp":"Se você itera sobre versões de um prompt ou harness de agente e reavalia cada versão contra um conjunto de tarefas de teste caro (por exemplo, cada tarefa exige rodar comandos reais ou várias chamadas de API), pare de rodar o conjunto inteiro a cada rodada: registre em quais tarefas as versões anteriores do seu harness discordaram entre si, dê mais chance de essas tarefas serem sorteadas na próxima avaliação, e ao calcular a pontuação da rodada divida o resultado de cada tarefa sorteada pela probabilidade que ela tinha de ser sorteada — isso permite comparar rodadas que usaram conjuntos de tarefas diferentes sem inflar ou distorcer o placar.","ex":"No Terminal-Bench 2.1, um harness de agente de terminal é reescrito repetidamente e testado contra um conjunto de tarefas que exigem executar comandos reais; avaliar todas as tarefas a cada nova versão do harness consome tempo de execução e chamadas de modelo. Task-CoEvolve evita isso concentrando a reavaliação nas tarefas em que as versões recentes do harness ainda produzem resultados diferentes entre si, em vez de repetir tarefas que todas as versões já resolvem ou todas já falham.","res":"A validação cobre apenas dois cenários — classificação de texto online e Terminal-Bench 2.1 — ambos com conjuntos de tarefas de tamanho moderado; não há evidência de que a estimativa por ponderação inversa de probabilidade permaneça estável quando o conjunto de validação é muito maior ou quando as tarefas têm custos de execução muito desiguais entre si. No momento descrito, o código ainda não estava disponível ('será liberado'), de modo que os detalhes exatos da estimação de score não podem ser verificados de forma independente."},{"p":"2608.20202","ach":"MemTrapBench avalia dois tipos de armadilhas cognitivas induzidas por memória — Fixação de Raciocínio e Distorção de Crença — em duas famílias de modelos e cinco frameworks de memória representativos. Todas as estratégias de memória testadas tiveram desempenho pior do que a configuração sem memória, com os métodos mais fortes sofrendo quedas superiores a 10%.","pn":"Armadilhas cognitivas induzidas por memória","pm":"Memórias recuperadas de forma fiel e semanticamente relevante podem, ainda assim, distorcer o raciocínio ou as crenças de um modelo sobre a tarefa atual, fazendo-o fixar-se em conclusões anteriores ou adotar crenças equivocadas, o que degrada o desempenho mesmo quando a memória em si está correta.","imp":"Antes de habilitar memória de longo prazo em um assistente ou agente, você deve testar cenários em que a memória recuperada é correta mas irrelevante ou contraditória para a pergunta atual — por exemplo, mudanças de contexto entre sessões — porque o sistema pode travar em conclusões anteriores mesmo com armazenamento e recuperação funcionando perfeitamente. Inserir no prompt do sistema uma instrução explícita pedindo para reavaliar se a memória recuperada realmente se aplica à pergunta atual antes de usá-la pode recuperar parte do desempenho perdido, sem exigir retraining.","ex":"Um assistente de atendimento que lembra que um usuário preferia respostas técnicas em uma conversa anterior pode continuar aplicando esse estilo mesmo quando, na conversa atual, o mesmo usuário pede explicitamente uma explicação simples, fixando-se na memória armazenada em vez de reavaliar o pedido presente.","res":"Os ganhos de AdaptiveMem foram medidos apenas no próprio MemTrapBench e em benchmarks de memória padrão associados aos mesmos cinco frameworks testados; não há evidência de que a instrução generalize para tipos de armadilha cognitiva diferentes dos dois definidos (Fixação de Raciocínio e Distorção de Crença) ou para frameworks de memória fora desse conjunto."},{"p":"2608.20574","ach":"FlavourBench avalia 27 modelos frontier em 534 tarefas culinárias com ground truth executável (Epicure), garantindo paridade exata de 89 respostas válidas por painel e família (14.418 células modelo-tarefa). Usando 50.000 réplicas bootstrap e 100.000 sorteios sign-flip com correção de Holm para 351 comparações pareadas, apenas 101 pares de modelos mostraram diferença estatisticamente resolvida; os dois painéis independentes correlacionam em r=0,89. Grok 4.6 lidera com pontuação 65,1 (IC 95% simultâneo 61,0-69,2).","pn":"Ground truth executável pré-computado com controle estatístico de comparações pareadas","pm":"Um sistema de pontuação determinístico e versionado calcula o valor de todas as respostas possíveis antes da execução do modelo, eliminando a necessidade de um juiz humano ou de outro modelo como árbitro, e as diferenças entre sistemas são validadas por replicações bootstrap com correção para múltiplas comparações antes de serem tratadas como reais.","imp":"Se você monta comparações internas entre modelos para decidir qual usar em produção, vale replicar essa lógica: calcule antecipadamente a pontuação correta de todas as respostas possíveis antes de rodar qualquer modelo, e só declare um modelo 'melhor' que outro depois de testar a diferença com reamostragem estatística e correção para múltiplas comparações — caso contrário você corre risco de trocar de modelo com base em ruído de amostragem.","ex":"No próprio ranking do paper, das 351 comparações pareadas entre modelos frontier (incluindo o líder Grok 4.6 contra concorrentes), apenas 101 resistiram à correção de Holm como diferenças estatisticamente confiáveis — ou seja, a maioria das posições de uma tabela de liderança comum, sem esse controle, estaria reportando diferenças que não se sustentam estatisticamente.","res":"O benchmark cobre um domínio muito específico (composição de ingredientes culinários), sem relação direta com tarefas típicas de produção como código, atendimento a cliente ou extração de dados, então os números de desempenho não transferem. A técnica estatística foi validada apenas neste ambiente controlado com clusters de âncoras específicos do domínio; aplicá-la a outro benchmark exige reconstruir do zero as premissas de independência dos clusters bootstrap, não é um método plug-and-play."},{"p":"2608.23200","ach":"Em 252 tarefas com trajetórias confirmadas por verificador, Gene evoluídos superam Skill em 8.7 a 15.5 pontos percentuais em sete modelos avaliados, com ganhos que se estendem a modelos de consumo de outras famílias. Gene destilados de referência, apesar de forma compacta semelhante, não mostram a mesma vantagem. Para Claude Opus, o reuso de Gene completou 39 tarefas adicionais e reduziu o consumo de tokens na resolução em 9.9%.","pn":"Proveniência verificada acima da forma compacta","pm":"A utilidade de uma unidade de conhecimento reaproveitável para tarefas longas depende de ter sido derivada de uma trajetória de execução confirmada por um verificador, e não apenas de possuir uma forma compacta ou estruturada.","imp":"Se você mantém um sistema que acumula experiência de execuções passadas para reaproveitar em tarefas futuras (por exemplo, um agente de codificação ou de automação de workflows), não basta resumir ou compactar exemplos de referência para guardar como 'conhecimento reutilizável' — é preciso extrair essa experiência a partir de execuções reais cujo sucesso foi confirmado por algum mecanismo de verificação automática (testes que passaram, checagem de regras) antes de armazená-la.","ex":"Um agente que gera código repetidamente para tarefas parecidas perde a estratégia que funcionou na execução anterior; extrair a trajetória real que passou pelos testes automáticos e reutilizá-la na próxima tentativa produz ganhos consistentes de acerto e economia de tokens, enquanto reutilizar apenas um resumo condensado manualmente da tarefa de referência, mesmo compacto, não produz o mesmo efeito.","res":"O ganho foi medido só no subconjunto de 252 tarefas com trajetórias Opus verificadas dentro do benchmark introduzido pelo próprio paper (LongWoF-Bench), então não está demonstrado que o processo de consolidação de experiência generaliza para domínios sem verificação automática barata ou confiável; o achado é sobre a origem verificada da experiência, não sobre o formato específico de armazenamento usado."},{"p":"2608.23252","ach":"O paper mostra que proxies padrão de relevância (similaridade de embedding etc.) falham catastroficamente em identificar quais documentos recuperados o modelo realmente usa, especialmente com 'hard negatives'. Um probe causal leave-one-out corrige essa medição, e ao aplicá-lo numa grade fatorial os autores mostram que alocar contexto via múltiplas gerações sequenciais, em vez de um único contexto ampliado, produz ganhos de 16.7 a 20.5 pontos percentuais de recall de portfólio, com o efeito se mantendo até modelos de 32B.","pn":"Alocação sequencial de contexto sob probe causal de utilização de evidência","pm":"Alocar o orçamento de contexto por meio de múltiplas gerações sequenciais, guiadas por uma medição causal de quais evidências o modelo efetivamente usa, supera o alargamento monolítico do contexto, porque contextos únicos e grandes sofrem diluição estrutural da atenção que degrada a relevância efetiva das evidências incluídas.","imp":"Se seu pipeline de busca generativa gera várias respostas a partir de documentos recuperados, evite jogar todos os documentos em um único contexto grande; em vez disso, quebre a geração em rodadas sequenciais menores, cada uma informada pelo que já foi produzido, e priorize nessas rodadas os documentos que um teste de remoção (retirar um documento e ver se a resposta muda) mostra que o modelo realmente usa — não apenas os que têm maior score de similaridade.","ex":"Num sistema de busca que gera múltiplas respostas candidatas a partir do mesmo conjunto de documentos recuperados, ampliar o contexto para caber mais documentos de uma vez faz o modelo diluir atenção entre documentos irrelevantes mas superficialmente parecidos (hard negatives) e os realmente úteis; testar cada documento por remoção revela que muitos com score alto de relevância não mudam a resposta ao serem retirados, expondo a falha do proxy de relevância usado para decidir o que entra no contexto.","res":"Os ganhos foram medidos em benchmarks de geração de portfólio (múltiplas respostas diversas) e em modelos até 32B; não há evidência de que o padrão se sustente em tarefas RAG de resposta única ou em escalas maiores. Além disso, o resultado completo depende de três peças acopladas (probe causal, scheduler submodular, decodificador contrastivo); adotar apenas a ideia de 'gerar em rodadas sequenciais' sem essas peças de medição e controle pode não reproduzir os ganhos relatados."},{"p":"2608.13558","ach":"Em 36 casos de estudo multidisciplinares, o fornecimento de evidencias brutas multimodais aos agentes superou o uso de caracteristicas escalares pre-calculadas em 85% dos confrontos diretos, elevando a pontuacao geral media dos relatorios gerados para 6.3/10 atraves de validacoes deterministicas de codigo.","pn":"Pipeline deterministico multiagente com checagens programaticas de consistencia","pm":"O fluxo de trabalho encadeia agentes especializados em etapas fixas, alimentando-os com dados brutos multimodais em vez de sumarios textuais, e valida a saida de cada etapa por meio de scripts programaticos de rastreabilidade numerica, checagem estatistica e consistencia factual.","imp":"Em fluxos de analise de dados com agentes, voce deve enviar as entradas brutas (graficos, tabelas, sinais) diretamente a modelos com capacidade multimodal em vez de pre-processa-las em sumarios textuais intermediarios, inserindo scripts de validacao numerica e estatistica entre os passos para barrar alucinacoes antes da etapa seguinte.","ex":"Um agente de relatorios financeiros recebe apenas resumos em texto gerados por OCR de balancos patrimoniais e distorce relacoes temporais de fluxo de caixa; ao receber os demonstrativos originais diretamente e ter as alegacoes checadas por scripts Python de reconciliacao contabil, inconsistencias no texto final sao eliminadas.","res":"O benchmark e centrado em geracao de manuscritos academicos fechados e nao avalia latencia, custo computacional por ciclo completo de raciocinio ou integracao em tempo real com fontes de dados mutaveis em producao."},{"p":"2608.20364","ach":"A literatura da area demonstra progressos em segmentacao e formalizacao de fontes, mas revela forte fragilidade na resolucao de identidade de entidades/narradores e baixa transferencia de dados sinteticos para textos reais. A maioria dos modelos avaliados em benchmarks fechados falha quando exposta a fontes nao canonicas, comentarios contextuais e requisitos estritos de proveniencia.","pn":"","pm":"","imp":"Trate tarefas de recuperacao e verificacao em dominios textuais complexos como problemas de infraestrutura de proveniencia com validacao humana especializada, evitando confiar apenas em similaridade vetorial densa de LLMs. Isole e valide rigidamente a camada de pre-processamento e resolucao de entidades antes da indexacao para evitar que pequenas variacoes lexicais corrompam cadeias de atribuicao.","ex":"Um assistente RAG de consulta a jurisprudencia historica recupera um texto canonico mas atribui a autoria a um jurista homonimo homofono, porque o pipeline de embeddings colapsou variantes lexicais de grafia antiga na mesma entidade, gerando uma citacao com proveniencia invalida sem que o modelo aponte incerteza.","res":"O trabalho foca estritamente no ecossistema de literatura islamica e textos classicos arabes, nao fornecendo codigo, pesos de modelo ou ferramentas executaveis prontas para integracao."},{"p":"2608.20438","ach":"Em 448 rodadas de simulação com múltiplas famílias de modelos abertos, a ordenação de mensagens por votos de pares aumentou a similaridade lexical (+0,0082 a +0,0109 no cosseno TF-IDF) entre os agentes. No entanto, dividir ataques adversariais entre várias fontes não provocou mudança consistente de opinião em comparação com uma única fonte quando o volume total de exposição permaneceu idêntico.","pn":"Convergência lexical induzida por feedback de pares em multiagentes","pm":"A exposição de agentes a conteúdos gerados por outros agentes e ordenados por engajamento mútuo provoca homogeneização do vocabulário ao longo das rodadas, mesmo quando as posturas fundamentais e decisões não se alteram.","imp":"Monitore a repetição e perda de variedade sintática se você encadeia múltiplos agentes trocando saídas contextuais contínuas, mas não assuma que essa repetição superficial de palavras signifique que os agentes estejam concordando logicamente ou mudando suas decisões.","ex":"Um ecossistema de agentes de análise financeira onde cada agente lê relatórios dos outros antes de emitir um parecer adota jargões e estruturas frasais idênticas com o tempo, gerando uma falsa impressão de consenso enquanto as previsões numéricas divergem.","res":"O estudo avalia exclusivamente agentes sintéticos em redes simuladas de tópicos fechados; os achados não modelam comportamento humano real nem garantem estabilidade sob prompts adversariais complexos fora do formato de postagem curta."},{"p":"2608.20707","ach":"Agentes que apenas concatenam historicos visuais e sofrem supervisao passo a passo sofrem com degradacao por estouro de contexto e exibem comportamento irrealista de exploracao excessiva. A combinacao de memoria particionada com avaliacao em nivel de sessao inteira superou amplamente abordagens convencionais em consistencia de intencao e fidelidade de cliques.","pn":"Memoria hierarquica em tres camadas com atualizacao acionavel por agente","pm":"O agente divide o contexto em memoria de trabalho de curto prazo, memoria episodica de navegacao e perfil de intencao global, disparando atualizacoes explicitas de memoria como acoes ao longo da sessao para evitar estouro de contexto sem perder historico comportamental.","imp":"Separe o estado do seu agente de navegacao web em tres buffers independentes (foco da tela atual, historico resumido de passos anteriores e objetivo latente do usuario) e instrua o modelo a invocar ferramentas de sumarizacao e atualizacao desses buffers em pontos estrategicos, em vez de enviar todos os prints de tela anteriores a cada turno.","ex":"Um agente de testes sinteticos de e-commerce que precisa simular a jornada de compra navegando por 40 paginas consecutivas comeca a esquecer o produto original desejado ou trava a chamada por atingir a janela de contexto de imagens, falhando em completar o checkout.","res":"O paper valida o ganho de fidelidade acoplando a arquitetura de memoria ao treino por aprendizado por reforco em trajetorias completas; usar apenas a estrutura de memoria em prompts com modelos de prateleira reduz o custo de contexto, mas nao garante por si so a eliminacao de comportamentos de exploracao passiva ou erratica."},{"p":"2608.20886","ach":"A abordagem estruturada sem treino supera re-ranqueadores baseados em embeddings densos e prompts de raciocínio livre em cinco benchmarks de recuperação
