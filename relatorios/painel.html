n Clarification for Interactive Optimization","d":"2026-09-07","da":"2026-09-04","v":"estrito","rf":null,"art":true,"a":"Agentes & automação","as":["Avaliação & confiabilidade"],"tp":["Sistemas multiagente","Validado em benchmark","Otimização de harness & prompt"],"oa":1,"pp":1,"u":15,"c":2,"gs":4,"org":"AIOR-Research","na":6,"nv":2,"url":"https://huggingface.co/papers/2609.05258","f":1,"j":"ESTRITO por padrão arquitetural: a lógica de detectar lacunas para decidir entre perguntar ou modelar é reproduzível pela descrição, sem depender do código dos autores.","h":0,"fr":0,"cr":["benchmark","padrao_arquitetural"]},{"id":"2609.05275","t":"Don't Drop Dropout: Optimizing Layer Sparsity for Efficient LLM Training and Inference","d":"2026-09-07","da":"2026-09-04","v":"fora","rf":"treino_ou_postreino","art":null,"a":"Treino & pós-treino","as":["Eficiência & custo de inferência"],"tp":["Validado em benchmark"],"oa":0,"pp":0,"u":13,"c":1,"gs":0,"org":"cerebras","na":9,"nv":1,"url":"https://huggingface.co/papers/2609.05275","f":0},{"id":"2609.05295","t":"RISE: Recursive Improvement via Self-Extrapolating Policy Distillation","d":"2026-09-07","da":"2026-09-04","v":"fora","rf":"treino_ou_postreino","art":null,"a":"Treino & pós-treino","as":["Avaliação & confiabilidade","Agentes & automação"],"tp":["Raciocínio & test-time compute","Validado em benchmark"],"oa":0,"pp":0,"u":9,"c":0,"gs":0,"org":"Salesforce","na":3,"nv":0,"url":"https://huggingface.co/papers/2609.05295","f":0},{"id":"2609.05416","t":"WorldSculpt: Generating Compositional Worlds from Grounded Videos","d":"2026-09-07","da":"2026-09-04","v":"fora","rf":"geracao_de_midia","art":null,"a":"Multimodal & percepção","as":[],"tp":["Multimodal & visão"],"oa":1,"pp":1,"u":21,"c":0,"gs":32,"org":null,"na":12,"nv":1,"url":"https://huggingface.co/papers/2609.05416","f":0}],"fichas":[{"p":"2606.13610","ach":"Com uma única página poluída, os modelos recomendam o produto falso em até 27% dos casos; substituindo as três páginas do topo, essa taxa sobe para 73.8%, testado em 225 produtos reais, 15 categorias e 5 cenários de consumo, com 12 LLMs comerciais e open-weight. A vulnerabilidade aumenta quando o modelo não tem conhecimento prévio estável sobre o produto, o raciocínio explícito não reduz o problema e frequentemente gera prova social espúria para justificar a recomendação falsa, e nenhuma das quatro defesas testadas resolve o problema — a re-ranking por credibilidade ajuda mas remove apenas um sexto dos casos falsos.","pn":"Vulnerabilidade de recomendadores baseados em busca a poluição de conteúdo web","pm":"Um recomendador que busca na web incorpora o texto das páginas retornadas como evidência factual sem verificar a credibilidade da fonte, de modo que substituir apenas uma fração pequena do conjunto recuperado (uma única página, ou o top-3) já basta para deslocar a recomendação do produto real para um produto fabricado; esse efeito se intensifica quando o sistema não possui conhecimento prévio estável sobre o item, e não é corrigido por raciocínio explícito, que tende a gerar justificativas de prova social falsas em vez de detectar a manipulação.","imp":"Se você opera ou integra um assistente que busca na web para recomendar produtos, trate o conteúdo retornado como não confiável por padrão: adicione uma etapa de verificação de credibilidade da fonte antes de repassar qualquer característica ou avaliação de produto ao usuário. Não conte com instruir o modelo a ser mais cauteloso via prompt nem com ativar modos de raciocínio como defesa, porque em ambos os casos a taxa de recomendações falsas pode aumentar em vez de cair.","ex":"Um usuário pergunta a um assistente com busca qual é o melhor purificador de água de uma categoria específica; se as três páginas do topo retornadas pela busca foram reescritas por um operador de otimização para motores generativos com especificações e avaliações falsas de um produto fabricado, o modelo recomenda esse produto fake em até 73.8% das consultas, e esse efeito é maior em categorias onde o modelo não tem conhecimento prévio consolidado sobre as marcas reais do setor.","res":"O benchmark usa um conjunto congelado de páginas retrieved reescritas localmente, o que isola bem o efeito da poluição mas não reproduz toda a dinâmica de um pipeline de busca ao vivo, com ranking concorrente entre múltiplas fontes e atualização temporal do índice. A redução de um sexto dos casos falsos obtida pela defesa de credibilidade foi medida nesse cenário controlado e não deve ser lida como evidência de que essa defesa é suficiente para um sistema de produção real."},{"p":"2607.21596","ach":"FlowEvo obtém a maior acurácia entre 8 baselines nos splits padrão de ALFWorld, HumanEval, MBPP, GSM8K e MATH-500 usando um backbone GPT-4o-mini compartilhado, alcançando 85,6% em ALFWorld, 26,4 pontos acima do melhor baseline, com aproximadamente um terço dos tokens. Em 10 modelos base de 7B a 671B parâmetros, supera o ExpeL em 49 das 50 comparações modelo-dataset.","pn":"Banco de skills com poda por transferência negativa","pm":"Workflows executados com sucesso são compilados em rotinas reutilizáveis armazenadas em um banco persistente, cuja utilidade downstream é monitorada por skill individual para suprimir automaticamente aquelas que passam a prejudicar o desempenho em execuções subsequentes.","imp":"Se você mantém um agente que repete tipos parecidos de tarefa, pode guardar as sequências de ações que deram certo como rotinas reutilizáveis, deixando o agente puxá-las direto ou usá-las como referência ao montar um novo plano, e descartar automaticamente as rotinas que, mesmo tendo funcionado antes, começam a piorar o resultado em outras tarefas — isso corta custo de tokens e evita que erros antigos se acumulem, sem precisar reajustar o modelo.","ex":"Em uma tarefa doméstica do ALFWorld como pegar um objeto e guardá-lo em outro cômodo, um workflow bem-sucedido de abrir gavetas e verificar itens é transformado em skill reutilizável; ao ser aplicada numa tarefa diferente e causar queda na taxa de sucesso, o sistema detecta essa queda (transferência negativa) e remove a skill do banco antes que volte a ser usada.","res":"Os ganhos foram medidos em benchmarks fechados e padronizados com métricas de sucesso bem definidas (ALFWorld, HumanEval, MBPP, GSM8K, MATH-500); o texto não mostra como a detecção de transferência negativa se comportaria em tarefas de produção abertas, sem sinal de sucesso claro, nem qual é o custo de manter e consultar o banco de skills quando o volume de tarefas e usuários cresce."},{"p":"2608.03744","ach":"Comitês de agentes Gemini resistem a pistas espúrias isoladas (apenas 5-16% de mudança de resposta), mas cedem a um shortcut socialmente plausível: quando dois agentes-pares afirmam a mesma resposta errada, o agente sob teste a adota em 38% dos casos, o mesmo ocorrendo com um falso sinalizador de 'pré-triagem'. Dos três agentes de supervisão testados, um 'gate' não distingue adoção de concordância honesta (100% de falso-positivo), um 'judge' que só lê a transcrição funciona em texto mas colapsa em imagens, e apenas um 'referee' que reconsulta o agente de forma independente mantém desempenho (77-88% de precisão) através das modalidades.","pn":"","pm":"","imp":"Ao montar supervisão para um comitê de agentes de LLM, não confie em um verificador que apenas releia a conversa entre os agentes nem em um comparador simples de respostas: nenhum dos dois separa concordância genuína de um agente que apenas copiou o que os outros disseram. Em vez disso, construa um mecanismo que consulte novamente, em privado, o agente avaliado — sem mostrar a ele o que os pares responderam — antes de aceitar a decisão final do grupo.","ex":"Em comitês analisando radiografias do NIH ChestX-ray14 e MIMIC-CXR-JPG, quando dois agentes-pares afirmavam a mesma leitura incorreta de uma imagem, o agente sob avaliação trocava sua resposta original em 38% dos casos; um verificador que só lia a transcrição da discussão não conseguia flagrar essa mudança (caía para o mesmo desempenho ruim do comparador simples), enquanto um referee que reperguntava ao agente em privado, sem revelar o consenso dos pares, manteve precisão de 77-88% mesmo mudando de texto para imagem.","res":"Os resultados vêm de comitês construídos com modelos Gemini sobre datasets públicos de benchmark (MedQA, MedMCQA, ChestX-ray14, entre outros); não está demonstrado que o mesmo padrão de contágio social, nem a mesma eficácia do referee, se mantenham com outras famílias de modelos ou em fluxos clínicos reais com dados não estruturados. Além disso, a detecção por reconsulta privada foi validada apenas nas modalidades e formatos de tarefa usados no estudo, não em cenários com deliberação mais aberta ou textos clínicos livres."},{"p":"2608.06867","ach":"O estudo mostra que roteadores aprendidos superam o melhor modelo fixo isolado em 14,6% relativo, combinando qualidade de resposta e custo de inferência. Também mostra que roteadores leves se tornam mais competitivos quando o orçamento é muito restrito, e que o roteamento condicionado ao usuário melhora consistentemente a personalização, tudo medido no benchmark xRouteBench com mais de 16 roteadores.","pn":"Decomposição do roteamento em cinco componentes decisórios","pm":"O roteamento entre modelos é modelado como um processo de decisão sequencial decomposto em codificador de contexto, codificador de modelo, função de pontuação, regra de decisão e sinal de aprendizado, o que permite comparar e recombinar diferentes estratégias de seleção de modelo de forma modular.","imp":"Se você decide hoje entre sempre chamar o modelo mais caro disponível ou montar algum esquema de seleção dinâmica entre modelos, você pode usar a infraestrutura aberta descrita para testar vários roteadores já implementados contra seu próprio padrão de consultas e limite de custo, em vez de construir esse mecanismo do zero e só descobrir depois se ele supera a alternativa simples de usar um único modelo fixo.","ex":"Um time que opera um chatbot de suporte com orçamento mensal fixo de chamadas de API pode rodar o benchmark sobre seu próprio tráfego para checar se um roteador leve baseado em regras simples já captura boa parte do ganho de qualidade que um roteador aprendido mais sofisticado traria, evitando gastar em infraestrutura de roteamento complexa quando a verba é curta.","res":"O ganho de 14,6% foi medido nas tarefas específicas do xRouteBench (texto genérico, memória, visão, séries temporais e personalização); não há garantia de que o mesmo ganho se mantenha em domínios de produção muito diferentes desses, e a vantagem dos roteadores leves só aparece sob restrição de custo apertada, não como regra geral de desempenho."},{"p":"2608.06947","ach":"D-SCAN mostra que ataques de poisoning em RAG frequentemente reduzem a perplexidade da saída em vez de aumentá-la, invalidando a detecção baseada em incerteza. Em contrapartida, esses ataques produzem colapso de entropia na atenção do gerador sobre os documentos recuperados, com a atenção se concentrando no documento envenenado. O método detecta esse colapso em múltiplos benchmarks de ataque, inclusive quando a resposta final permanece inalterada.","pn":"Colapso de entropia de atenção como sinal de ataque","pm":"Quando um documento malicioso é injetado no contexto recuperado, a atenção do gerador se concentra sobre esse documento e a entropia da distribuição de atenção cai em relação à dispersão observada em gerações benignas, produzindo um sinal interno detectável mesmo quando o ataque induz falsa confiança e reduz a perplexidade de saída, e mesmo quando a resposta final não chega a ser alterada.","imp":"Se você opera um pipeline RAG com um modelo cujos pesos de atenção você pode inspecionar (modelo aberto rodando localmente ou via inferência própria), pare de confiar apenas em perplexidade ou checagem de consistência da saída para flagar documentos suspeitos. Adicione um monitor que calcula a entropia da atenção distribuída entre os documentos recuperados a cada geração; quedas abruptas de entropia (atenção concentrada num único documento) servem como alarme de possível injeção maliciosa, mesmo quando a resposta gerada parece fluente e confiante.","ex":"Num sistema RAG rodando um modelo aberto (ex.: Llama) sobre uma base de conhecimento indexada, um atacante injeta um documento forjado no índice; a resposta gerada a partir dele tem perplexidade menor que a resposta correta baseada nos documentos legítimos, então um filtro de perplexidade deixaria passar o ataque. Ao inspecionar a distribuição de atenção por documento durante a geração, o documento forjado recebe peso desproporcional e a entropia cai, expondo o ataque antes ou independentemente de a resposta final estar errada.","res":"A técnica depende de acesso direto aos pesos de atenção internos do modelo gerador durante a geração, o que não é viável com modelos servidos apenas via API fechada (ex.: GPT-4, Claude via API comercial sem exposição de ativações). A validação foi feita em benchmarks de ataque específicos e arquiteturas com atenção padrão; não há evidência de que o sinal se sustente em arquiteturas com mecanismos de atenção esparsa, linear ou ausentes."},{"p":"2608.07193","ach":"Ao remover 94,4% dos tokens visuais de MLLMs, o framework preserva mais de 99% do desempenho original em 14 benchmarks multimodais e três backbones, reduzindo FLOPs em 9,9x e a latência de prefill em 6,4x. O ganho vem de deixar um LLM buscar políticas de pruning representadas como modificações residuais de uma política base, em vez de heurísticas manuais fixas.","pn":"DSL residual sobre política base para busca guiada por LLM","pm":"Uma linguagem de domínio específico com átomos reutilizáveis, cuja composição é restrita a modificações residuais sobre uma política base forte, traduz o conhecimento algorítmico geral de um modelo de linguagem em soluções estruturadas para uma tarefa de otimização especializada, reduzindo o espaço de busca e concentrando a exploração nos componentes mais consequentes para o desempenho.","imp":"Se você opera um pipeline multimodal (imagem+texto ou vídeo+texto) e o custo de prefill com muitos tokens visuais é um gargalo, vale considerar poda agressiva de tokens visuais como caminho viável de redução de custo — mas a política ótima não é universal: ela precisa ser (re)gerada para cada combinação de modelo, orçamento de tokens e tarefa, o que exige rodar um processo de busca automatizado, não copiar uma regra fixa de outro sistema.","ex":"Em um sistema de resposta a perguntas sobre imagens de alta resolução (ex: documentos escaneados ou frames de vídeo) usando um MLLM tipo LLaVA, o número de tokens visuais gerados pelo encoder de visão infla o custo de prefill; aplicar uma política de pruning fixa e genérica (ex: manter só os primeiros N tokens) tende a degradar respostas que dependem de regiões específicas da imagem — o framework descrito ataca isso buscando, por modelo e orçamento, uma política residual sobre uma baseline forte em vez de um corte cego.","res":"O ganho reportado depende de repetir o processo de busca guiada por LLM para cada novo modelo, orçamento ou domínio — não existe uma política única exportável e pronta para uso; se o código e as 131 primitivas da DSL não forem disponibilizados abertamente, a reprodução exige reimplementar a infraestrutura de busca, não apenas aplicar um resultado. Além disso, os ganhos de FLOPs e latência foram medidos nos backbones e benchmarks testados, e podem não se transferir linearmente para arquiteturas de visão muito diferentes das usadas no paper."},{"p":"2608.07545","ach":"Em quatro benchmarks que separam progressivamente o sinal de evolução do teste, uma rodada de seleção populacional de harnesses aumenta o desempenho em média cerca de 17 pontos: Terminal-Bench 2.1 sobe 7,7 pontos até 83,2% numa base pareada e até 84,7% numa base mais forte; o split held-out do TerminalWorld chega a 68,3%, superando agentes prontos; o pass@1 em tarefas reais do WebArena-Infinity sobe de 43,5% para 93,0% após auditoria; e um harness evoluído em Terminal-Bench 2.1 transfere sem alteração para SWE-bench Verified.","pn":"Seleção populacional de harnesses com contrato preserve-and-extend","pm":"Um conjunto de variantes de harness é mantido em arquivo com linhagens divergentes disponíveis para recombinação; uma nova variante só é aceita quando estende a cobertura de tarefas resolvidas sem regredir as já resolvidas por outras linhagens, e o fitness de cada variante é definido pelo verificador próprio da tarefa, sem uso de gabaritos ou seleção manual de vencedores, enquanto os pesos do modelo permanecem congelados.","imp":"Ao montar um loop de auto-melhoria para um agente de LLM (edição de prompts, ferramentas ou fluxo de controle), mantenha várias variantes de harness em paralelo em vez de editar uma única linha; só promova uma variante nova se ela resolver casos novos sem quebrar os que já funcionavam, e use o verificador automático de cada tarefa para decidir isso — não uma resposta de gabarito nem sua própria escolha manual do 'melhor' resultado. Isso evita que um ganho pontual em uma tarefa vire regressão silenciosa em outra parte do sistema já em produção.","ex":"Um harness de agente de terminal evoluído sob esse contrato em Terminal-Bench 2.1 foi reaproveitado sem qualquer alteração em SWE-bench Verified, uma tarefa de correção de bugs em repositórios de código reais — evidência de que a competência adicionada não era um ajuste específico ao benchmark de origem, mas generalizava para outra distribuição de tarefas e outro verificador.","res":"Os ganhos foram medidos com verificadores e benchmarks controlados pelos próprios autores, incluindo um split 'held-out' interno (TerminalWorld) cuja independência real não pode ser auditada externamente; o paper não indica se o arquivo de variantes de harness ou o código de seleção foi liberado, então a reprodução do contrato preserve-and-extend depende de reimplementação própria, e não há garantia de que a ausência de regressão observada nesses quatro benchmarks se mantenha em tarefas com verificadores mais ruidosos ou ambíguos."},{"p":"2608.08020","ach":"O paper mostra que, sob orçamento fixo de hardware, o algoritmo Gambit supera tanto o sampling paralelo quanto a poda subtrativa tradicional: ganhos de até +6.7% de acurácia absoluta em HMMT-24 e +3.3% em AIME-25 sobre baselines de poda, throughput mais que 2x maior na conclusão de trajetórias, e redução de até 68.5% no consumo total de tokens comparado ao sampling paralelo padrão.","pn":"Poda e ramificação dinâmica de trajetórias parciais de raciocínio","pm":"Um scorer leve avalia estados internos de trajetórias parciais de raciocínio, cortando periodicamente as menos promissoras e ramificando imediatamente a partir dos prefixos mais promissores, concentrando o compute disponível enquanto mantém a utilização do hardware constantemente alta.","imp":"Se você opera um serviço de raciocínio em lote com GPUs próprias e orçamento fixo, em vez de rodar N amostras independentes até o fim (o que satura memória) ou aplicar poda simples sem realocar o compute liberado (o que deixa GPU ociosa), você pode inserir um scorer leve que lê os estados internos do modelo a cada poucos passos de raciocínio para decidir onde cortar e onde ramificar mais — isso permite gastar menos tokens e tempo de GPU para o mesmo nível de acurácia, ou mais acurácia pelo mesmo custo.","ex":"Em benchmarks de matemática competitiva como AIME-25 e HMMT-24 com modelos de raciocínio grandes, o sampling paralelo tradicional saturou a memória da GPU mantendo trajetórias fracas até o fim, enquanto a poda subtrativa isolada deixou hardware subutilizado após cortar trajetórias sem realocar o compute; o Gambit, ao ramificar imediatamente a partir de prefixos fortes identificados por um scorer sobre hidden states, manteve GPUs ocupadas continuamente e converteu isso em pontos extras de acurácia nesses benchmarks.","res":"O método exige acesso direto aos hidden states do modelo durante a geração e a um scorer leve calibrado para essa tarefa, algo viável apenas em pilhas de inferência próprias com modelos de peso aberto — não se aplica a quem consome modelos exclusivamente via API de terceiros sem controle sobre o motor de inferência, o que limita a adoção imediata para uma parte relevante dos usuários em produção."},{"p":"2608.08466","ach":"Com um LLM congelado (DeepSeek-V4-Flash-Preview) como backbone, a evolução hierárquica do harness produziu ganhos consistentes sobre o harness inicial em tarefas de dificuldade moderada: +39,3 em BabyAI, +33,0 em Crafter, +25,0 em TextWorld e +15,0 em MiniHack (todos em % de progresso bruto). Em sub-suítes de BabaIsAI não vistas (20% held-out), o melhor teste atingiu 0,98 em BreakStop e 1,00 em GoTo. Em NLE, tarefa que excede a capacidade do backbone, a evolução do harness não trouxe melhoria alguma.","pn":"Evolução hierárquica de harness sob backbone congelado","pm":"O scaffold executável de um agente é reescrito em camadas hierárquicas de auto-modificação (execução, evolver, meta-evolver) usando sinais de feedback do ambiente, enquanto o modelo de linguagem subjacente permanece fixo, com o ganho obtido limitado pela qualidade do sinal de recompensa e pela capacidade do próprio modelo congelado.","imp":"Em vez de reescrever manualmente prompts, ferramentas e fluxos do seu agente a cada iteração, você pode delegar essa reescrita a um segundo processo (evolver) que observa o retorno do ambiente e modifica o código do harness automaticamente, mantendo o modelo base intacto — e ainda usar um terceiro nível (meta-evolver) para ajustar a própria estratégia de reescrita quando o desempenho estagna. Isso só compensa o esforço se a tarefa já tiver um sinal de recompensa claro (por exemplo, taxa de sucesso ou pontuação do ambiente); sem esse sinal, não há o que a evolução possa otimizar.","ex":"Um agente jogando Crafter (jogo de sobrevivência por texto) teve seu harness reescrito automaticamente por camadas de evolver/meta-evolver e subiu 33 pontos de progresso bruto sem qualquer ajuste no modelo. No NetHack Learning Environment (NLE), tarefa que exige raciocínio e conhecimento de domínio além do que o modelo congelado possui, a mesma técnica de reescrever o harness não produziu ganho nenhum — a barreira estava no modelo, não no scaffold.","res":"Os ganhos dependem de um sinal de feedback informativo (feedback-fidelity bound); em tarefas com retorno esparso ou ruidoso a evolução do harness pode simplesmente não convergir. Quando a dificuldade da tarefa excede a capacidade do modelo congelado (caso do NLE), reescrever o harness não compensa essa limitação — a técnica não substitui melhorar o modelo em si. A validação foi feita apenas em benchmarks de agentes em jogos e ambientes textuais (BALROG, BabaIsAI); não há evidência direta de que o mesmo padrão de evolução hierárquica generalize para tarefas de produção como atendimento ao cliente, geração de código em repositórios reais ou pipelines de RAG."},{"p":"2608.08975","ach":"A partir de 120 submissões ICLR 2026 reescritas em 4.200 variantes controladas ao longo de seis dimensões retóricas, o framing de evidência e a postura de novidade produzem os maiores contrastes positivo-negativo na nota geral atribuída por cinco revisores LLM, com o framing de escopo formando um segundo nível mais fraco. O efeito depende da nota original: notas baixas tendem a subir e notas altas tendem a cair, e o protocolo de revisão estrito reduz a nota média geral em 1,36 pontos sem eliminar de forma consistente essa sensibilidade retórica.","pn":"","pm":"","imp":"Se você usa um LLM para pontuar, aprovar ou ranquear textos submetidos por terceiros (propostas, relatórios, conteúdo gerado por usuário), não pode assumir que a nota reflete só o conteúdo: alguém pode reescrever a mesma submissão só na forma de apresentar evidências e alegações de originalidade e mudar a pontuação de forma previsível. Antes de colocar esse tipo de avaliador em produção, teste explicitamente pares de reescrita com conteúdo fixo e retórica variada, e não confie em endurecer o prompt de avaliação ('seja mais rigoroso') como solução definitiva, já que isso muda o nível médio mas não remove a brecha.","ex":"No próprio experimento, submissões do ICLR foram reescritas fortalecendo a postura de novidade e o framing de evidência sem alterar os resultados experimentais relatados, e isso foi suficiente para elevar a Overall Assessment dada pelos revisores LLM — o mesmo mecanismo se aplica a um sistema de triagem automática de propostas de fornecedores ou de moderação de conteúdo que usa um LLM como nota final.","res":"O estudo usa cinco revisores LLM específicos e o domínio de revisão de pares científicos; a magnitude e até o sinal do efeito variam por revisor, então a hierarquia de sensibilidade encontrada aqui não deve ser tomada como universal para qualquer LLM-juiz sem repetir o teste no seu próprio avaliador e domínio. Além disso, o protocolo estrito só atenua o nível médio das notas, não a vulnerabilidade à reescrita retórica, então tratá-lo como mitigação suficiente é a leitura errada mais provável."},{"p":"2608.09158","ach":"ILL, um método de red-teaming em caixa-preta, insere um template de forma de onda de baixa frequência com fase contínua construído a partir de variação espectral de corpus, reduzindo a acurácia de seis LALMs em até 67 pontos percentuais em múltiplas tarefas de compreensão de áudio, com avaliação humana de audibilidade média de 1.33 (próxima de 1.17 do áudio limpo). A defesa proposta, DRG, detecta desvio de distribuição de baixa frequência e solicita uma segunda gravação, elevando a acurácia média sob ataque de 28.5% para 46.1%.","pn":"Canal de baixa frequência inaudível como vetor de ataque","pm":"Sinais de baixa frequência abaixo do limiar de percepção humana podem ser inseridos no áudio de entrada para deslocar a distribuição espectral processada pelo modelo e degradar sua compreensão semântica, sem alterar de forma perceptível o conteúdo ouvido por um humano.","imp":"Se você expõe um serviço que aceita áudio de usuários (transcrição, assistente de voz, comando por fala), precisa testar o pipeline injetando ruído de baixa frequência no sinal antes de confiar na saída do modelo, porque esse ruído passa despercebido por quem grava ou ouve o áudio. Vale também considerar checar a distribuição de frequência do áudio recebido e, quando ela desviar do esperado, pedir uma nova gravação em vez de processar a que chegou.","ex":"Um assistente de voz que recebe comandos por áudio pode receber um clipe com um tom de baixa frequência sobreposto à fala normal, imperceptível para quem grava o comando, e ainda assim produzir uma transcrição ou resposta completamente diferente do que foi dito, porque o modelo processa faixas de frequência que o ouvido humano não capta.","res":"A defesa proposta (DRG) depende de poder solicitar uma segunda gravação em tempo real, o que não funciona para áudio já arquivado ou pipelines assíncronos sem contato direto com quem gerou o som. A validação cobre seis LALMs e um template universal específico; variações do ataque fora desse template, ou modelos com pré-processamento de frequência diferente, não têm eficácia da defesa garantida pelos números reportados."},{"p":"2608.11994","ach":"Testado em quatro LLMs e quatro benchmarks de raciocínio sob orçamentos de compute equiparados, o método supera consistentemente pass@1 e self-consistency. No caso GPT-OSS-20B em CMIMC25, supera pass@1 por 27,15 pontos percentuais e eleva a acurácia de self-consistency de 77,50% para 82,19%, usando 37,0% menos tokens.","pn":"Falsificação seletiva de afirmações decisivas em traços de raciocínio","pm":"Um traço de raciocínio é condensado num conjunto pequeno de afirmações decisivas, e o compute de verificação é direcionado a tentar refutar essas afirmações em vez de gerar mais soluções completas, explorando a assimetria de que construir uma solução correta exige um caminho inteiro sem falhas enquanto refutar uma afirmação incorreta exige encontrar apenas um defeito decisivo.","imp":"Se você usa um LLM para resolver problemas de raciocínio (matemática, lógica) e hoje gera várias amostras completas e vota na resposta mais comum, pode em vez disso extrair as afirmações centrais de cada resposta e gastar o compute tentando encontrar um defeito decisivo em cada uma; isso tende a custar menos tokens e detectar consensos errados que a votação simples deixaria passar.","ex":"No benchmark de matemática competitiva CMIMC25 com o modelo GPT-OSS-20B, a votação por self-consistency com múltiplas amostras completas chegava a 77,50% de acurácia; ao trocar parte desse compute por verificação direcionada das afirmações decisivas de cada traço, a acurácia subiu para 82,19% consumindo 37% menos tokens no total.","res":"Os ganhos foram medidos em benchmarks de raciocínio estruturado (matemática, lógica) sob orçamentos controlados; não há evidência de que a extração de 'afirmações decisivas' funcione igualmente bem em domínios com raciocínio mais aberto ou sem critério claro de correção, e o método depende da capacidade do próprio modelo verificador de identificar corretamente essas afirmações — um erro nessa extração pode degradar o resultado sem que isso seja detectável a priori."},{"p":"2608.12440","ach":"Em um caso único e integralmente instrumentado, um agente de codificação AI desmontou um invariante central de lifetime (painel de UI aberto durante todo request de IA) em uma aplicação TypeScript de produção com 717.725 linhas e 3.648 arquivos, sob um protocolo com especificação formal, 14 ciclos de refinamento, implementação atômica e 17 ciclos de verificação — 31 auditorias no total, 201 defeitos corrigidos antes de qualquer execução humana. A mudança tocou 189 arquivos, sem revisão humana de código e sem oráculo de teste pré-existente; convergência foi declarada quando duas passagens consecutivas de verificação não encontraram problemas. Custo: USD 2.430; tempo: três dias; nenhum bug observado em cerca de 30 sessões subsequentes.","pn":"","pm":"","imp":"Se você depende de agentes para mudanças arquiteturais profundas sem suíte de testes que cubra o comportamento-alvo, este relato sugere substituir a revisão linha a linha por um ciclo de auditoria da especificação formal contra o código, repetido até obter duas passagens consecutivas sem achados, em vez de confiar apenas em compilação e testes existentes como critério de pronto. Isso muda o critério de aceite de 'os testes passam' para 'a especificação congelada e o código convergem empiricamente em auditorias sucessivas' — mas você ainda precisa definir e manter essa especificação como artefato separado do código.","ex":"O próprio caso relatado: uma aplicação de produção com 717.725 linhas e 3.648 arquivos teve o invariante 'painel de UI permanece aberto durante todo o request de streaming de IA' removido, permitindo que o streaming sobreviva ao fechamento do painel e seja reanexado ao reabrir sem perda ou duplicação de dados; a mudança envolveu 189 arquivos (31 novos), 34.770 inserções e 16.422 deleções em dois commits.","res":"Trata-se de um único caso relatado pelo próprio autor, sem replicação por terceiros, sem comparação com uma refatoração manual ou com outro protocolo, e sem revisão humana do código gerado — a ausência de bugs em cerca de 30 sessões posteriores não prova correção geral, apenas ausência de falha observada nesse uso específico. O critério de convergência (duas passagens consecutivas sem achados) foi definido e executado pelo mesmo agente que gerou o código, o que cria risco de auto-confirmação não verificada externamente. Os 1.500+ páginas de logs estão em francês, o que dificulta a inspeção independente por parte de grande parte da comunidade."},{"p":"2608.12571","ach":"Avaliando quatorze configurações de modelos sobre citações jurídicas reais perturbadas de forma controlada, os autores mostram que modelos detectam 93-100% das substituições de caso errado, mas apenas 37-61% das trocas de página-pinpoint dentro do caso correto em opinions judiciais, e 52-83% em petições. Mesmo GPT-5.4 com esforço de raciocínio alto ainda erra 40% dos casos de pinpoint em opinions e 18% em petições. Quando falham, os modelos aceitam a citação com base em sobreposição temática, não em suporte específico da página.","pn":"","pm":"","imp":"Se você usa um LLM para verificar citações jurídicas ou similares (checagem de referência a fonte específica), não basta confirmar que a fonte existe e trata do tema certo — é preciso testar separadamente se o modelo confere a localização exata (página, seção, trecho) onde a afirmação é sustentada. Pedir explicitamente ao modelo para verificar suporte na página citada aumenta a taxa de detecção de erros, mas também aumenta falsos positivos, então esse ajuste de prompt precisa ser calibrado e monitorado, não assumido como solução completa.","ex":"Um sistema de verificação de citações usado por um escritório de advocacia recebe a citação 'Smith v. Jones, p. 45' para sustentar uma alegação sobre dever de cuidado; o modelo aceita a citação porque Smith v. Jones trata do tema de negligência médica em geral, mas a doutrina específica citada está na página 12, não na 45 — o modelo confundiu relevância temática com suporte pontual, exatamente o padrão de erro medido no paper.","res":"Os números vêm de perturbações artificiais controladas em dois corpora específicos (opiniões judiciais e petições legais), não de erros de citação ocorridos naturalmente em uso real, então a taxa de detecção em produção pode diferir. O achado é específico ao domínio jurídico com sua estrutura de pinpoint citation; não está demonstrado que o mesmo padrão de conflação tópico-versus-suporte se generalize a outros domínios de citação, como científico ou médico. Além disso, a mitigação via prompt para verificar página reduz falsos negativos mas às custas de mais falsos positivos, um trade-off que o paper não resolve."},{"p":"2608.12875","ach":"Comparação de 10 LLMs (seis famílias) e 26 embedding models (118M–14B parâmetros) em 37 tarefas de classificação, STS, clustering, pair classification e retrieval mostra paridade agregada: melhor LLM (Gemini 3.1 Pro, 77.6) e melhor embedding model (77.2) diferem por apenas 0.4 pontos. LLMs lideram apenas em retrieval que exige raciocínio; embedding models lideram em classificação; empatam em clustering, STS e pair classification. O LLM mais caro custa até 1431x mais (US$154 vs US$0.11 por passagem de benchmark) e processa tokens de 2.5 a 736x mais lentamente na mesma GPU; tokens de raciocínio representam 28–81% do custo de inferência do LLM, e reduzir esse orçamento preserva ou melhora a qualidade de retrieval na maioria dos modelos testados.","pn":"","pm":"","imp":"Ao decidir qual modelo usar num pipeline de produção, escolha por tipo de tarefa: para classificação, similaridade textual e clustering, use um modelo de embedding dedicado — o custo cai em ordens de grandeza sem perda de qualidade. Reserve o uso de um LLM apenas para retrieval que exige raciocínio sobre o conteúdo, e nesse caso ajuste (reduza) o orçamento de tokens de raciocínio do modelo, já que isso corta custo de inferência sem piorar (às vezes melhorando) a qualidade do retrieval.","ex":"Um sistema de busca semântica corporativa que hoje gera embeddings de documentos chamando um LLM como Gemini 3.1 Pro para todas as etapas — classificação de categoria, agrupamento de tópicos e busca por similaridade — pode trocar as etapas de classificação e clustering por um embedding model dedicado, reduzindo o custo por passagem de US$154 para US$0.11, mantendo o LLM apenas na etapa de retrieval que exige raciocínio complexo sobre a consulta, e cortando ainda mais custo ao limitar o orçamento de tokens de raciocínio nessa etapa.","res":"O resultado vale para o conjunto específico de 37 tarefas e para os 10 LLMs e 26 embedding models testados; não garante que a mesma divisão de trabalho se sustente em domínios ou tarefas fora desse benchmark, nem que outros LLMs ou embedding models futuros mantenham essa relação de custo-benefício. A leitura errada mais provável é concluir que LLMs nunca compensam para embeddings — o achado é mais restrito: eles só compensam quando a tarefa de retrieval exige raciocínio explícito, e mesmo assim a um custo muito maior."},{"p":"2608.12990","ach":"O paper mostra que consolidar memória em segmentos semânticos, em vez de por turno, reduz tokens de construção em 86,0% no LoCoMo e 75,9% no LongMemEval-S em comparação com A-Mem, mantendo desempenho de 89,22% e 92,20% respectivamente nesses benchmarks, sem aumentar o uso de tokens em tempo de consulta.","pn":"Consolidação de memória por segmento semântico","pm":"Interações são agrupadas em segmentos delimitados por detecção de fronteira semântica antes de serem consolidadas em registros de memória tipados e independentes de contexto, reduzindo a frequência de chamadas ao modelo de linguagem sem descartar granularidade de evidência, e os registros resultantes são organizados em índices estruturados que permitem recuperação de evidência planejada por consulta.","imp":"Se seu agente atualiza a memória chamando o modelo após cada troca de mensagem, isso fica cada vez mais caro conforme a conversa cresce; em vez disso, acumule várias trocas até detectar uma mudança de assunto ou fechamento de evento, e só então extraia os registros de memória desse bloco — isso corta o número de chamadas ao modelo sem perder os detalhes que uma pergunta futura pode precisar.","ex":"Um assistente de atendimento que mantém histórico de meses de conversa com um mesmo usuário e hoje resume ou atualiza a memória após cada mensagem — o custo de chamadas ao modelo cresce linearmente com o número de turnos; reorganizar essa memória para consolidar por segmento de assunto (por exemplo, fechar um bloco quando o usuário muda de tema) reduziria essas chamadas sem prejudicar a capacidade de responder perguntas sobre eventos específicos de semanas atrás.","res":"Os números foram medidos com um único modelo (GPT-4.1-Mini) em dois benchmarks controlados (LoCoMo, LongMemEval-S); não há evidência de que a detecção de fronteira semântica generalize igualmente bem para domínios com estrutura conversacional muito diferente da testada, e o paper não indica disponibilidade de código aberto para reprodução direta do sistema completo."},{"p":"2608.13120","ach":"SkillEvo supera a evolução baseada em self-reflection por 23,0 pontos e a evolução guiada por QA de turno único por 15,4 pontos. A avaliação cobre seis categorias de serviços de nuvem, 9 skills de agente em produção e 98 arquivos de referência de skill.","pn":"Feedback multi-turno como gerador contínuo de gradiente + governança reparadora ativa","pm":"A simulação de usuário em múltiplas rodadas é usada não apenas para avaliar, mas para gerar continuamente novos sinais de falha camada a camada, enquanto uma camada de governança separada e ativa corrige degradações factuais e estruturais em vez de apenas aceitar ou rejeitar um candidato por um escore único.","imp":"Se seu pipeline de atualização automática de skills ou prompts de agente decide aceitar uma revisão com base em um único teste de pergunta-resposta, isso deixa passar defeitos que só aparecem na segunda ou terceira pergunta de um usuário real. Vale simular explicitamente uma conversa de várias rodadas antes de aprovar a mudança, e separar essa etapa de avaliação de uma etapa distinta que corrija problemas estruturais encontrados, em vez de só aprovar ou reprovar com um único escore.","ex":"Uma skill de agente que configura provisionamento de armazenamento em nuvem responde corretamente à primeira pergunta do usuário e passaria num teste de turno único, mas falha quando o usuário faz uma pergunta de acompanhamento sobre custo ou permissões, porque a skill nunca foi testada contra uma sequência de perguntas — esse tipo de falha só emerge em avaliação multi-turno.","res":"Os números vêm de um conjunto proprietário de skills e arquivos de referência da própria organização que propôs o método, sem benchmark aberto, dataset público ou código disponível, então a comparação de pontos não é reprodutível fora desse ambiente. Além disso, o 'gerador de feedback' multi-turno e a 'camada de governança' são descritos em termos funcionais, não em detalhe suficiente para implementação independente — o princípio de separar geração de feedback de correção estrutural é transferível, mas o como fazer isso na prática permanece proprietário."},{"p":"2608.13210","ach":"O paper introduz NARU, um benchmark de 1.481 perguntas sobre 155 vídeos japoneses de longa duração (146,8 horas), cobrindo quatro dimensões narrativas e cinco culturais. Avaliações em oito configurações de modelos mostram lacunas substanciais tanto na integração narrativa de longo alcance quanto no raciocínio culturalmente fundamentado.","pn":"Anotação hierárquica com remoção iterativa de shortcuts","pm":"Um pipeline converte vídeo bruto em anotações estruturadas de evento, narrativa e cultura por meio de camadas de memória hierárquica, gera perguntas via síntese orientada a tarefas e remove iterativamente perguntas que podem ser respondidas sem a informação-alvo, com verificação por falantes nativos em duas etapas.","imp":"Se você avalia ou seleciona um modelo multimodal para tarefas que exigem acompanhar uma história ao longo de horas de vídeo ou captar significados culturais que não são ditos explicitamente, este resultado indica que testes baseados em recuperar eventos isolados não vão flagrar esse tipo de falha — é preciso montar casos de teste que exijam integrar informação espalhada ao longo do vídeo inteiro e que dependam de contexto cultural implícito.","ex":"Um produto que gera sinopses automáticas de doramas japoneses longos usando um MLLM tende a acertar a descrição de cenas isoladas mas errar reviravoltas de enredo que só fazem sentido considerando hierarquia social ou referências sazonais mencionadas horas antes, porque o modelo prioriza eventos recentes em vez de reconstruir a narrativa completa.","res":"O benchmark cobre apenas conteúdo em japonês e dependeu de 68 anotadores nativos, o que torna a réplica direta para outros idiomas ou culturas custosa; além disso, o paper documenta que os modelos falham, mas não propõe nem valida uma técnica que corrija essas falhas — a leitura errada seria tratar o benchmark como uma solução em vez de um diagnóstico."},{"p":"2608.13410","ach":"ParliamentRAG supera o NotebookLM do Google em cobertura de grupos políticos (0,97 vs 0,95) e atinge fidelidade de citação perfeita (1,00 vs 0,95), segundo avaliação cega A/B por seis especialistas de domínio sobre 15 tópicos de política. O NotebookLM manteve vantagem nas dimensões relacionadas à qualidade da prosa gerada.","pn":"Ponderação por autoridade dependente de tópico em RAG multi-fonte","pm":"Um sistema de recuperação sobre múltiplas fontes pode calcular, para cada consulta, uma pontuação de autoridade por fonte a partir de sinais interpretáveis (credenciais, histórico de contribuições, relevância ao tópico), usando essa pontuação para selecionar e balancear quais perspectivas entram na síntese, em vez de deixar a frequência da fonte no corpus dominar o resultado.","imp":"Se você constrói um sistema de busca ou resumo sobre um corpus com múltiplas fontes de autoridade desigual — funcionários de departamentos diferentes, revisores com credenciais distintas, participantes de um fórum técnico —, vale considerar inserir uma etapa explícita de pontuação de autoridade por tópico antes da etapa de síntese, em vez de confiar apenas em similaridade semântica ou frequência de menções; isso reduz o risco de o resumo final refletir apenas quem fala mais, ignorando quem sabe mais sobre aquele tópico específico.","ex":"Um sistema de resumo automático de atas de comitês corporativos que usa apenas recuperação por similaridade tende a repetir a opinião do executivo que fala em toda reunião, enquanto a contribuição de um engenheiro técnico que só se manifestou uma vez sobre o tópico mais relevante fica fora do resumo — exatamente o viés de dominância de falantes frequentes que motivou este paper no domínio parlamentar.","res":"O método de cálculo da autoridade (profissão, educação, intervenções prévias) é descrito apenas em termos gerais no abstract, sem a fórmula ou algoritmo de combinação, então reproduzir a técnica em outro domínio exige reconstruir esse componente do zero. Os ganhos reportados cobrem cobertura de grupos e fidelidade de citação, mas não qualidade de prosa, onde o sistema perdeu para o concorrente — a leitura de que o modelo de autoridade resolve todos os aspectos de qualidade do resumo seria equivocada."},{"p":"2608.13417","ach":"O estudo avaliou sete modelos de fronteira em 36 tarefas de longo horizonte, medindo comportamento por regras em três dimensões: formulação de solução, execução e controle de feedback. Os agentes implementam soluções práticas, mas com desempenho muito instável entre execuções; suas melhores soluções majoritariamente adaptam ou combinam técnicas já conhecidas, e novidade metodológica genuína é rara. A reutilização de experiência entre tarefas às vezes ajuda e às vezes induz o agente a repetir decisões erradas, e o desenho do harness (o conjunto de ferramentas e regras que envolve o agente) afeta a estabilidade dos resultados.","pn":"","pm":"","imp":"Se você usa agentes autônomos para tarefas longas de pesquisa ou engenharia, não confie no escore final de uma única execução para decidir se uma abordagem funciona — a mesma nota pode esconder um agente que falhou na etapa de planejar a solução ou um que falhou na etapa de executá-la, e cada falha exige uma correção diferente. Além disso, antes de deixar o agente reaproveitar 'experiências' de tentativas anteriores, verifique se essa experiência foi rotulada corretamente como sucesso, porque experiência mal rotulada pode levar o agente a repetir o mesmo erro em vez de evitá-lo.","ex":"Nos testes reportados, dois agentes chegaram a pontuações finais parecidas em tarefas de otimização de longo horizonte, mas por caminhos opostos: um gastou a maior parte do tempo corrigindo erros na etapa de execução do código, enquanto o outro já falhava antes disso, na etapa de formular a solução — diferença que só aparece quando se olha o processo passo a passo, não quando se olha apenas o score final da tarefa.","res":"Os resultados vêm de métricas baseadas em regras aplicadas a 36 tarefas e sete modelos específicos; não há evidência de que os mesmos padrões de 'otimização em vez de novidade genuína' se repitam em domínios de tarefa muito diferentes ou com harnesses distintos dos usados no estudo. O paper caracteriza o comportamento dos agentes, mas não oferece um framework nomeado, biblioteca ou ferramenta pronta que o leitor possa instalar e reproduzir diretamente."},{"p":"2608.13547","ach":"Ao repetir exatamente a mesma resposta do modelo através de um parser de transporte adicionado, o sucesso cai de 55,4 a 73,2 pontos percentuais em oito configurações testadas. Divulgar a fronteira ao modelo recupera de 30,4 a 60,7 pontos em seis dessas configurações, e quase nada nas outras duas. Em um caso, uma diferença de escore correspondido de apenas -3,6 pontos escondia -64,3 pontos de dano e +60,7 pontos de recuperação, e a reordenação de modelos ocorre em pelo menos um par entre 26 comparações.","pn":"Confusão geração-transporte em escores de execução","pm":"Quando o escore final combina a geração do comando com uma camada de transporte que serializa, envolve e reanalisa a saída antes da execução, o número observado passa a refletir a configuração inteira da fronteira (contrato de geração, transporte, validador de estado final) e não apenas a capacidade de geração do modelo; divulgar essa fronteira permite que o processo de geração se adapte a ela, de modo que um escore correspondido não é propriedade intrínseca do modelo, mas artefato da configuração de implantação.","imp":"Antes de comparar modelos ou decidir qual usar num agente que emite comandos de shell, teste se o seu próprio pipeline de execução — a camada que serializa, envolve ou reanalisa a saída do modelo antes de rodar o comando — está introduzindo falhas que nada têm a ver com a qualidade da geração; e ao publicar ou revisar um número de sucesso, exija que ele venha acompanhado da descrição do transporte de execução e do ponto de validação final, porque sem isso o número pode inverter silenciosamente qual modelo é melhor.","ex":"No caso do GPT-5.6-sol, a diferença de escore correspondido entre execução crua e com o parser adicionado foi de apenas -3,6 pontos — parecendo irrelevante — mas isso escondia uma queda real de 64,3 pontos causada pelo transporte e uma recuperação de 60,7 pontos quando a fronteira era divulgada ao modelo, ou seja, o comportamento real do modelo variava enormemente segundo uma informação invisível no número agregado.","res":"O experimento usa apenas 56 tarefas de um tiro, de 14 famílias derivadas de incidentes, e um único tipo de falha de transporte injetada deliberadamente (escaping de aspas não tratado); não cobre laços de agente multi-turno nem outras formas de wrapping/serialização, então as magnitudes exatas de dano e recuperação não generalizam para todo pipeline, apenas o método de diagnóstico é portátil."},{"p":"2608.13606","ach":"MobileMem constrói, a partir de um ano de sessões reais de uso de apps móveis, trajetórias sintéticas coerentes e temporalmente consistentes via um pipeline grounded em conhecimento. O benchmark cobre cenários textuais e multimodais exigindo raciocínio multi-hop, atualização de conhecimento e inferência de preferências implícitas, indo além da recuperação de fatos isolados.","pn":"Síntese de trajetórias grounded em conhecimento para memória de longo prazo","pm":"Um pipeline sintetiza sessões heterogêneas de uso em trajetórias temporalmente consistentes e multimodais, permitindo avaliar raciocínio multi-hop, atualização de conhecimento e inferência de preferências implícitas ao longo de um horizonte extenso, em vez de testar apenas recuperação de fatos isolados.","imp":"Se você constrói um assistente pessoal que precisa lembrar interações passadas do usuário em um app ou dispositivo, você pode usar esse benchmark para testar se seu sistema de memória consegue atualizar crenças desatualizadas e inferir preferências que o usuário nunca declarou explicitamente, em vez de assumir que buscar o fato mais recente é suficiente.","ex":"Um assistente de compras que armazenou a preferência de um usuário por restaurantes vegetarianos há seis meses precisa perceber, ao analisar sessões recentes de pedidos de carne, que essa preferência mudou — um caso de atualização de conhecimento e inferência implícita que sistemas baseados em recuperação simples de fatos tendem a errar.","res":"As trajetórias são sintetizadas a partir de sessões reais, não coletadas de deployments de produção completos, então o desempenho medido no benchmark pode não refletir diretamente o comportamento de um sistema de memória rodando ao vivo em um dispositivo com restrições de latência e privacidade. O paper não fornece uma arquitetura de referência pronta para adoção, apenas o instrumento de avaliação."},{"p":"2608.13667","ach":"Em três benchmarks agentic e três LLMs de raciocínio, o framework reduziu o número médio de turnos em todos os nove pares (modelo, benchmark) e reduziu a decodificação da thread principal em seis desses pares, em até 43% (cerca de 20% em média nesses casos), mantendo-a praticamente igual em um sétimo. O Pass@1 não mudou significativamente em sete de nove pares, com as duas diferenças significativas sendo +12,4 e +10,2 pontos. Contra um controle de orçamento equivalente forçado na thread principal, o método obteve Pass@1 estritamente maior com 1,3 a 3,2 vezes menos decodificação sequencial nos quatro cenários aplicáveis.","pn":"Exploração da janela ociosa de raciocínio em agentes","pm":"Enquanto um agente aguarda a resposta do ambiente após executar uma ação, essa janela de espera pode ser preenchida com a decodificação concorrente de ramos de raciocínio auxiliares, que são então mesclados ao fluxo principal quando a observação chega, deslocando raciocínio adicional para fora do caminho sequencial crítico de decodificação.","imp":"Se você opera um agente que alterna entre pensar, agir (chamar uma ferramenta ou API) e observar o resultado, pode aproveitar o tempo em que o agente está bloqueado esperando a resposta da ferramenta para gerar e avaliar hipóteses de raciocínio adicionais em paralelo, sem precisar retreinar nada. Isso permite cortar o número de turnos e o tempo de decodificação sequencial percebido pelo usuário, sem sacrificar a taxa de acerto, desde que sua infraestrutura suporte decodificação concorrente de múltiplos ramos e uma etapa de fusão quando a observação retorna.","ex":"Um agente estilo ReAct que, após decidir fazer uma busca na web ou consultar um banco de dados, fica ocioso aguardando a resposta da chamada externa — nesse intervalo morto, em vez de esperar sem fazer nada, o sistema decodifica em paralelo quatro continuações de raciocínio candidatas, e ao receber a observação escolhe/mescla a mais adequada, evitando gerar esse raciocínio depois, de forma sequencial, no turno seguinte.","res":"O ganho depende de a chamada de ação ter latência comparável ao tempo de decodificação dos ramos auxiliares; se a ferramenta responde quase instantaneamente, não há janela ociosa real para explorar. Os resultados também são desiguais entre configurações: a redução de decodificação apareceu em seis de nove pares e a melhora de acurácia foi estatisticamente significativa em apenas dois de nove, então o benefício de acurácia não deve ser generalizado como garantido — o ganho consistente e mais robusto é a redução de turnos e de decodificação sequencial, não o aumento de Pass@1."},{"p":"2608.13760","ach":"O paper anota 15.282 traços de raciocínio de 15 modelos em 6 benchmarks (texto e visão-linguagem) e mede o Lift Comportamental de cada comportamento anotado. Encontra que treino orientado a raciocínio amplifica fortemente auto-correção, teste de hipóteses e reconhecimento de incerteza (3 a 7 vezes), mas os comportamentos com maior lift real sobre a corretude — calibração de confiança, alinhamento de conhecimento e autoconsciência — são pouco amplificados por esse treino.","pn":"Behavioral Lift (Lift Comportamental)","pm":"Compara a taxa de acerto de um modelo quando um comportamento específico de raciocínio está presente versus ausente no traço, isolando quais comportamentos predizem corretude de forma independente de quanto o treino orientado a raciocínio os amplifica.","imp":"Ao avaliar ou monitorar um modelo de raciocínio em produção, não trate a presença de passos de auto-correção ou de verificação explícita no traço como sinal suficiente de confiabilidade. Meça diretamente se a confiança que o modelo expressa (por exemplo, frases como 'tenho certeza' ou probabilidades declaradas) corresponde à taxa real de acerto, e priorize esse sinal de calibração acima da aparência de deliberação no texto gerado.","ex":"Um assistente que revisa código e exibe longos trechos de 'deixa eu checar de novo essa lógica' pode parecer mais confiável por conta desse comportamento amplificado pelo treino, mas se a confiança que ele declara no final não corresponde à taxa real de acerto (baixa calibração), uma equipe que usa esse tom deliberativo como critério para aprovar merges automáticos está confiando no sinal errado.","res":"O resultado depende da taxonomia e da anotação (parcialmente humana) construída pelos autores para classificar comportamentos nos traços; não existe um classificador aberto e pronto para replicar a medição em outro pipeline sem esforço equivalente. Além disso, Behavioral Lift é uma medida de associação, não de causalidade — o paper não prova que forçar calibração via um novo objetivo de treino feche a lacuna, apenas mostra onde ela existe hoje."},{"p":"2608.13900","ach":"O paper propõe quatro garantias semânticas (atomicidade, consistência, isolamento, durabilidade) mapeadas das propriedades ACID de bancos de dados para agentes LLM de longo horizonte, e as instancia em um agente de dados que combina ciclos de exploração-execução-validação, hubs de habilidades transacionais, validação por divergência de confiança e isolamento por dependência semântica. Em benchmarks de agentes de dados, esse agente superou sistemas do estado da arte, incluindo Claude Code, em 10.6%.","pn":"Ciclo transacional exploração-execução-validação com isolamento semântico","pm":"O sistema decompõe a execução de tarefas longas de um agente em unidades transacionais que passam por fases de exploração, execução e validação, usa a divergência entre a confiança da exploração e a da execução como critério para aceitar ou reverter uma etapa, e isola as dependências semânticas entre subtarefas para permitir reversão localizada de uma etapa sem propagar falhas para etapas que dependem dela.","imp":"Se você está montando um agente que executa múltiplas etapas sobre um ambiente persistente (por exemplo, transformações de dados ou edições de código em sequência), você pode tratar cada etapa como uma transação reversível: gerar uma exploração/plano, executá-la, e só confirmar o resultado se a confiança da execução não divergir muito da confiança estimada na exploração; se divergir ou falhar, você reverte apenas essa etapa, sem desfazer o trabalho de etapas anteriores que não dependem semanticamente dela.","ex":"Um agente que gera e executa pipelines de transformação de dados sobre um data warehouse: se uma etapa de transformação corrompe uma tabela intermediária usada por etapas seguintes, o isolamento por dependência semântica limita o dano a essa etapa, permitindo reverter só a transformação problemática em vez de reprocessar todo o pipeline.","res":"O framework foi validado em um único agente voltado a tarefas de dados sobre benchmarks específicos; não há evidência de que os mesmos ganhos se transfiram para agentes de codificação geral, navegação web ou uso de ferramentas físicas. Além disso, os componentes citados (hubs de habilidades transacionais, cálculo exato da divergência de confiança) não são liberados como biblioteca aberta nem descritos com detalhamento suficiente para reprodução exata, então a adoção prática exige reimplementar essas peças a partir de uma descrição de alto nível."},{"p":"2608.14036","ach":"Em experimentos controlados com 8.135 registros normalizados e 238 rótulos válidos de análise de trajetória, skills superam Workflow Memory por 6,06 pontos em comparações pareadas. Ancoragem procedural explica 65,7% dos casos de sucesso com skills, contra apenas 4,5% atribuíveis a injeção explícita de conhecimento. À medida que o pool de skills cresce de 5 para 100, a precisão de uso real cai de 29,6% para 3,3%, e distratores confusíveis prejudicam a identificação offline sem degradar o sucesso downstream de forma equivalente.","pn":"","pm":"","imp":"Se você mantém uma biblioteca de skills ou ferramentas para um agente, pare de medir qualidade só pela precisão de recuperação (o quanto o agente 'acerta' a skill exata) — meça sucesso na tarefa final, porque skills parecidas mas erradas frequentemente ainda funcionam. Ao escalar o número de skills disponíveis, espere que a recuperação piore drasticamente e priorize curadoria ou reranqueamento antes de simplesmente adicionar mais skills; e ao desenhar novas skills, escreva-as como sequências de passos que estabilizam a execução, não como bases de fatos, porque é isso que realmente reduz falhas.","ex":"Um agente de coding com biblioteca de skills para depuração: quando o pool passa de 5 para 100 skills catalogadas, o agente passa a invocar a skill 'errada' com muito mais frequência (precisão cai para 3,3%), mas se a skill recuperada for uma variante procedural similar de 'corrigir teste falho', a tarefa ainda é concluída com sucesso porque a estrutura de passos, não o conteúdo factual exato, é o que estabiliza a execução.","res":"Os números específicos (6,06 pontos, 65,7% vs 4,5%, 29,6% para 3,3%) vêm de benchmarks, harnesses e modelos particulares testados pelos autores e podem não se transferir diretamente para outras arquiteturas de agente ou formatos de skill. A taxonomia de doze modos de uso foi construída por codificação aberta de 240 registros, o que introduz subjetividade de categorização; a relação entre ancoragem procedural e sucesso é correlacional dentro do desenho experimental, não uma prova causal isolada de outros fatores do harness."},{"p":"2608.14106","ach":"Ao prever retornos horários de 1.000 ações dos EUA, os modelos avaliados produzem previsões quase planas com correlação cross-sectional baixa, fenômeno chamado forecast collapse; o mesmo não ocorre ao prever volume de negociação sob a mesma configuração. Testado em modelos de séries temporais de fundação, doze modelos de deep learning e 97 configurações de benchmark, o colapso está associado à baixa previsibilidade do alvo e ao uso de objetivos por-série; o objetivo proposto CalibRank quase triplica a correlação cross-sectional no conjunto Finance1K mantendo a amplitude das previsões próxima do valor real.","pn":"Trade-off calibração-ranking em previsão multi-série","pm":"Quando a previsibilidade do alvo é baixa, otimizar erro quadrático por série produz previsões achatadas com baixa correlação cross-sectional porque o objetivo não identifica a estrutura entre séries, enquanto otimizar diretamente a correlação cross-sectional recupera o ranking mas pode inflar a amplitude das previsões; isso expõe que métricas de erro calculadas por série podem ocultar falhas de estrutura cross-série necessárias para decisões que comparam várias séries entre si.","imp":"Se você usa um modelo de séries temporais pronto para gerar previsões sobre várias ações, sensores ou unidades ao mesmo tempo, não valide o modelo só pelo erro médio por série (como MSE); calcule também a correlação entre as previsões e os valores reais entre as unidades no mesmo instante de tempo, porque um modelo pode ter erro baixo por série e ainda assim dar previsões quase idênticas entre as unidades, tornando qualquer ranking ou comparação entre elas inútil.","ex":"Um sistema de trading que usa um modelo de séries temporais de fundação para prever retornos horários de 1.000 ações pode reportar erro quadrático baixo por ação, parecendo bem calibrado, mas suas previsões podem ser quase iguais entre as ações naquele instante; ao tentar ranquear quais ações comprar ou vender com base nessas previsões, o sinal é inútil, e esse defeito só aparece ao medir a correlação cross-sectional, não ao olhar o erro por série isoladamente.","res":"O fenômeno é mais forte quando o alvo tem baixa previsibilidade (como retornos financeiros) e praticamente desaparece para alvos mais previsíveis (como volume), então a checagem de correlação cross-sectional é mais útil nesse regime específico. Além disso, o padrão passa apenas parcialmente para quem não treina modelos: o diagnóstico via correlação cross-sectional é aplicável a qualquer modelo pronto, mas a correção proposta (o objetivo CalibRank) exige re-treinar ou ajustar o modelo, o que não está disponível para quem apenas consome previsões de um modelo já treinado."},{"p":"2608.14391","ach":"RA-Bench reúne 17.886 vídeos (1.830 âncoras reais e 16.056 clipes gerados por nove geradores) e mostra que nenhum dos três tipos de detector avaliado — tradicionais, MLLMs zero-shot, MLLMs ajustados especificamente para essa detecção — generaliza de forma consistente entre as instâncias do benchmark. Vídeos que enganam observadores humanos também são os mais difíceis para os detectores, e a disseminação social (recompressão, republicação) reduz ainda mais a confiabilidade da detecção.","pn":"Avaliação de detecção ancorada em conteúdo real com disseminação social simulada","pm":"Compara amostras sintéticas com âncoras reais pareadas por categoria de risco social, variando condições de geração (qualidade, condicionamento, semente) e aplicando transformações de redistribuição social para medir a degradação de desempenho de detectores fora de condições controladas.","imp":"Se seu produto depende de um detector de conteúdo sintético (fine-tuned ou um MLLM usado em modo zero-shot) para bloquear vídeos manipulados antes que circulem, não confie no número de acurácia medido sobre o arquivo original: teste o mesmo detector depois de simular o caminho que o vídeo percorre nas redes (recompressão, reupload, mudança de resolução), porque é exatamente nesse ponto que a taxa de erro sobe e coincide com os casos em que humanos também são enganados.","ex":"Uma equipe de confiança e segurança que roda um classificador de vídeo sintético na ingestão de uploads de uma rede social vê o detector funcionar bem no vídeo enviado diretamente, mas falhar quando o mesmo vídeo é baixado, recomprimido e reenviado por um usuário em outra plataforma — o cenário de disseminação social descrito no paper, onde a degradação de qualidade some com os artefatos que o detector usava como sinal.","res":"Os nove geradores usados (quatro abertos, cinco fechados) refletem o estado da arte no momento da coleta; novos geradores lançados depois podem produzir artefatos diferentes dos capturados no benchmark. O paper não deixa claro se o RA-Bench e os pesos dos detectores fine-tuned são publicamente reprodutíveis, e a técnica de simulação de disseminação social foi validada apenas para vídeo, não para áudio ou imagem estática."},{"p":"2608.14441","ach":"PACE-Bench avalia dez métodos self-evolving de quatro paradigmas em 144 pares de adaptação de código entre um ambiente físico fonte e um ambiente físico alvo mutado. Reflexion combinado com Qwen3-14B resolve apenas 35,9% dos pares do benchmark completo, enquanto GPT-5.5 resolve 66,7% do subconjunto de Estática sob orçamento total de tentativas. Revelar explicitamente qual grandeza física mudou não elevou o teto de desempenho, indicando que o obstáculo principal é redesenhar o mecanismo, não inferir o novo valor de um parâmetro.","pn":"Feedback grounded em execução supera auto-revisão não verificada em adaptação de código","pm":"Quando um agente precisa reescrever um design de código após uma mudança no ambiente, validar as tentativas contra a execução real do simulador produz correções mais confiáveis do que revisar o código apenas com julgamento próprio; acumular memória das tentativas anteriores tende a ancorar o agente ao design antigo em vez de facilitar o redesenho, e busca em árvore ampla explora variações sem convergir quando o problema exige mudança estrutural do mecanismo em vez de simples ajuste de parâmetro.","imp":"Se você constrói um agente que precisa se readaptar quando o ambiente de execução muda — por exemplo, quando uma API externa altera seu comportamento ou um serviço muda de contrato — dê prioridade a métodos que testam cada tentativa de correção executando-a de fato contra o novo ambiente, em vez de deixar o agente apenas 'pensar' sobre o próprio erro sem rodar nada. Também vale desconfiar da ideia de que acumular histórico de tentativas anteriores no prompt do agente sempre ajuda: nos casos observados isso prendeu o agente a repetir o design antigo com pequenos ajustes, em vez de reconstruir a solução do zero quando a reconstrução era o que o problema exigia.","ex":"No subconjunto de Estática do benchmark, quando a redistribuição de massa em uma alavanca exige um novo ponto de apoio (mudança estrutural, não numérica), agentes com memória das tentativas da fonte reaplicam o design antigo com ajustes finos e falham repetidamente, enquanto agentes com busca em árvore ampla geram muitas variações sem nunca convergir para o novo mecanismo correto dentro do orçamento de tentativas.","res":"Os resultados vêm de seis domínios de física simulada com mutações controladas pelos próprios autores; não há evidência de que a mesma ordem de mérito entre paradigmas (reflection grounded > memória > busca em árvore) se mantenha em tarefas de adaptação de código fora de simulação física, como mudança de schema de dados ou de contrato de API. Mesmo o método mais forte testado resolve só dois terços do subconjunto mais fácil, então nenhum dos métodos comparados deve ser lido como solução pronta para adotar, apenas como indicação de qual princípio de feedback priorizar."},{"p":"2608.14577","ach":"HarmProfile reúne mais de 80.000 artefatos nocivos validados, extraídos de 23 modelos de fronteira de 13 famílias, organizados em 15 categorias e 57 subcategorias de dano. Os autores mostram que todos os modelos testados produzem conteúdo nocivo em escala e que tanto a severidade quanto a diversidade desse conteúdo aumentam com a capacidade do modelo, mesmo quando os testes de segurança padrão sugerem que ele é seguro.","pn":"Perfil de risco por distribuição de conteúdo nocivo","pm":"O risco de segurança de um modelo é caracterizado a partir de um corpus de suas próprias saídas nocivas — analisando conteúdo, severidade e diversidade dessas falhas — em vez de reduzir a avaliação de segurança a uma taxa binária de sucesso ou falha de ataque.","imp":"Se você decide qual modelo de fronteira adotar em produção, não deve confiar apenas em uma pontuação agregada de segurança para concluir que o risco é baixo; ao avaliar modelos mais capazes, é preciso investigar também que tipos de conteúdo nocivo eles ainda conseguem gerar sob provocação e quão variados esses conteúdos são, porque um modelo pode passar bem em testes padrão e ainda assim guardar conhecimento perigoso mais amplo do que um modelo anterior menos capaz.","ex":"Ao submeter um modelo de fronteira recente a prompts adversariais cobrindo as 57 subcategorias de dano do HarmProfile — como fabricação de armas ou fraude financeira — os autores observam respostas nocivas com maior variedade de fraseamento e detalhe do que em um modelo de gerações anteriores, ainda que ambos apresentem notas semelhantes em benchmarks agregados de toxicidade.","res":"O corpus foi construído sob elicitação adversarial deliberada e curadoria dos autores, então as taxas e a diversidade observadas não descrevem o comportamento do modelo em uso comum sem ataque; a correlação entre capacidade e risco reportada é observacional, não causal, e não se sabe se ela se mantém igual em todas as 15 categorias de dano ou apenas nas mais estudadas."},{"p":"2608.14606","ach":"Em 37 modelos condicionados a perfis reais de 263 respondentes lituanos, os LLMs reproduzem a direção qualitativa das relações psicométricas humanas, mas um baseline de cópula gaussiana supera todos os LLMs nos componentes de similaridade amostral; a similaridade entre LLMs (0.73) é maior que entre LLMs e humanos. Todos os modelos mostram forte deslocamento de aquiescência (+0.84 DP), regressores treinados em dados sintéticos perdem validade preditiva em humanos retidos (R² médio -0.18 vs 0.28), e os modelos fabricam efeitos indiretos em 3 de 10 caminhos de mediação placebo.","pn":"Auditoria psicométrica de dados sintéticos (PSS)","pm":"A qualidade de respostas sintéticas geradas por um modelo é avaliada comparando distribuição conjunta, estrutura latente, confiabilidade e caminhos de mediação com dados reais e com baselines estatísticos não neurais, em vez de julgar apenas a plausibilidade de respostas individuais.","imp":"Se você usa LLMs para gerar respondentes sintéticos de pesquisa (para pré-testar instrumentos, treinar classificadores ou simular populações), não trate esses dados como substituto direto de dados humanos: antes de usar downstream, verifique se a distribuição conjunta e a confiabilidade das subescalas se mantêm, teste explicitamente por viés de concordância sistemática (tendência do modelo de responder positivamente em excesso) e valide qualquer modelo preditivo treinado nos dados sintéticos contra uma amostra humana real antes de confiar nele.","ex":"Uma equipe de RH que usa um LLM para simular respostas ao questionário de engajamento UWES-17 antes de rodar a pesquisa real treina um modelo preditivo de bem-estar nessas respostas sintéticas; ao aplicar esse modelo a funcionários reais, o R² cai para negativo, e testes de mediação placebo mostram o LLM inventando um caminho causal entre cargo e engajamento via carga de trabalho que não existe nos dados humanos reais.","res":"Os números vêm de um único domínio (psicologia organizacional, escalas Dunham/UWES/Koopmans, n=263) e podem não generalizar para outros tipos de pesquisa, como opinião política ou satisfação de consumo, sem auditoria própria. O padrão passou apenas parcialmente: a direção qualitativa das relações psicométricas é preservada, mas a estrutura quantitativa (distribuição conjunta, confiabilidade, mediação) não é — leitura errada seria concluir que LLMs são inúteis para qualquer simulação, quando o achado é mais específico: eles falham em replicar a estrutura fina, não a tendência geral."},{"p":"2608.14614","ach":"O paper reporta a construção física de um cluster de 128 GPUs V100 de segunda mão, operado por um ano, com custo de capital de $22K contra $600K para um sistema de 8 GPUs B200. Otimizações de paralelismo de pipeline permitiram throughput competitivo para LLaMA-70B. Sob intensidade de carbono média da rede elétrica, o sistema produz cerca de 4x mais emissões por token para modelos de 8B e mais de 40x para modelos de 70B, comparado a hardware atual.","pn":"Viabilidade condicional de hardware reciclado por energia local","pm":"Aceleradores mais antigos consomem mais energia por token gerado, de modo que seu custo total de propriedade e sua pegada de carbono só ficam favoráveis a preços de eletricidade baixos e matriz energética pouco intensiva em carbono na região de operação.","imp":"Antes de migrar inferência para hardware reciclado por causa do custo de capital, você precisa calcular o consumo de energia por token desse hardware antigo e cruzar isso com o preço da eletricidade e a intensidade de carbono da rede na região onde vai operar - a economia inicial pode ser anulada pelo custo operacional de energia e pela pegada de carbono se a região não tiver eletricidade barata e limpa.","ex":"Um time que decide comprar 128 GPUs V100 usadas para servir LLaMA-70B em vez de um cluster B200 novo, pagando $22K em vez de $600K, mas ao operar sob a matriz elétrica média da rede descobre que cada token gerado carrega até 40x mais carbono do que teria com hardware atual - a economia de capital vem com um custo ambiental oculto que só se paga em locais de energia barata e limpa.","res":"Os fatores de custo e carbono relatados (aproximadamente 4x e 40x) foram medidos numa instalação particular de 128 GPUs V100 com otimizações de pipeline-parallel específicas para essa configuração e não generalizam automaticamente para outras gerações de GPU, outros tamanhos de modelo ou outras topologias de cluster; o paper não fornece código nem uma receita replicável de construção, apenas os números obtidos nesse experimento específico."},{"p":"2608.14639","ach":"Em 13.859 campos extraídos de 800 recibos CORD por claude-sonnet-5 (49,0% de acurácia), a calibração ingênua de limiares de aceite mostra efeito de desenho por agrupamento de documento de 1,84–2,45, vazamento por reajuste do score com cobertura 0,416 e risco realizado 0,127 (violando alpha=0,10 em 95% dos splits), e uma patologia de empates que colapsa a grade de limiares de 0,030 para 0,001. Mesmo o protocolo corrigido de split (fit/val) reporta risco médio 0,096 dentro do orçamento de 0,10, mas o risco realizado excede o orçamento em 47,5% das re-amostragens.","pn":"Escada de validade para risco seletivo por campo","pm":"A calibração de um limiar de aceitação/rejeição para saídas de extração é organizada em camadas com garantias estatísticas crescentes — i.i.d. por campo, corrigida por cluster de documento, i.i.d. por documento — e cada camada só certifica o risco real quando a estrutura de dependência dos dados e a separação entre ajuste e validação do score são respeitadas; do contrário, a cobertura reportada é uma média sobre repetições e não um certificado válido por execução.","imp":"Se você calibra um limiar de confiança para aceitar ou mandar para revisão humana campos extraídos automaticamente de documentos (notas fiscais, formulários, contratos), não pode tratar cada campo como amostra independente: é preciso corrigir a amostra efetiva pelo número de documentos, usar conjuntos separados para ajustar o score e para validar o limiar, e checar se o score de confiança tem muitos valores empatados antes de confiar na taxa de erro reportada — um número de risco 'em média' não é o mesmo que uma garantia para o seu lote de produção.","ex":"No pipeline de extração de recibos CORD com claude-sonnet-5, um sistema calibrado pelo protocolo padrão de split relatava risco de 0,096 abaixo do orçamento de 10%, mas ao refazer a divisão dos dados 47,5% das vezes o risco real superava os 10% — o time que confiasse no número único estaria aprovando automaticamente um lote com erro acima do prometido quase metade das vezes.","res":"A única camada estatisticamente válida por documento (correção de cluster com Mondrian Learn-then-Test) entrega cobertura de apenas 0,060, quase inutilizável em produção, e a vantagem do agrupamento por proveniência de campo sobre o score aprendido, que venceu com significância no corpus sonnet, não se repetiu quando os mesmos documentos foram processados por haiku ou qwen — a escolha de qual método de agrupamento é melhor não generaliza entre modelos extratores nem entre corpora de acurácia mais alta."},{"p":"2608.14905","ach":"Avaliando 8 combinações harness-modelo em 100 tarefas de pesquisa científica real cobrindo todo o ciclo de vida (ideação, busca, execução, análise, escrita, revisão), os autores identificaram 45 padrões de falha organizados em ARFT. Esses padrões se repetem de forma consistente em todas as 8 combinações testadas, inclusive nos modelos mais fortes avaliados.","pn":"Déficit de loop metacognitivo em agentes autônomos","pm":"Padrões de falha em agentes que executam tarefas longas convergem numa incapacidade de verificar o produto contra a evidência coletada, revisar quando a checagem falha e questionar a validade do caminho seguido, e esse déficit persiste igualmente através de diferentes scaffolds de orquestração, o que localiza a causa no modelo subjacente e não na engenharia do harness.","imp":"Se você monta um agente para conduzir tarefas de pesquisa de ponta a ponta (buscar literatura, sintetizar achados, redigir conclusões), não conte com a troca do framework de orquestração para resolver inconsistências entre o que o agente encontrou e o que ele escreveu — como o problema aparece igualmente em modelos de ponta e scaffolds diferentes, a correção provavelmente exige checagens explícitas de consistência inseridas manualmente no pipeline, e não apenas um prompt ou orquestrador mais sofisticado.","ex":"Em tarefas onde o agente busca artigos científicos, formula uma hipótese e depois escreve uma seção de análise, os autores observaram que as conclusões escritas frequentemente contradiziam os dados recuperados na etapa de busca — e esse tipo de falha reapareceu nas 8 combinações harness-modelo testadas, sem que nenhuma delas disparasse uma auto-revisão que corrigisse a inconsistência antes da entrega final.","res":"O estudo não testa se intervenções no nível de orquestração (scaffolds diferentes, prompts de auto-checagem mais elaborados) conseguiriam mitigar o déficit — os próprios autores deixam isso como questão aberta. Além disso, as 100 tarefas e a taxonomia são específicas do domínio de pesquisa científica automatizada; não há evidência direta de que os mesmos 45 padrões se transfiram sem adaptação par
